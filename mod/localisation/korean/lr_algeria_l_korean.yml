l_korean:
 LR_tt_crisis_abandon:0 "알제리에서 군대를 철수합니다. 알제리는 §Y비무장지대§!로 남습니다.\n§R장교단의 분노가 쌓입니다.§! 약 45일 뒤 쿠데타가 시작되고, 파리 수비대와 튈르리의 결판이 차례로 이어집니다. 그동안 §Y장교들의 음모§! 결단으로 누가 왕관을 쥘지 기울일 수 있습니다."
 LR_tt_crisis_crush:0 "알제리에 원정군을 보냅니다. 알제리는 반란이 끝날 때까지 §Y비무장지대§!입니다.\n§R파리가 끓어오릅니다.§! 약 100일 뒤 혁명이 일어나고, 선거전과 총선이 날짜에 따라 이어집니다. 그동안 §Y혁명의 거리§! 결단으로 누가 혁명을 쥘지 기울일 수 있습니다."
 LR_tt_algeria_open:0 "알제리가 §Y비무장지대§!로 남아 있고, 진압 작전이 진행 중이지 않아야 합니다."
 LR_tt_algeria_campaigning:0 "§Y알제리 진압 작전§!이 끝나야 합니다."
 LR_tt_algeria_campaign:0 "§Y알제리 진압 작전§!이 시작됩니다. 몇 달에 걸친 사건을 거쳐 반란을 끝내면, 알제리의 §Y비무장지대§!가 해제되고 본토 편입이 결정됩니다."
 LR_tt_algeria_pacify:0 "알제리 4개 주의 §Y비무장지대§!가 해제되고, 국민정신 §R알제리 위기§!가 사라집니다. 알제리를 본토로 편입하는 결정이 이어집니다."
 LR_tt_algeria_pacified:0 "§Y알제리 진압 작전§!으로 반란을 끝내야 합니다."
 LR_tt_algeria_next:0 "진압 작전이 다음 국면으로 넘어갑니다."
 LR_tt_algeria_dmz:0 "알제리 4개 주가 §Y비무장지대§!가 됩니다. 반란이 진압될 때까지 그곳에는 군대를 주둔시킬 수도, 요새를 지을 수도 없습니다."
 lr_algeria.1.t:0 "카스바의 골목"
 lr_algeria.1.d:0 "제3알제리보병연대 앙리 마송 대위는 카스바 입구 계단에 앉아 수통의 물을 아껴 마셨다. 상륙한 지 스물닷새째였다. 항구와 총독부는 첫 주에 되찾았다. 카스바에는 아직 한 발짝도 들어가지 못했다.\n\n골목은 어깨 두 개 너비였다. 계단과 아치와 막다른 길이 벌집처럼 얽혀 있었고, 지붕 위로 빨래와 초록 깃발이 같이 널려 있었다. 어제 정찰조 넷이 그 안으로 들어갔다. 둘이 돌아왔다. 오늘 아침 같은 골목에 다시 가 보니 탄피 하나 없었다.\n\n오후에 연대장이 대위들을 불렀다. 사령부에서 두 가지 안을 올리라고 했다는 것이다. 하나는 카스바를 봉쇄하고 집집마다 문을 따는 것. 다른 하나는 모스크의 이맘들과 마주 앉아 무기를 내려놓는 자를 사면하는 것.\n\n마송은 둘 다 해 본 적이 없었다. 연대장이 그를 보며 의견을 물었다. 그는 계단 위쪽 창문에서 아이 하나가 자기들을 내려다보고 있다고만 대답했다. 아이는 대위가 고개를 들자 창문을 닫았다."
 lr_algeria.1.a:0 "문을 하나씩 딴다. 골목 하나하나 되찾아."
 lr_algeria.1.b:0 "이맘들을 불러. 총을 내려놓으면 묻지 않는다."
 lr_algeria.2.t:0 "아틀라스의 마지막 불"
 lr_algeria.2.d:0 "산악병 대대장 루이 페랑 소령은 블리다의 전방 지휘소에서 망원경을 내렸다. 카스바가 조용해지자 반란군은 남쪽 아틀라스로 물러났다. 눈 덮인 봉우리와 삼나무 숲이었다. 로마 군단도 오스만의 예니체리도 이 산을 끝내 다 갖지 못했다.\n\n밤이면 봉우리마다 봉화가 올랐다. 정찰기가 매주 그 불을 세어 보고했다. 지난주 예순, 이번 주 마흔하나. 줄고는 있었다. 그러나 페랑은 숫자보다 불이 오르는 순서를 보았다. 동쪽부터 하나씩, 정확히 십 분 간격이었다. 누군가 아직 저 산을 지휘하고 있었다.\n\n참모들은 두 가지 안을 내놓았다. 첫눈이 오기 전에 산으로 올라가는 것. 아니면 산 아래 부족장들에게 사람을 보내 그 집 아들들을 산에서 내려오게 하는 것. 부족장 하나는 이미 지휘소에 양 한 마리를 선물로 보내왔다. 메시지는 없었다.\n\n페랑은 그 양을 부엌에 넘기지 않고 지휘소 뒤에 묶어 두었다. 결정이 나기 전에 잡아먹으면 대답을 한 셈이 될 것 같았다."
 lr_algeria.2.a:0 "산으로 간다. 마지막 불이 꺼질 때까지."
 lr_algeria.2.b:0 "부족장들에게 양 값을 치르고, 아들들을 집으로 보내라고 해."
 lr_algeria.3.t:0 "지중해 건너의 평화"
 lr_algeria.3.d:0 "블리다 헌병 초소의 아메드 벤살렘 하사는 그날 아침 초소 문을 열다가 그대로 굳었다. 마당 한가운데 남자 하나가 서 있었다. 아틀라스의 반란군 지도자였다. 수배 전단에서 백 번은 본 얼굴이었다.\n\n남자는 소총을 땅에 내려놓고 뒤로 세 걸음 물러섰다. 그리고 하사에게 아랍어로 물었다. 담배가 있느냐고. 벤살렘은 주머니에서 한 개비를 꺼내 불까지 붙여 주었다. 초소장이 뛰어나와 수갑을 찾았다. 벤살렘이 그 손을 붙잡았다. 남자는 끝까지 고개를 숙이지 않았고, 아무도 그에게 수갑을 채우지 않았다.\n\n열흘 뒤 알제 항구에 수송선이 줄지어 들어왔다. 이번에는 병사가 아니라 밀가루와 시멘트와 교과서였다. 카스바 골목에서 아이들이 다시 공을 찼다.\n\n벤살렘은 그 무렵 휴가를 받아 고향 마을에 갔다. 아버지가 물었다. 이제 우리는 프랑스 사람이냐, 아니면 여전히 프랑스의 무엇이냐. 하사는 대답하지 못했다. 그 질문은 파리의 책상 위에도 똑같이 놓여 있었다."
 lr_algeria.3.a:0 "총성은 멎었다. 이제 다른 걸로 이 땅을 붙잡는다."
