l_korean:
 LR_tt_crisis_abandon:0 "알제리에서 군대를 철수합니다. 알제리는 §Y비무장지대§!로 남습니다.\n§R장교단의 분노가 쌓입니다.§! 약 45일 뒤 쿠데타가 시작되고, 파리 수비대와 튈르리의 결판이 차례로 이어집니다. 그동안 §Y장교들의 음모§! 결단으로 누가 왕관을 쥘지 기울일 수 있습니다."
 LR_tt_crisis_crush:0 "알제리에 원정군을 보냅니다. 알제리는 반란이 끝날 때까지 §Y비무장지대§!입니다.\n§R파리가 끓어오릅니다.§! 약 100일 뒤 혁명이 일어나고, 선거전과 총선이 날짜에 따라 이어집니다. 그동안 §Y혁명의 거리§! 결단으로 누가 혁명을 쥘지 기울일 수 있습니다."
 LR_tt_algeria_open:0 "알제리가 §Y비무장지대§!로 남아 있고, 진압 작전이 진행 중이지 않아야 합니다."
 LR_tt_algeria_campaigning:0 "§Y알제리 진압 작전§!이 끝나야 합니다."
 LR_tt_algeria_campaign:0 "§Y알제리 진압 작전§!이 시작됩니다. 몇 달에 걸친 사건을 거쳐 반란을 끝내면, 알제리의 §Y비무장지대§!가 해제되고 본토 편입이 결정됩니다."
 LR_tt_algeria_pacify:0 "알제리 4개 주의 §Y비무장지대§!가 해제되고, 국민정신 §R알제리 위기§!가 사라집니다. 알제리를 본토로 편입하는 결정이 이어집니다."
 LR_tt_algeria_pacified:0 "§Y알제리 진압 작전§!으로 반란을 끝내야 합니다."
 LR_tt_algeria_next:0 "진압 작전이 다음 국면으로 넘어갑니다."
 LR_tt_algeria_dmz:0 "알제리 4개 주가 §Y비무장지대§!가 됩니다. 반란이 진압될 때까지 그곳에는 군대를 주둔시킬 수도, 요새를 지을 수도 없습니다."
 lr_algeria.1.t:0 "카스바의 골목"
 lr_algeria.1.d:0 "알제, 카스바. 하얀 회벽의 골목은 어깨 두 개 너비밖에 되지 않는다. 계단과 아치와 막다른 길이 벌집처럼 얽혀 있고, 그 지붕 위로는 빨래와 초록 깃발이 함께 나부낀다.\n\n상륙한 지 스무닷새. 항구와 관청은 되찾았지만 카스바에는 들어가지 못했다. 골목 하나를 지나면 총알이 날아오고, 다음 날 그 골목에는 아무도 없다.\n\n연대장이 사령부에 두 가지 안을 올린다. 카스바를 봉쇄하고 집집마다 수색할 것인가. 아니면 이맘들과 마주 앉아 사면을 약속할 것인가."
 lr_algeria.1.a:0 "봉쇄하고 수색한다. 골목 하나하나를 되찾는다."
 lr_algeria.1.b:0 "이맘들과 마주 앉는다. 무기를 내려놓는 자는 사면한다."
 lr_algeria.2.t:0 "아틀라스의 마지막 불"
 lr_algeria.2.d:0 "카스바가 조용해지자 반란군은 남쪽으로 물러났다. 아틀라스산맥, 눈 덮인 봉우리와 삼나무 숲. 로마 군단도, 오스만의 예니체리도 이 산을 끝내 다 정복하지 못했다.\n\n밤이면 봉우리마다 봉화가 오른다. 반란군의 신호다. 정찰기가 그 불을 세어 보고한다. 마흔하나. 지난주에는 예순이었다.\n\n산악 부대장이 지도를 펼친다. 겨울이 오기 전에 산으로 올라갈 것인가. 아니면 산 아래 부족장들에게 사람을 보내, 그들의 아들들이 산에서 내려오게 할 것인가."
 lr_algeria.2.a:0 "산으로 올라간다. 봉화가 꺼질 때까지."
 lr_algeria.2.b:0 "부족장들에게 사람을 보낸다. 아들들을 집으로 돌려보내라."
 lr_algeria.3.t:0 "지중해 건너의 평화"
 lr_algeria.3.d:0 "마지막 봉화가 꺼진 지 열흘. 아틀라스의 반란군 지도자가 산을 내려와 블리다의 작은 헌병 초소에서 소총을 내려놓았다. 그는 끝까지 고개를 숙이지 않았고, 초소의 병사들도 그에게 수갑을 채우지 않았다.\n\n알제 항구에 수송선이 다시 줄지어 들어온다. 이번에는 병사가 아니라 밀가루와 시멘트와 교과서를 싣고 왔다. 카스바의 골목에서 아이들이 다시 공을 찬다.\n\n총독부 지붕의 삼색기가 지중해의 바람에 펄럭인다. 반란은 끝났다. 이제 남은 질문은 하나다. 이 땅은 식민지인가, 프랑스인가."
 lr_algeria.3.a:0 "알제리에 평화가 왔다. 군대를 다시 들인다."
