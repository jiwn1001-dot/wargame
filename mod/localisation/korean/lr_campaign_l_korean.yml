l_korean:
 LR_FRA_campaign_category:0 "선거 운동"
 LR_FRA_campaign_category_desc:0 "지도 위의 핀을 눌러 그 지역에서 유세하고, 오른쪽 목록에서 신문 광고를 냅니다. 매달 행동 4번을 쓸 수 있습니다. 총선 의석은 지역별 지지율에 그 지역 의석수를 곱해 정합니다."
 LR_ui_campaign_title:0 "선거 운동 본부"
 LR_ui_campaign_actions:0 "이번 달 남은 행동 §Y[?FRA.LR_campaign_actions|0]§!/4   다음 총선까지 [?FRA.LR_election_clock|0]/24개월"
