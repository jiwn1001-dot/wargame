 LR_ui_pk_new:0 "어음 발행 (10)"
 LR_ui_pk_new_tt:0 "발행 비용 10을 내고 SEM 어음을 찍습니다. 감사관이 장부를 펼칩니다.\n\n필요: 자금 10 이상, 이번 달 남은 발행 1 이상. 발행 횟수는 매달 1일에 3번으로 돌아옵니다."
 LR_ui_pk_check:0 "넘기기"
 LR_ui_pk_check_tt:0 "어음을 더 찍지 않고 감사관이 장부를 넘기는 것을 지켜봅니다."
 LR_ui_pk_bet:0 "추가 발행 (20)"
 LR_ui_pk_bet_tt:0 "어음을 20만큼 더 찍습니다. 감사관은 따라 조사를 넓히거나, 패가 나쁘면 조사를 접을 수도 있습니다.\n\n필요: 자금 20 이상."
 LR_ui_pk_fold:0 "발행 철회"
 LR_ui_pk_fold_tt:0 "들킬 것 같으면 어음을 거둬들입니다. 이미 찍은 어음 값은 잃습니다."
