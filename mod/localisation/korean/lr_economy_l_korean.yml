 LR_pk_res_1:0 "§G감사관이 속았습니다. 어음이 할인되어 자금이 들어옵니다.§!"
 LR_pk_res_2:0 "§R감사관이 장부의 구멍을 찾았습니다. 어음이 회수됩니다.§!"
