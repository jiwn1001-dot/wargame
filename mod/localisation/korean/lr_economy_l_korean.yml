 LR_dec_rebuild_synthetic_fuel:0 "합성 연료 공장"
 LR_dec_rebuild_synthetic_fuel_desc:0 "§Y$STATE_32$§!에 합성 연료 공장을 짓습니다. 석유 없는 프랑스의 숨통입니다. 결정하고 §Y150일§! 뒤 완공됩니다. 경제 재건 +2."
 LR_dec_rebuild_nord_mines:0 "북부 탄광 현대화"
 LR_dec_rebuild_nord_mines_desc:0 "§Y$STATE_29$§!의 탄광에 새 승강기와 세척장을 들입니다. 철강 +8. 결정하고 §Y90일§! 뒤 완공됩니다. 경제 재건 +2."
 LR_dec_rebuild_rhone_hydro:0 "론강 수력 발전"
 LR_dec_rebuild_rhone_hydro_desc:0 "§Y$STATE_20$§!에 댐을 세우고 민간 공장 3개를 짓습니다. 결정하고 §Y180일§! 뒤 완공됩니다. 경제 재건 +4."
 LR_dec_rebuild_farm_machines:0 "농업 기계화"
 LR_dec_rebuild_farm_machines_desc:0 "트랙터와 비료 공장으로 농촌의 일손을 덜어 공장으로 보냅니다. §Y$STATE_24$§!에 민간 공장 1개, 인력 +20000. 결정하고 §Y90일§! 뒤 완공됩니다. 경제 재건 +3."
 LR_dec_rebuild_atlantic_port:0 "대서양 상업항"
 LR_dec_rebuild_atlantic_port_desc:0 "브레스트와 보르도의 부두를 넓힙니다. 두 주의 기반 시설 +1, §Y$STATE_19$§!에 민간 공장 1개. 결정하고 §Y120일§! 뒤 완공됩니다. 경제 재건 +3."
 LR_dec_rebuild_telephone:0 "전국 전화망"
 LR_dec_rebuild_telephone_desc:0 "파리, 릴, 마르세유, 리옹을 장거리 전화로 잇습니다. 네 주의 기반 시설 +1. 결정하고 §Y120일§! 뒤 완공됩니다. 경제 재건 +3."
 LR_dec_rebuild_african_rail:0 "북아프리카 철도"
 LR_dec_rebuild_african_rail_desc:0 "튀니지와 모로코를 잇는 철도를 놓습니다. 세 주의 기반 시설 +1. 결정하고 §Y120일§! 뒤 완공됩니다. 경제 재건 +2."
 LR_FRA_poker_category:0 "SEM 어음"
 LR_FRA_poker_category_desc:0 "금속연구소(SEM)는 자본금 100만 프랑짜리 서류상의 회사입니다. 이 회사가 발행한 어음을 군수 업체가 받고, 국가은행이 말없이 할인해 줍니다. 국가 예산에도 배상 위원회 장부에도 한 줄도 남지 않는 돈입니다. 다만 배상 위원회의 감사관들이 어음의 흐름을 쫓고 있습니다. 한 판에 발행 비용 10, 라운드마다 넘기거나 어음을 20만큼 더 찍을 수 있습니다. 감사관이 더 좋은 패를 쥐면 찍은 어음은 회수됩니다. 한 달에 3번까지 할 수 있으며, 시작하려면 자금이 10 이상 있어야 합니다."
