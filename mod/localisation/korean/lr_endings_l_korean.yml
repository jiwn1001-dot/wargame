l_korean:
 lr_ending.1.t:0 "복수의 왕"
 lr_ending.1.d:0 "왕은 그로부터 6년을 더 살았다. 콩코르드 광장에 동상이 섰다. 받침돌에는 왕이 그날 밤 덧붙인 문장이 새겨졌다. 이제 지킬 차례다.\n\n왕의 장례식 날 콩코르드 광장에는 두 무리가 모였다. 하나는 왕의 깃발을 든 노병들이었고, 하나는 검은 옷을 입은 어머니들이었다. 두 무리는 같은 광장에서 같은 관을 향해 고개를 숙였다. 서로를 쳐다본 사람은 없었다.\n\n역사가들은 오를레앙의 왕을 두 가지로 기억한다. 패전의 굴욕을 씻은 왕. 그리고 그 대가로 한 세대의 젊은이를 전장에 보낸 왕. 교과서는 앞의 것을 먼저 쓴다. 검은 옷의 여자들이 사는 동네에서는 순서가 반대였다.\n\n개선문 아래 객차는 지금도 거기 있다. 바뇰은 은퇴할 때까지 그 잉크병을 닦지 않았다."
 lr_ending.1.a:0 "프랑스 왕의 영광은 끝나지 않는다."
 lr_ending.2.t:0 "백합의 세기"
 lr_ending.2.d:0 "부르봉 왕가는 혁명의 세기를 넘겼다. 피레네에서 나폴리까지, 백합의 왕가들이 다시 라틴 유럽을 다스린다.\n\n왕이 세운 학교의 첫 졸업생들이 베르사유 정원에 모였다. 그 가운데 한 청년이 졸업 연설에서 공화국이라는 단어를 꺼냈다. 아무도 그를 체포하지 않았다. 왕은 그 연설문을 끝까지 읽고 비서에게 돌려주었다고 한다. 여백에는 아무것도 적혀 있지 않았다.\n\n왕의 마지막 칙령은 군대가 아니라 학교와 구호소에 관한 것이었다. 프랑스의 모든 면에 국민학교 하나, 모든 군에 구호소 하나. 대신들은 돈이 없다고 했다. 왕은 근위대 예산을 깎았다.\n\n그 칙령이 다음 혁명을 막았는지는 다음 세대가 판단할 일이다. 미셸 포르는 그 학교에서 아이들을 가르치며 늙었다. 교과서의 첫 장에는 왕의 초상이 있었고, 미셸은 그 장을 넘기기 전에 늘 라 마르세예즈 얘기를 했다."
 lr_ending.2.a:0 "신이여, 왕을 지키소서."
 lr_ending.3.t:0 "인터내셔널의 봄"
 lr_ending.3.d:0 "1871년 파리 코뮌은 72일 만에 무너졌다. 그로부터 65년, 코뮌은 프랑스를 넘어 대륙을 덮었다.\n\n베를린과 빈과 마드리드의 노동자 평의회는 해마다 파리에서 모인다. 회의장 벽에는 1871년 연맹병들의 마지막 사진이 걸려 있다. 회의는 언제나 그 사진 앞에서 1분 동안의 침묵으로 시작한다. 침묵이 끝나면 곧바로 예산 싸움이 벌어진다.\n\n역사가들은 이 시대를 두고 오래 다툴 것이다. 해방이었는지, 새로운 지배의 시작이었는지. 공장 평의회 회의록에는 둘 다의 증거가 남아 있다.\n\n페르 라셰즈 묘지의 연맹병의 벽 앞에는 해마다 5월이면 붉은 꽃이 쌓인다. 뤼시앵 마르는 매년 거기 꽃을 한 송이 놓았다. 알퐁스가 죽은 뒤로는 두 송이를 놓았다."
 lr_ending.3.a:0 "만국의 노동자여, 단결하라!"
 lr_ending.4.t:0 "국가 없는 대륙"
 lr_ending.4.d:0 "아무도 국가 없는 유럽이 될 거라고 믿지 않았다. 그것은 3년을 버텼고, 지금도 버티고 있다.\n\n어느 코뮌에서는 다리를 놓을지 말지를 두고 2년째 토론하고 있다. 옆 코뮌에서는 아이들이 자기 학교의 교과서를 스스로 고른다. 강을 건너려는 사람들은 아직 나룻배를 탄다. 사공은 토론이 영원히 끝나지 않기를 바란다고 했다.\n\n느리고 시끄럽고 비효율적이다. 다리 하나 놓는 데 회의가 세 번 필요하고, 회의마다 누군가는 퇴장한다. 국경 너머의 왕들과 위원회들은 이 대륙이 곧 무너진다고 장담한다. 벌써 3년째다.\n\n마르트 고뎅은 인쇄소에서 은퇴할 때까지 일했다. 가로등 회의는 결국 그녀의 이웃이 잡았다. 가로등은 다음 달에 다 켜졌다."
 lr_ending.4.a:0 "왕도 신도 주인도 없다."
 lr_ending.5.t:0 "공화국의 세기"
 lr_ending.5.d:0 "1792년 9월 22일 선포된 공화국은 몇 번이고 쓰러졌다. 2차 대불전쟁의 패배와 왕정복고, 1830년과 1848년과 1871년의 짓밟힌 봉기, 그리고 대전쟁의 패배.\n\n이번 공화국은 혼자가 아니다. 유럽 곳곳에 자매 공화국들이 서 있고, 대표들은 해마다 파리에서 만난다. 그리고 매번 싸운다. 누구는 더 빠른 개혁을, 누구는 더 많은 군대를 원한다.\n\n다음 선거가 석 달 뒤다. 공안위원회는 여론 조사에서 지고 있다. 공화국에서 그건 정상이다. 로베스피에르의 초상은 카르나발레 박물관 2층 구석에 걸렸다. 마르셀 피노는 은퇴하던 해에 그걸 보러 한 번 갔다."
 lr_ending.5.a:0 "공화국 만세!"
 lr_ending.6.t:0 "상인들의 대륙"
 lr_ending.6.d:0 "역사가들은 지롱드의 프랑스를 유럽 통합의 시작으로 기억한다. 대포가 아니라 관세 조약으로 국경을 넘은 첫 강대국.\n\n보르도 항구에는 날마다 새 배가 들어온다. 같은 시각 릴의 문 닫은 방직 공장 앞에는 일자리를 기다리는 사람들이 줄을 선다. 줄 맨 앞의 남자는 보르도행 기차표 값을 손가락으로 세어 보고 있었다.\n\n그 대륙은 부유해졌고, 동시에 불평등해졌다. 보르도는 번영했고 릴은 몰락했다. 같은 나라 안에서 두 도시는 다른 시대를 살았다.\n\n총리가 발코니에서 서명한 실업 보험법은 그 틈을 메우려는 첫 시도였다. 충분했는지는 다음 선거가 말해 줄 것이다. 앙리 뒤카스는 그 법으로 석 달을 버텼고, 넉 달째에 형이 일하는 부두에 취직했다."
 lr_ending.6.a:0 "자유와 번영을."
 lr_ending.7.t:0 "1791년의 완성"
 lr_ending.7.d:0 "푀양파의 프랑스는 혁명과 반동 사이의 좁은 길을 걸었다. 지루하고 타협적이었고, 아무도 완전히 만족하지 않았다.\n\n화보 잡지들은 해마다 같은 사진을 실었다. 왕이 의회 개원식에서 1791년 헌법 원본에 손을 얹는 사진이었다. 사진 속 왕의 얼굴은 해마다 조금씩 늙었고, 헌법 책은 해마다 그대로였다.\n\n그 길 위에서 프랑스는 백오십 년 만에 처음으로 혁명도 쿠데타도 없는 한 세대를 보냈다. 의회 회기는 길고 따분했다. 신문들은 정치가 재미없어졌다고 불평했다. 푀양파 의원 하나가 그 기사를 오려 액자에 넣었다는 얘기가 있다.\n\n역사가들은 이 시대를 위대한 시대라고 부르지 않는다. 평온한 시대라고 부른다. 레옹 비알은 그 정원에서 은퇴할 때까지 장미를 돌봤다."
 lr_ending.7.a:0 "헌법과 왕을 위하여."
 lr_ending.8.t:0 "황제의 유럽"
 lr_ending.8.d:0 "1901년 아작시오에서 태어난 사나이가 서른다섯에 프랑스를 쥐었고, 샤를마뉴 이후 가장 큰 제국을 세웠다.\n\n대서양에서 비스와강까지 같은 법전이 시행된다. 유럽의 절반은 그걸 해방이라 부르고, 나머지 절반은 정복이라 부른다. 제국 원수들은 각국의 왕좌에 앉았다. 그중 몇몇은 벌써 파리보다 자기 수도를 더 아끼기 시작했다.\n\n황제는 늙어 간다. 그가 세운 제국이 그보다 오래 살지는 그의 아들에게 달렸다. 그 아들은 지금 여섯 살이고, 자다가 이불을 찬다."
 lr_ending.8.a:0 "황제 만세!"
 lr_ending.9.t:0 "왕관 없는 승리"
 lr_ending.9.d:0 "그는 유럽을 이기고도 왕관을 쓰지 않았고, 권력의 꼭대기에서 스스로 내려왔다.\n\n역사가들은 그를 쟁기로 돌아간 로마의 킨키나투스에 견준다. 대서양 건너에서는 버지니아의 장군 워싱턴이 같은 약속을 했다는 소문이 돈다. 그 소문이 사실인지는 아직 모른다.\n\n아작시오의 오래된 집 지붕은 그가 편지로 부탁한 대로 고쳐져 있었다. 그는 거기서 회고록을 쓴다. 첫 문장은 이렇다. 나는 황제가 될 수 있었다. 둘째 문장은 아직 쓰지 못했다고 한다."
 lr_ending.9.a:0 "공화국 만세!"
 lr_ending.10.t:0 "붉은 대육군의 유럽"
 lr_ending.10.d:0 "역사가들은 붉은 나폴레옹을 두고 끝없이 다툰다. 혁명을 대륙으로 퍼뜨린 해방자였는지, 붉은 깃발을 든 또 하나의 황제였는지.\n\n확실한 건 하나다. 그가 지나간 곳마다 왕궁이 무너졌고, 그 자리에 인민 공화국이 섰다.\n\n그 공화국들이 스스로 설 수 있을지, 영원히 파리만 바라볼지는 아직 아무도 모른다.\n\n형제와 주인을 어떻게 구별하느냐고 묻던 빈의 그 시는 나흘째 되는 날 신문에 다시 실렸다. 시인은 지금도 빈에 산다. 그는 아직 답을 받지 못했다고 말한다."
 lr_ending.10.a:0 "인민의 이름으로!"
 lr_ending.11.t:0 "원수의 마지막 겨울"
 lr_ending.11.d:0 "필리프 페탱은 두 번 프랑스를 구했다. 1916년 베르됭에서, 그리고 반란의 혼란 속에서.\n\n그가 세운 프랑스국은 질서를 되찾았고 전쟁에서 이겼다. 그 대가로 공화국의 자유를 잃었다. 노동, 가족, 조국. 자유, 평등, 박애는 동전에서 사라졌다. 전단에서는 사라지지 않았다.\n\n원수의 장례식에는 수십만 명이 모일 것이다. 그리고 그 다음 날, 프랑스는 오랫동안 미뤄 온 질문을 다시 꺼낼 것이다. 레몽 드 세르는 그날 밤 서랍에서 압수 전단 한 장을 꺼내 오래 들여다보았다."
 lr_ending.11.a:0 "원수 만세, 프랑스 만세."
 lr_ending.12.t:0 "신사들의 평화"
 lr_ending.12.d:0 "푀양파의 프랑스는 1918년의 국경을 다시 긋지 않았다. 라인강의 다리 위에는 지금도 독일 세관원이 서 있고, 알자스의 학교는 여전히 두 언어로 수업을 한다.\n\n대신 프랑스는 승전국들의 탁자에 의자 하나를 얻었다. 러시아 공화국은 1936년의 국경으로 물러났고, 동유럽의 작은 왕국들은 런던과 파리 두 곳의 보증을 받았다. 배상금 장부는 1950년에 마지막 줄을 그었다.\n\n재향군인회는 해마다 11월이면 검은 리본을 달았다. 그 리본을 다는 사람은 해마다 줄었다. 해협 철도의 첫 열차가 칼레를 떠난 날, 그 열차의 기관사는 아라스에서 전사한 병사의 아들이었다."
 lr_ending.12.a:0 "이것도 승리다."
 lr_ending.13.t:0 "두 왕관의 유럽"
 lr_ending.13.d:0 "리스본에서 렘베르크까지, 가톨릭 왕관들의 동맹이 대륙을 나누어 가졌다. 베를린에는 라인 연방의 총독이 앉았고, 영국 왕실은 오타와로 건너갔다. 빈과 파리는 해마다 번갈아 가며 왕실 회의를 열었다.\n\n2차 대불전쟁 뒤의 신성 동맹은 혁명을 막으려다 한 세대 만에 무너졌다. 이번 동맹은 공장과 철도와 학교를 함께 지었다. 왕세자비는 파리의 빈민 구호소 열두 곳에 자기 이름을 붙였다. 빈의 신문은 그녀를 두 번째 마리 앙투아네트라 불렀고, 파리의 신문은 그 별명을 한 번도 쓰지 않았다.\n\n콩코르드 광장의 오벨리스크 아래에는 지금도 해마다 7월이면 학생들이 모여 노래를 부른다. 경찰은 그들을 해산시키지 않는다. 왕세자비가 처음 그 광장에 마차를 세운 날 이후로 생긴 관례다."
 lr_ending.13.a:0 "신이여, 두 왕관을 지키소서."
 lr_ending.100.t:0 "원수 서거"
 lr_ending.100.d:0 "비시, 파르크 호텔 3층. 레몽 드 세르는 새벽 다섯 시에 전화를 받았다. 주치의였다. 원수가 잠든 채 숨을 거뒀다고 했다. 여든일곱 살이었다.\n\n드 세르는 원수의 방에 들어갔다. 창가 의자 위에 담요가 개어져 있었다. 책상 서랍을 열자 봉인된 봉투가 그대로 있었다. 헌법 법령 제4호. 그는 봉투를 들고 국민 평의회 의장실로 내려갔다.\n\n의장실에는 벌써 두 사람이 와 있었다. 다를랑 제독은 해군 제복 차림으로 창가에 서서 담배를 피우고 있었다. 드골 장군은 의자를 마다하고 문 옆에 서 있었다. 1920년대에 원수의 참모로 원수의 이름이 붙은 책을 쓰던 사람이었다. 두 사람 모두 드 세르의 손에 들린 봉투를 보았다.\n\n의장이 봉랍을 뜯었다. 종이에는 이름이 둘 적혀 있었다. 첫 줄은 줄을 그어 지웠고, 그 아래에 원수의 떨리는 글씨로 다른 이름을 적었다. 어느 줄을 나중에 썼는지는 아무도 알 수 없었다. 의장은 종이를 내려놓고 드 세르를 보았다. 마지막 겨울 내내 원수 곁에 있던 사람은 그였다."
 lr_ending.100.a:0 "다를랑 제독. 함대는 끝까지 원수 곁을 지켰다."
 lr_ending.100.b:0 "드골 장군. 원수가 길러 낸 마지막 군인이다."
 LR_tt_succession:0 "§Y필리프 페탱§!이 세상을 떠나고, 새 국가원수가 프랑스국을 이끕니다."
