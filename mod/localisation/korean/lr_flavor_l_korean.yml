l_korean:
 lr_fra_flavor.1.t:0 "스타비스키의 그림자"
 lr_fra_flavor.1.d:0 "법무부 수사국 검사 마르셀 뒤방은 바욘 시립 금고에서 압수한 장부를 넘기다 손을 멈췄다. 금융 사기꾼 스타비스키가 남긴 장부였다. 연필로 쓴 이니셜 옆에 금액이 적혀 있었다. 이니셜을 의원 명부와 맞춰 보니 현직 의원 열넷, 장관 둘이었다.\n\n다음 날부터 신문들이 매일 아침 이름 하나씩을 1면에 실었다. 누가 흘리는지 뒤방은 알 수 없었다. 콩코르드 광장에는 저녁마다 시위대가 모여 의사당 쪽으로 몰려갔고, 기마경찰이 다리를 막았다. 사흘째 밤에는 돌이 날았다.\n\n넷째 날 법무장관이 뒤방을 불렀다. 장관은 장부의 마지막 쪽을 펼쳐 보이며 물었다. 이 이니셜이 누구인지 알고 있느냐고. 뒤방은 안다고 했다. 장관은 한동안 창밖의 광장을 보았다.\n\n\"검사들은 끝까지 파겠다고 합니다. 그 끝에 누구 이름이 나올지는 저도 모릅니다.\" 장관은 그 말을 뒤방에게 한 것이 아니라 전화기 너머의 누군가에게 하고 있었다."
 lr_fra_flavor.1.a:0 "끝까지 파. 장관이라도 예외는 없다."
 lr_fra_flavor.1.b:0 "덮어. 지금 정부가 무너질 수는 없다."
 lr_fra_flavor.2.t:0 "대파업"
 lr_fra_flavor.2.d:0 "내무부 노동국 서기관 이베트 마르탱은 르노 비양쿠르 공장 앞에서 차를 세웠다. 공장 지붕에서 아코디언 소리가 났다. 노동자들이 공장을 점거한 지 사흘째였다. 파업은 북부 탄광과 리옹 견직 공장까지 번져 있었다.\n\n철문 안에서 노동자 가족들이 냄비를 돌리고 춤을 추었다. 아이들이 컨베이어 벨트 위에 앉아 빵을 먹었다. 마르탱이 신분증을 보이자 노조 간부 하나가 문을 열어 주었다. 그는 마르탱에게 커피를 따라 주며 사장들이 언제 협상하러 오느냐고 물었다.\n\n파리로 돌아오니 사장 단체 대표들이 내무부 복도에 줄지어 앉아 있었다. 그들은 질서 회복을 요구했다. 대표 하나는 마르탱의 보고서를 보지도 않고 군대 이야기부터 꺼냈다.\n\n그날 밤 내무장관이 마르탱의 보고서를 끝까지 읽고 물었다. \"협약 테이블에 앉힐까요, 아니면 기동대를 보낼까요?\" 마르탱은 공장 안에서 마신 커피 맛을 떠올렸다. 꽤 진했다."
 lr_fra_flavor.2.a:0 "양쪽을 한 테이블에 앉혀. 협약을 맺을 때까지 못 나간다."
 lr_fra_flavor.2.b:0 "기동대를 보내. 공장은 사장 것이다."
 lr_fra_flavor.3.t:0 "프랑 위기"
 lr_fra_flavor.3.d:0 "프랑스 은행 금고 관리인 에밀 보두앵은 지하 3층의 장부를 매일 저녁 두 번씩 맞춰 보았다. 한 달 사이 금괴 4백 톤이 런던과 뉴욕으로 빠져나갔다. 금고의 선반이 눈에 띄게 비기 시작했다. 보두앵은 빈 선반에 먼지가 앉지 않게 매일 닦았다.\n\n위층에서는 투기꾼들이 프랑을 팔아 치우고 있었다. 증권거래소 앞 카페에서는 사람들이 프랑이 얼마까지 떨어질지 내기를 했다.\n\n그 주 금요일, 은행 총재가 재무장관을 금고로 직접 데려왔다. 총재는 빈 선반 앞에서 그래프를 펼쳤다. 이대로라면 석 달 안에 바닥난다는 그래프였다. 보두앵은 손전등을 들고 그 뒤에 서 있었다.\n\n\"평가절하를 하면 수출은 살지만 연금 생활자들이 들고일어날 겁니다. 긴축을 하면 공장이 멈춥니다. 오늘 정하셔야 합니다.\" 재무장관은 빈 선반을 한참 보았다. 보두앵의 손전등 불빛이 조금 떨렸다."
 lr_fra_flavor.3.a:0 "평가절하해. 공장이 돌아야 연금도 나온다."
 lr_fra_flavor.3.b:0 "프랑을 지켜. 무슨 일이 있어도."
 lr_fra_flavor.4.t:0 "아무도 읽지 않은 논문"
 lr_fra_flavor.4.d:0 "생기욤 거리 참모부 서고의 접수계 하사 레옹 프티는 두툼한 원고 한 묶음을 서류 더미 위에 올려놓았다. 겉장에는 반듯한 글씨로 포병의 집중 운용에 관한 시론이라고 적혀 있었다.\n\n필자는 코르시카 출신의 무명 포병 대위였다. 프티는 접수 대장에 이름을 적다가 철자를 두 번 틀렸다. 보나파르트. 원고 뒤쪽의 참고 문헌에는 1790년대의 오래된 교범들이 빼곡했다. 아무도 대출해 간 적 없는 책들이었다. 프티는 서고 맨 안쪽에서 그 책들의 먼지를 털어 본 적이 있었다.\n\n담당 소령은 원고를 몇 쪽 넘겨 보다가 하품을 했다. \"포병을 한곳에 모으면 다른 데는 누가 막나.\" 소령은 원고를 서류 더미 맨 아래에 끼워 넣었다.\n\n그날 저녁 퇴근하던 프티는 서류 더미 맨 아래로 손을 넣어 원고를 꺼냈다. 그리고 그것을 자기 책상 서랍에 넣었다. 왜 그랬는지는 자기도 몰랐다. 그냥 글씨가 반듯해서였다고, 나중에 그는 말했다."
 lr_fra_flavor.4.a:0 "언젠가 누가 읽겠지."
 lr_fra_flavor.5.t:0 "알자스의 언어 문제"
 lr_fra_flavor.5.d:0 "바랭 도지사 비서 클레르 슈미트는 대성당 앞 광장이 내려다보이는 도청 창가에 서 있었다. 알자스 학교에서 독일어 수업을 없애라는 교육부 훈령이 내려온 지 이틀, 광장에 학부모 수천 명이 모였다.\n\n슈미트도 알자스 사람이었다. 집에서는 알자스어를, 성당에서는 독일어를, 도청에서는 프랑스어를 썼다. 그녀의 어머니는 훈령 소식을 듣고 전화로 물었다. 손자가 할머니 편지를 못 읽게 되는 거냐고.\n\n광장에서 지방 의회 의장과 주교가 같은 연단에 섰다. 둘이 같은 편에 선 것은 슈미트가 기억하는 한 처음이었다. 주교는 자치라는 말을 썼다. 박수가 대성당 벽에 부딪혀 두 번 울렸다.\n\n도지사가 파리에 보낼 전보 초안을 불렀다. \"훈령을 밀어붙일까요, 거둘까요?\" 슈미트는 받아 적으며 철자 하나를 틀렸다. 독일어식으로 쓴 것이었다. 도지사는 그것을 보고도 고치라고 하지 않았다."
 lr_fra_flavor.5.a:0 "프랑스 땅에서는 프랑스어다."
 lr_fra_flavor.5.b:0 "훈령을 거둬. 할머니 편지는 읽게 해 줘야지."
 lr_fra_flavor.6.t:0 "시트로엥의 파산"
 lr_fra_flavor.6.d:0 "시트로엥 공장 경리과장 로베르 기유맹은 케 드 자벨 정문 앞에 채권자들이 줄 선 것을 사무실 창으로 내려다보았다. 앙드레 시트로엥이 무리하게 늘린 공장이 끝내 파산 직전까지 왔다. 일자리 2만 개가 걸린 문제였다.\n\n기유맹은 장부를 덮을 수가 없었다. 마지막 줄의 적자는 매일 아침 조금씩 커졌다. 시트로엥 사장은 이번 주 내내 사무실에 나오지 않았다. 비서 말로는 집에서 에펠탑에 걸었던 자기 이름 전광판 사진을 들여다보고 있다고 했다.\n\n목요일에 두 무리가 찾아왔다. 클레르몽페랑의 미쉐린 가문 사람들은 인수 의사를 밝혔다. 오후에는 국방부 군수국 장교들이 왔다. 그들은 조립 라인을 둘러보며 하룻밤이면 군용 트럭 라인으로 바꿀 수 있겠다고 수군거렸다.\n\n금요일 아침 산업장관이 기유맹을 불러 장부를 펼치게 했다. \"공장을 누구에게 넘길까요?\" 기유맹은 대답 대신 장부의 직원 명단 쪽을 펼쳐 보였다."
 lr_fra_flavor.6.a:0 "국가가 산다. 트럭은 군대가 쓴다."
 lr_fra_flavor.6.b:0 "미쉐린에 넘겨. 공장은 공장을 아는 사람이 돌려야지."
 lr_fra_flavor.7.t:0 "방데의 순례"
 lr_fra_flavor.7.d:0 "생플로랑 헌병대장 가스통 르루 중위는 순례 행렬 맨 뒤를 따라 걸었다. 수만 명이 1793년 전몰자 묘지로 향했다. 행렬 맨 앞에는 백합 깃발이 섰고, 농민들은 가슴에 성심 문장을 달았다.\n\n르루도 방데 사람이었다. 그의 할머니도 해마다 이 길을 걸었다. 행렬 중간쯤에서 늙은 농부 하나가 그를 알아보고 손을 흔들었다. 어릴 때 그에게 사과를 주던 이웃이었다.\n\n야외 미사에서 늙은 사제가 설교했다. 150년 전 이 땅의 농민들이 무엇을 위해 죽었는지 잊지 말라고. 공화국이라는 말이 나올 때마다 군중 사이에서 낮은 웅성거림이 일었다. 르루의 부하 하사가 수첩에 그 문장들을 받아 적었다.\n\n미사가 끝나자 르루는 마을 우체국에서 군청에 전화를 걸었다. \"행렬이 공화국을 비난하고 있습니다. 해산시킬까요?\" 수화기 너머에서 한참 대답이 없었다. 창밖으로 사과를 주던 이웃이 지나갔다."
 lr_fra_flavor.7.a:0 "해산시켜. 백합 깃발은 반역이다."
 lr_fra_flavor.7.b:0 "기도하는 사람은 건드리지 마."
 lr_fra_flavor.8.t:0 "지하 인쇄소"
 lr_fra_flavor.8.d:0 "경시청 정치과 형사 쥘 바르니에는 새벽 네 시에 벨빌의 지하실 문을 부쉈다. 손으로 돌리는 인쇄기 한 대와 잉크가 덜 마른 전단 수천 장이 나왔다. 인쇄공 셋이 수갑을 찼다. 가장 어린 아이는 열일곱이었다.\n\n바르니에는 전단 한 장을 집어 읽었다. 내용은 늘 보던 것이었다. 그런데 맨 아래 작은 글씨로 지난주 그의 동료가 시위대를 곤봉으로 친 날짜와 거리 이름이 적혀 있었다. 정확했다.\n\n경시청으로 돌아오는 차 안에서 그는 창밖을 보았다. 지하철역 입구와 공장 담벼락마다 같은 전단이 붙어 있었다. 방금 압수한 것과 같은 판이었다. 인쇄소가 하나가 아니라는 뜻이었다.\n\n오전에 경시총감이 바르니에를 불렀다. \"본보기를 보일까요, 아니면 숨통을 조금 틔워 줄까요?\" 바르니에는 열일곱 살 인쇄공 이야기를 할까 하다가 그만두었다."
 lr_fra_flavor.8.a:0 "본보기로 엄벌해. 인쇄기는 녹여 버려."
 lr_fra_flavor.8.b:0 "검열을 조금 풀어. 김을 빼야 솥이 안 터진다."
 lr_fra_flavor.20.t:0 "야당의 약진"
 lr_fra_flavor.20.d:0 "여당 사무국 직원 로제 퐁텐은 그날 밤 개표 전화를 세 통 받았다. 리모주, 루베, 툴루즈. 보궐선거 세 곳이 하룻밤 사이에 모두 뒤집혔다. 셋 다 여당이 20년 동안 지켜 온 선거구였다.\n\n퐁텐은 루베 선거구를 맡았던 사람이었다. 그는 지난달 그곳 공장 앞에서 전단을 돌렸다. 노동자들은 전단을 받아 들고 아무 말 없이 주머니에 넣었다. 그는 그게 지지의 표시인 줄 알았다.\n\n다음 날 아침 부르봉 궁 휴게실에서는 여당 의원들이 삼삼오오 모여 수군거렸다. 다음 예산안 표결에서 이탈하겠다는 이름이 열 명을 넘었다고 했다. 퐁텐이 명단을 받아 적었다. 그중 둘은 당 대표의 사위와 대학 동창이었다.\n\n원내대표가 명단을 들고 총리실로 갔다. 예산 일부를 양보하면 이탈은 막을 수 있었다. 양보하지 않으면 명단은 더 길어질 것이다."
 lr_fra_flavor.20.a:0 "예산을 조금 내준다. 사람을 잃을 순 없다. (의석 -12)"
 lr_fra_flavor.20.b:0 "물러서지 않는다. 나갈 사람은 나가라. (의석 -36)"
 lr_fra_flavor.21.t:0 "왕당파의 세력 확대"
 lr_fra_flavor.21.d:0 "렌 헌병대 정보장교 이브 르고프 대위는 브르타뉴 시골 장터 사진 열두 장을 책상에 늘어놓았다. 사진마다 백합 문장을 단 청년들이 찍혀 있었다. 악시옹 프랑세즈의 후예를 자처하는 단체가 방데와 랑그도크까지 마을마다 지부를 세우고 있었다.\n\n후원금 장부도 있었다. 옛 귀족 가문과 시골 사제들의 이름이 줄지어 적혀 있었다. 르고프가 가장 오래 들여다본 것은 마지막 사진이었다. 헛간 안에 쌓인 상자들이었다. 상자 옆면에 생테티엔 조병창의 도장이 찍혀 있었다. 사냥용 엽총이 아니었다.\n\n르고프는 보고서 첫 줄에 그 사실을 썼다. 헌병대 보고서에 군용 소총이 등장한 것은 처음이었다.\n\n보고서를 받은 내무장관이 르고프를 파리로 불렀다. 대위는 장관 앞에서 자기 생각을 말했다. \"지금 단속하면 순교자를 만들고, 내버려 두면 군대를 만들어 줍니다.\""
 lr_fra_flavor.21.a:0 "지금 친다. (방데, 남부 반발도 +5)"
 lr_fra_flavor.21.b:0 "지켜본다. (방데 +15, 남부 +10, 론 +5)"
 lr_fra_flavor.22.t:0 "혁명파의 세력 확대"
 lr_fra_flavor.22.d:0 "경시청 형사 마르크 들로르는 생드니의 노동자 카페 뒷방에서 압수한 장부를 펼쳤다. 생드니와 릴의 공장 지대에서 금지된 클럽이 다시 늘고 있었다. 카페 뒷방마다 토론회가 열렸고, 공장 벽에는 하룻밤 사이 붉은 별이 그려졌다.\n\n장부는 꼼꼼했다. 전단 인쇄비, 파업 기금, 체포된 노동자 가족 생활비. 수입 쪽에는 매달 같은 날짜에 같은 금액이 적혀 있었다. 송금처는 페테르부르크의 한 은행이었다. 들로르는 그 은행 이름을 러시아 대사관 무관의 명함에서 본 적이 있었다.\n\n카페 주인은 체포되면서도 태연했다. 들로르에게 담배를 권하며 말했다. 경찰 월급으로는 이 동네에서 집세 내기도 힘들지 않느냐고.\n\n그날 오후 경시총감이 장관에게 보고했다. 들로르는 문밖에서 그 목소리를 들었다. \"지금 덮치면 북부가 들끓고, 기다리면 파리가 들끓습니다.\""
 lr_fra_flavor.22.a:0 "지금 친다. (파리, 북부 반발도 +5)"
 lr_fra_flavor.22.b:0 "지켜본다. (파리 +15, 북부 +10, 론 +5)"
