l_korean:
 lr_fra_flavor.1.t:0 "스타비스키의 그림자"
 lr_fra_flavor.1.d:0 "바욘 시립 금고의 장부 한 권이 파리를 뒤흔든다. 금융 사기꾼 스타비스키가 남긴 장부에서 현직 의원 열네 명과 장관 둘의 이름이 나왔다.\n\n신문들은 매일 아침 새 이름을 1면에 싣는다. 콩코르드 광장에는 저녁마다 시위대가 모여 국회 쪽으로 몰려가고, 기마경찰이 다리를 막아선다.\n\n법무장관이 묻는다. \"검사들은 끝까지 파겠다고 합니다. 그 끝에 누구 이름이 나올지는 저도 모릅니다.\""
 lr_fra_flavor.1.a:0 "철저히 수사하라. 장관이라도 예외는 없다."
 lr_fra_flavor.1.b:0 "조용히 덮어라. 지금 정부가 무너질 수는 없다."
 lr_fra_flavor.2.t:0 "대파업"
 lr_fra_flavor.2.d:0 "르노 비양쿠르 공장 지붕 위에서 아코디언 소리가 난다. 노동자들이 공장을 점거한 지 사흘째, 파업은 북부의 탄광과 리옹의 견직 공장까지 번졌다.\n\n공장 안에서는 노동자 가족들이 냄비를 돌리고 춤을 춘다. 공장 밖에서는 사장 단체 대표들이 내무부 복도를 오가며 질서 회복을 요구한다.\n\n\"협약 테이블에 앉힐까요, 아니면 기동대를 보낼까요?\""
 lr_fra_flavor.2.a:0 "노사 대표를 불러 협약을 맺게 한다."
 lr_fra_flavor.2.b:0 "군대를 보내 공장을 되찾는다."
 lr_fra_flavor.3.t:0 "프랑 위기"
 lr_fra_flavor.3.d:0 "프랑스 은행 지하 금고. 한 달 사이 금괴 4백 톤이 런던과 뉴욕으로 빠져나갔다. 투기꾼들이 프랑을 팔아 치우고 있다.\n\n은행 총재가 재무장관 앞에 그래프를 펼친다. 이대로라면 석 달 안에 금 보유량이 바닥난다.\n\n\"평가절하를 하면 수출은 살지만 연금 생활자들이 들고일어날 겁니다. 긴축을 하면 공장이 멈춥니다. 오늘 정하셔야 합니다.\""
 lr_fra_flavor.3.a:0 "프랑을 평가절하한다. 수출이 살아날 것이다."
 lr_fra_flavor.3.b:0 "무슨 일이 있어도 프랑을 지킨다."
 lr_fra_flavor.4.t:0 "아무도 읽지 않은 논문"
 lr_fra_flavor.4.d:0 "생기욤 거리의 참모부 서고. 접수계 하사가 두툼한 원고 한 묶음을 서류 더미 위에 올려놓는다. 제목은 포병의 집중 운용에 관한 시론.\n\n필자는 코르시카 출신의 무명 포병 대위다. 참고 문헌에는 1790년대의 오래된 교범들이 빼곡한다.\n\n담당 소령은 몇 쪽 넘겨 보다가 하품을 하고, 원고를 서류 더미 맨 아래에 끼워 넣는다. 그 원고가 언젠가 다시 꺼내질지는 아무도 모른다."
 lr_fra_flavor.4.a:0 "언젠가 누가 읽겠지."
 lr_fra_flavor.5.t:0 "알자스의 언어 문제"
 lr_fra_flavor.5.d:0 "스트라스부르 대성당 앞 광장. 알자스 학교에서 독일어 수업을 없애라는 교육부 훈령이 내려오자 학부모 수천 명이 모였다.\n\n알자스 사람들은 집에서는 알자스어를, 성당에서는 독일어를, 관청에서는 프랑스어를 쓴다. 지방 의회와 주교가 처음으로 같은 목소리로 자치를 말하기 시작한다.\n\n도지사가 파리에 전보를 보낸다. \"훈령을 밀어붙일까요, 거둘까요?\""
 lr_fra_flavor.5.a:0 "프랑스 땅에서는 프랑스어다."
 lr_fra_flavor.5.b:0 "지역의 관습을 존중한다."
 lr_fra_flavor.6.t:0 "시트로엥의 파산"
 lr_fra_flavor.6.d:0 "케 드 자벨의 시트로엥 공장 정문에 채권자들이 줄을 섰다. 앙드레 시트로엥의 무리한 확장이 끝내 파산 직전까지 왔다. 일자리 2만 개가 걸린 문제다.\n\n클레르몽페랑의 미쉐린 가문이 인수 의사를 밝혔다. 그런데 국방부도 이 공장을 탐낸다. 트럭 조립 라인은 하룻밤 사이에 군용 트럭 라인이 될 수 있다.\n\n\"공장을 누구에게 넘길까요?\""
 lr_fra_flavor.6.a:0 "국가가 인수해 군수 공장으로 돌린다."
 lr_fra_flavor.6.b:0 "미쉐린에 넘긴다. 공장은 기업가가 돌린다."
 lr_fra_flavor.7.t:0 "방데의 순례"
 lr_fra_flavor.7.d:0 "방데의 생플로랑 들판. 수만 명의 순례자가 1793년 전몰자 묘지로 향한다. 행렬 맨 앞에는 백합 깃발이 펄럭이고, 농민들은 성심 문장을 가슴에 달았다.\n\n야외 미사에서 늙은 사제가 설교한다. 150년 전 이 땅의 농민들이 무엇을 위해 죽었는지 잊지 말라고.\n\n헌병대장이 군청에 전화를 건다. \"행렬이 공화국을 비난하고 있습니다. 해산시킬까요?\""
 lr_fra_flavor.7.a:0 "행렬을 해산시킨다. 백합 깃발은 반역이다."
 lr_fra_flavor.7.b:0 "신앙의 자유는 건드리지 않는다."
 lr_fra_flavor.8.t:0 "지하 인쇄소"
 lr_fra_flavor.8.d:0 "새벽 네 시, 벨빌의 어느 지하실. 경찰이 문을 부수고 들어가자 아직 잉크가 마르지 않은 전단 수천 장과 손으로 돌리는 인쇄기가 나왔다.\n\n인쇄공 셋이 수갑을 찼다. 그러나 경찰서로 돌아오는 길에 형사들은 이미 그 전단이 지하철역과 공장 담벼락마다 붙어 있는 것을 본다.\n\n경시총감이 묻는다. \"본보기를 보일까요, 아니면 숨통을 조금 틔워 줄까요?\""
 lr_fra_flavor.8.a:0 "본보기로 엄벌한다. 인쇄기는 압수한다."
 lr_fra_flavor.8.b:0 "검열을 조금 풀어 불만을 달랜다."
 lr_fra_flavor.20.t:0 "야당의 약진"
 lr_fra_flavor.20.d:0 "보궐선거 결과가 하룻밤 사이에 세 군데에서 뒤집혔다. 리모주, 루베, 툴루즈. 모두 여당이 20년 동안 지켜 온 선거구다.\n\n부르봉 궁 휴게실에서는 여당 의원들이 삼삼오오 모여 수군거린다. 다음 예산안 표결에서 이탈하겠다는 이름이 열 명을 넘었다고 한다.\n\n원내대표가 총리에게 쪽지를 건넨다. 예산 일부를 양보하면 이탈을 막을 수 있다."
 lr_fra_flavor.20.a:0 "예산안을 양보해 이탈을 막는다. (의석 -12)"
 lr_fra_flavor.20.b:0 "물러서지 않는다. (의석 -36)"
 lr_fra_flavor.21.t:0 "왕당파의 세력 확대"
 lr_fra_flavor.21.d:0 "브르타뉴와 방데, 랑그도크의 시골 장터에 백합 문장을 단 청년들이 나타났다. 악시옹 프랑세즈의 후예를 자처하는 단체가 마을마다 지부를 세우고 있다.\n\n옛 귀족 가문과 사제들의 후원금이 그들에게 몰린다. 헌병대 보고서에는 사냥용 엽총이 아닌 군용 소총을 모은다는 내용이 처음 등장했다.\n\n\"지금 단속하면 순교자를 만들고, 내버려 두면 군대를 만들어 줍니다.\""
 lr_fra_flavor.21.a:0 "즉시 단속한다. (방데, 남부 반발도 +5)"
 lr_fra_flavor.21.b:0 "지켜본다. (방데 +15, 남부 +10, 론 +5)"
 lr_fra_flavor.22.t:0 "혁명파의 세력 확대"
 lr_fra_flavor.22.d:0 "생드니와 릴의 공장 지대에서 금지된 클럽이 다시 늘고 있다. 노동자 카페의 뒷방마다 토론회가 열리고, 벽에는 붉은 별이 그려진다.\n\n경찰이 압수한 장부에는 페테르부르크의 은행에서 송금된 돈이 적혀 있다. 그 돈은 전단과 파업 기금으로 흘러갔다.\n\n\"지금 덮치면 북부가 들끓고, 기다리면 파리가 들끓습니다.\""
 lr_fra_flavor.22.a:0 "즉시 단속한다. (파리, 북부 반발도 +5)"
 lr_fra_flavor.22.b:0 "지켜본다. (파리 +15, 북부 +10, 론 +5)"
