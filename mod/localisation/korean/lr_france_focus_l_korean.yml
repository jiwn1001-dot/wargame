 LR_NAP_invite_balkans_desc:0 "베오그라드, 아테네, 부쿠레슈티는 대전쟁 때 프랑스와 함께 싸웠고 함께 졌습니다. 그 세 나라가 이번에는 불가리아를 꺾었습니다. 옛 전우들에게 다시 같은 편에 서자고 청합니다."
 LR_ORL_royal_council:0 "왕실 군사 평의회"
 LR_ORL_royal_council_desc:0 "의회는 아직 열리지만 결정은 다른 곳에서 내려집니다. 장군들이 내각보다 높은 왕실 군사 평의회에 앉습니다. 예산과 인사가 그 방에서 정해지고, 의회는 박수를 치러 모일 뿐입니다."
 LR_ORL_family_allowance:0 "다자녀 수당"
 LR_ORL_family_allowance_desc:0 "대전쟁은 한 세대의 젊은이를 앗아 갔습니다. 마을마다 남자보다 여자가 많고 요람은 비어 있습니다. 왕은 아이를 셋 이상 낳은 어머니에게 메달과 수당을 줍니다. 그 요람의 아이들은 스무 해 뒤 병사가 될 것입니다."
 LR_ORL_labour_service:0 "국민 노동 봉사단"
 LR_ORL_labour_service_desc:0 "실업자 청년들이 거리에서 왕을 욕하는 것보다 삽을 드는 편이 낫습니다. 국민 노동 봉사단이 그들에게 제복과 밥을 줍니다. 그들이 군가를 부르며 지나간 자리에 도로와 제방이 놓입니다."
 LR_BOU_poor_relief:0 "왕실 구호 기금"
 LR_BOU_poor_relief_desc:0 "지난겨울 파리의 빵값은 두 배가 되었고, 사람들은 혁명가를 불렀습니다. 왕비의 이름이 새겨진 자루에 담긴 빵이 교회 앞에서 나눠집니다. 배부른 사람은 바리케이드를 쌓지 않습니다."
 LR_BOU_guilds:0 "길드 부활"
 LR_BOU_guilds_desc:0 "노동조합은 파업과 혁명의 온상이었습니다. 왕은 조합을 해산하고 그 자리에 칙허를 받은 길드를 세웁니다. 늙은 장인들은 할아버지의 길드 이름을 되찾았다며 눈시울을 붉히고, 젊은 노동자들은 파업할 권리를 잃습니다."
 LR_BOU_provincial_estates:0 "지방 삼부회"
 LR_BOU_provincial_estates_desc:0 "혁명은 지방의 옛 특권을 모두 없애고 파리에서 모든 것을 정했습니다. 프로방스와 브르타뉴와 랑그도크의 귀족들은 그 일을 잊지 않았습니다. 지방 삼부회를 되돌려 주고, 150년 만에 지방이 왕을 사랑하게 만듭니다."
 LR_JAC_womens_vote:0 "여성 참정권"
 LR_JAC_womens_vote_desc:0 "1791년 올랭프 드 구주는 여성과 여성 시민의 권리 선언을 썼고, 그 때문에 단두대에 올랐습니다. 공장과 병원을 돌린 것은 대전쟁 내내 여성들이었습니다. 150년 묵은 그 요구가 드디어 법이 됩니다."
 LR_GIR_charity_schools:0 "민간 학교 지원"
 LR_GIR_charity_schools_desc:0 "국가가 모든 것을 할 필요는 없다는 것이 지롱드의 믿음입니다. 기업가들이 세운 기술 학교에 세금 혜택을 줍니다. 노동자의 아이들이 숙련공이 되어 그 공장으로 돌아갑니다."
 LR_GIR_mutual_aid:0 "상호 부조 협회"
 LR_GIR_mutual_aid_desc:0 "병든 노동자를 돌보는 일은 국가가 아니라 직능별 상호 부조 협회가 맡습니다. 회비를 내는 사람은 보호받고, 내지 못하는 사람은 교회 문을 두드려야 합니다. 이것이 지롱드식 복지입니다."
 LR_GIR_provincial_power:0 "지방 분권법"
 LR_GIR_provincial_power_desc:0 "1793년 지롱드파는 파리의 독재에 맞서 지방의 권리를 지키려다 단두대에 올랐습니다. 150년 뒤 그 원칙이 법이 됩니다. 파리의 권한을 지방 의회로 내려 보내고, 지방 명사들이 자기 예산을 손에 쥡니다."
 LR_MAR_parish_relief:0 "교구 구호"
 LR_MAR_parish_relief_desc:0 "푀양파는 복지가 국가가 아니라 교구의 일이라고 믿습니다. 국가가 빵을 주면 시민은 국가에 빵을 요구하게 됩니다. 수녀들이 다시 병원과 고아원을 맡고, 정부는 보조금만 보냅니다."
 LR_MAR_property_franchise:0 "재산 선거권"
 LR_MAR_property_franchise_desc:0 "보통선거는 혁명가들을 의회로 보냈습니다. 푀양파는 세금을 많이 내는 사람에게 표를 더 주자고 합니다. 노동자의 표는 줄고 지방 명사의 표는 늡니다. 1791년 헌법도 이렇게 시작했습니다."
 LR_NAP_imperial_university:0 "제국 대학"
 LR_NAP_imperial_university_desc:0 "황제는 학교가 제국의 다음 세대를 만든다고 믿습니다. 모든 교육이 제국 대학의 관할이 됩니다. 전국 리세의 소년들이 군복 같은 교복을 입고 북소리에 맞춰 교실에 들어가 나폴레옹 법전을 외웁니다."
 LR_GUA_public_education:0 "공교육 확대"
 LR_GUA_public_education_desc:0 "왕정의 교과서는 왕의 계보로 시작했습니다. 대통령이 새 국정 교과서의 서문을 직접 씁니다. 첫 문장은 황제가 아니라 시민으로 시작합니다. 장군들은 그 문장을 읽고 고개를 갸웃합니다."
 LR_COM_fortress_france:0 "요새 프랑스"
 LR_COM_fortress_france_desc:0 "혁명을 수출할 군대가 생긴다 해도 먼저 국경을 지켜야 합니다. 왕정이 짓다 만 국경 요새들이 동쪽에 늘어서 있습니다. 그 콘크리트 위에 붉은 깃발을 올리고 공사를 다시 시작합니다."
 LR_COM_socialist_industry:0 "사회주의 공업화"
 LR_COM_socialist_industry_desc:0 "제1차 인민 계획이 발표됩니다. 철강과 전력이 무엇보다 먼저입니다. 구두와 커피와 라디오는 다음 계획에서 이야기하기로 합니다. 노동자들은 아직은 참아 줍니다."
 LR_COM_collective_farms:0 "농업 협동화"
 LR_COM_collective_farms_desc:0 "도시 노동자를 먹이려면 농촌이 바뀌어야 합니다. 협동농장 위원들이 방데의 마을에 도착합니다. 농민들은 헛간 바닥에 묻어 둔 엽총을 다시 꺼냅니다."
 LR_COM_national_guard:0 "국민 방위군"
 LR_COM_national_guard_desc:0 "1792년 조국이 위험에 처하자 파리 시민들은 국민 방위군을 만들었습니다. 그 이름을 되살립니다. 모든 공장과 마을에 중대가 조직되고, 퇴근한 선반공이 소총을 받아 듭니다."
 LR_COM_no_foreign_masters:0 "모스크바와의 거리"
 LR_COM_no_foreign_masters_desc:0 "페테르부르크에서 온 러시아 고문단은 코뮌에 러시아식 혁명을 가르치려 했습니다. 프랑스 혁명의 교과서는 프랑스에서 씁니다. 고문단이 조용히 귀국 열차에 오르고, 역에 배웅 나온 사람은 아무도 없습니다."
 LR_COM_comintern_paris:0 "파리 인터내셔널"
 LR_COM_comintern_paris_desc:0 "23개국에서 온 망명자들이 몽마르트르 언덕의 건물 하나에 모였습니다. 그들은 같은 복도를 쓰고, 같은 식당에서 서로를 의심하며 밥을 먹습니다. 세계 혁명의 사령부가 정식으로 문을 엽니다."
 LR_COM_spanish_comrades:0 "스페인 동지 지원"
 LR_COM_spanish_comrades_desc:0 "스페인의 노동자들은 왕과 카를로스파 사이에서 내전을 치렀습니다. 피레네의 밀수꾼 길로 전단과 소총이 넘어갑니다. 바르셀로나의 노동자들은 파리 방송을 몰래 듣고, 마드리드의 왕은 잠을 설칩니다."
 LR_COM_italian_workers:0 "이탈리아 노동자 봉기"
 LR_COM_italian_workers_desc:0 "이탈리아는 네 왕국으로 갈라져 있고 빈이 그 위에 앉아 있습니다. 토리노의 피아트 공장과 나폴리 부두에 파리의 소식이 도착합니다. 이탈리아는 왕들보다 혁명으로 먼저 하나가 될지도 모릅니다."
 LR_COM_german_spartacists:0 "독일 노동자 지원"
 LR_COM_german_spartacists_desc:0 "루르의 광부 노조와 함부르크 부두 노조는 대전쟁 때 파업으로 프로이센의 전쟁을 흔들었습니다. 그 조합들로 코뮌의 비밀 자금이 흘러갑니다. 프로이센 경찰이 찾아낸 돈은 그 가운데 일부일 뿐입니다."
 LR_COM_british_chartists:0 "차티스트의 후예"
 LR_COM_british_chartists_desc:0 "맨체스터 부두 노동자들이 파리에서 건너온 전단을 돌려 읽습니다. 100년 전 차티스트들이 외친 요구가 다시 공장 벽에 적힙니다. 런던의 귀족 의회는 이것을 전쟁 행위라고 부릅니다."
 LR_COM_red_volunteers:0 "국제 여단"
 LR_COM_red_volunteers_desc:0 "베를린의 선반공과 바르샤바의 대학생과 나폴리의 부두 노동자가 파리에 왔습니다. 그들이 같은 연대에 섭니다. 서로 말은 통하지 않지만 인터내셔널은 다들 부를 줄 압니다."
 LR_FRA_colonial_regiments:0 "주아브와 티라외르"
 LR_FRA_colonial_regiments_desc:0 "모로코와 튀니지의 연대가 마르세유에 내립니다. 붉은 페즈를 쓴 이 병사들은 백 년 넘게 프랑스를 위해 싸웠습니다. 그 대가가 무엇이었는지는 아직 아무도 그들에게 묻지 않았습니다."
 LR_FRA_chasseurs_alpins:0 "알프스 산악병"
 LR_FRA_chasseurs_alpins_desc:0 "샤모니 빙하 위에서 커다란 베레모를 쓴 부대가 스키를 탑니다. 사르데냐와 오스트리아 국경의 다음 전쟁은 참호가 아니라 능선에서 벌어질 것입니다. 알프스 산악병을 늘립니다."
 LR_FRA_rifle_stocks:0 "MAS 소총 양산"
 LR_FRA_rifle_stocks_desc:0 "생테티엔 조병창의 새 생산 라인이 MAS 소총을 하루 수백 정씩 뽑아냅니다. 르벨 소총은 할아버지의 벽난로 위로 돌아갑니다. 소총부터 양산합니다."
 LR_FRA_combat_engineers:0 "공병 전통"
 LR_FRA_combat_engineers_desc:0 "보방이 요새를 쌓던 나라에서 공병은 언제나 육군의 자랑이었습니다. 강을 건너는 군대는 다리를 놓는 부대보다 빨리 갈 수 없습니다. 공병 대대를 늘립니다."
 LR_FRA_staff_college:0 "고등 전쟁 대학"
 LR_FRA_staff_college_desc:0 "포슈 원수가 강의하던 고등 전쟁 대학은 예산 삭감으로 십 년째 문이 닫혀 있습니다. 다시 엽니다. 젊은 대령들이 1914년의 작전 지도를 펴 놓고 어디서부터 틀렸는지 처음부터 그립니다."
 LR_FRA_armoured_recon:0 "기병의 기계화"
 LR_FRA_armoured_recon_desc:0 "소뮈르 기병 학교의 장교들이 말에서 내립니다. 마구간 앞에서 우는 노장교도 있습니다. 정찰 장갑차는 지치지도 않고 여물도 먹지 않습니다."
 LR_FRA_cruiser_squadron:0 "대양 순양함대"
 LR_FRA_cruiser_squadron_desc:0 "제국을 잃은 해군에게 남은 임무는 항로를 지키는 일입니다. 다카르와 카사블랑카를 잇는 바닷길이 그들의 영토입니다. 빠른 순양함들을 대서양으로 보냅니다."
 LR_FRA_destroyer_flotillas:0 "구축함 전단"
 LR_FRA_destroyer_flotillas_desc:0 "르 팡타스크급 대형 구축함은 시속 70킬로미터로 바다를 가릅니다. 영국 전함의 뒤를 물어뜯을 사냥개들입니다. 구축함 전단을 꾸립니다."
 LR_FRA_commerce_raiding:0 "통상 파괴전"
 LR_FRA_commerce_raiding_desc:0 "함대끼리 정면으로 붙어서는 이길 수 없습니다. 그렇다면 함대가 아니라 상선을 노립니다. 대전쟁 때 독일 해군이 프랑스에 가르쳐 준 방법입니다."
 LR_FRA_bearn_carrier:0 "베아른의 후계자"
 LR_FRA_bearn_carrier_desc:0 "베아른호는 프랑스의 유일한 항공모함입니다. 느리고 낡았고, 원래는 전함으로 만들던 배였습니다. 처음부터 항공모함으로 설계한 배를 그립니다."
 LR_FRA_naval_aviation:0 "해군 항공대"
 LR_FRA_naval_aviation_desc:0 "공군 장성들은 바다 위를 나는 비행기도 공군 것이라고 고집해 왔습니다. 오랜 다툼 끝에 해군이 자기 비행기와 조종사를 갖습니다. 함재기 비행단을 세웁니다."
 LR_FRA_mers_el_kebir:0 "지중해 기지"
 LR_FRA_mers_el_kebir_desc:0 "튀니지 비제르트의 항구는 지브롤터와 몰타 사이, 영국 해군의 길목에 있습니다. 요새를 넓히고 해안포를 새로 올립니다. 지중해에 프랑스가 닻을 내립니다."
 LR_FRA_convoy_school:0 "호송대 학교"
 LR_FRA_convoy_school_desc:0 "대전쟁 때 잠수함은 프랑스 상선을 수백 척 가라앉혔습니다. 상선과 군함이 함께 항해하는 법을 해군 학교에서 다시 가르칩니다. 비싸게 배운 교훈입니다."
 LR_FRA_fusiliers_marins:0 "해병 보병"
 LR_FRA_fusiliers_marins_desc:0 "식민지 상륙전의 경험이 해병 보병 교리로 정리됩니다. 해협이든 지중해든, 바다를 건너려면 이들이 먼저 해변에 서야 합니다. 해병 보병을 키웁니다."
 LR_FRA_dewoitine_fighters:0 "드부아틴 전투기"
 LR_FRA_dewoitine_fighters_desc:0 "툴루즈 공장 문이 열리고 은빛 단엽 전투기가 활주로로 굴러 나옵니다. 천과 철사로 엮은 복엽기의 시대가 끝났습니다. 드부아틴 전투기를 양산합니다."
 LR_FRA_air_aces:0 "라파예트의 후예"
 LR_FRA_air_aces_desc:0 "기느메르와 퐁크, 대전쟁 하늘의 에이스들 이름을 딴 비행단을 만듭니다. 패전국 공군에게는 무엇보다 영웅이 필요합니다. 젊은 조종사들이 그 이름을 동체에 그립니다."
 LR_FRA_potez_bombers:0 "포테즈 경폭격기"
 LR_FRA_potez_bombers_desc:0 "포테즈 공장의 쌍발 경폭격기는 웬만한 전투기보다 빠릅니다. 조종사들이 연습 표적으로 쓰는 사진은 라인강의 다리들입니다. 경폭격기 비행단을 늘립니다."
 LR_FRA_strategic_force:0 "전략 폭격 부대"
 LR_FRA_strategic_force_desc:0 "두에의 이론을 믿는 장군들이 4발 폭격기 예산을 따냈습니다. 육군은 그 돈이면 전차 300대를 만든다며 격렬히 반대했습니다. 누가 옳았는지는 다음 전쟁이 알려 줄 것입니다."
 LR_FRA_cas_wings:0 "지상 지원 비행단"
 LR_FRA_cas_wings_desc:0 "급강하 폭격기에 무전기를 달고, 그 무전기를 전차 부대와 잇습니다. 계획서 맨 아래에는 드골 대령의 서명이 있습니다. 참모본부 노장군들은 그 이름만 보고 얼굴을 찌푸립니다."
 LR_FRA_air_safety:0 "항공 안전국"
 LR_FRA_air_safety_desc:0 "작년에 공군은 전투가 아니라 기체 결함으로 조종사 마흔 명을 잃었습니다. 새 비행기를 사기 전에 정비병 교육과 점검표부터 고칩니다. 항공 안전국을 세웁니다."
 LR_FRA_air_detection:0 "방공 감시망"
 LR_FRA_air_detection_desc:0 "해안과 국경의 언덕마다 감시 초소를 세우고 전화선으로 잇습니다. 다음 전쟁의 첫 경보는 쌍안경을 든 어느 예비역 하사의 수화기에서 울릴 것입니다. 방공 감시망을 깝니다."
 LR_FRA_paratroopers:0 "공수 부대"
 LR_FRA_paratroopers_desc:0 "알제리 사막 위에서 첫 낙하산 강하 실험을 합니다. 참모본부는 하늘에서 떨어지는 보병이라는 말에 웃었습니다. 공수 부대를 정식으로 편성합니다."
 LR_ORL_neutral_ties:0 "중립국 회유"
 LR_ORL_neutral_ties_desc:0 "스웨덴의 철광과 스위스의 금고는 중립입니다. 다음 전쟁에서 영국의 봉쇄를 견디려면 그 중립이 프랑스 쪽으로 기울어야 합니다. 왕의 사절이 스톡홀름과 베른에 장기 계약서를 들고 갑니다."
 LR_ORL_ottoman_talks:0 "이스탄불 밀담"
 LR_ORL_ottoman_talks_desc:0 "대전쟁의 승전국 진영에도 틈은 있습니다. 오스만은 런던과 빈 다음의 셋째 자리를 스무 해 동안 참아 왔습니다. 왕의 밀사가 이스탄불의 어느 궁전 뒷문으로 들어갑니다."
 LR_JAC_dutch_treaty:0 "헤이그 조약"
 LR_JAC_dutch_treaty_desc:0 "왕들의 유럽에서 의회를 가진 이웃은 몇 되지 않습니다. 네덜란드 상인 공화국도 대전쟁에서 중립을 지키며 혼자였습니다. 헤이그에서 두 공화국이 우호 조약을 맺습니다."
 LR_JAC_american_contact:0 "필라델피아의 친구들"
 LR_JAC_american_contact_desc:0 "150년 전 북아메리카 식민지의 독립 전쟁은 군대를 하나로 묶을 지휘관이 없어 무너졌습니다. 라파예트의 이름은 대서양 건너에서 아직 쓸모가 있습니다. 버지니아의 조지 워싱턴이라는 장군에게 비밀 편지를 보냅니다."
 LR_GIR_merchant_envoys:0 "상인 사절단"
 LR_GIR_merchant_envoys_desc:0 "외교관 대신 은행가들이 런던과 암스테르담으로 갑니다. 그들은 조약문 대신 어음을 들고 갑니다. 전쟁보다 빠르고, 대개는 더 효과적입니다."
 LR_GIR_atlantic_trade:0 "대서양 무역"
 LR_GIR_atlantic_trade_desc:0 "보르도는 18세기에 대서양 무역으로 부자가 된 도시입니다. 그 부두에 다시 신대륙의 깃발을 단 배들이 들어옵니다. 북아메리카의 담배와 브라질의 커피가 부두에 쌓입니다."
 LR_MAR_vienna_talks:0 "빈 협상"
 LR_MAR_vienna_talks_desc:0 "입헌 군주정은 왕들과도 대화할 수 있다고 푀양파는 믿습니다. 왕들의 유럽은 혁명 프랑스를 두려워했지만 헌법 아래의 왕이라면 다를 것입니다. 혁명 이후 처음으로 합스부르크의 대사가 파리에 돌아옵니다."
 LR_MAR_london_model:0 "영국식 의회"
 LR_MAR_london_model_desc:0 "영국은 프랑스를 무릎 꿇린 적이지만 의회를 운영하는 법만큼은 배울 만합니다. 웨스트민스터에 의회 시찰단을 보냅니다. 시찰단은 질문 시간과 원내 총무라는 제도를 받아 적어 옵니다."
 LR_COM_workers_embassy:0 "노동자 대사관"
 LR_COM_workers_embassy_desc:0 "왕실 외교관들은 코뮌을 위해 일하지 않습니다. 그들을 해임하고 선반공과 광부 출신 대사들을 유럽의 수도로 보냅니다. 만찬 예절은 서툴지만 그들의 가방에는 전단이 가득합니다."
 LR_NAP_marriage_diplomacy:0 "제국 혼인 외교"
 LR_NAP_marriage_diplomacy_desc:0 "유럽의 오랜 왕가들은 벼락출세한 황제를 같은 식탁에 앉히지 않았습니다. 혼인은 그 식탁에 자리를 얻는 가장 빠른 길입니다. 오랜 왕가의 공주 하나가 튈르리 궁으로 시집오고, 유럽의 왕들이 입술을 깨물며 축하 전보를 보냅니다."
 LR_GUA_national_reconciliation:0 "국민 화해"
 LR_GUA_national_reconciliation_desc:0 "왕당파 지도자와 코뮌 지도자는 3년 전만 해도 서로를 총살하려 했습니다. 그 두 사람이 한 탁자에 마주 앉습니다. 대통령이 직접 사회를 봅니다."
 LR_BOU_italian_arms:0 "왕의 소총"
 LR_BOU_italian_arms_desc:0 "나폴리의 사촌은 의용병만으로는 토리노를 이길 수 없습니다. 툴롱 부두에서 농기구라고 적힌 나무 상자들이 나폴리행 화물선에 실립니다. 상자는 유난히 무겁고, 프랑스 무기고의 소총 선반이 그만큼 빕니다."
 LR_BOU_north_italy:0 "피에몬테로"
 LR_BOU_north_italy_desc:0 "로마와 피렌체가 떨어졌습니다. 남은 것은 오스트리아가 뒤를 봐주는 토리노뿐입니다. 마지막 싸움을 앞둔 나폴리의 사촌에게 소총과 포탄을 더 보냅니다."
 LR_BOU_italian_kingdom:0 "이탈리아 왕국"
 LR_BOU_italian_kingdom_desc:0 "나폴리의 왕이 로마에서 이탈리아의 왕관을 씁니다. 약속대로 그는 이제 부르봉 동맹의 일원으로 프랑스 곁에 섭니다. 밀라노와 베네치아에는 아직 오스트리아 깃발이 걸려 있습니다."
 LR_ORL_royal_roads:0 "왕립 고속도로"
 LR_ORL_royal_roads_desc:0 "실업자들에게 삽을 쥐여 줄 곳이 필요합니다. 왕립 고속도로는 공식적으로 관광 도로입니다. 그런데 이상하게도 새 길은 모두 파리에서 라인강 쪽으로 곧게 뻗어 있습니다."
 LR_ORL_renault_seized:0 "르노 공장 접수"
 LR_ORL_renault_seized_desc:0 "루이 르노는 왕의 군수 계약을 세 번 거절했습니다. 왕실 군수국 관리들이 비양쿠르 공장 정문을 열고 들어갑니다. 트럭 생산 라인은 오늘부터 전차를 만듭니다."
 LR_ORL_officers_oath:0 "장교단의 충성 서약"
 LR_ORL_officers_oath_desc:0 "쿠데타로 선 왕은 다음 쿠데타를 두려워합니다. 장교들이 헌법이 아니라 왕 개인에게 충성을 맹세하는 의식이 앵발리드에서 열립니다. 맹세문에서 국가라는 단어가 빠졌다는 것을 눈치챈 장교는 많지 않습니다."
 LR_ORL_camelots:0 "왕의 행동대"
 LR_ORL_camelots_desc:0 "왕당파 청년 행동대가 지팡이를 들고 파리 대로를 몰려다닙니다. 반대파 신문사의 유리창은 하루도 성할 날이 없습니다. 경찰은 늘 조금 늦게 도착하고, 왕은 그 일에 대해 아무 말도 하지 않습니다."
 LR_ORL_madrid_renounce:0 "스페인 왕위 포기 선언"
 LR_ORL_madrid_renounce_desc:0 "부르봉 왕가의 마드리드 사촌들은 오를레앙 가문을 늘 의심해 왔습니다. 스페인 왕위를 넘볼지 모른다는 것입니다. 왕은 그 의심을 끝내려고 스페인 왕위 포기를 공식 선언하고, 남쪽 국경을 조용히 만듭니다."
 LR_ORL_royal_security:0 "왕실 보안국"
 LR_ORL_royal_security_desc:0 "혁명파는 뿌리 뽑혔지만 그 명단은 아직 깁니다. 전화국과 우체국마다 왕실 보안국 사람이 앉습니다. 공화주의자들의 편지는 배달되기 전에 한 번 더 읽힙니다."
 LR_BOU_royal_manufactures:0 "왕립 매뉴팩처"
 LR_BOU_royal_manufactures_desc:0 "콜베르는 왕립 매뉴팩처로 루이 14세의 군대와 궁전을 채웠습니다. 그 전통을 되살립니다. 왕의 인장이 찍힌 공장에는 왕의 주문이 먼저 들어가고, 왕의 은행이 먼저 돈을 댑니다."
 LR_BOU_peasant_credit:0 "농민 대출 금고"
 LR_BOU_peasant_credit_desc:0 "방데와 브르타뉴의 농민들은 1793년에 왕을 위해 싸웠습니다. 그 손자들은 지금 고리대금업자의 빚에 묶여 있습니다. 왕실 금고가 농민의 빚을 대신 떠안습니다. 시골의 충성은 원래 이렇게 사는 것입니다."
 LR_BOU_salic_law:0 "살리카 법 재확인"
 LR_BOU_salic_law_desc:0 "오를레앙 가문은 쿠데타가 꺾인 뒤에도 왕위 계승권을 주장해 왔습니다. 여계 계승을 금한 살리카 법이 그 주장을 막을 수 있습니다. 왕실 법정에서 살리카 법을 다시 확인합니다."
 LR_BOU_swiss_guard:0 "스위스 근위대 재건"
 LR_BOU_swiss_guard_desc:0 "1792년 8월 튈르리 궁에서 왕을 지키던 스위스 근위대는 전멸했습니다. 이번 쿠데타에서도 왕을 끝까지 지킨 것은 장교단이 아니었습니다. 루체른에서 모집한 붉은 제복의 근위병들이 궁전 정문에 다시 섭니다."
 LR_BOU_lisbon_treaty:0 "리스본 조약"
 LR_BOU_lisbon_treaty_desc:0 "리스본의 왕가도 마드리드와 파리의 먼 친척입니다. 브라질 부왕령의 금은 리스본을 거쳐 유럽으로 들어옵니다. 라틴 왕가 동맹에 리스본의 사촌도 초대합니다."
 LR_BOU_parish_registers:0 "교구 등록부"
 LR_BOU_parish_registers_desc:0 "마을 신부는 세례와 혼인을 교구 등록부에 적어 왔습니다. 이제 그 등록부에 새 항목이 생깁니다. 미사에 나오지 않는 사람, 공화국 신문을 읽는 사람. 신부는 그 이름들도 꼼꼼히 적습니다."
 LR_COM_electrification:0 "전국 전력망"
 LR_COM_electrification_desc:0 "프랑스 시골의 절반은 아직 석유등으로 밤을 밝힙니다. 위원회는 코뮌이란 노동자의 권력 더하기 전기라고 말합니다. 마을마다 전신주가 서고 처음으로 전등이 켜집니다."
 LR_COM_five_year_plan:0 "5개년 계획"
 LR_COM_five_year_plan_desc:0 "계획위원회가 시청 벽에 커다란 숫자들을 붙입니다. 강철 몇 톤, 대포 몇 문, 트랙터 몇 대. 목표를 넘긴 공장의 이름은 신문 1면에 실리고, 못 미친 공장장은 위원회에 불려 갑니다."
 LR_COM_workers_university:0 "노동자 대학"
 LR_COM_workers_university_desc:0 "소르본의 강의실은 수백 년 동안 귀족과 부르주아의 아들들 차지였습니다. 그 육중한 문이 선반공과 재봉사에게 열립니다. 야간 강의실이 작업복 차림의 학생들로 가득 차고, 늙은 교수들은 수업을 계속할지 고민합니다."
 LR_COM_french_road:0 "프랑스식 사회주의"
 LR_COM_french_road_desc:0 "러시아의 길도, 다른 누구의 길도 아닙니다. 프랑스에는 1793년의 공안위원회와 1871년의 파리 코뮌이라는 두 전통이 있습니다. 그 위에 프랑스만의 사회주의를 세웁니다."
 LR_COM_world_republic:0 "세계 공화국 선언"
 LR_COM_world_republic_desc:0 "파리는 더는 프랑스의 수도가 아니라 세계 혁명의 수도라고 코뮌은 말합니다. 국경을 지우는 세계 공화국 선언문이 시청에서 낭독됩니다. 유럽의 모든 왕궁에서 비상 회의가 열립니다."
 LR_COM_workers_solidarity:0 "국제 노동 연대"
 LR_COM_workers_solidarity_desc:0 "암스테르담의 부두 노동자들이 파업 중입니다. 네덜란드 공화국 정부는 그들에게 군대를 보낼지 고민하고 있습니다. 코뮌이 파업 기금을 보냅니다. 네덜란드 정부는 불쾌해하면서도 그 돈을 돌려보내지는 않습니다."
 LR_COM_neighbourhood_committees:0 "구역 위원회"
 LR_COM_neighbourhood_committees_desc:0 "왕당파는 아직 파리의 아파트에 숨어 있습니다. 모든 건물, 모든 계단참마다 위원이 한 명씩 생깁니다. 누가 몇 시에 들어오고 누구를 만나는지 위원은 다 압니다."
 LR_JAC_public_housing:0 "공공 주택"
 LR_JAC_public_housing_desc:0 "파리 외곽의 판자촌에는 지붕 없는 집이 수천 채입니다. 판자촌을 밀어내고 붉은 벽돌의 노동자 주택을 올립니다. 그 벽돌을 쌓은 벽돌공들이 다음 선거에서 공화국에 표를 줄 것입니다."
 LR_JAC_arsenal_of_people:0 "시민의 조병창"
 LR_JAC_arsenal_of_people_desc:0 "국유화된 군수 공장이 공화국의 대포를 만듭니다. 이윤은 주주가 아니라 국고로 들어갑니다. 공장 정문에 시민의 조병창이라는 새 간판이 걸립니다."
 LR_JAC_republican_clubs:0 "공화주의 클럽"
 LR_JAC_republican_clubs_desc:0 "1789년 자코뱅 클럽은 파리 생토노레 거리의 수도원에서 모였습니다. 그 이름을 이은 토론회가 전국 도시마다 생깁니다. 저녁마다 카페 2층에서 정치 토론이 벌어지고, 그 자리가 선거 운동 본부가 됩니다."
 LR_JAC_free_press:0 "언론 자유법"
 LR_JAC_free_press_desc:0 "왕의 검열관들이 일자리를 잃었습니다. 다음 날 아침 가판대의 신문이 두 배로 늘었고, 그 가운데 절반은 정부를 욕합니다. 공화국은 그것을 견뎌야 합니다."
 LR_JAC_swiss_asylum:0 "제네바의 망명자들"
 LR_JAC_swiss_asylum_desc:0 "유럽 왕국들에서 쫓겨난 자유주의자들이 제네바 호숫가의 하숙집에 모여 있습니다. 공화국이 그들에게 프랑스 여권을 발급합니다. 왕들의 대사관은 항의 서한을 보냅니다."
 LR_JAC_citizen_police:0 "시민 경찰"
 LR_JAC_citizen_police_desc:0 "왕의 비밀경찰은 혁명가들의 명단을 서른 해 동안 모아 왔습니다. 그 경찰을 해산하고, 지방 의회가 감독하는 시민 경찰을 세웁니다. 옛 서류함에서 나온 사찰 기록은 광장에서 불태웁니다."
 LR_GIR_bordeaux_wharves:0 "보르도 부두"
 LR_GIR_bordeaux_wharves_desc:0 "가론강 변의 부두는 18세기에 지은 그대로입니다. 대형 증기선은 강을 거슬러 올라오지 못합니다. 부두를 넓히고 새 기중기를 올려 지롱드의 고향이 다시 대서양을 바라보게 합니다."
 LR_GIR_credit_lyonnais:0 "리옹 신용은행"
 LR_GIR_credit_lyonnais_desc:0 "공장을 지으려면 은행이 필요하고, 은행은 정부의 보증을 원합니다. 리옹 신용은행이 공장에 돈을 대고, 공장이 내각에 돈을 댑니다. 그 은행의 이사회 회의실은 이제 장관실보다 문턱이 높습니다."
 LR_GIR_press_barons:0 "언론 재벌"
 LR_GIR_press_barons_desc:0 "선거는 신문이 이깁니다. 대형 신문사 사주들이 내각 편에 섭니다. 그 대가로 정부 광고와 종이 배급이 그들에게 먼저 돌아갑니다."
 LR_GIR_hudson_loans:0 "뉴욕의 차관"
 LR_GIR_hudson_loans_desc:0 "북아메리카의 은행가들은 유럽에 돈을 빌려줄 곳을 찾고 있습니다. 그들이 보르도에 지점을 엽니다. 뉴욕의 돈은 국적을 묻지 않고 이자만 묻습니다."
 LR_GIR_civic_guard:0 "지방 시민군"
 LR_GIR_civic_guard_desc:0 "지롱드는 파리의 경찰을 믿지 않습니다. 1793년 파리 국민방위대가 지롱드파를 체포했기 때문입니다. 질서를 지키는 일을 각 데파르트망의 시민군에 맡기고, 보르도와 마르세유의 시민군은 제복 색깔부터 다르게 맞춥니다."
 LR_MAR_agrarian_credit:0 "농업 신용"
 LR_MAR_agrarian_credit_desc:0 "농민들은 쟁기와 비료를 살 돈이 없습니다. 지방 명사들이 세운 은행이 농민들에게 돈을 빌려줍니다. 농민들은 비료를 사고, 명사들은 다음 선거의 표를 삽니다."
 LR_MAR_chartered_works:0 "칙허 회사"
 LR_MAR_chartered_works_desc:0 "공장을 국가가 세우면 혁명이고, 은행이 세우면 투기입니다. 푀양파는 그 중간을 찾습니다. 왕의 칙허와 의회의 예산이 함께 들어간 공장의 이사회에 왕실 관리와 의원이 나란히 앉아 서로를 감시합니다."
 LR_MAR_parliament_coronation:0 "의회의 대관식"
 LR_MAR_parliament_coronation_desc:0 "1791년의 왕은 헌법에 맹세한 지 석 달 만에 바렌으로 달아났습니다. 이번 왕은 랭스 대성당에 가기 전에 먼저 의회에 들러야 합니다. 의원들 앞에서 헌법에 손을 얹고 맹세한 뒤에야 왕관을 씁니다."
 LR_MAR_hague_arbitration:0 "헤이그 중재 재판"
 LR_MAR_hague_arbitration_desc:0 "푀양파는 전쟁보다 법정을 믿습니다. 국가 간 분쟁을 헤이그 중재 재판소로 가져가자고 제안합니다. 유럽의 왕들은 비웃었지만 그래도 대표는 보냅니다."
 LR_MAR_bourgeois_guard:0 "국민방위대"
 LR_MAR_bourgeois_guard_desc:0 "1789년 라파예트의 국민방위대는 재산 있는 시민들이 질서를 지키는 군대였습니다. 흰 깃털 모자가 다시 거리에 나타납니다. 노동자 동네 사람들은 그 제복을 좋아하지 않습니다."
 LR_NAP_prefects:0 "도지사 제도"
 LR_NAP_prefects_desc:0 "지방 권력은 귀족과 혁명 위원회가 나눠 쥐고 있습니다. 파리가 임명한 도지사가 83개 데파르트망에 한 명씩 내려갑니다. 모든 권력이 한 줄의 명령 체계로 묶입니다."
 LR_NAP_imperial_works:0 "제국 대공사"
 LR_NAP_imperial_works_desc:0 "황제의 영광은 보기에도 좋아야 하고 쓸모도 있어야 합니다. 샹젤리제 끝에 개선문이 또 하나 올라갑니다. 대리석 기둥 뒤로 공장 굴뚝과 새 운하가 함께 들어섭니다."
 LR_NAP_imperial_catechism:0 "제국 교리문답"
 LR_NAP_imperial_catechism_desc:0 "주일 학교의 교리문답에 새 단원이 생깁니다. 그리스도인은 황제에게 무엇을 빚졌는가. 아이들은 사랑, 존경, 복종, 군 복무, 세금이라고 외웁니다. 교황청은 아직 그 단원을 승인하지 않았습니다."
 LR_NAP_sister_kingdoms:0 "자매 왕국"
 LR_NAP_sister_kingdoms_desc:0 "황제의 형제들이 정복한 나라들의 왕좌에 앉습니다. 조약문에는 동맹이라고 적혀 있습니다. 그 왕들이 누구의 명령을 받는지는 유럽 모두가 압니다."
 LR_NAP_old_guard:0 "노근위대"
 LR_NAP_old_guard_desc:0 "황제와 함께 알제리에서부터 모든 전장을 겪은 고참병들이 있습니다. 그들이 곰가죽 모자를 쓰고 노근위대로 모입니다. 그들은 투덜대면서도 황제를 따릅니다. 제국이 마지막에 내밀 예비대입니다."
 LR_GUA_workers_compensation:0 "산업 재해 보상"
 LR_GUA_workers_compensation_desc:0 "공장에서 손을 잃은 노동자는 아무것도 받지 못합니다. 대통령이 그들에게 공화국의 연금을 주자고 합니다. 사장들이 비용을 걱정하자, 그는 병사의 부상에도 연금을 주는데 노동자라고 다를 게 없다고 답합니다."
 LR_GUA_republican_senate:0 "공화국 상원"
 LR_GUA_republican_senate_desc:0 "대통령이 스스로 자기 권한을 나눠 상원에 넘깁니다. 측근들은 경악합니다. 이 법이 통과되면 다음 대통령은 군인이 아닐지도 모릅니다. 대통령은 그것이 목적이라고 말합니다."
 LR_GUA_european_congress:0 "유럽 공화주의자 회의"
 LR_GUA_european_congress_desc:0 "유럽 각국의 공화주의자들이 왕들의 경찰을 피해 국경을 넘어왔습니다. 그들이 파리에서 대회를 엽니다. 빈 체제 이래 처음으로 공화주의자들이 한 나라의 정부 아래 공개적으로 모입니다. 대통령이 개막 연설을 합니다."
 LR_GUA_truth_commission:0 "진상 조사 위원회"
 LR_GUA_truth_commission_desc:0 "왕정은 혁명가들을 총살했고 혁명은 왕당파를 총살했습니다. 그 범죄들을 한 위원회가 함께 조사합니다. 왕당파도 코뮌파도 불만이지만, 법정에서 싸우는 동안에는 총을 내려놓습니다."
 LR_MAR_creditors_talks:0 "채권자와의 대화"
 LR_MAR_creditors_talks_desc:0 "프랑스는 아직 런던의 채무자입니다. 배상금 장부를 쥔 시티의 은행가들은 혁명보다 파산을 더 두려워합니다. 재무장관이 도버행 배에 오릅니다. 이번에는 사과가 아니라 제안을 들고 갑니다."
 LR_MAR_reparations_rescheduled:0 "배상금 재조정 협정"
 LR_MAR_reparations_rescheduled_desc:0 "상환 기한을 스무 해 늘리고, 이자의 절반을 프랑스 철도 채권으로 받습니다. 런던은 돈을 받고 파리는 숨을 쉽니다. 의회 우파는 굴욕이라 외치지만, 빵값은 석 달 만에 내려갑니다."
 LR_MAR_channel_agreement:0 "해협 신사협정"
 LR_MAR_channel_agreement_desc:0 "포츠머스와 브레스트의 제독들이 한 식탁에 앉습니다. 해협에서는 서로의 함대를 세지 않기로 합니다. 백 년 전쟁 이래 처음으로 프랑스 해군이 북쪽을 등지고 지중해를 봅니다."
 LR_MAR_entente_cordiale:0 "앙탕트 코르디알"
 LR_MAR_entente_cordiale_desc:0 "웨스트민스터를 본뜬 헌법을 가진 나라가 웨스트민스터의 동맹이 됩니다. 1918년의 승전국과 패전국이 같은 깃발 아래 섭니다. 라인강의 복수를 꿈꾸던 장교들은 이 조약을 끝내 용서하지 않을 것입니다."
 LR_MAR_eastern_crusade:0 "동방 원정"
 LR_MAR_eastern_crusade_desc:0 "영국은 대륙에 군대를 보내지 않습니다. 그 대신 러시아 공화국이 유럽의 질서를 흔들 때 그것을 막을 칼을 원합니다. 프랑스가 그 칼이 됩니다. 이번에는 패배를 씻는 전쟁이 아니라 동맹의 값을 치르는 전쟁입니다."
 LR_MAR_salon_doctrinaires:0 "공론가들의 살롱"
 LR_MAR_salon_doctrinaires_desc:0 "기조와 루아예콜라르의 책이 다시 팔립니다. 생제르맹의 살롱에서 은행가와 교수들이 왕권과 의회의 경계를 밤새 다툽니다. 그들의 결론은 늘 같습니다. 질서는 재산 있는 자의 손에 있어야 합니다."
 LR_MAR_responsible_ministry:0 "책임 내각제"
 LR_MAR_responsible_ministry_desc:0 "장관은 왕이 아니라 의회에 답합니다. 왕은 서명하고, 총리는 설명합니다. 1830년에 피를 흘리고서야 얻었던 원칙을 이번에는 법전 한 줄로 얻습니다."
 LR_BOU_schonbrunn_envoy:0 "쇤브룬의 사절"
 LR_BOU_schonbrunn_envoy_desc:0 "마리 앙투아네트의 나라에 부르봉의 사절이 갑니다. 빈의 궁정은 프랑스 혁명을 꺾은 왕을 의심 반, 호기심 반으로 맞습니다. 사절의 짐 속에는 루이 16세의 편지 사본이 들어 있습니다."
 LR_BOU_habsburg_marriage:0 "합스부르크 혼약"
 LR_BOU_habsburg_marriage_desc:0 "왕세자와 합스부르크 대공녀의 혼담이 오갑니다. 두 왕가는 세 세기 동안 서로 싸웠고 그만큼 자주 결혼했습니다. 파리의 신문은 혼수 목록을 1면에 싣고, 혁명가들은 단두대 그림을 담벼락에 그립니다."
 LR_BOU_catholic_crowns:0 "가톨릭 왕관 협약"
 LR_BOU_catholic_crowns_desc:0 "빈과 파리와 마드리드가 교황 앞에서 서로의 왕좌를 보장합니다. 혁명은 한 나라의 일이 아니라 모든 왕관의 적입니다. 협약문 초안은 2차 대불전쟁 뒤 맺은 신성 동맹의 문장을 거의 그대로 옮겼습니다."
 LR_BOU_diplomatic_revolution:0 "외교 혁명"
 LR_BOU_diplomatic_revolution_desc:0 "1756년 카우니츠는 영국을 버리고 베르사유와 손잡았습니다. 오늘 빈의 외무장관이 같은 결정을 내립니다. 런던의 제국연맹에서 오스트리아의 의자가 빕니다. 유럽의 지도가 하룻밤 사이에 다시 그려집니다."
 LR_BOU_royal_touch:0 "왕의 손길"
 LR_BOU_royal_touch_desc:0 "랭스의 대관식 다음 날, 왕이 생마르쿨 수도원에서 연주창 환자들의 이마를 만집니다. 의사들은 웃지만 몰려든 농민은 수천 명입니다. 왕이 낫게 하는지는 몰라도 왕을 믿게 하는 것은 확실합니다."
 LR_BOU_bishops_council:0 "주교 회의"
 LR_BOU_bishops_council_desc:0 "혁명이 빼앗았던 교회 재산의 일부가 돌아갑니다. 그 대가로 주교들은 강론에서 왕의 이름을 먼저 부릅니다. 공화주의 교사들은 학교에서 성호를 긋는 아이들을 보며 이를 갑니다."
 LR_ORL_revenge_oath:0 "복수의 맹세"
 LR_ORL_revenge_oath_desc:0 "앵발리드의 돔 아래서 대전쟁 참전 용사 만 명이 왕 앞에 무릎을 꿇습니다. 그들은 1918년 11월의 날짜를 군모 안쪽에 새겨 넣었습니다. 그 날짜를 지울 때까지 이 맹세는 끝나지 않습니다."
 LR_ORL_officer_purge:0 "장교단 숙청"
 LR_ORL_officer_purge_desc:0 "왕실이 고른 늙은 장군들 가운데 쿠데타를 반대한 자들의 명단이 작성됩니다. 그들은 연금을 받고 지방으로 갑니다. 빈자리는 알제리에서 피를 본 대령들이 채웁니다."
 LR_ORL_war_industries_office:0 "군수 산업청"
 LR_ORL_war_industries_office_desc:0 "슈네데르와 르노와 시트로엥의 사장들이 왕실 군수청 회의실에 불려 옵니다. 그들에게는 선택권이 없습니다. 대신 계약서의 숫자가 큽니다."
 LR_JAC_public_safety:0 "공안 위원회"
 LR_JAC_public_safety_desc:0 "1793년의 이름이 다시 의사당에 걸립니다. 이번 위원회에는 단두대가 없습니다. 대신 은행 장부와 신문사 소유권 명부를 엽니다. 왕당파 장교 서른 명이 퇴역 통지를 받습니다."
 LR_JAC_citizen_army_law:0 "시민군 법"
 LR_JAC_citizen_army_law_desc:0 "모든 시민은 병사이고 모든 병사는 시민입니다. 장교는 연대 투표로 추천되고, 귀족 출신 장교의 특권은 폐지됩니다. 생시르의 교관들은 반발하지만 지원자 수는 두 배가 됩니다."
 LR_JAC_pantheon_ceremony:0 "팡테옹 안장식"
 LR_JAC_pantheon_ceremony_desc:0 "조레스의 유해가 팡테옹으로 옮겨집니다. 대전쟁 직전 암살당한 사회주의자를 공화국이 위인으로 모십니다. 수플로 거리를 따라 노동자들이 붉은 카네이션을 던집니다."
 LR_GIR_bordeaux_exchange:0 "보르도 거래소"
 LR_GIR_bordeaux_exchange_desc:0 "지롱드 사람들의 수도는 언제나 보르도였습니다. 파리 증권거래소의 독점을 깨고 보르도에 두 번째 거래소를 엽니다. 포도주 상인과 선주들이 첫날 거래량으로 파리를 앞지릅니다."
 LR_GIR_departmental_charter:0 "데파르트망 자치 헌장"
 LR_GIR_departmental_charter_desc:0 "파리가 모든 것을 정하던 시대가 끝납니다. 각 데파르트망은 자기 예산과 자기 의회를 갖습니다. 리옹과 마르세유는 환호하고 파리 시청은 침묵합니다."
 LR_GIR_colonial_bank:0 "대서양 식민 은행"
 LR_GIR_colonial_bank_desc:0 "다카르와 아비장과 카옌을 잇는 은행이 문을 엽니다. 남은 식민지에서 나는 땅콩과 카카오와 금이 보르도로 옵니다. 은행 이사회 명단의 절반은 지롱드 의원의 사촌입니다."
 LR_COM_mandat_imperatif:0 "명령적 위임"
 LR_COM_mandat_imperatif_desc:0 "대의원은 언제든 소환될 수 있습니다. 공장 총회가 손을 들면 그 대의원은 다음 날 아침 공장으로 돌아갑니다. 파리 코뮌이 1871년에 약속했던 원칙이 법이 됩니다."
 LR_COM_workers_militia:0 "노동자 민병대"
 LR_COM_workers_militia_desc:0 "공장마다 무기고가 생깁니다. 교대가 끝난 선반공들이 소총을 메고 운하 둑을 따라 행진합니다. 붉은 군대의 장교들은 이 민병대를 오합지졸이라 부르지만, 바리케이드에서는 그들이 더 빠릅니다."
 LR_COM_commune_calendar:0 "코뮌 기념일"
 LR_COM_commune_calendar_desc:0 "3월 18일이 국경일이 됩니다. 몽마르트르 언덕에 1871년 연맹병들의 이름이 새겨진 벽이 섭니다. 아이들은 학교에서 그 이름을 외웁니다."
 LR_ANA_federal_pact:0 "연방 협약"
 LR_ANA_federal_pact_desc:0 "프루동이 꿈꾼 대로, 코뮌들은 서로 계약을 맺어 연방을 이룹니다. 누구도 누구를 다스리지 않습니다. 협약문은 열네 쪽이고, 마지막 쪽에는 탈퇴 조항이 있습니다."
 LR_ANA_column_discipline:0 "종대의 규율"
 LR_ANA_column_discipline_desc:0 "장교는 없지만 규율은 있습니다. 종대마다 선출된 대표가 작전 회의에 들어갑니다. 계급장 대신 검은 완장을 찬 병사들이 스페인 내전의 교훈을 손으로 받아 적습니다."
 LR_ANA_free_schools:0 "자유 학교"
 LR_ANA_free_schools_desc:0 "페레르의 합리주의 학교가 마을마다 섭니다. 시험도 체벌도 교리문답도 없습니다. 공장 노동자들이 밤에 같은 교실에서 화학과 기하학을 배웁니다."
 LR_NAP_council_of_state:0 "국무원"
 LR_NAP_council_of_state_desc:0 "통령은 법률가 마흔 명을 국무원에 앉힙니다. 그들은 밤새 법조문을 다듬고, 통령은 새벽에 들어와 한 줄씩 지웁니다. 국무원은 두려워하면서도 그 새벽을 기다립니다."
 LR_NAP_lycees:0 "국립 리세"
 LR_NAP_lycees_desc:0 "데파르트망마다 국립 고등학교가 섭니다. 학생들은 군복을 닮은 교복을 입고, 북소리에 맞춰 교실을 옮깁니다. 졸업생은 공무원이 되거나 장교가 됩니다."
 LR_NAP_gendarmerie_nationale:0 "국가 헌병대"
 LR_NAP_gendarmerie_nationale_desc:0 "산적과 왕당파 게릴라가 들끓던 시골길에 헌병대가 다시 순찰을 돕니다. 그들은 통령에게 직접 보고합니다. 지방 명사들은 처음으로 밤에 문을 열어 둡니다."
 LR_NAP_imperial_eagles:0 "독수리 기장"
 LR_NAP_imperial_eagles_desc:0 "연대마다 금빛 독수리 기장이 내려집니다. 황제가 직접 샹드마르스에서 나누어 주며 말합니다. 이 독수리를 잃느니 죽으라고. 병사들은 그 말을 농담으로 듣지 않습니다."
 LR_NAP_imperial_court:0 "제국 궁정"
 LR_NAP_imperial_court_desc:0 "튈르리 궁에 다시 시종장과 의전관이 섭니다. 대혁명 이전의 귀족과 새 제국 귀족이 같은 무도회장에 섭니다. 옛 귀족은 새 귀족의 말투를 비웃고, 새 귀족은 옛 귀족의 빚을 비웃습니다."
 LR_NAP_conscription_decree:0 "징병 칙령"
 LR_NAP_conscription_decree_desc:0 "주르당 법이 다시 시행됩니다. 스무 살 남자는 모두 병적부에 이름을 올립니다. 마을마다 추첨 날이면 어머니들이 성당에 촛불을 켭니다."
 LR_GUA_presidential_address:0 "대통령 담화"
 LR_GUA_presidential_address_desc:0 "매주 일요일 밤 대통령이 라디오에 나옵니다. 그는 원고 없이 말하고, 가끔 말을 멈추고 기침을 합니다. 다음 날 아침 공장과 카페에서 사람들은 그 기침까지 흉내 냅니다."
 LR_GUA_council_of_honour:0 "명예 위원회"
 LR_GUA_council_of_honour_desc:0 "왕당파 원수와 공화파 노조 지도자가 같은 위원회에 앉습니다. 대통령은 그들에게 화해가 아니라 협력을 요구합니다. 첫 회의는 고성으로 끝났지만, 둘째 회의에는 둘 다 나왔습니다."
 LR_GUA_reserve_officers:0 "예비역 장교단"
 LR_GUA_reserve_officers_desc:0 "교사와 변호사와 기술자가 여름마다 군복을 입습니다. 공화국의 군대는 직업 군인만의 것이 아니라는 대통령의 신념입니다. 장군들은 반대했지만 예산은 의회를 통과했습니다."
 LR_RED_red_eagle:0 "붉은 독수리"
 LR_RED_red_eagle_desc:0 "독수리 기장이 붉게 칠해집니다. 병사들은 황제가 아니라 인민에게 맹세하지만, 맹세를 받는 사람은 여전히 코르시카의 포병 장교입니다. 코뮌의 위원들은 그 차이를 두고 밤새 논쟁합니다."
 LR_RED_levee_en_masse_red:0 "인민 총동원"
 LR_RED_levee_en_masse_red_desc:0 "1793년의 총동원령이 붉은 인쇄로 다시 붙습니다. 공장은 소총을, 농촌은 빵을, 학교는 병사를 냅니다. 노인들은 탄약 상자를 나르고 여자들은 천막을 꿰맵니다."
 LR_RED_commissar_corps:0 "인민 위원단"
 LR_RED_commissar_corps_desc:0 "연대마다 정치 위원이 장교 곁에 섭니다. 장교는 전투를 지휘하고 위원은 장교를 지켜봅니다. 통령은 두 사람 모두 자기에게 보고하게 만듭니다."
 LR_PET_work_family_fatherland:0 "노동, 가족, 조국"
 LR_PET_work_family_fatherland_desc:0 "자유, 평등, 박애가 관공서 현관에서 지워지고 새 표어가 새겨집니다. 원수는 프랑스가 진 것은 쾌락의 정신 때문이라고 말합니다. 많은 사람이 그 말에 고개를 끄덕입니다. 그만큼 패배는 길었습니다."
 LR_PET_peasant_return:0 "농촌 회귀"
 LR_PET_peasant_return_desc:0 "도시의 실업자들에게 땅과 씨앗을 줍니다. 원수는 흙은 거짓말을 하지 않는다고 말합니다. 공장 굴뚝 대신 밀밭이 프랑스의 얼굴이 되기를 바랍니다."
 LR_PET_verdun_veterans:0 "베르됭 전우회"
 LR_PET_verdun_veterans_desc:0 "원수와 함께 베르됭을 지킨 병사들이 전국 조직을 만듭니다. 그들은 마을마다 원수의 초상을 걸고, 젊은이들에게 참호의 이야기를 합니다. 이야기는 늘 버텼다는 말로 끝납니다."
 LR_ORL_cross_of_fire:0 "불의 십자단"
 LR_ORL_cross_of_fire_desc:0 "대전쟁의 재향군인들이 불의 십자단 깃발 아래 줄을 섭니다. 그들은 연금과 존경을 바라고 왔습니다. 왕이 그것을 주지 못하면 그들은 다른 깃발을 찾을 것입니다."
 LR_ORL_generals_cabinet:0 "장군들의 내각"
 LR_ORL_generals_cabinet_desc:0 "재무부 장부를 군인들이 읽기 시작합니다. 학교와 병원 예산 칸에 붉은 줄이 그어지고 그 옆에 포탄과 전차라고 적힙니다. 장군들의 내각은 전쟁 말고는 다른 계획이 없습니다."
 LR_ORL_inspectors_out:0 "감독관과의 숨바꼭질"
 LR_ORL_inspectors_out_desc:0 "배상 위원회의 영국인 감독관들이 왕실 병기창의 장부를 보자고 합니다. 대포에 쓴 프랑은 런던에 갚지 않은 프랑이기 때문입니다. 어젯밤 트럭 마흔 대가 창고를 비웠고, 장부에는 농기계만 남았습니다."
 LR_ORL_king_at_front:0 "국경의 왕"
 LR_ORL_king_at_front_desc:0 "왕이 파리를 비우고 동쪽 국경으로 갑니다. 보주산맥의 언덕에서는 라인강 너머 프로이센 땅이 내려다보입니다. 1918년 그 강을 건너 돌아오던 패잔병 가운데 젊은 오를레앙 공이 있었습니다."
 LR_ORL_colonels_plot:0 "대령들의 음모"
 LR_ORL_colonels_plot_desc:0 "왕이 너무 느리다고 생각하는 젊은 대령들이 있습니다. 그들은 장교 클럽 뒷방에서 밤늦게까지 모여 지도를 펼칩니다. 왕실 보안국은 그 모임을 알고 있고, 왕은 아직 그들을 부르지 않았습니다."
 LR_ORL_day_of_revenge:0 "복수의 날"
 LR_ORL_day_of_revenge_desc:0 "1918년 11월 항복 문서에 서명하던 날, 파리의 시계들은 멈춘 것 같았습니다. 스무 해 동안 왕은 그 시계를 다시 돌릴 날을 준비했습니다. 병기창이 찼고 장교들이 젊어졌습니다. 그날이 왔습니다."
 LR_ORL_mobilisation_day:0 "동원의 날"
 LR_ORL_mobilisation_day_desc:0 "8월의 아침, 프랑스 전역의 교회 종이 한꺼번에 울립니다. 1914년에도 이 종소리로 전쟁이 시작되었습니다. 마을 광장마다 왕의 동원령이 붙고, 젊은이들이 역으로 걸어갑니다."
 LR_ORL_rhine_crossed:0 "라인강을 건너다"
 LR_ORL_rhine_crossed_desc:0 "프로이센이 무너졌습니다. 포츠담 상수시 궁전, 프리드리히 대왕의 서재에 프랑스 왕이 앉았습니다. 1871년 베르사유에서 독일 황제를 선포한 가문의 궁전입니다. 왕은 베를린을 어떻게 할지 정해야 합니다."
 LR_ORL_kings_europe:0 "왕들의 새 유럽"
 LR_ORL_kings_europe_desc:0 "튈르리 궁 회의실의 유럽 지도에는 프랑스의 색이 라인강 너머까지 칠해져 있습니다. 1918년의 항복 문서에 서명한 장군들은 모두 죽거나 물러났습니다. 복수는 끝났고, 왕은 이제 무엇을 남길지 정해야 합니다."
 LR_BOU_lit_de_justice:0 "친림 법정"
 LR_BOU_lit_de_justice_desc:0 "고등법원이 왕의 칙령 등록을 거부했습니다. 법관들은 쿠데타 이후 왕권이 약해졌다고 믿습니다. 왕이 직접 법정의 옥좌에 앉아 칙령을 등록시킵니다. 루이 15세 이후 처음 열리는 친림 법정입니다."
 LR_BOU_versailles_return:0 "베르사유 귀환"
 LR_BOU_versailles_return_desc:0 "베르사유 궁은 1789년 10월 이후 박물관이었습니다. 닫혀 있던 창문들이 다시 열리고 큐레이터들이 서둘러 짐을 쌉니다. 거울의 방에 왕의 의자가 돌아옵니다."
 LR_BOU_jesuits_return:0 "예수회의 귀환"
 LR_BOU_jesuits_return_desc:0 "예수회는 두 세기 전 프랑스에서 쫓겨났습니다. 그들은 학교를 다시 맡게 해 달라고 청원합니다. 왕실 고해 신부는 찬성하고 대학 총장들은 반대합니다. 왕은 프랑스의 아이들을 누구에게 맡길지 정해야 합니다."
 LR_BOU_kings_bread:0 "왕의 빵"
 LR_BOU_kings_bread_desc:0 "1789년 10월, 빵값에 분노한 파리의 여인들은 베르사유까지 걸어와 왕을 끌고 갔습니다. 빵값이 오르면 왕이 위험해진다는 것을 부르봉 가문만큼 잘 아는 집안은 없습니다. 왕실 곡물 창고를 엽니다."
 LR_BOU_madrid_letter:0 "마드리드에서 온 편지"
 LR_BOU_madrid_letter_desc:0 "마드리드의 사촌이 보낸 편지에 왕실 혼인 제안이 들어 있습니다. 피레네 양쪽의 부르봉 왕가가 다시 한 가족이 될 기회입니다. 지참금 이야기는 아직 아무도 꺼내지 않았습니다."
 LR_BOU_sun_king:0 "태양왕의 후계"
 LR_BOU_sun_king_desc:0 "궁정 사람들도 유럽의 대사들도 같은 것을 묻습니다. 루이 14세의 나라가 정말 돌아왔는가. 왕은 그 질문에 말이 아니라 행동으로 답해야 합니다."
 LR_BOU_te_deum:0 "출정 미사"
 LR_BOU_te_deum_desc:0 "출정하는 군대를 위해 노트르담에서 테 데움을 부릅니다. 왕은 성왕 루이의 검을 제단 위에 올려놓았다가 다시 집어 듭니다. 혁명 이후 처음으로 프랑스의 군대가 왕의 축복을 받고 전쟁에 나갑니다."
 LR_BOU_cousins_war:0 "사촌들의 전쟁"
 LR_BOU_cousins_war_desc:0 "프로이센이 무너졌다는 승전보가 마드리드와 나폴리에도 같은 날 전해졌습니다. 세 부르봉 왕가의 왕궁에서 축포가 울립니다. 사촌들의 전쟁은 아직 끝나지 않았습니다."
 LR_BOU_holy_alliance:0 "신성 동맹"
 LR_BOU_holy_alliance_desc:0 "2차 대불전쟁 뒤 빈에서 유럽의 왕들은 혁명 프랑스를 묶는 동맹을 맺었습니다. 그 왕들의 후손이 이번에는 부르봉의 초대로 베르사유 거울의 방에 모입니다. 신성 동맹을 다시 맺되, 이번에는 프랑스가 주인입니다."
 LR_COM_sections_congress:0 "48구역 대회"
 LR_COM_sections_congress_desc:0 "1793년 파리의 48개 구역은 국민공회를 움직인 진짜 권력이었습니다. 그 48구역이 다시 대표를 뽑아 보냅니다. 위원회는 그들이 박수만 칠지 질문을 할지 아직 모릅니다."
 LR_COM_elected_officers:0 "장교 문제"
 LR_COM_elected_officers_desc:0 "코뮌의 군대 장교 대부분은 왕의 사관학교 출신입니다. 병사 위원회는 장교도 투표로 뽑자고 합니다. 그들을 믿을 것인가, 병사들이 직접 고르게 할 것인가."
 LR_COM_tribunal:0 "혁명 재판소"
 LR_COM_tribunal_desc:0 "1793년의 혁명 재판소는 끝내지 못한 재판을 남기고 문을 닫았습니다. 그 법정이 다시 열립니다. 피고석에 누가 앉을지는 위원회가 정하고, 언제 문을 닫을지는 아무도 정하지 않았습니다."
 LR_COM_bread_and_coal:0 "빵과 석탄"
 LR_COM_bread_and_coal_desc:0 "왕들의 유럽이 코뮌을 봉쇄했습니다. 영국 석탄도 아르헨티나 밀도 들어오지 않습니다. 파리의 빵집 앞 줄이 길어지고, 위원회는 무엇을 먼저 배급할지 정해야 합니다."
 LR_COM_toulon_sailors:0 "툴롱의 수병들"
 LR_COM_toulon_sailors_desc:0 "혁명의 첫 총성은 툴롱 군항의 수병들이 쏘았습니다. 그 수병들이 이제 위원회에 대표를 보냈습니다. 그들은 묻습니다. 우리가 피를 흘린 혁명이 지금 이 모습이 맞느냐고."
 LR_COM_year_one:0 "혁명력 원년"
 LR_COM_year_one_desc:0 "1792년 공화국은 달력을 새로 만들고 그해를 원년이라 불렀습니다. 시청 벽에 다시 새 달력이 걸립니다. 포도의 달, 안개의 달, 서리의 달. 코뮌은 시간도 다시 셀 수 있다고 믿습니다."
 LR_COM_levee_red:0 "붉은 총동원"
 LR_COM_levee_red_desc:0 "왕들의 군대가 국경에 모였습니다. 1792년 국민공회는 시청 발코니에 조국이 위험하다는 현수막을 걸었습니다. 위원회가 같은 현수막을 걸고 총동원을 선언합니다."
 LR_COM_ruhr_soviets:0 "루르의 평의회"
 LR_COM_ruhr_soviets_desc:0 "프로이센이 무너졌습니다. 코뮌군이 도착하기 전에 에센의 크루프 공장을 광부들이 먼저 점거했습니다. 굴뚝마다 붉은 깃발이 걸렸습니다. 루르의 평의회를 어떻게 대할지 정해야 합니다."
 LR_COM_red_continent:0 "붉은 대륙"
 LR_COM_red_continent_desc:0 "유럽 절반에 붉은 깃발이 걸렸습니다. 2년 전만 해도 망명자였던 사람들이 이제 각자의 나라에서 정부를 이끕니다. 몽마르트르의 인터내셔널 회관에 대표 3백 명이 모이고, 코뮌이 무엇이 될지를 묻습니다."
 LR_JAC_matignon:0 "마티뇽 협상"
 LR_JAC_matignon_desc:0 "공장 점거가 전국으로 번졌습니다. 사장들은 군대를 원하고, 노조는 법을 원합니다. 노조 대표와 사장 대표가 총리 관저 마티뇽의 한 탁자에 마주 앉고, 밤새 협상이 이어집니다."
 LR_JAC_two_hundred:0 "200가문"
 LR_JAC_two_hundred_desc:0 "프랑스 은행 주주 총회에서 투표권을 가진 사람은 200명뿐입니다. 사람들은 그 200가문이 프랑스를 가졌다고 말합니다. 공화국은 그 말이 틀렸다는 것을 증명해야 합니다."
 LR_JAC_robespierre_portrait:0 "로베스피에르의 초상"
 LR_JAC_robespierre_portrait_desc:0 "공안위원회라는 이름을 쓴 이상 그 이름의 무게도 함께 물려받았습니다. 의사당 복도에 로베스피에르의 초상을 걸 것인가를 두고 의원들이 다툽니다. 초상 하나가 공화국이 무엇을 잇는지를 말해 줄 것입니다."
 LR_JAC_pyrenees_refugees:0 "피레네의 망명자들"
 LR_JAC_pyrenees_refugees_desc:0 "스페인 왕의 경찰을 피해 공화주의자들이 눈 덮인 피레네를 넘어옵니다. 국경 마을에 천막이 늘어섭니다. 마드리드는 그들을 돌려보내라고 요구합니다."
 LR_JAC_cagoule:0 "두건단"
 LR_JAC_cagoule_desc:0 "두건을 쓴 왕당파 장교들의 비밀 결사가 공장 두 곳을 폭파했습니다. 경찰은 범인들의 이름을 압니다. 그 명단에는 현역 장군의 이름도 있습니다."
 LR_JAC_fourteenth_july:0 "7월 14일"
 LR_JAC_fourteenth_july_desc:0 "1789년 7월 14일 파리 시민들이 바스티유를 무너뜨렸습니다. 왕정 아래서 그날은 한 번도 공휴일이 아니었습니다. 공화국이 그날을 국경일로 정하고, 바스티유 광장에서 첫 행진을 준비합니다."
 LR_JAC_war_vote:0 "개전 표결"
 LR_JAC_war_vote_desc:0 "공화국은 왕처럼 전쟁을 선포할 수 없습니다. 의회가 표결해야 합니다. 산악파 의원들은 1792년의 의용병 이야기를 꺼내고, 반대파는 1914년의 전사자 명단을 읽습니다. 표결이 열네 시간째 이어집니다."
 LR_JAC_liberators:0 "해방자인가 정복자인가"
 LR_JAC_liberators_desc:0 "프로이센이 무너졌습니다. 공화국 군대가 쾰른 시청 광장에서 왕의 동상을 끌어내리고 자유의 나무를 심습니다. 1794년 혁명군이 이 도시에 들어왔을 때 한 그대로입니다. 점령지를 어떻게 다스릴지 정해야 합니다."
 LR_JAC_sister_republics:0 "자매 공화국들"
 LR_JAC_sister_republics_desc:0 "1790년대 혁명 프랑스는 바타비아와 헬베티아에 자매 공화국을 세웠다가 2차 대불전쟁에서 모두 잃었습니다. 프랑스 군대가 지나간 땅마다 다시 공화국이 섭니다. 그 대표들이 뤽상부르 궁에 모입니다."
 LR_GIR_bordeaux_congress:0 "보르도 대회"
 LR_GIR_bordeaux_congress_desc:0 "지롱드의 고향 보르도에 전국의 상공인들이 모였습니다. 그들이 내각에 조건을 내겁니다. 세금을 줄이고 규제를 풀면 다음 선거 자금은 걱정하지 말라고."
 LR_GIR_paris_question:0 "파리 문제"
 LR_GIR_paris_question_desc:0 "지롱드는 파리가 1793년에도, 1848년에도, 1871년에도 혁명을 망쳤다고 믿습니다. 파리의 거리는 늘 지방의 표보다 빨랐습니다. 이번에는 파리의 바리케이드가 아니라 지방의 표가 공화국을 정해야 합니다."
 LR_GIR_atlantic_company:0 "대서양 회사"
 LR_GIR_atlantic_company_desc:0 "선주들이 공화국 칙허를 받은 대서양 무역 회사를 세우자고 합니다. 회사 이름과 정관은 암스테르담의 동인도 회사에서 빌려 왔습니다. 다카르와 카옌과 마르티니크를 잇는 항로가 첫 사업입니다."
 LR_GIR_bourse_panic:0 "증권가의 공황"
 LR_GIR_bourse_panic_desc:0 "자유 시장에도 겨울은 옵니다. 증권거래소 객장에서 비명이 터지고 철도 주식이 하루 만에 3분의 1로 떨어집니다. 산악파 신문들은 이날을 기다려 왔습니다. 내각은 시장을 구할지 그대로 둘지 정해야 합니다."
 LR_GIR_federal_draft:0 "연방 헌법 초안"
 LR_GIR_federal_draft_desc:0 "1793년 콩도르세는 프랑스를 83개 데파르트망의 연방으로 만드는 헌법 초안을 썼습니다. 그 초안은 지롱드파와 함께 단두대에 올랐습니다. 국립 문서고 금고에서 그 초안을 다시 꺼냅니다."
 LR_GIR_merchant_republic:0 "상인들의 공화국"
 LR_GIR_merchant_republic_desc:0 "프랑스의 다음 세기를 누가 쓸 것인가. 장군도 왕도 아닌 상인과 은행가와 선주들이 그 답을 내놓으려 합니다. 보르도와 리옹과 마르세유가 파리보다 먼저 말할 차례입니다."
 LR_GIR_war_bonds:0 "전쟁 채권"
 LR_GIR_war_bonds_desc:0 "지롱드는 전쟁 비용을 세금으로 걷으면 표를 잃는다는 것을 압니다. 정부가 첫 전쟁 채권을 발행합니다. 보르도와 리옹의 상인들이 앞다투어 사고, 채권은 개장 한 시간 만에 매진됩니다."
 LR_GIR_ruhr_contracts:0 "루르의 계약서"
 LR_GIR_ruhr_contracts_desc:0 "프로이센이 무너지자 군정청이 루르의 탄광과 제철소를 압류했습니다. 슈네데르와 드방델과 리옹 신용은행의 대리인들이 에센의 호텔 연회장에 번호판을 들고 앉습니다. 루르를 누구에게 팔지 정해야 합니다."
 LR_GIR_common_market:0 "대륙의 시장"
 LR_GIR_common_market_desc:0 "관세가 사라진 유럽은 지롱드파의 오랜 꿈입니다. 프랑스와 자매 공화국들과 라인 연방 사이의 관세를 모두 없애는 조약 초안이 보르도 상공회의소에서 처음 읽힙니다. 칼이 아니라 계산서로 유럽을 묶으려 합니다."
 LR_MAR_notables:0 "명사 회의"
 LR_MAR_notables_desc:0 "1787년 루이 16세는 재정 위기를 넘기려고 명사 회의를 불렀습니다. 공장주와 대지주와 은행가와 대주교가 다시 한자리에 모입니다. 이번에는 그들이 나라의 앞날을 정할 차례입니다."
 LR_MAR_lafayette_heir:0 "라파예트의 후계자"
 LR_MAR_lafayette_heir_desc:0 "국민방위대가 다시 제복을 맞춥니다. 문제는 사령관입니다. 라파예트의 후계자가 될 사람은 곧 파리의 총을 쥐는 사람입니다. 명사들 사이에서 세 이름이 오갑니다."
 LR_MAR_empty_throne:0 "빈 왕좌"
 LR_MAR_empty_throne_desc:0 "헌법은 왕을 요구하지만 왕좌는 비어 있습니다. 부르봉이냐 오를레앙이냐, 아니면 외국 왕가냐. 의회가 후보를 고르는 동안 튈르리 궁의 시종들은 먼지만 텁니다."
 LR_MAR_civil_list:0 "왕실비 논쟁"
 LR_MAR_civil_list_desc:0 "왕실에 해마다 얼마를 줄지 의회가 표결합니다. 왕의 생활비가 예산안의 한 줄이 된 것입니다. 의원들은 왕의 말 몇 마리까지 따지고, 그 자체가 하나의 혁명입니다."
 LR_MAR_lyon_strike:0 "리옹의 견직공"
 LR_MAR_lyon_strike_desc:0 "1831년 리옹의 견직공들은 일하며 살거나 싸우다 죽거나라고 적힌 검은 깃발을 들었습니다. 100년 만에 그 깃발이 크루아루스 언덕에 다시 걸립니다. 명사들의 정부는 이 파업을 어떻게 끝낼지 정해야 합니다."
 LR_MAR_charter:0 "1791년의 약속"
 LR_MAR_charter_desc:0 "1791년의 헌법은 1년도 못 가 찢어졌습니다. 그 헌법을 다시 꺼내 놓고 왕이 손을 얹습니다. 명사들은 이번에는 오래갈 것이라고 믿습니다. 파리의 노동자들은 그렇게 믿지 않습니다."
 LR_MAR_kings_call:0 "입헌 군주의 소집령"
 LR_MAR_kings_call_desc:0 "헌법 아래의 왕이 처음으로 군대를 부릅니다. 동원령 문서에는 서명란이 둘입니다. 하나는 왕의 것, 하나는 의회 의장의 것입니다. 1791년 헌법이 정한 그대로입니다."
 LR_MAR_notables_peace:0 "명사들의 강화"
 LR_MAR_notables_peace_desc:0 "프로이센이 무너지자 생제르맹의 살롱에서 은행가와 대지주와 대주교가 지도를 펼칩니다. 그들은 이제 전쟁을 끝내고 싶어 합니다. 전쟁 공채의 이자가 그들의 금고를 갉아먹고 있습니다."
 LR_MAR_concert:0 "유럽 협조 체제"
 LR_MAR_concert_desc:0 "2차 대불전쟁 뒤 왕들은 빈에서 혁명 프랑스를 묶었습니다. 같은 도시에서 이번에는 입헌 프랑스가 회의를 주재합니다. 왕들의 유럽과 헌법의 프랑스가 함께 살 질서를 제안합니다."
 LR_NAP_algiers_return:0 "알제에서 돌아온 사람"
 LR_NAP_algiers_return_desc:0 "알제리 위기 때 파리는 아무나 보내라고 했습니다. 그 아무나가 반란을 평정하고 지금 리옹역 플랫폼에 내립니다. 기자들이 몰려들지만 그는 아무 말 없이 차에 오릅니다. 의회는 그가 무엇을 원하는지 아직 모릅니다."
 LR_NAP_plebiscite:0 "국민투표"
 LR_NAP_plebiscite_desc:0 "통령 정부에 찬성합니까. 투표용지에는 질문이 하나뿐입니다. 결과는 투표 전부터 다들 짐작합니다. 중요한 것은 그 숫자가 얼마나 클지입니다."
 LR_NAP_before_the_crown:0 "왕관 앞에서"
 LR_NAP_before_the_crown_desc:0 "법전이 완성되고 교황과의 정교 협약이 맺어졌습니다. 원로원이 묻습니다. 통령 다음은 무엇입니까. 그 답은 이미 그의 책상 서랍에 들어 있는지도 모릅니다."
 LR_NAP_eagles:0 "독수리 군기"
 LR_NAP_eagles_desc:0 "로마 군단은 독수리 깃발 아래 싸웠습니다. 황제가 그 독수리를 프랑스 연대 앞에 세웁니다. 그는 직접 군기를 건네며 말합니다. 이 독수리를 잃느니 죽겠다고 맹세하라. 병사들이 함성으로 답합니다."
 LR_NAP_new_nobles:0 "오랜 이름, 새 이름"
 LR_NAP_new_nobles_desc:0 "오래된 귀족 가문은 제국 궁정을 비웃습니다. 전장에서 공을 세운 새 귀족들은 그 비웃음을 견디지 못합니다. 황제는 둘 중 누구를 궁정의 앞자리에 앉힐지 정해야 합니다."
 LR_NAP_empress:0 "황후 문제"
 LR_NAP_empress_desc:0 "제국에는 후계자가 필요합니다. 황제의 침실이 외교 문제가 됩니다. 대사들이 각국 공주의 초상화를 들고 튈르리 궁 대기실에 줄을 섭니다."
 LR_NAP_spanish_ulcer:0 "스페인의 궤양"
 LR_NAP_spanish_ulcer_desc:0 "황제의 형은 마드리드의 왕좌를 원합니다. 측근들은 스페인 산악 지대의 게릴라 이야기를 꺼냅니다. 형은 듣지 않습니다. 황제는 형의 소원과 스페인의 산맥 사이에서 정해야 합니다."
 LR_NAP_emperor_of_europe:0 "유럽의 황제"
 LR_NAP_emperor_of_europe_desc:0 "유럽의 모든 왕이 파리에서 올 황제의 전갈을 기다리는 날을 황제는 꿈꿉니다. 그 꿈은 이제 손에 닿을 만큼 가까이 있습니다. 그 꿈이 이루어질지, 그 꿈이 그를 삼킬지는 아직 모릅니다."
 LR_NAP_bulletin:0 "대육군 공보"
 LR_NAP_bulletin_desc:0 "황제는 전황 보고를 직접 받아쓰게 합니다. 대육군 제1호 공보가 파리의 모든 신문 1면에 같은 글로 실립니다. 공보에는 늘 승리만 적혀 있습니다."
 LR_NAP_berlin_decree:0 "베를린 칙령"
 LR_NAP_berlin_decree_desc:0 "베를린이 함락되었습니다. 프리드리히 대왕의 옛 서재에서 황제가 대륙봉쇄령에 다시 서명합니다. 프로이센 왕들이 프랑스를 겨눈 동맹 조약에 서명하던 바로 그 책상입니다."
 LR_NAP_grand_empire:0 "대제국"
 LR_NAP_grand_empire_desc:0 "튈르리 궁 지도실의 제국 지도에는 130개의 데파르트망이 그려져 있습니다. 암스테르담에서 로마까지, 브레멘에서 바르셀로나까지. 샤를마뉴 이후 가장 넓은 국경입니다. 황제는 이 제국을 어떻게 남길지 정해야 합니다."
 LR_GUA_first_address:0 "첫 국정 연설"
 LR_GUA_first_address_desc:0 "대통령이 처음으로 군복을 벗고 연미복을 입은 채 의회에 들어섭니다. 의원들이 술렁입니다. 연단에 선 그가 첫마디를 고릅니다. 공화국의 첫 연설이 될 말입니다."
 LR_GUA_marshals_protest:0 "장군들의 항의"
 LR_GUA_marshals_protest_desc:0 "군은 왕관을 거절한 황제를 이해하지 못합니다. 원수들이 항의 서한을 들고 대통령 관저를 찾아옵니다. 그들은 자기들이 무엇을 위해 싸웠는지 묻습니다."
 LR_GUA_life_presidency:0 "종신 대통령 청원"
 LR_GUA_life_presidency_desc:0 "지지자들이 임기를 없애자는 청원서를 가져왔습니다. 서명이 200만 개입니다. 거절하면 그들이 실망하고, 받아들이면 그가 지금까지 한 약속이 모두 거짓말이 됩니다."
 LR_GUA_exiles_return:0 "망명 왕족의 귀환"
 LR_GUA_exiles_return_desc:0 "혁명 때 망명한 왕족들이 귀국을 허락해 달라고 청원합니다. 받아들이면 공화국이 그들을 두려워하지 않는다는 것을 보여 줄 수 있습니다. 왕당파에게 깃발을 쥐여 줄 수도 있습니다."
 LR_GUA_farewell:0 "대통령의 약속"
 LR_GUA_farewell_desc:0 "언젠가 이 사람도 대통령 관저를 나와야 합니다. 국민은 그날이 정말 올지 의심합니다. 대통령이 국민 앞에서 그날 무엇을 남기고 떠날지 약속합니다."
 LR_GUA_war_powers:0 "전시 대권"
 LR_GUA_war_powers_desc:0 "대통령 지지 의원들이 전시 대권법을 발의했습니다. 전쟁 동안 대통령이 의회 없이 칙령으로 다스릴 수 있게 하는 법입니다. 공화국은 전쟁을 위해 공화국을 잠시 멈출 수 있는지 스스로 물어야 합니다."
 LR_GUA_general_president:0 "전선의 대통령"
 LR_GUA_general_president_desc:0 "프로이센이 무너졌습니다. 대통령이 연미복 대신 낡은 야전 외투를 입고 라인강 건너의 전선을 찾습니다. 알제리에서 그를 따랐던 고참병들이 그를 알아보고 경례합니다."
 LR_GUA_republican_peace:0 "공화국의 평화"
 LR_GUA_republican_peace_desc:0 "승전국 프랑스가 강화 회의를 엽니다. 1918년 승전국들은 프랑스를 무릎 꿇린 조약을 일방적으로 썼습니다. 대통령은 거울의 방에서 공화국의 강화 원칙을 발표하려 합니다."
 LR_PET_vichy:0 "온천 도시의 정부"
 LR_PET_vichy_desc:0 "파리는 언제나 혁명의 도시였습니다. 1789년에도, 1848년에도, 1871년에도. 원수는 혁명의 도시에서 다스리고 싶지 않습니다. 정부가 오베르뉴의 온천 도시 비시로 옮겨 갑니다."
 LR_PET_portrait:0 "원수의 초상"
 LR_PET_portrait_desc:0 "흰 콧수염의 노인 사진이 모든 교실과 관공서와 담배 가게에 걸립니다. 우표에도 원수의 얼굴이 들어갑니다. 원수의 얼굴이 곧 프랑스의 얼굴이 됩니다."
 LR_PET_laval:0 "라발의 귀환"
 LR_PET_laval_desc:0 "흰 넥타이의 사나이 피에르 라발이 원수의 문을 두드립니다. 그는 누구와도 거래할 줄 압니다. 원수의 측근들은 그것이 그의 장점이자 위험이라고 말합니다."
 LR_PET_riom:0 "리옴 법정"
 LR_PET_riom_desc:0 "리옴 법원에서 옛 공화국의 지도자들이 재판을 받습니다. 정부는 그들이 패배의 책임을 인정하기를 바랍니다. 피고들은 순순히 고개를 숙이지 않고, 법정은 그들의 연단이 되어 갑니다."
 LR_PET_last_winter:0 "늙은 원수의 겨울"
 LR_PET_last_winter_desc:0 "여든을 넘긴 원수에게 남은 시간을 세는 사람들이 있습니다. 어떤 날은 장관의 이름을 잊습니다. 그가 세운 나라가 그 없이도 서 있을 수 있는지, 측근들은 아직 답을 모릅니다."
 LR_ANA_no_masters:0 "주인 없는 공장"
 LR_ANA_no_masters_desc:0 "사장이 떠난 공장에서 첫 월요일이 밝습니다. 출근한 노동자들은 누가 문을 열지조차 정하지 않았습니다. 누구도 명령할 권한이 없습니다. 그것이 이 혁명의 요점입니다."
 LR_ANA_vendee_coop:0 "방데의 농민들"
 LR_ANA_vendee_coop_desc:0 "집산 농장 가입서가 방데의 마을 광장에 도착합니다. 150년 전에도 방데는 파리의 혁명과 싸웠습니다. 연합은 강요하지 않겠다고 했습니다. 방데의 농민들은 그 말을 믿을지 정해야 합니다."
 LR_ANA_platform_debate:0 "강령과 종합"
 LR_ANA_platform_debate_desc:0 "연합은 아직 하나의 강령이 없습니다. 강령파는 조직과 규율을, 종합파는 다양함과 자유를 말합니다. 두 경향이 벨빌의 낡은 회관에서 밤새 맞섭니다."
 LR_ANA_commissars:0 "중앙파의 사절"
 LR_ANA_commissars_desc:0 "회색 가죽 외투를 입은 중앙집권파 사절들이 파리 북역에 내립니다. 그들은 무기를 가져왔고 조건도 가져왔습니다. 연합이 그 조건을 받아들이면 무기는 들어오고, 자유는 줄어들 것입니다."
 LR_ANA_anarchy_spring:0 "국가 없는 첫 봄"
 LR_ANA_anarchy_spring_desc:0 "연합이 첫돌을 맞습니다. 국가 없이 1년을 버텼습니다. 그러나 국경에는 왕들의 군대가 모이고 있습니다. 연합 대회는 다음 1년을 어떻게 버틸지 정해야 합니다."
 LR_RED_souper:0 "보케르의 저녁"
 LR_RED_souper_desc:0 "통령이 1922년에 쓴 소책자는 오랫동안 헌책방 구석에 있었습니다. 보케르의 저녁 식사를 다시 찍게 합니다. 공화국은 대포로 지킨다는 문장이 이제 모든 병영의 벽에 붙습니다."
 LR_RED_red_epaulettes:0 "붉은 견장"
 LR_RED_red_epaulettes_desc:0 "알제리부터 통령을 따라온 원수들은 붉은 깃발 앞에서 머뭇거립니다. 그들은 장군이지 혁명가가 아닙니다. 통령은 그 원수들에게 붉은 견장을 달게 할지, 그들을 떠나보낼지 정해야 합니다."
 LR_RED_concordat_question:0 "교회의 자리"
 LR_RED_concordat_question_desc:0 "통령은 제1통령 시절 교황과 정교 협약을 맺었습니다. 혁명가들이 그 협약을 찢자고 합니다. 농민들은 아직 일요일마다 성당에 갑니다."
 LR_RED_robespierre_shadow:0 "로베스피에르의 그림자"
 LR_RED_robespierre_shadow_desc:0 "생앙투안 거리의 벽보가 묻습니다. 브루투스는 어디 있는가. 테르미도르는 언제 오는가. 1794년 로베스피에르도 같은 벽보를 보았습니다."
 LR_RED_peoples_emperor:0 "인민의 황제?"
 LR_RED_peoples_emperor_desc:0 "노동자 평의회가 통령에게 종신의 권한을 바치려 합니다. 왕관을 거절한 사람에게 왕관과 다를 것 없는 것을 내미는 것입니다. 통령은 그것을 받을지, 다시 거절할지 정해야 합니다."
 LR_DEF_commandant:0 "사령관의 만찬"
 LR_DEF_commandant_desc:0 "점령군 사령관이 파리의 명사들을 리츠 호텔 만찬에 부릅니다. 초대장을 받은 사람들은 가도 문제고 안 가도 문제입니다. 정부는 누구를 보낼지 정해야 합니다."
 LR_DEF_first_execution:0 "첫 처형"
 LR_DEF_first_execution_desc:0 "점령군 장교 하나가 지하철역에서 총에 맞았습니다. 점령군은 인질 명단을 요구합니다. 명단을 넘기면 저항은 배신자를 얻고, 넘기지 않으면 더 많은 사람이 죽습니다."
 LR_DEF_second_winter:0 "두 번째 겨울"
 LR_DEF_second_winter_desc:0 "점령 아래 두 번째 겨울입니다. 센강이 얼고, 공원의 나무들이 하룻밤 사이에 장작으로 사라집니다. 배급표의 숫자는 지난겨울보다 또 줄었습니다."
 LR_ORL_plan_low:0 "저지대 계획"
 LR_ORL_plan_low_desc:0 "1914년 프로이센은 벨기에를 지나 프랑스로 들어왔습니다. 브뤼셀과 룩셈부르크와 암스테르담, 그리고 알프스의 은행가들은 그 뒤로도 중립을 외쳐 왔습니다. 이번에는 프랑스가 반대 방향으로 지나갈 차례입니다."
 LR_ORL_plan_south_germany:0 "슈바르츠발트 너머"
 LR_ORL_plan_south_germany_desc:0 "뮌헨과 슈투트가르트의 왕들은 언제나 베를린보다 파리를 덜 무서워했습니다. 그들은 프로이센의 패권을 싫어하면서도 대전쟁에서는 함께 싸웠습니다. 슈바르츠발트 너머로 마지막 질문을 보냅니다."
 LR_ORL_plan_iberia:0 "피레네 계획"
 LR_ORL_plan_iberia_desc:0 "태양왕은 손자를 마드리드로 보내며 이제 피레네는 없다고 했습니다. 두 세기 반이 지났지만 산맥은 아직 그 자리에 있습니다. 리스본의 금고와 지브롤터의 포대가 그 너머에서 기다립니다."
 LR_ORL_plan_italy:0 "알프스 계획"
 LR_ORL_plan_italy_desc:0 "토리노와 피렌체와 나폴리의 왕들, 파르마와 모데나의 공작들은 지금도 프랑스보다 서로를 더 미워합니다. 그 뒤에는 늘 빈이 있었습니다. 몽스니 고개의 눈이 녹으면 포병대가 노새 등에 오를 것입니다."
 LR_ORL_plan_north:0 "북해 계획"
 LR_ORL_plan_north_desc:0 "외레순 해협을 쥐면 발트해가 닫힙니다. 그 너머에는 나르비크의 철광과 스웨덴의 베어링 공장, 핀란드의 끝없는 숲이 있습니다. 스칸디나비아의 왕들은 자기들의 중립이 오래가지 않으리라는 것을 압니다."
 LR_ORL_plan_east:0 "동유럽 계획"
 LR_ORL_plan_east_desc:0 "바르샤바와 키예프와 리가는 대전쟁의 승자들이 러시아에게서 떼어 내 세운 작은 왕국들입니다. 그 왕들 대부분은 왕관을 쓴 지 스무 해도 되지 않았습니다. 이제 그들이 프랑스의 답을 기다립니다."
 LR_ORL_plan_balkans:0 "발칸 계획"
 LR_ORL_plan_balkans_desc:0 "소피아와 베오그라드, 아테네와 부쿠레슈티는 스무 해 동안 서로의 국경을 고쳐 그리느라 뒤를 보지 않았습니다. 발칸의 왕들은 언제나 다음 전쟁의 동맹을 찾아 왔습니다. 이번에는 프랑스가 그 답이 됩니다."
 LR_ORL_plan_turkey:0 "동방 원정"
 LR_ORL_plan_turkey_desc:0 "대전쟁의 승자 오스만은 도나우에서 페르시아만까지 뻗어 있습니다. 다르다넬스를 뚫으면 이스탄불이고, 시리아를 치면 석유입니다. 십자군 이래 가장 멀리 가는 프랑스의 원정을 계획합니다."
 LR_BOU_plan_low:0 "저지대 계획"
 LR_BOU_plan_low_desc:0 "1914년 프로이센은 벨기에를 지나 프랑스로 들어왔습니다. 브뤼셀과 룩셈부르크와 암스테르담, 그리고 알프스의 은행가들은 그 뒤로도 중립을 외쳐 왔습니다. 이번에는 프랑스가 반대 방향으로 지나갈 차례입니다."
