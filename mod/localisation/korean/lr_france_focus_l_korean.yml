 LR_NAP_plan_north_desc:0 "덴마크 해협을 쥐면 발트해가 닫힙니다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 베어링 공장, 핀란드의 숲. 스칸디나비아의 왕들은 자기들의 중립이 오래가지 않으리라는 것을 압니다."
 LR_NAP_plan_east:0 "동유럽 계획"
 LR_NAP_plan_east_desc:0 "바르샤바와 키예프, 리가. 대전쟁의 승자들이 러시아에게서 떼어 내 세운 작은 왕국들입니다. 그 왕들 대부분은 왕관을 쓴 지 스무 해도 되지 않았습니다. 이제 그들이 프랑스의 답을 기다립니다."
 LR_NAP_plan_balkans:0 "발칸 계획"
 LR_NAP_plan_balkans_desc:0 "유럽의 화약고. 소피아와 베오그라드, 아테네와 부쿠레슈티는 스무 해 동안 서로의 국경을 고쳐 그리느라 뒤를 보지 않았습니다. 발칸의 왕들은 언제나 다음 전쟁의 동맹을 찾아 왔습니다. 이제 그 답이 프랑스입니다."
 LR_NAP_plan_turkey:0 "동방 원정"
 LR_NAP_plan_turkey_desc:0 "대전쟁의 승자 오스만 제국은 다뉴브에서 페르시아만까지 뻗어 있습니다. 다르다넬스를 뚫으면 이스탄불이고, 시리아를 치면 석유입니다. 십자군 이래 가장 야심 찬 프랑스의 동방 원정입니다."
 LR_GUA_plan_low:0 "저지대 계획"
 LR_GUA_plan_low_desc:0 "브뤼셀과 룩셈부르크, 암스테르담, 그리고 알프스의 은행가들. 1914년에 프로이센은 벨기에를 지나 프랑스로 들어왔습니다. 이번에는 프랑스가 반대 방향으로 지나갈 차례입니다. 중립국들의 시대는 끝나 가고 있습니다."
 LR_GUA_plan_south_germany:0 "슈바르츠발트 너머"
 LR_GUA_plan_south_germany_desc:0 "뮌헨과 슈투트가르트의 왕들은 언제나 베를린보다 파리를 덜 무서워했습니다. 프로이센의 패권을 싫어하면서도 대전쟁에서는 함께 싸웠습니다. 슈바르츠발트 너머로 마지막 질문을 보냅니다. 베를린과 함께 무너지겠습니까?"
 LR_GUA_plan_iberia:0 "피레네 계획"
 LR_GUA_plan_iberia_desc:0 "태양왕은 손자를 마드리드로 보내며 이제 피레네는 없다고 했습니다. 두 세기 반이 지났지만 산맥은 아직 그 자리에 있습니다. 리스본의 금고와 지브롤터의 포대가 그 너머에서 기다립니다."
 LR_GUA_plan_italy:0 "알프스 계획"
