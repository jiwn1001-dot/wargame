 LR_dec_order_conscription_desc:0 "황제가 또 한 번 젊은이들을 부릅니다. 인력 +50000, 안정도 -2%."
 LR_route_orleans_tt:0 "§Y오를레앙 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_route_bourbon_tt:0 "§Y부르봉 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_route_communist_tt:0 "§Y사회주의 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_route_jacobin_tt:0 "§Y산악파 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_route_girondin_tt:0 "§Y지롱드 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_route_marais_tt:0 "§Y푀양파 루트§!에 들어가야 합니다. 알제리 반란의 결과로 정해집니다."
 LR_tt_need_rail_3:0 "철도 §Y3개 구간§! 이상을 깔아야 합니다."
 LR_tt_need_rearmament:0 "§Y기술혁신 60§! 이상이어야 합니다. 군사 중점과 §Y군사 개혁 위원회§!의 훈련·시험으로 오릅니다."
 LR_tt_seats_275:0 "의회 의석 §Y275석§! 이상 필요"
 LR_tt_seats_305:0 "의회 의석 §Y305석§! 이상 필요"
 LR_tt_seats_306:0 "의회 의석 §Y306석§! 이상 필요"
 LR_tt_seats_336:0 "의회 의석 §Y336석§! 이상 필요"
 LR_tt_seats_366:0 "의회 의석 §Y366석§! 이상 필요"
 LR_tt_seats_407:0 "의회 의석 §Y407석§! 이상 필요"
 LR_FRA_the_kings_peace:0 "패전의 그늘"
 LR_FRA_the_kings_peace_desc:0 "베르사유의 강화 조약은 프랑스에서 제국을 앗아갔고, 파리의 카페에서는 아무도 더 이상 '영광'을 말하지 않습니다. 패전의 그늘에서 다시 일어서는 일은 오늘 이 재고 조사에서 시작됩니다."
 LR_FRA_war_reparations:0 "배상금 재협상"
 LR_FRA_war_reparations_desc:0 "런던의 은행가들은 숫자에는 냉정하지만, 파산한 채무자에게는 받을 돈이 없다는 것도 압니다. 배상금을 조금만 늦춰도 재건 예산이 숨을 쉽니다."
 LR_FRA_royal_arsenal:0 "병기창 재건"
 LR_FRA_royal_arsenal_desc:0 "서류에는 농기계 공장, 지하에는 포탄 공정. 조약 감시단이 다녀간 다음 날이면 선반은 다시 돌아갑니다."
 LR_FRA_rebuild_railways:0 "철도 재건"
 LR_FRA_rebuild_railways_desc:0 "대전쟁은 북부의 철길을 고철로 만들었습니다. 석탄이 파리에 닿지 않으면 공장도, 군대도 움직이지 못합니다. 첫 철도 구간이 여기서 깔립니다."
 LR_FRA_steelworks:0 "로렌 제철소"
 LR_FRA_steelworks_desc:0 "드방델 가문의 용광로가 다시 불을 뿜습니다. 로렌의 철광석은 언제나 프랑스 군수 산업의 심장이었습니다."
 LR_FRA_tunisia_morocco:0 "북아프리카 개발"
 LR_FRA_tunisia_morocco_desc:0 "알제리의 포성을 들으며 튀니스와 카사블랑카의 총독들은 초조합니다. 공장과 일자리로 남은 북아프리카를 붙잡아 둡니다."
 LR_FRA_ports:0 "항구 재건"
 LR_FRA_ports_desc:0 "빈 조선대는 수치입니다. 브레스트와 툴롱, 생나제르의 도크에 다시 망치 소리를 울립니다."
 LR_FRA_mass_production:0 "대량 생산"
 LR_FRA_mass_production_desc:0 "앙드레 시트로엥이 디트로이트에서 보고 온 것을 이제 군수 공장에 들여옵니다. 장인들은 투덜대겠지만 포탄은 세 배로 나옵니다."
 LR_FRA_royal_academy:0 "과학 아카데미"
 LR_FRA_royal_academy_desc:0 "파스퇴르와 퀴리의 나라는 전쟁에 졌어도 지성까지 지지는 않았습니다. 학자들에게 예산과 연구실을 돌려줍니다."
 LR_FRA_rural_power:0 "농촌 전력화"
 LR_FRA_rural_power_desc:0 "프랑스의 절반은 아직 석유등으로 밤을 밝힙니다. 시골까지 전선을 끌어가면 농민의 표와 공장의 입지가 함께 따라옵니다."
 LR_FRA_synthetic_fuel:0 "합성 연료"
 LR_FRA_synthetic_fuel_desc:0 "프랑스 땅에는 유전이 없습니다. 다음 전쟁에서 영국 해군에 목을 맡기지 않으려면 석탄을 기름으로 바꾸는 법을 배워야 합니다."
 LR_FRA_trade_treaties:0 "통상 조약"
 LR_FRA_trade_treaties_desc:0 "스위스 은행, 스웨덴 철광, 아르헨티나 밀. 중립국과 맺는 작은 조약들이 봉쇄를 견디는 큰 그물이 됩니다."
 LR_FRA_war_economy:0 "전시 경제"
 LR_FRA_war_economy_desc:0 "평시 경제의 끝입니다. 철도와 공장이 준비되었다면 이제 모든 선반이 한 가지 목적을 위해 돌아갑니다."
 LR_FRA_lessons_of_defeat:0 "패전의 교훈"
 LR_FRA_lessons_of_defeat_desc:0 "참모대학의 가장 인기 없는 강의, '우리는 왜 졌는가'. 이 질문에 답하는 장교만이 다음 전쟁을 지휘할 자격이 있습니다."
 LR_FRA_infantry_rearm:0 "보병 재무장"
 LR_FRA_infantry_rearm_desc:0 "병사들은 아직 르벨 소총을 듭니다. 고조부의 총으로 이길 수 있는 전쟁은 끝났습니다."
 LR_FRA_artillery_school:0 "포병 학교"
 LR_FRA_artillery_school_desc:0 "75mm는 프랑스의 신화입니다. 그 신화를 믿는 장교와, 신화를 넘어서려는 장교가 같은 학교에서 부딪칩니다."
 LR_FRA_mobile_war:0 "기동전 연구"
 LR_FRA_mobile_war_desc:0 "참호가 전쟁의 전부라고 믿는 장군들 사이에서, 몇몇 젊은 대령이 엔진 소리에 귀를 기울입니다."
 LR_FRA_general_staff:0 "참모본부 개편"
 LR_FRA_general_staff_desc:0 "일흔 넘은 장군들에게 정중한 훈장과 은퇴 통지서를 동시에 보냅니다."
 LR_FRA_motorisation:0 "차량화"
 LR_FRA_motorisation_desc:0 "말은 사랑스럽지만 기름만큼 빠르지는 않습니다. 보병을 트럭에 태웁니다."
 LR_FRA_tank_divisions:0 "기갑 사단"
 LR_FRA_tank_divisions_desc:0 "전차를 보병에 나눠 주는 관행을 끝냅니다. 한곳에 모인 강철만이 전선을 찢습니다."
 LR_FRA_air_arm:0 "공군 창설"
 LR_FRA_air_arm_desc:0 "조약은 비행기 수를 세지만 활공 클럽의 청년들까지 세지는 못합니다. 하늘의 군대가 민간 항공 뒤에서 자랍니다."
 LR_FRA_revenge_army:0 "복수의 군대"
 LR_FRA_revenge_army_desc:0 "복무 기간을 늘리고 훈련장을 넓힙니다. 입 밖에 내지 않아도 모두가 누구를 상대로 한 훈련인지 압니다."
 LR_FRA_new_navy:0 "새 함대"
 LR_FRA_new_navy_desc:0 "됭케르크급의 설계도가 해군성 금고에서 나옵니다. 영국이 지켜보고 있다는 사실이 오히려 조선공들을 들뜨게 합니다."
 LR_FRA_air_doctrine:0 "공군 교리"
 LR_FRA_air_doctrine_desc:0 "전투기냐 폭격기냐, 공군 수뇌부가 편을 갈라 싸웁니다. 결론은 하나, 지상군의 시녀로 남지 않겠다는 것입니다."
 LR_FRA_radio_net:0 "무선 통신망"
 LR_FRA_radio_net_desc:0 "대전쟁의 사단은 전령과 비둘기로 움직였습니다. 무전 없는 기갑은 눈먼 강철일 뿐입니다."
 LR_FRA_fleet_doctrine:0 "해군 교리"
 LR_FRA_fleet_doctrine_desc:0 "지중해를 지킬 것인가, 대서양으로 나갈 것인가. 둘 다는 못 한다는 사실을 제독들이 드디어 인정합니다."
 LR_FRA_ready_for_war:0 "전쟁 준비 완료"
 LR_FRA_ready_for_war_desc:0 "병기창은 찼고 장교는 젊어졌습니다. 패전 이후 처음으로, 참모총장이 내각에 '준비되었다'고 보고합니다."
 LR_FRA_stabilise_franc:0 "프랑 안정화"
 LR_FRA_stabilise_franc_desc:0 "1926년 포앵카레가 그랬듯 프랑을 금에 묶습니다. 빵값이 멈춰야 정권도 멈추지 않습니다."
 LR_FRA_nord_coal:0 "북부 탄광 재개발"
 LR_FRA_nord_coal_desc:0 "란스와 발랑시엔의 갱도는 물에 잠긴 채 버려져 있습니다. 물을 퍼내고 폴란드 광부들을 다시 불러옵니다."
 LR_FRA_citroen_trucks:0 "시트로엥 트럭 계약"
 LR_FRA_citroen_trucks_desc:0 "케 드 자벨의 조립 라인이 군용 트럭을 쏟아냅니다. 탱크보다 먼저, 탱크에 기름을 대 줄 차가 필요합니다."
 LR_FRA_alpine_hydro:0 "알프스 수력 발전"
 LR_FRA_alpine_hydro_desc:0 "석탄이 없다면 산이 있습니다. 그르노블의 '하얀 석탄'이 남부의 공장들을 돌립니다."
 LR_FRA_state_capital:0 "국가 주도 투자"
 LR_FRA_state_capital_desc:0 "콜베르의 나라답게 국가가 직접 나섭니다. 계획국의 관료들이 어느 공장을 어디에 세울지 정합니다."
 LR_FRA_private_capital:0 "민간 자본 유치"
 LR_FRA_private_capital_desc:0 "로칠드와 리옹 크레디는 나라를 사랑합니다. 수익률이 맞는다면요. 규제를 풀고 그들의 금고를 엽니다."
 LR_FRA_artisans:0 "장인 전통의 산업화"
 LR_FRA_artisans_desc:0 "파리의 공방에서 자란 숙련공은 어떤 기계보다 정밀합니다. 그들을 조립 라인의 머리로 앉힙니다."
 LR_FRA_lyon_chemicals:0 "리옹 화학 공업"
 LR_FRA_lyon_chemicals_desc:0 "리옹의 염색 공장은 하룻밤 사이에 폭약 공장이 될 수 있습니다. 대전쟁이 가르쳐 준 불편한 진실입니다."
 LR_FRA_research_network:0 "국립 연구 기관"
 LR_FRA_research_network_desc:0 "소르본과 공장, 군대가 처음으로 한 책상에 앉습니다. 다음 전쟁의 무기는 이 회의실에서 시작됩니다."
 LR_FRA_arsenal_of_republic:0 "프랑스의 병기창"
 LR_FRA_arsenal_of_republic_desc:0 "산업 지표가 목표에 닿았습니다. 대륙에서 가장 큰 병기창이 프랑스의 이름을 다시 무겁게 만듭니다."
 LR_FRA_petain_school:0 "방어 우선 교리"
 LR_FRA_petain_school_desc:0 "베르됭의 교훈을 교리로 삼습니다. 화력이 죽이고 요새가 지킵니다. 시민의 피를 아끼는 전쟁입니다."
 LR_FRA_degaulle_school:0 "기갑 우선 교리"
 LR_FRA_degaulle_school_desc:0 "어느 키 큰 대령의 얇은 책이 금서처럼 돌아다닙니다. 직업 군대, 집중된 전차, 그리고 속도."
 LR_FRA_saint_cyr:0 "생시르 개혁"
 LR_FRA_saint_cyr_desc:0 "'출신'이 아니라 '시험'으로 뽑습니다. 생시르의 문이 넓어지자, 귀족 자제들 옆에 코르시카와 알자스의 소년들이 앉습니다."
 LR_FRA_heavy_artillery:0 "75mm의 후계자"
 LR_FRA_heavy_artillery_desc:0 "75mm의 영광 뒤에서 포병대는 더 큰 구경을 원합니다. 포병 장교들의 논문이 참모부 책상 위에 쌓입니다."
 LR_FRA_char_b:0 "샤르 B 계획"
 LR_FRA_char_b_desc:0 "두꺼운 장갑과 무거운 포. 공장장들은 비싸다고 하고 전차병들은 사랑에 빠졌습니다."
 LR_FRA_foreign_legion:0 "외인부대 확대"
 LR_FRA_foreign_legion_desc:0 "과거를 묻지 않는 부대. 시디벨아베스의 연병장에 유럽의 패배자들이 모여 프랑스의 칼이 됩니다."
 LR_FRA_fighter_school:0 "전투기 학교"
 LR_FRA_fighter_school_desc:0 "아브랑의 후예들이 다시 하늘로 오릅니다. 조종사 한 명을 키우는 데는 공장 한 달치 시간이 듭니다."
 LR_FRA_submarine_arm:0 "잠수함대"
 LR_FRA_submarine_arm_desc:0 "영국 해군과 정면으로 싸울 수는 없습니다. 하지만 런던의 빵은 배로 옵니다."
 LR_FRA_bomber_command:0 "폭격기 사령부"
 LR_FRA_bomber_command_desc:0 "두에의 책을 읽은 장교들이 지도 위 라인강 공업 지대에 동그라미를 칩니다."
 LR_FRA_battleline:0 "주력 함대"
 LR_FRA_battleline_desc:0 "리슐리외의 이름을 단 전함이 진수대를 미끄러져 내려옵니다. 지중해에서 다시 프랑스 국기를 볼 수 있을 것입니다."
 LR_FRA_general_mobilisation:0 "총동원"
 LR_FRA_general_mobilisation_desc:0 "1793년의 '총동원령'을 기억하는 나라입니다. 공장, 철도, 학교, 나라의 모든 시계가 전쟁 시간으로 맞춰집니다."
 LR_ORL_duke:0 "오를레앙의 왕"
 LR_ORL_duke_desc:0 "장교단이 부르봉을 내치고 오를레앙 공을 옹립했습니다. 새 왕은 즉위 연설에서 단 한 단어를 일곱 번 말합니다. '복수'."
 LR_ORL_shell_bills:0 "유령회사 어음"
 LR_ORL_shell_bills_desc:0 "서류상의 회사가 서류상의 어음을 발행하고, 국가은행이 말없이 그것을 사들입니다. 장부에는 없는 군비가 공장을 돌립니다."
 LR_ORL_radical_rearm:0 "급진적 재무장"
 LR_ORL_radical_rearm_desc:0 "감시단을 내쫓고 조약문을 벽난로에 던집니다. 왕의 재무장은 이제 비밀이 아닙니다."
 LR_ORL_calais:0 "노르파드칼레 재무장"
 LR_ORL_calais_desc:0 "칼레의 비무장지대로 대대가 행진해 들어가던 날, 런던은 항의문을 보냈고 파리는 샴페인을 터뜨렸습니다."
 LR_ORL_algeria:0 "알제리 진압"
 LR_ORL_algeria_desc:0 "왕이 잃은 것을 왕이 되찾습니다. 출항하는 군함마다 '알제리는 프랑스다'가 페인트로 적혀 있습니다."
 LR_ORL_rhine:0 "라인강으로"
 LR_ORL_rhine_desc:0 "수많은 왕들이 꿈꿨던 자연 국경. 이번에는 프로이센이 조약을 들고 달려와도 받아 주지 않습니다."
 LR_ORL_danube:0 "빈으로"
 LR_ORL_danube_desc:0 "빈의 황제가 대전쟁에서 차지한 몫을 돌려줄 차례입니다. 합스부르크의 뒷문을 두드립니다."
 LR_ORL_channel:0 "해협 건너로"
 LR_ORL_channel_desc:0 "윌리엄 이후 아무도 해내지 못한 일. 영국 해협에 프랑스 왕의 깃발을 세웁니다."
 LR_ORL_russia:0 "동쪽의 적"
 LR_ORL_russia_desc:0 "독일과 영국이 무너진 지금, 왕의 유럽에 남은 마지막 적은 공화국의 깃발을 든 동쪽의 거인입니다."
 LR_BOU_restored:0 "왕좌의 안정"
 LR_BOU_restored_desc:0 "쿠데타는 실패했습니다. 칼을 쥔 장군들은 재판정에, 왕은 다시 튈르리에. 이제 왕좌가 그저 살아남은 것이 아니라 필요한 것임을 보여줘야 합니다."
 LR_BOU_family_pact:0 "가문 협약"
 LR_BOU_family_pact_desc:0 "1761년의 가문 협약을 되살립니다. 파리와 마드리드의 부르봉이 같은 깃발 아래 서고, 라틴 왕가 동맹이 출범합니다."
 LR_BOU_two_sicilies:0 "나폴리의 사촌"
 LR_BOU_two_sicilies_desc:0 "나폴리의 사촌에게 약속합니다. 이탈리아를 스스로 통일한다면 프랑스가 뒤를 봐주겠다고. 아직 조약은 없고 편지만 오갑니다."
 LR_BOU_italy:0 "이탈리아 통일전쟁"
 LR_BOU_italy_desc:0 "토리노와 로마, 피렌체, 나폴리가 서로에게 선전포고한 전쟁에 프랑스가 나폴리 편으로 손을 넣습니다. 프랑스는 공식적으로 교전국이 아닙니다. 우리는 의용 사단과 소총을 보내고, 왕관을 쓴 사촌에게서 동맹을 받아 냅니다."
 LR_BOU_diplomatic_rearm:0 "재무장 협상"
 LR_BOU_diplomatic_rearm_desc:0 "런던에는 러시아 공화국의 위협을, 빈에는 혁명의 공포를 이야기합니다. 왕들의 유럽은 왕의 군대가 필요하다는 데 동의합니다."
 LR_BOU_open_rearm:0 "막가파 재무장"
 LR_BOU_open_rearm_desc:0 "외교관들이 빈손으로 돌아왔습니다. 그렇다면 허락 없이 합니다. 왕이 직접 재무장 칙령에 서명합니다."
 LR_BOU_algeria:0 "알제리 진압"
 LR_BOU_algeria_desc:0 "포기했던 땅을 왕의 이름으로 되찾습니다. 이번에는 왕실 근위대가 맨 앞에 섭니다."
 LR_BOU_rhine:0 "라인강으로"
 LR_BOU_rhine_desc:0 "루이 14세의 꿈이 다시 지도 위에 그어집니다. 라인강은 프랑스의 강이어야 합니다."
 LR_BOU_danube:0 "빈으로"
 LR_BOU_danube_desc:0 "이탈리아를 위해, 그리고 앙리 4세의 오랜 과업을 위해. 합스부르크를 끝낼 시간입니다."
 LR_BOU_channel:0 "해협 건너로"
 LR_BOU_channel_desc:0 "귀족들이 왕을 장식물로 만든 나라, 영국. 진정한 왕정이 무엇인지 보여줍니다."
 LR_BOU_russia:0 "동쪽의 적"
 LR_BOU_russia_desc:0 "왕을 처형한 자들의 나라를 그대로 둘 수는 없습니다. AI라면 절반의 확률로만 나서는 성전입니다."
 LR_COM_commune:0 "코뮌의 깃발"
 LR_COM_commune_desc:0 "1871년에는 72일이었습니다. 이번에는 끝이 없습니다. 시청 첨탑에 붉은 깃발이 오르고, 공화국이 노동자의 이름으로 다시 태어납니다."
 LR_COM_workers_control:0 "노동자 통제"
 LR_COM_workers_control_desc:0 "사장실 문에 '인민 재산'이라는 쪽지가 붙습니다. 선반공 대표가 이번 달 생산량을 결정합니다."
 LR_COM_one_country:0 "일국사회주의"
 LR_COM_one_country_desc:0 "유럽의 왕들은 언제든 쳐들어올 수 있습니다. 먼저 이 땅의 사회주의를 지키는 것이 세계 혁명보다 앞섭니다."
 LR_COM_world_revolution:0 "세계 혁명"
 LR_COM_world_revolution_desc:0 "혁명에 국경은 없습니다. 파리의 깃발은 시작일 뿐이며, 모든 노동자가 프랑스의 시민입니다."
 LR_COM_annex_algeria:0 "알제리 혁명 원정"
 LR_COM_annex_algeria_desc:0 "식민지는 없습니다. 있는 것은 프랑스 사회주의 공화국의 알제리 도입니다. 그렇게 믿지 않는 자들에게 믿게 해 줄 군대가 출발합니다."
 LR_COM_algerian_comrades:0 "알제리 동지들"
 LR_COM_algerian_comrades_desc:0 "오랑과 알제의 동지들에게 무기와 교관을 보냅니다. 민족주의자들의 공화국 안에서 붉은 내전이 시작됩니다."
 LR_COM_rhine:0 "라인강으로"
 LR_COM_rhine_desc:0 "독일 노동자는 적이 아닙니다. 적은 그들의 왕입니다. 혁명군이 라인강을 건너 전단과 총을 함께 나눠 줍니다."
 LR_COM_channel:0 "해협 건너로"
 LR_COM_channel_desc:0 "맨체스터와 글래스고의 차티스트 후예들이 이 날을 기다렸습니다."
 LR_COM_danube:0 "빈으로"
 LR_COM_danube_desc:0 "빈의 궁전 앞에 프라하와 부다페스트의 노동자들이 있습니다. 민족의 감옥에 혁명의 문을 냅니다."
 LR_JAC_committee:0 "공안위원회"
 LR_JAC_committee_desc:0 "로베스피에르의 이름은 여전히 사람들을 두렵게 합니다. 하지만 이번 공안위원회의 칼날은 굶주림과 실업을 향합니다."
 LR_JAC_social_contract:0 "사회 계약"
 LR_JAC_social_contract_desc:0 "루소의 책에서 이름을 빌렸습니다. 나라는 시민의 삶을 지키고, 시민은 나라를 지킵니다. 산악파 정부의 첫 번째 법안입니다."
 LR_JAC_labour_code:0 "노동법"
 LR_JAC_labour_code_desc:0 "파업권과 단체 교섭이 법전에 들어갑니다. 공장주들은 비명을 지르고, 노동총동맹은 의사당 앞에서 노래합니다."
 LR_JAC_public_works:0 "국가 공공사업"
 LR_JAC_public_works_desc:0 "실업자 수십만 명이 삽을 듭니다. 도로와 댐, 공장은 나라의 재산으로 남습니다."
 LR_JAC_nationalise:0 "기간산업 국유화"
 LR_JAC_nationalise_desc:0 "철도와 석탄은 200대 가문의 재산이기 전에 공화국의 혈관입니다. 긴 의회 싸움 끝에 법안이 통과됩니다."
 LR_JAC_public_school:0 "공화국 학교"
 LR_JAC_public_school_desc:0 "페리의 무상 교육을 끝까지 밀어붙입니다. 프랑스의 모든 아이가 '자유, 평등, 박애'를 받아 적습니다."
 LR_JAC_reclaim_algeria:0 "알제리 수복 결정"
 LR_JAC_reclaim_algeria_desc:0 "왕정이 잃은 땅을 공화국이 찾아옵니다. 의회가 전쟁을 승인했습니다. 이제 남은 문제는, 대체 누구를 보낼 것이냐입니다."
 LR_JAC_republican_army:0 "공화국 군대"
 LR_JAC_republican_army_desc:0 "왕의 장교들을 믿을 수는 없지만 다른 장교도 없습니다. 시민의 군대가 왕의 장교들을 조금씩 바꿔 나갑니다."
 LR_JAC_rhine:0 "라인강의 깃발"
 LR_JAC_rhine_desc:0 "1792년에도 그랬듯, 공화국의 군대는 자유를 외치며 라인강으로 향합니다."
 LR_JAC_channel:0 "해협 건너로"
 LR_JAC_channel_desc:0 "웨스트민스터의 귀족 의회는 자유를 말할 자격이 없습니다. 공화국이 해협을 건넙니다."
 LR_JAC_danube:0 "빈으로"
 LR_JAC_danube_desc:0 "합스부르크의 민족들에게 인권 선언문 번역본을 보냅니다. 포병대가 그 뒤를 따릅니다."
 LR_JAC_russia:0 "동쪽의 적"
 LR_JAC_russia_desc:0 "같은 공화국이라도 모스크바의 혁명은 파리의 혁명이 아닙니다. AI라면 이 전쟁을 피하지 않습니다."
 LR_JAC_majority:0 "의회 과반"
 LR_JAC_majority_desc:0 "드디어 51석. 이제 연립 파트너의 비위를 맞추지 않아도 예산이 통과됩니다."
 LR_JAC_reform_act:0 "개혁 입법"
 LR_JAC_reform_act_desc:0 "오랫동안 위원회에서 잠자던 개혁 법안 묶음이 하루 만에 통과됩니다."
 LR_JAC_supermajority:0 "개헌 의석"
 LR_JAC_supermajority_desc:0 "3분의 2. 헌법을 고칠 수 있는 의석입니다. 반대파는 의사당을 나가며 '독재'를 외칩니다."
 LR_GIR_cabinet:0 "지롱드 내각"
 LR_GIR_cabinet_desc:0 "보르도의 포도주 상인과 리옹의 은행가들이 내각에 들어옵니다. 프랑스를 일으키는 것은 국가가 아니라 시장이라고 그들은 믿습니다."
 LR_GIR_deregulation:0 "탈규제"
 LR_GIR_deregulation_desc:0 "서류 한 장 받는 데 관청 일곱 곳을 돌던 시대가 끝납니다. 공장을 짓겠다는 사람을 말리는 일이 드디어 불법이 됩니다."
 LR_GIR_free_trade:0 "자유 무역"
 LR_GIR_free_trade_desc:0 "수입 관세를 내리자 영국 상품과 프랑스 포도주가 해협을 오갑니다. 노동조합은 항의하고 항구 도시는 호황입니다."
 LR_GIR_algeria:0 "알제리 진압"
 LR_GIR_algeria_desc:0 "알제리의 철광과 포도밭은 투자처로도 꽤 매력적입니다. 주주들이 조용히 군대 파견을 지지합니다."
 LR_GIR_rhine:0 "라인강으로"
 LR_GIR_rhine_desc:0 "루르의 석탄을 프랑스 자본이 차지할 절호의 기회입니다. 은행가들이 이렇게 전쟁을 좋아한 적이 있었던가요."
 LR_GIR_danube:0 "빈으로"
 LR_GIR_danube_desc:0 "도나우강은 유럽에서 가장 긴 시장입니다. 시장을 막는 왕조는 치워야 합니다."
 LR_GIR_channel:0 "해협 건너로"
 LR_GIR_channel_desc:0 "시티 오브 런던을 쓰러뜨리면 세계 금융의 중심은 파리로 옵니다. 그 계산이 이 전쟁의 전부입니다."
 LR_GIR_russia:0 "동쪽의 적"
 LR_GIR_russia_desc:0 "사유재산을 부정하는 공화국은 시장의 영원한 적입니다. AI라면 이 전쟁을 피하지 않습니다."
 LR_GIR_majority:0 "의회 과반"
 LR_GIR_majority_desc:0 "상공 회의소들의 후원금이 표로 돌아왔습니다. 51석, 드디어 세금 얘기를 꺼낼 수 있습니다."
 LR_GIR_reform_act:0 "개혁 입법"
 LR_GIR_reform_act_desc:0 "회사법 전면 개정안이 통과됩니다. 다음 날 파리 증권 거래소가 사상 최고치를 찍습니다."
 LR_GIR_supermajority:0 "개헌 의석"
 LR_GIR_supermajority_desc:0 "개헌선을 넘겼습니다. 재산권이 헌법 제1조로 올라갑니다."
 LR_MAR_cabinet:0 "푀양파 내각"
 LR_MAR_cabinet_desc:0 "1791년처럼 푀양파가 다시 묻습니다. 혁명은 이제 끝낼 때가 아닌가? 질서, 재산, 그리고 헌법 아래의 왕."
 LR_MAR_constitution:0 "입헌군주정 헌법"
 LR_MAR_constitution_desc:0 "왕은 있으되 통치하지 않습니다. 영국식이라는 비난에 푀양파는 답합니다. 적어도 영국은 전쟁에 이겼다고."
 LR_MAR_order:0 "질서 회복"
 LR_MAR_order_desc:0 "거리의 깃발을 치우고 헌병이 돌아옵니다. 파업 지도자들에게는 재판과 벌금이, 상점 주인들에게는 안도감이 찾아옵니다."
 LR_MAR_algeria:0 "알제리 진압"
 LR_MAR_algeria_desc:0 "질서의 회복은 본토에서 끝나지 않습니다. 정규군이 체면을 되찾으러 지중해를 건넙니다."
 LR_MAR_rhine:0 "라인강으로"
 LR_MAR_rhine_desc:0 "빈 회의 이래 프랑스의 안전은 라인강에 달려 있었습니다. 보수 정부도 이 점만큼은 급진적입니다."
 LR_MAR_danube:0 "빈으로"
 LR_MAR_danube_desc:0 "입헌 군주끼리는 대화가 통할 줄 알았으나, 합스부르크는 대화할 생각이 없습니다."
 LR_MAR_channel:0 "해협 건너로"
 LR_MAR_channel_desc:0 "영국은 모범이자 숙적입니다. 존경하는 상대를 쓰러뜨리는 일이 가장 어렵습니다."
 LR_MAR_russia:0 "동쪽의 적"
 LR_MAR_russia_desc:0 "질서의 적, 왕 없는 대국. AI라면 절반의 확률로만 벌이는 전쟁입니다."
 LR_MAR_majority:0 "의회 과반"
 LR_MAR_majority_desc:0 "지방 명사들의 조직표가 드디어 파리에 도착했습니다. 푀양파가 과반을 차지합니다."
 LR_MAR_reform_act:0 "개혁 입법"
 LR_MAR_reform_act_desc:0 "개혁이라고 부르지만 대부분 혁명기 법을 되돌리는 법안입니다."
 LR_MAR_supermajority:0 "개헌 의석"
 LR_MAR_supermajority_desc:0 "헌법을 고칠 수 있는 3분의 2. 왕의 귀환을 막을 것은 이제 아무것도 없습니다."
 LR_NAP_first_consul:0 "제1통령"
 LR_NAP_first_consul_desc:0 "아무나 보내라던 그 '아무나'가 프랑스의 주인이 되었습니다. 서른다섯 살의 코르시카인은 잠을 네 시간만 자고 전 부처의 서류를 다시 읽습니다."
 LR_NAP_civil_code:0 "나폴레옹 법전"
 LR_NAP_civil_code_desc:0 "혁명의 평등과 재산권을 하나의 법전으로 묶습니다. 훗날 그는 '내 진짜 영광은 전승이 아니라 이 법전'이라고 말할지도 모릅니다."
 LR_NAP_bank_of_france:0 "프랑스 은행"
 LR_NAP_bank_of_france_desc:0 "돈이 없으면 대포도 없습니다. 은행을 틀어쥐고 국채 이자를 깎자 증권가가 그에게 경례합니다."
 LR_NAP_legion_of_honour:0 "레지옹 도뇌르"
 LR_NAP_legion_of_honour_desc:0 "'군인은 색 리본을 위해 목숨을 바친다.' 태생이 아닌 공적으로 주는 훈장이 프랑스의 새 귀족을 만듭니다."
 LR_NAP_concordat:0 "정교 협약"
 LR_NAP_concordat_desc:0 "무신론자도 왕당파도 아닌 그가 교황과 협약을 맺습니다. 시골 사제들이 드디어 정부 편에 섭니다."
 LR_NAP_coronation:0 "대관식"
 LR_NAP_coronation_desc:0 "노트르담의 제단 앞, 교황이 들어 올린 왕관을 그가 빼앗아 스스로 씁니다. 공화국의 시대가 이렇게 끝납니다."
 LR_NAP_continental_system:0 "대륙봉쇄"
 LR_NAP_continental_system_desc:0 "영국 상품을 대륙에서 몰아냅니다. 함대로는 못 이기는 상대를 장부로 굶겨 죽일 작정입니다."
 LR_NAP_grande_armee:0 "대육군"
 LR_NAP_grande_armee_desc:0 "병과가 아니라 군단으로 움직이는 군대. 포병 장교 출신 황제가 탱크와 대포로 전쟁을 다시 씁니다."
 LR_NAP_marshals:0 "원수단"
 LR_NAP_marshals_desc:0 "술집 주인의 아들, 통 만드는 사람의 아들이 프랑스 원수의 지휘봉을 듭니다. '모든 병사의 배낭 속에 원수의 지휘봉이 있다.'"
 LR_NAP_rhine:0 "다시 라인강으로"
 LR_NAP_rhine_desc:0 "라인강 건너 군주들에게 선택지를 줍니다. 보호받거나, 짓밟히거나."
 LR_NAP_boulogne:0 "불로뉴의 진영"
 LR_NAP_boulogne_desc:0 "불로뉴 해안에 집결한 대군이 해협을 내려다봅니다. '안개만 걷히면 세상의 주인이 된다.'"
 LR_NAP_danube:0 "아우스터리츠로"
 LR_NAP_danube_desc:0 "아우스터리츠라는 지명을 아무도 모르는 세계입니다. 이제 곧 알게 될 것입니다."
 LR_NAP_moscow:0 "모스크바로"
 LR_NAP_moscow_desc:0 "이번에는 겨울이 오기 전에 끝냅니다. 측근들은 이 말을 왜 그렇게 불길해하는지 스스로도 설명하지 못합니다."
 LR_NAP_guardian:0 "공화국의 수호자"
 LR_NAP_guardian_desc:0 "모두가 왕관을 기다립니다. 그는 연미복을 입고 나타나 왕관을 치웁니다. '프랑스에 필요한 것은 황제가 아니라 공화국입니다.'"
 LR_GUA_oath:0 "대통령 선서"
 LR_GUA_oath_desc:0 "대통령 나폴레옹 보나파르트가 군복을 벗고 헌법에 손을 얹습니다. 온 유럽이 언제까지 저 손이 거기 있을지 지켜봅니다."
 LR_GUA_civilian_control:0 "군의 문민 통제"
 LR_GUA_civilian_control_desc:0 "자기 자신을 만든 쿠데타의 길을 스스로 막습니다. 장군은 의회의 질문에 답해야 합니다. 그 자신도 예외 없이."
 LR_GUA_suffrage:0 "보통선거 보장"
 LR_GUA_suffrage_desc:0 "남자와 여자, 파리와 코르시카를 가리지 않고 모든 시민이 투표합니다. 어떤 혁명도 하지 못한 일입니다."
 LR_GUA_social_insurance:0 "사회 보험"
 LR_GUA_social_insurance_desc:0 "부상병의 나라에서 사회 보험은 복지가 아니라 빚 갚기입니다. 대통령이 직접 연금 법안을 들고 의회에 갑니다."
 LR_GUA_constitution:0 "공화국 헌법"
 LR_GUA_constitution_desc:0 "대통령 임기를 못 박습니다. 황제가 될 수 있었던 사람이 다시는 아무도 황제가 되지 못하게 하는 헌법을 씁니다."
 LR_GUA_citizen_army:0 "시민의 군대"
 LR_GUA_citizen_army_desc:0 "대육군의 전술과 공화국의 정신. 병사는 황제가 아니라 헌법에 선서합니다."
 LR_GUA_rhine:0 "공화국의 라인 원정"
 LR_GUA_rhine_desc:0 "왕들의 유럽에 공화국의 군대가 들어갑니다. 약탈 금지 명령서가 총알보다 먼저 배포됩니다."
 LR_GUA_channel:0 "해협 건너로"
 LR_GUA_channel_desc:0 "웨스트민스터가 무너지면 영국 시민들도 처음으로 투표할 것입니다. 그것이 이 전쟁의 대의입니다."
 LR_GUA_danube:0 "도나우의 자유"
 LR_GUA_danube_desc:0 "헝가리와 체코의 민족 위원회에 전보를 칩니다. '자유 도나우 연방을 함께 세웁시다.'"
 LR_GUA_russia:0 "동쪽의 적"
 LR_GUA_russia_desc:0 "두 공화국의 전쟁을 원하는 사람은 왕들뿐입니다. 그래서 AI라면 절반의 확률로만 벌어집니다."
 LR_GUA_amnesty:0 "대사면"
 LR_GUA_amnesty_desc:0 "쿠데타의 상처를 닫습니다. 왕당파 장교도, 코뮌 투사도 감옥 문을 나옵니다. 측근들은 모두 반대했습니다."
 LR_GUA_league_of_republics:0 "공화국 동맹"
 LR_GUA_league_of_republics_desc:0 "필라델피아와 모스크바에 전보를 보냅니다. 왕 없는 나라들이 처음으로 서로를 찾습니다."
 LR_ORL_youth:0 "국민청년단"
 LR_ORL_youth_desc:0 "제복, 횃불, 합창. 오를레앙의 청년단은 패전을 기억하지 못하는 세대에게 패전의 분노를 가르칩니다."
 LR_ORL_veterans:0 "재향군인회"
 LR_ORL_veterans_desc:0 "훈장을 단 채 구걸하던 사람들이 왕의 제복을 다시 입습니다. 이들이 지지하는 한 어느 장관도 왕에게 반대하지 못합니다."
 LR_ORL_tear_up_treaty:0 "강화 조약 파기"
 LR_ORL_tear_up_treaty_desc:0 "왕이 강화 조약문을 의사당 단상에서 찢습니다. 런던의 대사가 자리를 박차고 나가도 박수는 멈추지 않습니다."
 LR_ORL_secret_staff:0 "비밀 참모본부"
 LR_ORL_secret_staff_desc:0 "조약은 참모본부를 금지했습니다. 그래서 '측량국'이라는 간판이 걸린 건물에 대령 삼십 명이 출근합니다."
 LR_ORL_press_control:0 "언론 통제"
 LR_ORL_press_control_desc:0 "신문은 왕의 목소리입니다. 사설을 쓰기 전에 편집장은 내무부에 전화를 겁니다."
 LR_ORL_autarky:0 "자급자족 경제"
 LR_ORL_autarky_desc:0 "수입 고무도, 외국 석유도, 영국 은행도 없이. 프랑스가 스스로 먹고 스스로 무장합니다."
 LR_ORL_latin_front:0 "라틴 전선"
 LR_ORL_latin_front_desc:0 "마드리드의 왕에게 비밀 특사가 갑니다. 영국의 지중해에 맞설 라틴 민족의 전선을 제안합니다."
 LR_BOU_reims:0 "랭스 대관식"
 LR_BOU_reims_desc:0 "역대 프랑스 왕이 기름 부음을 받은 대성당. 전쟁으로 무너진 지붕 아래에서 왕이 왕관을 씁니다."
 LR_BOU_church:0 "교회와의 화해"
 LR_BOU_church_desc:0 "교황 대사가 튈르리에 초대받습니다. 왕관과 제단은 혁명 전부터 함께였고, 이제 다시 함께합니다."
 LR_BOU_peers:0 "귀족원 부활"
 LR_BOU_peers_desc:0 "옛 가문의 이름들이 귀족원 명패에 다시 적힙니다. 그들의 땅과 충성이 왕좌를 떠받칩니다."
 LR_BOU_colonial_talks:0 "식민지 반환 협상"
 LR_BOU_colonial_talks_desc:0 "샴페인과 인내심으로 런던의 외무부 문을 두드립니다. 땅은 못 돌려받아도 항구 사용권 몇 개는 건질지 모릅니다."
 LR_BOU_mediterranean_pact:0 "지중해 해군 협정"
 LR_BOU_mediterranean_pact_desc:0 "툴롱과 카르타헤나의 제독들이 해도를 맞댑니다. 지브롤터의 영국인들이 이 회담을 탐탁지 않게 여깁니다."
 LR_BOU_latin_league:0 "라틴 왕가 동맹"
 LR_BOU_latin_league_desc:0 "파리, 마드리드, 나폴리의 왕이 한 테이블에 앉았습니다. 대륙 서쪽이 다시 부르봉의 가족 모임이 됩니다."
 LR_BOU_family_council:0 "왕가 가족 회의"
 LR_BOU_family_council_desc:0 "수백 년 묵은 혈통이 오랜만에 정치적 쓸모를 찾았습니다. 혼약과 조약이 같은 서랍에서 나옵니다."
 LR_COM_red_guards:0 "노동자 민병대"
 LR_COM_red_guards_desc:0 "소총은 공장 사물함에 보관합니다. 교대가 끝나면 노동자는 민병대원이 됩니다."
 LR_COM_land_reform:0 "토지 개혁"
 LR_COM_land_reform_desc:0 "방데의 영주 저택이 농민 협동조합 본부가 됩니다. 이 땅에서 혁명이 뿌리내릴지는 이 일에 달렸습니다."
 LR_COM_economic_plan:0 "경제 계획"
 LR_COM_economic_plan_desc:0 "시장의 혼란 대신 평의회의 계획입니다. 칠판의 숫자는 늘 달성되고, 공장장들은 늘 칠판을 고칩니다."
 LR_COM_council:0 "코뮌 평의회"
 LR_COM_council_desc:0 "파리 스무 개 구마다 평의회가 열립니다. 회의는 길고 담배 연기는 자욱하지만, 처음으로 모두가 말합니다."
 LR_COM_international:0 "혁명 인터내셔널"
 LR_COM_international_desc:0 "베를린에서, 밀라노에서, 런던에서 망명 혁명가들이 파리로 옵니다. 세계 혁명의 사령부가 몽마르트르에 차려집니다."
 LR_COM_russian_treaty:0 "러시아 공화국과의 조약"
 LR_COM_russian_treaty_desc:0 "모스크바와 파리, 왕 없는 두 나라가 드디어 손을 잡습니다. 왕들의 유럽이 양쪽에서 포위됩니다."
 LR_COM_peoples_army:0 "인민군 창설"
 LR_COM_peoples_army_desc:0 "장교를 투표로 뽑는 군대는 이론상 민주적이고 실전에서 위험합니다. 그래도 그들은 왜 싸우는지 알고 있습니다."
 LR_JAC_forty_hours:0 "주 40시간"
 LR_JAC_forty_hours_desc:0 "주 40시간. 공장 벽에 새 근무표가 붙은 날, 프랑스 노동자들은 믿기지 않는다는 표정으로 일찍 퇴근합니다."
 LR_JAC_paid_leave:0 "유급 휴가"
 LR_JAC_paid_leave_desc:0 "난생처음 바다를 보러 가는 금속 노동자 가족들로 기차역이 붐빕니다. 부르주아 신문은 해변이 더러워졌다고 불평합니다."
 LR_JAC_laicite:0 "정교분리 강화"
 LR_JAC_laicite_desc:0 "교실 벽의 십자가를 내리고 공화국의 흉상을 올립니다. 시골 사제들은 이번 주 설교 주제를 정했습니다."
 LR_JAC_bank_reform:0 "프랑스 은행 개혁"
 LR_JAC_bank_reform_desc:0 "프랑스 은행 이사회의 200대 주주를 쫓아냅니다. 나라의 돈줄이 드디어 나라의 손에 들어옵니다."
 LR_JAC_arms_nationalised:0 "군수 산업 국유화"
 LR_JAC_arms_nationalised_desc:0 "슈나이더 가문은 전쟁으로 대를 이어 부자가 되었습니다. 이제 포탄 값은 의회가 정합니다."
 LR_GIR_bourse:0 "증권 시장 개방"
 LR_GIR_bourse_desc:0 "외국 자본의 족쇄를 풉니다. 브롱냐르 궁의 거래소에 다시 영어와 독일어가 들립니다."
 LR_GIR_tax_cut:0 "감세"
 LR_GIR_tax_cut_desc:0 "부자들의 세금을 깎으면 일자리가 생긴다고들 합니다. 적어도 부자들은 그렇게 말합니다."
 LR_GIR_tariffs_down:0 "관세 인하"
 LR_GIR_tariffs_down_desc:0 "낮은 관세로 값싼 기계와 원료가 들어옵니다. 경쟁을 버틴 공장만 남습니다."
 LR_GIR_free_ports:0 "자유항"
 LR_GIR_free_ports_desc:0 "마르세유와 르아브르를 자유항으로 선포합니다. 세관원은 할 일이 없어졌고 조선소는 바빠졌습니다."
 LR_GIR_rail_privatised:0 "철도 민영화"
 LR_GIR_rail_privatised_desc:0 "노선 경매장이 인산인해입니다. 수익 나는 노선은 팔리고, 안 나는 노선의 시골 주민들은 시위를 시작합니다."
 LR_MAR_kings_return:0 "왕실 귀환 협상"
 LR_MAR_kings_return_desc:0 "망명 중인 왕가에 사절이 갑니다. 조건은 하나, 헌법에 선서할 것. 왕은 답장을 몇 달째 쓰고 있습니다."
 LR_MAR_senate:0 "상원 복원"
 LR_MAR_senate_desc:0 "지방 명사들의 상원이 부활합니다. 평민 의회가 무엇을 통과시키든 그들이 천천히 읽어 볼 것입니다."
 LR_MAR_civil_law:0 "재산권 수호법"
 LR_MAR_civil_law_desc:0 "혁명 때 빼앗긴 땅의 원소유권을 인정합니다. 농민들은 믿을 수 없다는 표정으로 고지서를 받습니다."
 LR_MAR_church_schools:0 "교회 학교 복원"
 LR_MAR_church_schools_desc:0 "교육을 다시 사제의 손에 맡깁니다. 시골 학교에 십자가가 돌아오고, 파리의 교사들은 파업을 예고합니다."
 LR_MAR_gendarmerie:0 "헌병대 강화"
 LR_MAR_gendarmerie_desc:0 "말 탄 헌병대가 마을마다 돌아옵니다. 정부는 이것을 '평온의 회복'이라고 부릅니다."
 LR_NAP_imperial_guard:0 "제국 근위대"
 LR_NAP_imperial_guard_desc:0 "곰털 모자 대신 강철 투구를 쓴 근위대. 그들은 황제가 직접 이름을 불러 주는 병사들입니다."
 LR_NAP_imperial_nobility:0 "제국 귀족"
 LR_NAP_imperial_nobility_desc:0 "공으로 얻은 공작과 백작. 옛 귀족들은 경멸했지만, 그들의 저택은 이제 새 주인을 맞았습니다."
 LR_NAP_rhine_confederation:0 "라인 연방의 꿈"
 LR_NAP_rhine_confederation_desc:0 "독일의 제후들과 점령지를 하나로 묶어 황제의 보호령으로 삼습니다. 라인 연방의 꿈이 지도 위에 나타납니다. 프랑스군이 점령한 독일 땅이 있어야 합니다."
 LR_NAP_brother_kings:0 "형제들의 왕국"
 LR_NAP_brother_kings_desc:0 "조제프에게는 나폴리를, 뤼시앵에게는 마드리드를, 루이에게는 헤이그를. 코르시카 소귀족 집안이 유럽의 왕실이 되어 갑니다."
 LR_ORL_suppress:0 "공화주의자 색출"
 LR_ORL_suppress_desc:0 "군경이 공장 지대의 클럽을 하나씩 찾아냅니다. 도시의 밤이 조용해질수록 왕궁은 안심합니다."
 LR_ORL_uproot:0 "혁명의 뿌리 뽑기"
 LR_ORL_uproot_desc:0 "마지막 지하 신문이 폐쇄되었습니다. 혁명은 이제 책에서나 읽을 수 있습니다. 적어도 왕의 경찰은 그렇게 믿습니다."
 LR_BOU_suppress:0 "왕실 경찰 강화"
 LR_BOU_suppress_desc:0 "왕실 경찰이 공화주의자의 명단을 넘깁니다. 체포 영장에는 전부 왕의 인장이 찍혀 있습니다."
 LR_BOU_uproot:0 "혁명의 뿌리 뽑기"
 LR_BOU_uproot_desc:0 "지하 클럽의 마지막 간부가 기아나행 배에 올랐습니다. 파리 시민들은 드디어 혁명 이야기를 소곤대지도 않습니다."
 LR_MAR_suppress:0 "헌법 수호법"
 LR_MAR_suppress_desc:0 "공화국 전복 선동을 법으로 금합니다. 판사들은 이 법의 뜻을 아주 넓게 해석합니다."
 LR_MAR_uproot:0 "급진파 해산"
 LR_MAR_uproot_desc:0 "급진 정당과 지하 클럽이 법원 명령으로 해산되었습니다. 합법적인 방식으로 혁명이 끝났다고 정부는 만족합니다."
 LR_COM_suppress:0 "혁명 재판소"
 LR_COM_suppress_desc:0 "혁명 재판소가 다시 문을 엽니다. 귀족 명부와 사제 명부, 그리고 어제까지 동지였던 사람들의 이름이 올라옵니다."
 LR_COM_uproot:0 "반혁명의 뿌리 뽑기"
 LR_COM_uproot_desc:0 "방데의 마지막 반혁명 조직이 무너졌습니다. 왕당파라는 말은 이제 욕설로만 남았습니다."
 LR_JAC_suppress:0 "공안 경찰"
 LR_JAC_suppress_desc:0 "공안 경찰이 왕당파의 음모를 추적합니다. 편지를 뜯고, 술집을 엿듣고, 1793년의 기억이 슬며시 돌아옵니다."
 LR_JAC_uproot:0 "방데 평정"
 LR_JAC_uproot_desc:0 "방데의 숲에서 마지막 왕당파 부대가 항복했습니다. 이번에는 대학살 없이 끝났다는 것이 공화국의 자랑입니다."
 LR_GIR_suppress:0 "지방 분권 협약"
 LR_GIR_suppress_desc:0 "왕당파 지주들과 협상 테이블에 앉습니다. 그들에게 필요한 것은 왕이 아니라 안전한 재산일지 모릅니다."
 LR_GIR_uproot:0 "왕당파 해체"
 LR_GIR_uproot_desc:0 "왕당파의 후원금이 끊겼습니다. 후원자들이 공화국 국채가 더 수익이 좋다는 것을 깨달았기 때문입니다."
 LR_NAP_suppress:0 "푸셰의 경찰"
 LR_NAP_suppress_desc:0 "푸셰의 후계자들이 전국에 밀정을 풉니다. 왕당파의 편지는 수신인보다 먼저 경찰 장관의 책상에 도착합니다."
 LR_NAP_uproot:0 "왕당파의 종말"
 LR_NAP_uproot_desc:0 "왕당파의 마지막 음모가 영국의 자금과 함께 적발되었습니다. 파리 시민들이 공원에서 왕의 이름을 입에 올리지 않은 지 오래입니다."
 LR_ORL_left_bank:0 "라인강 서안 합병"
 LR_ORL_left_bank_desc:0 "라인강 서안은 프랑스의 자연 국경입니다. 왕은 강의 왼쪽 땅에 프랑스 지사를 보냅니다."
 LR_COM_left_bank:0 "라인강 서안 편입"
 LR_COM_left_bank_desc:0 "강 왼쪽의 노동자들이 프랑스 공화국 편입을 '요청'했습니다. 혁명 재판소가 그 투표를 검증합니다."
 LR_NAP_left_bank:0 "라인강 서안 합병"
 LR_NAP_left_bank_desc:0 "라인강 서안은 왕들도 공화국도 해내지 못한 숙원입니다. 황제의 칙령 한 장으로 강 왼쪽이 프랑스가 됩니다."
 LR_PET_marshal:0 "베르됭의 원수"
 LR_PET_marshal_desc:0 "반발을 다스리지 못한 정부가 무너졌습니다. 대전쟁에서 베르됭을 지킨 여든 살 원수가 전권을 쥡니다. 그는 혁명도 왕정도 아닌 세 번째 길을 약속합니다. 질서, 노동, 가족, 조국. 프랑스는 다시 아버지를 갖게 되었습니다."
 LR_PET_labour_charter:0 "노동 헌장"
 LR_PET_labour_charter_desc:0 "파업도 직장 폐쇄도 없는 나라. 노동조합과 사장 단체를 해산하고, 업종마다 노동자와 사장이 함께 들어가는 조합을 세웁니다. 계급 투쟁은 법으로 금지됩니다. 원수는 이것을 화해라고 부르고, 노동자들은 침묵이라고 부릅니다."
 LR_PET_family_code:0 "가족법"
 LR_PET_family_code_desc:0 "대전쟁이 앗아간 한 세대의 빈자리가 아직 메워지지 않았습니다. 어머니의 날이 국가 기념일이 되고, 아이를 셋 이상 둔 가정에는 수당이 나옵니다. 이혼은 어려워지고, 기혼 여성은 공직에서 물러나야 합니다."
 LR_PET_return_to_soil:0 "땅으로의 귀환"
 LR_PET_return_to_soil_desc:0 "흙은 거짓말을 하지 않는다. 원수의 말이 역마다 붙습니다. 도시의 실업자와 노동자를 농촌의 빈 농가로 보냅니다. 공장과 노조가 혁명을 낳았다면, 밭과 교회는 질서를 낳을 것이라고 정부는 믿습니다."
 LR_PET_peasant_corporation:0 "농민 조합"
 LR_PET_peasant_corporation_desc:0 "모든 농민이 하나의 조합에 가입합니다. 조합은 씨앗과 비료를 나누고 수확량과 가격을 정합니다. 그 조합의 지도부는 원수가 임명한 지방 명사들입니다."
 LR_PET_youth_camps:0 "청년 작업장"
 LR_PET_youth_camps_desc:0 "스무 살 청년들이 군복과 비슷한 초록색 제복을 입고 여덟 달 동안 숲과 산으로 갑니다. 그들은 나무를 베고 길을 닦고 저녁마다 원수에게 바치는 노래를 부릅니다. 징병이 금지된 나라에서 이것은 징병과 아주 닮았습니다."
 LR_PET_secours_national:0 "국민 구호"
 LR_PET_secours_national_desc:0 "국민 구호 단체가 원수의 이름으로 겨울 외투와 빵을 나눠 줍니다. 빵 봉투에는 원수의 얼굴이 찍혀 있습니다. 배부른 마을은 바리케이드를 쌓지 않습니다."
 LR_PET_school_cross:0 "학교의 십자가"
 LR_PET_school_cross_desc:0 "공화국이 50년 전에 떼어 냈던 십자가가 교실 벽에 다시 걸립니다. 교과서에서 혁명의 영웅들이 빠지고 잔 다르크와 성왕 루이가 들어옵니다. 교사 노조는 해산되었습니다."
 LR_PET_national_revolution:0 "국민 혁명"
 LR_PET_national_revolution_desc:0 "자유, 평등, 박애. 150년 동안 공화국의 동전에 새겨진 세 낱말이 노동, 가족, 조국으로 바뀝니다. 원수는 이것을 국민 혁명이라고 부릅니다. 혁명을 가장 싫어하는 사람이 혁명이라는 말을 고른 것입니다."
 LR_PET_constitutional_acts:0 "헌법 법령 제1호"
 LR_PET_constitutional_acts_desc:0 "헌법 법령 제1호. 원수가 국가원수의 칭호를 취합니다. 대통령의 자리는 사라지고, 의회는 무기한 휴회합니다. 법은 이제 원수의 서명 하나로 만들어집니다."
 LR_PET_legion:0 "참전용사 군단"
 LR_PET_legion_desc:0 "대전쟁의 참전용사들이 하나의 군단으로 묶입니다. 베레모를 쓴 노병들은 마을마다 지부를 세우고 원수의 초상을 앞세워 행진합니다. 그리고 이웃의 이름을 적어 군청에 보냅니다."
 LR_PET_national_council:0 "국민 평의회"
 LR_PET_national_council_desc:0 "선거로 뽑힌 의원 대신 원수가 지명한 명사들이 국민 평의회에 모입니다. 주교, 장군, 농민 조합장, 사장, 몇 명의 노동자 대표. 그들은 토론하지만 결정하지는 않습니다."
 LR_PET_riom_trial:0 "리옴 재판"
 LR_PET_riom_trial_desc:0 "패배와 혼란의 책임을 옛 정부의 총리와 장관, 장군들에게 묻습니다. 리옴의 법정에서 공화국 그 자체가 피고석에 앉습니다. 그러나 피고들은 순순히 고개를 숙일 사람들이 아닙니다."
 LR_PET_heir_weygand:0 "베강을 후계자로"
 LR_PET_heir_weygand_desc:0 "원수 다음은 군대입니다. 대전쟁 때 포슈의 참모장이었던 베강 장군이 후계자로 지명됩니다. 그는 원수보다도 늙었고, 원수보다도 의회를 싫어합니다."
 LR_PET_heir_darlan:0 "다를랑을 후계자로"
 LR_PET_heir_darlan_desc:0 "원수 다음은 함대입니다. 해군을 손에 쥔 다를랑 제독이 후계자로 지명됩니다. 그는 누구와도 거래할 줄 알고, 해군만은 끝까지 지킨 사람입니다."
 LR_PET_madrid_embassy:0 "마드리드 대사관"
 LR_PET_madrid_embassy_desc:0 "원수는 젊은 날 모로코에서 스페인군과 함께 싸웠고, 그 인연으로 마드리드 대사를 지냈습니다. 그 시절의 친구들이 지금 스페인 궁정의 장군들입니다. 피레네 너머로 다시 편지를 씁니다."
 LR_PET_vatican:0 "바티칸과의 화해"
 LR_PET_vatican_desc:0 "교황청이 원수에게 축복을 보냅니다. 교회의 재산이 돌아오고, 수도회가 다시 학교를 맡습니다. 혁명이 쫓아낸 신부들이 150년 만에 강단으로 돌아옵니다."
 LR_PET_montoire:0 "몽투아르의 악수"
 LR_PET_montoire_desc:0 "몽투아르의 작은 역에서 원수가 승전국의 대표와 악수합니다. 배상금은 줄고, 국경은 조용해집니다. 그 대신 프랑스의 칼은 칼집에 들어갑니다. 사진 한 장이 전 세계 신문에 실립니다."
 LR_PET_hidden_sword:0 "칼집 속의 칼"
 LR_PET_hidden_sword_desc:0 "악수는 하되 칼은 숨깁니다. 원수의 참모들이 동원 명부를 다시 쓰고, 무기를 산속 창고로 옮깁니다. 감시단이 오면 빈 창고와 차 한 잔이 그들을 맞습니다."
 LR_PET_verdun_doctrine:0 "베르됭의 교리"
 LR_PET_verdun_doctrine_desc:0 "그들은 지나가지 못한다. 1916년 베르됭에서 원수가 남긴 말이 육군의 교리가 됩니다. 화력과 요새, 참호와 예비대. 원수는 공세를 믿지 않습니다. 먼저 버티고, 적이 지칠 때 나아갑니다."
 LR_PET_maginot:0 "마지노선 완공"
 LR_PET_maginot_desc:0 "예산이 끊겨 멈춰 있던 요새 공사를 다시 시작합니다. 콘크리트와 강철이 알자스와 로렌의 언덕 아래로 들어갑니다. 원수는 공사장을 둘러보며 만족스럽게 고개를 끄덕입니다."
 LR_PET_suppress:0 "헌병대 계엄"
 LR_PET_suppress_desc:0 "반발이 큰 지역마다 헌병대와 계엄령이 내려집니다. 통행금지, 검문, 신문 검열. 원수의 프랑스에서 질서는 협상의 대상이 아닙니다."
 LR_PET_uproot:0 "반국가 세력 일소"
 LR_PET_uproot_desc:0 "공산주의자의 비밀 인쇄소와 왕당파의 무기고를 같은 날 덮칩니다. 원수의 경찰은 좌우를 가리지 않습니다. 그날 이후 프랑스의 지하에는 아무도 남지 않습니다."
 LR_PET_algeria:0 "알제리 질서 회복"
 LR_PET_algeria_desc:0 "알제리는 다시 질서를 원한다고 원수는 믿습니다. 원수의 초상이 찍힌 배지를 단 병사들이 툴롱 부두에서 수송선에 오릅니다."
 LR_PET_rhine:0 "베르됭에서 라인으로"
 LR_PET_rhine_desc:0 "여든 살 원수가 생애 마지막 공세를 명령합니다. 그는 베르됭에서 지켰고, 이제 라인강으로 나아갑니다. 신중하게, 한 걸음씩."
 LR_PET_danube:0 "빈으로"
 LR_PET_danube_desc:0 "프랑스를 무릎 꿇린 승전국들 가운데 가장 오래된 왕가가 빈에 있습니다. 원수는 그 빚을 받으러 갑니다."
 LR_PET_channel:0 "해협 건너로"
 LR_PET_channel_desc:0 "원수는 대전쟁 때 영국군이 먼저 물러나려 했던 날을 잊지 않았습니다. 이번에는 해협을 건너갑니다."
 LR_PET_russia:0 "동쪽의 적"
 LR_PET_russia_desc:0 "왕들의 유럽에 남은 마지막 혁명의 나라입니다. 원수는 혁명이라는 말을 혐오하고, 겨울을 아는 사람입니다."
 LR_ANA_federation:0 "자유 코뮌 연합"
 LR_ANA_federation_desc:0 "총선에서 이긴 사회주의자들이 둘로 갈라졌습니다. 중앙위원회 대신 코뮌과 조합의 자유 연합을 택한 사람들이 이겼습니다. 파리 시청에 검은색과 붉은색으로 나뉜 깃발이 오릅니다. 위원회도 당도 없는 혁명이 시작됩니다."
 LR_ANA_syndicates_take:0 "공장은 조합의 것"
 LR_ANA_syndicates_take_desc:0 "사장실이 비었습니다. 공장마다 노동자 총회가 생산 계획과 임금과 근무 시간을 투표로 정합니다. 공장은 그곳에서 일하는 사람들의 것입니다."
 LR_ANA_free_communes:0 "자유 코뮌"
 LR_ANA_free_communes_desc:0 "파리가 보낸 시장 대신 마을 총회가 마을을 다스립니다. 일요일 오후 성당 앞 광장에서 사람들이 손을 들어 우물과 학교와 도로를 정합니다."
 LR_ANA_collectives:0 "자유 집산"
 LR_ANA_collectives_desc:0 "원하는 마을은 땅과 쟁기와 수확을 함께 씁니다. 원하지 않는 사람은 자기 밭을 그대로 갈아도 됩니다. 강제로 만든 집산은 지주가 바뀐 것뿐이라고 연합은 말합니다."
 LR_ANA_abolish_money:0 "화폐 없는 마을"
 LR_ANA_abolish_money_desc:0 "몇몇 코뮌이 마을 광장에서 프랑 지폐를 불태웁니다. 빵집과 대장간은 배급표로 돌아갑니다. 유럽의 은행가들은 이 소식에 웃음을 터뜨렸다가 곧 웃음을 멈춥니다."
 LR_ANA_housing:0 "빈집 징발"
 LR_ANA_housing_desc:0 "부자들이 떠난 빈 저택과 아파트에 판자촌의 가족들이 들어갑니다. 16구의 응접실에서 벨빌의 아이들이 숙제를 합니다."
 LR_ANA_rationalist_schools:0 "합리주의 학교"
 LR_ANA_rationalist_schools_desc:0 "바르셀로나의 페레르가 꿈꾸던 학교가 프랑스에 문을 엽니다. 신부도 국가도 없는 교실에서 아이들은 외우는 대신 묻는 법을 배웁니다. 시험도 상장도 없습니다."
 LR_ANA_ateneos:0 "민중 회관"
 LR_ANA_ateneos_desc:0 "동네마다 민중 회관이 생깁니다. 낮에는 도서관이고 저녁에는 강연장이며 주말에는 극장입니다. 글을 모르던 노인들이 여기서 처음 신문을 읽습니다."
 LR_ANA_proudhon:0 "프루동의 연방주의"
 LR_ANA_proudhon_desc:0 "재산은 도둑질이다라고 쓴 사람, 프루동의 연방주의를 꺼냅니다. 나라는 위에서 아래로가 아니라, 코뮌에서 지역으로, 지역에서 연합으로, 아래에서 위로 묶입니다."
 LR_ANA_abolish_prefects:0 "도지사 폐지"
 LR_ANA_abolish_prefects_desc:0 "나폴레옹 이래 파리의 명령을 지방에 전하던 도지사들을 모두 집으로 돌려보냅니다. 도청 건물은 학교와 병원이 됩니다."
 LR_ANA_mandates:0 "위임과 소환"
 LR_ANA_mandates_desc:0 "대표는 총회가 정해 준 대로만 말하고, 총회는 언제든 대표를 불러들일 수 있습니다. 직업 정치인이라는 말이 이 나라에서 사라집니다."
 LR_ANA_congress:0 "코뮌 대회"
 LR_ANA_congress_desc:0 "전국의 코뮌과 조합이 대표를 보내 첫 연합 대회를 엽니다. 회의는 엿새 동안 이어지고, 의장은 하루에 한 번씩 바뀝니다."
 LR_ANA_platform:0 "강령파"
 LR_ANA_platform_desc:0 "강령파가 이겼습니다. 하나의 강령, 하나의 전술, 공동의 책임. 우크라이나 초원의 흑군이 조직이 없어서 무너졌다는 교훈을 그들은 잊지 않았습니다."
 LR_ANA_synthesis:0 "종합파"
 LR_ANA_synthesis_desc:0 "종합파가 이겼습니다. 아나코생디칼리스트도, 개인주의자도, 공산주의적 아나키스트도 같은 회관을 씁니다. 수단이 목적을 삼키게 두지 않겠다는 약속입니다."
 LR_ANA_columns:0 "민병대 종대"
 LR_ANA_columns_desc:0 "계급장 없는 민병대 종대가 조직됩니다. 소매에는 검붉은 완장을 차고, 노래를 부르며 열차에 오릅니다. 그들에게는 장군 대신 대표가 있습니다."
 LR_ANA_elected_officers:0 "장교 선출"
 LR_ANA_elected_officers_desc:0 "병사들이 손을 들어 대표를 뽑습니다. 대표는 앞장서서 싸우고, 잘못하면 다음 날 소환됩니다. 옛 장교들은 이것이 군대인지 묻습니다."
 LR_ANA_militarisation:0 "민병대의 군대화"
 LR_ANA_militarisation_desc:0 "왕들의 군대는 노래를 부르며 오지 않습니다. 긴 토론 끝에 연합은 결론에 이릅니다. 민병대에도 규율과 훈련과 참모가 필요하다고. 옛 하사관들이 다시 교관이 됩니다."
 LR_ANA_cnt_brothers:0 "바르셀로나의 형제들"
 LR_ANA_cnt_brothers_desc:0 "피레네 너머 바르셀로나에는 프랑스보다 오래된 조합 운동이 있습니다. 그들에게 전단과 돈, 그리고 언젠가는 총을 보냅니다."
 LR_ANA_carrara:0 "카라라의 채석공"
 LR_ANA_carrara_desc:0 "토스카나의 대리석 채석장 카라라는 이탈리아 무정부주의의 요람입니다. 채석공들의 조합에 파리의 편지가 도착합니다."
 LR_ANA_iwa:0 "국제노동자협회"
 LR_ANA_iwa_desc:0 "베를린에서 세워졌다가 잠든 조합들의 인터내셔널, 국제노동자협회를 파리에서 다시 깨웁니다. 스웨덴과 포르투갈과 아르헨티나의 조합원들이 답장을 보냅니다."
 LR_ANA_free_territory:0 "자유 영토의 기억"
 LR_ANA_free_territory_desc:0 "대전쟁 뒤 우크라이나 초원에서 흑군이 세웠던 자유 영토를 기억하는 사람들이 아직 살아 있습니다. 그들에게 편지를 보냅니다."
 LR_ANA_suppress:0 "자경 위원회"
 LR_ANA_suppress_desc:0 "마을 총회가 뽑은 자경단이 반혁명 조직을 감시합니다. 경찰은 없지만 눈은 많습니다."
 LR_ANA_uproot:0 "반혁명 무장 해제"
 LR_ANA_uproot_desc:0 "왕당파 장교와 지주의 비밀 무기고를 모두 비웁니다. 총을 내려놓은 사람은 집으로 돌아갈 수 있습니다. 그날 이후 반혁명은 무기를 잃습니다."
 LR_ANA_algerian_freedom:0 "알제리 자유 코뮌"
 LR_ANA_algerian_freedom_desc:0 "알제리를 다시 정복하는 대신, 그 땅의 부두 노동자와 농민들에게 손을 내밉니다. 국경은 왕들이 그은 선일 뿐이라고 연합은 말합니다."
 LR_ANA_rhine:0 "라인강 건너 형제들에게"
 LR_ANA_rhine_desc:0 "루르의 광부들에게 총과 자유를 함께 가져갑니다. 이것은 프랑스와 독일의 전쟁이 아니라 노동자와 왕의 전쟁이라고 연합 대회는 선언했습니다."
 LR_ANA_danube:0 "민족의 감옥을 부수다"
 LR_ANA_danube_desc:0 "합스부르크의 민족의 감옥을 부수러 갑니다. 간수만 바꾸러 가는 것이 아닙니다."
 LR_ANA_channel:0 "해협 건너로"
 LR_ANA_channel_desc:0 "런던의 귀족 의회를 끝내러 갑니다. 선원 조합이 투표로 출항을 결정했습니다."
 LR_NAP_red:0 "붉은 나폴레옹"
 LR_NAP_red_desc:0 "1922년 여름, 스물한 살의 포병 소위는 자코뱅 소책자를 썼습니다. 대전쟁의 패배 속에서 그가 처음 꿈꾼 것은 왕관이 아니라 혁명이었습니다. 원로원이 왕관을 내미는 지금, 그는 그 소책자를 기억해 냅니다. 붉은 깃발과 대포를 함께 든 혁명입니다."
 LR_RED_tribune:0 "인민의 호민관"
 LR_RED_tribune_desc:0 "제1통령의 견장 위에 붉은 리본이 달립니다. 노동자 평의회가 통령을 인민의 호민관으로 추대합니다. 왕당파는 망명길에 오르고, 사회주의자들은 이 사람을 믿어도 되는지 아직 확신하지 못합니다."
 LR_RED_maximum:0 "곡물 최고 가격령"
 LR_RED_maximum_desc:0 "1793년 국민공회는 빵값의 상한을 정하고 숨긴 곡물을 징발했습니다. 붉은 통령이 그 법령을 다시 꺼냅니다. 도시는 먹고, 농촌은 투덜댑니다."
 LR_RED_workshops:0 "국민 작업장"
 LR_RED_workshops_desc:0 "1848년 실패한 국민 작업장을 이번에는 국가가 끝까지 책임집니다. 실업자는 국가의 공장에서 일하고, 그 공장들은 무엇보다 대포를 만듭니다."
 LR_RED_arsenals:0 "인민 병기창"
 LR_RED_arsenals_desc:0 "슈나이더와 르노와 오치키스의 공장이 인민의 병기창이 됩니다. 사주들은 망명했고, 공장장은 노동자 평의회와 포병 장교가 함께 맡습니다."
 LR_RED_soldiers_land:0 "병사에게 땅을"
 LR_RED_soldiers_land_desc:0 "망명한 귀족들의 영지를 갈라 제대 군인에게 나눠 줍니다. 로마의 장군들이 그랬듯, 병사들은 땅을 준 사람을 잊지 않습니다."
 LR_RED_calendar_plan:0 "혁명력 경제 계획"
 LR_RED_calendar_plan_desc:0 "포도의 달에 시작하는 첫 경제 계획이 공장마다 걸립니다. 혁명력과 5개년 계획이 한 장의 포스터에 같이 인쇄됩니다."
 LR_RED_beaucaire:0 "보케르의 저녁 식사"
 LR_RED_beaucaire_desc:0 "1922년, 아비뇽으로 가던 젊은 포병 소위가 보케르의 여관에서 상인들과 논쟁한 뒤 쓴 소책자, 보케르의 저녁 식사. 공화국은 이길 것이고, 그것을 지키는 것은 대포라는 내용입니다. 그 소책자를 다시 찍습니다."
 LR_RED_committee:0 "공안위원회 재건"
 LR_RED_committee_desc:0 "통령이 의장석에 앉는 공안위원회가 다시 열립니다. 로베스피에르의 위원회와 다른 점은 단 하나, 의장이 포병 장교라는 것입니다."
 LR_RED_people_vote:0 "인민 투표"
 LR_RED_people_vote_desc:0 "인민의 통령에 찬성합니까? 투표는 투표소가 아니라 공장과 병영의 평의회에서 손을 들어 치러집니다."
 LR_RED_red_marshals:0 "붉은 원수들"
 LR_RED_red_marshals_desc:0 "견장에 붉은 별을 단 원수들이 임명됩니다. 알제부터 함께 온 장군들과 공장 평의회 출신의 젊은 지휘관들이 같은 지휘봉을 받습니다."
 LR_RED_sword:0 "세계 혁명의 칼"
 LR_RED_sword_desc:0 "대육군이 가는 곳마다 왕궁이 불타고 인민 공화국이 섭니다. 혁명은 수출되어야 살아남는다고 통령은 믿습니다."
 LR_RED_continental_socialism:0 "사회주의 대륙 체제"
 LR_RED_continental_socialism_desc:0 "혁명은 프랑스의 깃발 아래에서만 안전합니다. 유럽의 인민 공화국들은 파리를 중심으로 하나의 대륙 체제에 묶입니다. 그 체제의 이름이 제국이 아니라는 것만 다릅니다."
 LR_RED_levee:0 "국민 총동원령"
 LR_RED_levee_desc:0 "모든 프랑스인은 영구히 군대의 징발 대상이다. 1793년 8월 23일의 국민 총동원령이 다시 낭독됩니다. 젊은이는 싸우고, 기혼자는 무기를 만들고, 여자는 천막을 짓습니다."
 LR_RED_commissars:0 "원수와 정치위원"
 LR_RED_commissars_desc:0 "원수의 명령서에는 정치위원의 서명이 함께 들어갑니다. 원수들은 불평하지만, 병사들은 위원이 자기들과 같은 솥의 수프를 먹는다는 것을 압니다."
 LR_RED_red_grande_armee:0 "붉은 대육군"
 LR_RED_red_grande_armee_desc:0 "삼색기와 붉은 깃발을 함께 든 대육군이 출범합니다. 근위대 고참병과 벨빌의 선반공이 같은 막사에서 잡니다."
 LR_RED_sister_communes:0 "자매 코뮌"
 LR_RED_sister_communes_desc:0 "국경 너머 혁명가들에게 편지를 씁니다. 파리의 형제가 되자고. 밀라노와 바르샤바와 바르셀로나에서 답장이 옵니다."
 LR_RED_italian_legion:0 "이탈리아 군단"
 LR_RED_italian_legion_desc:0 "1790년대 혁명 전쟁 때 이탈리아에 섰던 자매 공화국들의 이름으로 이탈리아 혁명가들을 모읍니다. 나폴리와 로마와 토리노의 다락방에서 젊은이들이 짐을 쌉니다."
 LR_RED_polish_legion:0 "폴란드 군단"
 LR_RED_polish_legion_desc:0 "1797년 돔브로프스키가 이탈리아에서 폴란드 군단을 만들었을 때 부른 노래는 지금 폴란드의 국가가 되었습니다. 그 노래를 부르며 폴란드인 의용병이 파리로 옵니다."
 LR_RED_revolution_hq:0 "유럽 혁명 사령부"
 LR_RED_revolution_hq_desc:0 "튈르리 궁의 한 층이 유럽 혁명 사령부가 됩니다. 지도 위에 꽂힌 붉은 핀은 대육군이 갈 곳이자, 인민 공화국이 설 곳입니다."
 LR_RED_suppress:0 "인민 경찰"
 LR_RED_suppress_desc:0 "푸셰의 밀정들이 이번에는 붉은 완장을 찹니다. 왕당파 살롱과 망명자의 편지가 같은 서류철에 들어갑니다."
 LR_RED_uproot:0 "반혁명 일소"
 LR_RED_uproot_desc:0 "왕당파의 마지막 음모와 방데의 무기고를 같은 밤에 덮칩니다. 그날 이후 반혁명은 지도자를 잃습니다."
 LR_RED_rhine:0 "라인강의 붉은 깃발"
 LR_RED_rhine_desc:0 "붉은 대육군이 라인강을 건넙니다. 베를린의 궁전에 쌓인 빵을 인민에게 돌려주러 간다고 통령은 연설했습니다."
 LR_RED_danube:0 "아우스터리츠의 해"
 LR_RED_danube_desc:0 "아우스터리츠. 이번에 무너뜨리는 것은 황제 하나가 아니라 민족의 감옥 전체입니다."
 LR_RED_channel:0 "불로뉴의 붉은 진영"
 LR_RED_channel_desc:0 "불로뉴의 붉은 진영. 대륙의 왕들에게 150년 동안 돈을 댄 런던의 은행을 닫으러 갑니다."
 LR_RED_russia:0 "모스크바로"
 LR_RED_russia_desc:0 "케렌스키는 혁명을 반쯤 하다 말았다고 통령은 말합니다. 대육군이 니에멘강을 건넙니다. 이번에는 겨울 군복이 먼저 실렸습니다."
 LR_DEF_occupation:0 "점령의 겨울"
 LR_DEF_occupation_desc:0 "두 번째 패전입니다. 콩피에뉴 숲의 객차에서 다시 항복 문서에 서명했습니다. 파리의 관공서마다 승전국의 깃발이 걸렸고, 새 정부는 승전국의 뜻에 따라 구성되었습니다. 이제 프랑스는 살아남는 법부터 다시 배워야 합니다."
 LR_DEF_rations:0 "배급표"
 LR_DEF_rations_desc:0 "빵과 석탄과 신발에 배급표가 붙습니다. 주부들은 새벽부터 빵집 앞에 줄을 서고, 배급표 위조범이 경찰의 새 골칫거리가 됩니다."
 LR_DEF_prisoners:0 "포로 귀환 협상"
 LR_DEF_prisoners_desc:0 "전쟁 포로 수십만 명이 승전국의 수용소에 있습니다. 그들을 돌려받는 것이 새 정부의 첫 외교 과제입니다. 값은 비쌉니다."
 LR_DEF_black_market:0 "암시장"
 LR_DEF_black_market_desc:0 "레알 시장 뒷골목에서는 돈만 있으면 무엇이든 삽니다. 암시장을 단속할 것인가, 눈감을 것인가."
 LR_DEF_ruins:0 "폐허의 재건"
 LR_DEF_ruins_desc:0 "포격으로 무너진 북부의 도시들. 아라스와 릴의 시민들이 맨손으로 벽돌을 줍기 시작합니다."
 LR_DEF_winter_relief:0 "겨울 구호"
 LR_DEF_winter_relief_desc:0 "교회와 적십자와 노조가 처음으로 같은 줄에 서서 겨울 외투와 수프를 나눕니다."
 LR_DEF_two_roads:0 "두 갈래 길"
 LR_DEF_two_roads_desc:0 "승전국과 손을 잡을 것인가, 숲으로 들어갈 것인가. 프랑스는 둘로 갈라집니다. 이 결정은 되돌릴 수 없습니다."
 LR_DEF_cooperate:0 "승전국과의 협력"
 LR_DEF_cooperate_desc:0 "점령군 사령관과 같은 식탁에 앉습니다. 협력하면 배급은 늘고 포로는 돌아옵니다. 그 대가를 사람들은 오래 기억할 것입니다."
 LR_DEF_collab_admin:0 "협력 행정부"
 LR_DEF_collab_admin_desc:0 "승전국의 감독관이 각 부처에 앉고, 프랑스 공무원들이 그들의 지시를 받아 적습니다. 행정은 굴러가고, 기차는 제시간에 달립니다."
 LR_DEF_reparations_paid:0 "배상금 완납"
 LR_DEF_reparations_paid_desc:0 "마지막 배상금 수표에 서명합니다. 금고는 비었지만, 승전국은 이제 프랑스에 요구할 것이 없습니다."
 LR_DEF_autonomy:0 "자치 회복"
 LR_DEF_autonomy_desc:0 "충실한 협력의 대가로 승전국이 프랑스의 자치를 넓혀 주겠다고 합니다. 감독관들이 짐을 쌉니다. 그러나 프랑스는 정말 자유로워졌을까요."
 LR_DEF_resist:0 "숲으로"
 LR_DEF_resist_desc:0 "징용 명단이 붙자 젊은이들이 숲으로 들어갑니다. 정부는 공식적으로 그들을 모른다고 말합니다. 비공식적으로는 다릅니다."
 LR_DEF_maquis:0 "마키"
 LR_DEF_maquis_desc:0 "알프스와 마시프상트랄의 숲에 저항 거점이 생깁니다. 농부들은 그들에게 빵을 주고, 헌병들은 못 본 척합니다."
 LR_DEF_sabotage:0 "철도 사보타주"
 LR_DEF_sabotage_desc:0 "점령군의 보급 열차가 다리 위에서 멈춥니다. 철도원 노조가 레지스탕스의 가장 큰 무기가 됩니다."
 LR_DEF_secret_army:0 "비밀군"
 LR_DEF_secret_army_desc:0 "옛 장교들이 지하에서 연대를 다시 짭니다. 무기는 산속 동굴에, 명부는 수녀원 지하실에 숨겨집니다."
 LR_DEF_rising:0 "8월의 봉기"
 LR_DEF_rising_desc:0 "파리의 바리케이드가 다시 올라갑니다. 1830년에도, 1848년에도, 1871년에도 그랬습니다. 이번에는 점령군을 몰아내기 위해서입니다."
 LR_DEF_exile_committee:0 "제네바의 망명 위원회"
 LR_DEF_exile_committee_desc:0 "국경 너머 제네바에서 망명자들이 자유 프랑스 위원회를 세웁니다. 그들의 방송은 밤마다 프랑스의 라디오에서 몰래 흘러나옵니다."
 LR_DEF_world_opinion:0 "세계 여론"
 LR_DEF_world_opinion_desc:0 "중립국 신문에 점령의 실상을 알립니다. 스웨덴과 스위스의 기자들이 파리의 배급 줄을 사진으로 찍어 갑니다."
 LR_DEF_curfew:0 "통행금지"
 LR_DEF_curfew_desc:0 "밤 열 시 이후 파리의 거리는 텅 빕니다. 순찰대의 군화 소리만 울립니다."
 LR_JAC_new_provinces:0 "공화국의 새 도"
 LR_JAC_new_provinces_desc:0 "공안위원회가 되찾은 땅을 공화국의 도로 묶습니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_JAC_integrate_algeria:0 "알제리의 세 도"
 LR_JAC_integrate_algeria_desc:0 "알제, 오랑, 콩스탕틴을 공화국의 세 도로 만듭니다. 문제는 그곳 주민의 시민권입니다. 부르봉 궁. 알제리 3개 도 편입법이 표결에 부쳐졌습니다. 산악파는 1794년 국민공회가 식민지 노예제를 폐지했던 일을 떠올립니다."
 LR_GIR_new_provinces:0 "도 의회의 확장"
 LR_GIR_new_provinces_desc:0 "되찾은 땅에 도 의회와 상공회의소를 세웁니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_GIR_integrate_algeria:0 "알제리 도 의회"
 LR_GIR_integrate_algeria_desc:0 "알제리의 세 도에 도 의회와 상공회의소를 세워 스스로 꾸려 가게 합니다. 알제 항구가 내려다보이는 상공회의소 건물. 보르도와 마르세유의 선주들이 알제의 상인들과 같은 탁자에 앉았습니다."
 LR_MAR_new_provinces:0 "명사들의 도"
 LR_MAR_new_provinces_desc:0 "되찾은 땅을 지방 명사들의 손에 맡깁니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_MAR_integrate_algeria:0 "알제리의 명사들"
 LR_MAR_integrate_algeria_desc:0 "알제리의 세 도를 납세 선거권 아래 지방 명사들의 의회로 다스립니다. 알제 총독 관저의 무도회장. 포도원 지주와 은행가, 그리고 몇 명의 토착 대가문 대표가 초대받았습니다. 푀양파의 방식대로, 세금을 많이 내는 사람이 도를 다스립니다."
 LR_GUA_new_provinces:0 "시민의 도"
 LR_GUA_new_provinces_desc:0 "되찾은 땅의 주민에게 공화국 시민이 될지 묻습니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_GUA_integrate_algeria:0 "알제리 주민 투표"
 LR_GUA_integrate_algeria_desc:0 "알제리 주민에게 공화국의 시민이 될지 직접 묻습니다. 알제의 광장마다 투표함이 놓였습니다. 투표용지에는 질문이 하나뿐입니다. 프랑스 공화국의 시민이 되겠습니까?"
 LR_COM_new_provinces:0 "코뮌의 확장"
 LR_COM_new_provinces_desc:0 "해방된 땅의 노동자 평의회가 코뮌에 합류합니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_COM_integrate_algeria:0 "알제리 노동자 평의회"
 LR_COM_integrate_algeria_desc:0 "알제 부두 노동자들의 평의회를 코뮌에 받아들입니다. 알제 부두. 노동자 평의회가 처음으로 열렸습니다. 아랍인 하역 노동자와 프랑스인 기관사가 같은 총회에서 손을 듭니다."
 LR_COM_integrate_belgium:0 "왈롱의 평의회"
 LR_COM_integrate_belgium_desc:0 "왈롱의 광부들과 플랑드르의 부두 노동자들이 코뮌에 합류합니다. 샤를루아 탄광 지대. 광부 평의회가 코뮌 합류를 만장일치로 결의했습니다. 갱도 입구마다 붉은 깃발이 꽂혔습니다."
 LR_COM_integrate_jura:0 "쥐라의 시계공들"
 LR_COM_integrate_jura_desc:0 "쥐라산맥의 시계공 조합이 코뮌에 합류합니다. 쥐라산맥의 시계 마을. 60년 전 이곳의 시계공들은 국제노동자협회에서 가장 급진적인 지부를 꾸렸습니다. 그들의 손자들이 오늘 코뮌 합류를 투표합니다."
 LR_ANA_new_provinces:0 "연합의 확장"
 LR_ANA_new_provinces_desc:0 "국경 너머의 코뮌들이 자유 연합에 가입하겠다고 합니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_ANA_integrate_belgium:0 "벨기에 코뮌 연합"
 LR_ANA_integrate_belgium_desc:0 "벨기에의 코뮌들이 자유 연합 가입을 투표합니다. 리에주의 민중 회관. 벨기에 각지의 코뮌 대표들이 모여 프랑스 자유 코뮌 연합에 가입할지 투표합니다. 연합은 아무도 강제로 받아들이지 않습니다. 원하는 코뮌만 들어옵니다."
 LR_ANA_integrate_jura:0 "쥐라 연합의 귀환"
 LR_ANA_integrate_jura_desc:0 "60년 전 바쿠닌과 함께한 쥐라 연합의 마을들이 자유 연합에 가입합니다. 쥐라산맥의 생티미에. 1872년 이 작은 시계 마을에서 반권위주의 인터내셔널이 세워졌습니다. 바쿠닌이 마지막 연설을 했던 곳입니다."
 LR_ORL_new_provinces:0 "왕의 새 영토"
 LR_ORL_new_provinces_desc:0 "왕의 군대가 되찾은 땅에 군정 총독을 보냅니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_ORL_integrate_algeria:0 "알제리 군정 총독부"
 LR_ORL_integrate_algeria_desc:0 "되찾은 알제리에 장군을 총독으로 보냅니다. 알제 총독 관저. 왕이 보낸 장군이 군복 차림으로 취임 선서를 합니다. 민간인 총독은 없습니다. 반란을 겪은 땅은 군대가 다스린다는 것이 왕의 방침입니다."
 LR_ORL_integrate_belgium:0 "벨기에 군정"
 LR_ORL_integrate_belgium_desc:0 "벨기에를 왕의 군정 아래 프랑스 영토로 편입합니다. 브뤼셀 왕궁. 벨기에 왕가는 런던으로 떠났고, 그 자리에 프랑스 군정 장관이 앉았습니다. 오를레앙의 왕은 벨기에를 1914년 독일군이 지나간 복도가 아니라 프랑스의 방패로 만들겠다고 선언했습니다."
 LR_ORL_integrate_jura:0 "쥐라 요새선"
 LR_ORL_integrate_jura_desc:0 "쥐라산맥을 프랑스의 동쪽 방벽으로 만듭니다. 쥐라산맥의 고갯길. 왕의 공병대가 스위스 국경이었던 능선 위에 포대를 올립니다. 이제 이 산맥은 국경이 아니라 프랑스의 안쪽입니다."
 LR_ORL_integrate_savoy:0 "알프스의 두 기슭"
 LR_ORL_integrate_savoy_desc:0 "사르데냐 왕국의 땅을 왕의 영토로 편입합니다. 토리노 왕궁. 사르데냐 왕가의 문장이 내려지고 백합기와 삼색기가 함께 걸립니다. 사부아는 한 세대 만에 프랑스로 돌아왔고, 알프스 너머 피에몬테까지 왕의 땅이 되었습니다."
 LR_ORL_integrate_rhine:0 "라인강 국경"
 LR_ORL_integrate_rhine_desc:0 "라인강 서안을 프랑스 영토로 편입합니다. 리슐리외 이래의 꿈입니다. 코블렌츠 요새. 왕이 라인강 다리 위에 섰습니다. 강 건너편에는 라인 연방의 깃발이 걸려 있습니다."
 LR_BOU_new_provinces:0 "왕관의 새 영토"
 LR_BOU_new_provinces_desc:0 "부르봉 왕가의 옛 꿈이었던 땅을 왕령으로 삼습니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_BOU_integrate_algeria:0 "알제리 왕령"
 LR_BOU_integrate_algeria_desc:0 "알제리를 왕의 직할령으로 삼고 선교회와 학교를 보냅니다. 알제 대성당. 대주교가 알제리를 왕의 직할령으로 선포하는 미사를 집전합니다. 1830년 샤를 10세가 처음 이 땅을 정복했을 때처럼, 왕의 이름과 십자가가 함께 들어옵니다."
 LR_BOU_integrate_belgium:0 "부르고뉴의 유산"
 LR_BOU_integrate_belgium_desc:0 "옛 부르고뉴 공국의 땅, 벨기에를 왕령으로 삼습니다. 브뤼셀 대광장. 15세기 부르고뉴 공작들의 길드 회관 앞에서 왕의 칙령이 낭독됩니다. 부르봉 왕가는 이 땅이 옛 부르고뉴의 유산이라고 주장합니다."
 LR_BOU_integrate_jura:0 "프랑슈콩테의 산맥"
 LR_BOU_integrate_jura_desc:0 "쥐라산맥 전체를 프랑슈콩테와 함께 하나의 주로 묶습니다. 브장송 대성당. 프랑슈콩테 주의 귀족들과 새로 편입된 쥐라 마을의 대표들이 함께 미사를 드립니다. 루이 14세가 프랑슈콩테를 얻은 지 260년, 이제 산맥의 반대편도 같은 왕의 땅입니다."
 LR_BOU_integrate_savoy:0 "사부아 가문의 땅"
 LR_BOU_integrate_savoy_desc:0 "사부아 가문의 옛 땅을 부르봉 왕가의 친척에게 맡깁니다. 토리노 왕궁. 사르데냐 왕국은 무너졌지만, 사부아 가문은 부르봉 왕가와 수백 년 동안 혼인으로 얽혀 있었습니다."
 LR_BOU_integrate_rhine:0 "주교 선제후의 땅"
 LR_BOU_integrate_rhine_desc:0 "옛 쾰른과 트리어 대주교령, 라인강 서안을 왕령으로 삼습니다. 쾰른 대성당. 신성로마제국이 무너진 뒤 쇠락했던 옛 대주교 선제후의 땅이 프랑스 왕의 보호 아래 들어옵니다."
 LR_PET_new_provinces:0 "원수의 새 영토"
 LR_PET_new_provinces_desc:0 "원수의 질서를 새 영토에 세웁니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_PET_integrate_algeria:0 "알제리 국민 혁명"
 LR_PET_integrate_algeria_desc:0 "알제리에 참전용사 군단과 농민 조합을 세웁니다. 알제 시청 광장. 원수의 초상이 걸린 연단 앞에서 참전용사 군단의 알제리 지부가 창설됩니다. 대전쟁에서 프랑스를 위해 싸운 알제리 출신 노병들이 맨 앞줄에 섰습니다."
 LR_PET_integrate_belgium:0 "벨기에의 질서"
 LR_PET_integrate_belgium_desc:0 "벨기에에 원수의 질서를 세웁니다. 브뤼셀. 프랑스 헌병대가 시청과 철도역과 신문사를 차례로 접수합니다. 원수의 명령은 짧습니다. 질서."
 LR_PET_integrate_jura:0 "쥐라 국경 수비"
 LR_PET_integrate_jura_desc:0 "쥐라산맥에 국경 수비대를 둡니다. 쥐라산맥의 국경 초소. 원수는 이 산맥을 베르됭처럼 지킬 수 있는 땅이라고 평가했습니다."
 LR_PET_integrate_savoy:0 "알프스의 질서"
 LR_PET_integrate_savoy_desc:0 "사르데냐 왕국의 땅에 원수의 질서를 세웁니다. 토리노 왕궁. 원수가 직접 찾아와 사르데냐 왕국의 옛 장교들을 사열합니다. 그들은 대전쟁에서 프랑스와 싸웠던 사람들입니다."
 LR_PET_integrate_rhine:0 "라인의 방벽"
 LR_PET_integrate_rhine_desc:0 "라인강 서안을 프랑스의 방벽으로 삼습니다. 라인강 서안의 언덕. 원수가 망원경으로 강 건너를 바라봅니다. 베르됭에서 그는 버티는 법을 가르쳤습니다. 이제 그는 다시는 버틸 필요가 없게 만들려 합니다."
 LR_NAP_new_provinces:0 "제국의 도"
 LR_NAP_new_provinces_desc:0 "황제의 제국을 130개의 도로 나눕니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_NAP_integrate_algeria:0 "알제리 총독부"
 LR_NAP_integrate_algeria_desc:0 "알제리를 황제 직할 총독부로 삼습니다. 알제 총독 관저. 황제는 이 땅을 잘 압니다. 그는 알제리 반란 진압으로 이름을 얻었습니다."
 LR_NAP_integrate_belgium:0 "벨기에의 도"
 LR_NAP_integrate_belgium_desc:0 "벨기에를 제국의 아홉 개 도로 나눕니다. 안트베르펜 항구. 황제가 부두에 서서 북해를 바라봅니다. 그는 이 항구를 영국의 심장을 겨눈 권총이라 불렀습니다."
 LR_NAP_integrate_alps:0 "레만과 심플롱"
 LR_NAP_integrate_alps_desc:0 "제네바 호숫가와 심플롱 고개를 제국의 도로 만듭니다. 제네바 호숫가. 칼뱅의 도시가 레만 도의 청사가 됩니다. 발레의 산골 마을에는 심플롱 도라는 이름이 붙습니다."
 LR_NAP_integrate_savoy:0 "포와 마렝고"
 LR_NAP_integrate_savoy_desc:0 "피에몬테와 사르데냐를 제국의 도로 나눕니다. 토리노 왕궁. 사르데냐 왕가의 문장 대신 황제의 독수리가 걸립니다. 피에몬테는 포, 세지아, 마렝고 같은 제국의 도로 나뉩니다."
 LR_NAP_integrate_rhine:0 "몽토네르와 루르"
 LR_NAP_integrate_rhine_desc:0 "라인강 서안을 제국의 네 도로 나눕니다. 마인츠 대성당 광장. 라인강 서안이 몽토네르, 루르, 자르, 라인모젤의 네 도로 나뉩니다. 1797년 혁명 프랑스가 처음 그었던 경계선입니다."
 LR_NAP_integrate_netherlands:0 "자위더르해의 도"
 LR_NAP_integrate_netherlands_desc:0 "네덜란드를 제국의 도로 묶습니다. 암스테르담 왕궁. 1795년 혁명 프랑스가 세웠던 바타비아 공화국은 2차 대불전쟁 때 무너졌습니다. 황제는 이번에는 자매 공화국을 세우지 않습니다. 네덜란드는 자위더르해, 스헬더 하구, 마스 하구의 도가 됩니다."
 LR_NAP_integrate_italy:0 "제국의 두 번째 도시"
 LR_NAP_integrate_italy_desc:0 "로마와 토스카나를 제국의 도로 묶습니다. 로마 캄피돌리오 언덕. 황제의 칙령이 로마를 제국의 두 번째 도시로 선포합니다. 피렌체에는 아르노 도의 깃발이 걸립니다."
 LR_NAP_integrate_catalonia:0 "카탈루냐의 네 도"
 LR_NAP_integrate_catalonia_desc:0 "카탈루냐를 스페인에서 떼어 내 제국의 네 도로 나눕니다. 바르셀로나 람블라스 거리. 카탈루냐가 몬세라트, 테르, 세그레, 에브르 하구의 네 도로 나뉩니다."
 LR_NAP_integrate_illyria:0 "일리리아 주"
 LR_NAP_integrate_illyria_desc:0 "아드리아해 동쪽 기슭을 제국의 일리리아 주로 묶습니다. 류블랴나 성 아래 광장. 합스부르크의 아드리아해 해안이 제국의 일리리아 주가 됩니다. 고대 로마의 속주 이름입니다. 황제의 원수 하나가 첫 총독으로 부임합니다."
 LR_NAP_integrate_hanse:0 "엘베 하구 도"
 LR_NAP_integrate_hanse_desc:0 "한자 도시들과 북해 해안을 제국의 도로 만듭니다. 함부르크 시청. 황제는 영국 상품의 밀수를 막으려고 북해 해안을 통째로 합병합니다. 엘베 하구, 베저 하구, 엠스 상류의 도가 생깁니다."
 LR_RED_new_provinces:0 "인민의 도"
 LR_RED_new_provinces_desc:0 "붉은 대육군이 지나간 땅을 인민 공화국의 도로 묶습니다. 정복한 땅마다 이 루트의 방식으로 핵심주를 세웁니다."
 LR_RED_integrate_algeria:0 "알제리 인민 평의회"
 LR_RED_integrate_algeria_desc:0 "알제리를 인민 공화국의 도로 묶고 평의회를 세웁니다. 알제 부두. 통령이 직접 찾아왔습니다. 그는 이 땅의 반란을 진압하며 이름을 얻었고, 이제 같은 땅에 붉은 깃발을 들고 돌아왔습니다."
 LR_RED_integrate_belgium:0 "벨기에 인민의 도"
 LR_RED_integrate_belgium_desc:0 "벨기에를 인민 공화국의 도로 묶습니다. 샤를루아 탄광. 붉은 대육군이 들어오자 광부들이 갱도에서 나와 환호했습니다. 통령은 탄광을 광부 평의회에 넘기겠다고 약속했습니다."
 LR_RED_integrate_alps:0 "알프스의 인민 도"
 LR_RED_integrate_alps_desc:0 "제네바와 발레를 인민 공화국의 도로 묶습니다. 제네바 호숫가. 붉은 대육군이 은행가들의 도시에 들어왔습니다. 칼뱅의 도시는 이제 인민 공화국의 레만 도입니다."
 LR_RED_integrate_savoy:0 "피에몬테 인민의 도"
 LR_RED_integrate_savoy_desc:0 "사르데냐 왕국의 땅을 인민 공화국의 도로 묶습니다. 토리노 피아트 공장. 붉은 대육군이 들어오기 전에 노동자들이 먼저 공장을 점거했습니다. 이탈리아에서 가장 붉은 도시입니다."
 LR_RED_integrate_rhine:0 "라인 인민의 도"
 LR_RED_integrate_rhine_desc:0 "라인강 서안을 인민 공화국의 도로 묶습니다. 쾰른 시청. 라인강 서안의 노동자 평의회들이 프랑스 인민 공화국 편입을 결의했습니다. 프로이센의 관리들은 강 건너로 달아났습니다."
 LR_RED_integrate_netherlands:0 "바타비아 인민의 도"
 LR_RED_integrate_netherlands_desc:0 "네덜란드를 인민 공화국의 도로 묶습니다. 암스테르담 부두. 붉은 대육군이 상인 공화국의 수도에 들어왔습니다. 부두 노동자들은 환호하고, 운하 저택의 상인들은 창문을 닫았습니다."
 LR_RED_integrate_italy:0 "로마 인민의 도"
 LR_RED_integrate_italy_desc:0 "로마와 토스카나를 인민 공화국의 도로 묶습니다. 로마 캄피돌리오 언덕. 1798년 혁명 프랑스가 세웠던 로마 공화국의 이름이 140년 만에 다시 불립니다. 이번에는 인민 공화국입니다."
 LR_RED_integrate_catalonia:0 "카탈루냐 인민의 도"
 LR_RED_integrate_catalonia_desc:0 "카탈루냐를 인민 공화국의 도로 묶습니다. 바르셀로나 람블라스 거리. 붉은 대육군을 맞이한 것은 검붉은 깃발의 조합원들이었습니다. 이 도시의 노동자들은 공산주의자보다 아나키스트가 많습니다."
 LR_RED_integrate_illyria:0 "일리리아 인민의 도"
 LR_RED_integrate_illyria_desc:0 "아드리아해 동쪽 기슭을 인민 공화국의 주로 묶습니다. 트리에스테 조선소. 이탈리아인과 슬로베니아인과 크로아티아인 조선공들이 같은 평의회에 앉았습니다. 합스부르크의 항구가 인민 공화국의 일리리아 주가 됩니다."
 LR_RED_integrate_hanse:0 "한자 인민의 도"
 LR_RED_integrate_hanse_desc:0 "함부르크와 북해 해안을 인민 공화국의 도로 묶습니다. 함부르크 부두. 독일에서 가장 붉은 항구의 부두 노동자들이 붉은 대육군을 맞이했습니다. 한자 상인들의 시청에 붉은 깃발이 올라갑니다."
 LR_ORL_royal_council:0 "왕실 군사 평의회"
 LR_ORL_royal_council_desc:0 "장군들이 내각보다 높은 자리에 앉습니다. 왕실 군사 평의회가 예산과 인사를 정하고, 의회는 박수를 치러 모일 뿐입니다."
 LR_ORL_family_allowance:0 "다자녀 수당"
 LR_ORL_family_allowance_desc:0 "아이를 셋 이상 낳은 어머니에게 왕이 메달과 수당을 줍니다. 대전쟁이 앗아간 한 세대를 메우려면 요람이 필요합니다. 그 요람의 아이들은 20년 뒤 병사가 될 것입니다."
 LR_ORL_labour_service:0 "국민 노동 봉사단"
 LR_ORL_labour_service_desc:0 "실업자 청년들이 삽을 어깨에 메고 군가를 부르며 행진합니다. 그들이 지나간 자리에 도로와 제방이 놓입니다. 언젠가 그 삽은 소총으로 바뀔 것입니다."
 LR_BOU_poor_relief:0 "왕실 구호 기금"
 LR_BOU_poor_relief_desc:0 "왕비의 이름이 새겨진 자루에 담긴 빵이 교회 앞에서 나눠집니다. 지난겨울 혁명가를 부르던 입들이 이제 빵을 씹습니다. 배부른 사람은 바리케이드를 쌓지 않습니다."
 LR_BOU_guilds:0 "길드 부활"
 LR_BOU_guilds_desc:0 "노동조합을 해산하고 그 자리에 왕의 칙허를 받은 길드를 세웁니다. 늙은 장인들은 할아버지의 길드 이름을 되찾았다며 눈시울을 붉힙니다. 젊은 노동자들은 파업할 권리를 잃었습니다."
 LR_BOU_provincial_estates:0 "지방 삼부회"
 LR_BOU_provincial_estates_desc:0 "프로방스와 브르타뉴, 랑그도크에 혁명 전의 옛 특권과 지방 삼부회를 돌려줍니다. 파리의 관료들은 불쾌해하지만, 지방 귀족들은 150년 만에 왕을 진심으로 사랑하게 됩니다."
 LR_JAC_womens_vote:0 "여성 참정권"
 LR_JAC_womens_vote_desc:0 "1791년, 올랭프 드 구주는 여성과 여성 시민의 권리 선언을 썼고 그 때문에 단두대에 올랐습니다. 150년 묵은 그 요구가 드디어 법이 됩니다."
 LR_GIR_charity_schools:0 "민간 학교 지원"
 LR_GIR_charity_schools_desc:0 "기업가들이 세운 기술 학교에 세금 혜택을 줍니다. 국가가 모든 것을 할 필요는 없다는 것이 지롱드의 믿음입니다. 노동자의 아이들이 숙련공이 되어 그 공장으로 돌아갑니다."
 LR_GIR_mutual_aid:0 "상호 부조 협회"
 LR_GIR_mutual_aid_desc:0 "병든 노동자를 돌보는 일은 국가가 아니라 직능별 상호 부조 협회가 맡습니다. 회비를 내는 사람은 보호받고, 내지 못하는 사람은 교회 문을 두드려야 합니다. 이것이 지롱드식 복지입니다."
 LR_GIR_provincial_power:0 "지방 분권법"
 LR_GIR_provincial_power_desc:0 "파리의 권한을 지방 의회로 내려 보냅니다. 1793년, 지롱드파가 단두대에 오르면서까지 지키려던 원칙입니다. 지방의 명사들이 150년 만에 자기 예산을 손에 쥡니다."
 LR_MAR_parish_relief:0 "교구 구호"
 LR_MAR_parish_relief_desc:0 "복지는 국가가 아니라 교구가 할 일이라고 푀양파는 믿습니다. 수녀들이 다시 병원과 고아원을 맡고, 정부는 보조금만 보냅니다."
 LR_MAR_property_franchise:0 "재산 선거권"
 LR_MAR_property_franchise_desc:0 "세금을 많이 내는 사람에게 표를 더 줍니다. 노동자의 표는 줄고 지방 명사의 표는 늘어납니다. 1791년 헌법도 이렇게 시작했습니다."
 LR_NAP_imperial_university:0 "제국 대학"
 LR_NAP_imperial_university_desc:0 "교육은 이제 황제의 관할입니다. 전국 리세의 소년들이 군복 같은 제복을 입고 북소리에 맞춰 교실에 들어가, 나폴레옹 법전을 외웁니다."
 LR_GUA_public_education:0 "공교육 확대"
 LR_GUA_public_education_desc:0 "대통령이 새 국정 교과서의 서문을 직접 씁니다. 첫 문장은 황제가 아니라 시민으로 시작합니다. 장군들은 그 문장을 읽고 고개를 갸웃합니다."
 LR_COM_fortress_france:0 "요새 프랑스"
 LR_COM_fortress_france_desc:0 "왕들의 군대는 언제든 국경을 넘어올 수 있습니다. 혁명을 수출할 군대가 생긴다 해도, 먼저 국경에 세워야 합니다. 마지노의 콘크리트 위에 붉은 깃발이 올라갑니다."
 LR_COM_socialist_industry:0 "사회주의 공업화"
 LR_COM_socialist_industry_desc:0 "제1차 인민 계획이 발표됐습니다. 철강과 전력이 무엇보다 먼저입니다. 구두와 커피와 라디오는 다음 계획에서 이야기하기로 합니다. 노동자들은 아직은 참아 줍니다."
 LR_COM_collective_farms:0 "농업 협동화"
 LR_COM_collective_farms_desc:0 "도시 노동자를 먹이려면 농촌이 바뀌어야 합니다. 협동농장 위원들이 마을에 도착하자, 방데의 농민들이 헛간 바닥에 묻어 둔 엽총을 다시 꺼냅니다."
 LR_COM_national_guard:0 "국민 방위군"
 LR_COM_national_guard_desc:0 "1792년, 조국이 위험에 처했을 때 파리 시민들이 만든 이름을 되살립니다. 모든 공장과 마을에 국민 방위군 중대가 조직되고, 퇴근한 선반공이 소총을 받아 듭니다."
 LR_COM_no_foreign_masters:0 "모스크바와의 거리"
 LR_COM_no_foreign_masters_desc:0 "프랑스 혁명의 교과서는 프랑스에서 씁니다. 페테르부르크에서 온 러시아 고문단이 조용히 귀국 열차에 오릅니다. 역에 배웅 나온 사람은 아무도 없습니다."
 LR_COM_comintern_paris:0 "파리 인터내셔널"
 LR_COM_comintern_paris_desc:0 "세계 혁명의 사령부가 몽마르트르 언덕에 문을 엽니다. 23개국에서 온 망명자들이 같은 복도를 쓰고, 같은 식당에서 서로를 의심하며 밥을 먹습니다."
 LR_COM_spanish_comrades:0 "스페인 동지 지원"
 LR_COM_spanish_comrades_desc:0 "피레네 산맥의 밀수꾼 길로 전단과 소총이 넘어갑니다. 바르셀로나의 노동자들은 파리 방송을 몰래 듣고, 마드리드의 왕은 잠을 설칩니다."
 LR_COM_italian_workers:0 "이탈리아 노동자 봉기"
 LR_COM_italian_workers_desc:0 "토리노의 피아트 공장과 나폴리 부두에 파리의 소식이 도착합니다. 네 왕국으로 갈라진 이탈리아가 왕들보다 혁명으로 먼저 하나가 될지도 모릅니다."
 LR_COM_german_spartacists:0 "독일 노동자 지원"
 LR_COM_german_spartacists_desc:0 "루르의 광부 노조와 함부르크 부두 노조로 비밀 자금이 흘러갑니다. 프로이센 경찰이 찾아낸 돈은 그 가운데 극히 일부입니다."
 LR_COM_british_chartists:0 "차티스트의 후예"
 LR_COM_british_chartists_desc:0 "맨체스터 부두 노동자들이 파리에서 건너온 전단을 돌려 읽습니다. 100년 전 차티스트들이 외친 요구가 다시 벽에 적힙니다. 런던의 귀족 의회는 이것을 전쟁 행위라 부릅니다."
 LR_COM_red_volunteers:0 "국제 여단"
 LR_COM_red_volunteers_desc:0 "베를린의 선반공, 바르샤바의 대학생, 나폴리의 부두 노동자가 같은 연대에 섭니다. 서로 말은 통하지 않지만 인터내셔널은 다들 압니다."
 LR_FRA_colonial_regiments:0 "주아브와 티라외르"
 LR_FRA_colonial_regiments_desc:0 "모로코와 튀니지의 연대가 마르세유에 내립니다. 빨간 페즈 모자를 쓴 이 병사들은 백 년 넘게 프랑스를 위해 싸웠습니다. 그 대가가 무엇이었는지는 아직 아무도 그들에게 묻지 않았습니다."
 LR_FRA_chasseurs_alpins:0 "알프스 산악병"
 LR_FRA_chasseurs_alpins_desc:0 "샤모니 빙하 위에서 커다란 베레모를 쓴 부대가 스키를 배웁니다. 사르데냐와 오스트리아 국경의 다음 전쟁은 참호가 아니라 능선에서 벌어질 것입니다."
 LR_FRA_rifle_stocks:0 "MAS 소총 양산"
 LR_FRA_rifle_stocks_desc:0 "생테티엔 조병창의 새 생산 라인이 MAS 소총을 하루 수백 정씩 뽑아냅니다. 1886년에 만든 르벨 소총은 할아버지의 벽난로 위로 돌아갑니다."
 LR_FRA_combat_engineers:0 "공병 전통"
 LR_FRA_combat_engineers_desc:0 "보방이 요새를 쌓던 나라에서 공병은 언제나 육군의 자랑이었습니다. 강을 건너는 군대는 다리를 놓는 부대보다 빨리 갈 수 없습니다."
 LR_FRA_staff_college:0 "고등 전쟁 대학"
 LR_FRA_staff_college_desc:0 "포슈 원수가 강의하던 고등 전쟁 대학이 다시 문을 엽니다. 젊은 대령들이 1914년의 작전 지도를 펴 놓고, 어디서부터 틀렸는지 처음부터 다시 그립니다."
 LR_FRA_armoured_recon:0 "기병의 기계화"
 LR_FRA_armoured_recon_desc:0 "소뮈르 기병 학교의 장교들이 말에서 내립니다. 마구간 앞에서 우는 노장교도 있지만, 정찰 장갑차는 지치지도 않고 여물도 먹지 않습니다."
 LR_FRA_cruiser_squadron:0 "대양 순양함대"
 LR_FRA_cruiser_squadron_desc:0 "제국을 잃은 해군에게 남은 임무는 항로를 지키는 일입니다. 빠른 순양함들이 브레스트를 떠나 대서양으로 나갑니다. 다카르와 카사블랑카를 잇는 바닷길이 그들의 영토입니다."
 LR_FRA_destroyer_flotillas:0 "구축함 전단"
 LR_FRA_destroyer_flotillas_desc:0 "르 팡타스크급 대형 구축함은 시속 70킬로미터로 바다를 가릅니다. 영국 전함들의 뒤꽁무니를 물어뜯을 프랑스 해군의 사냥개들입니다."
 LR_FRA_commerce_raiding:0 "통상 파괴전"
 LR_FRA_commerce_raiding_desc:0 "런던의 빵과 석유는 모두 배로 들어옵니다. 함대끼리 정면으로 맞붙어서는 이길 수 없다면, 그 배들을 노립니다. 대전쟁 때 독일 해군이 가르쳐 준 방법입니다."
 LR_FRA_bearn_carrier:0 "베아른의 후계자"
 LR_FRA_bearn_carrier_desc:0 "베아른호는 프랑스의 유일한 항공모함입니다. 느리고 낡았고, 원래는 전함으로 만들던 배였습니다. 제독들이 처음으로 처음부터 항공모함으로 설계한 배를 그리기 시작합니다."
 LR_FRA_naval_aviation:0 "해군 항공대"
 LR_FRA_naval_aviation_desc:0 "공군 장성들은 바다 위를 나는 비행기도 공군 것이라고 고집해 왔습니다. 오랜 다툼 끝에 해군이 드디어 자기 비행기와 조종사를 갖습니다."
 LR_FRA_mers_el_kebir:0 "지중해 기지"
 LR_FRA_mers_el_kebir_desc:0 "튀니지 비제르트의 요새 항구를 넓히고 포대를 새로 올립니다. 지브롤터와 몰타 사이, 영국 해군이 지나가는 길목에 프랑스가 닻을 내립니다."
 LR_FRA_convoy_school:0 "호송대 학교"
 LR_FRA_convoy_school_desc:0 "대전쟁 때 독일 잠수함은 프랑스 상선을 수백 척 가라앉혔습니다. 상선과 군함이 함께 항해하는 법을 해군 학교에서 다시 가르칩니다. 비싸게 배운 교훈입니다."
 LR_FRA_fusiliers_marins:0 "해병 보병"
 LR_FRA_fusiliers_marins_desc:0 "식민지 상륙전의 경험을 해병 보병 교리로 정리합니다. 해협이든 지중해든, 바다를 건너려면 이들이 먼저 해변에 서야 합니다."
 LR_FRA_dewoitine_fighters:0 "드부아틴 전투기"
 LR_FRA_dewoitine_fighters_desc:0 "툴루즈 공장 문이 열리고 은빛 단엽 전투기가 활주로로 굴러 나옵니다. 천과 철사로 엮은 복엽기의 시대가 끝났습니다. 조종사들은 이 비행기를 '작은 칼'이라고 부릅니다."
 LR_FRA_air_aces:0 "라파예트의 후예"
 LR_FRA_air_aces_desc:0 "기느메르와 퐁크, 대전쟁의 하늘을 누빈 에이스들의 이름을 단 비행단이 창설됩니다. 패전국 공군에게는 무엇보다 영웅이 필요합니다."
 LR_FRA_potez_bombers:0 "포테즈 경폭격기"
 LR_FRA_potez_bombers_desc:0 "포테즈 공장의 쌍발 경폭격기는 웬만한 전투기보다 빠릅니다. 조종사들이 연습 표적으로 쓰는 사진은 라인강의 다리들입니다."
 LR_FRA_strategic_force:0 "전략 폭격 부대"
 LR_FRA_strategic_force_desc:0 "두에의 이론을 믿는 장군들이 4발 폭격기 예산을 따냈습니다. 육군은 그 돈이면 전차 300대를 만든다며 격렬히 반대했습니다. 다음 전쟁이 둘 중 누가 옳았는지 알려 줄 것입니다."
 LR_FRA_cas_wings:0 "지상 지원 비행단"
 LR_FRA_cas_wings_desc:0 "급강하 폭격기에 무전기를 달고, 그 무전기를 전차 부대와 잇습니다. 이 계획서 맨 아래에는 드골 대령의 서명이 있습니다. 참모본부의 노장군들은 그 이름만 보고도 얼굴을 찌푸립니다."
 LR_FRA_air_safety:0 "항공 안전국"
 LR_FRA_air_safety_desc:0 "작년에 공군은 전투가 아니라 기체 결함으로 조종사 마흔 명을 잃었습니다. 새 비행기를 사기 전에 정비병 교육과 점검표부터 고칩니다."
 LR_FRA_air_detection:0 "방공 감시망"
 LR_FRA_air_detection_desc:0 "해안과 국경의 언덕마다 감시 초소를 세우고 전화선으로 잇습니다. 다음 전쟁의 첫 경보는 쌍안경을 든 어느 예비역 하사의 수화기에서 울릴 것입니다."
 LR_FRA_paratroopers:0 "공수 부대"
 LR_FRA_paratroopers_desc:0 "알제리 사막 위에서 첫 낙하산 강하 실험을 합니다. 참모본부는 하늘에서 떨어지는 보병이라는 말에 웃었습니다. 머지않아 그 웃음은 사라질 것입니다."
 LR_ORL_neutral_ties:0 "중립국 회유"
 LR_ORL_neutral_ties_desc:0 "스웨덴의 철광과 스위스의 금고는 중립입니다. 왕의 사절이 스톡홀름과 베른을 차례로 찾아가 조용히 장기 계약서를 내밉니다."
 LR_ORL_ottoman_talks:0 "이스탄불 밀담"
 LR_ORL_ottoman_talks_desc:0 "대전쟁의 승전국 진영에도 틈은 있습니다. 오스만 제국이 끝까지 영국 편에 설 이유는 없습니다. 왕의 밀사가 이스탄불의 어느 궁전 뒷문으로 들어갑니다."
 LR_JAC_dutch_treaty:0 "헤이그 조약"
 LR_JAC_dutch_treaty_desc:0 "왕들의 유럽에서 의회를 가진 이웃은 몇 되지 않습니다. 네덜란드 상인 공화국에 손을 내밀어 헤이그에서 조약을 맺습니다. 두 공화국이 서로의 유일한 친구입니다."
 LR_JAC_american_contact:0 "필라델피아의 친구들"
 LR_JAC_american_contact_desc:0 "영국령 북아메리카 식민지의 공화주의자들에게 비밀 편지를 보냅니다. 150년 전 그들의 독립 전쟁은 군대를 하나로 묶을 지휘관이 없어 무너졌지만, 라파예트의 이름은 대서양 건너에서도 아직 쓸모가 있습니다. 버지니아에 조지 워싱턴이라는 장군이 있다는 소문도 들려옵니다."
 LR_GIR_merchant_envoys:0 "상인 사절단"
 LR_GIR_merchant_envoys_desc:0 "외교관 대신 은행가들이 런던과 암스테르담으로 갑니다. 그들은 조약문 대신 어음을 들고 갑니다. 전쟁보다 빠르고, 대개는 더 효과적입니다."
 LR_GIR_atlantic_trade:0 "대서양 무역"
 LR_GIR_atlantic_trade_desc:0 "보르도 항구에 다시 신대륙의 깃발을 단 배들이 들어옵니다. 영국령 북아메리카의 담배와 브라질의 커피가 부두에 쌓이고, 지롱드의 상인들은 계산기를 두드립니다."
 LR_MAR_vienna_talks:0 "빈 협상"
 LR_MAR_vienna_talks_desc:0 "입헌 군주정은 왕들과도 대화할 수 있다고 푀양파는 믿습니다. 혁명 이후 처음으로 합스부르크의 대사가 파리 대사관에 돌아옵니다."
 LR_MAR_london_model:0 "영국식 의회"
 LR_MAR_london_model_desc:0 "웨스트민스터에 의회 시찰단을 보냅니다. 영국은 프랑스를 무릎 꿇린 적이지만, 의회를 운영하는 법만큼은 배울 만합니다."
 LR_COM_workers_embassy:0 "노동자 대사관"
 LR_COM_workers_embassy_desc:0 "왕실 외교관들을 해임하고, 선반공과 광부 출신 대사들을 유럽의 수도로 보냅니다. 만찬 예절은 서툴지만, 그들의 가방에는 전단이 가득합니다."
 LR_NAP_marriage_diplomacy:0 "제국 혼인 외교"
 LR_NAP_marriage_diplomacy_desc:0 "유럽의 오랜 왕가에서 공주 한 명이 벼락출세한 황제의 궁정으로 시집옵니다. 유럽의 왕들이 입술을 깨물며 축하 전보를 보냅니다."
 LR_GUA_national_reconciliation:0 "국민 화해"
 LR_GUA_national_reconciliation_desc:0 "왕당파 지도자와 코뮌 지도자가 한 탁자에 마주 앉습니다. 3년 전만 해도 서로를 총살하려던 사람들입니다. 대통령이 직접 사회를 봅니다."
 LR_BOU_italian_arms:0 "왕의 소총"
 LR_BOU_italian_arms_desc:0 "툴롱 부두에서 나폴리행 화물선에 '농기구'라고 적힌 나무 상자들이 실립니다. 상자는 유난히 무겁습니다. 프랑스 무기고의 소총 선반이 그만큼 비어 갑니다."
 LR_BOU_north_italy:0 "피에몬테로"
 LR_BOU_north_italy_desc:0 "로마와 피렌체가 떨어졌습니다. 이제 남은 것은 토리노뿐입니다. 마지막 싸움을 앞둔 나폴리의 사촌에게 소총 5000정을 더 보냅니다."
 LR_BOU_italian_kingdom:0 "이탈리아 왕국"
 LR_BOU_italian_kingdom_desc:0 "나폴리의 왕이 로마에서 이탈리아의 왕관을 씁니다. 약속대로 그는 이제 부르봉 동맹의 일원으로 프랑스 곁에 섭니다. 다음 상대는 밀라노를 쥔 오스트리아인입니다."
 LR_ORL_royal_roads:0 "왕립 고속도로"
 LR_ORL_royal_roads_desc:0 "실업자들이 삽을 들고 국경으로 곧게 뻗는 넓은 도로를 냅니다. 공식 용도는 관광 도로입니다. 이상하게도 모든 길이 라인강을 향합니다."
 LR_ORL_renault_seized:0 "르노 공장 접수"
 LR_ORL_renault_seized_desc:0 "왕실 군수국 관리들이 비양쿠르의 르노 공장 정문을 엽니다. 트럭 생산 라인이 오늘부터 전차를 만듭니다. 루이 르노는 항의문을 쓸 시간도 없었습니다."
 LR_ORL_officers_oath:0 "장교단의 충성 서약"
 LR_ORL_officers_oath_desc:0 "장교들이 헌법이 아니라 왕 개인에게 충성을 맹세합니다. 맹세문에서 '국가'라는 단어가 빠졌다는 것을 눈치챈 장교는 많지 않습니다."
 LR_ORL_camelots:0 "왕의 행동대"
 LR_ORL_camelots_desc:0 "왕당파 청년 행동대가 지팡이를 들고 파리 대로를 몰려다닙니다. 반대파 신문사의 유리창은 하루도 성할 날이 없습니다. 경찰은 늘 조금 늦게 도착합니다."
 LR_ORL_madrid_renounce:0 "스페인 왕위 포기 선언"
 LR_ORL_madrid_renounce_desc:0 "오를레앙 가문은 마드리드의 왕위에 아무 관심이 없다고 공식 선언합니다. 그동안 사촌을 경계하던 스페인 왕실이 처음으로 정중한 답장을 보냅니다."
 LR_ORL_royal_security:0 "왕실 보안국"
 LR_ORL_royal_security_desc:0 "전화국과 우체국마다 왕의 사람들이 앉아 있습니다. 공화주의자들의 편지는 배달되기 전에 한 번 더 읽힙니다. 이제 반대파는 서류철 속에서 관리됩니다."
 LR_BOU_royal_manufactures:0 "왕립 매뉴팩처"
 LR_BOU_royal_manufactures_desc:0 "콜베르가 세운 왕립 매뉴팩처의 전통을 되살립니다. 왕의 인장이 찍힌 공장에는 왕의 주문이 먼저 들어가고, 왕의 은행이 먼저 돈을 댑니다."
 LR_BOU_peasant_credit:0 "농민 대출 금고"
 LR_BOU_peasant_credit_desc:0 "왕실 금고가 농민의 빚을 대신 떠안습니다. 비싼 정책이지만, 시골 마을의 충성은 원래 이렇게 사는 것입니다. 방데의 농민들은 이 은혜를 오래 기억할 것입니다."
 LR_BOU_salic_law:0 "살리카 법 재확인"
 LR_BOU_salic_law_desc:0 "여계 계승을 금한 살리카 법을 왕실 법정에서 다시 확인합니다. 오를레앙 가문이 내세워 온 왕위 계승권 주장은 이로써 영원히 끝납니다. 오를레앙 공작은 판결문을 받고 아무 말도 하지 않았습니다."
 LR_BOU_swiss_guard:0 "스위스 근위대 재건"
 LR_BOU_swiss_guard_desc:0 "1792년 튈르리 궁에서 왕을 지키다 전멸한 스위스 근위대가 돌아옵니다. 루체른에서 모집한 붉은 제복의 병사들이 궁전 정문에 섭니다. 왕은 다시 누구에게도 빚지지 않은 자기 군대를 갖습니다."
 LR_BOU_lisbon_treaty:0 "리스본 조약"
 LR_BOU_lisbon_treaty_desc:0 "마드리드에 이어 리스본의 사촌 왕가도 동맹에 초대합니다. 브라질의 금이 리스본을 거쳐 라틴 왕가들의 동맹으로 흘러듭니다."
 LR_BOU_parish_registers:0 "교구 등록부"
 LR_BOU_parish_registers_desc:0 "마을 신부가 세례와 혼인을 적던 교구 등록부에 새 항목이 생겼습니다. 미사에 나오지 않는 사람, 공화국 신문을 읽는 사람. 신부는 그 이름들도 꼼꼼히 적습니다."
 LR_COM_electrification:0 "전국 전력망"
 LR_COM_electrification_desc:0 "코뮌이란 노동자의 권력 더하기 전기라고 위원회는 말합니다. 석유등으로 밤을 밝히던 마을마다 전신주가 서고, 처음으로 전등이 켜집니다."
 LR_COM_five_year_plan:0 "5개년 계획"
 LR_COM_five_year_plan_desc:0 "계획위원회가 시청 벽에 커다란 숫자들을 붙입니다. 강철 몇 톤, 대포 몇 문, 트랙터 몇 대. 목표를 넘긴 공장의 이름은 신문 1면에 실리고, 못 미친 공장장은 위원회에 불려 갑니다."
 LR_COM_workers_university:0 "노동자 대학"
 LR_COM_workers_university_desc:0 "소르본의 육중한 문이 선반공과 재봉사에게 열립니다. 야간 강의실이 작업복 차림의 학생들로 가득 찹니다. 늙은 교수들은 수업을 계속할지 고민합니다."
 LR_COM_french_road:0 "프랑스식 사회주의"
 LR_COM_french_road_desc:0 "러시아의 길도, 다른 누구의 길도 아닙니다. 1793년의 공안위원회와 1871년의 파리 코뮌, 그 두 전통 위에 프랑스만의 사회주의를 세웁니다."
 LR_COM_world_republic:0 "세계 공화국 선언"
 LR_COM_world_republic_desc:0 "파리는 더 이상 프랑스의 수도가 아닙니다. 세계 혁명의 수도입니다. 코뮌이 세계 공화국을 선언하자 유럽의 모든 왕궁에서 비상 회의가 열립니다."
 LR_COM_workers_solidarity:0 "국제 노동 연대"
 LR_COM_workers_solidarity_desc:0 "파업 중인 암스테르담 부두 노동자들에게 파업 기금을 보냅니다. 네덜란드 공화국 정부는 불쾌해하면서도 그 돈을 돌려보내지는 않습니다."
 LR_COM_neighbourhood_committees:0 "구역 위원회"
 LR_COM_neighbourhood_committees_desc:0 "모든 건물, 모든 계단참마다 위원이 한 명씩 있습니다. 누가 몇 시에 들어오고 누구를 만나는지 위원은 다 압니다. 왕당파 노인들도 이제 눈치를 봅니다."
 LR_JAC_public_housing:0 "공공 주택"
 LR_JAC_public_housing_desc:0 "파리 외곽의 판자촌을 밀어내고 붉은 벽돌의 노동자 주택이 올라갑니다. 그 벽돌을 쌓은 벽돌공들이 다음 선거에서 공화국에 표를 줍니다."
 LR_JAC_arsenal_of_people:0 "시민의 조병창"
 LR_JAC_arsenal_of_people_desc:0 "국유화된 군수 공장이 공화국의 대포를 만듭니다. 이윤은 주주가 아니라 국고로 들어가고, 공장 정문에는 '시민의 조병창'이라는 새 간판이 걸립니다."
 LR_JAC_republican_clubs:0 "공화주의 클럽"
 LR_JAC_republican_clubs_desc:0 "1789년 자코뱅 클럽의 이름을 이어받은 토론회가 전국 도시마다 생깁니다. 저녁마다 카페 2층에서 정치 토론이 벌어지고, 그 자리가 선거 운동 본부가 됩니다. 의석 +30."
 LR_JAC_free_press:0 "언론 자유법"
 LR_JAC_free_press_desc:0 "왕의 검열관들이 일자리를 잃었습니다. 다음 날 아침 가판대에는 신문이 두 배로 늘었고, 그 가운데 절반은 정부를 욕하고 있습니다. 공화국은 그것을 견뎌야 합니다."
 LR_JAC_swiss_asylum:0 "제네바의 망명자들"
 LR_JAC_swiss_asylum_desc:0 "유럽 왕국들에서 쫓겨난 자유주의자들이 제네바 호숫가의 하숙집에 모입니다. 공화국이 그들에게 프랑스 여권을 발급합니다. 왕들의 대사관은 항의 서한을 보냅니다."
 LR_JAC_citizen_police:0 "시민 경찰"
 LR_JAC_citizen_police_desc:0 "왕의 비밀경찰을 해산하고, 지방 의회가 감독하는 새 시민 경찰을 세웁니다. 옛 경찰 서류함에서 나온 사찰 기록은 광장에서 불태웁니다."
 LR_GIR_bordeaux_wharves:0 "보르도 부두"
 LR_GIR_bordeaux_wharves_desc:0 "가론강 변의 부두를 넓히고 새 기중기를 올립니다. 지롱드파가 태어난 고향이 다시 대서양을 바라봅니다."
 LR_GIR_credit_lyonnais:0 "리옹 신용은행"
 LR_GIR_credit_lyonnais_desc:0 "은행이 공장에 돈을 대고, 공장이 내각에 돈을 댑니다. 리옹 신용은행의 이사회 회의실은 이제 장관실보다 문턱이 높습니다."
 LR_GIR_press_barons:0 "언론 재벌"
 LR_GIR_press_barons_desc:0 "대형 신문사 사주들이 내각 편에 섭니다. 그 대가로 정부 광고와 종이 배급이 그들에게 먼저 돌아갑니다. 의석 +30."
 LR_GIR_hudson_loans:0 "뉴욕의 차관"
 LR_GIR_hudson_loans_desc:0 "영국령 북아메리카의 은행가들이 보르도에 지점을 엽니다. 뉴욕의 돈은 국적을 묻지 않고, 이자만 묻습니다."
 LR_GIR_civic_guard:0 "지방 시민군"
 LR_GIR_civic_guard_desc:0 "질서를 지키는 일은 파리의 경찰이 아니라 각 도의 시민군이 맡습니다. 보르도의 시민군과 마르세유의 시민군은 제복 색깔부터 다릅니다."
 LR_MAR_agrarian_credit:0 "농업 신용"
 LR_MAR_agrarian_credit_desc:0 "지방 명사들이 세운 은행이 농민들에게 돈을 빌려줍니다. 농민들은 비료와 쟁기를 사고, 명사들은 다음 선거의 표를 삽니다."
 LR_MAR_chartered_works:0 "칙허 회사"
 LR_MAR_chartered_works_desc:0 "왕의 칙허와 의회의 예산이 함께 들어간 공장입니다. 이사회에는 왕실 관리와 의원이 나란히 앉아 서로를 감시합니다."
 LR_MAR_parliament_coronation:0 "의회의 대관식"
 LR_MAR_parliament_coronation_desc:0 "새 왕은 랭스 대성당에 가기 전에 먼저 의회에 들러야 합니다. 의원들 앞에서 헌법에 손을 얹고 맹세한 뒤에야 왕관을 씁니다."
 LR_MAR_hague_arbitration:0 "헤이그 중재 재판"
 LR_MAR_hague_arbitration_desc:0 "국가 간 분쟁을 헤이그 중재 재판소로 가져가자고 제안합니다. 유럽의 왕들은 비웃었지만, 그래도 대표는 보냅니다."
 LR_MAR_bourgeois_guard:0 "국민방위대"
 LR_MAR_bourgeois_guard_desc:0 "라파예트의 흰 깃털 모자가 돌아왔습니다. 재산 있는 시민들이 국민방위대 제복을 맞춰 입고 거리의 질서를 지킵니다. 노동자 동네 사람들은 그 제복을 좋아하지 않습니다."
 LR_NAP_prefects:0 "도지사 제도"
 LR_NAP_prefects_desc:0 "파리가 임명한 도지사가 83개 도에 한 명씩 내려갑니다. 지방 귀족과 혁명 위원회가 나눠 쥐고 있던 권력이 한 줄의 명령 체계로 묶입니다."
 LR_NAP_imperial_works:0 "제국 대공사"
 LR_NAP_imperial_works_desc:0 "샹젤리제 끝에 개선문이 또 하나 올라갑니다. 대리석 기둥 뒤로는 공장 굴뚝과 새 운하가 함께 들어섭니다. 황제의 영광은 보기에도 좋아야 하고 쓸모도 있어야 합니다."
 LR_NAP_imperial_catechism:0 "제국 교리문답"
 LR_NAP_imperial_catechism_desc:0 "주일 학교의 교리문답에 새 단원이 생겼습니다. 그리스도인은 황제에게 무엇을 빚졌는가. 아이들은 사랑, 존경, 복종, 군 복무, 세금이라고 외웁니다."
 LR_NAP_sister_kingdoms:0 "자매 왕국"
 LR_NAP_sister_kingdoms_desc:0 "황제의 형제들이 정복한 나라들의 왕좌에 앉습니다. 조약문에는 동맹이라고 적혀 있습니다. 그 왕들이 누구의 명령을 받는지는 유럽 모두가 압니다."
 LR_NAP_old_guard:0 "노근위대"
 LR_NAP_old_guard_desc:0 "황제와 함께 모든 전장을 겪은 고참병들이 곰가죽 모자를 쓰고 노근위대로 모입니다. 그들은 투덜대고, 그래도 황제를 따릅니다. 제국이 마지막에 내밀 예비대입니다."
 LR_GUA_workers_compensation:0 "산업 재해 보상"
 LR_GUA_workers_compensation_desc:0 "공장에서 손을 잃은 노동자에게 공화국이 연금을 줍니다. 사장들은 비용을 걱정하지만, 대통령은 병사의 부상에도 연금을 주는데 노동자의 부상이라고 다를 게 없다고 답합니다."
 LR_GUA_republican_senate:0 "공화국 상원"
 LR_GUA_republican_senate_desc:0 "대통령이 스스로 자기 권한을 나눠 상원에 넘깁니다. 측근들은 경악합니다. 이 법이 통과되면 다음 대통령은 군인이 아닐지도 모릅니다. 대통령은 그것이 목적이라고 말합니다."
 LR_GUA_european_congress:0 "유럽 공화주의자 회의"
 LR_GUA_european_congress_desc:0 "빈 체제에 맞서 유럽 각국의 공화주의자들이 파리에 모입니다. 왕들의 경찰을 피해 국경을 넘어온 사람들입니다. 대통령이 개막 연설을 합니다."
 LR_GUA_truth_commission:0 "진상 조사 위원회"
 LR_GUA_truth_commission_desc:0 "왕정의 범죄와 혁명의 범죄를 한 위원회가 함께 조사합니다. 왕당파도 코뮌파도 불만이지만, 적어도 법정에서 싸우는 동안에는 총을 내려놓습니다."
 LR_ORL_cross_of_fire:0 "불의 십자단"
 LR_ORL_cross_of_fire_desc:0 "대전쟁의 재향군인들이 '불의 십자단' 깃발 아래 줄을 섭니다. 그들은 연금과 존경을 바라고 왔습니다. 왕이 그것을 주지 못하면 그들은 다른 깃발을 찾을 것입니다."
 LR_ORL_generals_cabinet:0 "장군들의 내각"
 LR_ORL_generals_cabinet_desc:0 "재무부 장부를 군인들이 읽기 시작합니다. 학교와 병원 예산 칸에 붉은 줄이 그어지고, 그 옆에 포탄과 전차라고 적힙니다."
 LR_ORL_inspectors_out:0 "감시단과의 숨바꼭질"
 LR_ORL_inspectors_out_desc:0 "강화 조약의 군축 감시단이 왕의 창고 문을 두드립니다. 창고 안은 깨끗합니다. 어젯밤에 트럭 마흔 대가 짐을 싣고 떠났기 때문입니다."
 LR_ORL_king_at_front:0 "국경의 왕"
 LR_ORL_king_at_front_desc:0 "왕이 파리를 비우고 동쪽 국경으로 갑니다. 빼앗긴 알자스가 내려다보이는 보주산맥의 언덕에 서서, 그는 한참 동안 아무 말도 하지 않습니다."
 LR_ORL_colonels_plot:0 "대령들의 음모"
 LR_ORL_colonels_plot_desc:0 "왕이 너무 느리다고 생각하는 젊은 대령들이 있습니다. 그들은 장교 클럽 뒷방에서 밤늦게까지 모입니다. 왕실 보안국은 그 모임을 알고 있습니다. 아마도요."
 LR_ORL_day_of_revenge:0 "복수의 날"
 LR_ORL_day_of_revenge_desc:0 "1918년 11월, 항복 문서에 서명하던 날 파리의 시계들은 멈춘 것 같았습니다. 그 시계를 다시 돌릴 날이 왔습니다."
 LR_ORL_mobilisation_day:0 "동원의 날"
 LR_ORL_mobilisation_day_desc:0 "왕의 동원령이 전국의 교회 종탑에서 울립니다. 8월의 아침, 프랑스 전역의 교회 종이 한꺼번에 울립니다. 1914년에도 이 종소리로 전쟁이 시작되었습니다. 마을 광장마다 동원령 포스터가 붙고, 젊은이들이 역으로 걸어갑니다."
 LR_ORL_rhine_crossed:0 "라인강을 건너다"
 LR_ORL_rhine_crossed_desc:0 "프로이센이 무너졌습니다. 왕은 베를린에서 무엇을 할 것인가. 포츠담 상수시 궁전. 프리드리히 대왕의 서재에 프랑스 왕이 앉았습니다. 1871년 베르사유 거울의 방에서 독일 제국을 선포한 그 가문의 궁전입니다."
 LR_ORL_kings_europe:0 "왕들의 새 유럽"
 LR_ORL_kings_europe_desc:0 "복수는 끝났습니다. 왕은 무엇을 남길 것인가. 튈르리 궁 회의실. 탁자 위의 유럽 지도에는 이제 프랑스의 색이 라인강 너머까지 칠해져 있습니다. 1918년의 항복 문서에 서명한 장군들은 모두 죽거나 물러났습니다."
 LR_BOU_lit_de_justice:0 "친림 법정"
 LR_BOU_lit_de_justice_desc:0 "고등법원이 왕의 칙령 등록을 거부했습니다. 왕이 직접 법정의 옥좌에 앉아 칙령을 등록시킵니다. 루이 15세 이후 처음 열리는 친림 법정입니다. 앙시앵 레짐은 끝난 적이 없었습니다."
 LR_BOU_versailles_return:0 "베르사유 귀환"
 LR_BOU_versailles_return_desc:0 "베르사유 궁의 닫혀 있던 창문들이 다시 열립니다. 박물관 큐레이터들이 서둘러 짐을 싸고, 거울의 방에 왕의 의자가 돌아옵니다. 1789년 10월 이후 처음으로 왕이 이곳에서 잠듭니다."
 LR_BOU_jesuits_return:0 "예수회의 귀환"
 LR_BOU_jesuits_return_desc:0 "두 세기 전에 프랑스에서 쫓겨난 예수회 신부들이 학교를 다시 맡게 해 달라고 청원합니다. 왕실 고해 신부는 찬성하고, 대학 총장들은 반대합니다."
 LR_BOU_kings_bread:0 "왕의 빵"
 LR_BOU_kings_bread_desc:0 "1789년 10월, 빵값에 분노한 파리의 여인들이 베르사유까지 걸어와 왕을 끌고 갔습니다. 빵값이 오르면 왕이 위험해진다는 것을 부르봉 가문만큼 잘 아는 집안은 없습니다."
 LR_BOU_madrid_letter:0 "마드리드에서 온 편지"
 LR_BOU_madrid_letter_desc:0 "마드리드의 사촌이 보낸 편지에 왕실 혼인 제안이 들어 있습니다. 피레네 양쪽의 부르봉 왕가가 다시 하나의 가족이 될 기회입니다. 물론 지참금 이야기는 아직 꺼내지 않았습니다."
 LR_BOU_sun_king:0 "태양왕의 후계"
 LR_BOU_sun_king_desc:0 "루이 14세의 나라가 정말 돌아왔는가. 궁정 사람들도, 유럽의 대사들도 그 질문의 답을 기다립니다. 이번에는 왕 자신이 답할 차례입니다."
 LR_BOU_te_deum:0 "출정 미사"
 LR_BOU_te_deum_desc:0 "노트르담에서 왕이 출정 미사를 올립니다. 노트르담 대성당. 파리 대주교가 출정하는 군대를 위해 테 데움을 부릅니다. 왕은 성왕 루이의 검을 제단 위에 올려놓았다가 다시 집어 듭니다."
 LR_BOU_cousins_war:0 "사촌들의 전쟁"
 LR_BOU_cousins_war_desc:0 "마드리드와 나폴리의 사촌들이 함께 싸우고 있습니다. 프로이센이 무너졌다는 승전보가 마드리드와 나폴리에도 동시에 전해졌습니다. 세 부르봉 왕가의 왕궁에서 같은 날 축포가 울립니다."
 LR_BOU_holy_alliance:0 "신성 동맹"
 LR_BOU_holy_alliance_desc:0 "2차 대불전쟁 뒤 빈에서처럼 왕들의 동맹이 다시 맺어집니다. 이번에는 프랑스가 주인입니다. 베르사유 궁 거울의 방. 유럽의 왕과 대공들이 모였습니다. 2차 대불전쟁 뒤 빈 회의에서 혁명 프랑스를 묶었던 왕들의 후손들이, 이번에는 부르봉의 초대로 왔습니다."
 LR_COM_sections_congress:0 "48구역 대회"
 LR_COM_sections_congress_desc:0 "1793년, 파리의 48개 구역은 국민공회를 움직인 진짜 권력이었습니다. 그 48구역이 다시 대표를 뽑아 보냅니다. 위원회는 그들이 박수만 칠지, 질문을 할지 아직 모릅니다."
 LR_COM_elected_officers:0 "장교 문제"
 LR_COM_elected_officers_desc:0 "혁명은 끝났지만 군대의 장교들은 대부분 왕의 사관학교 출신입니다. 그들을 믿을 것인가, 병사들이 직접 장교를 뽑게 할 것인가. 위원회가 결정해야 합니다."
 LR_COM_tribunal:0 "혁명 재판소"
 LR_COM_tribunal_desc:0 "1793년, 혁명 재판소는 끝내지 못한 재판을 남기고 문을 닫았습니다. 그 법정이 다시 열립니다. 피고석에 누가 앉을지는 위원회가 정합니다. 언제 문을 닫을지는 아무도 정하지 않았습니다."
 LR_COM_bread_and_coal:0 "빵과 석탄"
 LR_COM_bread_and_coal_desc:0 "왕들의 유럽이 코뮌을 봉쇄했습니다. 영국 석탄도, 아르헨티나 밀도 들어오지 않습니다. 파리의 빵집 앞 줄이 길어집니다."
 LR_COM_toulon_sailors:0 "툴롱의 수병들"
 LR_COM_toulon_sailors_desc:0 "혁명의 첫 총성은 툴롱 군항의 수병들이 쏘았습니다. 그 수병들이 이제 위원회에 묻습니다. 우리가 피를 흘린 혁명이 지금 이 모습이 맞느냐고."
 LR_COM_year_one:0 "혁명력 원년"
 LR_COM_year_one_desc:0 "시청 벽에 새 달력이 걸립니다. 포도의 달, 안개의 달, 서리의 달. 1792년에 그랬던 것처럼, 다시 원년입니다."
 LR_COM_levee_red:0 "붉은 총동원"
 LR_COM_levee_red_desc:0 "1793년처럼 조국이 위험에 처했다고 위원회가 선언합니다. 시청 발코니에 커다란 현수막이 걸립니다. 조국이 위험하다. 1792년 국민공회가 내걸었던 그 문장입니다."
 LR_COM_ruhr_soviets:0 "루르의 평의회"
 LR_COM_ruhr_soviets_desc:0 "프로이센이 무너지자 루르의 광부들이 평의회를 세웁니다. 에센의 크루프 공장. 프랑스 코뮌군이 도착하기 전에 광부들이 먼저 공장을 점거했습니다. 굴뚝마다 붉은 깃발이 걸렸습니다."
 LR_COM_red_continent:0 "붉은 대륙"
 LR_COM_red_continent_desc:0 "유럽 절반에 붉은 깃발이 걸렸습니다. 코뮌은 무엇이 될 것인가. 몽마르트르의 인터내셔널 회관. 유럽 각지에서 온 대표 3백 명이 모였습니다. 2년 전만 해도 망명자였던 그들이 이제 각자의 나라에서 정부를 이끌고 있습니다."
 LR_JAC_matignon:0 "마티뇽 협상"
 LR_JAC_matignon_desc:0 "공장 점거가 전국으로 번졌습니다. 노조 대표와 사장 대표가 총리 관저 마티뇽의 한 탁자에 마주 앉습니다. 밤새 협상이 이어집니다."
 LR_JAC_two_hundred:0 "200가문"
 LR_JAC_two_hundred_desc:0 "중앙은행의 주주 총회에서 투표권을 가진 사람은 200명뿐입니다. 사람들은 그 200가문이 프랑스를 가졌다고 말합니다. 공화국은 그 말이 틀렸음을 증명해야 합니다."
 LR_JAC_robespierre_portrait:0 "로베스피에르의 초상"
 LR_JAC_robespierre_portrait_desc:0 "공안위원회라는 이름을 쓴 이상, 그 이름의 무게도 함께 물려받았습니다. 의사당 복도에 로베스피에르의 초상을 걸 것인가 말 것인가로 의원들이 다툽니다."
 LR_JAC_pyrenees_refugees:0 "피레네의 망명자들"
 LR_JAC_pyrenees_refugees_desc:0 "스페인 왕의 경찰을 피해 공화주의자들이 눈 덮인 피레네 산을 넘어옵니다. 국경 마을에 천막이 늘어섭니다. 마드리드는 그들을 돌려보내라고 요구합니다."
 LR_JAC_cagoule:0 "두건단"
 LR_JAC_cagoule_desc:0 "두건을 쓴 왕당파 장교들의 비밀 결사가 공장 두 곳을 폭파했습니다. 경찰은 범인들의 이름을 압니다. 그 이름들 가운데에는 현역 장군도 있습니다."
 LR_JAC_fourteenth_july:0 "7월 14일"
 LR_JAC_fourteenth_july_desc:0 "1789년 7월 14일, 파리 시민들이 바스티유를 무너뜨렸습니다. 왕정 아래에서는 한 번도 공휴일이었던 적이 없는 그날이 드디어 국경일이 됩니다."
 LR_JAC_war_vote:0 "개전 표결"
 LR_JAC_war_vote_desc:0 "의회가 전쟁을 표결합니다. 공안위원회의 이름이 무겁습니다. 부르봉 궁 회의장, 새벽 두 시. 선전포고 표결이 열네 시간째 이어지고 있습니다. 산악파 의원들은 1792년의 의용병 이야기를 꺼내고, 반대파는 1914년의 전사자 명단을 읽습니다."
 LR_JAC_liberators:0 "해방자인가 정복자인가"
 LR_JAC_liberators_desc:0 "프로이센이 무너지자 공화국 군대가 점령지를 다스리게 됩니다. 쾰른 시청 광장. 공화국 군대가 왕의 동상을 끌어내리고 자유의 나무를 심습니다. 1794년 프랑스 혁명군이 이 도시에 들어왔을 때 했던 그대로입니다."
 LR_JAC_sister_republics:0 "자매 공화국들"
 LR_JAC_sister_republics_desc:0 "공화국이 이긴 땅마다 새 공화국이 섭니다. 파리 뤽상부르 궁. 프랑스 군대가 지나간 땅마다 세워진 자매 공화국의 대표들이 모였습니다. 바타비아, 헬베티아, 라인, 남독일."
 LR_GIR_bordeaux_congress:0 "보르도 대회"
 LR_GIR_bordeaux_congress_desc:0 "지롱드의 고향 보르도에 전국의 상공인들이 모였습니다. 그들이 내각에 조건을 내겁니다. 세금을 줄이고 규제를 풀면, 다음 선거 자금은 걱정하지 말라고."
 LR_GIR_paris_question:0 "파리 문제"
 LR_GIR_paris_question_desc:0 "파리는 1793년에도, 1848년에도, 1871년에도 혁명을 망쳤다고 지롱드는 믿습니다. 이번에는 파리의 거리가 아니라 지방의 표가 공화국을 정해야 합니다."
 LR_GIR_atlantic_company:0 "대서양 회사"
 LR_GIR_atlantic_company_desc:0 "선주들이 국왕 칙허 회사 대신 공화국 칙허 회사를 세우자고 합니다. 회사 이름과 정관은 암스테르담의 동인도 회사에서 빌려 왔습니다."
 LR_GIR_bourse_panic:0 "증권가의 공황"
 LR_GIR_bourse_panic_desc:0 "자유 시장에도 겨울은 옵니다. 증권거래소 객장에서 비명이 터지고, 철도 주식이 하루 만에 3분의 1로 떨어집니다. 산악파 신문들은 이날을 기다려 왔습니다."
 LR_GIR_federal_draft:0 "연방 헌법 초안"
 LR_GIR_federal_draft_desc:0 "1793년, 콩도르세가 쓰다 만 지롱드 헌법 초안을 국립 문서고 금고에서 꺼냅니다. 프랑스를 83개 도의 연방으로 만드는 헌법입니다."
 LR_GIR_merchant_republic:0 "상인들의 공화국"
 LR_GIR_merchant_republic_desc:0 "프랑스의 다음 세기를 누가 쓸 것인가. 상인과 은행가와 선주들의 공화국이 그 답을 내놓을 차례입니다."
 LR_GIR_war_bonds:0 "전쟁 채권"
 LR_GIR_war_bonds_desc:0 "전쟁 비용을 세금이 아니라 채권으로 마련합니다. 파리 증권거래소 객장. 정부가 발행한 첫 전쟁 채권이 개장 한 시간 만에 매진되었습니다. 보르도와 리옹의 상인들이 앞다투어 샀습니다."
 LR_GIR_ruhr_contracts:0 "루르의 계약서"
 LR_GIR_ruhr_contracts_desc:0 "프로이센이 무너지자 프랑스 기업들이 루르로 몰려갑니다. 에센의 호텔 연회장. 군정청이 압류한 루르의 탄광과 제철소를 경매에 부칩니다. 슈나이더, 드방델, 리옹 신용은행의 대리인들이 번호판을 들고 앉았습니다."
 LR_GIR_common_market:0 "대륙의 시장"
 LR_GIR_common_market_desc:0 "관세가 사라진 유럽을 상인들이 꿈꿉니다. 보르도 상공회의소. 지롱드파의 오랜 꿈이 처음으로 손에 닿습니다. 프랑스와 자매 공화국들, 라인 연방 사이의 관세를 모두 없애는 조약 초안입니다."
 LR_MAR_notables:0 "명사 회의"
 LR_MAR_notables_desc:0 "재산과 이름이 있는 사람들이 한자리에 모여 나라의 앞날을 논합니다. 공장주, 대지주, 은행가, 대주교. 1787년 루이 16세도 명사 회의를 불렀습니다."
 LR_MAR_lafayette_heir:0 "라파예트의 후계자"
 LR_MAR_lafayette_heir_desc:0 "국민방위대가 다시 제복을 맞춥니다. 문제는 사령관입니다. 라파예트의 후계자가 될 사람은 곧 파리의 총을 쥐는 사람입니다."
 LR_MAR_empty_throne:0 "빈 왕좌"
 LR_MAR_empty_throne_desc:0 "헌법은 왕을 요구합니다. 그런데 왕좌는 비어 있습니다. 부르봉이냐 오를레앙이냐, 아니면 외국 왕가냐. 의회가 후보를 고릅니다."
 LR_MAR_civil_list:0 "왕실비 논쟁"
 LR_MAR_civil_list_desc:0 "왕실에 해마다 얼마를 줄지 의회가 표결합니다. 왕의 생활비가 예산안의 한 줄이 되었다는 것, 그 자체가 혁명입니다."
 LR_MAR_lyon_strike:0 "리옹의 견직공"
 LR_MAR_lyon_strike_desc:0 "1831년, 리옹의 견직공들은 '일하며 살거나 싸우다 죽거나'라고 적힌 검은 깃발을 들었습니다. 100년 만에 그 깃발이 리옹 언덕에 다시 걸립니다."
 LR_MAR_charter:0 "1791년의 약속"
 LR_MAR_charter_desc:0 "1791년의 헌법은 1년도 못 가 찢어졌습니다. 그 헌법을 다시 꺼내 놓고 왕이 손을 얹습니다. 이번에는 오래갈 수 있을까요."
 LR_MAR_kings_call:0 "입헌 군주의 소집령"
 LR_MAR_kings_call_desc:0 "헌법 아래의 왕이 처음으로 군대를 부릅니다. 튈르리 궁 집무실. 동원령 문서에는 서명란이 둘 있습니다. 하나는 왕의 것, 하나는 의회 의장의 것입니다. 1791년 헌법이 정한 그대로입니다."
 LR_MAR_notables_peace:0 "명사들의 강화"
 LR_MAR_notables_peace_desc:0 "프로이센이 무너지자 명사들이 서둘러 강화를 원합니다. 생제르맹 거리의 어느 살롱. 은행가와 대지주와 대주교가 모여 지도를 펼쳤습니다. 프로이센은 무너졌고, 그들은 이제 전쟁을 끝내고 싶어 합니다."
 LR_MAR_concert:0 "유럽 협조 체제"
 LR_MAR_concert_desc:0 "입헌 프랑스가 왕들의 유럽과 공존할 질서를 제안합니다. 빈의 회의장. 2차 대불전쟁 뒤 왕들이 혁명 프랑스를 묶었던 그 도시에서, 이번에는 입헌 프랑스가 회의를 주재합니다."
 LR_NAP_algiers_return:0 "알제에서 돌아온 사람"
 LR_NAP_algiers_return_desc:0 "알제리 위기 때 파리는 아무나 보내라고 했습니다. 그 '아무나'가 지금 리옹역 플랫폼에 내립니다. 기자들이 몰려들지만, 그는 아무 말 없이 차에 오릅니다."
 LR_NAP_plebiscite:0 "국민투표"
 LR_NAP_plebiscite_desc:0 "통령 정부에 찬성합니까? 투표용지에는 질문이 하나뿐입니다. 결과는 투표 전부터 다들 짐작하지만, 그 숫자가 얼마나 클지가 중요합니다."
 LR_NAP_before_the_crown:0 "왕관 앞에서"
 LR_NAP_before_the_crown_desc:0 "법전이 완성되고 교황과의 정교 협약이 맺어지면 원로원이 물을 것입니다. 통령 다음은 무엇입니까. 그 답은 이미 그의 책상 서랍에 들어 있는지도 모릅니다."
 LR_NAP_eagles:0 "독수리 군기"
 LR_NAP_eagles_desc:0 "로마 군단의 독수리가 프랑스 연대 앞에 섭니다. 황제가 직접 군기를 건네며 말합니다. 이 독수리를 잃느니 죽겠다고 맹세하라. 병사들이 함성으로 답합니다."
 LR_NAP_new_nobles:0 "오랜 이름, 새 이름"
 LR_NAP_new_nobles_desc:0 "오래된 귀족 가문은 제국 궁정을 비웃습니다. 전장에서 공을 세운 새 귀족들은 그 비웃음을 견디지 못합니다. 황제는 둘 중 누구를 궁정에 앉힐지 정해야 합니다."
 LR_NAP_empress:0 "황후 문제"
 LR_NAP_empress_desc:0 "제국에는 후계자가 필요합니다. 황제의 침실이 외교 문제가 되고, 대사들이 각국 공주의 초상화를 들고 튈르리 궁 대기실에 줄을 섭니다."
 LR_NAP_spanish_ulcer:0 "스페인의 궤양"
 LR_NAP_spanish_ulcer_desc:0 "황제의 형은 왕이 되고 싶어 합니다. 그가 원하는 왕좌는 마드리드에 있습니다. 측근들은 스페인 산악 지대의 게릴라 이야기를 꺼내지만, 형은 듣지 않습니다."
 LR_NAP_emperor_of_europe:0 "유럽의 황제"
 LR_NAP_emperor_of_europe_desc:0 "유럽의 모든 왕이 파리에서 올 황제의 전갈을 기다리는 날. 황제는 그날을 꿈꿉니다. 그 꿈이 이루어질지, 그 꿈이 그를 삼킬지는 아직 모릅니다."
 LR_NAP_bulletin:0 "대육군 공보"
 LR_NAP_bulletin_desc:0 "황제의 공보가 전선의 소식을 전합니다. 늘 승리뿐입니다. 파리의 모든 신문 1면에 같은 글이 실립니다. 대육군 제1호 공보. 황제가 직접 받아쓰게 한 전황 보고입니다."
 LR_NAP_berlin_decree:0 "베를린 칙령"
 LR_NAP_berlin_decree_desc:0 "베를린에서 황제가 대륙봉쇄를 다시 선포합니다. 베를린 왕궁, 프리드리히 대왕의 옛 서재. 황제가 대륙봉쇄령에 서명합니다. 프로이센 왕들이 프랑스를 겨눈 동맹 조약에 서명하던 바로 그 책상입니다."
 LR_NAP_grand_empire:0 "대제국"
 LR_NAP_grand_empire_desc:0 "황제의 제국이 샤를마뉴 이후 가장 넓은 국경을 그렸습니다. 튈르리 궁 지도실. 벽에 걸린 프랑스 제국 지도에는 130개의 도가 그려져 있습니다. 암스테르담에서 로마까지, 함부르크에서 바르셀로나까지. 샤를마뉴의 제국보다 넓습니다."
 LR_GUA_first_address:0 "첫 국정 연설"
 LR_GUA_first_address_desc:0 "대통령이 처음으로 군복을 벗고 연미복을 입은 채 의회에 들어섭니다. 의원들이 술렁입니다. 연단에 선 그가 첫마디를 고릅니다."
 LR_GUA_marshals_protest:0 "장군들의 항의"
 LR_GUA_marshals_protest_desc:0 "왕관을 거절한 황제를 군은 이해하지 못합니다. 원수들이 항의 서한을 들고 관저를 찾아옵니다. 그들은 자기들이 무엇을 위해 싸웠는지 묻습니다."
 LR_GUA_life_presidency:0 "종신 대통령 청원"
 LR_GUA_life_presidency_desc:0 "지지자들이 임기를 없애자는 청원서를 가져옵니다. 서명이 200만 개입니다. 거절하면 그들이 실망하고, 받아들이면 그가 지금까지 한 약속이 모두 거짓말이 됩니다."
 LR_GUA_exiles_return:0 "망명 왕족의 귀환"
 LR_GUA_exiles_return_desc:0 "혁명 때 망명한 왕족들이 귀국을 허락해 달라고 청원합니다. 공화국이 그들을 두려워하지 않는다는 것을 보여 줄 수도 있고, 왕당파에게 깃발을 쥐여 줄 수도 있습니다."
 LR_GUA_farewell:0 "대통령의 약속"
 LR_GUA_farewell_desc:0 "언젠가 이 사람도 대통령 관저를 나와야 합니다. 그날 무엇을 남기고 떠날지, 대통령이 국민 앞에서 약속합니다."
 LR_GUA_war_powers:0 "전시 대권"
 LR_GUA_war_powers_desc:0 "대통령에게 전시 대권을 주자는 법안이 올라옵니다. 부르봉 궁. 대통령 지지 의원들이 전시 대권법을 발의했습니다. 전쟁 동안 대통령이 의회 없이 칙령으로 다스릴 수 있게 하는 법입니다."
 LR_GUA_general_president:0 "전선의 대통령"
 LR_GUA_general_president_desc:0 "프로이센이 무너지자 대통령이 전선을 찾습니다. 라인강 건너의 전선 막사. 연미복 대신 낡은 야전 외투를 입은 대통령이 병사들 사이를 걷습니다. 알제리에서 그를 따랐던 고참병들이 그를 알아보고 경례합니다."
 LR_GUA_republican_peace:0 "공화국의 평화"
 LR_GUA_republican_peace_desc:0 "대통령이 승전국으로서 강화의 원칙을 발표합니다. 베르사유 궁 거울의 방. 대통령이 강화 회의 개막 연설을 합니다. 1919년 이곳에서 프랑스를 무릎 꿇린 조약이 서명되었습니다. 이번에는 프랑스가 원칙을 말합니다."
 LR_PET_vichy:0 "온천 도시의 정부"
 LR_PET_vichy_desc:0 "정부가 파리를 떠나 오베르뉴의 온천 도시 비시로 옮겨 갑니다. 파리는 언제나 혁명의 도시였고, 원수는 혁명의 도시에서 다스리고 싶지 않습니다."
 LR_PET_portrait:0 "원수의 초상"
 LR_PET_portrait_desc:0 "흰 콧수염의 노인 사진이 모든 교실과 관공서, 담배 가게와 우표에 걸립니다. 원수의 얼굴은 이제 프랑스의 얼굴입니다."
 LR_PET_laval:0 "라발의 귀환"
 LR_PET_laval_desc:0 "흰 넥타이의 사나이 피에르 라발이 원수의 문을 두드립니다. 그는 누구와도 거래할 줄 압니다. 그것이 그의 장점이고, 그것이 그의 위험입니다."
 LR_PET_riom:0 "리옴 법정"
 LR_PET_riom_desc:0 "리옴 법원에서 옛 공화국의 지도자들이 재판을 받습니다. 그러나 피고들은 순순히 고개를 숙이지 않습니다."
 LR_PET_last_winter:0 "늙은 원수의 겨울"
 LR_PET_last_winter_desc:0 "여든을 넘긴 원수에게 남은 시간을 세는 사람들이 있습니다. 그가 세운 나라는 그가 없어도 서 있을 수 있을까요."
 LR_ANA_no_masters:0 "주인 없는 공장"
 LR_ANA_no_masters_desc:0 "사장이 떠난 공장에서 첫 월요일이 밝습니다. 누구도 명령할 권한이 없습니다. 그것이 이 혁명의 요점입니다."
 LR_ANA_vendee_coop:0 "방데의 농민들"
 LR_ANA_vendee_coop_desc:0 "집산 농장 가입서가 방데의 마을 광장에 도착합니다. 150년 전에도 방데는 파리의 혁명과 싸웠습니다."
 LR_ANA_platform_debate:0 "강령과 종합"
 LR_ANA_platform_debate_desc:0 "연합의 두 경향, 강령파와 종합파가 벨빌의 낡은 회관에서 밤새 맞섭니다."
 LR_ANA_commissars:0 "중앙파의 사절"
 LR_ANA_commissars_desc:0 "회색 가죽 외투를 입은 중앙집권파의 사절들이 무기와 조건을 들고 파리 북역에 내립니다."
 LR_ANA_anarchy_spring:0 "국가 없는 첫 봄"
 LR_ANA_anarchy_spring_desc:0 "연합이 첫돌을 맞습니다. 국가 없는 1년을 버텼습니다. 그러나 국경에는 왕들의 군대가 모이고 있습니다."
 LR_RED_souper:0 "보케르의 저녁"
 LR_RED_souper_desc:0 "통령이 1922년에 쓴 소책자, 보케르의 저녁 식사를 다시 찍게 합니다."
 LR_RED_red_epaulettes:0 "붉은 견장"
 LR_RED_red_epaulettes_desc:0 "알제부터 함께 온 원수들이 붉은 깃발 앞에서 머뭇거립니다."
 LR_RED_concordat_question:0 "교회의 자리"
 LR_RED_concordat_question_desc:0 "통령이 교황과 맺은 정교 협약을 혁명가들이 찢자고 합니다."
 LR_RED_robespierre_shadow:0 "로베스피에르의 그림자"
 LR_RED_robespierre_shadow_desc:0 "생앙투안 거리의 벽보가 묻습니다. 브루투스는 어디 있는가, 테르미도르는 언제 오는가."
 LR_RED_peoples_emperor:0 "인민의 황제?"
 LR_RED_peoples_emperor_desc:0 "노동자 평의회가 통령에게 종신의 권한을 바칩니다. 왕관을 거절한 사람에게 왕관과 다를 것 없는 것을 내밉니다."
 LR_DEF_commandant:0 "사령관의 만찬"
 LR_DEF_commandant_desc:0 "점령군 사령관이 파리의 명사들을 리츠 호텔 만찬에 부릅니다."
 LR_DEF_first_execution:0 "첫 처형"
 LR_DEF_first_execution_desc:0 "점령군 장교 한 명이 지하철역에서 총에 맞았습니다. 점령군은 인질 명단을 요구합니다."
 LR_DEF_second_winter:0 "두 번째 겨울"
 LR_DEF_second_winter_desc:0 "점령 아래 두 번째 겨울. 센강이 얼고, 공원의 나무들이 하룻밤 사이에 사라집니다."
 LR_ORL_plan_low:0 "저지대 계획"
 LR_ORL_plan_low_desc:0 "브뤼셀과 룩셈부르크, 암스테르담, 그리고 알프스의 은행가들. 1914년에 프로이센은 벨기에를 지나 프랑스로 들어왔습니다. 이번에는 프랑스가 반대 방향으로 지나갈 차례입니다. 중립국들의 시대는 끝나 가고 있습니다."
 LR_ORL_plan_south_germany:0 "슈바르츠발트 너머"
 LR_ORL_plan_south_germany_desc:0 "뮌헨과 슈투트가르트의 왕들은 언제나 베를린보다 파리를 덜 무서워했습니다. 프로이센의 패권을 싫어하면서도 대전쟁에서는 함께 싸웠습니다. 슈바르츠발트 너머로 마지막 질문을 보냅니다. 베를린과 함께 무너지겠습니까?"
 LR_ORL_plan_iberia:0 "피레네 계획"
 LR_ORL_plan_iberia_desc:0 "태양왕은 손자를 마드리드로 보내며 이제 피레네는 없다고 했습니다. 두 세기 반이 지났지만 산맥은 아직 그 자리에 있습니다. 리스본의 금고와 지브롤터의 포대가 그 너머에서 기다립니다."
 LR_ORL_plan_italy:0 "알프스 계획"
 LR_ORL_plan_italy_desc:0 "한니발도, 프랑수아 1세도 이 길을 넘었습니다. 토리노, 로마, 피렌체, 나폴리. 네 왕이 지금도 프랑스보다 서로를 더 미워합니다. 몽스니 고개의 눈이 녹으면 포병대가 노새 등에 오릅니다."
 LR_ORL_plan_north:0 "북해 계획"
 LR_ORL_plan_north_desc:0 "덴마크 해협을 쥐면 발트해가 닫힙니다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 베어링 공장, 핀란드의 숲. 스칸디나비아의 왕들은 자기들의 중립이 오래가지 않으리라는 것을 압니다."
 LR_ORL_plan_east:0 "동유럽 계획"
 LR_ORL_plan_east_desc:0 "바르샤바와 키예프, 리가. 대전쟁의 승자들이 러시아에게서 떼어 내 세운 작은 왕국들입니다. 그 왕들 대부분은 왕관을 쓴 지 스무 해도 되지 않았습니다. 이제 그들이 프랑스의 답을 기다립니다."
 LR_ORL_plan_balkans:0 "발칸 계획"
 LR_ORL_plan_balkans_desc:0 "유럽의 화약고. 소피아와 베오그라드, 아테네와 부쿠레슈티는 스무 해 동안 서로의 국경을 고쳐 그리느라 뒤를 보지 않았습니다. 발칸의 왕들은 언제나 다음 전쟁의 동맹을 찾아 왔습니다. 이제 그 답이 프랑스입니다."
 LR_ORL_plan_turkey:0 "동방 원정"
 LR_ORL_plan_turkey_desc:0 "대전쟁의 승자 오스만 제국은 다뉴브에서 페르시아만까지 뻗어 있습니다. 다르다넬스를 뚫으면 이스탄불이고, 시리아를 치면 석유입니다. 십자군 이래 가장 야심 찬 프랑스의 동방 원정입니다."
 LR_BOU_plan_low:0 "저지대 계획"
 LR_BOU_plan_low_desc:0 "브뤼셀과 룩셈부르크, 암스테르담, 그리고 알프스의 은행가들. 1914년에 프로이센은 벨기에를 지나 프랑스로 들어왔습니다. 이번에는 프랑스가 반대 방향으로 지나갈 차례입니다. 중립국들의 시대는 끝나 가고 있습니다."
