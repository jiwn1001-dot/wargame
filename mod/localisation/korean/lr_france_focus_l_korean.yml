 LR_MAR_plan_balkans_desc:0 "발칸의 민족들은 백 년에 걸쳐 술탄에게서 차례로 독립을 얻었습니다. 그리고 얻자마자 독일 혈통의 왕을 모셔 왔습니다. 공화국은 그 왕들의 궁전보다 소피아와 베오그라드의 대학을 먼저 봅니다. 공화국의 친구들은 거기서 자라고 있습니다."
 LR_MAR_plan_turkey:0 "동방 원정"
 LR_MAR_plan_turkey_desc:0 "술탄의 제국은 대전쟁에서 이겼지만, 그 안의 민족들은 이기지 못했습니다. 아르메니아 사람들과 아랍 사람들과 쿠르드 사람들은 아직 이스탄불이 보낸 총독 아래 삽니다. 공화국은 그들에게 인권 선언문의 번역본을 보냅니다. 다르다넬스를 향하는 함대가 그 뒤를 따릅니다."
 LR_NAP_plan_low:0 "저지대 계획"
 LR_NAP_plan_low_desc:0 "황제에게 중립이란 아직 주인이 정해지지 않았다는 뜻일 뿐입니다. 1795년 혁명군은 암스테르담에 바타비아 공화국을 세웠고 4년 만에 잃었습니다. 참모들은 안트베르펜을 영국의 심장을 겨눈 권총이라고 부릅니다. 황제는 그 권총을 쥐기로 합니다."
 LR_NAP_plan_south_germany:0 "슈바르츠발트 너머"
 LR_NAP_plan_south_germany_desc:0 "독일에는 서른 명이 넘는 군주가 있습니다. 그들은 서로를 믿지 않고, 베를린은 더 믿지 않습니다. 황제는 그 군주들을 하나의 연방으로 묶고 스스로 그 보호자가 되려 합니다. 첫 편지는 뮌헨으로 갑니다."
 LR_NAP_plan_iberia:0 "피레네 계획"
 LR_NAP_plan_iberia_desc:0 "피레네는 지도 위의 선이 아니라 산맥입니다. 그 너머에는 지친 왕국과 영국의 바위가 있습니다. 지브롤터를 쥐면 지중해의 문이 닫히고, 리스본을 쥐면 영국 함대가 쉴 항구가 사라집니다. 황제는 그 산맥을 넘을 길을 고릅니다."
 LR_NAP_plan_italy:0 "알프스 계획"
 LR_NAP_plan_italy_desc:0 "이탈리아는 일곱 군주의 반도이고, 그 누구의 나라도 아닙니다. 황제는 그 반도를 하나의 왕관 아래 둘 수 있다고 믿습니다. 그 왕관을 누가 쓸지는 아직 말하지 않습니다. 몽스니와 생베르나르 고개로 공병대가 먼저 올라갑니다."
 LR_NAP_plan_north:0 "북해 계획"
 LR_NAP_plan_north_desc:0 "발트해는 영국 상품이 대륙으로 흘러드는 뒷문입니다. 외레순 해협을 닫으면 그 문이 잠깁니다. 나르비크의 철광과 스웨덴의 베어링 공장은 덤입니다. 황제는 북쪽의 왕들에게 그들의 중립이 누구 편인지 묻습니다."
 LR_NAP_plan_east:0 "동유럽 계획"
 LR_NAP_plan_east_desc:0 "동쪽 평원은 군대를 삼키는 땅입니다. 바르샤바와 키예프와 리가의 신생 왕국들은 그 평원의 문지기입니다. 황제는 문지기를 갈아 치울 생각입니다. 망명한 폴란드 장교들은 승전국이 씌운 왕관보다 파리에서 오는 군대를 더 반길 것이라고 장담합니다."
 LR_NAP_plan_balkans:0 "발칸 계획"
 LR_NAP_plan_balkans_desc:0 "발칸은 세 제국이 만나는 십자로입니다. 빈과 이스탄불과 페테르부르크가 이곳에서 서로를 노려봅니다. 그 십자로를 쥐는 자가 동방을 쥡니다. 황제의 원수들이 아드리아해 너머의 지도를 펼칩니다."
 LR_NAP_plan_turkey:0 "동방 원정"
 LR_NAP_plan_turkey_desc:0 "동방은 언제나 정복자들의 꿈이었습니다. 알렉산드로스는 인더스까지 갔고, 카이사르는 이집트에서 돌아왔습니다. 황제는 이스탄불의 지도를 오래 들여다봅니다. 다르다넬스를 넘으면 시리아의 석유가 있고, 그 너머에 인도로 가는 길이 있습니다."
 LR_GUA_plan_low:0 "저지대 계획"
 LR_GUA_plan_low_desc:0 "1792년 혁명군은 제마프에서 오스트리아군을 깨고 벨기에 사람들에게 자유를 약속했습니다. 1795년에는 암스테르담에 바타비아 공화국이, 3년 뒤에는 스위스에 헬베티아 공화국이 섰습니다. 왕들의 동맹이 그 자매 공화국들을 지도에서 지웠습니다. 공화국이 그 약속을 다시 꺼냅니다."
 LR_GUA_plan_south_germany:0 "슈바르츠발트 너머"
 LR_GUA_plan_south_germany_desc:0 "1796년 모로의 군대는 슈바르츠발트를 넘어 뮌헨 문턱까지 갔다가 돌아왔습니다. 남독일의 대학 도시에는 그해 광장에 심은 자유의 나무를 기억하는 집안이 아직 있습니다. 공화국은 남독일의 왕들이 아니라 그 시민들에게 묻습니다. 왕관 없이 살아 볼 생각이 있느냐고."
 LR_GUA_plan_iberia:0 "피레네 계획"
 LR_GUA_plan_iberia_desc:0 "피레네 너머의 공화파는 내전에서 살아남았지만, 반도의 절반은 아직 왕과 사제의 것입니다. 리스본에서는 영국 대사가 국왕보다 먼저 보고를 받습니다. 1793년 혁명군은 그 산맥을 끝내 넘지 못했습니다. 이번에는 넘습니다."
 LR_GUA_plan_italy:0 "알프스 계획"
 LR_GUA_plan_italy_desc:0 "1798년 로마의 캄피돌리오 광장에 공화국 선포문이 붙었습니다. 이듬해 나폴리 왕의 군대와 오스트리아군이 그것을 떼어 냈습니다. 반도의 공화파는 그 뒤로 백사십 년을 감옥과 망명지에서 보냈습니다. 공화국이 알프스를 넘어 그 빚을 갚으러 갑니다."
 LR_GUA_plan_north:0 "북해 계획"
 LR_GUA_plan_north_desc:0 "스칸디나비아의 왕들은 의회를 존중하고, 의회는 왕을 존중합니다. 그 덕에 그들은 대전쟁 내내 양쪽에 물건을 팔 수 있었습니다. 공화국은 그 신사협정에 끼어들 생각이 없습니다. 다만 외레순 해협과 나르비크의 철광을 영국의 것으로 남겨 둘 수는 없습니다."
 LR_GUA_plan_east:0 "동유럽 계획"
 LR_GUA_plan_east_desc:0 "폴란드 사람들은 18세기에 세 번 나라를 잃었고, 대전쟁 뒤에는 승전국이 골라 준 왕을 얻었습니다. 우크라이나에는 빈의 대공이 앉았습니다. 그들 가운데 누구도 자기 왕을 고르지 않았습니다. 공화국이 그들에게 고를 권리를 돌려주러 갑니다."
 LR_GUA_plan_balkans:0 "발칸 계획"
 LR_GUA_plan_balkans_desc:0 "발칸의 민족들은 백 년에 걸쳐 술탄에게서 차례로 독립을 얻었습니다. 그리고 얻자마자 독일 혈통의 왕을 모셔 왔습니다. 공화국은 그 왕들의 궁전보다 소피아와 베오그라드의 대학을 먼저 봅니다. 공화국의 친구들은 거기서 자라고 있습니다."
 LR_GUA_plan_turkey:0 "동방 원정"
 LR_GUA_plan_turkey_desc:0 "술탄의 제국은 대전쟁에서 이겼지만, 그 안의 민족들은 이기지 못했습니다. 아르메니아 사람들과 아랍 사람들과 쿠르드 사람들은 아직 이스탄불이 보낸 총독 아래 삽니다. 공화국은 그들에게 인권 선언문의 번역본을 보냅니다. 다르다넬스를 향하는 함대가 그 뒤를 따릅니다."
 LR_PET_plan_low:0 "저지대 계획"
 LR_PET_plan_low_desc:0 "원수는 1914년 8월을 잊지 않았습니다. 프로이센군은 중립국 벨기에를 지나 프랑스의 등 뒤로 들어왔고, 국경 요새들은 엉뚱한 쪽을 보고 서 있었습니다. 다시는 북쪽 평야를 열어 둔 채 전쟁을 맞지 않습니다. 브뤼셀과 룩셈부르크, 그리고 알프스의 고개들을 프랑스의 방벽 안으로 들입니다."
 LR_PET_plan_south_germany:0 "슈바르츠발트 너머"
 LR_PET_plan_south_germany_desc:0 "원수는 독일이 하나로 뭉쳐 있는 한 다음 전쟁도 온다고 믿습니다. 바이에른과 뷔르템베르크는 대전쟁에서 프로이센 편에 섰지만, 베를린의 명령을 즐겨 따른 적은 없습니다. 그 틈을 벌립니다. 라인강 너머에 프랑스를 두려워하는 나라 대신 프랑스에 기대는 나라들을 세웁니다."
 LR_PET_plan_iberia:0 "피레네 계획"
 LR_PET_plan_iberia_desc:0 "피레네 너머의 내전은 끝났지만 반도는 아직 연기를 피우고 있습니다. 원수는 국경 너머의 무질서가 산을 넘어오도록 두지 않습니다. 마드리드에는 신앙과 질서를 지킬 정부가 서야 합니다. 리스본의 금고와 지브롤터의 영국 포대도 그 계산에 들어갑니다."
 LR_PET_plan_italy:0 "알프스 계획"
 LR_PET_plan_italy_desc:0 "반도의 작은 왕국들은 하나하나가 빈의 전초 기지입니다. 원수는 알프스 너머에 적이 진을 친 채로 다음 전쟁을 맞을 생각이 없습니다. 다만 로마만은 다릅니다. 성하의 도시에는 포탄 한 발도 떨어져서는 안 된다고 원수는 못 박습니다."
 LR_PET_plan_north:0 "북해 계획"
 LR_PET_plan_north_desc:0 "원수는 북쪽 바다를 걱정합니다. 독일의 대포는 스웨덴 철광석으로 만들고, 그 광석은 나르비크 항구에서 실려 나갑니다. 그 길을 끊으면 다음 전쟁에서 독일의 포탄이 줄어듭니다. 해군이 코펜하겐과 오슬로 앞바다로 먼저 나갑니다."
 LR_PET_plan_east:0 "동유럽 계획"
 LR_PET_plan_east_desc:0 "바르샤바와 키예프와 리가의 왕들은 대전쟁의 승자들이 세운 허수아비입니다. 그러나 그 너머에는 러시아가 있고, 원수는 공화국 러시아도 승전국의 왕들만큼이나 믿지 않습니다. 동쪽에 프랑스의 말을 듣는 방파제를 쌓습니다."
 LR_PET_plan_balkans:0 "발칸 계획"
 LR_PET_plan_balkans_desc:0 "대전쟁의 불씨는 발칸에서 튀었습니다. 원수는 그 화약고를 빈과 이스탄불의 손에 맡겨 둘 생각이 없습니다. 베오그라드와 아테네와 부쿠레슈티는 대전쟁 때 프랑스와 함께 싸웠고 함께 졌습니다. 옛 전우들의 땅에 프랑스의 질서를 세웁니다."
 LR_PET_plan_turkey:0 "동방 원정"
 LR_PET_plan_turkey_desc:0 "레반트에는 프랑스의 학교와 수도원이 있고, 레바논의 마론파는 백 년 동안 파리를 보호자로 여겨 왔습니다. 오스만은 대전쟁에서 이긴 뒤 그 보호권마저 빼앗았습니다. 원수는 그것을 되찾는 원정을 십자군이라 부르지 않습니다. 다만 출정 미사를 막지도 않습니다."
 LR_ANA_plan_low:0 "저지대 계획"
 LR_ANA_plan_low_desc:0 "브뤼셀의 은행과 암스테르담의 증권거래소, 제네바의 금고에는 대전쟁 동안 양쪽에 팔아 번 돈이 쌓여 있습니다. 중립은 그 돈을 지키는 담장이었습니다. 샤를루아의 광부들과 로테르담의 부두 노동자들은 그 담장 안에서 일합니다. 혁명군이 담장을 넘습니다."
 LR_ANA_plan_south_germany:0 "슈바르츠발트 너머"
 LR_ANA_plan_south_germany_desc:0 "슈투트가르트의 자동차 공장과 아우크스부르크의 기계 공장에는 파리 방송을 몰래 듣는 노동자들이 있습니다. 그들의 왕은 프로이센의 칼을 빌려 왕좌를 지켰습니다. 혁명은 그 칼이 다른 곳을 보고 있을 때 옵니다. 전단이 먼저 슈바르츠발트를 넘고, 혁명군이 그 뒤를 따릅니다."
 LR_ANA_plan_iberia:0 "피레네 계획"
 LR_ANA_plan_iberia_desc:0 "바르셀로나의 조합원들은 이 반도에서 가장 먼저 검붉은 깃발을 들었습니다. 안달루시아의 날품팔이들은 아직 지주의 땅에서 하루 품삯을 받습니다. 반도의 혁명은 이미 시작되었고, 모자란 것은 무기뿐입니다. 피레네의 고개로 탄약 행렬이 먼저 올라갑니다."
 LR_ANA_plan_italy:0 "알프스 계획"
 LR_ANA_plan_italy_desc:0 "토리노의 자동차 공장과 밀라노의 방직 공장은 반도에서 가장 붉은 곳입니다. 그 노동자들 위에는 왕이 다섯이고, 그 왕들 위에는 빈이 있습니다. 왕관이 몇 개든 혁명에게는 국경 하나일 뿐입니다. 몽스니 고개의 눈이 녹으면 혁명군이 내려갑니다."
 LR_ANA_plan_north:0 "북해 계획"
 LR_ANA_plan_north_desc:0 "스톡홀름의 사회민주당은 왕 아래서 표를 모아 왔습니다. 핀란드의 노동자들은 독립과 함께 찾아온 내전에서 졌습니다. 북쪽의 동지들은 기다리는 데 익숙합니다. 혁명의 함대가 외레순 해협을 지나 그 기다림을 끝내러 갑니다."
 LR_ANA_plan_east:0 "동유럽 계획"
 LR_ANA_plan_east_desc:0 "바르샤바와 우치의 방직 공장, 리가의 항구에서 일하는 노동자들은 대전쟁 뒤 왕을 하나씩 얻었습니다. 아무도 그 왕을 원하지 않았습니다. 페테르부르크의 혁명은 국경에서 멈췄습니다. 혁명군이 그 국경 너머의 문을 엽니다."
 LR_ANA_plan_balkans:0 "발칸 계획"
 LR_ANA_plan_balkans_desc:0 "트란실바니아의 광부와 피레우스의 부두 노동자, 소피아의 담배 공장 여공들은 서로 다른 말을 씁니다. 그러나 그들의 왕은 모두 같은 은행에서 돈을 빌립니다. 발칸의 민족 전쟁은 왕들의 전쟁이었습니다. 혁명군은 그 전쟁을 계급의 전쟁으로 바꾸러 갑니다."
 LR_ANA_plan_turkey:0 "동방 원정"
 LR_ANA_plan_turkey_desc:0 "모술과 키르쿠크의 유전에서 퍼 올린 석유는 런던과 이스탄불의 은행으로 흘러갑니다. 그 땅에서 일하는 사람들에게 남는 것은 기름 냄새뿐입니다. 혁명은 석유보다 빨리 번집니다. 혁명군이 다르다넬스와 레반트의 해안을 함께 노립니다."
 LR_RED_plan_low:0 "저지대 계획"
 LR_RED_plan_low_desc:0 "브뤼셀의 은행과 암스테르담의 증권거래소, 제네바의 금고에는 대전쟁 동안 양쪽에 팔아 번 돈이 쌓여 있습니다. 중립은 그 돈을 지키는 담장이었습니다. 샤를루아의 광부들과 로테르담의 부두 노동자들은 그 담장 안에서 일합니다. 혁명군이 담장을 넘습니다."
 LR_RED_plan_south_germany:0 "슈바르츠발트 너머"
 LR_RED_plan_south_germany_desc:0 "슈투트가르트의 자동차 공장과 아우크스부르크의 기계 공장에는 파리 방송을 몰래 듣는 노동자들이 있습니다. 그들의 왕은 프로이센의 칼을 빌려 왕좌를 지켰습니다. 혁명은 그 칼이 다른 곳을 보고 있을 때 옵니다. 전단이 먼저 슈바르츠발트를 넘고, 혁명군이 그 뒤를 따릅니다."
 LR_RED_plan_iberia:0 "피레네 계획"
 LR_RED_plan_iberia_desc:0 "바르셀로나의 조합원들은 이 반도에서 가장 먼저 검붉은 깃발을 들었습니다. 안달루시아의 날품팔이들은 아직 지주의 땅에서 하루 품삯을 받습니다. 반도의 혁명은 이미 시작되었고, 모자란 것은 무기뿐입니다. 피레네의 고개로 탄약 행렬이 먼저 올라갑니다."
 LR_RED_plan_italy:0 "알프스 계획"
 LR_RED_plan_italy_desc:0 "토리노의 자동차 공장과 밀라노의 방직 공장은 반도에서 가장 붉은 곳입니다. 그 노동자들 위에는 왕이 다섯이고, 그 왕들 위에는 빈이 있습니다. 왕관이 몇 개든 혁명에게는 국경 하나일 뿐입니다. 몽스니 고개의 눈이 녹으면 혁명군이 내려갑니다."
 LR_RED_plan_north:0 "북해 계획"
 LR_RED_plan_north_desc:0 "스톡홀름의 사회민주당은 왕 아래서 표를 모아 왔습니다. 핀란드의 노동자들은 독립과 함께 찾아온 내전에서 졌습니다. 북쪽의 동지들은 기다리는 데 익숙합니다. 혁명의 함대가 외레순 해협을 지나 그 기다림을 끝내러 갑니다."
 LR_RED_plan_east:0 "동유럽 계획"
 LR_RED_plan_east_desc:0 "바르샤바와 우치의 방직 공장, 리가의 항구에서 일하는 노동자들은 대전쟁 뒤 왕을 하나씩 얻었습니다. 아무도 그 왕을 원하지 않았습니다. 페테르부르크의 혁명은 국경에서 멈췄습니다. 혁명군이 그 국경 너머의 문을 엽니다."
 LR_RED_plan_balkans:0 "발칸 계획"
 LR_RED_plan_balkans_desc:0 "트란실바니아의 광부와 피레우스의 부두 노동자, 소피아의 담배 공장 여공들은 서로 다른 말을 씁니다. 그러나 그들의 왕은 모두 같은 은행에서 돈을 빌립니다. 발칸의 민족 전쟁은 왕들의 전쟁이었습니다. 혁명군은 그 전쟁을 계급의 전쟁으로 바꾸러 갑니다."
 LR_RED_plan_turkey:0 "동방 원정"
 LR_RED_plan_turkey_desc:0 "모술과 키르쿠크의 유전에서 퍼 올린 석유는 런던과 이스탄불의 은행으로 흘러갑니다. 그 땅에서 일하는 사람들에게 남는 것은 기름 냄새뿐입니다. 혁명은 석유보다 빨리 번집니다. 혁명군이 다르다넬스와 레반트의 해안을 함께 노립니다."
 LR_ORL_epilogue:0 "복수의 끝"
 LR_ORL_epilogue_desc:0 "1918년에 멈춘 시계가 마침내 다시 돌았습니다. 베를린, 빈, 런던의 항복 문서가 파리에 있습니다. 콩피에뉴 숲의 박물관 경비원 하나가 그 객차 문을 열어 두라는 명령을 받습니다."
 LR_BOU_epilogue:0 "백합의 세기"
 LR_BOU_epilogue_desc:0 "프로이센과 합스부르크와 영국이 무너졌습니다. 부르봉의 백합이 다시 유럽 위에 핍니다. 랭스 대성당에서 열두 살 성가대원 하나가 석 달 동안 연습한 대관식 성가를 부를 준비를 합니다."
 LR_COM_epilogue:0 "인터내셔널의 봄"
 LR_COM_epilogue_desc:0 "왕들의 유럽이 무너졌습니다. 1871년 72일 만에 끝난 꿈이 이번에는 대륙을 덮었습니다. 5월 1일 밤, 파리 시청 광장에서 열여섯 살 견습 선반공 하나가 횃불을 들고 서 있습니다."
 LR_ANA_epilogue:0 "국가 없는 대륙"
 LR_ANA_epilogue_desc:0 "왕도 신도 주인도 없는 유럽이 3년을 버텼습니다. 아무도 가능하다고 믿지 않았던 일입니다. 벨빌 민중 회관에서 연합 서기 하나가 마지막 업무를 하고 있습니다. 대회가 서기국 자체를 없애기로 했습니다."
 LR_JAC_epilogue:0 "공화국의 세기"
 LR_JAC_epilogue_desc:0 "1792년에 시작된 일이 마침내 끝났습니다. 왕들의 유럽 한가운데 공화국들이 섰습니다. 팔레 부르봉의 수위 하나가 자정 무렵 의사당 복도의 불을 끄러 다닙니다."
 LR_GIR_epilogue:0 "상인들의 대륙"
 LR_GIR_epilogue_desc:0 "칼이 아니라 계산서로 묶인 유럽이 섰습니다. 보르도의 가론강 부두에서 상공회의소의 승전 연회가 열립니다. 연회장 웨이터 하나가 발코니에서 잠깐 담배를 피우며 강 위의 배들을 셉니다."
 LR_MAR_epilogue:0 "1791년의 완성"
 LR_MAR_epilogue_desc:0 "헌법 아래의 왕과 명사들의 의회가 유럽의 질서가 되었습니다. 1791년에 찢어졌던 헌법이 마침내 지켜졌습니다. 서명식 다음 날 아침, 튈르리 궁 정원사 하나가 장미 덤불 사이로 왕과 총리가 걸어오는 것을 봅니다."
 LR_NAP_epilogue:0 "황제의 유럽"
 LR_NAP_epilogue_desc:0 "코르시카의 포병 장교가 샤를마뉴 이후 누구도 이루지 못한 일을 이루었습니다. 튈르리 궁 황태자의 침실 앞에서 시종 하나가 밤 열한 시에 졸다가 황제가 들어오는 소리에 일어납니다."
 LR_GUA_epilogue:0 "왕관 없는 승리"
 LR_GUA_epilogue_desc:0 "왕관을 거절한 장군이 유럽을 이겼습니다. 이제 그가 지킬 마지막 약속이 남았습니다. 리옹역의 역무원 하나가 아침 일곱 시에 마르세유행 첫 열차 개찰을 시작합니다."
 LR_RED_epilogue:0 "붉은 대육군의 유럽"
 LR_RED_epilogue_desc:0 "인민의 통령이 이끈 붉은 대육군이 대륙을 지나갔습니다. 그 뒤에 남은 것이 해방인지 제국인지는 아직 아무도 모릅니다. 베를린 왕궁, 프리드리히 대왕의 옛 서재에 새벽 두 시까지 불이 켜져 있습니다."
 LR_PET_epilogue:0 "원수의 마지막 겨울"
 LR_PET_epilogue_desc:0 "여든을 넘긴 원수가 승리를 보았습니다. 비시의 파르크 호텔 3층, 원수는 무릎에 담요를 덮고 창가에 앉아 공원의 눈을 봅니다. 부관이 아침 일정표를 들고 다가갑니다."
 LR_MAR_entente_epilogue:0 "신사들의 평화"
 LR_MAR_entente_epilogue_desc:0 "프랑스는 복수 대신 승전국들의 탁자에 의자 하나를 골랐습니다. 동방 원정이 끝났고 러시아 공화국은 물러났습니다. 런던이 승전 만찬에 프랑스 대표를 부릅니다."
 LR_BOU_revolution_epilogue:0 "두 왕관의 유럽"
 LR_BOU_revolution_epilogue_desc:0 "부르봉과 합스부르크가 나란히 서서 프로이센과 영국을 꺾었습니다. 1756년 이래 두 번째 외교 혁명이 유럽의 지도를 바꾸었습니다. 빈의 슈테판 대성당에서 두 왕관을 위한 승전 감사 미사가 열립니다."
 LR_ORL_algeria_departments:0 "알제리 데파르트망"
 LR_ORL_algeria_departments_desc:0 "알제는 식민지가 아니라 프랑스의 데파르트망입니다. 지중해 건너의 세 데파르트망을 본토와 똑같은 프랑스의 땅으로 선포합니다."
