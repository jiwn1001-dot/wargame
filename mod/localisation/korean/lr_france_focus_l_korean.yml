 LR_COM_plan_balkans_desc:0 "유럽의 화약고. 소피아와 베오그라드, 아테네와 부쿠레슈티는 스무 해 동안 서로의 국경을 고쳐 그리느라 뒤를 보지 않았습니다. 발칸의 왕들은 언제나 다음 전쟁의 동맹을 찾아 왔습니다. 이제 그 답이 프랑스입니다."
