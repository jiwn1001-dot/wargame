 LR_NAP_found_bloc:0 "대홍수 창설"
 LR_NAP_found_bloc_desc:0 "황제는 동맹을 청하지 않습니다. 제국의 곁에 설 나라와 제국에 맞설 나라가 있을 뿐입니다. 대홍수라는 이름의 동맹이 세워지고, 황제의 독수리 아래 설 나라들이 하나씩 불려 옵니다."
 LR_NAP_ottoman_contact:0 "이스탄불의 대사관"
 LR_NAP_ottoman_contact_desc:0 "승전국의 질서 안에서 오스만은 늘 런던과 빈 다음의 셋째 자리였습니다. 이스탄불의 대신들은 그 자리를 오래 참아 왔습니다. 프랑스 대사관이 무역 협정과 차관을 들고 술탄의 궁전을 찾습니다."
