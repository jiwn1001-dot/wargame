 lr_dipl.1.t:0 "프랑스의 동맹 제안"
 lr_dipl.1.d:0 "파리에서 온 특사가 왕궁 응접실에서 봉인된 서한을 내민다. 프랑스가 우리에게 동맹을 제안한다.\n\n대전쟁에서 진 나라와 손을 잡는 것은 위험한 도박이다. 승전국들은 이 조약을 도전으로 받아들일 것이고, 프랑스의 다음 전쟁은 우리의 전쟁이 된다. 그러나 프랑스는 다시 일어서고 있고, 그 곁에 서는 나라는 다음 유럽의 지도를 함께 그리게 될 것이다.\n\n외무장관이 서한을 국왕 앞에 내려놓는다."
 lr_dipl.1.a:0 "동맹을 받아들인다. 파리의 친구가 되는 편이 낫다."
 lr_dipl.1.b:0 "정중히 거절한다. 패전국과 운명을 함께할 수는 없다."
 lr_dipl.2.t:0 "동맹 체결"
 lr_dipl.2.d:0 "특사가 서명된 조약문을 들고 돌아왔다. 상대가 우리의 제안을 받아들였다.\n\n외무부 복도에서 샴페인 코르크가 터지는 동안, 전신실에서는 벌써 런던과 빈에서 온 항의 전보가 쌓이기 시작한다. 강화 조약을 위반하는 동맹이라고.\n\n외무장관은 전보 더미를 흘끗 보고 서랍에 넣는다. \"답장은 다음 주에 하지.\""
 lr_dipl.2.a:0 "새 동맹국에 축배를."
 lr_dipl.3.t:0 "동맹 거절"
 lr_dipl.3.d:0 "특사가 빈손으로 돌아왔다. 상대는 정중하게, 그러나 분명하게 거절했다.\n\n\"귀국의 우정에는 감사하나, 지금은 때가 아닙니다.\"\n\n외교관들은 그 말의 뜻을 안다. 승전국들을 적으로 돌리기에는 프랑스가 아직 충분히 강해 보이지 않는다는 것이다. 외무장관은 거절 서한을 서류철에 끼우며 날짜를 적어 둔다. 언젠가 다시 꺼내 보게 될 날짜다."
 lr_dipl.3.a:0 "언젠가 후회하게 될 것이다."
