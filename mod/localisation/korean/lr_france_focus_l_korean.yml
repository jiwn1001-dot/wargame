 LR_PET_found_bloc_desc:0 "라틴의 왕관들은 런던과 빈의 질서 아래서 늘 둘째였습니다. 마드리드와 나폴리와 로마는 같은 신앙과 같은 뿌리에서 나왔습니다. 파리가 프랑코포니를 세우고 라틴 유럽의 왕들을 부릅니다."
