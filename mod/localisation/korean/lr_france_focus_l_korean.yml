 lr_dipl.1.t:0 "프랑스의 동맹 제안"
 lr_dipl.1.d:0 "외무부 의전과장은 응접실 문을 닫고 봉인된 서한을 외무장관 앞에 내려놓았다. 파리에서 온 특사가 직접 들고 온 것이었다. 봉랍에는 프랑스 외무부의 문장이 찍혀 있었다. 프랑스가 우리에게 동맹을 제안했다.\n\n장관은 서한을 두 번 읽었다. 대전쟁에서 진 나라와 손잡는 것은 도박이었다. 런던과 빈은 이 조약을 도전으로 받아들일 것이다. 프랑스의 다음 전쟁이 곧 우리의 전쟁이 된다. 그러나 프랑스는 다시 일어서고 있었다. 그 곁에 선 나라는 다음 유럽 지도를 함께 그리게 될 것이다.\n\n특사는 대기실에서 커피를 세 잔째 마시고 있었다. 의전과장이 보기에 그는 거절당할 각오를 하고 온 사람처럼 느긋했다. 그게 오히려 신경 쓰였다.\n\n장관은 서한을 들고 국왕의 집무실로 갔다. 국왕은 서한을 받아 들고 첫 줄만 읽은 뒤 장관을 보았다. \"자네 생각은 어떤가.\" 장관은 이미 답을 정해 두었다. 다만 그 답을 먼저 말하고 싶지는 않았다."
 lr_dipl.1.a:0 "받아들이지. 파리의 적보다는 파리의 친구가 낫다."
 lr_dipl.1.b:0 "정중히 돌려보내. 패전국과 운명을 같이할 수는 없다."
 lr_dipl.2.t:0 "동맹 체결"
 lr_dipl.2.d:0 "프랑스 외무부 전신실의 마리 루셀은 특사가 돌아오는 날 아침부터 바빴다. 상대국이 동맹을 받아들였다는 첫 전보는 새벽에 왔다. 외무부 복도에서 샴페인 코르크가 터졌고, 국장들이 서로 등을 두드렸다.\n\n점심 무렵부터 전신기가 쉬지 않았다. 런던에서 하나, 빈에서 둘, 베를린에서 하나. 모두 같은 말이었다. 1918년의 질서에 대한 도전이라고. 루셀은 전보를 받아 적는 대로 서류철에 꽂았다. 오후 네 시가 되자 서류철이 손가락 두 마디 두께가 되었다.\n\n다섯 시에 외무장관이 직접 전신실에 내려왔다. 장관은 서류철을 받아 들고 맨 위의 런던 전보만 읽었다. 그러고는 나머지를 넘겨 보지도 않고 서랍에 넣었다.\n\n\"답장은 다음 주에 하지.\" 장관이 말했다. 루셀은 서랍이 닫히는 소리를 들으며, 대전쟁이 끝난 뒤로 이 방에서 그런 말을 한 장관은 처음이라고 생각했다."
 lr_dipl.2.a:0 "새 동맹국에 축배를."
 lr_dipl.3.t:0 "동맹 거절"
 lr_dipl.3.d:0 "특사 장 다르투아는 빈손으로 돌아오는 기차에서 거절 서한을 다시 읽었다. 상대는 정중했다. 그리고 분명했다. \"귀국의 우정에는 감사하나, 지금은 때가 아닙니다.\"\n\n다르투아는 외교관 생활 스물두 해 동안 그 문장을 열 번쯤 받아 보았다. 뜻은 늘 같았다. 프랑스가 아직 충분히 강해 보이지 않는다는 것이다. 승전국들을 적으로 돌릴 만큼은.\n\n파리에 내리자 외무장관이 직접 플랫폼에 나와 있었다. 장관은 서한을 받아 읽고 아무 말 없이 서류철에 끼웠다. 그리고 겉장에 오늘 날짜를 적었다. 다르투아가 그 날짜를 왜 적는지 물었다.\n\n\"언젠가 그쪽에서 다시 이 서류철을 열어 달라고 할 걸세. 그때 이 날짜를 보여 주려고.\" 장관은 서류철을 겨드랑이에 끼고 먼저 걸어갔다."
 lr_dipl.3.a:0 "날짜는 적어 뒀다."
