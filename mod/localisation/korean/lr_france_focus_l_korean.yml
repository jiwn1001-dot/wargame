 LR_dec_war_GEX:0 "망명정부 토벌"
 LR_dec_war_GEX_desc:0 "베를린을 잃은 북독일의 황태자가 두알라에 망명정부를 세웠습니다. 카메룬과 인도차이나와 태평양의 섬들이 아직 그의 깃발 아래 있습니다. §Y독일 망명정부§!에 선전포고합니다. 항복하면 그 땅은 모두 프랑스의 것이 됩니다."
 LR_FRA_settlement_category:0 "영토 결단"
 LR_FRA_settlement_category_desc:0 "평화 회의에서 얻은 땅의 운명을 주마다 정합니다. 지도에서 프랑스가 가진 주를 고르면 그 주에 맞는 선택지가 나옵니다. 영유권이 있으면 합병하고, 그 땅에 핵심주나 영유권이 있는 나라에 넘기거나, 사라진 나라를 되살립니다."
 LR_dec_settle_annex:0 "합병"
 LR_dec_settle_annex_desc:0 "이 주를 프랑스의 땅으로 삼습니다. 지금의 정부가 영유권을 주장한 주에만 쓸 수 있습니다."
