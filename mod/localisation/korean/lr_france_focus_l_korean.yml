 LR_ORL_invite_crl:0 "카를로스파 스페인 초대"
 LR_ORL_invite_crl_desc:0 "카를로스파는 신과 조국과 왕을 외치며 스페인 내전을 이겼습니다. 마드리드의 새 주인은 아직 유럽에 친구가 없고, 런던은 그들을 반역자의 후계자로 봅니다. 피레네 너머로 사절을 보내 동맹을 청합니다."
 LR_ORL_invite_spr:0 "스페인 왕국 초대"
 LR_ORL_invite_spr_desc:0 "마드리드의 왕은 내전을 버텨 냈지만 잃은 것이 많습니다. 아메리카의 왕국들은 이름만 남은 봉신이고, 지브롤터에는 영국 포대가 있습니다. 피레네의 양쪽이 같은 깃발 아래 서자고 제안합니다."
 LR_ORL_invite_tts:0 "양시칠리아 초대"
 LR_ORL_invite_tts_desc:0 "나폴리의 왕은 이탈리아 통일을 꿈꾸지만 빈의 눈치를 봅니다. 대전쟁 뒤 오스트리아가 반도 전체를 지켜보고 있기 때문입니다. 지중해의 남쪽 문을 함께 지키자고 나폴리에 사절을 보냅니다."
 LR_ORL_invite_pap:0 "교황령 초대"
 LR_ORL_invite_pap_desc:0 "교황령은 군대가 거의 없지만, 성하의 축복이 있는 동맹은 유럽의 모든 성당에서 들립니다. 로마는 빈의 보호를 받아 왔지만 그 보호가 늘 달갑지만은 않았습니다. 바티칸에 사절을 보냅니다."
 LR_ORL_ottoman_contact:0 "이스탄불의 대사관"
 LR_ORL_ottoman_contact_desc:0 "승전국의 질서 안에서 오스만은 늘 런던과 빈 다음의 셋째 자리였습니다. 이스탄불의 대신들은 그 자리를 오래 참아 왔습니다. 프랑스 대사관이 무역 협정과 차관을 들고 술탄의 궁전을 찾습니다."
 LR_ORL_ottoman_win:0 "오스만 포섭"
 LR_ORL_ottoman_win_desc:0 "차관은 들어갔고 술탄의 대신들은 답을 미루고 있습니다. 영국 진영을 떠나는 것은 오스만에게도 도박입니다. 프랑스가 오스만의 국경을 보장하는 조건으로 술탄에게 승전국의 동맹을 버리라고 청합니다."
 LR_ORL_invite_balkans:0 "발칸 동맹 초대"
 LR_ORL_invite_balkans_desc:0 "베오그라드, 아테네, 부쿠레슈티는 대전쟁 때 프랑스와 함께 싸웠고 함께 졌습니다. 그 세 나라가 이번에는 불가리아를 꺾었습니다. 옛 전우들에게 다시 같은 편에 서자고 청합니다."
