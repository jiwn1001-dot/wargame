 lr_novel.101.d:0 "1936년 1월 19일, 알제 총독부 지하 전신실. 쥘리앵 바레는 열흘째 집에 가지 못했다.\n\n처음 전보는 부두 노동자 파업이었다. 석 달 밀린 임금 때문이라고 했다. 이튿날 전보에는 사망자 열한 명이 적혀 있었다. 누가 먼저 쐈는지는 적혀 있지 않았다. 사흘째부터는 지명이 늘었다. 카스바, 콩스탕틴, 오랑, 남부 사막의 이름도 모르는 초소들. 바레는 지명을 칠 때마다 손가락이 굳는 걸 느꼈다.\n\n총독부가 파리로 보내는 전보의 문장은 매일 조금씩 길어졌다. 질서 회복 중. 질서 회복을 위해 병력 필요. 질서 회복을 위해 본국의 결단 필요. 바레는 그 변화를 누구보다 먼저 알았다. 그가 쳤기 때문이다.\n\n오늘 오후 네 시, 전신기가 다시 울렸다. 콩스탕틴 방면이었다.\n\n\"진압차 파견한 알제리 소총병 제3연대, 발포 거부. 장교 둘 사살. 연대 전체 반란군 합류. 연대기를 앞세우고 알제로 행진 중.\"\n\n바레는 종이를 뜯어 들고 계단을 뛰어 올라갔다. 총독은 집무실 창가에 서 있었다. 전보를 받아 읽고도 아무 말을 하지 않았다. 바레도 창밖을 보았다. 시청 발코니에 처음 보는 사람들이 서 있었고, 그중 하나가 확성기로 무언가 읽고 있었다. 독립 선언문이었다. 프랑스어였다. 바레가 학교에서 배운 것보다 문법이 정확했다."
 lr_novel.102.d:0 "같은 날 밤, 튈르리 궁. 내무장관 에티엔 뒤프레는 회의 탁자 끝자리에서 자기 차례를 기다리고 있었다.\n\n참모총장 베강 장군은 벌써 이십 분째 말하는 중이었다. 2개 사단과 전함 두 척, 석 달이면 끝난다고 했다. 왕은 지도에서 눈을 떼지 않은 채 끝까지 듣고 나서 물었다. \"장군, 1914년 8월에도 크리스마스면 끝난다고 하지 않았소?\" 베강의 얼굴이 붉어졌다. 재무장관이 헛기침을 했다. 금고에는 석 달 치 전비가 없었고, 런던의 은행들은 지난주에 이자를 두 배로 불렀다.\n\n그 뒤로는 고함이었다. 뒤프레는 이런 왕실 회의를 본 적이 없었다. 누가 탁자를 쳤고, 누가 의자를 밀었다. 왕은 조용히 있었다.\n\n고함이 잦아들자 뒤프레는 서류 한 장을 꺼냈다. 생드니 경찰서장의 보고였다. 파리 금속 노조가 알제리 동지들을 위한 모금을 시작했고, 이틀 만에 4만 프랑이 걷혔다. 공장 담벼락마다 같은 글귀가 붙었다고 했다. 알제의 형제들이 쓰러지면 다음은 우리다.\n\n뒤프레가 보고서를 다 읽었을 때 방은 조용했다. 탁자 맞은편에서 오를레앙 공 장이 일어나 모자를 집어 들었다. 그는 왕에게 고개만 까딱하고 나갔다. 아무도 어디 가느냐고 묻지 않았다. 뒤프레는 그게 마음에 걸렸다."
 lr_novel.201.d:0 "루이 마르샹 대위는 그날 참모본부 당직이었다. 오후 세 시, 왕의 서명이 찍힌 전보가 들어왔다. 알제리에서 모든 병력을 철수한다. 철수는 질서 있게, 명예롭게 한다. 두 줄이었다.\n\n마르샹은 전보를 들고 작전국 회의실로 갔다. 그가 읽는 동안 아무도 말하지 않았다. 다 읽자 누군가 잔을 벽에 던졌다. 베르됭에서 왼팔을 잃은 늙은 소장 하나가 손을 내밀었다. 마르샹이 전보를 건네자 소장은 끝까지 읽고, 네 번 접어서 난로에 넣었다. \"적에게 진 건 운이야. 싸우지도 않고 내준 건 다른 거고.\" 소장은 그 말을 하고 다시 자리에 앉았다.\n\n일주일 뒤 마르샹은 철수 병력을 맞으러 마르세유에 갔다. 부두에 군악대는 없었다. 내무부가 환영 행사를 금지했다. 병사들은 군장을 메고 말없이 내렸고, 그 뒤로 정착민들이 가방을 하나씩 들고 내렸다. 프랑스 편에 섰던 알제리인 보조병들도 있었다. 이제 돌아갈 곳이 없는 사람들이었다. 누가 부두 벽에 분필로 썼다. 왕이 우리를 팔았다. 헌병이 지우러 갔다가 사람들 표정을 보고 그냥 돌아왔다.\n\n사흘 뒤 마르샹은 샬롱 병영 연병장에 서 있었다. 새벽 안개 속으로 말 한 마리가 들어왔다. 오를레앙 공이었다. 공은 연병장 한가운데에서 말을 세우고 연대들을 둘러보았다. 연설은 짧았다.\n\n\"왕은 너희 전우를 묻은 땅을 팔았다. 나는 그 땅을 찾으러 간다. 그리고 거기서 멈추지 않는다. 1918년에 잃은 걸 전부, 라인강까지. 같이 갈 사람은 남아라.\"\n\n아무도 대열을 떠나지 않았다. 마르샹은 오른쪽 어딘가에서 군화 뒤꿈치 부딪치는 소리를 들었다. 하나, 그리고 또 하나."
 lr_novel.301.d:0 "가스통 비네 대령은 파리 수비대 부사령관이었고, 알제리에서 2년을 복무했다. 수비대 장교의 절반이 그랬다. 사령관 드 페랭 장군은 아니었다. 장군은 왕이 어릴 때부터 알던 사람이었다. 왕의 장남이 세례를 받을 때 대부를 섰다.\n\n그날 오후 노트르담 광장에서 대주교가 수비대를 위한 미사를 올렸다. 하느님께서 기름 부으신 왕을 거스르는 자는 하느님을 거스르는 것이라고 했다. 비네는 모자를 벗고 고개를 숙였다. 뒷줄에서 하사 하나가 옆 사람에게 속삭이는 소리가 들렸다. \"하느님은 알제에도 계셨나.\" 옆 사람은 대답 대신 성호를 그었다.\n\n저녁에 비네는 장교 식당 뒷문으로 들어갔다. 구석 자리에 코트 깃을 세운 남자가 앉아 있었다. 오를레앙 공의 사절이었다. 남자는 포도주를 두 잔 시키고 탁자 위에 봉투 세 개를 올려놓았다.\n\n\"하나는 소장 진급 약속이오. 하나는 공께서 친필로 쓰신 맹세고. 마지막 건 금화요.\"\n\n비네는 봉투를 건드리지 않았다. \"왕이 이기면 나는 이 봉투 때문에 총살당하겠지.\"\n\n\"그렇소. 공께서 이기시면 이 봉투를 안 받은 사람들이 총살당하고.\"\n\n남자는 잔을 비우고 일어났다. 봉투는 그대로 두고 갔다. 비네는 한참 앉아 있다가, 세 개를 모두 안주머니에 넣었다. 열어 보지는 않았다."
 lr_novel.401.d:0 "근위대 중위 장 뤼크 봉스는 새벽 다섯 시부터 튈르리 궁 철문 안쪽에 서 있었다. 철문 밖 서른 걸음 거리에 샬롱의 연대들이 늘어서 있었다. 포도탄 한 발도 안 되는 거리였다.\n\n건너편 맨 앞줄의 중사 얼굴이 낯익었다. 한참 보다가 생각났다. 베르됭, 같은 중대. 1917년 겨울에 같은 참호에서 담요를 나눠 덮었던 사람이었다. 중사도 봉스를 알아본 것 같았다. 둘은 서로 고개를 까딱했다. 뒤에서 대위가 대열 정비라고 소리쳤다.\n\n아홉 시에 오를레앙 공이 말을 타고 철문 앞으로 나왔다. 칼은 뽑지 않았다. \"폐하, 문을 여십시오. 저는 폐하의 목숨을 원하지 않습니다.\" 궁전 발코니에 왕이 나왔다. 군복을 입고 칼을 차고 있었다. 대전쟁 이후 처음이라고 했다. 봉스는 왕의 손이 난간을 꽉 쥐고 있는 걸 보았다. \"장, 너는 늘 기다릴 줄 알았지. 오늘은 짐이 기다리겠다.\" 그 뒤로 아무도 움직이지 않았다.\n\n정오가 됐다. 봉스는 담배가 피우고 싶었다. 대위가 다른 쪽을 보고 있었다. 그는 철문 쪽으로 걸어 나갔다. 대위가 뭐라고 고함쳤지만 돌아보지 않았다. 철문 사이로 중사가 담뱃갑을 내밀었다. 둘은 한 개비를 나눠 피웠다. 중사가 물었다. \"너희는 쏠 거냐?\" 봉스는 모른다고 했다. 정말 몰랐다.\n\n오후 두 시, 궁 시계탑에서 누가 먼저 쐈다. 누군지는 끝내 밝혀지지 않았다. 봉스는 땅에 엎드렸다. 철문의 쇠창살이 튀었고 비둘기가 한꺼번에 날아올랐다. 십오 분 동안 사방에서 총소리가 났다. 그리고 멈췄다."
 lr_novel.501.d:0 "임시 정부 수반 앙투안 세르방은 총선 사흘째 밤을 팔레 부르봉 복도에서 보내고 있었다. 의회파가 이겼다. 그런데 이긴 사람들이 셋이었고, 셋 다 혼자서는 과반이 안 됐다.\n\n산악파 회의실에서 레옹 블룸은 안경을 닦으며 같은 말을 세 번째 했다. 주 40시간, 유급 휴가, 철도와 은행 국유화. 회의실 뒤편의 노조 대표가 팔짱을 끼고 말했다. \"약속은 좋소. 이번엔 공장 사람들이 신문 말고 월급봉투로 확인할 거요.\" 블룸은 안경을 다시 썼다.\n\n옆방 지롱드파는 보르도 포도주 상인과 리옹 비단 공장주들의 돈으로 당선된 사람들이었다. 그들은 관세와 허가증과 특허를 걷어 내면 프랑스가 알아서 일어선다고 했다. 한 의원이 덧붙였다. \"그리고 이번에는 단두대 없이 부탁하오.\" 몇몇이 웃었다. 세르방은 웃지 않았다. 백오십 년 전 지롱드라는 이름을 달았던 사람들은 대부분 그 칼날 아래에서 죽었다.\n\n가장 조용한 방은 푀양파였다. 벽에 라파예트의 흰 깃털이 든 액자가 걸려 있었다. 늙은 의원 하나가 세르방에게 차를 따라 주며 말했다. 왕은 쫓아냈지만 왕관까지 버릴 필요가 있느냐고. 1791년 헌법이 지켜졌다면 이 모든 피는 흐르지 않았을 거라고. 영국을 보라고 했다. 세르방은 영국이 지금 프랑스의 적이라는 말은 하지 않았다.\n\n새벽 네 시, 세르방은 복도 끝 의자에 앉았다. 누가 식은 커피를 갖다 주었다. 산악파는 지롱드와 같이 못 한다고 했다. 지롱드는 푀양파의 표는 원하지만 이름은 원하지 않았다. 푀양파는 누구와 손을 잡든 왕관 얘기를 빼지 않겠다고 했다. 창밖으로 콩코르드 광장이 밝아 오고 있었다."
 lr_novel.601.d:0 "의회가 알제리 재수복안을 통과시켰다. 왕정을 무너뜨린 바로 그 전쟁을 공화국이 다시 시작한다는 비난이 쏟아졌고, 산악파 의원 하나는 연단에서 의사봉을 부러뜨렸다. 그래도 표는 충분했다.\n\n밤 열한 시, 총리는 넥타이를 풀고 전쟁부가 보낸 서류철을 열었다. 내일 아침까지 원정군 사령관 이름 하나를 의회에 넘겨야 했다.\n\n첫 장은 모리스 가믈랭 장군이었다. 공화국에 충성을 맹세한 첫 번째 장군이었다. 혁명 때 근위대를 병영에 묶어 두어 피를 막았다. 서류 정리가 완벽했고, 위원회에서 한 번도 언성을 높인 적이 없었다. 총리는 경력란을 다시 읽었다. 이긴 전쟁이 없었다. 진 전쟁도 없었다. 그냥 아무것도 없었다.\n\n둘째 장은 필리프 페탱 원수였다. 베르됭의 페탱. 무너지던 전선을 붙들었고, 반란을 일으킨 병사들을 총살 대신 휴가로 달랬다. 그의 이름이면 징집 사무소 앞에 줄이 선다. 나이는 여든이었다. 전쟁부 장관이 여백에 연필로 적어 두었다. 공화국이라는 단어를 말할 때마다 잠깐씩 멈춤.\n\n셋째 장은 샤를 드골 대령이었다. 기갑 부대에 관한 책을 썼는데 아무도 읽지 않았고, 그 때문에 참모본부 절반과 싸웠다. 키가 너무 크고 입이 너무 험했다. 장관의 메모는 이랬다. 틀림없이 이길 것이고, 틀림없이 우리 모두를 미치게 할 것.\n\n명단은 그 뒤로도 이어졌다. 장군, 또 장군, 모르는 이름, 또 장군. 새벽 한 시, 총리는 눈을 비비며 서류를 덮었다. 맨 마지막 장은 넘겨 보지도 않았다."
 lr_novel.701.d:0 "대관식 날 아침, 뮈라 원수는 노트르담 제단 옆 대기실 앞에서 시계를 두 번 봤다. 아홉 시 사십 분. 대주교는 벌써 제의를 입고 기다리는 중이었다. 성당 안에는 붉은 비단이 걸렸고, 교황 사절은 어느 문으로 들어갈지 어제 예행연습까지 마쳤다. 금세공사는 왕관 값을 지난주에 받아 갔다.\n\n뮈라는 알제부터 그를 따라온 사람이었다. 공작 작위 얘기는 아무도 대놓고 하지 않았지만 다들 알았다. 오늘이 지나면 다 정해진다.\n\n뮈라는 대기실 문을 두드렸다. 대답이 없었다. 한 번 더 두드리고 문을 열었다. 대관식 예복이 의자 위에 개켜진 채 그대로 있었다. 탁자에는 빈 커피잔 하나와 몇 번이고 줄을 그어 지운 종이 한 장. 창문이 열려 있었다.\n\n광장 쪽에서 웅성거리는 소리가 났다. 뮈라는 창가로 갔다. 군중이 한쪽으로 갈라지고 있었다. 그 사이로 검은 연미복을 입은 남자가 걸어오고 있었다. 마차도 호위대도 없었다. 옷이 몸에 맞지 않았다. 어디선가 웃음소리가 났다.\n\n남자는 성당 앞 연단에 올라 군중을 한참 내려다보았다. 원고는 없었다. \"프랑스에는 황제가 필요 없습니다.\" 웃음소리가 멈췄다. \"백오십 년 전 이 광장에서 사람들은 왕 대신 시민이 되겠다고 했습니다. 그들은 졌습니다. 여러분은 오늘 저를 왕으로 만들어서 그 패배를 한 번 더 하려고 합니다. 저는 황제가 되지 않겠습니다. 여러분이 뽑는 대통령이 되겠습니다. 안 뽑아 주시면, 그것도 좋습니다.\"\n\n뮈라 옆에 서 있던 다른 원수가 들고 있던 지휘봉을 떨어뜨렸다. 대리석 바닥에 부딪히는 소리가 꽤 크게 났다."
 lr_novel.801.d:0 "자크 모렐은 벨빌의 인쇄공이었다. 그날 아침에는 일이 없어서 동역에 나갔다. 알제에서 열차가 들어온다고 했다.\n\n이번 열차에는 병사가 아니라 관이 실려 있었다. 모렐은 플랫폼 끝에서 관을 셌다. 백열네 개. 여자들이 하나씩 앞으로 나와 관에 붙은 이름표를 확인했다. 헌병들이 줄을 세우려 했지만 아무도 줄을 서지 않았다. 어디선가 비명이 터졌고, 멈추지 않았다.\n\n저녁에 모렐은 르 프롤레테르 카페에 앉아 있었다. 누가 신문을 펼쳤다. 동역에 전사자 스무 명이 도착했다는 기사였다. 옆자리 노인이 탁자를 쳤다. \"내 아들은 왕의 알제리를 지키다 죽었소. 그럼 왕은 뭘 지키고 있소?\" 누군가 대답했다. \"세금이지. 빵값 올려서 걷은 세금.\"\n\n모렐은 연설을 할 줄 몰랐다. 그래도 탁자 위로 올라갔다. 신문에 적힌 스물, 그리고 오늘 자기가 직접 센 백열넷. 그 두 숫자를 번갈아 외쳤다. 그것뿐이었다.\n\n한 시간 뒤 카페에 있던 사람들은 다 거리에 있었다. 자정에는 벨빌 전체가, 새벽에는 메닐몽탕과 생드니가 나왔다. 아침 여섯 시에 르노 공장 사이렌이 울렸지만 공장 문으로 들어간 사람은 없었다. 정오에 지하철이 멈췄고, 오후에는 빵집 절반이 셔터를 내렸다. 그날 저녁 누가 생탕투안 거리에 승합마차를 뒤집어 놓았다. 모렐은 거기 의자를 하나 보탰다."
 lr_novel.802.d:0 "폴 지로 일병은 튈르리에서 보낸 기병 연대에 있었다. 사흘째 되는 날, 연대는 생탕투안 거리 바리케이드 앞에 섰다.\n\n연대장이 칼을 뽑고 사격 준비를 명령했다. 소총 백 자루가 올라갔다. 지로도 올렸다. 바리케이드 위의 사람들은 피하지 않았다. 지로는 조준선 너머로 사람들 얼굴을 보았다. 그리고 셋째 줄에서 어머니를 보았다. 장바구니를 든 채였다.\n\n지로는 총을 내렸다. 생각하고 한 일이 아니었다. 옆의 르블랑이 그를 쳐다보더니 자기 총도 내렸다. 그 옆도, 그 옆도. 연대장은 칼을 든 채 혼자 남았다. 한참 서 있다가 칼을 칼집에 넣고 말머리를 돌렸다. 아무도 그를 쏘지 않았다.\n\n소문은 한 시간 만에 파리를 돌았다. 뱅센 포병대가 포문을 닫았다. 시테섬 헌병대는 문을 걸어 잠갔다. 해군성 지붕에 누가 붉은 천을 걸었는데 해병대는 내리지 않았다. 저녁에는 바리케이드 위에 파랑, 하양, 빨강 깃발이 올라갔다. 백오십 년 동안 금지된 깃발이었다. 지로는 그 깃발을 처음 봤다. 노인들이 울고 있었다.\n\n그날 자정, 튈르리 궁 뒷문으로 마차 한 대가 빠져나갔다는 얘기를 지로는 다음 날 아침에 들었다. 왕관은 탁자 위에 두고 갔다고 했다. 아무도 막지 않았다."
 lr_novel.1001.d:0 "앵발리드 참모본부 지하 회의실. 당번병 조르주 플뢰리는 밤새 커피를 날랐다. 탁자 위에는 지방 도지사들이 보낸 전보가 수북했다. 방데에서 경찰서가 불탔다. 리옹에서는 노동자들이 시청을 점거했다. 북부 탄광은 석 달째 멈춰 있었다.\n\n새벽 네 시, 장군 하나가 전보 더미를 손바닥으로 내리쳤다. \"이 정부로는 겨울 못 넘깁니다.\" 아무도 반박하지 않았다. 플뢰리는 빈 잔을 치우면서 장군들 얼굴을 보았다. 다들 같은 사람을 생각하고 있었다. 이름은 아무도 꺼내지 않았다.\n\n다섯 시에 플뢰리는 차를 타고 파리 서쪽의 작은 저택에 갔다. 대령 둘과 함께였다. 현관 불이 이미 켜져 있었다. 여든 살 노인이 군복 단추를 채우고 계단 위에 서 있었다. 필리프 페탱 원수였다.\n\n대령들이 경례했다. 원수는 지팡이를 짚고 천천히 계단을 내려왔다. 플뢰리가 차 문을 열었다. 원수는 차에 타기 전에 그를 한 번 보더니 말했다. \"늦었구먼. 10년은 늦었어.\" 플뢰리는 그게 자기한테 하는 말인 줄 알고 얼굴이 빨개졌다. 나중에 생각해 보니 아니었다.\n\n차 안에서 젊은 대령이 서류철을 내밀었다. 체포할 각료 명단, 장악할 방송국, 해산할 노조. 원수는 펼쳐 보지 않고 무릎에 놓았다. \"이 사람들도 프랑스인이네. 총은 쏘지 말게. 문만 닫게.\" 대령은 대답했다. 서류철 맨 뒷장에 따로 적힌 명단 얘기는 하지 않았다. 플뢰리는 운전석 옆자리에서 그 명단의 존재를 알고 있었다. 어젯밤 그 명단을 타자로 친 사람이 그의 친구였다."
 lr_novel.901.d:0 "파리 시청 대회의실, 총선 다음 날 밤. 개표 위원으로 뽑힌 인쇄공 루이 마르샹은 표가 든 상자 두 개를 들고 단상 옆에 서 있었다.\n\n사회주의 세력이 총선에서 이겼다. 그런데 이긴 사람들이 둘이었다. 회의실 왼쪽에는 중앙위원회를 세우자는 공산주의자들이, 오른쪽에는 위원회 자체를 없애자는 아나키스트들이 앉았다. 통로에는 벨빌 노동자들이 서서 담배를 피웠다. 누가 이기든 내일 아침 공장 문은 열려야 했다.\n\n공산주의자 대표가 먼저 연단에 올랐다. \"왕들의 군대가 국경에 있소. 규율 없이는 석 달도 못 버팁니다.\" 박수가 절반쯤 나왔다. 나머지 절반은 팔짱을 꼈다.\n\n다음은 조합 연합의 늙은 서기였다. 1906년 아미앵 헌장에 서명한 사람이라고 했다. 마르샹은 그 사람 이름을 처음 들었다. \"우리는 왕을 쫓아냈소. 그 자리에 위원회를 앉히려고 그랬소? 우리는 국가를 뺏으러 온 게 아니오. 끝내러 왔지.\" 회의실이 함성과 야유로 뒤집혔다.\n\n휴회 십오 분. 마르샹은 복도에서 담배를 피우다가 두 사람이 마주치는 걸 보았다. 붉은 별을 단 젊은 위원과 검은 스카프를 두른 철도원. 둘은 생탕투안 바리케이드에서 사흘을 같이 버틴 사이였다. \"너희가 이기면 왕들이 쳐들어올 때 투표로 막을 거냐?\" \"너희가 이기면 위원회가 왕이 될 때 누구한테 투표하냐?\" 둘은 대답 대신 담배 한 개비를 나눠 피웠다. 종이 울렸다. 둘은 다른 문으로 들어갔다."
 lr_novel.1101.d:0 "튈르리 궁 경비병 앙리 뷔송은 그날 아침 이상한 명령을 받았다. 정원 문을 열고 작업복 입은 사람들을 들여보내라는 것이었다. 원로원 의원들은 응접실에서 기다리게 하라고 했다.\n\n점심 무렵 정원에 생앙투안 거리 노동자 평의회 대표들이 모였다. 뷔송은 그들 손에 무기가 없는지 확인했다. 한 사람은 렌치를 들고 있었다. 일하다 바로 왔다고 했다. 뷔송은 그냥 들여보냈다.\n\n통령이 발코니에 나왔다. 군복 차림이었고, 견장에 붉은 리본이 달려 있었다. 손에는 누렇게 바랜 소책자를 들고 있었다. \"원로원은 나한테 왕관을 권했고, 의회는 연미복을 권했다. 나는 둘 다 거절한다.\" 정원이 술렁였다. 통령이 소책자를 들어 올렸다. \"열네 해 전 나는 이렇게 썼다. 공화국을 지키는 것은 대포라고. 이제 그 대포를 인민에게 돌려준다!\"\n\n정원이 터질 듯 함성을 질렀다. 작업모가 하늘로 날았다. 누가 라 마르세예즈를 시작했는데 중간에 다른 사람이 인터내셔널로 바꿔 불렀다. 두 노래가 뒤섞였다. 렌치를 든 남자가 뷔송의 어깨를 끌어안았다. 뷔송은 어떻게 해야 할지 몰라서 그냥 가만히 있었다.\n\n응접실에서는 원로원 의원들이 창가에 몰려 정원을 내려다보고 있었다. 늙은 백작 하나가 의자에 주저앉았다. \"황제를 만들려고 했는데, 저 사람은 로베스피에르가 되려는군.\" 뷔송은 그날 밤 퇴근길에 역 앞에서 그 백작을 다시 보았다. 스위스행 기차표를 사고 있었다."
 lr_novel.1201.d:0 "파리 외무부 시계의 방. 통역관 마리안 뒤프레는 점령군 사령관 옆에 서서 조약 마지막 조항을 프랑스어로 읽었다. 감독관은 이번 주 안에 각 부처에서 철수한다. 점령군은 라인강 너머 요새 몇 곳으로 물러난다. 프랑스는 다시 스스로 다스린다. 몇 가지 조건을 지킨다면.\n\n사령관이 서명하고 만년필 뚜껑을 닫았다. 웃는 얼굴이었다. \"귀국은 모범적인 동반자였습니다.\" 뒤프레는 그 말도 옮겼다. 총리는 대답하지 않았다.\n\n창밖 오르세 강변에서 점령군 트럭들이 짐을 싣고 있었다. 포로들은 돌아왔고, 배급은 늘었고, 기차는 제시간에 달렸다. 그 대가로 프랑스는 2년 동안 시키는 대로 했다. 명단을 넘겼고, 공장을 내주었고, 숲에 들어간 젊은이들을 쫓았다. 뒤프레는 그 명단 몇 개를 직접 번역했다. 이름은 다 기억하지 못했다. 몇 개는 기억했다.\n\n그날 저녁 총리가 생제르맹 거리 카페 앞을 지났다. 뒤프레도 같은 차에 타고 있었다. 테라스 사람들이 총리를 알아보고 말을 멈췄다. 아무도 인사하지 않았다. 신문을 접던 노인 하나가 낮게 말했다. \"살아남긴 했지. 그건 맞아.\"\n\n총리는 걸음을 멈추지 않았다. 뒤프레는 차창 너머로 그 노인을 보았다. 노인은 신문을 다시 펼쳤다. 1면 제목은 해방이 아니라 정상화였다."
 lr_novel.1301.d:0 "8월 19일 새벽, 파리 경시청. 순경 앙드레 르코크는 안마당에 모인 동료 3천 명 사이에 서 있었다. 2년 동안 점령군 명령으로 시민을 잡아들이던 사람들이었다. 르코크도 그랬다. 그는 그걸 잊지 않았다.\n\n누가 지붕에 올라가 삼색기를 걸었다. 안마당이 조용해졌다. 그리고 누가 먼저 소리를 질렀다. 르코크는 소총을 받아 들었다. 점령군이 지급한 소총이었다.\n\n엿새 동안 파리가 싸웠다. 벨빌과 생앙투안과 라틴 지구의 포석이 뜯겨 나갔다. 숲에서 내려온 마키들이 교외 역을 점거했고, 철도원들이 증원 열차를 멈췄다. 르코크는 생미셸 다리에서 사흘을 버텼다. 같이 있던 동료 하나는 넷째 날 아침에 죽었다. 그 동료는 작년에 르코크와 함께 유대인 가족 하나를 연행했었다. 르코크는 그 얘기를 아무에게도 하지 않았다.\n\n8월 25일, 점령군 사령관이 몽파르나스역 당구장에서 항복 문서에 서명했다. 파리를 불태우라는 명령을 받았지만 따르지 않았다고 했다. 르코크는 그 말을 믿지 않았다. 믿든 안 믿든 파리는 서 있었다.\n\n다음 날 샹젤리제에서 숲의 청년들과 경찰관과 철도원과 수녀들이 한 줄로 걸었다. 지붕 위에서는 아직 총소리가 났다. 르코크도 그 줄에 있었다. 누가 그에게 꽃을 던졌다. 그는 꽃을 받아 들고 한참 걸었다. 받아도 되는지 몰랐다."
 lr_novel.1401.d:0 "콩피에뉴 숲, 늦가을 아침. 박물관 경비원 오귀스트 바뇰은 객차 문을 열어 두라는 명령을 받았다.\n\n1918년 11월 11일 프랑스가 항복 문서에 서명한 바로 그 객차였다. 이십 년 동안 숲속 박물관에 서 있었다. 바뇰은 그 안을 매일 쓸고 닦았다. 서명 탁자 위 잉크병은 말라붙은 채였다. 관광객들은 대개 조용히 들어왔다가 조용히 나갔다.\n\n왕은 열 시에 왔다. 수행원 없이 객차에 올라 서명 탁자 앞에 섰다. 바뇰은 문밖에서 기다렸다. 십 분쯤 지나 왕이 나왔다. \"이 객차를 개선문 아래로 옮기게.\" 그게 다였다.\n\n한 달 뒤 객차는 개선문 아래 놓였다. 안에는 새 서류철 세 개가 진열됐다. 베를린, 빈, 런던의 항복 문서였다. 바뇰은 파리까지 따라가서 계속 그 객차를 맡게 됐다. 잉크병은 그대로 두라고 했다."
 lr_novel.1402.d:0 "개선 행진은 사흘 동안 이어졌다. 바뇰은 객차 옆에서 행진을 지켜보았다. 지나가는 연대마다 깃발에 새 전승지 이름이 수놓여 있었다.\n\n구경꾼들 사이에 검은 옷을 입은 여자들이 많았다. 그들은 환호하지 않았다. 대열이 지나갈 때마다 병사들 얼굴을 하나하나 들여다보았다. 바뇰 옆에 선 여자는 사진 한 장을 손에 쥐고 있었다. 행진이 다 끝날 때까지 그 자리에 서 있다가, 마지막 연대가 지나가자 사진을 가방에 넣고 돌아갔다.\n\n사열대 위에서 왕도 그 여자들을 본 것 같았다. 바뇰이 보기에는 그랬다. 셋째 날 오후, 왕은 경례하던 손을 중간에 내렸다. 신문은 왕이 지쳤다고 썼다.\n\n그날 밤 튈르리의 축하연에 왕은 늦게 나타났다고 했다. 시종 하나가 나중에 바뇰에게 들려준 얘기로는, 왕은 그 전에 서재에 혼자 있었다. 즉위하던 날 군 앞에서 읽은 맹세문을 꺼내 놓고 있었다. 빼앗긴 모든 것을 되찾겠다. 그 아래에 한 줄을 새로 적었다고 했다. 이제 지킬 차례다."
 lr_novel.1501.d:0 "랭스 대성당. 성가대원 미셸 포르는 열두 살이었고, 대관식 성가를 석 달 동안 연습했다.\n\n성당 안은 사람으로 가득했다. 앞줄에 마드리드와 나폴리와 리스본의 왕들이 앉았다. 그 뒤로 프랑스의 보호를 받는 독일과 이탈리아의 군주들. 미셸은 그 사람들이 다 왕이라는 게 믿기지 않았다. 다들 그냥 할아버지처럼 보였다.\n\n대주교가 작은 병을 들어 올렸다. 1825년 샤를 10세 이후 처음 쓰는 성유라고 했다. 미셸은 그 병이 생각보다 작아서 놀랐다. 성가 첫 소절을 놓칠 뻔했다. 지휘자가 그를 노려보았다.\n\n왕은 늙어 보였다. 혁명을 겪고 반란을 이기고 전쟁에서 이긴 왕이었다. 성유가 이마에 닿을 때 왕은 눈을 감았다. 미셸은 그때 노래를 부르고 있었는데, 나중에 왕이 울었다는 소문을 들었다. 미셸은 못 봤다."
 lr_novel.1502.d:0 "대관식이 끝나고 왕이 성당 문을 나섰다. 광장은 백합기로 덮여 있었다. 미셸은 성가대 줄 맨 끝에서 따라 나갔다.\n\n그때 광장 구석에서 누가 노래를 시작했다. 라 마르세예즈였다. 한 사람, 그다음엔 몇 사람. 근위대 장교가 그쪽으로 걸어가려 했다. 왕이 손을 들었다. \"내버려 두게. 저것도 프랑스 노래야.\" 장교는 멈췄다. 노래는 한 절을 다 부르고 끝났다. 아무도 체포되지 않았다.\n\n그날 저녁 왕은 베르사유 정원을 걸었다고 했다. 시종이 따라갔다. 루이 14세가 만든 운하 앞에서 왕이 오래 서 있었고, 시종이 무엇을 생각하시느냐고 물었다. 왕은 대답했다. \"다음 혁명이 언제 올지.\" 시종은 그 말을 회고록에 적었다. 미셸은 그 회고록을 육십 년 뒤에 읽었다."
 lr_novel.1601.d:0 "파리 시청 광장, 5월 1일 밤. 열여섯 살 견습 선반공 뤼시앵 마르는 횃불을 들고 서 있었다.\n\n광장의 사람들이 인터내셔널을 불렀다. 이번에는 프랑스어만이 아니었다. 베를린 평의회 대표단은 독일어로, 런던에서 온 부두 노동자들은 영어로, 토리노 사람들은 이탈리아어로 불렀다. 가사가 엇갈려서 엉망이었다. 아무도 신경 쓰지 않았다.\n\n뤼시앵은 가사를 다 외우지 못했다. 후렴만 따라 불렀다. 옆에 선 늙은 선반공 알퐁스가 다 아는 척하면서 사실 둘째 절을 틀리게 부르는 걸 뤼시앵은 알았다. 말하지 않았다.\n\n노래가 끝나고 뤼시앵이 물었다. \"이제 다 끝난 거예요?\" 알퐁스가 횃불을 고쳐 잡으며 웃었다. \"얘야, 이제 시작이야.\" 뤼시앵은 그 대답이 좀 진부하다고 생각했다. 그래도 기분은 좋았다."
 lr_novel.1602.d:0 "베를린 왕궁 발코니에는 붉은 깃발이 걸렸다. 빈의 호프부르크는 노동자 대학이 됐다. 런던 웨스트민스터의 녹색 의자에는 평의회 대표들이 앉았다. 뤼시앵은 그 소식을 다 공장 게시판에서 읽었다.\n\n인터내셔널 대회는 이제 파리, 베를린, 빈을 돌며 열린다. 의사록은 네 개 언어로 쓴다. 통역사는 늘 모자랐다. 뤼시앵의 공장에서도 독일어 할 줄 아는 사람을 찾는다는 공고가 붙었다. 뤼시앵은 야간 강좌에 등록했다.\n\n모스크바와 워싱턴에서 온 관찰자들은 같은 질문을 써서 보냈다. 이게 오래갈까. 공장 사람들은 그 질문을 신문에서 읽고 웃었다. 알퐁스는 웃지 않았다. 그는 1871년 얘기를 아버지에게서 들었다. 72일 만에 끝난 코뮌."
 lr_novel.1701.d:0 "벨빌 민중 회관, 밤 열 시. 연합 서기 마르트 고뎅은 마지막 업무를 하고 있었다. 대회가 서기국 자체를 없애기로 했다.\n\n마르트는 3년 동안 서기였다. 코뮌들의 결정을 받아 적고, 서로 다른 코뮌에 전하고, 다툼이 생기면 회의를 잡았다. 결정은 한 번도 하지 않았다. 그럴 권한이 없었다. 그래도 사람들은 그녀를 사무실이라고 불렀다. 사무실에 물어봐, 사무실이 알 거야.\n\n서류철은 마흔두 권이었다. 마르트는 그걸 연도별로 정리해 회관 도서관 서가에 꽂았다. 누구든 와서 읽을 수 있다. 마지막 권에는 서기국 폐지 표결 결과가 들어 있었다. 찬성 1,840, 반대 312. 마르트도 찬성했다."
 lr_novel.1702.d:0 "마르트는 열쇠 꾸러미를 회관 관리인 베르탱에게 건넸다. 베르탱은 그걸 받아 들고 한참 쳐다봤다.\n\n\"그럼 이제 누가 결정하오?\" 마르트는 작업복으로 갈아입고 있었다. 내일 아침부터 다시 인쇄소에 나간다. \"모두가요.\" 베르탱은 그 대답이 마음에 들지 않는 표정이었다. 마르트도 그 말이 좀 거창하게 들린다는 건 알았다.\n\n인쇄소까지는 걸어서 이십 분이었다. 거리의 가로등 절반이 꺼져 있었다. 가로등 관리를 어느 코뮌이 맡을지 아직 정하지 못해서였다. 마르트는 그걸 알고 있었다. 그 회의를 그녀가 잡았으니까. 다음 회의는 목요일이었다. 이제 누가 잡을지 모른다.\n\n바르셀로나의 공장에는 지배인이 없다. 라인란트의 탄광은 광부 협의회가 돌린다. 기차는 자주 늦는다. 마르트는 어둠 속을 걸으며 그 모든 게 내일도 돌아갈지 생각했다. 아마 그럴 거다. 조금 늦게."
 lr_novel.1801.d:0 "팔레 부르봉, 자정 무렵. 수위 마르셀 피노는 의사당 복도 불을 끄러 다니고 있었다.\n\n그날 공화국 동맹 조약이 비준됐다. 베를린, 빈, 마드리드, 암스테르담. 자매 공화국들의 대표가 오후 내내 연설을 했다. 피노는 문 옆에서 다 들었다. 연설마다 자유와 평등이라는 말이 나왔는데, 언어가 달라서 그 단어가 나올 때만 알아들었다.\n\n복도 끝에 총리가 혼자 서 있었다. 로베스피에르의 초상 앞이었다. 그 초상은 혁명 직후 누군가 걸어 놓은 뒤로 아무도 떼지 않았다. 피노는 불을 끄지 않고 기다렸다."
 lr_novel.1802.d:0 "총리가 피노를 불렀다. \"저 초상, 떼어 주겠소?\"\n\n피노는 놀랐다. \"어디에 걸까요?\"\n\n\"박물관에. 그 사람은 역사가 됐소. 우리는 아직 정치를 해야 하고.\"\n\n피노는 사다리를 가져와 초상을 내렸다. 생각보다 무거웠다. 총리가 한쪽을 잡아 주었다. 둘이서 초상을 수위실에 옮겨 놓았다. 총리는 고맙다고 하고 갔다. 피노는 초상을 벽에 기대 세워 놓고 한참 쳐다봤다. 그림 속 남자는 어딘가 불편해 보였다. 피노는 그 사람이 원래 그런 얼굴이었을 거라고 생각했다.\n\n벽에는 액자 자국이 하얗게 남았다. 다음 주에 칠장이가 와서 그 자리를 칠했다."
 lr_novel.1901.d:0 "보르도, 가론강 부두. 상공회의소 연회의 웨이터 앙리 뒤카스는 발코니에서 잠깐 담배를 피우고 있었다.\n\n강에는 배가 빽빽했다. 영국 배, 네덜란드 배, 독일 배. 관세 동맹이 생긴 뒤로 부두는 하루도 비지 않았다. 뒤카스의 형은 그 부두에서 하역 감독을 했고, 작년에 집을 샀다. 뒤카스는 아직 셋방에 살았다.\n\n연회장 안에서 선주들과 은행가들이 건배를 했다. 오늘 총리가 왔다. 뒤카스는 총리 잔에 포도주를 세 번 따랐다. 총리는 세 번 다 반만 마셨다."
 lr_novel.1902.d:0 "뒤카스가 발코니에서 돌아서려는데 총리가 나왔다. 재무장관이 따라 나왔다. 뒤카스는 담배를 끄고 구석에 섰다. 둘은 그를 신경 쓰지 않았다.\n\n재무장관이 서류를 내밀었다. 다음 해 예산안이었다. 실업 보험 항목이 처음으로 들어가 있었다. \"상공회의소가 싫어할 겁니다.\" 총리는 서류를 넘기다 말고 강을 보았다. \"릴에서 공장이 또 둘 문을 닫았소. 그 사람들도 표가 있어.\"\n\n\"총리님이 늘 시장을 믿으라고 하셨잖습니까.\"\n\n\"믿지. 그렇다고 다 맡길 수는 없잖소.\" 총리는 발코니 난간에 서류를 대고 서명했다. 펜이 잘 안 나와서 두 번 그었다.\n\n뒤카스는 그 얘기를 형에게 했다. 형은 실업 보험 얘기에는 관심이 없었다. 뒤카스는 관심이 있었다. 연회가 끝나면 그는 다시 일자리가 없었다."
 lr_novel.2001.d:0 "튈르리 궁 정원, 서명식 다음 날 아침. 정원사 레옹 비알은 장미 덤불을 손질하다가 왕과 총리가 걸어오는 걸 보았다.\n\n어제 새 헌법 수정안이 공포됐다. 왕은 법 아래에서 다스린다는 1791년의 문장이 백사십오 년 만에 실제로 시행된다. 비알은 그게 무슨 뜻인지 정확히는 몰랐다. 신문은 균형이라고 썼다.\n\n두 사람은 천천히 걸었다. 비알은 자리를 피하려고 했는데, 왕이 손짓으로 계속 일하라고 했다. 비알은 가위를 다시 들었다. 귀가 자꾸 그쪽으로 갔다."
 lr_novel.2002.d:0 "왕이 물었다. \"다음 세대에도 이게 유지될 것 같소?\"\n\n총리는 한참 걸었다. 1792년 8월 10일 군중이 이 궁을 습격했던 바로 그 정원이었다. 비알은 그 얘기를 정원사 선배에게서 들었다. 그날 이 화단에 시체가 쌓였다고 했다.\n\n\"폐하께서 헌법 위에 서지 않으시고, 의회가 거리 아래로 내려가지 않는다면요.\"\n\n\"그럼 둘 중 하나는 언젠가 그러겠군.\"\n\n\"그렇겠지요. 그때 다시 이렇게 걸으시면 됩니다.\"\n\n왕이 웃었다. 비알은 왕이 웃는 걸 처음 봤다. 두 사람은 정원 끝까지 걸어갔다가 돌아오지 않고 궁 안으로 들어갔다. 비알은 장미를 마저 잘랐다. 장미는 혁명 때도, 왕정복고 때도, 이번에도 똑같이 피었다."
 lr_novel.2101.d:0 "튈르리 궁, 황태자의 침실. 시종 앙투안 르루는 밤 열한 시에 문 옆 의자에서 졸고 있다가 황제가 들어오는 소리에 일어났다.\n\n황제는 손짓으로 앉으라고 했다. 르루는 다시 앉았다. 황제는 침대 옆 의자에 앉아 잠든 아들을 내려다보았다. 여섯 살이었다. 이불을 차 내서 한쪽 다리가 나와 있었다. 황제가 이불을 덮어 주었다.\n\n그날 낮에 비스와강의 요새에서, 라인 연방의 궁정에서, 일리리아의 항구에서 같은 법전이 낭독됐다. 봉건 지대 폐지, 길드 해체, 법 앞의 평등. 농민들은 처음으로 땅문서를 받았다. 그리고 같은 날 처음으로 징집 명부에 이름이 올랐다. 르루는 그 소식을 저녁 식사 시중을 들며 들었다."
 lr_novel.2102.d:0 "황제는 한참 아무 말도 하지 않았다. 르루는 다시 졸음이 왔다. 그때 황제가 낮은 목소리로 말했다. 아들에게 하는 말인지, 르루에게 하는 말인지 알 수 없었다.\n\n\"샤를마뉴의 제국은 손자 대에 셋으로 쪼개졌어.\"\n\n르루는 대답하지 않았다. 황제도 대답을 기다리지 않았다.\n\n\"내가 얻은 건 칼로 얻었지. 너는 법으로 지켜야 한다. 그건 내가 해 줄 수 없어.\"\n\n황제는 일어나서 아이의 머리를 한 번 쓰다듬고 나갔다. 르루는 그 뒤로도 그 말을 아무에게도 하지 않았다. 사십 년 뒤 황태자가 즉위하던 날, 르루는 늙은 몸으로 대관식에 초대받았다. 그날 밤 그는 처음으로 그 얘기를 일기에 적었다."
 lr_novel.2201.d:0 "리옹역, 아침 일곱 시. 역무원 로베르 기유는 마르세유행 첫 열차 개찰을 하고 있었다.\n\n대통령 선거는 지난주에 끝났다. 당선자는 그가 아니었다. 그는 출마하지 않았다. 신문은 사흘 내내 그 얘기만 했다. 왕관을 거절한 사람이 이번에는 연임을 거절했다고. 기유의 처남은 그 사람을 다시 뽑으려고 투표용지에 이름을 직접 써넣었다가 무효표가 됐다.\n\n어제 취임식이 있었다. 기유는 라디오로 들었다. 새 대통령은 연설 첫 줄에서 전임자에게 감사했다. 박수가 오래 이어졌다. 새 대통령의 연설보다 그 박수가 더 길었다고 처남이 말했다."
 lr_novel.2202.d:0 "가죽 가방 하나를 든 노인이 개찰구로 왔다. 기유는 차표를 받아 구멍을 뚫으려다가 얼굴을 보았다. 손이 멈췄다.\n\n노인은 모자를 살짝 들었다. \"수고 많으시오.\" 기유는 차표를 돌려주는 것도 잊었다. 노인이 웃으며 차표를 가져갔다. 마르세유까지 가서 코르시카행 배를 탄다고 했다. 수행원은 없었다. 경호원도 없었다. 기유는 나중에 경호원이 다음 칸에 탔다는 얘기를 들었지만, 그때는 몰랐다.\n\n플랫폼에서 늙은 철도원 하나가 노인을 알아보고 차렷 자세로 경례했다. 알제리 원정 때 같은 연대였다고 했다. 노인은 걸음을 멈추고 답례했다. 그리고 열차에 올랐다.\n\n기유는 그날 개찰을 마치고 그 차표 번호를 수첩에 적어 두었다. 왜 그랬는지는 자기도 몰랐다."
 lr_novel.2301.d:0 "베를린 왕궁, 옛 프리드리히 대왕의 서재. 정치위원 장 클로드 바예는 새벽 두 시에 통령이 불을 켜 둔 걸 보고 차를 가져갔다.\n\n통령은 책상에 누렇게 바랜 소책자를 펼쳐 놓고 있었다. 보케르의 저녁 식사. 1922년, 스물한 살 포병 소위가 쓴 글이었다. 바예는 그 책을 혁명 학교에서 배웠다. 원본을 보는 건 처음이었다.\n\n붉은 대육군이 지나간 자리마다 인민 공화국이 섰다. 베를린, 빈, 프라하, 부다페스트. 그리고 그 공화국마다 파리에서 온 정치위원이 상주했다. 바예도 그중 하나였다. 그는 그 사실을 자랑스러워했고, 가끔은 그게 마음에 걸렸다."
 lr_novel.2302.d:0 "통령이 소책자 마지막 쪽을 바예에게 보여 주었다. 젊은 날 연필로 적은 한 줄이 있었다. 공화국은 대포로 지키고, 대포는 공화국이 지킨다.\n\n\"이걸 쓸 때 나는 대포가 공화국을 지키기만 할 줄 알았소.\" 통령은 펜을 들어 그 아래에 한 줄을 새로 적었다. 바예는 몸을 기울여 읽었다. 대포가 공화국을 삼키지 않게.\n\n\"빈의 젊은 시인 하나가 시를 썼다더군. 형제와 주인은 어떻게 구별하느냐고. 그 시가 다음 날 신문에서 사라졌다고 하던데, 사실이오?\"\n\n바예는 사실이라고 했다. 빈 위원회가 뺐다. 통령은 고개를 끄덕이고 소책자를 덮었다. \"다시 실으라고 전하시오.\"\n\n바예는 그 명령을 그날 아침 전보로 보냈다. 빈 위원회는 사흘 동안 답을 하지 않았다."
 lr_novel.2401.d:0 "비시, 파르크 호텔 3층. 원수의 부관 레몽 드 세르는 아침 일정표를 들고 창가로 갔다. 원수는 의자에 앉아 공원의 눈을 보고 있었다. 무릎에 담요를 덮고 있었다.\n\n드 세르는 일정을 읽었다. 열 시 장관 회의, 열한 시 반 참전용사 군단 대표단, 오후 세 시 리옹 주교 접견. 원수는 듣지 않는 것 같았다. 드 세르는 한 번 더 읽었다.\n\n프랑스국은 전쟁에서 이겼다. 신문은 검열을 받았고, 노조는 동업 조합이 됐다. 거리에는 깃발과 행진이 넘쳤다. 농촌 노인들은 원수를 사랑했다. 도시 젊은이들은 밤마다 등사판으로 찍은 전단을 돌렸다. 맨 위에는 늘 같은 세 단어가 있었다. 자유, 평등, 박애. 경찰이 압수해도 다음 날 아침이면 또 붙어 있었다. 드 세르는 그 보고서를 매일 아침 원수 책상에 올렸다."
 lr_novel.2402.d:0 "원수가 갑자기 고개를 돌렸다. \"드 세르, 베르됭 병사들은 뭘 위해 죽었다고 생각하나?\"\n\n드 세르는 대답하지 못했다. 그 질문은 일정표에 없었다.\n\n원수는 다시 창밖을 보았다. 한참 뒤에 혼잣말처럼 말했다. \"나는 그들이 프랑스를 위해 죽었다고 믿고 싶네. 나를 위해서가 아니라.\"\n\n드 세르는 일정표를 접었다. 원수는 그날 장관 회의에 나가지 않았다. 오후 세 시 주교 접견에는 나갔다. 주교가 기도를 청했고 원수는 고개를 숙였다. 드 세르는 원수의 손이 떨리는 걸 보았다. 추워서인지는 알 수 없었다."
 LR_FRA_war_plans_category:0 "전쟁 계획"
 LR_FRA_war_plans_category_desc:0 "전쟁 계획 중점으로 열리는 선전포고입니다. 항복시킨 나라는 곧바로 강화에 들어갑니다. 프랑스가 차지하는 땅은 정부에 따라 다릅니다. 의회주의는 1936년의 국경, 사회주의는 벨기에·룩셈부르크·쥐라까지, 민족주의와 군주정은 사르데냐와 라인강 서안까지, 황제는 나폴레옹의 제국 전체입니다. 나머지는 괴뢰국, 유럽 밖은 합병하거나 자치령으로 삼습니다."
