 LR_BOU_plan_turkey_desc:0 "대전쟁의 승자 오스만은 도나우에서 페르시아만까지 뻗어 있습니다. 다르다넬스를 뚫으면 이스탄불이고, 시리아를 치면 석유입니다. 십자군 이래 가장 멀리 가는 프랑스의 원정을 계획합니다."
 LR_COM_plan_low:0 "저지대 계획"
 LR_COM_plan_low_desc:0 "브뤼셀의 은행과 암스테르담의 증권거래소, 제네바의 금고에는 대전쟁 동안 양쪽에 팔아 번 돈이 쌓여 있습니다. 중립은 그 돈을 지키는 담장이었습니다. 샤를루아의 광부들과 로테르담의 부두 노동자들은 그 담장 안에서 일합니다. 혁명군이 담장을 넘습니다."
 LR_COM_plan_south_germany:0 "슈바르츠발트 너머"
 LR_COM_plan_south_germany_desc:0 "슈투트가르트의 자동차 공장과 아우크스부르크의 기계 공장에는 파리 방송을 몰래 듣는 노동자들이 있습니다. 그들의 왕은 프로이센의 칼을 빌려 왕좌를 지켰습니다. 혁명은 그 칼이 다른 곳을 보고 있을 때 옵니다. 전단이 먼저 슈바르츠발트를 넘고, 혁명군이 그 뒤를 따릅니다."
 LR_COM_plan_iberia:0 "피레네 계획"
 LR_COM_plan_iberia_desc:0 "바르셀로나의 조합원들은 이 반도에서 가장 먼저 검붉은 깃발을 들었습니다. 안달루시아의 날품팔이들은 아직 지주의 땅에서 하루 품삯을 받습니다. 반도의 혁명은 이미 시작되었고, 모자란 것은 무기뿐입니다. 피레네의 고개로 탄약 행렬이 먼저 올라갑니다."
 LR_COM_plan_italy:0 "알프스 계획"
 LR_COM_plan_italy_desc:0 "토리노의 자동차 공장과 밀라노의 방직 공장은 반도에서 가장 붉은 곳입니다. 그 노동자들 위에는 왕이 다섯이고, 그 왕들 위에는 빈이 있습니다. 왕관이 몇 개든 혁명에게는 국경 하나일 뿐입니다. 몽스니 고개의 눈이 녹으면 혁명군이 내려갑니다."
 LR_COM_plan_north:0 "북해 계획"
 LR_COM_plan_north_desc:0 "스톡홀름의 사회민주당은 왕 아래서 표를 모아 왔습니다. 핀란드의 노동자들은 독립과 함께 찾아온 내전에서 졌습니다. 북쪽의 동지들은 기다리는 데 익숙합니다. 혁명의 함대가 외레순 해협을 지나 그 기다림을 끝내러 갑니다."
 LR_COM_plan_east:0 "동유럽 계획"
 LR_COM_plan_east_desc:0 "바르샤바와 우치의 방직 공장, 리가의 항구에서 일하는 노동자들은 대전쟁 뒤 왕을 하나씩 얻었습니다. 아무도 그 왕을 원하지 않았습니다. 페테르부르크의 혁명은 국경에서 멈췄습니다. 혁명군이 그 국경 너머의 문을 엽니다."
 LR_COM_plan_balkans:0 "발칸 계획"
 LR_COM_plan_balkans_desc:0 "트란실바니아의 광부와 피레우스의 부두 노동자, 소피아의 담배 공장 여공들은 서로 다른 말을 씁니다. 그러나 그들의 왕은 모두 같은 은행에서 돈을 빌립니다. 발칸의 민족 전쟁은 왕들의 전쟁이었습니다. 혁명군은 그 전쟁을 계급의 전쟁으로 바꾸러 갑니다."
 LR_COM_plan_turkey:0 "동방 원정"
 LR_COM_plan_turkey_desc:0 "모술과 키르쿠크의 유전에서 퍼 올린 석유는 런던과 이스탄불의 은행으로 흘러갑니다. 그 땅에서 일하는 사람들에게 남는 것은 기름 냄새뿐입니다. 혁명은 석유보다 빨리 번집니다. 혁명군이 다르다넬스와 레반트의 해안을 함께 노립니다."
 LR_JAC_plan_low:0 "저지대 계획"
 LR_JAC_plan_low_desc:0 "1792년 혁명군은 제마프에서 오스트리아군을 깨고 벨기에 사람들에게 자유를 약속했습니다. 1795년에는 암스테르담에 바타비아 공화국이, 3년 뒤에는 스위스에 헬베티아 공화국이 섰습니다. 왕들의 동맹이 그 자매 공화국들을 지도에서 지웠습니다. 공화국이 그 약속을 다시 꺼냅니다."
 LR_JAC_plan_south_germany:0 "슈바르츠발트 너머"
 LR_JAC_plan_south_germany_desc:0 "1796년 모로의 군대는 슈바르츠발트를 넘어 뮌헨 문턱까지 갔다가 돌아왔습니다. 남독일의 대학 도시에는 그해 광장에 심은 자유의 나무를 기억하는 집안이 아직 있습니다. 공화국은 남독일의 왕들이 아니라 그 시민들에게 묻습니다. 왕관 없이 살아 볼 생각이 있느냐고."
 LR_JAC_plan_iberia:0 "피레네 계획"
 LR_JAC_plan_iberia_desc:0 "피레네 너머의 공화파는 내전에서 살아남았지만, 반도의 절반은 아직 왕과 사제의 것입니다. 리스본에서는 영국 대사가 국왕보다 먼저 보고를 받습니다. 1793년 혁명군은 그 산맥을 끝내 넘지 못했습니다. 이번에는 넘습니다."
 LR_JAC_plan_italy:0 "알프스 계획"
 LR_JAC_plan_italy_desc:0 "1798년 로마의 캄피돌리오 광장에 공화국 선포문이 붙었습니다. 이듬해 나폴리 왕의 군대와 오스트리아군이 그것을 떼어 냈습니다. 반도의 공화파는 그 뒤로 백사십 년을 감옥과 망명지에서 보냈습니다. 공화국이 알프스를 넘어 그 빚을 갚으러 갑니다."
 LR_JAC_plan_north:0 "북해 계획"
 LR_JAC_plan_north_desc:0 "스칸디나비아의 왕들은 의회를 존중하고, 의회는 왕을 존중합니다. 그 덕에 그들은 대전쟁 내내 양쪽에 물건을 팔 수 있었습니다. 공화국은 그 신사협정에 끼어들 생각이 없습니다. 다만 외레순 해협과 나르비크의 철광을 영국의 것으로 남겨 둘 수는 없습니다."
 LR_JAC_plan_east:0 "동유럽 계획"
 LR_JAC_plan_east_desc:0 "폴란드 사람들은 18세기에 세 번 나라를 잃었고, 대전쟁 뒤에는 승전국이 골라 준 왕을 얻었습니다. 우크라이나에는 빈의 대공이 앉았습니다. 그들 가운데 누구도 자기 왕을 고르지 않았습니다. 공화국이 그들에게 고를 권리를 돌려주러 갑니다."
 LR_JAC_plan_balkans:0 "발칸 계획"
 LR_JAC_plan_balkans_desc:0 "발칸의 민족들은 백 년에 걸쳐 술탄에게서 차례로 독립을 얻었습니다. 그리고 얻자마자 독일 혈통의 왕을 모셔 왔습니다. 공화국은 그 왕들의 궁전보다 소피아와 베오그라드의 대학을 먼저 봅니다. 공화국의 친구들은 거기서 자라고 있습니다."
 LR_JAC_plan_turkey:0 "동방 원정"
 LR_JAC_plan_turkey_desc:0 "술탄의 제국은 대전쟁에서 이겼지만, 그 안의 민족들은 이기지 못했습니다. 아르메니아 사람들과 아랍 사람들과 쿠르드 사람들은 아직 이스탄불이 보낸 총독 아래 삽니다. 공화국은 그들에게 인권 선언문의 번역본을 보냅니다. 다르다넬스를 향하는 함대가 그 뒤를 따릅니다."
 LR_GIR_plan_low:0 "저지대 계획"
 LR_GIR_plan_low_desc:0 "1792년 혁명군은 제마프에서 오스트리아군을 깨고 벨기에 사람들에게 자유를 약속했습니다. 1795년에는 암스테르담에 바타비아 공화국이, 3년 뒤에는 스위스에 헬베티아 공화국이 섰습니다. 왕들의 동맹이 그 자매 공화국들을 지도에서 지웠습니다. 공화국이 그 약속을 다시 꺼냅니다."
