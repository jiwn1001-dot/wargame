 LR_FRA_integration_category:0 "알제리 통합"
 LR_FRA_integration_category_desc:0 "반란을 진압한 알제리를 프랑스의 일부로 묶습니다. 결정을 내리면 알제리에 핵심주가 생기고, 정부의 방식에 따라 다스리는 법이 달라집니다."
 LR_dec_integrate_jac_algeria:0 "알제리의 세 데파르트망"
 LR_dec_integrate_jac_algeria_desc:0 "알제와 오랑과 콩스탕틴을 공화국의 세 데파르트망으로 만듭니다. 문제는 그곳 무슬림 주민들의 시민권입니다. 1794년 국민공회는 식민지 노예제를 폐지했습니다. 산악파는 그 날짜를 잊지 않았습니다."
 LR_dec_integrate_gir_algeria:0 "알제리 데파르트망 의회"
 LR_dec_integrate_gir_algeria_desc:0 "알제 항구는 마르세유 다음으로 붐비는 프랑스의 항구가 될 수 있습니다. 지롱드는 알제리의 세 데파르트망이 데파르트망 의회와 상공회의소로 스스로 꾸려 가기를 바랍니다. 문제는 그 데파르트망 의회를 누구의 표로 뽑느냐입니다."
 LR_dec_integrate_mar_algeria:0 "알제리의 명사들"
 LR_dec_integrate_mar_algeria_desc:0 "알제리의 세 데파르트망을 누가 다스릴지 정해야 합니다. 푀양파의 방식은 간단합니다. 세금을 많이 내는 사람이 다스립니다. 문제는 그 명부에 이름이 오른 사람의 9할이 콜롱 지주라는 것입니다."
 LR_dec_integrate_gua_algeria:0 "알제리 주민 투표"
 LR_dec_integrate_gua_algeria_desc:0 "대통령은 알제리에서 군 생활을 시작했고 그곳에서 이름을 얻었습니다. 그는 칙령 대신 투표를 택합니다. 알제리 주민에게 프랑스 공화국의 시민이 될지 직접 묻습니다."
 LR_dec_integrate_com_algeria:0 "알제리 노동자 평의회"
 LR_dec_integrate_com_algeria_desc:0 "알제 부두에서 노동자 평의회가 처음으로 열렸습니다. 아랍인 하역 노동자와 프랑스인 기관사가 같은 총회에서 손을 듭니다. 알제리를 코뮌의 일부로 받을지, 연방을 맺을지 정해야 합니다."
 LR_dec_integrate_orl_algeria:0 "알제리 군정 총독부"
 LR_dec_integrate_orl_algeria_desc:0 "알제리는 되찾았지만 카스바의 골목에는 아직 총이 숨겨져 있습니다. 왕은 반란을 겪은 땅에 민간인 총독을 보내지 않기로 했습니다. 군복 입은 장군이 알제 총독 관저에서 취임 선서를 합니다."
 LR_dec_integrate_bou_algeria:0 "알제리 왕령"
 LR_dec_integrate_bou_algeria_desc:0 "1830년 샤를 10세가 처음 알제리를 정복했을 때 왕의 이름과 십자가가 함께 들어갔습니다. 반란은 끝났지만 그 땅의 주인은 아직 정해지지 않았습니다. 알제리를 왕의 직할령으로 삼습니다."
 LR_dec_integrate_pet_algeria:0 "알제리 국민 혁명"
 LR_dec_integrate_pet_algeria_desc:0 "대전쟁에서 프랑스를 위해 싸운 알제리 노병들은 아직 프랑스 시민이 아닙니다. 원수는 그들을 각별히 아낍니다. 알제리에 참전용사 군단과 농민 조합을 세우고, 노병들에게 무엇을 줄지 정합니다."
 LR_dec_integrate_nap_algeria:0 "알제리 총독부"
 LR_dec_integrate_nap_algeria_desc:0 "황제는 알제리를 누구보다 잘 압니다. 그는 그 땅의 반란을 진압하며 이름을 얻었습니다. 그가 지휘한 알제리 소총병들은 아직 그를 장군이라 부릅니다. 알제리를 황제 직할 총독부로 삼습니다."
 LR_dec_integrate_red_algeria:0 "알제리 인민 평의회"
 LR_dec_integrate_red_algeria_desc:0 "통령은 알제리의 반란을 진압하며 이름을 얻었습니다. 이제 같은 땅에 붉은 깃발을 들고 돌아왔습니다. 알제 부두의 노동자들 가운데는 그의 부대와 싸웠던 사람들이 있습니다. 알제리를 인민 공화국의 코뮌으로 묶습니다."
 LR_FRA_orders_category:0 "특별 명령"
 LR_FRA_orders_category_desc:0 "중점으로 열리는 명령입니다. 정치력을 들여 되풀이해서 내릴 수 있습니다."
 LR_dec_order_legion:0 "외인부대 모집"
 LR_dec_order_legion_desc:0 "시디벨아베스에 지원자가 줄을 섭니다. 정예 사단 1개를 편성합니다."
 LR_dec_order_manoeuvres:0 "대규모 기동 훈련"
 LR_dec_order_manoeuvres_desc:0 "참모본부가 샹파뉴 평원에서 사단을 움직여 봅니다. 육군 경험치 +30, 지휘력 +15."
 LR_dec_order_shipyards:0 "해군 긴급 발주"
 LR_dec_order_shipyards_desc:0 "조선소에 초과 근무를 시킵니다. 해군 경험치 +30."
 LR_dec_order_fuel:0 "연료 비축 명령"
 LR_dec_order_fuel_desc:0 "민간 소비를 줄여 전략 비축유를 쌓습니다. 연료 +20000."
 LR_dec_order_review:0 "왕의 사열"
 LR_dec_order_review_desc:0 "왕이 노병들 앞을 지나갑니다. 전쟁 지지도 +3%."
 LR_dec_order_progress:0 "왕실 순행"
 LR_dec_order_progress_desc:0 "왕이 지방 도시를 돕니다. 안정도 +3%."
 LR_dec_order_subbotnik:0 "토요 자원 노동"
 LR_dec_order_subbotnik_desc:0 "노동자들이 쉬는 날 공장에 나옵니다. 소총 4000정을 비축합니다."
 LR_dec_order_subscription:0 "공화국 국민 모금"
 LR_dec_order_subscription_desc:0 "시민들이 재건 기금에 돈을 냅니다. 경제 재건 +1."
 LR_dec_order_bonds:0 "철도 채권 발행"
 LR_dec_order_bonds_desc:0 "파리 증권거래소에서 채권을 모집합니다. 정치력 +60, 경제 재건 +1."
 LR_dec_order_royal_tour:0 "입헌 왕의 순방"
 LR_dec_order_royal_tour_desc:0 "왕이 내각과 함께 지방을 돕니다. 의석 +24."
 LR_dec_order_conscription:0 "황제의 징집령"
 LR_dec_order_conscription_desc:0 "황제가 또 한 번 젊은이들을 부릅니다. 인력 +50000, 안정도 -2%."
