 LR_ORL_epilogue:0 "복수의 끝"
 LR_ORL_epilogue_desc:0 "1918년에 멈춘 시계가 마침내 다시 돌았습니다. 복수의 왕은 이제 무엇으로 기억될까요. 콩피에뉴 숲, 늦가을 아침. 박물관 경비원 오귀스트 바뇰은 객차 문을 열어 두라는 명령을 받았다."
 LR_BOU_epilogue:0 "백합의 세기"
 LR_BOU_epilogue_desc:0 "부르봉의 백합이 다시 유럽 위에 핍니다. 루이 14세의 꿈이 이루어졌습니다. 랭스 대성당. 성가대원 미셸 포르는 열두 살이었고, 대관식 성가를 석 달 동안 연습했다."
 LR_COM_epilogue:0 "인터내셔널의 봄"
 LR_COM_epilogue_desc:0 "왕들의 유럽이 무너졌습니다. 1871년 72일 만에 끝난 꿈이 이번에는 대륙을 덮었습니다. 파리 시청 광장, 5월 1일 밤. 열여섯 살 견습 선반공 뤼시앵 마르는 횃불을 들고 서 있었다."
 LR_ANA_epilogue:0 "국가 없는 대륙"
 LR_ANA_epilogue_desc:0 "왕도 신도 주인도 없는 유럽. 아무도 가능하다고 믿지 않았던 것이 3년을 버텼습니다. 벨빌 민중 회관, 밤 열 시. 연합 서기 마르트 고뎅은 마지막 업무를 하고 있었다. 대회가 서기국 자체를 없애기로 했다."
 LR_JAC_epilogue:0 "공화국의 세기"
 LR_JAC_epilogue_desc:0 "1792년에 시작된 일이 마침내 끝났습니다. 왕들의 유럽에 공화국이 섰습니다. 팔레 부르봉, 자정 무렵. 수위 마르셀 피노는 의사당 복도 불을 끄러 다니고 있었다."
 LR_GIR_epilogue:0 "상인들의 대륙"
 LR_GIR_epilogue_desc:0 "칼이 아니라 계산서로 묶인 유럽. 지롱드의 오랜 꿈이 이루어졌습니다. 보르도, 가론강 부두. 상공회의소 연회의 웨이터 앙리 뒤카스는 발코니에서 잠깐 담배를 피우고 있었다."
 LR_MAR_epilogue:0 "1791년의 완성"
 LR_MAR_epilogue_desc:0 "헌법 아래의 왕, 명사들의 의회. 1791년에 찢어졌던 헌법이 마침내 유럽의 질서가 되었습니다. 튈르리 궁 정원, 서명식 다음 날 아침. 정원사 레옹 비알은 장미 덤불을 손질하다가 왕과 총리가 걸어오는 걸 보았다."
 LR_NAP_epilogue:0 "황제의 유럽"
 LR_NAP_epilogue_desc:0 "코르시카의 포병 장교가 샤를마뉴 이후 누구도 이루지 못한 것을 이루었습니다. 튈르리 궁, 황태자의 침실. 시종 앙투안 르루는 밤 열한 시에 문 옆 의자에서 졸고 있다가 황제가 들어오는 소리에 일어났다."
 LR_GUA_epilogue:0 "왕관 없는 승리"
 LR_GUA_epilogue_desc:0 "왕관을 거절한 장군이 유럽을 이겼습니다. 이제 그가 지킬 마지막 약속이 남았습니다. 리옹역, 아침 일곱 시. 역무원 로베르 기유는 마르세유행 첫 열차 개찰을 하고 있었다."
 LR_RED_epilogue:0 "붉은 대육군의 유럽"
 LR_RED_epilogue_desc:0 "인민의 통령이 이끈 붉은 대육군이 대륙을 지나갔습니다. 그 뒤에 남은 것은 해방인가, 제국인가. 베를린 왕궁, 옛 프리드리히 대왕의 서재. 정치위원 장 클로드 바예는 새벽 두 시에 통령이 불을 켜 둔 걸 보고 차를 가져갔다."
 LR_PET_epilogue:0 "원수의 마지막 겨울"
 LR_PET_epilogue_desc:0 "여든을 넘긴 원수가 승리를 보았습니다. 그가 세운 나라는 그가 없어도 서 있을 수 있을까요. 비시, 파르크 호텔 3층. 원수의 부관 레몽 드 세르는 아침 일정표를 들고 창가로 갔다. 원수는 의자에 앉아 공원의 눈을 보고 있었다. 무릎에 담요를 덮고 있었다."
