 LR_tt_seats_407:0 "의회 의석 §Y407석§! 이상 필요"
 LR_FRA_the_kings_peace:0 "패전의 그늘"
 LR_FRA_the_kings_peace_desc:0 "1918년의 패전은 프랑스에서 인도차이나와 적도 아프리카를 앗아 갔고, 배상금 장부는 런던에 있습니다. 파리의 카페에서 영광이라는 말을 꺼내는 사람은 이제 없습니다. 다시 일어서는 일은 무엇이 남았는지 세어 보는 데서 시작합니다."
 LR_FRA_war_reparations:0 "배상금 재협상"
 LR_FRA_war_reparations_desc:0 "런던의 은행가들은 숫자에 냉정하지만, 파산한 채무자에게서는 한 푼도 받을 수 없다는 것도 압니다. 배상금 상환을 몇 년만 미뤄도 재건 예산이 숨을 쉽니다. 재무장관이 다시 런던행 기차에 오릅니다."
 LR_FRA_royal_arsenal:0 "병기창 재건"
 LR_FRA_royal_arsenal_desc:0 "왕실은 대전쟁 뒤 병기창 예산을 절반으로 깎았습니다. 장군들이 군대를 믿고 왕을 넘볼까 두려워서였습니다. 생테티엔과 튈의 문 닫은 공장에 다시 사람과 돈을 들입니다."
 LR_FRA_rebuild_railways:0 "철도 재건"
 LR_FRA_rebuild_railways_desc:0 "대전쟁은 북부의 철길을 고철 더미로 만들었습니다. 석탄이 파리에 닿지 않으면 공장도 군대도 움직이지 못합니다. 릴에서 파리까지 첫 구간부터 다시 놓습니다."
 LR_FRA_steelworks:0 "로렌 제철소"
 LR_FRA_steelworks_desc:0 "드방델 가문의 용광로는 십 년째 반만 돌고 있습니다. 로렌의 철광석은 언제나 프랑스 군수 산업의 심장이었습니다. 꺼진 용광로 세 개에 다시 불을 넣습니다."
 LR_FRA_tunisia_morocco:0 "북아프리카 개발"
 LR_FRA_tunisia_morocco_desc:0 "알제리의 총성이 지중해를 건너오자 튀니스와 카사블랑카의 총독들이 초조해졌습니다. 남은 북아프리카를 붙잡을 것은 군대가 아니라 일자리입니다. 항구와 인산염 광산에 공장을 세웁니다."
 LR_FRA_ports:0 "항구 재건"
 LR_FRA_ports_desc:0 "브레스트와 툴롱의 조선대는 절반이 비어 있습니다. 빈 도크에서 녹스는 크레인은 패전국 해군의 얼굴입니다. 생나제르까지 도크마다 다시 망치 소리를 울립니다."
 LR_FRA_mass_production:0 "대량 생산"
 LR_FRA_mass_production_desc:0 "앙드레 시트로엥은 디트로이트에서 컨베이어 벨트를 보고 돌아왔습니다. 장인들은 투덜대겠지만 같은 공장에서 포탄이 세 배로 나옵니다. 군수 공장에 조립 라인을 들입니다."
 LR_FRA_royal_academy:0 "과학 아카데미"
 LR_FRA_royal_academy_desc:0 "파스퇴르와 퀴리의 나라는 전쟁에 졌어도 학문까지 진 것은 아닙니다. 그런데 과학원 연구실의 절반은 예산이 없어 문을 닫았습니다. 학자들에게 연구비와 실험실을 돌려줍니다."
 LR_FRA_rural_power:0 "농촌 전력화"
 LR_FRA_rural_power_desc:0 "프랑스의 절반은 아직 석유등으로 밤을 밝힙니다. 시골까지 전선을 끌어가면 농민의 표와 새 공장 부지가 함께 따라옵니다. 오베르뉴와 브르타뉴부터 전력망을 넓힙니다."
 LR_FRA_synthetic_fuel:0 "합성 연료"
 LR_FRA_synthetic_fuel_desc:0 "프랑스 땅에는 유전이 없습니다. 다음 전쟁에서 영국 해군에 목줄을 맡기지 않으려면 석탄을 기름으로 바꾸는 법을 배워야 합니다. 로렌 탄전 옆에 합성 연료 공장을 짓습니다."
 LR_FRA_trade_treaties:0 "통상 조약"
 LR_FRA_trade_treaties_desc:0 "스위스 은행, 스웨덴 철광, 아르헨티나 밀. 승전국들이 쥔 무역로 밖에도 거래할 상대는 있습니다. 중립국과 맺는 작은 조약들로 봉쇄를 견딜 그물을 짭니다."
 LR_FRA_war_economy:0 "전시 경제"
 LR_FRA_war_economy_desc:0 "평시 경제는 여기서 끝납니다. 철도와 공장이 준비되었다면 이제 모든 선반을 한 가지 목적에 맞춥니다. 재무부와 전쟁부가 처음으로 같은 장부를 씁니다."
 LR_FRA_lessons_of_defeat:0 "패전의 교훈"
 LR_FRA_lessons_of_defeat_desc:0 "참모대학에서 가장 인기 없는 강의는 우리는 왜 졌는가입니다. 수강생은 대개 대위 몇 명뿐이고, 장군들은 그 강의실 근처에도 오지 않습니다. 그 질문에 답하는 장교들에게 다음 전쟁을 맡깁니다."
 LR_FRA_infantry_rearm:0 "보병 재무장"
 LR_FRA_infantry_rearm_desc:0 "병사들은 아직 1886년에 만든 르벨 소총을 듭니다. 새 소총을 사는 대신 왕실은 근위대 군복을 새로 맞췄습니다. 보병부터 다시 무장시킵니다."
 LR_FRA_artillery_school:0 "포병 학교"
 LR_FRA_artillery_school_desc:0 "75mm 야포는 프랑스 육군의 신화입니다. 그 신화를 믿는 늙은 포병과, 그것을 넘어서려는 젊은 포병이 같은 학교에서 부딪칩니다. 부르주의 포병 학교를 다시 엽니다."
 LR_FRA_mobile_war:0 "기동전 연구"
 LR_FRA_mobile_war_desc:0 "참호가 전쟁의 전부라고 믿는 장군들 사이에서 몇몇 젊은 대령이 엔진 소리에 귀를 기울입니다. 그들은 승진 명단에서 늘 빠졌습니다. 그들에게 연구비와 연습장을 줍니다."
 LR_FRA_general_staff:0 "참모본부 개편"
 LR_FRA_general_staff_desc:0 "참모본부 장군의 평균 나이는 예순여덟입니다. 왕실은 정치에 관심 없는 노인들을 골라 그 자리에 앉혔습니다. 이제 그들에게 훈장과 은퇴 통지서를 같은 봉투에 넣어 보냅니다."
 LR_FRA_motorisation:0 "차량화"
 LR_FRA_motorisation_desc:0 "보병은 아직 걸어서, 대포는 말이 끌어서 움직입니다. 말은 사랑스럽지만 기름만큼 빠르지는 않습니다. 보병을 트럭에 태웁니다."
 LR_FRA_tank_divisions:0 "기갑 사단"
 LR_FRA_tank_divisions_desc:0 "전차는 보병 대대마다 몇 대씩 나뉘어 있습니다. 흩어진 강철은 전선을 찢지 못합니다. 전차를 모아 사단을 만듭니다."
 LR_FRA_air_arm:0 "공군 창설"
 LR_FRA_air_arm_desc:0 "공군은 아직 육군의 한 부서입니다. 비행기는 정찰과 축제 비행에만 쓰이고, 조종사들은 활공 클럽에서 자비로 연습합니다. 하늘의 군대를 따로 세웁니다."
 LR_FRA_revenge_army:0 "복수의 군대"
 LR_FRA_revenge_army_desc:0 "복무 기간을 늘리고 연병장을 넓힙니다. 아무도 입 밖에 내지 않지만, 누구를 상대로 한 훈련인지는 모두가 압니다. 1918년을 기억하는 군대를 만듭니다."
 LR_FRA_new_navy:0 "새 함대"
 LR_FRA_new_navy_desc:0 "됭케르크급 전함의 설계도가 십 년 동안 해군성 금고에 잠들어 있었습니다. 예산이 없었을 뿐 설계는 끝나 있었습니다. 금고를 엽니다."
 LR_FRA_air_doctrine:0 "공군 교리"
 LR_FRA_air_doctrine_desc:0 "전투기냐 폭격기냐를 두고 공군 수뇌부가 둘로 갈렸습니다. 그래도 결론 하나에는 다 동의합니다. 다시는 지상군의 시녀로 남지 않습니다."
 LR_FRA_radio_net:0 "무선 통신망"
 LR_FRA_radio_net_desc:0 "대전쟁의 사단은 전령과 비둘기로 움직였고, 지금도 크게 다르지 않습니다. 무전기 없는 기갑은 눈먼 강철입니다. 사단 사령부마다 무선망을 깝니다."
 LR_FRA_fleet_doctrine:0 "해군 교리"
 LR_FRA_fleet_doctrine_desc:0 "지중해를 지킬 것인가, 대서양으로 나갈 것인가. 둘 다 할 함대는 없다는 것을 제독들이 드디어 인정합니다. 해군의 교리를 하나로 정합니다."
 LR_FRA_ready_for_war:0 "전쟁 준비 완료"
 LR_FRA_ready_for_war_desc:0 "병기창은 찼고 장교는 젊어졌습니다. 패전 이후 처음으로 참모총장이 내각에 준비되었다고 보고합니다. 이제 남은 것은 정치의 결정입니다."
 LR_FRA_stabilise_franc:0 "프랑 안정화"
 LR_FRA_stabilise_franc_desc:0 "프랑은 한 해에 가치의 3분의 1을 잃었습니다. 빵값이 멈추지 않으면 정권도 오래 가지 못합니다. 1926년 포앵카레가 그랬듯 프랑을 다시 금에 묶습니다."
 LR_FRA_nord_coal:0 "북부 탄광 재개발"
 LR_FRA_nord_coal_desc:0 "랑스와 발랑시엔의 갱도는 대전쟁 때 물에 잠긴 채 버려졌습니다. 북부의 석탄 없이는 로렌의 용광로도 돌지 않습니다. 물을 퍼내고 떠났던 광부들을 다시 부릅니다."
 LR_FRA_citroen_trucks:0 "시트로엥 트럭 계약"
 LR_FRA_citroen_trucks_desc:0 "케 드 자벨의 조립 라인은 하루에 승용차 수백 대를 뽑습니다. 전차보다 먼저, 전차에 기름과 포탄을 실어 나를 차가 필요합니다. 시트로엥과 군용 트럭 계약을 맺습니다."
 LR_FRA_alpine_hydro:0 "알프스 수력 발전"
 LR_FRA_alpine_hydro_desc:0 "석탄이 모자라면 산이 있습니다. 그르노블 사람들은 알프스의 물을 하얀 석탄이라고 부릅니다. 협곡마다 댐을 세워 남부의 공장을 돌립니다."
 LR_FRA_state_capital:0 "국가 주도 투자"
 LR_FRA_state_capital_desc:0 "콜베르의 나라에서 국가는 늘 첫 번째 투자자였습니다. 은행이 움직이지 않는다면 국가가 먼저 움직입니다. 계획국 관료들이 어느 공장을 어디에 세울지 정합니다."
 LR_FRA_private_capital:0 "민간 자본 유치"
 LR_FRA_private_capital_desc:0 "로칠드와 리옹 크레디는 나라를 사랑합니다. 수익률이 맞는다면. 규제를 풀고 세금을 깎아 그들의 금고를 엽니다."
 LR_FRA_artisans:0 "장인 전통의 산업화"
 LR_FRA_artisans_desc:0 "파리 공방에서 자란 숙련공은 어떤 기계보다 정밀합니다. 그런데 그들은 조립 라인을 싫어합니다. 그들을 라인의 끝이 아니라 머리에 앉힙니다."
 LR_FRA_lyon_chemicals:0 "리옹 화학 공업"
 LR_FRA_lyon_chemicals_desc:0 "리옹의 염색 공장은 하룻밤 사이에 폭약 공장이 될 수 있습니다. 대전쟁이 가르쳐 준 불편한 사실입니다. 론강 유역의 화학 공업에 투자합니다."
 LR_FRA_research_network:0 "국립 연구 기관"
 LR_FRA_research_network_desc:0 "소르본과 공장과 군대는 서로 말을 섞지 않았습니다. 학자는 군인을 무식하다고 하고, 군인은 학자를 쓸모없다고 합니다. 그 셋을 한 책상에 앉힙니다."
 LR_FRA_arsenal_of_republic:0 "프랑스의 병기창"
 LR_FRA_arsenal_of_republic_desc:0 "산업이 목표에 닿았습니다. 대륙에서 가장 큰 병기창이 프랑스의 이름을 다시 무겁게 만듭니다. 승전국들의 대사관에서 보고서가 늘어납니다."
 LR_FRA_petain_school:0 "방어 우선 교리"
 LR_FRA_petain_school_desc:0 "베르됭의 원수는 화력이 죽이고 요새가 지킨다고 가르칩니다. 병사의 피를 아끼는 전쟁입니다. 그 교훈을 육군의 교리로 삼습니다."
 LR_FRA_degaulle_school:0 "기갑 우선 교리"
 LR_FRA_degaulle_school_desc:0 "키 큰 대령 하나가 쓴 얇은 책이 장교들 사이에서 몰래 돌고 있습니다. 직업 군대, 한곳에 모은 전차, 그리고 속도. 그 책을 교범으로 삼습니다."
 LR_FRA_saint_cyr:0 "생시르 개혁"
 LR_FRA_saint_cyr_desc:0 "생시르 사관학교는 오랫동안 이름 있는 집안의 아들들만 받았습니다. 이제 출신이 아니라 시험으로 뽑습니다. 귀족 자제 옆에 코르시카와 알자스의 소년들이 앉습니다."
 LR_FRA_heavy_artillery:0 "75mm의 후계자"
 LR_FRA_heavy_artillery_desc:0 "75mm의 영광 뒤에서 포병대는 더 큰 구경을 원합니다. 포병 장교들의 논문이 십 년째 참모부 책상에 쌓여 있습니다. 그 논문을 이제 설계도로 바꿉니다."
 LR_FRA_char_b:0 "샤르 B 계획"
 LR_FRA_char_b_desc:0 "두꺼운 장갑과 무거운 포. 공장장들은 비싸다고 하고 전차병들은 첫눈에 반했습니다. 샤르 B 전차를 양산합니다."
 LR_FRA_foreign_legion:0 "외인부대 확대"
 LR_FRA_foreign_legion_desc:0 "과거를 묻지 않는 부대입니다. 시디벨아베스의 연병장에 유럽 곳곳의 패배자들이 모여듭니다. 외인부대의 정원을 늘립니다."
 LR_FRA_fighter_school:0 "전투기 학교"
 LR_FRA_fighter_school_desc:0 "대전쟁의 에이스들은 늙었고, 그 뒤를 이을 조종사가 없습니다. 조종사 한 명을 키우는 데는 비행기 한 대를 만드는 것보다 오래 걸립니다. 전투기 학교를 세웁니다."
 LR_FRA_submarine_arm:0 "잠수함대"
 LR_FRA_submarine_arm_desc:0 "영국 해군과 정면으로 싸울 수는 없습니다. 그러나 런던의 빵과 기름은 배로 옵니다. 잠수함대를 키웁니다."
 LR_FRA_bomber_command:0 "폭격기 사령부"
 LR_FRA_bomber_command_desc:0 "두에의 책을 읽은 장교들이 라인강 공업 지대에 동그라미를 칩니다. 육군은 그 돈이면 전차가 몇 대냐고 묻습니다. 폭격기 사령부를 세웁니다."
 LR_FRA_battleline:0 "주력 함대"
 LR_FRA_battleline_desc:0 "지중해에서 프랑스 전함을 본 지 오랩니다. 리슐리외의 이름을 단 새 전함이 진수대에 오를 준비를 합니다. 주력 함대를 다시 세웁니다."
 LR_FRA_general_mobilisation:0 "총동원"
 LR_FRA_general_mobilisation_desc:0 "1793년의 총동원령을 기억하는 나라입니다. 공장과 철도와 학교, 나라의 모든 시계를 전쟁 시간에 맞춥니다. 예비군 명부를 다시 펼칩니다."
 LR_ORL_duke:0 "오를레앙의 왕"
 LR_ORL_duke_desc:0 "장교단이 늙은 부르봉 왕을 내치고 오를레앙 공 장을 옹립했습니다. 새 왕은 즉위 연설에서 복수라는 단어를 일곱 번 말했습니다. 군대가 세운 왕은 군대에 빚을 졌고, 그 빚은 라인강에서 갚아야 합니다."
 LR_ORL_shell_bills:0 "유령회사 어음"
 LR_ORL_shell_bills_desc:0 "의회는 군비 예산을 한 푼도 늘려 주지 않습니다. 그래서 서류상의 회사가 서류상의 어음을 찍고, 국가은행이 말없이 그것을 사들입니다. 장부에 없는 돈이 생테티엔의 선반을 돌립니다."
 LR_ORL_radical_rearm:0 "급진적 재무장"
 LR_ORL_radical_rearm_desc:0 "배상 위원회의 감독관들을 파리에서 내보내고, 그들이 들여다보던 장부를 불태웁니다. 왕의 재무장은 이제 비밀이 아닙니다. 런던이 무엇을 할지는 런던의 사정입니다."
 LR_ORL_calais:0 "노르파드칼레 재무장"
 LR_ORL_calais_desc:0 "대전쟁 뒤 왕실은 영국의 눈치를 보며 칼레와 됭케르크의 해안 포대를 철거했습니다. 해협의 프랑스 쪽 해안은 스무 해 동안 비어 있었습니다. 대대가 다시 그 해안으로 행진해 들어가고, 런던은 항의문을 보냅니다."
 LR_ORL_algeria:0 "알제리 진압"
 LR_ORL_algeria_desc:0 "늙은 왕이 잃은 알제리를 새 왕이 되찾습니다. 알제리를 버린 것이 부르봉 왕가가 무너진 이유였습니다. 마르세유에서 출항하는 군함마다 알제리는 프랑스다라는 글씨가 페인트로 적혀 있습니다."
 LR_ORL_rhine:0 "라인강으로"
 LR_ORL_rhine_desc:0 "라인강은 리슐리외 이래 모든 프랑스 왕이 꿈꾼 자연 국경입니다. 1918년 프로이센은 그 강을 다시 가져갔습니다. 군대가 준비되었습니다. 이번에는 프로이센이 조약을 들고 달려와도 받아 주지 않습니다."
 LR_ORL_danube:0 "빈으로"
 LR_ORL_danube_desc:0 "대전쟁에서 가장 많은 몫을 챙긴 것은 빈이었습니다. 합스부르크는 이탈리아를 누르고, 우크라이나에 대공을 앉히고, 프랑스의 패배를 축배로 마셨습니다. 왕의 군대가 도나우를 거슬러 그 몫을 받으러 갑니다."
 LR_ORL_channel:0 "해협 건너로"
 LR_ORL_channel_desc:0 "정복왕 윌리엄 이후 아무도 해협 건너편에 프랑스의 깃발을 세우지 못했습니다. 1918년의 항복 문서를 받아 간 것은 런던이었습니다. 왕의 함대와 상륙 부대가 영국 해안을 향해 출항 준비를 합니다."
 LR_ORL_russia:0 "동쪽의 적"
 LR_ORL_russia_desc:0 "프로이센과 합스부르크와 영국이 무너졌습니다. 왕의 유럽에 남은 마지막 적은 공화국의 깃발을 든 동쪽의 거인입니다. 러시아 공화국이 살아 있는 한 왕관들은 편히 잠들지 못합니다."
 LR_BOU_restored:0 "왕좌의 안정"
 LR_BOU_restored_desc:0 "오를레앙 공의 쿠데타는 튈르리 궁 앞에서 꺾였습니다. 반란 장교들은 재판정에 섰고, 늙은 루이 20세는 다시 왕좌에 앉았습니다. 이제 왕좌가 그저 살아남은 것이 아니라 프랑스에 필요하다는 것을 보여 줘야 합니다."
 LR_BOU_family_pact:0 "가문 협약"
 LR_BOU_family_pact_desc:0 "1761년 파리와 마드리드의 부르봉 왕가는 가문 협약을 맺고 함께 영국과 싸웠습니다. 그 협약은 혁명과 함께 잊혔습니다. 왕이 마드리드의 사촌에게 옛 협약을 되살리자는 편지를 씁니다."
 LR_BOU_two_sicilies:0 "나폴리의 사촌"
 LR_BOU_two_sicilies_desc:0 "나폴리의 사촌은 이탈리아 통일을 꿈꾸지만 빈의 눈치를 봅니다. 왕은 그에게 약속합니다. 스스로 이탈리아를 통일한다면 프랑스가 뒤를 봐주겠다고. 아직 조약은 없고 편지만 오갑니다."
 LR_BOU_italy:0 "이탈리아 통일전쟁"
 LR_BOU_italy_desc:0 "토리노와 로마와 피렌체와 나폴리가 서로에게 선전포고했습니다. 그 뒤에는 오스트리아가 있습니다. 프랑스는 공식적으로 교전국이 아니지만, 나폴리의 사촌 편에 의용 사단과 소총을 보냅니다."
 LR_BOU_diplomatic_rearm:0 "재무장 협상"
 LR_BOU_diplomatic_rearm_desc:0 "왕실은 스무 해 동안 군대를 두려워해 굶겼습니다. 이제 다시 무장해야 하지만 런던과 빈을 자극할 필요는 없습니다. 런던에는 러시아 공화국의 위협을, 빈에는 혁명의 공포를 이야기하며 재무장을 설명합니다."
 LR_BOU_open_rearm:0 "막가파 재무장"
 LR_BOU_open_rearm_desc:0 "외교관들이 빈손으로 돌아왔습니다. 런던은 프랑스의 재무장을 위협으로 볼 것이고, 그건 어떻게 설명해도 마찬가지입니다. 왕이 직접 재무장 칙령에 서명합니다. 허락은 구하지 않습니다."
 LR_BOU_algeria:0 "알제리 진압"
 LR_BOU_algeria_desc:0 "알제리를 포기한 일은 왕좌를 거의 무너뜨렸습니다. 쿠데타를 꺾은 왕이 같은 땅을 왕의 이름으로 되찾으려 합니다. 이번에는 왕실 근위대가 원정군의 맨 앞에 섭니다."
 LR_BOU_rhine:0 "라인강으로"
 LR_BOU_rhine_desc:0 "루이 14세는 라인강을 프랑스의 강으로 만들려고 평생을 싸웠습니다. 1918년 그 강변의 땅은 다시 프로이센의 것이 되었습니다. 부르봉의 군대가 태양왕의 지도를 다시 꺼냅니다."
 LR_BOU_danube:0 "빈으로"
 LR_BOU_danube_desc:0 "앙리 4세 이래 부르봉 왕가의 적은 언제나 합스부르크였습니다. 빈은 대전쟁 뒤 이탈리아를 누르고 나폴리의 사촌을 위협해 왔습니다. 이탈리아를 위해, 그리고 오랜 과업을 끝내려고 군대가 도나우로 향합니다."
 LR_BOU_channel:0 "해협 건너로"
 LR_BOU_channel_desc:0 "영국은 귀족들이 왕을 장식물로 만든 나라입니다. 그 나라가 1918년 유럽의 질서를 정했습니다. 진정한 왕정이 무엇인지 보여 주려고 왕의 함대가 해협으로 나갑니다."
 LR_BOU_russia:0 "동쪽의 적"
 LR_BOU_russia_desc:0 "러시아 공화국은 차르를 몰아내고 세운 나라입니다. 그 존재만으로 유럽의 모든 왕관이 흔들립니다. 프로이센과 영국이 무너진 지금, 왕을 처형한 자들의 나라와 맞설 차례입니다."
 LR_COM_commune:0 "코뮌의 깃발"
 LR_COM_commune_desc:0 "1871년의 코뮌은 72일 만에 페르 라셰즈 묘지의 벽 앞에서 끝났습니다. 총선에서 이긴 사회주의자들이 시청 첨탑에 다시 붉은 깃발을 올립니다. 공화국이 노동자의 이름으로 다시 태어나고, 이번에는 끝을 정해 두지 않았습니다."
 LR_COM_workers_control:0 "노동자 통제"
 LR_COM_workers_control_desc:0 "혁명 첫날 사장들이 달아난 공장에서 노동자들은 이미 기계를 돌리고 있습니다. 코뮌이 그것을 법으로 만듭니다. 사장실 문에 인민 재산이라는 쪽지가 붙고, 선반공 대표가 이번 달 생산량을 정합니다."
 LR_COM_one_country:0 "일국사회주의"
 LR_COM_one_country_desc:0 "유럽의 왕들은 언제든 국경을 넘어올 수 있습니다. 혁명을 수출하자는 동지들도 많지만, 이 땅의 사회주의가 무너지면 수출할 것도 없습니다. 먼저 프랑스의 코뮌을 지킵니다."
 LR_COM_world_revolution:0 "세계 혁명"
 LR_COM_world_revolution_desc:0 "혁명에 국경은 없습니다. 베를린과 밀라노와 맨체스터의 노동자들이 파리를 지켜보고 있습니다. 파리의 깃발은 시작일 뿐이며, 모든 노동자가 코뮌의 시민입니다."
 LR_COM_annex_algeria:0 "알제리 혁명 원정"
 LR_COM_annex_algeria_desc:0 "코뮌에 식민지는 없습니다. 있는 것은 형제 코뮌이 될 알제리뿐입니다. 그렇게 믿지 않는 민족주의자들에게 믿게 해 줄 붉은 군대가 마르세유에서 출발합니다."
 LR_COM_algerian_comrades:0 "알제리 동지들"
 LR_COM_algerian_comrades_desc:0 "알제리를 정복하는 대신 그 땅의 혁명을 돕습니다. 오랑과 알제의 노동자 동지들에게 무기와 교관을 보냅니다. 민족주의자들의 공화국 안에서 붉은 내전이 시작됩니다."
 LR_COM_rhine:0 "라인강으로"
 LR_COM_rhine_desc:0 "독일 노동자는 적이 아닙니다. 적은 그들의 왕과 융커입니다. 루르의 광부들은 파리 방송을 몰래 듣습니다. 혁명군이 라인강을 건너 전단과 총을 함께 나눠 줍니다."
 LR_COM_channel:0 "해협 건너로"
 LR_COM_channel_desc:0 "100년 전 맨체스터와 글래스고의 차티스트들은 보통선거를 외치다 감옥에 갔습니다. 그 후예들이 아직 귀족 의회 아래서 일합니다. 코뮌의 함대가 해협을 건너고, 그들은 이날을 기다려 왔습니다."
 LR_COM_danube:0 "빈으로"
 LR_COM_danube_desc:0 "합스부르크의 제국은 민족의 감옥입니다. 빈의 궁전 앞에 프라하와 부다페스트의 노동자들이 서 있습니다. 혁명군이 도나우를 따라 그 감옥에 문을 내러 갑니다."
 LR_JAC_committee:0 "공안위원회"
 LR_JAC_committee_desc:0 "왕이 달아난 파리는 굶주리고 일자리가 없습니다. 산악파는 1793년의 이름을 빌려 공안위원회를 다시 세웁니다. 로베스피에르의 이름은 여전히 사람들을 두렵게 하지만, 이번 위원회의 칼날은 굶주림과 실업을 향합니다."
 LR_JAC_social_contract:0 "사회 계약"
 LR_JAC_social_contract_desc:0 "루소는 나라와 시민이 서로를 지키는 계약을 맺는다고 썼습니다. 산악파 정부의 첫 법안이 그 책에서 이름을 빌립니다. 나라는 시민의 삶을 지키고, 시민은 나라를 지킵니다."
 LR_JAC_labour_code:0 "노동법"
 LR_JAC_labour_code_desc:0 "왕정은 파업을 범죄로 다스렸습니다. 파업권과 단체 교섭을 법전에 넣는 법안이 의회에 오릅니다. 공장주들은 비명을 지르고, 노동총동맹은 의사당 앞에서 노래합니다."
 LR_JAC_public_works:0 "국가 공공사업"
 LR_JAC_public_works_desc:0 "실업자 수십만 명이 파리 외곽의 판자촌에서 겨울을 납니다. 공화국이 그들에게 삽을 줍니다. 그들이 지은 도로와 댐과 공장은 나라의 재산으로 남습니다."
 LR_JAC_nationalise:0 "기간산업 국유화"
 LR_JAC_nationalise_desc:0 "철도와 석탄은 200대 가문의 재산이기 전에 공화국의 혈관입니다. 대전쟁 때 그 가문들은 군수품 값을 올려 받았습니다. 긴 의회 싸움 끝에 국유화 법안을 밀어붙입니다."
 LR_JAC_public_school:0 "공화국 학교"
 LR_JAC_public_school_desc:0 "쥘 페리는 무상 의무 교육을 시작했지만 왕정은 그 예산을 깎았습니다. 시골 학교의 절반은 교사가 하나뿐입니다. 프랑스의 모든 아이가 자유, 평등, 박애를 받아 적을 때까지 학교를 짓습니다."
 LR_JAC_reclaim_algeria:0 "알제리 수복 결정"
 LR_JAC_reclaim_algeria_desc:0 "혁명은 알제리에서 군대를 빼겠다는 약속으로 시작했습니다. 공안위원회는 이제 그 약속을 거둡니다. 반혁명 세력이 알제를 거점으로 삼았고, 공화국의 국경은 지중해 건너까지라는 것입니다. 의회는 전쟁을 승인했지만, 시청 벽의 첫 포고문은 아직 떼어지지 않았습니다. 남은 문제는 누구를 보내느냐입니다. 왕의 장군들은 공화국을 믿지 않고, 공화국도 그들을 믿지 않습니다."
 LR_JAC_republican_army:0 "공화국 군대"
 LR_JAC_republican_army_desc:0 "왕의 장교들을 믿을 수는 없지만 다른 장교도 없습니다. 공화국은 왕의 임관장을 서랍에 넣어 둔 장교들을 하나씩 시민의 장교로 바꿔 나갑니다. 승진은 출신이 아니라 시험과 전공으로 정합니다."
 LR_JAC_rhine:0 "라인강의 깃발"
 LR_JAC_rhine_desc:0 "1792년 공화국의 의용병들은 라 마르세예즈를 부르며 라인강으로 향했습니다. 1918년 그 강변을 다시 잃었습니다. 공화국의 군대가 자유를 외치며 같은 길을 갑니다."
 LR_JAC_channel:0 "해협 건너로"
 LR_JAC_channel_desc:0 "웨스트민스터를 쥔 것은 귀족과 대상인의 의회입니다. 그 의회가 1918년 프랑스의 항복을 받았습니다. 귀족 공화국은 자유를 말할 자격이 없습니다. 공화국의 군대가 해협을 건넙니다."
 LR_JAC_danube:0 "빈으로"
 LR_JAC_danube_desc:0 "합스부르크는 열두 민족을 한 왕관 아래 묶어 두고 있습니다. 공화국은 그 민족들에게 인권 선언문 번역본을 보냅니다. 포병대가 그 뒤를 따릅니다."
 LR_JAC_russia:0 "동쪽의 적"
 LR_JAC_russia_desc:0 "러시아도 공화국이지만 페테르부르크의 혁명은 파리의 혁명이 아닙니다. 케렌스키의 정부는 동쪽의 작은 왕국들을 다시 삼키려 합니다. 프로이센과 영국이 무너진 지금, 두 공화국 중 누가 유럽을 이끌지 정할 차례입니다."
 LR_JAC_majority:0 "의회 과반"
 LR_JAC_majority_desc:0 "산악파는 지금까지 연립 상대의 비위를 맞추며 예산을 통과시켰습니다. 선거구마다 공장 노동자들이 투표소로 나갔습니다. 드디어 과반입니다."
 LR_JAC_reform_act:0 "개혁 입법"
 LR_JAC_reform_act_desc:0 "과반을 얻자 위원회에서 잠자던 개혁 법안 묶음이 하루 만에 본회의에 오릅니다. 노동법, 학교법, 세법이 한꺼번에 통과됩니다. 반대파는 회의장을 떠나며 서류를 던집니다."
 LR_JAC_supermajority:0 "개헌 의석"
 LR_JAC_supermajority_desc:0 "3분의 2는 헌법을 고칠 수 있는 의석입니다. 산악파는 이제 혼자서 공화국의 헌법을 쓸 수 있습니다. 반대파는 의사당을 나가며 독재를 외칩니다."
 LR_GIR_cabinet:0 "지롱드 내각"
 LR_GIR_cabinet_desc:0 "왕이 달아난 뒤 보르도의 포도주 상인과 리옹의 은행가들이 내각에 들어왔습니다. 1793년 지롱드파는 파리의 군중에게 쫓겨났습니다. 그들은 프랑스를 일으키는 것이 국가가 아니라 시장이라고 믿습니다."
 LR_GIR_deregulation:0 "탈규제"
 LR_GIR_deregulation_desc:0 "공장 하나를 지으려면 관청 일곱 곳에서 서류를 받아야 합니다. 왕정의 관료제는 대전쟁 뒤 더 두꺼워졌습니다. 규제를 걷어 내고, 공장을 짓겠다는 사람을 말리는 일을 불법으로 만듭니다."
 LR_GIR_free_trade:0 "자유 무역"
 LR_GIR_free_trade_desc:0 "왕정은 영국 상품에 높은 관세를 매겼고, 영국도 프랑스 포도주에 똑같이 했습니다. 관세를 내리자 해협을 오가는 배가 늘어납니다. 노동조합은 항의하고 항구 도시는 호황입니다."
 LR_GIR_algeria:0 "알제리 진압"
 LR_GIR_algeria_desc:0 "알제리의 철광과 포도밭은 투자처로도 꽤 매력적입니다. 반란이 길어질수록 보르도 상인들의 손해도 커집니다. 주주들이 조용히 군대 파견을 지지합니다."
 LR_GIR_rhine:0 "라인강으로"
 LR_GIR_rhine_desc:0 "루르의 석탄과 라인강의 항로는 프랑스 산업의 오랜 갈증입니다. 1918년 그 땅은 프로이센의 것이 되었습니다. 은행가들이 이렇게 전쟁을 지지한 적은 없었습니다."
 LR_GIR_danube:0 "빈으로"
 LR_GIR_danube_desc:0 "도나우강은 유럽에서 가장 긴 시장입니다. 합스부르크는 그 강을 따라 관세 장벽을 세우고 프랑스 상품을 막았습니다. 시장을 막는 왕조는 치워야 합니다."
 LR_GIR_channel:0 "해협 건너로"
 LR_GIR_channel_desc:0 "시티 오브 런던은 세계의 돈이 모이는 곳입니다. 1918년 이후 프랑스의 배상금도 그곳으로 갔습니다. 런던을 쓰러뜨리면 세계 금융의 중심이 파리로 온다는 계산이 이 전쟁의 이유입니다."
 LR_GIR_russia:0 "동쪽의 적"
 LR_GIR_russia_desc:0 "러시아 공화국은 사유재산을 부정하는 혁명 위에 서 있습니다. 페테르부르크의 선동가들은 리옹의 공장에도 전단을 뿌립니다. 시장의 공화국과 혁명의 공화국 가운데 하나만 유럽에 남을 수 있습니다."
 LR_GIR_majority:0 "의회 과반"
 LR_GIR_majority_desc:0 "상공회의소들의 후원금이 표로 돌아왔습니다. 지방 도시의 상인과 장인들이 지롱드에 표를 몰아주었습니다. 드디어 과반입니다. 세금 이야기를 꺼낼 수 있습니다."
 LR_GIR_reform_act:0 "개혁 입법"
 LR_GIR_reform_act_desc:0 "과반을 얻자 회사법 전면 개정안이 본회의에 오릅니다. 주식회사 설립에 필요한 서류가 열두 장에서 두 장으로 줍니다. 법이 통과된 다음 날 파리 증권거래소가 사상 최고치를 찍습니다."
 LR_GIR_supermajority:0 "개헌 의석"
 LR_GIR_supermajority_desc:0 "개헌선을 넘겼습니다. 지롱드는 재산권을 헌법 제1조로 올리려 합니다. 산악파는 그것이 200대 가문을 위한 헌법이라고 외칩니다."
 LR_MAR_cabinet:0 "푀양파 내각"
 LR_MAR_cabinet_desc:0 "1791년 푀양파는 혁명을 헌법에서 멈추자고 했다가 실패했습니다. 왕이 달아난 뒤 그 이름이 다시 의회에 등장했습니다. 질서와 재산과 헌법 아래의 왕. 지방 명사들이 내각을 꾸립니다."
 LR_MAR_constitution:0 "입헌군주정 헌법"
 LR_MAR_constitution_desc:0 "푀양파는 왕을 다시 모시되 헌법 아래에 두려 합니다. 왕은 있으되 통치하지 않습니다. 영국식이라는 비난에 그들은 답합니다. 적어도 영국은 전쟁에 이겼다고."
 LR_MAR_order:0 "질서 회복"
 LR_MAR_order_desc:0 "왕이 달아난 뒤 파리의 거리는 깃발과 바리케이드로 가득합니다. 상점 주인들은 셔터를 내린 지 석 달째입니다. 헌병이 거리로 돌아오고, 파업 지도자들에게 재판과 벌금이 내려집니다."
 LR_MAR_algeria:0 "알제리 진압"
 LR_MAR_algeria_desc:0 "왕정을 무너뜨린 것은 알제리의 수렁이었습니다. 질서를 되찾은 정부는 그 수렁도 끝내야 합니다. 정규군이 체면을 되찾으러 다시 지중해를 건넙니다."
 LR_MAR_rhine:0 "라인강으로"
 LR_MAR_rhine_desc:0 "빈 회의 이래 프랑스의 안전은 언제나 라인강에 달려 있었습니다. 1918년 그 강변을 다시 잃었습니다. 신중한 보수 정부도 이 일만큼은 급진적입니다."
 LR_MAR_danube:0 "빈으로"
 LR_MAR_danube_desc:0 "푀양파는 입헌 군주끼리는 대화가 통할 줄 알았습니다. 빈 협상에 사절을 보냈고 대사도 돌아왔습니다. 그러나 합스부르크는 이탈리아도 우크라이나도 내놓을 생각이 없습니다. 대화가 끝난 자리에서 군대가 움직입니다."
 LR_MAR_channel:0 "해협 건너로"
 LR_MAR_channel_desc:0 "푀양파에게 영국은 모범이자 숙적입니다. 그들은 웨스트민스터를 본떠 헌법을 썼고, 그 의회가 1918년 프랑스의 항복을 받았습니다. 존경하는 상대를 쓰러뜨리는 일이 가장 어렵습니다."
 LR_MAR_russia:0 "동쪽의 적"
 LR_MAR_russia_desc:0 "러시아 공화국은 질서의 적이고 왕 없는 대국입니다. 페테르부르크의 혁명은 유럽 모든 공장의 담벼락에 붉은 별을 그렸습니다. 프로이센과 영국이 무너진 지금, 동쪽의 위협을 끝낼 차례입니다."
 LR_MAR_majority:0 "의회 과반"
 LR_MAR_majority_desc:0 "지방 명사들의 조직표가 드디어 파리에 도착했습니다. 시골 장터와 성당 앞에서 모은 표입니다. 푀양파가 의회 과반을 차지하고, 정부가 처음으로 안정을 얻습니다."
 LR_MAR_reform_act:0 "개혁 입법"
 LR_MAR_reform_act_desc:0 "과반이 생겼으니 법을 바꿀 수 있습니다. 개혁이라고 부르지만 대부분 혁명기의 법을 되돌리는 법안입니다. 노동자 신문들은 이것을 반혁명 입법이라고 부릅니다."
 LR_MAR_supermajority:0 "개헌 의석"
 LR_MAR_supermajority_desc:0 "헌법을 고칠 수 있는 3분의 2 의석입니다. 푀양파는 이제 혼자서 헌법을 쓸 수 있습니다. 왕의 귀환을 막을 것은 더는 아무것도 없습니다."
 LR_NAP_first_consul:0 "제1통령"
 LR_NAP_first_consul_desc:0 "아무나 보내라던 그 아무나가 알제리를 평정하고 파리로 진군했습니다. 의회는 저항 한 번 못 하고 무너졌습니다. 서른다섯 살의 코르시카인은 잠을 네 시간만 자고 모든 부처의 서류를 다시 읽습니다."
 LR_NAP_civil_code:0 "나폴레옹 법전"
 LR_NAP_civil_code_desc:0 "프랑스에는 아직 지방마다 다른 관습법이 360가지나 됩니다. 제1통령은 혁명의 평등과 재산권을 하나의 법전으로 묶으려 합니다. 법률가 마흔 명이 국무원에서 밤을 새우고, 통령이 새벽에 들어와 한 줄씩 지웁니다."
 LR_NAP_bank_of_france:0 "프랑스 은행"
 LR_NAP_bank_of_france_desc:0 "돈이 없으면 대포도 없습니다. 프랑스 은행은 200대 주주의 것이었고, 정부가 바뀔 때마다 국채 이자를 올려 받았습니다. 통령이 은행을 틀어쥐고 이자를 깎자 증권가가 그에게 경례합니다."
 LR_NAP_legion_of_honour:0 "레지옹 도뇌르"
 LR_NAP_legion_of_honour_desc:0 "왕정의 훈장은 가문을 따라 주어졌습니다. 통령은 태생이 아니라 공적으로 주는 훈장을 만듭니다. 병사도 교사도 기술자도 같은 붉은 리본을 답니다. 프랑스의 새 귀족이 그렇게 만들어집니다."
 LR_NAP_concordat:0 "정교 협약"
 LR_NAP_concordat_desc:0 "혁명과 왕정 사이에서 교회는 늘 왕의 편이었습니다. 시골 사제들은 아직 통령을 찬탈자라 부릅니다. 무신론자도 왕당파도 아닌 통령이 교황과 협약을 맺고, 사제들의 봉급을 국가가 냅니다."
 LR_NAP_coronation:0 "대관식"
 LR_NAP_coronation_desc:0 "원로원이 왕관을 내밀었습니다. 노트르담의 제단 앞에서 교황이 왕관을 들어 올리자, 그가 그것을 받아 스스로 씁니다. 공화국의 시대가 이렇게 끝나고 프랑스 제국이 섭니다."
 LR_NAP_continental_system:0 "대륙봉쇄"
 LR_NAP_continental_system_desc:0 "영국 함대는 프랑스 함대보다 세 배 큽니다. 바다에서 이길 수 없다면 장부로 이깁니다. 대륙의 모든 항구에서 영국 상품을 몰아내고, 함대로는 못 이기는 상대를 굶깁니다."
 LR_NAP_grande_armee:0 "대육군"
 LR_NAP_grande_armee_desc:0 "1918년의 프랑스군은 병과별로 흩어져 싸웠습니다. 황제는 보병과 포병과 전차를 한 군단에 묶습니다. 군단마다 스스로 싸울 수 있는 작은 군대가 됩니다. 포병 장교 출신 황제가 전쟁을 다시 씁니다."
 LR_NAP_marshals:0 "원수단"
 LR_NAP_marshals_desc:0 "모든 병사의 배낭 속에 원수의 지휘봉이 있다고 황제는 말합니다. 술집 주인의 아들과 통 만드는 사람의 아들이 그 말을 믿고 따라왔습니다. 그들이 프랑스 원수의 지휘봉을 받습니다."
 LR_NAP_rhine:0 "다시 라인강으로"
 LR_NAP_rhine_desc:0 "라인강 건너의 독일 군주들은 1918년 프로이센 편에서 싸웠습니다. 황제는 그들에게 선택지를 줍니다. 보호받거나, 짓밟히거나. 대육군이 라인강으로 향합니다."
 LR_NAP_boulogne:0 "불로뉴의 진영"
 LR_NAP_boulogne_desc:0 "불로뉴 해안에 대육군이 집결했습니다. 병사들은 날마다 백악 절벽 너머 영국 해안을 내려다봅니다. 황제는 안개가 걷히는 날만 기다립니다."
 LR_NAP_danube:0 "아우스터리츠로"
 LR_NAP_danube_desc:0 "이 세계에서 아우스터리츠라는 지명을 아는 사람은 거의 없습니다. 모라비아의 작은 마을일 뿐입니다. 대육군이 도나우를 따라 빈으로 향하고, 곧 모두가 그 이름을 알게 될 것입니다."
 LR_NAP_moscow:0 "모스크바로"
 LR_NAP_moscow_desc:0 "러시아 공화국은 동쪽에서 마지막으로 남은 적입니다. 황제는 이번에는 겨울이 오기 전에 끝낸다고 말합니다. 측근들은 그 말을 왜 그렇게 불길하게 느끼는지 스스로도 설명하지 못합니다."
 LR_NAP_guardian:0 "공화국의 수호자"
 LR_NAP_guardian_desc:0 "모두가 왕관을 기다립니다. 그는 연미복을 입고 나타나 왕관을 치웁니다. 프랑스에 필요한 것은 황제가 아니라 공화국이라고. 원수들은 그 말을 믿을 수 없다는 얼굴로 듣습니다."
 LR_GUA_oath:0 "대통령 선서"
 LR_GUA_oath_desc:0 "원로원이 내민 왕관을 치운 사람이 대통령 선서를 합니다. 나폴레옹 보나파르트가 군복을 벗고 헌법에 손을 얹습니다. 온 유럽이 언제까지 저 손이 거기 있을지 지켜봅니다."
 LR_GUA_civilian_control:0 "군의 문민 통제"
 LR_GUA_civilian_control_desc:0 "그는 쿠데타로 권력을 잡았습니다. 그래서 그 길을 스스로 막아야 합니다. 장군은 의회의 질문에 답해야 한다는 법이 통과됩니다. 대통령 자신도 예외가 아닙니다."
 LR_GUA_suffrage:0 "보통선거 보장"
 LR_GUA_suffrage_desc:0 "왕정은 재산 있는 남자에게만 표를 주었습니다. 남자와 여자, 파리와 코르시카를 가리지 않고 모든 시민이 투표하는 법이 의회에 오릅니다. 어떤 혁명도 하지 못한 일입니다."
 LR_GUA_social_insurance:0 "사회 보험"
 LR_GUA_social_insurance_desc:0 "대전쟁은 프랑스를 부상병의 나라로 만들었습니다. 그 나라에서 사회 보험은 복지가 아니라 빚 갚기입니다. 대통령이 직접 연금 법안을 들고 의회에 갑니다."
 LR_GUA_constitution:0 "공화국 헌법"
 LR_GUA_constitution_desc:0 "황제가 될 수 있었던 사람이 헌법을 씁니다. 대통령 임기를 못 박고 연임을 한 번으로 제한합니다. 다시는 누구도 황제가 되지 못하게 하는 헌법입니다."
 LR_GUA_citizen_army:0 "시민의 군대"
 LR_GUA_citizen_army_desc:0 "대육군의 전술은 그대로 두고 그 정신을 바꿉니다. 병사는 황제가 아니라 헌법에 선서합니다. 장교의 승진은 대통령이 아니라 의회의 국방 위원회가 승인합니다."
 LR_GUA_rhine:0 "공화국의 라인 원정"
 LR_GUA_rhine_desc:0 "왕들의 유럽에 공화국의 군대가 들어갑니다. 대통령은 해방자가 약탈자가 되는 순간 공화국도 끝난다고 믿습니다. 약탈 금지 명령서가 총알보다 먼저 배포됩니다."
 LR_GUA_channel:0 "해협 건너로"
 LR_GUA_channel_desc:0 "웨스트민스터의 의회는 귀족과 대상인이 쥐고 있습니다. 영국 시민 대부분은 한 번도 투표해 본 적이 없습니다. 웨스트민스터가 무너지면 그들도 처음으로 투표할 것입니다. 그것이 이 전쟁의 대의입니다."
 LR_GUA_danube:0 "도나우의 자유"
 LR_GUA_danube_desc:0 "합스부르크 제국에는 열두 민족이 삽니다. 대통령이 헝가리와 체코의 민족 위원회에 전보를 칩니다. 자유 도나우 연방을 함께 세우자고. 공화국의 군대가 그 전보를 따라 도나우로 갑니다."
 LR_GUA_russia:0 "동쪽의 적"
 LR_GUA_russia_desc:0 "러시아 공화국과의 전쟁을 원하는 사람은 왕들뿐이었습니다. 그러나 페테르부르크는 동쪽의 작은 나라들을 다시 삼키려 합니다. 두 공화국 가운데 누가 유럽의 자유를 지킬지 정할 때가 왔습니다."
 LR_GUA_amnesty:0 "대사면"
 LR_GUA_amnesty_desc:0 "쿠데타의 상처는 아직 감옥에 갇혀 있습니다. 왕당파 장교도, 코뮌 투사도 감옥 문을 나옵니다. 측근들은 모두 반대했습니다. 대통령은 공화국이 원수를 두려워하지 않는다는 것을 보여 주려 합니다."
 LR_GUA_league_of_republics:0 "공화국 동맹"
 LR_GUA_league_of_republics_desc:0 "왕들의 유럽에서 공화국은 몇 되지 않습니다. 대통령이 대서양 건너의 대륙군과 페테르부르크와 헤이그에 전보를 보냅니다. 왕 없는 나라들이 처음으로 서로를 찾습니다."
 LR_ORL_youth:0 "국민청년단"
 LR_ORL_youth_desc:0 "패전을 기억하지 못하는 세대가 자라고 있습니다. 오를레앙의 청년단은 그들에게 제복과 횃불과 합창을 줍니다. 그리고 1918년의 분노를 아버지 대신 가르칩니다."
 LR_ORL_veterans:0 "재향군인회"
 LR_ORL_veterans_desc:0 "훈장을 단 채 길에서 구걸하던 참전 용사들이 왕의 제복을 다시 입습니다. 그들은 왕실이 버린 군대의 생존자입니다. 이들이 왕 곁에 서 있는 한 어느 장관도 왕에게 반대하지 못합니다."
 LR_ORL_tear_up_treaty:0 "강화 조약 파기"
 LR_ORL_tear_up_treaty_desc:0 "왕이 1918년 강화 조약의 배상 조항을 의사당 단상에서 찢습니다. 프랑스는 더는 런던의 채무자가 아닙니다. 영국 대사가 자리를 박차고 나가도 박수는 멈추지 않습니다."
 LR_ORL_secret_staff:0 "비밀 참모본부"
 LR_ORL_secret_staff_desc:0 "늙은 부르봉 왕은 쿠데타를 두려워해 참모본부 작전과를 해체했습니다. 그래서 측량국이라는 간판을 단 건물에 대령 서른 명이 출근합니다. 그들의 측량 지도에는 라인강의 다리들만 그려져 있습니다."
 LR_ORL_press_control:0 "언론 통제"
 LR_ORL_press_control_desc:0 "혁명의 신문들은 아직 지하에서 돌고 있습니다. 왕의 정부는 신문사 편집장들에게 사설을 쓰기 전에 내무부에 전화하라고 요구합니다. 거절한 신문은 다음 날 아침 가판대에서 사라집니다."
 LR_ORL_autarky:0 "자급자족 경제"
 LR_ORL_autarky_desc:0 "다음 전쟁에서 영국 해군은 다시 항로를 막을 것입니다. 수입 고무도, 외국 석유도, 런던의 차관도 없이 버틸 수 있어야 합니다. 왕의 계획국이 프랑스가 스스로 먹고 스스로 무장할 목록을 짭니다."
 LR_ORL_latin_front:0 "라틴 전선"
 LR_ORL_latin_front_desc:0 "영국 함대는 지브롤터와 몰타에서 지중해를 지켜봅니다. 마드리드와 나폴리도 그 함대가 달갑지 않습니다. 왕의 비밀 특사가 라틴 민족의 전선을 제안하러 남쪽으로 떠납니다."
 LR_BOU_reims:0 "랭스 대관식"
 LR_BOU_reims_desc:0 "역대 프랑스 왕은 랭스 대성당에서 기름 부음을 받았습니다. 대성당 지붕은 대전쟁의 포격으로 무너졌다가 아직 절반만 복구되었습니다. 그 지붕 아래서 왕이 다시 왕관을 씁니다."
 LR_BOU_church:0 "교회와의 화해"
 LR_BOU_church_desc:0 "혁명은 성당의 종을 녹여 대포를 만들었습니다. 왕관과 제단은 혁명 전부터 함께였고, 함께 무너졌습니다. 교황 대사가 튈르리 궁에 초대받습니다."
 LR_BOU_peers:0 "귀족원 부활"
 LR_BOU_peers_desc:0 "혁명은 귀족 칭호를 폐지했지만 옛 가문들은 사라지지 않았습니다. 지방에는 아직 그들의 땅과 이름이 남아 있습니다. 귀족원이 부활하고, 옛 가문의 이름이 명패에 다시 적힙니다."
 LR_BOU_colonial_talks:0 "식민지 반환 협상"
 LR_BOU_colonial_talks_desc:0 "인도차이나와 적도 아프리카는 1918년에 프로이센으로 넘어갔습니다. 런던은 그 땅을 돌려줄 생각이 없습니다. 그래도 샴페인과 인내심으로 외무부의 문을 두드리면 항구 사용권 몇 개는 건질 수 있습니다."
 LR_BOU_mediterranean_pact:0 "지중해 해군 협정"
 LR_BOU_mediterranean_pact_desc:0 "지브롤터와 몰타의 영국 함대는 서지중해를 자기 바다처럼 다닙니다. 툴롱과 카르타헤나의 제독들이 해도를 맞대고 앉습니다. 지브롤터의 영국인들은 이 회담을 탐탁지 않게 여깁니다."
 LR_BOU_latin_league:0 "라틴 왕가 동맹"
 LR_BOU_latin_league_desc:0 "파리와 마드리드와 나폴리의 왕이 한 테이블에 앉았습니다. 세 왕가는 같은 할아버지에게서 나왔습니다. 대륙 서쪽을 다시 부르봉의 가족 모임으로 만드는 동맹이 선포됩니다."
 LR_BOU_family_council:0 "왕가 가족 회의"
 LR_BOU_family_council_desc:0 "수백 년 묵은 혈통이 오랜만에 정치적 쓸모를 찾았습니다. 마드리드와 나폴리와 리스본의 친척들이 파리에 모입니다. 혼약과 조약이 같은 서랍에서 나옵니다."
 LR_COM_red_guards:0 "노동자 민병대"
 LR_COM_red_guards_desc:0 "왕들의 군대가 오기 전에 공장이 스스로를 지켜야 합니다. 소총은 공장 사물함에 보관합니다. 교대가 끝나면 노동자는 민병대원이 됩니다."
 LR_COM_land_reform:0 "토지 개혁"
 LR_COM_land_reform_desc:0 "방데와 브르타뉴의 땅은 아직 옛 영주 가문의 것입니다. 1793년 혁명은 그 땅을 지키는 농민들에게 졌습니다. 영주 저택이 농민 협동조합 본부가 됩니다. 이 땅에 혁명이 뿌리내릴지는 이 일에 달려 있습니다."
 LR_COM_economic_plan:0 "경제 계획"
 LR_COM_economic_plan_desc:0 "시장은 대전쟁 뒤 실업과 굶주림만 남겼습니다. 평의회가 무엇을 얼마나 만들지 계획합니다. 칠판의 숫자는 늘 달성되고, 공장장들은 늘 칠판을 고칩니다."
 LR_COM_council:0 "코뮌 평의회"
 LR_COM_council_desc:0 "파리 스무 개 구마다 평의회가 열립니다. 회의는 길고 담배 연기는 자욱합니다. 그래도 처음으로 공장 노동자와 세탁부가 시청에서 말합니다."
 LR_COM_international:0 "혁명 인터내셔널"
 LR_COM_international_desc:0 "베를린과 밀라노와 런던에서 망명 혁명가들이 파리로 옵니다. 그들은 자기 나라에서 쫓겨났고 서로 말도 잘 통하지 않습니다. 세계 혁명의 사령부가 몽마르트르에 차려집니다."
 LR_COM_russian_treaty:0 "러시아 공화국과의 조약"
 LR_COM_russian_treaty_desc:0 "러시아 공화국은 유럽에서 유일하게 혁명이 성공한 나라입니다. 케렌스키의 정부는 코뮌만큼 붉지 않지만 왕이 없다는 점은 같습니다. 페테르부르크와 파리가 조약을 맺으면 왕들의 유럽이 양쪽에서 포위됩니다."
 LR_COM_peoples_army:0 "인민군 창설"
 LR_COM_peoples_army_desc:0 "왕의 군대는 1918년에 졌습니다. 장교를 투표로 뽑는 인민군은 이론상 민주적이고 실전에서 위험합니다. 그래도 그들은 왜 싸우는지 알고 있습니다."
 LR_JAC_forty_hours:0 "주 40시간"
 LR_JAC_forty_hours_desc:0 "프랑스 노동자들은 주 엿새, 하루 열 시간을 일합니다. 주 40시간 법이 통과된 날 공장 벽에 새 근무표가 붙습니다. 노동자들은 믿기지 않는다는 표정으로 일찍 퇴근합니다."
 LR_JAC_paid_leave:0 "유급 휴가"
 LR_JAC_paid_leave_desc:0 "금속 노동자 대부분은 평생 바다를 본 적이 없습니다. 유급 휴가 2주가 법이 됩니다. 여름이 오자 기차역은 노르망디 해변으로 가는 가족들로 붐비고, 부르주아 신문은 해변이 더러워졌다고 불평합니다."
 LR_JAC_laicite:0 "정교분리 강화"
 LR_JAC_laicite_desc:0 "왕정은 학교와 관청을 다시 교회에 맡겼습니다. 공화국이 교실 벽의 십자가를 내리고 마리안의 흉상을 올립니다. 시골 사제들은 이번 주 설교 주제를 정했습니다."
 LR_JAC_bank_reform:0 "프랑스 은행 개혁"
 LR_JAC_bank_reform_desc:0 "프랑스 은행의 이사회는 200대 주주가 뽑습니다. 그들이 나라의 돈줄을 쥐고 정부를 몇 번이나 무너뜨렸습니다. 이사회를 해산하고 중앙은행을 공화국의 손에 넣습니다."
 LR_JAC_arms_nationalised:0 "군수 산업 국유화"
 LR_JAC_arms_nationalised_desc:0 "슈네데르 가문은 대전쟁 때 포탄 값으로 대를 이어 부자가 되었습니다. 그리고 그 대포로 전쟁에 졌습니다. 군수 공장을 국유화하고 포탄 값을 의회가 정합니다."
 LR_GIR_bourse:0 "증권 시장 개방"
 LR_GIR_bourse_desc:0 "왕정은 외국 자본이 프랑스 기업을 사지 못하게 막았습니다. 그 족쇄를 풉니다. 브롱냐르 궁의 증권거래소에 다시 영어와 독일어가 들립니다."
 LR_GIR_tax_cut:0 "감세"
 LR_GIR_tax_cut_desc:0 "부자들의 세금을 깎으면 일자리가 생긴다고들 합니다. 적어도 부자들은 그렇게 말합니다. 지롱드 내각이 소득세 최고 세율을 절반으로 내립니다."
 LR_GIR_tariffs_down:0 "관세 인하"
 LR_GIR_tariffs_down_desc:0 "프랑스 공장의 기계는 대전쟁 전에 들여온 것이 대부분입니다. 관세를 낮추면 값싼 영국 기계와 원료가 들어옵니다. 경쟁을 버틴 공장만 남을 것입니다."
 LR_GIR_free_ports:0 "자유항"
 LR_GIR_free_ports_desc:0 "마르세유와 르아브르의 세관은 배 한 척을 통관시키는 데 나흘이 걸립니다. 두 항구를 자유항으로 선포합니다. 세관원은 할 일이 없어지고 조선소는 바빠집니다."
 LR_GIR_rail_privatised:0 "철도 민영화"
 LR_GIR_rail_privatised_desc:0 "국가 철도는 해마다 적자입니다. 지롱드는 노선을 경매에 부칩니다. 수익 나는 노선은 팔리고, 안 나는 노선의 시골 주민들은 시위를 시작합니다."
 LR_MAR_kings_return:0 "왕실 귀환 협상"
 LR_MAR_kings_return_desc:0 "헌법은 왕을 요구하지만 왕가는 망명 중입니다. 사절이 왕가를 찾아갑니다. 조건은 하나, 헌법에 먼저 선서할 것. 왕은 답장을 몇 달째 쓰고 있습니다."
 LR_MAR_senate:0 "상원 복원"
 LR_MAR_senate_desc:0 "평민 의회는 쉽게 흥분하고 쉽게 법을 만듭니다. 지방 명사들의 상원이 부활합니다. 평민 의회가 무엇을 통과시키든 그들이 천천히 다시 읽어 볼 것입니다."
 LR_MAR_civil_law:0 "재산권 수호법"
 LR_MAR_civil_law_desc:0 "혁명 때 몰수된 땅은 지난 석 달 사이 대부분 농민들 손에 들어갔습니다. 푀양파는 재산권이 질서의 기초라고 믿습니다. 원소유권을 인정하는 법이 통과되고, 농민들은 믿을 수 없다는 표정으로 고지서를 받습니다."
 LR_MAR_church_schools:0 "교회 학교 복원"
 LR_MAR_church_schools_desc:0 "혁명은 학교에서 십자가를 떼어 냈습니다. 푀양파는 교육이 아이들에게 질서를 가르쳐야 한다고 믿습니다. 시골 학교를 다시 사제에게 맡기고, 파리의 교사들은 파업을 예고합니다."
 LR_MAR_gendarmerie:0 "헌병대 강화"
 LR_MAR_gendarmerie_desc:0 "혁명 동안 시골의 헌병 초소는 대부분 비어 있었습니다. 말 탄 헌병대가 마을마다 돌아옵니다. 정부는 이것을 평온의 회복이라고 부르고, 마을 클럽들은 문을 닫습니다."
 LR_NAP_imperial_guard:0 "제국 근위대"
 LR_NAP_imperial_guard_desc:0 "황제는 자기 병사들의 이름을 외웁니다. 알제리에서 함께 싸운 고참병들이 근위대로 모입니다. 곰털 모자 대신 강철 투구를 쓴 그들은 황제가 직접 이름을 불러 주는 병사들입니다."
 LR_NAP_imperial_nobility:0 "제국 귀족"
 LR_NAP_imperial_nobility_desc:0 "황제의 원수와 장관들은 대부분 평민 출신입니다. 황제가 그들에게 공작과 백작의 칭호를 내립니다. 옛 귀족들은 경멸하지만, 그들의 저택은 이제 새 주인을 맞습니다."
 LR_NAP_rhine_confederation:0 "라인 연방의 꿈"
 LR_NAP_rhine_confederation_desc:0 "대전쟁 때 프랑스는 신성로마제국의 땅에 라인 연방을 세웠다가 잃었습니다. 황제가 그 꿈을 다시 지도 위에 그립니다. 독일의 제후들과 점령지를 하나로 묶어 황제의 보호령으로 삼습니다."
 LR_NAP_brother_kings:0 "형제들의 왕국"
 LR_NAP_brother_kings_desc:0 "보나파르트 집안은 코르시카의 가난한 소귀족이었습니다. 황제가 형제들에게 정복한 나라의 왕좌를 나눠 줍니다. 조제프에게는 나폴리를, 뤼시앵에게는 마드리드를, 루이에게는 헤이그를."
 LR_ORL_suppress:0 "공화주의자 색출"
 LR_ORL_suppress_desc:0 "공장 지대의 클럽들은 아직 혁명의 노래를 부릅니다. 왕의 헌병대가 생드니와 릴의 뒷골목을 하나씩 뒤집니다. 도시의 밤이 조용해질수록 튈르리 궁은 안심합니다."
 LR_ORL_uproot:0 "혁명의 뿌리 뽑기"
 LR_ORL_uproot_desc:0 "마지막 지하 신문의 인쇄기가 압수되었습니다. 혁명은 이제 금서 목록 속에서나 읽을 수 있습니다. 왕의 경찰은 그렇게 믿고, 남은 명단을 서류철에 정리합니다."
 LR_BOU_suppress:0 "왕실 경찰 강화"
 LR_BOU_suppress_desc:0 "쿠데타는 꺾였지만 공화주의자들은 그 틈에 다시 모였습니다. 왕실 경찰이 클럽과 신문사의 명단을 넘깁니다. 체포 영장에는 모두 왕의 인장이 찍힙니다."
 LR_BOU_uproot:0 "혁명의 뿌리 뽑기"
 LR_BOU_uproot_desc:0 "지하 클럽의 마지막 간부가 기아나행 배에 올랐습니다. 파리 시민들은 더는 혁명 이야기를 소곤대지도 않습니다. 왕은 그 침묵이 충성인지 두려움인지 아직 모릅니다."
 LR_MAR_suppress:0 "헌법 수호법"
 LR_MAR_suppress_desc:0 "공화국을 무너뜨리자는 선동이 아직 신문과 클럽에서 나옵니다. 의회가 헌법 수호법을 통과시킵니다. 판사들은 이 법의 뜻을 아주 넓게 해석합니다."
 LR_MAR_uproot:0 "급진파 해산"
 LR_MAR_uproot_desc:0 "급진 정당과 지하 클럽들이 법원 명령으로 해산되었습니다. 총 한 발 쏘지 않고 법전으로 끝낸 일입니다. 정부는 합법적인 방식으로 혁명이 끝났다고 만족합니다."
 LR_COM_suppress:0 "혁명 재판소"
 LR_COM_suppress_desc:0 "왕당파와 사제들은 아직 시골에서 코뮌을 저주합니다. 혁명 재판소가 다시 문을 엽니다. 귀족 명부와 사제 명부, 그리고 어제까지 동지였던 사람들의 이름이 올라옵니다."
 LR_COM_uproot:0 "반혁명의 뿌리 뽑기"
 LR_COM_uproot_desc:0 "방데의 마지막 반혁명 조직이 무너졌습니다. 1793년에는 끝내 이기지 못한 땅입니다. 왕당파라는 말은 이제 욕설로만 남습니다."
 LR_JAC_suppress:0 "공안 경찰"
 LR_JAC_suppress_desc:0 "왕당파 장교들은 아직 군대와 시골에 남아 있습니다. 공안 경찰이 그들의 음모를 쫓습니다. 편지를 뜯고 술집을 엿들으면서, 1793년의 기억이 슬며시 돌아옵니다."
 LR_JAC_uproot:0 "방데 평정"
 LR_JAC_uproot_desc:0 "방데의 숲에서 마지막 왕당파 부대가 항복했습니다. 1793년에는 이 숲에서 학살이 있었습니다. 이번에는 학살 없이 끝났다는 것이 공화국의 자랑입니다."
 LR_GIR_suppress:0 "지방 분권 협약"
 LR_GIR_suppress_desc:0 "지방의 왕당파 지주들은 왕보다 재산을 더 걱정합니다. 지롱드 내각은 그들을 체포하는 대신 협상 테이블에 앉힙니다. 그들에게 필요한 것은 왕이 아니라 안전한 재산일지 모릅니다."
 LR_GIR_uproot:0 "왕당파 해체"
 LR_GIR_uproot_desc:0 "왕당파 단체의 후원금이 끊겼습니다. 후원자들이 공화국 국채의 수익률이 더 좋다는 것을 깨달았기 때문입니다. 지롱드는 총 대신 이자로 반혁명을 끝냅니다."
 LR_NAP_suppress:0 "푸셰의 경찰"
 LR_NAP_suppress_desc:0 "왕당파와 자코뱅은 둘 다 황제를 찬탈자라 부릅니다. 경찰 장관이 전국에 밀정을 풉니다. 왕당파의 편지는 수신인보다 먼저 경찰 장관의 책상에 도착합니다."
 LR_NAP_uproot:0 "왕당파의 종말"
 LR_NAP_uproot_desc:0 "왕당파의 마지막 음모가 영국의 자금과 함께 적발되었습니다. 음모자들은 재판 없이 기아나로 보내졌습니다. 파리 시민들은 공원에서 왕의 이름을 입에 올리지 않은 지 오랩니다."
 LR_PET_marshal:0 "베르됭의 원수"
 LR_PET_marshal_desc:0 "반발을 다스리지 못한 정부가 무너졌습니다. 대전쟁에서 베르됭을 지킨 여든 살 원수가 전권을 쥡니다. 그는 혁명도 왕정도 아닌 세 번째 길을 약속합니다. 질서, 노동, 가족, 조국."
 LR_PET_labour_charter:0 "노동 헌장"
 LR_PET_labour_charter_desc:0 "파업과 직장 폐쇄가 프랑스를 둘로 갈라놓았습니다. 원수는 노동조합과 사장 단체를 해산하고, 업종마다 노동자와 사장이 함께 들어가는 조합을 세웁니다. 원수는 이것을 화해라고 부르고, 노동자들은 침묵이라고 부릅니다."
 LR_PET_family_code:0 "가족법"
 LR_PET_family_code_desc:0 "대전쟁이 앗아 간 한 세대의 빈자리는 아직 메워지지 않았습니다. 어머니의 날이 국가 기념일이 되고 아이를 셋 이상 둔 가정에 수당이 나옵니다. 이혼은 어려워지고, 기혼 여성은 공직에서 물러나야 합니다."
 LR_PET_return_to_soil:0 "땅으로의 귀환"
 LR_PET_return_to_soil_desc:0 "흙은 거짓말을 하지 않는다는 원수의 말이 역마다 붙습니다. 공장과 노조가 혁명을 낳았다고 정부는 믿습니다. 도시의 실업자와 노동자를 농촌의 빈 농가로 보냅니다."
 LR_PET_peasant_corporation:0 "농민 조합"
 LR_PET_peasant_corporation_desc:0 "농촌으로 돌아간 사람들은 씨앗도 비료도 없습니다. 모든 농민이 하나의 조합에 가입합니다. 조합은 씨앗과 비료를 나누고 수확량과 가격을 정합니다. 그 조합의 지도부는 원수가 임명한 지방 명사들입니다."
 LR_PET_youth_camps:0 "청년 작업장"
 LR_PET_youth_camps_desc:0 "도시의 청년들이 실업과 혁명 사이를 떠돕니다. 스무 살 청년들이 초록색 제복을 입고 여덟 달 동안 숲과 산으로 갑니다. 그들은 나무를 베고 길을 닦고 저녁마다 원수에게 바치는 노래를 부릅니다."
 LR_PET_secours_national:0 "국민 구호"
 LR_PET_secours_national_desc:0 "겨울이 오면 시골 마을에서 굶는 사람이 나옵니다. 국민 구호 단체가 원수의 이름으로 겨울 외투와 빵을 나눠 줍니다. 빵 봉투에는 원수의 얼굴이 찍혀 있습니다."
 LR_PET_school_cross:0 "학교의 십자가"
 LR_PET_school_cross_desc:0 "공화국은 50년 전 교실 벽에서 십자가를 떼어 냈습니다. 원수는 그 십자가를 다시 겁니다. 교과서에서 혁명의 영웅들이 빠지고 잔 다르크와 성왕 루이가 들어옵니다. 교사 노조는 해산되었습니다."
 LR_PET_national_revolution:0 "국민 혁명"
 LR_PET_national_revolution_desc:0 "자유, 평등, 박애는 150년 동안 공화국의 동전에 새겨져 있었습니다. 그 세 낱말이 노동, 가족, 조국으로 바뀝니다. 원수는 이것을 국민 혁명이라고 부릅니다. 혁명을 가장 싫어하는 사람이 혁명이라는 말을 고른 것입니다."
 LR_PET_constitutional_acts:0 "헌법 법령 제1호"
 LR_PET_constitutional_acts_desc:0 "의회는 원수에게 전권을 주었지만 그 전권의 모양은 아직 없습니다. 헌법 법령 제1호로 원수가 국가원수의 칭호를 취합니다. 대통령의 자리는 사라지고 의회는 무기한 휴회합니다."
 LR_PET_legion:0 "참전용사 군단"
 LR_PET_legion_desc:0 "대전쟁의 참전용사들은 원수를 아버지처럼 따릅니다. 그들이 하나의 군단으로 묶입니다. 베레모를 쓴 노병들이 마을마다 지부를 세우고 원수의 초상을 앞세워 행진합니다. 그리고 이웃의 이름을 적어 군청에 보냅니다."
 LR_PET_national_council:0 "국민 평의회"
 LR_PET_national_council_desc:0 "선거로 뽑힌 의회는 휴회했습니다. 원수가 지명한 명사들이 국민 평의회에 모입니다. 주교, 장군, 농민 조합장, 사장, 몇 명의 노동자 대표. 그들은 토론하지만 결정하지는 않습니다."
 LR_PET_riom_trial:0 "리옴 재판"
 LR_PET_riom_trial_desc:0 "원수는 패배와 혼란의 책임을 물어야 한다고 믿습니다. 옛 정부의 총리와 장관과 장군들이 리옴의 법정에 섭니다. 공화국 그 자체가 피고석에 앉습니다. 피고들은 순순히 고개를 숙일 사람들이 아닙니다."
 LR_PET_heir_weygand:0 "베강을 후계자로"
 LR_PET_heir_weygand_desc:0 "원수는 여든을 넘겼습니다. 그다음은 군대여야 한다는 사람들이 있습니다. 대전쟁 때 포슈의 참모장이었던 베강 장군이 후계자로 지명됩니다. 그는 원수보다도 늙었고 원수보다도 의회를 싫어합니다."
 LR_PET_heir_darlan:0 "다를랑을 후계자로"
 LR_PET_heir_darlan_desc:0 "원수는 여든을 넘겼습니다. 그다음은 함대여야 한다는 사람들이 있습니다. 해군을 손에 쥔 다를랑 제독이 후계자로 지명됩니다. 그는 누구와도 거래할 줄 알고, 해군만은 끝까지 지킨 사람입니다."
 LR_PET_madrid_embassy:0 "마드리드 대사관"
 LR_PET_madrid_embassy_desc:0 "원수는 젊은 날 모로코에서 스페인군과 함께 싸웠고, 그 인연으로 마드리드 대사를 지냈습니다. 그 시절의 친구들이 지금 스페인 궁정의 장군들입니다. 원수가 피레네 너머로 다시 편지를 씁니다."
 LR_PET_vatican:0 "바티칸과의 화해"
 LR_PET_vatican_desc:0 "혁명은 수도회를 쫓아내고 교회 재산을 몰수했습니다. 원수는 교회가 질서의 기둥이라고 믿습니다. 교황청이 원수에게 축복을 보내고, 수도회가 다시 학교를 맡습니다."
 LR_PET_montoire:0 "몽투아르의 악수"
 LR_PET_montoire_desc:0 "승전국들은 원수를 늙고 안전한 사람으로 봅니다. 몽투아르의 작은 역에서 원수가 승전국의 대표와 악수합니다. 배상금은 줄고 국경은 조용해집니다. 그 대신 프랑스의 칼은 칼집에 들어갑니다."
 LR_PET_hidden_sword:0 "칼집 속의 칼"
 LR_PET_hidden_sword_desc:0 "악수는 하되 칼은 숨깁니다. 원수의 참모들이 동원 명부를 다시 쓰고, 예산서에서 지운 무기를 산속 창고로 옮깁니다. 배상 위원회 감독관이 오면 빈 창고와 차 한 잔이 그를 맞습니다."
 LR_PET_verdun_doctrine:0 "베르됭의 교리"
 LR_PET_verdun_doctrine_desc:0 "1916년 베르됭에서 원수는 그들은 지나가지 못한다고 말했습니다. 그 말이 육군의 교리가 됩니다. 화력과 요새, 참호와 예비대. 원수는 공세를 믿지 않습니다. 먼저 버티고, 적이 지칠 때 나아갑니다."
 LR_PET_maginot:0 "마지노선 완공"
 LR_PET_maginot_desc:0 "왕정은 예산을 아끼려고 동쪽 국경의 요새 공사를 멈췄습니다. 원수가 그 공사를 다시 시작합니다. 콘크리트와 강철이 알자스와 로렌의 언덕 아래로 들어갑니다. 원수는 공사장을 둘러보며 만족스럽게 고개를 끄덕입니다."
 LR_PET_suppress:0 "헌병대 계엄"
 LR_PET_suppress_desc:0 "원수의 프랑스에서 질서는 협상의 대상이 아닙니다. 반발이 큰 지역마다 헌병대와 계엄령이 내려집니다. 통행금지, 검문, 신문 검열."
 LR_PET_uproot:0 "반국가 세력 일소"
 LR_PET_uproot_desc:0 "원수의 경찰은 좌우를 가리지 않습니다. 공산주의자의 비밀 인쇄소와 왕당파의 무기고를 같은 날 덮칩니다. 그날 이후 프랑스의 지하에는 아무도 남지 않습니다."
 LR_PET_algeria:0 "알제리 질서 회복"
 LR_PET_algeria_desc:0 "알제리는 다시 질서를 원한다고 원수는 믿습니다. 알제리 출신 노병들은 대전쟁 때 원수 밑에서 싸웠습니다. 원수의 초상이 찍힌 배지를 단 병사들이 툴롱 부두에서 수송선에 오릅니다."
 LR_PET_rhine:0 "베르됭에서 라인으로"
 LR_PET_rhine_desc:0 "원수는 평생 공세를 믿지 않았습니다. 그러나 프로이센이 라인강 너머에 있는 한 프랑스는 버티기만 해야 합니다. 여든 살 원수가 생애 마지막 공세를 명령합니다. 신중하게, 한 걸음씩."
 LR_PET_danube:0 "빈으로"
 LR_PET_danube_desc:0 "프랑스를 무릎 꿇린 승전국들 가운데 가장 오래된 왕가가 빈에 있습니다. 합스부르크는 1918년에 가장 많은 몫을 챙겼습니다. 원수가 그 빚을 받으러 군대를 보냅니다."
 LR_PET_channel:0 "해협 건너로"
 LR_PET_channel_desc:0 "원수는 대전쟁 때 영국군이 먼저 물러나려 했던 날을 잊지 않았습니다. 그 영국이 1918년 프랑스의 항복을 받았습니다. 이번에는 프랑스가 해협을 건너갑니다."
 LR_PET_russia:0 "동쪽의 적"
 LR_PET_russia_desc:0 "러시아 공화국은 왕들의 유럽에 남은 마지막 혁명의 나라입니다. 원수는 혁명이라는 말을 혐오합니다. 그리고 그는 겨울을 아는 사람입니다. 군대는 봄에 출발합니다."
 LR_ANA_federation:0 "자유 코뮌 연합"
 LR_ANA_federation_desc:0 "총선에서 이긴 사회주의자들이 둘로 갈라졌습니다. 중앙위원회 대신 코뮌과 조합의 자유 연합을 택한 쪽이 이겼습니다. 파리 시청에 검은색과 붉은색으로 나뉜 깃발이 오르고, 위원회도 당도 없는 혁명이 시작됩니다."
 LR_ANA_syndicates_take:0 "공장은 조합의 것"
 LR_ANA_syndicates_take_desc:0 "사장실이 비었습니다. 연합은 공장을 국가에 넘기지 않습니다. 공장마다 노동자 총회가 생산 계획과 임금과 근무 시간을 투표로 정합니다. 공장은 그곳에서 일하는 사람들의 것입니다."
 LR_ANA_free_communes:0 "자유 코뮌"
 LR_ANA_free_communes_desc:0 "나폴레옹 이래 코뮌은 파리가 보낸 시장의 명령을 받았습니다. 이제 코뮌 총회가 코뮌을 다스립니다. 일요일 오후 성당 앞 광장에서 사람들이 손을 들어 우물과 학교와 도로를 정합니다."
 LR_ANA_collectives:0 "자유 집산"
 LR_ANA_collectives_desc:0 "강제로 만든 집산은 지주가 바뀐 것뿐이라고 연합은 말합니다. 원하는 코뮌은 땅과 쟁기와 수확을 함께 씁니다. 원하지 않는 사람은 자기 밭을 그대로 갈아도 됩니다."
 LR_ANA_abolish_money:0 "화폐 없는 코뮌"
 LR_ANA_abolish_money_desc:0 "돈은 사람이 사람을 부리는 도구라고 연합의 몇몇 코뮌은 믿습니다. 그 코뮌들이 광장에서 프랑 지폐를 불태웁니다. 빵집과 대장간은 배급표로 돌아가고, 유럽의 은행가들은 웃음을 터뜨렸다가 곧 멈춥니다."
 LR_ANA_housing:0 "빈집 징발"
 LR_ANA_housing_desc:0 "부자들은 혁명이 나자 16구의 저택과 아파트를 비우고 떠났습니다. 벨빌의 판자촌에는 한 방에 여덟 식구가 삽니다. 빈집에 판자촌 가족들이 들어가고, 16구의 응접실에서 벨빌의 아이들이 숙제를 합니다."
 LR_ANA_rationalist_schools:0 "합리주의 학교"
 LR_ANA_rationalist_schools_desc:0 "바르셀로나의 페레르는 신부도 국가도 없는 학교를 꿈꾸다 총살당했습니다. 그 학교가 프랑스에 문을 엽니다. 아이들은 외우는 대신 묻는 법을 배우고, 시험도 상장도 없습니다."
 LR_ANA_ateneos:0 "민중 회관"
 LR_ANA_ateneos_desc:0 "글을 모르는 노인들이 아직 많습니다. 동네마다 민중 회관이 생깁니다. 낮에는 도서관이고 저녁에는 강연장이며 주말에는 극장입니다. 노인들이 여기서 처음 신문을 읽습니다."
 LR_ANA_proudhon:0 "프루동의 연방주의"
 LR_ANA_proudhon_desc:0 "재산은 도둑질이다라고 쓴 사람은 프랑스인이었습니다. 프루동은 나라를 위에서 아래로가 아니라 아래에서 위로 묶자고 했습니다. 코뮌에서 지역으로, 지역에서 연합으로 묶는 연방의 원칙을 꺼냅니다."
 LR_ANA_abolish_prefects:0 "도지사 폐지"
 LR_ANA_abolish_prefects_desc:0 "나폴레옹 이래 도지사들은 파리의 명령을 지방에 전해 왔습니다. 그들을 모두 집으로 돌려보냅니다. 도청 건물은 학교와 병원이 됩니다."
 LR_ANA_mandates:0 "위임과 소환"
 LR_ANA_mandates_desc:0 "직업 정치인은 표를 받은 다음 날부터 표를 준 사람을 잊는다고 연합은 믿습니다. 대표는 총회가 정해 준 대로만 말하고, 총회는 언제든 대표를 불러들일 수 있습니다. 그 원칙이 연합의 법이 됩니다."
 LR_ANA_congress:0 "코뮌 대회"
 LR_ANA_congress_desc:0 "전국의 코뮌과 조합이 대표를 보내 첫 연합 대회를 엽니다. 누가 의장을 맡을지부터 정해야 합니다. 회의는 엿새 동안 이어지고, 의장은 하루에 한 번씩 바뀝니다."
 LR_ANA_platform:0 "강령파"
 LR_ANA_platform_desc:0 "강령파가 이겼습니다. 하나의 강령, 하나의 전술, 공동의 책임. 우크라이나 초원의 흑군이 조직이 없어서 무너졌다는 교훈을 그들은 잊지 않았습니다. 연합에 처음으로 규율이 생깁니다."
 LR_ANA_synthesis:0 "종합파"
 LR_ANA_synthesis_desc:0 "종합파가 이겼습니다. 아나코생디칼리스트도, 개인주의자도, 공산주의적 아나키스트도 같은 회관을 씁니다. 수단이 목적을 삼키게 두지 않겠다는 약속입니다. 연합은 느리지만 갈라지지 않습니다."
 LR_ANA_columns:0 "민병대 종대"
 LR_ANA_columns_desc:0 "왕들의 군대는 연합을 그대로 두지 않을 것입니다. 계급장 없는 민병대 종대가 조직됩니다. 그들은 소매에 검붉은 완장을 차고 노래를 부르며 열차에 오릅니다. 장군 대신 대표가 있습니다."
 LR_ANA_elected_officers:0 "장교 선출"
 LR_ANA_elected_officers_desc:0 "민병대에도 앞장설 사람이 필요합니다. 병사들이 손을 들어 대표를 뽑습니다. 대표는 앞장서서 싸우고, 잘못하면 다음 날 소환됩니다. 옛 장교들은 이것이 군대인지 묻습니다."
 LR_ANA_militarisation:0 "민병대의 군대화"
 LR_ANA_militarisation_desc:0 "왕들의 군대는 노래를 부르며 오지 않습니다. 연합 대회는 긴 토론 끝에 결론을 냈습니다. 민병대에도 규율과 훈련과 참모가 필요하다고. 옛 하사관들이 다시 교관이 됩니다."
 LR_ANA_cnt_brothers:0 "바르셀로나의 형제들"
 LR_ANA_cnt_brothers_desc:0 "피레네 너머 바르셀로나에는 프랑스보다 오래된 조합 운동이 있습니다. 그들은 스페인 내전에서 왕과 카를로스파 모두와 싸웠습니다. 그들에게 전단과 돈, 그리고 언젠가는 총을 보냅니다."
 LR_ANA_carrara:0 "카라라의 채석공"
 LR_ANA_carrara_desc:0 "토스카나의 대리석 채석장 카라라는 이탈리아 아나키즘의 요람입니다. 채석공들은 빈의 경찰에게도 고개를 숙이지 않았습니다. 그들의 조합에 파리의 편지가 도착합니다."
 LR_ANA_iwa:0 "국제노동자협회"
 LR_ANA_iwa_desc:0 "조합들의 인터내셔널인 국제노동자협회는 베를린에서 세워졌다가 대전쟁 뒤 잠들었습니다. 그 협회를 파리에서 다시 깨웁니다. 스웨덴과 포르투갈과 아르헨티나의 조합원들이 답장을 보냅니다."
 LR_ANA_free_territory:0 "자유 영토의 기억"
 LR_ANA_free_territory_desc:0 "대전쟁 뒤 우크라이나 초원에서 흑군이 자유 영토를 세웠다가 오스트리아의 대공에게 짓밟혔습니다. 그 일을 기억하는 사람들이 아직 살아 있습니다. 연합이 그들에게 편지를 보냅니다."
 LR_ANA_suppress:0 "자경 위원회"
 LR_ANA_suppress_desc:0 "경찰을 없앤 연합에도 반혁명은 있습니다. 코뮌 총회가 뽑은 자경단이 왕당파 조직을 감시합니다. 경찰은 없지만 눈은 많습니다."
 LR_ANA_uproot:0 "반혁명 무장 해제"
 LR_ANA_uproot_desc:0 "왕당파 장교와 지주들은 시골 헛간에 무기를 숨겨 두었습니다. 연합이 그 무기고들을 모두 비웁니다. 총을 내려놓은 사람은 집으로 돌아갈 수 있습니다. 그날 이후 반혁명은 무기를 잃습니다."
 LR_ANA_algerian_freedom:0 "알제리 자유 코뮌"
 LR_ANA_algerian_freedom_desc:0 "연합은 알제리를 다시 정복하지 않습니다. 국경은 왕들이 그은 선일 뿐입니다. 그 땅의 부두 노동자와 농민들에게 손을 내밀어, 알제의 코뮌이 스스로 연합에 들어오게 합니다."
 LR_ANA_rhine:0 "라인강 건너 형제들에게"
 LR_ANA_rhine_desc:0 "루르의 광부들은 대전쟁 때 프로이센의 전쟁을 파업으로 흔들었습니다. 연합 대회는 이것이 프랑스와 독일의 전쟁이 아니라 노동자와 왕의 전쟁이라고 선언했습니다. 종대가 라인강을 건너 총과 자유를 함께 가져갑니다."
 LR_ANA_danube:0 "민족의 감옥을 부수다"
 LR_ANA_danube_desc:0 "합스부르크의 제국은 열두 민족을 가둔 감옥입니다. 연합은 간수만 바꾸러 가는 것이 아니라고 말합니다. 종대가 도나우로 향하고, 감옥 문을 부순 뒤에는 돌아오겠다고 약속합니다."
 LR_ANA_channel:0 "해협 건너로"
 LR_ANA_channel_desc:0 "런던의 귀족 의회는 대전쟁 뒤 유럽의 질서를 썼습니다. 선원 조합이 투표로 출항을 결정했습니다. 연합의 배들이 해협을 건너 그 의회를 끝내러 갑니다."
 LR_NAP_red:0 "붉은 나폴레옹"
 LR_NAP_red_desc:0 "1922년 여름, 스물한 살의 포병 소위는 자코뱅 소책자를 썼습니다. 대전쟁의 패배 속에서 그가 처음 꿈꾼 것은 왕관이 아니라 혁명이었습니다. 원로원이 왕관을 내미는 지금, 그는 그 소책자를 서랍에서 꺼냅니다."
 LR_RED_tribune:0 "인민의 호민관"
 LR_RED_tribune_desc:0 "원로원이 왕관을 내밀자 제1통령은 견장 위에 붉은 리본을 달았습니다. 노동자 평의회가 그를 인민의 호민관으로 추대합니다. 왕당파는 망명길에 오르고, 사회주의자들은 이 사람을 믿어도 되는지 아직 확신하지 못합니다."
 LR_RED_maximum:0 "곡물 최고 가격령"
 LR_RED_maximum_desc:0 "도시의 빵값은 매주 오르고 농촌의 곡물 창고는 잠겨 있습니다. 1793년 국민공회는 빵값의 상한을 정하고 숨긴 곡물을 징발했습니다. 붉은 통령이 그 법령을 다시 꺼냅니다. 도시는 먹고, 농촌은 투덜댑니다."
 LR_RED_workshops:0 "국민 작업장"
 LR_RED_workshops_desc:0 "1848년 공화국은 국민 작업장을 열었다가 석 달 만에 닫았고, 파리는 피를 흘렸습니다. 이번에는 국가가 끝까지 책임집니다. 실업자는 국가의 공장에서 일하고, 그 공장들은 무엇보다 대포를 만듭니다."
 LR_RED_arsenals:0 "인민 병기창"
 LR_RED_arsenals_desc:0 "슈네데르와 르노와 오치키스의 사주들은 통령이 붉은 리본을 단 날 망명했습니다. 그들의 공장이 인민의 병기창이 됩니다. 공장장 자리는 노동자 평의회 대표와 포병 장교가 함께 맡습니다."
 LR_RED_soldiers_land:0 "병사에게 땅을"
 LR_RED_soldiers_land_desc:0 "망명한 귀족들의 영지가 주인 없이 남아 있습니다. 통령은 그 땅을 갈라 제대 군인에게 나눠 줍니다. 로마의 장군들이 그랬듯, 병사들은 땅을 준 사람을 잊지 않습니다."
 LR_RED_calendar_plan:0 "혁명력 경제 계획"
 LR_RED_calendar_plan_desc:0 "1792년 공화국은 달력을 새로 만들었고, 코뮌의 혁명가들은 그 달력을 사랑합니다. 통령의 첫 경제 계획은 포도의 달에 시작합니다. 혁명력과 5개년 계획이 한 장의 포스터에 같이 인쇄되어 공장마다 걸립니다."
 LR_RED_beaucaire:0 "보케르의 저녁 식사"
 LR_RED_beaucaire_desc:0 "1922년 아비뇽으로 가던 젊은 포병 소위는 보케르의 여관에서 상인들과 논쟁한 뒤 소책자 한 권을 썼습니다. 공화국은 이길 것이고, 그것을 지키는 것은 대포라는 내용이었습니다. 그 보케르의 저녁 식사를 다시 찍습니다."
 LR_RED_committee:0 "공안위원회 재건"
 LR_RED_committee_desc:0 "1793년 공안위원회는 공화국을 구하고 공화국을 삼켰습니다. 통령이 의장석에 앉는 공안위원회가 다시 열립니다. 로베스피에르의 위원회와 다른 점은 하나, 의장이 포병 장교라는 것입니다."
 LR_RED_people_vote:0 "인민 투표"
 LR_RED_people_vote_desc:0 "인민의 통령에 찬성합니까. 투표는 투표소가 아니라 공장과 병영의 평의회에서 손을 들어 치러집니다. 반대한 손이 몇 개였는지 세는 사람은 없습니다."
 LR_RED_red_marshals:0 "붉은 원수들"
 LR_RED_red_marshals_desc:0 "알제리부터 함께 온 장군들은 붉은 깃발 앞에서 머뭇거립니다. 공장 평의회 출신의 젊은 지휘관들은 망설이지 않습니다. 통령이 두 무리에게 같은 지휘봉을 주고, 견장에 붉은 별을 단 원수들이 임명됩니다."
 LR_RED_sword:0 "세계 혁명의 칼"
 LR_RED_sword_desc:0 "왕들의 유럽은 붉은 프랑스를 그대로 두지 않을 것입니다. 혁명은 수출되어야 살아남는다고 통령은 믿습니다. 대육군이 가는 곳마다 왕궁이 무너지고 인민 공화국이 설 것입니다."
 LR_RED_continental_socialism:0 "사회주의 대륙 체제"
 LR_RED_continental_socialism_desc:0 "유럽의 인민 공화국들은 아직 약하고 서로 다툽니다. 통령은 혁명이 프랑스의 깃발 아래서만 안전하다고 말합니다. 그 공화국들이 파리를 중심으로 하나의 대륙 체제에 묶입니다. 그 체제의 이름이 제국이 아니라는 것만 다릅니다."
 LR_RED_levee:0 "국민 총동원령"
 LR_RED_levee_desc:0 "1793년 8월 23일 국민공회는 모든 프랑스인을 영구히 군대의 징발 대상으로 선언했습니다. 그 총동원령이 다시 낭독됩니다. 젊은이는 싸우고, 기혼자는 무기를 만들고, 여자는 천막을 짓습니다."
 LR_RED_commissars:0 "원수와 정치위원"
 LR_RED_commissars_desc:0 "원수들은 통령에게 충성하지만 혁명에 충성하는지는 알 수 없습니다. 원수의 명령서에 정치위원의 서명이 함께 들어갑니다. 원수들은 불평하지만, 병사들은 위원이 자기들과 같은 솥의 수프를 먹는다는 것을 압니다."
 LR_RED_red_grande_armee:0 "붉은 대육군"
 LR_RED_red_grande_armee_desc:0 "삼색기와 붉은 깃발을 함께 든 대육군이 출범합니다. 근위대 고참병과 벨빌의 선반공이 같은 막사에서 잡니다. 그들은 서로를 믿지 않지만, 둘 다 통령은 믿습니다."
 LR_RED_sister_communes:0 "자매 코뮌"
 LR_RED_sister_communes_desc:0 "1790년대 혁명 프랑스는 국경 너머에 자매 공화국들을 세웠습니다. 통령이 국경 너머 혁명가들에게 편지를 씁니다. 파리의 형제가 되자고. 밀라노와 바르샤바와 바르셀로나에서 답장이 옵니다."
 LR_RED_italian_legion:0 "이탈리아 군단"
 LR_RED_italian_legion_desc:0 "1790년대 이탈리아에는 혁명 프랑스가 세운 자매 공화국들이 있었습니다. 그 이름으로 이탈리아 혁명가들을 모읍니다. 나폴리와 로마와 토리노의 다락방에서 젊은이들이 짐을 쌉니다."
 LR_RED_polish_legion:0 "폴란드 군단"
 LR_RED_polish_legion_desc:0 "1797년 돔브로프스키가 이탈리아에서 폴란드 군단을 만들 때 부른 노래는 지금 폴란드의 국가가 되었습니다. 폴란드는 지금 북독일의 괴뢰국입니다. 그 노래를 부르며 폴란드인 의용병들이 파리로 옵니다."
 LR_RED_revolution_hq:0 "유럽 혁명 사령부"
 LR_RED_revolution_hq_desc:0 "유럽의 혁명은 각자 따로 싸우다 각자 따로 집니다. 튈르리 궁의 한 층이 유럽 혁명 사령부가 됩니다. 지도 위에 꽂힌 붉은 핀은 대육군이 갈 곳이자 인민 공화국이 설 곳입니다."
 LR_RED_suppress:0 "인민 경찰"
 LR_RED_suppress_desc:0 "왕당파 살롱은 아직 통령의 몰락을 기다리며 축배를 듭니다. 경찰의 밀정들이 이번에는 붉은 완장을 찹니다. 왕당파의 편지와 망명자의 편지가 같은 서류철에 들어갑니다."
 LR_RED_uproot:0 "반혁명 일소"
 LR_RED_uproot_desc:0 "왕당파의 마지막 음모와 방데의 무기고를 같은 밤에 덮칩니다. 경찰은 좌우를 가리지 않습니다. 그날 이후 반혁명은 지도자를 잃습니다."
 LR_RED_rhine:0 "라인강의 붉은 깃발"
 LR_RED_rhine_desc:0 "1918년 프로이센은 라인강 너머의 땅을 다시 가져갔습니다. 베를린의 궁전에는 빵이 쌓여 있고 루르의 광부들은 굶는다고 통령은 연설했습니다. 붉은 대육군이 라인강을 건넙니다."
 LR_RED_danube:0 "아우스터리츠의 해"
 LR_RED_danube_desc:0 "합스부르크의 제국은 열두 민족을 가둔 감옥입니다. 통령은 이번에 무너뜨리는 것이 황제 하나가 아니라 감옥 전체라고 말합니다. 붉은 대육군이 도나우를 따라 빈으로 향합니다."
 LR_RED_channel:0 "불로뉴의 붉은 진영"
 LR_RED_channel_desc:0 "런던의 은행은 150년 동안 대륙의 왕들에게 돈을 댔습니다. 혁명 프랑스와 싸운 동맹들도 그 돈으로 움직였습니다. 불로뉴의 붉은 진영에서 대육군이 그 은행을 닫으러 갈 준비를 합니다."
 LR_RED_russia:0 "모스크바로"
 LR_RED_russia_desc:0 "케렌스키는 혁명을 반쯤 하다 말았다고 통령은 말합니다. 러시아 공화국에는 아직 지주와 장군이 남아 있습니다. 대육군이 니에멘강을 건넙니다. 이번에는 겨울 군복이 먼저 실렸습니다."
 LR_DEF_occupation:0 "점령의 겨울"
 LR_DEF_occupation_desc:0 "두 번째 패전입니다. 콩피에뉴 숲의 객차에서 다시 항복 문서에 서명했습니다. 파리의 관공서마다 승전국의 깃발이 걸렸고 새 정부는 승전국의 뜻에 따라 섰습니다. 프랑스는 살아남는 법부터 다시 배워야 합니다."
 LR_DEF_rations:0 "배급표"
 LR_DEF_rations_desc:0 "공장은 멈췄고 철도는 점령군이 씁니다. 빵과 석탄과 신발에 배급표가 붙습니다. 주부들은 새벽부터 빵집 앞에 줄을 서고, 배급표 위조범이 경찰의 새 골칫거리가 됩니다."
 LR_DEF_prisoners:0 "포로 귀환 협상"
 LR_DEF_prisoners_desc:0 "전쟁 포로 수십만 명이 승전국의 수용소에 있습니다. 마을마다 돌아오지 않은 아들이 있습니다. 그들을 돌려받는 것이 새 정부의 첫 외교 과제이고, 그 값은 비쌉니다."
 LR_DEF_black_market:0 "암시장"
 LR_DEF_black_market_desc:0 "레알 시장 뒷골목에서는 돈만 있으면 무엇이든 삽니다. 배급표로 살 수 있는 것은 점점 줄어듭니다. 정부는 암시장을 단속할지 눈감을지 정해야 합니다."
 LR_DEF_ruins:0 "폐허의 재건"
 LR_DEF_ruins_desc:0 "아라스와 릴은 두 번의 전쟁에서 두 번 포격을 받았습니다. 시민들이 맨손으로 벽돌을 줍기 시작합니다. 재건 예산은 배상금 장부 맨 아래에 적혀 있습니다."
 LR_DEF_winter_relief:0 "겨울 구호"
 LR_DEF_winter_relief_desc:0 "점령 아래 첫 겨울이 옵니다. 교회와 적십자와 노조는 서로를 미워해 왔습니다. 그들이 처음으로 같은 줄에 서서 겨울 외투와 수프를 나눕니다."
 LR_DEF_two_roads:0 "두 갈래 길"
 LR_DEF_two_roads_desc:0 "점령은 오래갈 것입니다. 승전국과 손을 잡으면 배급이 늘고, 숲으로 들어가면 자유를 지킵니다. 프랑스는 둘로 갈라집니다. 이 결정은 되돌릴 수 없습니다."
 LR_DEF_cooperate:0 "승전국과의 협력"
 LR_DEF_cooperate_desc:0 "점령군 사령관이 같은 식탁에 앉자고 합니다. 협력하면 배급은 늘고 포로는 돌아옵니다. 그 대가를 사람들은 오래 기억할 것입니다."
 LR_DEF_collab_admin:0 "협력 행정부"
 LR_DEF_collab_admin_desc:0 "승전국의 감독관이 각 부처에 앉습니다. 프랑스 공무원들이 그들의 지시를 받아 적습니다. 행정은 굴러가고 기차는 제시간에 달립니다."
 LR_DEF_reparations_paid:0 "배상금 완납"
 LR_DEF_reparations_paid_desc:0 "배상금은 두 번째 패전의 값입니다. 마지막 배상금 수표에 서명합니다. 금고는 비었지만, 승전국은 이제 프랑스에 요구할 것이 없습니다."
 LR_DEF_autonomy:0 "자치 회복"
 LR_DEF_autonomy_desc:0 "충실한 협력의 대가로 승전국이 프랑스의 자치를 넓혀 주겠다고 합니다. 감독관들이 짐을 쌉니다. 그러나 주권을 돌려받은 정부가 그 주권을 어디에 쓸지는 아직 정해지지 않았습니다."
 LR_DEF_resist:0 "숲으로"
 LR_DEF_resist_desc:0 "점령군이 징용 명단을 붙였습니다. 젊은이들이 명단을 보고 그날 밤 숲으로 들어갑니다. 정부는 공식적으로 그들을 모른다고 말합니다. 비공식적으로는 다릅니다."
 LR_DEF_maquis:0 "마키"
 LR_DEF_maquis_desc:0 "알프스와 마시프상트랄의 숲에 저항 거점이 생깁니다. 농부들은 그들에게 빵을 주고 헌병들은 못 본 척합니다. 점령군은 그 숲을 지도에 붉게 칠합니다."
 LR_DEF_sabotage:0 "철도 사보타주"
 LR_DEF_sabotage_desc:0 "점령군의 보급은 프랑스 철도로 움직입니다. 철도원들은 어느 다리가 무너지기 쉬운지 압니다. 점령군의 보급 열차가 다리 위에서 멈추고, 철도원 노조가 저항의 가장 큰 무기가 됩니다."
 LR_DEF_secret_army:0 "비밀군"
 LR_DEF_secret_army_desc:0 "해산된 군대의 장교들은 아직 서로의 주소를 압니다. 그들이 지하에서 연대를 다시 짭니다. 무기는 산속 동굴에, 명부는 수녀원 지하실에 숨깁니다."
 LR_DEF_rising:0 "8월의 봉기"
 LR_DEF_rising_desc:0 "파리의 바리케이드가 다시 올라갑니다. 1830년에도, 1848년에도, 1871년에도 그랬습니다. 그때는 왕과 싸웠습니다. 이번에는 점령군을 몰아내려는 것입니다."
 LR_DEF_exile_committee:0 "제네바의 망명 위원회"
 LR_DEF_exile_committee_desc:0 "국경 너머 제네바에 망명자들이 모였습니다. 그들이 자유 프랑스 위원회를 세웁니다. 그들의 방송이 밤마다 프랑스의 라디오에서 몰래 흘러나옵니다."
 LR_DEF_world_opinion:0 "세계 여론"
 LR_DEF_world_opinion_desc:0 "점령의 실상은 승전국 신문에 실리지 않습니다. 스웨덴과 스위스의 기자들이 파리의 배급 줄을 사진으로 찍어 갑니다. 중립국 신문에 실린 사진 한 장이 점령군의 발표보다 멀리 갑니다."
 LR_DEF_curfew:0 "통행금지"
 LR_DEF_curfew_desc:0 "점령군이 통행금지를 선포했습니다. 밤 열 시 이후 파리의 거리는 텅 비고 순찰대의 군화 소리만 울립니다. 카페 주인들은 아홉 시 반에 의자를 테이블 위에 올립니다."
 LR_COM_found_bloc:0 "제2인터내셔널 창설"
 LR_COM_found_bloc_desc:0 "유럽의 노동자들은 국경을 넘어 서로를 동지라 부릅니다. 그러나 그 말을 지켜 줄 나라는 아직 하나도 없었습니다. 파리가 제2인터내셔널을 다시 세우고, 그 깃발 아래 함께 설 정부들을 부릅니다."
 LR_COM_invite_esr:0 "스페인 공화국 초대"
 LR_COM_invite_esr_desc:0 "피레네 너머의 공화파는 내전에서 살아남았습니다. 그들은 왕들의 유럽에서 혼자였고, 무엇과 싸우는지 누구보다 잘 압니다. 마드리드에 손을 내밀어 동맹을 청합니다."
 LR_ANA_found_bloc:0 "제2인터내셔널 창설"
 LR_ANA_found_bloc_desc:0 "유럽의 노동자들은 국경을 넘어 서로를 동지라 부릅니다. 그러나 그 말을 지켜 줄 나라는 아직 하나도 없었습니다. 파리가 제2인터내셔널을 다시 세우고, 그 깃발 아래 함께 설 정부들을 부릅니다."
 LR_ANA_invite_esr:0 "스페인 공화국 초대"
 LR_ANA_invite_esr_desc:0 "피레네 너머의 공화파는 내전에서 살아남았습니다. 그들은 왕들의 유럽에서 혼자였고, 무엇과 싸우는지 누구보다 잘 압니다. 마드리드에 손을 내밀어 동맹을 청합니다."
 LR_RED_found_bloc:0 "제2인터내셔널 창설"
 LR_RED_found_bloc_desc:0 "유럽의 노동자들은 국경을 넘어 서로를 동지라 부릅니다. 그러나 그 말을 지켜 줄 나라는 아직 하나도 없었습니다. 파리가 제2인터내셔널을 다시 세우고, 그 깃발 아래 함께 설 정부들을 부릅니다."
 LR_RED_invite_esr:0 "스페인 공화국 초대"
 LR_RED_invite_esr_desc:0 "피레네 너머의 공화파는 내전에서 살아남았습니다. 그들은 왕들의 유럽에서 혼자였고, 무엇과 싸우는지 누구보다 잘 압니다. 마드리드에 손을 내밀어 동맹을 청합니다."
 LR_JAC_found_bloc:0 "국민전선 창설"
 LR_JAC_found_bloc_desc:0 "왕들의 유럽에서 공화국은 늘 혼자였습니다. 피레네 너머의 공화파와 대서양 건너의 공화국도 마찬가지입니다. 파리가 앞장서 국민전선을 세우고, 의회로 다스리는 나라들을 한자리에 부릅니다."
 LR_JAC_invite_esr:0 "스페인 공화국 초대"
 LR_JAC_invite_esr_desc:0 "피레네 너머의 공화파는 내전에서 살아남았습니다. 그들은 왕들의 유럽에서 혼자였고, 무엇과 싸우는지 누구보다 잘 압니다. 마드리드에 손을 내밀어 동맹을 청합니다."
 LR_JAC_invite_cna:0 "미합중국 초대"
 LR_JAC_invite_cna_desc:0 "대서양 건너 대륙군의 공화국이 영국의 왕관을 벗어던졌습니다. 1778년 프랑스 왕은 그들과 조약을 맺으려다 끝내 맺지 못했습니다. 그때 맺지 못한 조약을 이제 공화국끼리 맺습니다."
 LR_GIR_found_bloc:0 "국민전선 창설"
 LR_GIR_found_bloc_desc:0 "왕들의 유럽에서 공화국은 늘 혼자였습니다. 피레네 너머의 공화파와 대서양 건너의 공화국도 마찬가지입니다. 파리가 앞장서 국민전선을 세우고, 의회로 다스리는 나라들을 한자리에 부릅니다."
 LR_GIR_invite_esr:0 "스페인 공화국 초대"
 LR_GIR_invite_esr_desc:0 "피레네 너머의 공화파는 내전에서 살아남았습니다. 그들은 왕들의 유럽에서 혼자였고, 무엇과 싸우는지 누구보다 잘 압니다. 마드리드에 손을 내밀어 동맹을 청합니다."
 LR_GIR_invite_cna:0 "미합중국 초대"
