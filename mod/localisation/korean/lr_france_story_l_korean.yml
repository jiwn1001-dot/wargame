l_korean:
 lr_story.101.t:0 "샹젤리제의 재향군인들"
 lr_story.101.d:0 "근위 기병 하사 마르탱 퀴리는 튈르리 궁 발코니 아래에서 샹젤리제를 내려다보고 있었다. 훈장을 단 노병 수만 명이 행진해 오고 있었다. 불의 십자단이었다. 맨 앞의 라 로크 대령이 발코니를 향해 칼을 들어 경례했다. 퀴리 옆의 신병이 저 사람들 다 우리 편이냐고 물었다. 퀴리는 오늘은 그렇다고 했다.\n\n저녁에 퀴리는 서재 앞 보초를 섰다. 시종이 편지 한 통을 들고 들어갔다가 나왔다. 문틈으로 왕이 편지를 읽는 게 보였다. 나중에 시종이 복도에서 투덜거렸다. 대령이 내각 자리 셋을 달라고 했다는 것이었다. 왕관을 지켜 준 게 자기들이라면서.\n\n거리에서는 밤늦게까지 행진곡이 들렸다. 퀴리는 그 노래를 알았다. 그도 작년까지 그 단체 회원이었다."
 lr_story.101.a:0 "자리를 내줘. 저들은 짐의 주먹이다."
 LR_tt_st_lr_story_101_a:0 "§Y정부 정신§! 변화: 독재정 지지 +3%, 정치력 +3%"
 lr_story.101.b:0 "대원들은 군으로 받고, 대령에겐 훈장이나 주게."
 LR_tt_st_lr_story_101_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%"
 lr_story.102.t:0 "베강과 재무장관"
 lr_story.102.d:0 "각료 회의 서기 앙리 데샹은 그날 회의록에 고함이라는 단어를 세 번 썼다.\n\n베강 장군이 문을 거칠게 열고 들어와 예산안을 탁자에 내리꽂았다. \"군사 예산을 두 배로. 아니면 다음 전쟁도 집니다.\" 재무장관 레옹 바르텔은 안경을 벗었다. 서류 가방에서 봉투 하나를 꺼내 탁자에 놓았다. 사표였다. 데샹은 그 봉투를 언제부터 들고 다녔는지 궁금했다. 모서리가 닳아 있었다.\n\n\"그 숫자면 프랑은 겨울을 못 넘깁니다, 폐하. 대포를 고르시든 저를 고르시든 하십시오.\"\n\n두 사람이 동시에 왕을 쳐다보았다. 데샹은 펜을 든 채 기다렸다. 왕은 한참 사표 봉투를 내려다보았다."
 lr_story.102.a:0 "대포가 먼저다. 사표는 수리하게."
 LR_tt_st_lr_story_102_a:0 "§Y정부 정신§! 변화: 안정도 -2%, 전쟁 지지 +3%"
 lr_story.102.b:0 "장군, 돈은 기다려 줘야 생기는 거요."
 LR_tt_st_lr_story_102_b:0 "§Y정부 정신§! 변화: 정치력 +3%\n§G경제 재건§! +1"
 lr_story.103.t:0 "창고 앞의 영국 소령"
 lr_story.103.d:0 "르크뢰조 공장장 쥘 슈네데르는 3번 창고 앞에서 땀을 닦았다. 영국인 하나가 서류철을 들고 서 있었다. 배상 위원회의 회계 감독관 해리슨 소령이었다. 소령은 예의 바르게 웃었다. \"이 창고를 좀 열어 주시겠습니까? 장부에는 농기계 창고라고 돼 있던데요.\"\n\n창고 안에는 75밀리 야포 200문이 기름칠을 한 채 누워 있었다. 조약이 대포를 금지한 적은 없었다. 그러나 프랑스가 런던에 갚을 돈을 대포에 썼다는 것이 알려지면, 다음 달 배상금 협상은 끝장이었다. 슈네데르는 열쇠를 사무실에 두고 왔다고 했다. 소령은 기다리겠다고 했다. 슈네데르는 사무실로 가서 파리에 전보를 쳤다. 손이 떨려서 두 번 고쳐 썼다.\n\n답장을 기다리는 동안 그는 비서를 시켜 소령에게 차를 내갔다. 소령은 차를 마시면서 창고 문을 계속 쳐다보았다. 답장은 한 줄이면 됐다. 쫓아낼 건지, 속일 건지."
 lr_story.103.a:0 "쫓아내. 이제 숨길 것도 없다."
 LR_tt_st_lr_story_103_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.103.b:0 "차나 더 대접하고 빈 창고를 보여 줘."
 LR_tt_st_lr_story_103_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.104.t:0 "벨포르의 연설"
 lr_story.104.d:0 "벨포르 요새 꼭대기는 바람이 셌다. 왕의 망토가 자꾸 얼굴을 덮었다. 부관 피에르 오주는 망토 자락을 잡아 줄까 말까 망설였다. 왕은 신경 쓰지 않고 동쪽을 가리켰다. \"저기 알자스가 있다. 반드시 되찾는다.\" 아래 연병장의 병사들이 함성을 질렀다.\n\n연설은 짧았다. 계단을 내려오는데 시종이 일정표를 내밀었다. 오늘 밤은 두 곳 중 하나였다. 이 요새 막사에서 병사들과 저녁을 먹을지, 아니면 기차로 릴에 가서 파업 직전인 제철소 노동자들 앞에 설지.\n\n오주는 왕이 일정표를 받아 들고 한참 서 있는 걸 보았다. 막사 쪽에서 수프 냄새가 났다."
 lr_story.104.a:0 "병사들이랑 같은 솥 수프를 먹지."
 LR_tt_st_lr_story_104_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.104.b:0 "릴로 가자. 전쟁은 공장에서 시작된다."
 LR_tt_st_lr_story_104_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%\n§G경제 재건§! +2"
 lr_story.105.t:0 "대령들의 음모"
 lr_story.105.d:0 "자정, 왕의 서재. 보안국장 앙드레 질레는 명단 한 장을 책상에 내려놓았다. 대령 열두 명의 이름이었다. 질레는 이 명단을 만들려고 두 달 동안 장교 식당에 사람을 심었다.\n\n\"폐하께서 너무 느리시다고 합니다. 폐하를 끌어내리지는 않겠지만, 폐하의 손을 대신 움직이겠다고 맹세했답니다.\"\n\n왕은 명단을 위에서부터 천천히 읽었다. 질레는 왕의 눈이 어디서 멈출지 알고 있었다. 맨 아래 줄. 근위 연대장 샤를 드 브리옹. 왕이 열 살 때부터 곁을 지킨 사람이었다. 질레도 그 이름을 적을 때 한참 망설였다.\n\n왕은 명단을 내려놓고 창밖을 보았다. 근위대 막사에 불이 하나 켜져 있었다."
 lr_story.105.a:0 "전부 군법회의에 넘겨. 짐의 군대에 주인은 하나다."
 LR_tt_st_lr_story_105_a:0 "§Y정부 정신§! 변화: 육군 조직력 -2%, 안정도 +4%"
 lr_story.105.b:0 "장군으로 올려서 전선으로 보내. 그 열정은 쓸 데가 있다."
 LR_tt_st_lr_story_105_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 안정도 -2%, 전쟁 지지 +2%"
 lr_story.106.t:0 "복수의 날"
 lr_story.106.d:0 "참모본부 동원과장 루이 페랭은 동원령 초안을 왕의 책상에 올려놓았다. 스무 해 가까이 숨겨 온 일이었다. 예산서에는 도로 보수비로 적힌 탄약고, 트랙터 공장이라던 전차 공장, 농업 통계국 간판을 단 작전과. 페랭은 그 간판 문구를 직접 지은 사람이었다. 트랙터 공장이라는 건 그의 아이디어였다.\n\n유럽은 아직 몰랐다. 배상 위원회 감독관들은 차를 마시고 돌아갔고, 런던 신문은 프랑스가 드디어 분수를 안다고 칭찬했다. 페랭은 그 기사를 오려서 지갑에 넣고 다녔다.\n\n왕은 초안을 끝까지 읽고 펜을 들었다. \"1918년에 멈춘 시계를 다시 돌린다.\" 페랭은 서명이 끝나기를 기다렸다. 서명 한 번에 기습이냐 정면이냐가 정해진다."
 lr_story.106.d2:0 "참모본부 동원과장 루이 페랭은 동원령 초안을 왕의 책상에 올려놓았다. 배상 위원회 감독관들을 국경 밖으로 내보낸 날부터 유럽은 프랑스가 다시 온다는 걸 알았다. 런던과 빈의 신문은 벌써 전쟁 얘기를 했고, 북독일 국경 요새에는 밤에도 불이 켜져 있었다.\n\n기습은 없다. 페랭은 그게 아쉬웠다. 스무 해 동안 숨긴 게 다 소용없어졌다. 그런데 장교 식당 분위기는 오히려 밝았다. 이제 숨기지 않아도 된다며 다들 술을 마셨다.\n\n왕은 초안에 서명하며 말했다. \"정면으로 간다. 1918년에 그들이 그랬듯이.\" 페랭은 고개를 숙였다. 트랙터 공장 간판은 다음 날 아침 떼어졌다."
 lr_story.106.a:0 "숨긴 칼로 찌른다. 첫 달에 끝낸다."
 LR_tt_st_lr_story_106_a:0 "§Y정부 정신§! 변화: 계획 속도 +10%, 전쟁 지지 +5%"
 lr_story.106.b:0 "유럽은 이미 우리를 안다. 정면으로 간다."
 LR_tt_st_lr_story_106_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +8%"
 lr_story.107.t:0 "종이 울리는 아침"
 lr_story.107.d:0 "8월의 아침, 프랑스 전역의 교회 종이 한꺼번에 울렸다. 오베르뉴의 시골 마을 종지기 에밀 그라는 1914년에도 이 종을 쳤다. 그때는 열여섯 살이었다. 오늘은 손주가 기차를 탄다.\n\n마을 광장에 동원령 포스터가 붙었고, 젊은이들이 역으로 걸어갔다. 1914년에는 다들 크리스마스 전에 돌아온다고 노래했다. 오늘은 아무도 노래하지 않았다. 그라는 그게 더 나은지 나쁜지 몰랐다.\n\n같은 시각 파리 동역에서 왕이 출정하는 연대를 사열했다. 참모총장이 왕에게 물었다고 신문은 썼다. 폐하께서 전선에 나가시겠느냐고, 파리에서 지휘하시겠느냐고. 그라는 그 기사를 저녁에 읽었다. 왕이 뭐라고 답할지 궁금했다."
 lr_story.107.a:0 "짐도 전선에 선다. 1918년 장군들처럼 뒤에 숨지 않는다."
 LR_tt_st_lr_story_107_a:0 "§Y정부 정신§! 변화: 육군 사기 +4%, 안정도 -2%"
 lr_story.107.b:0 "짐은 파리에 남는다. 전쟁은 참모본부에서 이기는 거다."
 LR_tt_st_lr_story_107_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%, 정치력 +3%"
 lr_story.108.t:0 "포츠담의 왕"
 lr_story.108.d:0 "포츠담 상수시 궁전. 통신 장교 마르셀 르페브르는 프리드리히 대왕의 서재 앞에서 파리 전보를 정리하고 있었다. 왕이 그 서재를 집무실로 쓰고 있었다.\n\n전보는 두 종류였다. 하나는 열광이었다. 국민이 거리로 나왔고, 재향군인회는 베를린에서 개선 행진을 하자고 했다. 다른 하나는 청원서였다. 동원된 병사들의 가족이 보낸 것이었다. 이제 아들을 돌려 달라고. 청원서가 세 배 많았다. 르페브르는 열광 쪽을 위에 올려놓았다가, 잠깐 생각하고 순서를 바꿨다.\n\n왕은 두 묶음을 다 읽었다. 르페브르는 왕이 청원서 한 장을 오래 들고 있는 걸 보았다. 랭스의 어느 과부가 쓴 것이었다. 맞춤법이 다 틀린 편지였다."
 lr_story.108.a:0 "베를린에서 개선 행진을 한다. 빚을 갚는 날이다."
 LR_tt_st_lr_story_108_a:0 "§Y정부 정신§! 변화: 안정도 +2%, 전쟁 지지 +5%"
 lr_story.108.b:0 "몇 개 연대는 집으로 보내. 약속은 지킨다."
 LR_tt_st_lr_story_108_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 +4%"
 lr_story.109.t:0 "복수 다음의 날"
 lr_story.109.d:0 "튈르리 궁 회의실. 늙은 재무장관 레옹 바르텔은 회의 내내 아무 말도 하지 않았다. 탁자 위 유럽 지도에는 프랑스의 색이 라인강 너머까지 칠해져 있었다. 1918년 항복 문서에 서명한 장군들은 다 죽었거나 물러났다.\n\n회의실의 젊은 장군들은 만족하지 않았다. 몇 년 전 대령들의 음모에 이름이 올랐던 사람들이었다. 이제 장군이 된 그들은 다음 전쟁 얘기를 했다. 동쪽으로, 남쪽으로. 바르텔은 그 사람들이 지도를 짚는 손가락을 보았다. 다들 젊었다.\n\n회의가 끝날 무렵 바르텔이 처음 입을 열었다. 목소리가 작아서 장군들이 말을 멈춰야 했다. \"폐하, 복수는 끝났습니다. 이제 무엇을 위해 싸우십니까?\"\n\n아무도 대답하지 않았다. 왕도 바로 대답하지 않았다."
 lr_story.109.a:0 "군을 줄이고 국경을 굳힌다. 짐은 평화로 기억되겠다."
 LR_tt_st_lr_story_109_a:0 "§Y정부 정신§! 변화: 안정도 +6%, 전쟁 지지 -3%"
 lr_story.109.b:0 "군은 그대로 둔다. 영광은 국경에서 멈추지 않는다."
 LR_tt_st_lr_story_109_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +5%"
 lr_story.201.t:0 "고등법원의 항명"
 lr_story.201.d:0 "되살아난 파리 고등법원. 법원 서기 앙투안 베르제는 붉은 법복의 법관들이 줄지어 일어서는 걸 보았다. 왕의 첫 칙령을 등록하지 않겠다는 표시였다. 법원이 다시 열린 지 석 달째였다.\n\n왕의 사절이 물었다. 칙령을 거부하는 거냐고. 수석 법관이 대답했다. \"간언은 저희 조상 대대의 권리입니다.\" 베르제는 그 문장을 기록하면서 손이 떨렸다. 그 조상들이 마지막으로 그 권리를 쓴 건 1788년이었다. 그다음 해에 무슨 일이 있었는지는 다들 알았다.\n\n저녁에 베르제는 왕궁에서 소식이 왔다는 얘기를 들었다. 왕이 웃지 않았다고 했다. 전통을 살렸더니 그 전통이 손을 물었다고. 옛 왕들은 이럴 때 직접 법정에 와서 앉았다. 베르제는 그 의식을 책에서만 읽어 봤다."
 lr_story.201.a:0 "짐이 직접 법정에 앉는다. 등록해."
 LR_tt_st_lr_story_201_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 -1%"
 lr_story.201.b:0 "법관들에게 작위와 연금을 약속하게."
 LR_tt_st_lr_story_201_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.202.t:0 "거울의 방의 청구서"
 lr_story.202.d:0 "베르사유 거울의 방. 궁정 건축가 폴 르보는 먼지 쌓인 샹들리에 아래에서 복원 계획서를 펼쳤다. 거울 357장 가운데 금 간 게 112장이었다. 르보는 그 숫자를 사흘 동안 셌다.\n\n궁정 대신이 말했다. \"유럽의 왕들이 보게 될 궁입니다. 왕권은 보여야 존재합니다.\" 르보는 고개를 끄덕였다. 그는 이 일을 평생 기다렸다.\n\n재무장관이 다른 서류를 펼쳤다. 지붕이 새는 파리 시립 병원 목록이었다. \"거울 하나 값이면 병상 서른 개입니다.\" 르보는 그 계산이 맞는지 속으로 따져 봤다. 대충 맞았다. 그게 마음에 들지 않았다."
 lr_story.202.a:0 "왕권은 보여야 존재한다. 궁을 빛내."
 LR_tt_st_lr_story_202_a:0 "§Y정부 정신§! 변화: 소비재 공장 +1%, 정치력 +3%"
 lr_story.202.b:0 "궁은 절반만 쓰지. 나머지는 병원에 줘."
 LR_tt_st_lr_story_202_b:0 "§Y정부 정신§! 변화: 안정도 +3%\n모든 지역 §Y반발도§! -15"
 lr_story.203.t:0 "왕관과 교실"
 lr_story.203.d:0 "튈르리 궁 대기실. 왕립과학원 사무관 샤를 비오는 원장의 편지를 들고 한 시간째 기다리고 있었다. 먼저 들어간 사람들이 있었다. 검은 수단을 입은 예수회 신부 셋이었다. 두 세기 만에 튈르리에 돌아온 사람들이라고 했다.\n\n신부들은 사십 분 뒤에 나왔다. 비오 옆을 지나가며 한 신부가 다른 신부에게 말했다. \"한 세대면 시골 아이들이 다 왕을 사랑하게 될 거요.\" 프랑스의 학교를 맡겨 달라는 청원이었다는 걸 비오는 나중에 알았다.\n\n비오의 차례가 됐다. 원장의 편지는 짧았다. 라틴어 기도로는 강철을 만들 수 없습니다. 비오는 그 문장을 쓴 원장이 이 대기실에서 신부들을 봤다면 뭐라고 했을지 생각했다. 왕은 편지를 받아 신부들의 청원서 옆에 나란히 놓았다."
 lr_story.203.a:0 "왕관과 제단은 하나다. 학교는 신부들에게."
 LR_tt_st_lr_story_203_a:0 "§Y정부 정신§! 변화: 연구 속도 -1%, 안정도 +4%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.203.b:0 "신부는 교회로, 교실은 과학원으로."
 LR_tt_st_lr_story_203_b:0 "§Y정부 정신§! 변화: 연구 속도 +3%"
 lr_story.204.t:0 "포부르 생탕투안의 겨울"
 lr_story.204.d:0 "포부르 생탕투안, 1월. 빵집 주인 마리 고티에는 아침에 빵값을 두 배로 써 붙였다. 밀가루 값이 그렇게 올랐다. 그녀도 어쩔 수 없었다. 열 시쯤 빈 바구니를 든 여자들이 가게 앞에 모였다가, 시청 쪽으로 걸어갔다.\n\n같은 시각 튈르리 궁. 늙은 장관 하나가 왕의 귀에 속삭였다는 얘기는 나중에 신문에 실렸다. 폐하, 1789년도 빵으로 시작했습니다.\n\n오후에 시청 앞에서 누가 노래를 시작했다. 고티에는 가게 문을 닫으면서 그 노래를 들었다. 할머니가 부엌에서 작은 소리로 부르던 노래였다. 백오십 년 전 왕을 끌어내릴 뻔했던 노래. 할머니는 그 노래를 부를 때 늘 창문을 닫았다. 오늘은 창문이 다 열려 있었다."
 lr_story.204.a:0 "왕실 곡물 창고를 열어."
 LR_tt_st_lr_story_204_a:0 "§Y정부 정신§! 변화: 정치력 -1%, 안정도 +2%\n모든 지역 §Y반발도§! -15"
 lr_story.204.b:0 "기병대를 보내. 이번엔 진압한다."
 LR_tt_st_lr_story_204_b:0 "§Y정부 정신§! 변화: 안정도 -2%, 전쟁 지지 +2%"
 lr_story.205.t:0 "마드리드에서 온 편지"
 lr_story.205.d:0 "외무부 서기관 로랑 바스티드는 금박 봉인이 찍힌 편지를 들고 왕에게 갔다. 마드리드에서 온 것이었다. 스페인 왕이 왕세자의 혼담을 제안했다.\n\n편지에는 이런 문장이 있었다. 우리 두 부르봉 가문이 하나가 되면 피레네는 산이 아니라 정원의 담장일 뿐이오, 사촌. 바스티드는 그 문장이 좀 과하다고 생각했다. 스페인 왕은 원래 그런 사람이었다.\n\n바스티드는 편지와 함께 런던 대사관 전보를 내려놓았다. 영국 외무부가 벌써 이 혼담 얘기를 알고 있었다. 위트레흐트 조약을 언급했다고 했다. 두 왕관이 합쳐지는 걸 막겠다고 2백 년 전에 맹세한 나라였다. 왕은 편지를 먼저 읽고, 전보를 나중에 읽었다. 전보를 더 오래 읽었다."
 lr_story.205.a:0 "혼인을 받는다. 피레네는 이제 없다."
 LR_tt_st_lr_story_205_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +2%"
 lr_story.205.b:0 "정중히 거절해. 프랑스 왕은 프랑스만 다스린다."
 LR_tt_st_lr_story_205_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.206.t:0 "태양왕의 후계"
 lr_story.206.d:0 "베르사유, 즉위 기념식. 기술자 노엘 브뤼네는 왕립과학원 대표단 맨 끝줄에 서 있었다. 자기가 왜 초대받았는지 몰랐다. 철도 신호기를 개량한 것밖에 없었다.\n\n왕의 연설에는 신의 은총보다 공장과 학교가 더 많이 나왔다. 브뤼네는 세어 봤다. 공장 여섯 번, 학교 아홉 번, 신 두 번. 앞줄의 늙은 귀족들이 얼굴을 찌푸렸다. 브뤼네 옆의 젊은 화학자가 작게 휘파람을 불었다가 옆 사람에게 꼬집혔다.\n\n왕은 볼테르를 읽은 왕이었다. 과학원 보고서를 끝까지 읽는 몇 안 되는 왕이라는 소문도 있었다. 연설이 끝나고 브뤼네는 처음으로 왕을 믿어 볼까 생각했다. 그 생각이 들자 좀 겁이 났다. 왕을 믿는다는 건 그에게 익숙한 일이 아니었다."
 lr_story.206.d2:0 "랭스 대성당. 대학생 피에르 몽셀은 군중 맨 뒤에서 행렬을 보고 있었다. 성유가 왕의 이마에 다시 묻었다. 예수회 학교 아이들이 행렬을 따라 찬가를 불렀다. 대주교는 왕이 신의 대리인이라고 선포했다. 수백 년 묵은 의식이 한 구절도 빠지지 않았다.\n\n몽셀은 역사학과 학생이었다. 백오십 년 전 의식과 똑같다는 걸 알았다. 다른 게 있다면 그때의 왕에게는 비밀경찰과 철도와 전신이 없었다. 지금의 왕에게는 다 있었다. 성당 앞 광장에도 사복 경찰이 몇 명 보였다.\n\n몽셀이 옆의 친구에게 작게 물었다. \"다음 혁명은 언제쯤일까.\" 친구는 대답 대신 그의 팔을 잡아끌었다. 둘은 행렬이 끝나기 전에 광장을 빠져나왔다."
 lr_story.206.a:0 "왕은 신 아래, 프랑스는 왕 아래 있다."
 LR_tt_st_lr_story_206_a:0 "§Y정부 정신§! 변화: 정치력 +5%, 안정도 +6%"
 lr_story.206.b:0 "짐은 이 나라의 첫째 공복이다."
 LR_tt_st_lr_story_206_b:0 "§Y정부 정신§! 변화: 공장 생산량 +3%, 연구 속도 +3%"
 lr_story.207.t:0 "노트르담의 테 데움"
 lr_story.207.d:0 "노트르담 대성당. 파리 대주교가 출정하는 군대를 위해 테 데움을 불렀다. 왕은 성왕 루이의 검을 제단 위에 올려놓았다가 다시 집어 들었다. 근위대 중위 쥘리앵 아르노는 그 검이 생각보다 낡았다고 생각했다.\n\n미사가 끝나고 성당 앞 광장에 나서자 군중이 환호했다. 아르노는 광장 한쪽 구석을 보았다. 거기 모인 사람들은 소리를 내지 않았다. 작업복 차림이었다. 노동자 구역에서 온 사람들이었다. 내일 그들의 아들들도 기차를 탄다.\n\n궁정 대신이 왕에게 다가가 속삭였다. 저 사람들에게도 한마디 해 주시라고. 아르노는 왕의 옆에 서 있어서 그 말을 들었다. 왕은 구석 쪽을 한 번 보았다."
 lr_story.207.a:0 "저쪽으로 가지. 짐이 직접 말하겠다."
 LR_tt_st_lr_story_207_a:0 "§Y정부 정신§! 변화: 사회주의 지지 -2%, 안정도 +4%"
 lr_story.207.b:0 "왕은 왕의 자리에 있는다. 신이 프랑스와 함께하신다."
 LR_tt_st_lr_story_207_b:0 "§Y정부 정신§! 변화: 전쟁 지지 +4%"
 lr_story.208.t:0 "베를린에서 온 승전보"
 lr_story.208.d:0 "외무부 서기관 로랑 바스티드는 그날 축하 전보를 서른 통 받았다. 프로이센이 무너졌다는 소식이 마드리드와 나폴리에도 동시에 전해졌다. 세 부르봉 왕궁에서 같은 날 축포가 울렸다.\n\n마드리드 전보는 길었다. 축하 인사가 절반, 나머지 절반은 청구서였다. 스페인 군대가 피레네를 지킨 대가로 모로코 땅 일부를 달라고 했다. 바스티드는 지도를 펼쳐 봤다. 스페인 군대가 피레네를 지켰다는 건 사실이었다. 그 기간 동안 피레네를 넘어온 적은 아무도 없었다.\n\n궁정 회의에서 대신들은 의견이 갈렸다. 가문의 의리와 프랑스의 이익이 늘 같은 건 아니었다. 바스티드는 회의록을 쓰면서 마드리드에 보낼 답장 초안을 두 개 만들어 두었다."
 lr_story.208.a:0 "사촌 청을 들어줘. 부르봉의 피는 땅보다 진하다."
 LR_tt_st_lr_story_208_a:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.208.b:0 "정중히 미뤄. 왕관은 프랑스의 것이다."
 LR_tt_st_lr_story_208_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.209.t:0 "왕들의 회의"
 lr_story.209.d:0 "베르사유 거울의 방. 통역관 클레망스 오리는 유럽의 왕과 대공들 사이를 오가며 귓속말로 통역했다. 2차 대불전쟁 뒤 빈 회의에서 혁명 프랑스를 묶었던 왕들의 후손이 부르봉의 초대로 다 모였다.\n\n왕이 일어나서 신성 동맹을 다시 맺자고 했다. 왕관과 제단을 지키는 동맹. 다시는 어느 나라에서도 혁명이 일어나지 않도록. 오리는 그 연설을 독일어로 옮겼다. 혁명이라는 단어가 나올 때마다 몇몇 대공이 고개를 끄덕였다.\n\n회의장 끝자리에서 젊은 대공 하나가 손을 들었다. 오리는 그 사람 말을 프랑스어로 옮겨야 했다. 옮기기 전에 잠깐 망설였다. \"폐하, 프랑스는 150년 전에 혁명을 막지 못했습니다. 이번엔 뭐가 다릅니까?\" 회의장이 조용해졌다. 왕이 오리를 쳐다보았다. 오리는 정확하게 옮겼다고 고개를 끄덕였다."
 lr_story.209.a:0 "동맹을 맺는다. 혁명은 다시 오지 않는다."
 LR_tt_st_lr_story_209_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 +5%"
 lr_story.209.b:0 "동맹 대신 헌장을 약속하지. 왕도 법 아래 있다."
 LR_tt_st_lr_story_209_b:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +4%"
 lr_story.301.t:0 "48구역 대회"
 lr_story.301.d:0 "파리 시청 대회의실. 48구역 대표 대회의 속기를 맡은 제빵사의 딸 쥐스틴 라포르그는 나흘째 손목에 붕대를 감고 있었다. 속기할 게 너무 많았다. 대부분 고함이었다.\n\n왼쪽에서 누가 외쳤다. \"공장 일은 공장이 정한다! 모든 권력을 평의회로!\" 오른쪽에서 맞받았다. \"왕들이 국경에 군대를 모으는데 회의만 할 거요? 중앙위원회가 있어야 해!\" 쥐스틴은 둘 다 받아 적었다. 어느 쪽이 맞는지는 몰랐다. 아버지 빵집은 사흘째 밀가루가 없었다.\n\n넷째 날 오후, 의장이 종을 너무 세게 내리쳐서 종이 쪼개졌다. 회의실이 잠깐 웃음바다가 됐다. 의장은 쪼개진 종을 들고 서 있다가 표결로 정하자고 했다."
 lr_story.301.a:0 "모든 권력을 평의회로. 아래에서 위로 간다."
 LR_tt_st_lr_story_301_a:0 "§Y정부 정신§! 변화: 안정도 +3%\n§G경제 재건§! +1"
 lr_story.301.b:0 "중앙위원회가 지휘한다. 지금은 전쟁이다."
 LR_tt_st_lr_story_301_b:0 "§Y정부 정신§! 변화: 정치력 +4%"
 lr_story.302.t:0 "견장을 떼어낸 대위"
 lr_story.302.d:0 "제4보병연대 하사 베르나르 콩브는 연대장 선거에서 기권했다. 당선된 건 어제까지 취사병이던 질베르였다. 질베르는 당선 연설을 하다가 지도를 거꾸로 들고 있는 걸 알아채고 웃었다. 병사들도 웃었다. 콩브는 웃지 않았다.\n\n콩브는 1918년에 아르덴에서 싸웠다. 전쟁을 아는 사람은 연대에 다섯도 안 남았다. 왕의 군대에서 쫓겨난 장교들은 수천 명이 집에서 소집장만 기다리고 있었다.\n\n그날 저녁 국방 위원회 회의 얘기가 병영까지 흘러왔다. \"반혁명분자한테 다시 지휘를 맡기자는 거요?\" \"그럼 취사병한테 전차를 맡길 거요?\" 콩브는 그 얘기를 듣고 질베르를 쳐다봤다. 질베르는 냄비를 닦고 있었다. 버릇이었다."
 lr_story.302.a:0 "옛 장교를 쓰되 정치위원을 붙여."
 LR_tt_st_lr_story_302_a:0 "§Y정부 정신§! 변화: 육군 조직력 +3%"
 lr_story.302.b:0 "장교는 병사가 뽑는다. 그게 혁명이다."
 LR_tt_st_lr_story_302_b:0 "§Y정부 정신§! 변화: 육군 사기 +4%"
 lr_story.303.t:0 "혁명 재판소"
 lr_story.303.d:0 "콩시에르주리 감옥 간수 레몽 바이는 명단을 들고 감방을 돌았다. 왕당파 귀족과 장군 400명. 바이는 그중 몇 사람 얼굴을 알았다. 신문 사진에서 본 사람들이었다. 감방 안에서는 다들 그냥 늙은 남자들이었다.\n\n오후에 혁명 재판소장이 감옥에 왔다. 창고 열쇠를 달라고 했다. 바이는 창고에 뭐가 있는지 알았다. \"단두대는 아직 있습니다. 150년 묵은 기름만 닦으면 됩니다.\" 소장은 그 말을 하고 웃지 않았다.\n\n저녁에 시청 광장에서 군중이 이름을 하나씩 외치는 소리가 감옥까지 들렸다. 바이는 명단을 들여다보았다. 군중이 외치는 이름이 명단 순서와 똑같았다. 누가 명단을 흘린 거였다."
 lr_story.303.a:0 "혁명은 두 번 실패하지 않는다. 단두대를 꺼내."
 LR_tt_st_lr_story_303_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 -3%\n모든 지역 §Y반발도§! -15\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.303.b:0 "추방해. 우리는 저들과 다르다."
 LR_tt_st_lr_story_303_b:0 "§Y정부 정신§! 변화: 안정도 +4%"
 lr_story.304.t:0 "봉쇄의 겨울"
 lr_story.304.d:0 "생드니 배급소의 배급원 아녜스 루셀은 아침 여섯 시에 셔터를 올렸다. 줄은 이미 블록 끝까지 이어져 있었다. 왕들의 유럽이 코뮌을 봉쇄한 지 넉 달째였다. 석탄 열차가 멈췄고, 공장 굴뚝이 하나씩 식었다.\n\n빵은 정오 전에 떨어졌다. 아녜스는 줄 끝 사람들에게 내일 다시 오라고 했다. 아무도 화를 내지 않았다. 그게 더 무서웠다.\n\n농민들은 곡물을 내놓지 않았다. 코뮌한테 땅을 받은 바로 그 농민들이었다. 위원회에서는 둘로 갈렸다고 했다. 징발하자는 쪽과, 농민을 적으로 돌리면 1년도 못 간다는 쪽. 아녜스의 친정은 보스의 밀 농가였다. 아버지가 지난주에 편지를 보냈다. 곡식은 헛간 바닥 아래 있다고. 아무한테도 말하지 말라고."
 lr_story.304.a:0 "징발한다. 공장이 서면 혁명도 선다."
 LR_tt_st_lr_story_304_a:0 "§Y정부 정신§! 변화: 안정도 -3%\n§G경제 재건§! +2"
 lr_story.304.b:0 "시장을 열어 줘. 농민과의 약속이 먼저다."
 LR_tt_st_lr_story_304_b:0 "§Y정부 정신§! 변화: 사회주의 지지 -1%, 안정도 +3%"
 lr_story.305.t:0 "툴롱의 수병들"
 lr_story.305.d:0 "툴롱 해안 포대장 장 루이 마레는 망원경으로 군항을 내려다보았다. 순양함 세 척이 붉은 깃발을 올린 채 닻을 내리고 있었다. 함포는 바다가 아니라 시내 쪽을 향해 있었다.\n\n수병들의 요구안은 아침에 파리로 갔다. 자유 선거, 언론 자유, 정치위원 폐지. 마레는 그 요구안 사본을 읽었다. 틀린 말은 하나도 없었다.\n\n오후에 파리에서 위원이 내려왔다. 위원은 요구안을 구겨 쥐었다. \"작년 봄에 왕의 장교들을 제일 먼저 바다에 던진 게 저 수병들이오.\" 그리고 마레를 보았다. 포대의 대포를 군항 쪽으로 돌릴 수 있느냐고. 마레는 돌릴 수 있다고 했다. 기술적으로는."
 lr_story.305.a:0 "반혁명이다. 포를 돌려."
 LR_tt_st_lr_story_305_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 -2%, 전쟁 지지 +3%"
 lr_story.305.b:0 "절반은 들어줘. 동지한테 총은 안 겨눈다."
 LR_tt_st_lr_story_305_b:0 "§Y정부 정신§! 변화: 정치력 -1%, 안정도 +4%"
 lr_story.306.t:0 "혁명력 원년"
 lr_story.306.d:0 "노동자 대학 첫 졸업식. 선반공 출신 졸업생 레옹 도레는 모자를 던지고 나서 그게 빌린 모자라는 걸 기억했다. 잔디밭을 한참 뒤져서 찾았다.\n\n같은 날 코뮌이 새 헌법과 새 달력을 선포했다. 시청 앞 광장이 붉은 깃발로 가득 찼다. 위원회는 재판 없이 죽은 사람이 하나도 없다고 자랑했다. 도레는 그 연설을 졸업식장 확성기로 들었다. 사실인지는 몰랐다. 사실이길 바랐다.\n\n왕들의 유럽은 이 나라가 곧 무너진다고 했다. 이 년째였다. 도레는 모자를 돌려주러 가면서, 내일 어느 공장으로 배치될지 생각했다. 처음으로 무엇을 부술지가 아니라 무엇을 지을지 생각하고 있었다."
 lr_story.306.d2:0 "콩코르드 광장. 레옹 도레는 노동자 대학 동기와 함께 광장 가장자리에 서 있었다. 단두대는 치워지지 않았다. 지난달에는 위원회 온건파 둘이 올라갔다. 이번 주에는 그들을 고발한 사람이 올라갔다.\n\n칼날이 떨어지자 광장 사람들이 박수를 쳤다. 도레도 쳤다. 그러면서 옆 사람이 얼마나 오래 치는지 곁눈질했다. 동기가 먼저 멈추자 도레도 멈췄다. 너무 일찍 멈춘 건 아닌지 신경이 쓰였다.\n\n돌아오는 길에 동기가 작게 말했다. 150년 전에도 이랬다고 역사 시간에 배웠다고. 도레는 대답하지 않았다. 위원들도 그 역사를 다 읽었을 거다. 다들 자기는 다르다고 믿고 있을 거다."
 lr_story.306.a:0 "공포는 정의의 다른 이름이다."
 LR_tt_st_lr_story_306_a:0 "§Y정부 정신§! 변화: 정치력 +5%, 안정도 -2%, 전쟁 지지 +6%"
 lr_story.306.b:0 "우리는 피 대신 학교로 세웠다."
 LR_tt_st_lr_story_306_b:0 "§Y정부 정신§! 변화: 연구 속도 +3%, 안정도 +5%"
 lr_story.307.t:0 "조국이 위험하다"
 lr_story.307.d:0 "시청 발코니에 커다란 현수막이 걸렸다. 조국이 위험하다. 1792년 국민공회가 내걸었던 문장이었다. 르노 공장 평의회 서기 마르셀 앙리는 지원병 명부를 들고 공장을 돌았다. 하루 만에 공장 하나에서 1,200명이 이름을 적었다. 파리 전체로는 10만이었다.\n\n문제는 장교였다. 왕의 사관학교를 나온 장교들은 대부분 망명했거나 콩시에르주리에 있었다. 앙리가 명부를 넘기러 국방 위원회에 갔을 때 위원 하나가 그에게 물었다. 공장에서 소대장 할 만한 사람이 몇이나 되느냐고. 앙리는 손가락으로 셌다. 셋이었다.\n\n위원회는 그날 밤 투표를 한다고 했다. 감옥의 장교들을 풀어 줄지."
 lr_story.307.a:0 "감옥 장교들을 풀어. 정치위원을 붙이고."
 LR_tt_st_lr_story_307_a:0 "§Y정부 정신§! 변화: 육군 조직력 +3%, 사회주의 지지 -1%"
 lr_story.307.b:0 "노동자 중에서 뽑는다. 혁명 군대는 혁명가가 이끈다."
 LR_tt_st_lr_story_307_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 사회주의 지지 +2%"
 lr_story.308.t:0 "에센의 붉은 깃발"
 lr_story.308.d:0 "코뮌군 선봉 소대장 피에르 라발레는 에센 시내에 들어서다가 멈췄다. 크루프 공장 굴뚝마다 붉은 깃발이 걸려 있었다. 광부들이 먼저 공장을 점거했다. 정문 앞에서 독일 광부 하나가 프랑스어로 외쳤다. \"늦었네, 동무!\"\n\n사흘 뒤 루르 평의회 대표단이 파리로 갔다. 라발레는 그들을 기차역까지 호위했다. 대표단장은 기차를 타기 전에 그에게 물었다. 우리는 프랑스가 되는 거냐, 아니면 독일 코뮌을 세우는 거냐. 라발레는 그건 자기가 정할 일이 아니라고 했다.\n\n파리 위원회는 그 질문으로 둘로 갈렸다고 했다. 독일 노동자의 자결권을 존중하자는 쪽과, 혁명의 심장은 하나여야 한다는 쪽."
 lr_story.308.a:0 "독일 코뮌을 세우게 해. 형제는 신하가 아니다."
 LR_tt_st_lr_story_308_a:0 "§Y정부 정신§! 변화: 사회주의 지지 +2%, 안정도 +3%"
 lr_story.308.b:0 "파리 지도를 받게 해. 심장은 하나다."
 LR_tt_st_lr_story_308_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 정치력 +4%"
 lr_story.309.t:0 "인터내셔널의 대회"
 lr_story.309.d:0 "몽마르트르 인터내셔널 회관. 통역 자원봉사자 한나 바이스는 베를린 출신이었고, 2년 전까지 망명자였다. 오늘 회관에 모인 대표 3백 명 가운데 절반이 그랬다. 이제 그들은 각자의 나라에서 정부를 이끌었다.\n\n의제는 유럽 노동자 공화국 연방이었다. 파리 대표는 수도를 파리에 두자고 했다. 베를린 대표는 돌아가며 맡자고 했다. 한나는 베를린 대표의 말을 프랑스어로 옮기다가, 그 사람이 자기 삼촌이라는 걸 다들 아는 게 신경 쓰였다.\n\n휴식 시간에 회관 뒤편에서 늙은 코뮌 투사가 담배를 말며 중얼거렸다. \"1871년엔 72일 만에 끝났지. 이번엔 얼마나 갈까.\" 한나는 그 말은 통역하지 않았다. 아무도 부탁하지 않았다."
 lr_story.309.a:0 "수도는 파리다. 혁명이 시작된 곳이다."
 LR_tt_st_lr_story_309_a:0 "§Y정부 정신§! 변화: 정치력 +5%, 전쟁 지지 +2%"
 lr_story.309.b:0 "돌아가며 맡는다. 연방은 평등해야 한다."
 LR_tt_st_lr_story_309_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +3%, 안정도 +5%"
 lr_story.401.t:0 "마티뇽의 밤"
 lr_story.401.d:0 "총리 관저 마티뇽, 새벽 세 시. 관저 요리사 쥘 브레송은 커피를 다섯 번째로 끓이고 있었다. 회의실에는 노동총동맹 대표와 사용자 단체가 마주 앉아 있었다. 바깥에서는 200만 명이 공장을 점거하고 있었다.\n\n브레송이 커피를 들고 들어갔을 때 사용자 대표가 말하는 중이었다. \"7%. 그 이상은 회사가 망합니다.\" 노조 대표가 커피잔을 받으며 대답했다. \"15%가 아니면 내일 아침 300만이 됩니다.\" 그리고 브레송에게 고맙다고 했다. 사용자 대표는 아무 말도 하지 않았다.\n\n레옹 블룸은 안경을 벗어 닦고 있었다. 브레송은 이 관저에서 총리 셋을 모셨다. 안경을 닦는 총리는 처음이었다. 그건 시간을 버는 버릇 같았다."
 lr_story.401.a:0 "15%. 공화국은 누구 편인지 숨기지 않는다."
 LR_tt_st_lr_story_401_a:0 "§Y정부 정신§! 변화: 안정도 +2%\n§Y의석§! +18"
 lr_story.401.b:0 "12%로 끝내지. 공장은 돌아야 한다."
 LR_tt_st_lr_story_401_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%\n§G경제 재건§! +2"
 lr_story.402.t:0 "금이 빠져나간다"
 lr_story.402.d:0 "재무부 차관 앙리 뤼시는 프랑스은행에서 뛰어왔다. 숨이 차서 말을 제대로 못 했다. \"금이, 빠져나갑니다. 제네바로. 하루에 트럭 열 대.\" 블룸은 고개를 끄덕였다. 놀라지 않은 얼굴이었다.\n\n200가문의 답장이었다. 마티뇽 협정에 대한. 뤼시는 금 반출 목록을 탁자에 펼쳤다. 이름은 다 아는 이름이었다. 그중 하나는 뤼시의 대학 동창 아버지였다.\n\n같은 날 저녁 관저에 초대장이 왔다. 은행가 클럽에서, 총리와 조용히 식사하고 싶다고. 금박 봉투였다. 블룸은 초대장과 환율표를 나란히 놓고 오래 바라봤다. 뤼시는 옆에서 기다렸다. 환율표의 숫자는 그 사이에도 오르고 있었다."
 lr_story.402.a:0 "국경에서 금 가방을 열어."
 LR_tt_st_lr_story_402_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 +1%\n§Y의석§! +12"
 lr_story.402.b:0 "저녁은 먹지. 공화국은 아직 돈이 필요해."
 LR_tt_st_lr_story_402_b:0 "§Y정부 정신§! 변화: 소비재 공장 -2%"
 lr_story.403.t:0 "로베스피에르의 초상"
 lr_story.403.d:0 "팔레 부르봉 수위 마르셀 피노는 아침에 복도를 돌다가 초상화 한 점을 발견했다. 밤사이 누가 걸어 놓았다. 로베스피에르였다. 피노는 떼어야 하는지 몰라서 그대로 두었다.\n\n그날 의회 급진파가 법안을 냈다. 왕당파 음모 앞에서 절차는 사치라며 공안위원회에 비상 권한을 달라는 것이었다. 의원들은 초상화 앞을 지나며 다들 한 번씩 쳐다봤다. 몇은 웃었고, 몇은 걸음을 빨리했다.\n\n오후에 블룸이 그 앞에 오래 서 있었다. 비서가 옆에서 물었다. \"떼어 낼까요, 총리님?\" 피노는 조금 떨어진 데서 사다리를 들고 대기했다. 블룸은 바로 대답하지 않았다."
 lr_story.403.a:0 "덕 없는 공포는 재앙이고, 공포 없는 덕은 무력하다."
 LR_tt_st_lr_story_403_a:0 "§Y정부 정신§! 변화: 정치력 +4%, 안정도 -2%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.403.b:0 "내려. 공화국은 법으로 싸운다."
 LR_tt_st_lr_story_403_b:0 "§Y정부 정신§! 변화: 안정도 +3%\n§Y의석§! +24"
 lr_story.404.t:0 "피레네의 눈길"
 lr_story.404.d:0 "페르피냥 국경 초소. 헌병 하사 루이 카사뉴는 눈 덮인 고갯길을 내려오는 사람들을 세다가 300에서 그만뒀다. 스페인 공화파 피난민이었다. 3천은 될 거라고 했다. 대부분 맨발이었다. 아이를 업은 여자가 많았다.\n\n마드리드 대사의 공문은 그보다 먼저 와 있었다. 범죄자 인도 요구서. 카사뉴는 그 공문을 들고 피난민 행렬을 보았다. 맨 앞의 노인은 지팡이 대신 우산을 짚고 있었다.\n\n초소 뒤 마을 사람들은 명령도 안 기다리고 빵과 담요를 들고 나왔다. 카사뉴의 아내도 그 사이에 있었다. 그녀는 남편에게 손을 흔들고 피난민 쪽으로 걸어갔다. 카사뉴는 파리에서 명령이 오기를 기다렸다."
 lr_story.404.a:0 "다 받아. 공화국은 망명자의 조국이다."
 LR_tt_st_lr_story_404_a:0 "§Y정부 정신§! 변화: 안정도 -1%, 전쟁 지지 +3%"
 lr_story.404.b:0 "수용소에 두고 마드리드와 얘기해."
 LR_tt_st_lr_story_404_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.405.t:0 "두건단의 명단"
 lr_story.405.d:0 "파리 경시청 형사 에밀 보레는 교외 차고 다섯 곳을 급습한 팀에 있었다. 기관총과 폭약이 나왔다. 그리고 서랍 안에서 명단 한 장. 왕당파 장교들의 비밀 결사, 두건단이었다.\n\n명단에는 파리 주둔 장교 40명의 이름이 있었다. 보레는 그중 하나를 알았다. 경시청 경호를 맡았던 대위였다. 지난주에 보레에게 담배를 빌려 간 사람이었다.\n\n명단은 그날 밤 총리 책상에 올라갔다. 전쟁부 장관이 말했다고 했다. 이 사람들을 다 자르면 파리 수비대가 무너진다고. 총리는 대답 대신 명단을 한 번 더 읽었다고 했다. 보레는 퇴근하면서 그 대위의 집 앞을 지나갔다. 창문에 불이 켜져 있었다."
 lr_story.405.a:0 "전부 체포해. 공화국 군대에 왕당파는 없다."
 LR_tt_st_lr_story_405_a:0 "§Y정부 정신§! 변화: 육군 조직력 -2%\n모든 지역 §Y반발도§! -15\n§Y의석§! +18"
 lr_story.405.b:0 "조용히 식민지로 보내."
 LR_tt_st_lr_story_405_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%, 안정도 -1%"
 lr_story.406.t:0 "7월 14일"
 lr_story.406.d:0 "7월 14일, 바스티유 광장. 기관사 앙드레 무통은 처음 받은 유급 휴가 첫날을 광장에서 보내고 있었다. 군악대가 라 마르세예즈를 연주했다. 합법적으로는 백사십 년 만이라고 했다. 무통 옆의 노인은 가사를 다 알았다. 무통은 후렴만 알았다.\n\n광장에서 공장 노동자와 병사들이 섞여 춤을 췄다. 무통의 아내는 내일 아침 기차로 바다를 보러 가자고 했다. 둘 다 바다를 본 적이 없었다. 표는 벌써 사 두었다. 디에프행 3등석.\n\n총리가 연단에서 이 공화국은 누구의 머리도 자르지 않고 여기까지 왔다고 말했다. 귀빈석의 외국 대사들이 불편한 얼굴로 박수를 쳤다. 무통은 그 사람들이 왜 불편한지 알 것 같았다. 혁명이 이렇게 심심하게 성공하면 곤란한 사람들이었다."
 lr_story.406.d2:0 "7월 14일, 바스티유 광장. 기관사 앙드레 무통은 처음 받은 유급 휴가 첫날을 광장에서 보내고 있었다. 군악대 뒤로 공안위원회의 검은 차가 지나갔다. 연단 뒤에는 로베스피에르의 초상이 걸려 있었다. 이제 아무도 그걸 이상하게 보지 않았다.\n\n총리가 덕의 공화국을 말했다. 연단 옆 의원석에 빈자리가 하나 있었다. 무통은 그 자리 주인을 신문에서 본 적이 있었다. 지난달까지 매일 신문에 나오던 의원이었다.\n\n무통의 아내가 옆 사람에게 그 의원이 어디 갔느냐고 물었다. 옆 사람은 대답하지 않고 다른 쪽으로 걸어갔다. 무통은 아내의 팔을 잡았다. 내일 아침 디에프행 기차는 예정대로 떠났다."
 lr_story.406.a:0 "덕의 공화국은 적을 용서하지 않는다."
 LR_tt_st_lr_story_406_a:0 "§Y정부 정신§! 변화: 정치력 +5%, 전쟁 지지 +6%"
 lr_story.406.b:0 "우린 누구의 머리도 자르지 않고 여기까지 왔다."
 LR_tt_st_lr_story_406_b:0 "§Y정부 정신§! 변화: 안정도 +5%\n§Y의석§! +30"
 lr_story.407.t:0 "부르봉 궁의 밤"
 lr_story.407.d:0 "팔레 부르봉 회의장, 새벽 두 시. 속기사 오데트 랑베르는 열네 시간째 펜을 쥐고 있었다. 선전포고 표결이었다. 산악파 의원들은 1792년 의용병 얘기를 했고, 반대파는 1914년 전사자 명단을 읽었다. 진짜로 읽었다. 이름을 한 줄씩. 랑베르는 그것도 다 받아 적어야 했다.\n\n새벽 한 시 반에 총리가 마지막 연설을 했다. 공화국은 왕들에게 둘러싸여 있고, 지금 싸우지 않으면 다음엔 공화국 자체가 없을 거라고.\n\n표결 결과는 찬성이 과반을 조금 넘었다. 반대한 의원들은 자리에 앉은 채 고개를 숙였다. 전사자 명단을 읽던 의원은 명단을 접어서 주머니에 넣었다. 랑베르는 그 사람 이름을 회의록에 한 번 더 적었다. 발언자로."
 lr_story.407.a:0 "반대한 사람들에게도 전시 내각 자리를 줘."
 LR_tt_st_lr_story_407_a:0 "§Y정부 정신§! 변화: 안정도 +4%\n§Y의석§! +18"
 lr_story.407.b:0 "반대파는 패배주의자다."
 LR_tt_st_lr_story_407_b:0 "§Y정부 정신§! 변화: 안정도 -2%, 전쟁 지지 +4%"
 lr_story.408.t:0 "쾰른 시청의 삼색기"
 lr_story.408.d:0 "쾰른 시청 광장. 공화국군 공병 하사 레몽 프티는 왕의 동상 목에 밧줄을 걸었다. 동상은 생각보다 단단히 박혀 있었다. 트럭 두 대가 당겨서야 넘어갔다. 그 자리에 자유의 나무를 심었다. 1794년 혁명군이 이 도시에 처음 왔을 때도 그랬다고 대위가 말했다.\n\n광장 반대편에서는 상인들이 줄을 서 있었다. 군정청 징발 명령서를 들고. 프티는 그 줄을 보고 있다가, 맨 앞의 늙은 빵집 주인과 눈이 마주쳤다. 빵집 주인은 명령서를 흔들어 보였다. 화난 얼굴은 아니었다. 그냥 피곤해 보였다.\n\n그날 밤 군정 장관이 파리에 전보를 보냈다는 얘기를 프티는 막사에서 들었다. 우리는 해방자로 왔는가, 정복자로 왔는가. 프티는 그 질문의 답을 알 것 같았다. 그 빵집 주인한테 물어보면 될 일이었다."
 lr_story.408.a:0 "징발을 멈추고 시민 의회를 선거로 세워."
 LR_tt_st_lr_story_408_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +3%"
 lr_story.408.b:0 "징발은 계속한다. 해방에도 값이 있다."
 LR_tt_st_lr_story_408_b:0 "§Y정부 정신§! 변화: 공장 생산량 +3%, 안정도 -1%"
 lr_story.409.t:0 "공화국들의 회의"
 lr_story.409.d:0 "뤽상부르 궁. 회의 의전 담당 클로드 마스는 자매 공화국 대표들의 자리 배치로 사흘을 고민했다. 바타비아, 헬베티아, 라인, 남독일. 누가 누구 옆에 앉기 싫어하는지 표를 만들었다. 표가 꽉 찼다.\n\n회의는 감사 인사로 시작했다. 그리고 질문으로 이어졌다. 우리 군대에 프랑스 장교가 있는 건 언제까지냐고. 우리 헌법을 우리가 쓰는 건 언제부터냐고. 헬베티아 대표는 같은 질문을 세 번 했다. 마스는 그 사람 자리를 창가로 한 게 잘한 일인지 생각했다.\n\n총리는 회의를 마치며 말했다. \"1795년의 자매 공화국들은 우리가 지켜 주지 못해서 무너졌습니다. 이번에는 스스로 설 수 있게 하겠습니다.\" 대표들이 박수를 쳤다. 헬베티아 대표는 박수를 치면서 수첩에 무언가를 적었다."
 lr_story.409.a:0 "완전한 자치를 약속하지."
 LR_tt_st_lr_story_409_a:0 "§Y정부 정신§! 변화: 의회정 지지 +3%, 안정도 +5%"
 lr_story.409.b:0 "공동 방위 조약으로 묶는다. 왕들은 아직 있다."
 LR_tt_st_lr_story_409_b:0 "§Y정부 정신§! 변화: 정치력 +3%, 전쟁 지지 +4%"
 lr_story.501.t:0 "보르도 대회"
 lr_story.501.d:0 "보르도 상공회의소 연회. 웨이터 앙리 뒤카스는 샹들리에 아래를 오가며 샴페인을 따랐다. 선주와 공장주가 수백 명이었다. 지롱드의 선거 자금을 댄 사람들이었다.\n\n회장이 잔을 내려놓고 웃었다. \"이제 청구서를 드릴 차례군요. 법인세 인하, 아니면 지방 의회 권한 확대.\" 재무장관이 잔을 들지 않은 채 대답했다. \"둘 다는 안 됩니다.\"\n\n연회장이 잠깐 조용해졌다. 뒤카스는 회장 잔이 비어 있는 걸 보고 채우러 갔다. 회장이 손으로 잔을 덮었다. 뒤카스는 병을 든 채 물러났다."
 lr_story.501.a:0 "세금을 내려. 돈은 공장으로 돌아온다."
 LR_tt_st_lr_story_501_a:0 "§Y정부 정신§! 변화: 공장 생산량 +2%\n§G경제 재건§! +2"
 lr_story.501.b:0 "지방 의회에 권한을. 표는 고향에서 나온다."
 LR_tt_st_lr_story_501_b:0 "§Y정부 정신§! 변화: 안정도 +1%\n§Y의석§! +24"
 lr_story.502.t:0 "파리 문제"
 lr_story.502.d:0 "파리 시청 비서 마틸드 오브리는 시장의 연설문을 타자로 쳤다. 시장이 고쳐 달라고 한 건 한 문장뿐이었다. 보르도의 상인들이 파리를 길들이겠다고? 원래 초안에는 물음표가 없었다. 시장이 직접 그려 넣었다.\n\n어제 내각에서 안이 하나 나왔다. 파리의 자치권을 다른 데파르트망 수준으로 깎자는 것이었다. 1793년, 지롱드파를 단두대로 보낸 건 파리 민중이었다. 지롱드는 그걸 잊지 않았다. 오브리의 할아버지는 그 얘기를 할 때마다 파리 편을 들었다.\n\n오후 세 시, 시장이 발코니에 올라섰다. 광장이 꽉 차 있었다. \"보르도 상인들이 파리를 길들이겠다고? 해 볼 테면 해 보시오!\" 오브리는 창가에서 그 장면을 보았다. 물음표 덕분에 그 문장이 훨씬 좋아졌다고 생각했다."
 lr_story.502.a:0 "파리도 83개 데파르트망 가운데 하나다."
 LR_tt_st_lr_story_502_a:0 "§Y정부 정신§! 변화: 정치력 +3%, 안정도 -2%"
 lr_story.502.b:0 "수도에 특별 예산을 줘. 복수는 정책이 아니다."
 LR_tt_st_lr_story_502_b:0 "§Y정부 정신§! 변화: 안정도 +2%\n모든 지역 §Y반발도§! -15"
 lr_story.503.t:0 "대서양 회사"
 lr_story.503.d:0 "통상부 서기관 장 폴 라사르는 보르도와 낭트 선주들이 놓고 간 서류를 밤새 읽었다. 대서양 회사 설립안. 식민지 무역 독점권을 갖는 회사였다. 380쪽이었다.\n\n서문에는 네덜란드 공화국 얘기가 있었다. 그 나라가 어떻게 부자가 됐는지. 라사르는 그 부분을 빨리 넘겼다. 다 아는 얘기였다. 그가 오래 읽은 건 마지막 장이었다. 조건이 하나 있었다. 회사 이사 한 명이 각료 회의에 의자를 하나 갖는다.\n\n라사르는 아침에 그 쪽을 접어서 장관 책상에 올렸다. 장관은 서류를 넘기다가 접힌 쪽에서 멈췄다. 그리고 라사르를 쳐다봤다."
 lr_story.503.a:0 "의자를 내줘. 상인이 곧 공화국이다."
 LR_tt_st_lr_story_503_a:0 "§Y정부 정신§! 변화: 공장 생산량 +3%, 정치력 +3%, 안정도 -2%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.503.b:0 "돈은 환영이지만 의자는 없어."
 LR_tt_st_lr_story_503_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.504.t:0 "브롱니아르 궁의 비명"
 lr_story.504.d:0 "브롱니아르 궁 증권거래소. 중개인 보조 폴 지라르는 철강주 시세판 앞에서 분필을 들고 서 있었다. 숫자를 고칠 때마다 객장에서 비명이 났다. 하루에 40%가 빠졌다. 오후 두 시에 은행 두 곳이 셔터를 내렸다.\n\n내각의 경제학자가 라디오에 나왔다. 시장은 스스로 고친다고, 살아남은 회사가 더 강해질 거라고. 지라르는 객장 라디오로 그걸 들었다. 옆의 중개인이 라디오를 꺼 버렸다.\n\n퇴근길에 지라르는 문 닫은 은행 앞을 지났다. 예금자들이 줄을 서 있었다. 누가 그 경제학자의 집 주소를 아느냐고 묻고 있었다. 지라르는 알았다. 대답하지 않았다."
 lr_story.504.a:0 "은행을 구한다. 이번 한 번만."
 LR_tt_st_lr_story_504_a:0 "§Y정부 정신§! 변화: 정치력 -1%, 안정도 +4%"
 lr_story.504.b:0 "시장에 맡겨. 살아남는 회사가 더 강해진다."
 LR_tt_st_lr_story_504_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 안정도 -3%\n§G경제 재건§! +2"
 lr_story.505.t:0 "콩도르세의 금고"
 lr_story.505.d:0 "국립문서고 지하 3층. 문서 보존원 엘로이즈 베르니는 백오십 년 동안 아무도 열지 않은 금고 목록을 정리하다가 서류철 하나를 찾았다. 표지에 콩도르세의 이름이 있었다.\n\n1793년, 체포되기 넉 달 전에 쓴 지롱드 헌법 초안이었다. 데파르트망마다 자기 의회와 자기 예산을 갖는 연방 프랑스. 여백에 그의 필체로 한 줄이 적혀 있었다. 파리가 프랑스의 전부가 되어서는 안 된다. 베르니는 장갑 낀 손으로 그 쪽을 오래 들고 있었다.\n\n초안은 일주일 뒤 의회에서 낭독됐다. 지방 의원들이 환호했다. 참모본부에서는 한 줄짜리 질문이 왔다. 전쟁이 나면 누가 명령합니까. 83개 데파르트망 의회입니까. 베르니는 그 질문도 문서고에 보관했다."
 lr_story.505.a:0 "채택한다. 143년 늦은 약속이다."
 LR_tt_st_lr_story_505_a:0 "§Y정부 정신§! 변화: 안정도 +2%, 전쟁 지지 -2%\n§Y의석§! +30"
 lr_story.505.b:0 "전쟁 끝날 때까지 금고에 둬."
 LR_tt_st_lr_story_505_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 전쟁 지지 +2%"
 lr_story.506.t:0 "상인들의 공화국"
 lr_story.506.d:0 "보르도 부두. 하역 감독 로베르 뒤카스는 뉴욕행 정기선이 사이렌을 울리는 걸 들으며 화물 목록을 확인했다. 포도주, 비단, 그리고 처음 보는 품목. 리옹산 라디오 수신기.\n\n총리가 부두 위 임시 연단에서 연설했다. 왕 없는 프랑스가 전쟁 없이도 부자가 될 수 있다는 걸 보여 주겠다고. 뒤카스는 연설을 반쯤 듣다가 하역 순서를 정하러 갔다.\n\n연방 의회 선거에는 생각보다 많은 사람이 나왔다. 데파르트망마다 자기 예산을 두고 다퉜고, 자기 도로를 자랑했다. 뒤카스의 동생은 파리에 살았다. 지난주 편지에서 동생은 처음으로 보르도가 부럽다고 썼다."
 lr_story.506.d2:0 "보르도 부두. 하역 감독 로베르 뒤카스는 대서양 회사 깃발이 공화국 깃발보다 높이 걸린 걸 보았다. 항구 세 곳 가운데 두 곳이 그랬다. 총리가 부두에서 연설했는데, 연설문은 회사 이사회가 먼저 읽었다는 소문이 있었다.\n\n배당금은 사상 최고였다. 회사 경비대가 파업을 해산했고, 회사 학교가 아이들을 가르쳤다. 회사 어음이 시장에서 돈처럼 돌았다. 뒤카스의 월급도 절반은 어음으로 나왔다.\n\n하역 노동자들 사이에 농담이 돌았다. 왕을 쫓아내고 나니 주주총회가 왔다고. 그 농담을 제일 먼저 한 사람은 다음 달 명단에서 빠졌다. 뒤카스는 그 사람 자리를 채울 사람을 뽑아야 했다."
 lr_story.506.a:0 "이 나라는 이제 하나의 큰 회사다."
 LR_tt_st_lr_story_506_a:0 "§Y정부 정신§! 변화: 소비재 공장 -3%, 정치력 +6%"
 lr_story.506.b:0 "상인의 자유와 시민의 권리는 같이 간다."
 LR_tt_st_lr_story_506_b:0 "§Y정부 정신§! 변화: 의회정 지지 +3%, 안정도 +5%"
 lr_story.507.t:0 "증권거래소의 애국심"
 lr_story.507.d:0 "증권거래소 객장. 지라르는 첫 전쟁 채권이 개장 한 시간 만에 매진되는 걸 보았다. 보르도와 리옹 상인들이 앞다퉈 샀다. 객장에서 누가 라 마르세예즈를 불렀다. 지라르도 따라 불렀다. 증권거래소에서 그 노래를 듣는 건 처음이었다.\n\n재무부 보고서는 다른 얘기를 했다. 채권을 산 사람은 대부분 은행가와 선주였다. 노동자들은 오른 빵값 때문에 채권 살 돈이 없었다.\n\n다음 날 산악파 신문 1면에 한 줄이 실렸다. 부자들은 이자를 받고, 가난한 자들은 피를 바친다. 지라르는 그 신문을 객장 화장실에서 읽었다. 누가 거기 두고 갔다."
 lr_story.507.a:0 "소액 채권을 만들어. 노동자도 살 수 있게."
 LR_tt_st_lr_story_507_a:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.507.b:0 "시장에 맡겨. 돈 내는 사람이 전쟁을 산다."
 LR_tt_st_lr_story_507_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 정치력 +3%"
 lr_story.508.t:0 "에센의 경매"
 lr_story.508.d:0 "에센의 호텔 연회장. 군정청 통역 마르크 펠레는 경매 진행자 옆에 서서 숫자를 독일어로 옮겼다. 압류한 루르 탄광과 제철소였다. 슈나이더, 드방델, 리옹 신용은행의 대리인들이 번호판을 들고 앉아 있었다.\n\n경매가 거의 끝났을 때 연회장 문이 열렸다. 독일 광부 대표 열두 명이 들어왔다. 맨 앞의 남자가 독일어로 말했다. 우리 일자리를 팔지 말라고. 펠레는 그 말을 옮기다가 잠깐 멈췄다. 그 남자는 손에 곡괭이 자루를 들고 있었다. 곡괭이 머리는 없었다.\n\n군정 장관은 파리에 전보를 쳤다. 지롱드 내각은 시장을 믿었다. 펠레가 보기에, 시장은 곡괭이 자루를 든 광부까지 계산에 넣지는 않았다."
 lr_story.508.a:0 "경매는 계속하되 광부 고용을 조건으로 걸어."
 LR_tt_st_lr_story_508_a:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 안정도 +3%"
 lr_story.508.b:0 "경매는 계속한다. 계약은 계약이다."
 LR_tt_st_lr_story_508_b:0 "§Y정부 정신§! 변화: 정치력 +4%"
 lr_story.509.t:0 "관세 없는 유럽"
 lr_story.509.d:0 "보르도 상공회의소 서기 루시앵 바르는 관세 동맹 조약 초안을 등사했다. 프랑스와 자매 공화국들, 라인 연방 사이의 관세를 모두 없앤다. 지롱드파의 오래된 꿈이었다. 상공회의소 사람들은 등사본을 받자마자 들뜬 얼굴로 돌려 읽었다.\n\n같은 날 북부에서 농민들이 트랙터로 국도를 막았다. 독일 밀이 싸게 들어오면 다 망한다고 했다. 바르의 고향이 거기였다. 형이 보낸 엽서에 트랙터 사진이 있었다. 맨 앞 트랙터가 형 것이었다.\n\n총리는 초안에 서명하기 전에 망설였다고 했다. 상공회의소 회장은 그 얘기를 듣고 혀를 찼다. 바르는 형에게 답장을 쓰다가 그만뒀다. 뭐라고 써야 할지 몰랐다."
 lr_story.509.a:0 "서명한다. 상품이 국경을 넘으면 군대는 안 넘는다."
 LR_tt_st_lr_story_509_a:0 "§Y정부 정신§! 변화: 공장 생산량 +3%, 정치력 +5%"
 lr_story.509.b:0 "농산물은 빼고 서명하지."
 LR_tt_st_lr_story_509_b:0 "§Y정부 정신§! 변화: 안정도 +5%"
 lr_story.601.t:0 "명사 회의"
 lr_story.601.d:0 "내무부 의전관 알베르 루아예는 명사 회의 좌석표를 짜다가 포기했다. 한쪽에는 시골 영지의 지주와 옛 귀족들, 다른 쪽에는 리옹과 릴의 은행가들. 결국 통로를 가운데 두고 양쪽으로 나눴다. 회의는 그 모양 그대로 진행됐다.\n\n지주 쪽에서 먼저 말했다. \"선거구를 손봐 주시오. 시골이 프랑스요.\" 은행가 쪽이 받았다. \"공업 차관을 주시오. 내일의 프랑스는 도시요.\" 루아예는 양쪽에 물을 따르러 다니다가, 물병을 들고 통로 한가운데서 잠깐 멈췄다. 어느 쪽부터 따를지 몰랐다.\n\n총리가 줄 수 있는 건 하나뿐이었다. 다들 그걸 알았다."
 lr_story.601.a:0 "지방 명사들이다. 프랑스는 아직 시골이다."
 LR_tt_st_lr_story_601_a:0 "§Y의석§! +24"
 lr_story.601.b:0 "은행가들이다. 내일의 프랑스는 도시다."
 LR_tt_st_lr_story_601_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%\n§G경제 재건§! +2"
 lr_story.602.t:0 "흰 깃털의 사령관"
 lr_story.602.d:0 "시청 앞 광장. 국민방위대 지원병 앙투안 페리에는 흰 깃털 모자를 쓴 남자가 연단에 오르는 걸 보았다. 라파예트의 후손이라고 했다. 광장에서 환호가 터졌다. 페리에도 소리를 질렀다. 그 남자는 연설을 잘 못했다. 그래도 상관없었다.\n\n다음 날 신문에 전쟁부 장관의 말이 실렸다. 정규군 밖에 무장한 군대를 두겠다는 거냐고. 왕당파 의원들은 그 이름 자체를 싫어한다고 했다. 1791년에 그 이름이 무엇을 했는지 기억한다면서.\n\n페리에는 1791년에 무슨 일이 있었는지 몰랐다. 저녁에 아버지한테 물었다. 아버지는 샹드마르스에서 총을 쏜 게 그 사람 조상이었다고 했다. 시민들한테. 페리에는 모자를 벗어서 한참 들여다보았다."
 lr_story.602.a:0 "방위대는 시민의 것이다. 임명해."
 LR_tt_st_lr_story_602_a:0 "§Y정부 정신§! 변화: 징집 인구 +1%, 안정도 +3%"
 lr_story.602.b:0 "전쟁부 아래 둬. 총 든 사람은 지휘 하나만 받는다."
 LR_tt_st_lr_story_602_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%"
 lr_story.603.t:0 "빈 왕좌"
 lr_story.603.d:0 "의회 도서관 사서 레옹스 바르비에는 그 주에만 같은 질문을 스무 번 받았다. 왕위 계승 서열이 어떻게 되느냐고. 헌법은 완성됐다. 왕좌만 비어 있었다.\n\n후보는 둘이었다. 파리 백작은 프랑스어 연설이 완벽했고 파리 사람들이 그를 알았다. 문제는 그의 가문이 쿠데타를 일으킨 그 오를레앙이라는 것이었다. 스페인에서 온 부르봉의 어린 왕자는 혈통이 확실했다. 프랑스어 연설은 아직 연습 중이었다.\n\n바르비에는 도서관 창가에서 왕자가 정원을 걷는 걸 본 적이 있었다. 왕자는 종이를 들고 입속으로 무언가를 중얼거리고 있었다. 프랑스어 동사 변화표 같았다."
 lr_story.603.a:0 "파리 백작이다. 프랑스 왕은 프랑스인이어야 한다."
 LR_tt_st_lr_story_603_a:0 "§Y정부 정신§! 변화: 안정도 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.603.b:0 "부르봉 왕자다. 유럽 왕실이 인정할 거다."
 LR_tt_st_lr_story_603_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.604.t:0 "왕실비 논쟁"
 lr_story.604.d:0 "속기사 오데트 랑베르는 왕실 예산 심의를 받아 적었다. 야당 의원 하나가 일어나 계산서를 흔들었다. \"왕 한 명 연봉이 초등학교 400곳이오!\" 궁정 대신은 영국 왕보다 적게 받을 수는 없다고 맞섰다. 회의장이 웃음과 야유로 뒤덮였다.\n\n랑베르는 야유를 속기하는 기호를 따로 만들어 두었다. 오늘 그걸 마흔 번 넘게 썼다.\n\n심의가 끝나고 복도에서 늙은 의원 하나가 혼잣말을 했다. 이제 프랑스 왕은 의회 예산안을 기다리는 사람이 됐다고. 랑베르는 그 말을 회의록에 넣지 않았다. 회의장 밖에서 한 말이었다. 집에 가서 일기장에 적었다."
 lr_story.604.a:0 "왕의 위엄에 값을 매길 순 없다. 넉넉히 줘."
 LR_tt_st_lr_story_604_a:0 "§Y정부 정신§! 변화: 정치력 +3%\n§Y의석§! -12"
 lr_story.604.b:0 "왕께서 먼저 삭감을 제안하시게 하지."
 LR_tt_st_lr_story_604_b:0 "§Y정부 정신§! 변화: 안정도 +3%\n§Y의석§! +18"
 lr_story.605.t:0 "리옹의 견직공"
 lr_story.605.d:0 "리옹, 크루아루스 언덕. 견직공 클로틸드 마냥은 창문 밖에 검은 깃발을 내걸었다. 할머니가 쓰던 깃발이었다. 백 년 전 구호가 수놓여 있었다. 일하며 살거나, 싸우며 죽으리라. 실이 바래서 반쯤은 읽기 어려웠다.\n\n공임은 석 달째 그대로였고, 빵값은 두 배가 됐다. 언덕의 집 절반에 같은 깃발이 걸렸다. 지사는 군대를 보내 달라고 파리에 전보를 쳤다고 했다.\n\n같은 시각 파리 의사당에서는 산악파 의원들이 견직공들의 이름을 하나씩 불렀다고 했다. 클로틸드는 그 얘기를 다음 날 신문에서 읽었다. 자기 이름도 있었다. 철자가 틀려 있었다."
 lr_story.605.a:0 "법은 법이다. 방위대를 보내."
 LR_tt_st_lr_story_605_a:0 "모든 지역 §Y반발도§! -15\n§Y의석§! -12"
 lr_story.605.b:0 "최저 공임법을 낸다. 왕당파가 뭐라 하든."
 LR_tt_st_lr_story_605_b:0 "§Y정부 정신§! 변화: 안정도 +2%\n§Y의석§! +18\n§G경제 재건§! +1"
 lr_story.606.t:0 "1791년의 약속"
 lr_story.606.d:0 "팔레 부르봉 수위 마르셀 피노는 145년 전 찢어진 헌법 초안이 다시 낭독되는 걸 문 옆에서 들었다. 부르봉의 어린 왕자가 연습한 프랑스어로 맹세를 했다. 동사 하나를 틀렸다. 다시 읽었다. 끝까지 해냈다.\n\n의원들이 일어서서 박수를 쳤다. 피노도 쳤다. 규정 위반이었다. 왕은 의장보다 낮은 자리에 앉았다. 피노는 그 의자를 어제 직접 옮겨 놓았다. 높이를 세 번 쟀다.\n\n그 뒤로 유럽 왕실들은 이 프랑스를 왕국이라고 불렀다. 공화파는 왕정복고라 하고, 왕당파는 혁명의 연장이라고 했다. 양쪽 다 불만이었다. 푀양파 의원 하나가 복도에서 피노에게 말했다. 그게 바로 성공이라고."
 lr_story.606.d2:0 "팔레 부르봉 수위 마르셀 피노는 145년 전 찢어진 헌법 초안이 다시 낭독되는 걸 문 옆에서 들었다. 파리 백작은 왕관을 쓰지 않고 들어와서 의장보다 낮은 자리에 앉았다. 피노는 그 의자를 어제 직접 옮겨 놓았다.\n\n백작의 프랑스어 연설은 완벽했다. 빈정거리던 의원들도 결국 박수를 쳤다. 백작은 연설 마지막에 이렇게 말했다. 왕은 헌법 아래 있다고. 그 말을 왕이 먼저 했다는 게 신문 1면에 실렸다.\n\n영국 사람들이 보면 자기네 정치와 닮았다고 할 거라고 다들 말했다. 피노 생각엔 전혀 달랐다. 영국 의사당 수위는 왕 의자 높이를 재지 않을 거다."
 lr_story.606.a:0 "왕은 프랑스인이고, 헌법은 왕 위에 있다."
 LR_tt_st_lr_story_606_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +7%"
 lr_story.606.b:0 "부르봉의 피와 공화국의 법. 유럽이 처음 보는 왕국이다."
 LR_tt_st_lr_story_606_b:0 "§Y정부 정신§! 변화: 정치력 +6%, 안정도 +3%"
 lr_story.607.t:0 "왕의 서명, 의회의 서명"
 lr_story.607.d:0 "튈르리 궁 집무실. 서기관 앙리 데샹은 동원령 문서를 탁자에 놓았다. 서명란이 둘이었다. 왕, 그리고 의회 의장. 1791년 헌법이 정한 그대로였다.\n\n왕이 펜을 들었다. 의장이 손을 들어 막았다. 헌법에 따르면 의회 표결이 먼저라고. 데샹은 그 순간 숨을 참았다. 궁정 대신들 얼굴이 빨개졌다.\n\n국민방위대 사령관이 조용히 말했다. \"순서가 바뀌면, 그건 더 이상 입헌 군주정이 아닙니다.\" 왕은 펜을 든 채 의장을 쳐다보았다. 데샹은 그 펜에서 잉크가 한 방울 떨어지지 않을까 걱정했다. 떨어지지 않았다."
 lr_story.607.a:0 "의회가 먼저 표결하고, 짐이 서명한다."
 LR_tt_st_lr_story_607_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +4%"
 lr_story.607.b:0 "전시엔 짐이 먼저 서명한다. 헌법은 평시의 것이다."
 LR_tt_st_lr_story_607_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 전쟁 지지 +4%"
 lr_story.608.t:0 "살롱의 지도"
 lr_story.608.d:0 "생제르맹 거리의 살롱. 집사 오귀스탱 뒤발은 손님들 잔을 채우며 지도 위로 오가는 손가락들을 보았다. 은행가, 대지주, 대주교. 프로이센은 무너졌다. 이 사람들은 이제 전쟁을 끝내고 싶어 했다.\n\n전쟁이 길어지면 세금이 오르고, 세금이 오르면 거리의 급진파가 힘을 얻는다. 대주교가 그 얘기를 세 번 했다. 뒤발은 대주교가 바리케이드를 직접 본 적이 있는지 궁금했다. 뒤발은 봤다. 1936년 봄에.\n\n총리는 자정쯤 일어났다. 현관에서 외투를 받아 입으며 비서에게 말했다. \"명사들은 평화를 원하고, 장군들은 승리를 원해. 나는 둘 다 필요하고.\" 뒤발은 문을 열어 주었다. 총리는 고맙다고 하지 않았다. 생각이 딴 데 가 있었다."
 lr_story.608.a:0 "서둘러 강화를 찾는다. 혁명은 전쟁의 자식이다."
 LR_tt_st_lr_story_608_a:0 "§Y정부 정신§! 변화: 안정도 +5%, 전쟁 지지 -3%"
 lr_story.608.b:0 "끝까지 싸운다. 어설픈 강화는 다음 전쟁을 부른다."
 LR_tt_st_lr_story_608_b:0 "§Y정부 정신§! 변화: 전쟁 지지 +4%"
 lr_story.609.t:0 "빈 회의의 그림자"
 lr_story.609.d:0 "빈, 회의장. 통역관 클레망스 오리는 이 도시에 처음 왔다. 2차 대불전쟁 뒤 왕들이 혁명 프랑스를 묶었던 바로 그 도시였다. 이번에는 입헌 프랑스가 회의를 주재했다.\n\n총리가 제안한 건 정복도 혁명도 아닌 균형이었다. 강대국들이 정기적으로 모여 분쟁을 조정한다. 그리고 모든 왕국에 최소한의 헌장을. 오리는 헌장이라는 단어를 독일어로 옮길 때 일부러 천천히 말했다. 대사들 얼굴을 보고 싶었다.\n\n대사들이 서로를 쳐다봤다. 오스트리아 대사는 손에 든 연필을 내려놓았다. 헌장이라는 말은 그들의 귀에 아직 혁명처럼 들렸다. 오리는 그 연필이 굴러서 탁자 끝에서 떨어지는 걸 보았다. 아무도 줍지 않았다."
 lr_story.609.a:0 "헌장을 조건으로 건다. 유럽은 법 위에 서야 한다."
 LR_tt_st_lr_story_609_a:0 "§Y정부 정신§! 변화: 의회정 지지 +3%, 안정도 +4%"
 lr_story.609.b:0 "헌장은 빼고 균형만 맺지. 평화가 먼저다."
 LR_tt_st_lr_story_609_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 +5%"
 lr_story.701.t:0 "오랑주리의 군화"
 lr_story.701.d:0 "생클루, 오랑주리. 척탄병 상병 피에르 뒤랑은 총검을 꽂은 채 의사당 뒷문 앞에 서 있었다. 장군이 안에서 연설을 하는 중이었다. 뒤랑은 알제리 때부터 장군 밑에 있었다. 장군이 연설을 잘 못한다는 걸 알았다.\n\n안에서 고함 소리가 났다. 뒤랑은 문틈으로 들여다보았다. 장군이 연단에서 말을 더듬고 있었고, 의원들이 일어나 야유했다. \"독재자를 쫓아내라!\" 장군의 얼굴이 하얬다. 뒤랑은 장군의 그런 얼굴을 처음 봤다.\n\n그때 장군의 동생이 의원석 사이에서 칼을 뽑았다. 북이 울렸다. 뒤랑은 대열과 함께 앞으로 나갔다. 의원들이 창문으로 뛰어내렸다. 1층이었다. 뒤랑은 정원 화단에 떨어진 늙은 의원 하나가 일어나서 옷을 털고 걸어가는 걸 보았다. 아무도 그를 쫓지 않았다."
 lr_story.701.a:0 "의원들을 체포해. 연설은 끝났다."
 LR_tt_st_lr_story_701_a:0 "§Y정부 정신§! 변화: 정치력 +4%, 안정도 -2%"
 lr_story.701.b:0 "남은 의원들에게 헌법을 쓰게 해. 누가 쓸지는 내가 고른다."
 LR_tt_st_lr_story_701_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.702.t:0 "개표소의 동생"
 lr_story.702.d:0 "내무부 집계실, 자정. 통계 담당 서기 앙드레 라비뉴는 국민투표 결과를 세 번 더했다. 찬성 150만 표. 투표율은 절반이 안 됐다. 숫자는 정확했다.\n\n내무장관이 들어왔다. 통령의 동생이었다. 집계표를 들여다보더니 펜을 들었다. \"군인들 표가 빠졌군. 알제리에 있는 병사들 말이야. 그걸 넣으면 300만쯤 되겠지.\" 라비뉴는 그런 표가 없다는 걸 알았다. 장관도 알았다.\n\n문가에 통령이 서 있었다. 언제 왔는지 라비뉴는 몰랐다. 통령은 동생의 손목을 보고 있었다. 펜 끝이 종이 위 1센티미터에서 멈춰 있었다. 라비뉴는 숨을 쉬지 않았다. 내일 아침 유럽의 모든 신문이 이 숫자를 실을 것이었다."
 lr_story.702.a:0 "쓰게 둬. 크게 이겨야 유럽이 믿는다."
 LR_tt_st_lr_story_702_a:0 "§Y정부 정신§! 변화: 정치력 +4%, 전쟁 지지 +2%"
 lr_story.702.b:0 "펜 이리 내. 150만은 정직한 숫자다."
 LR_tt_st_lr_story_702_b:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +4%"
 lr_story.703.t:0 "왕관 앞에서"
 lr_story.703.d:0 "말메종 저택 집사 프랑수아 르뫼르는 원로원 대표단에게 차를 세 번 내갔다. 대표단은 두 시간째 말하고 있었다. 공손하게, 아주 돌려서. 공화국을 지키려면 안정이 필요하고, 안정을 위해서는 후계가 필요하고, 후계가 필요한 자리에는 그에 걸맞은 이름이 필요하다고. 왕관이라는 단어만 빼고 다 했다.\n\n제1통령은 대답하지 않고 대서양 지도만 들여다보았다. 르뫼르가 찻잔을 치울 때 대표단장이 그를 쳐다봤다. 나가 달라는 눈빛이었다. 르뫼르는 나갔다.\n\n복도 한쪽에서는 원수들이 벌써 자기 몫의 작위를 입에 올리고 있었다. 다른 복도에는 처음부터 그를 믿었던 공화파 장교들이 굳은 얼굴로 서 있었다. 저녁 식사 준비를 해야 했다. 르뫼르는 통령에게 오늘 저녁 누구와 드실 거냐고 물어야 했다. 그 질문이 이렇게 어려운 건 처음이었다."
 lr_story.703.a:0 "근위대 장교들과 먹지."
 LR_tt_st_lr_story_703_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +2%"
 lr_story.703.b:0 "법률가들과 먹지."
 LR_tt_st_lr_story_703_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 +3%"
 lr_story.801.t:0 "독수리 군기"
 lr_story.801.d:0 "샹드마르스, 비가 그친 아침. 제12전열보병연대 기수 알베르 쿠탱은 무릎을 꿇고 황제의 손에서 독수리 군기를 받았다. 생각보다 무거웠다. 금이었다.\n\n쿠탱 뒤에서 늙은 하사관 하나가 울면서 군기를 끌어안았다. 대전쟁에서 연대기를 빼앗긴 사람이라고 했다. 연병장에 함성이 울렸다. 대전쟁 이후 이런 함성은 없었다고 다들 말했다.\n\n행사가 끝나고 쿠탱은 군기를 들고 황제의 천막 앞을 지나갔다. 안에서 전쟁부 장관이 메모를 읽는 소리가 들렸다. 독수리 하나에 들어간 금으로 전차를 몇 대 살 수 있는지. 답은 셋이었다. 쿠탱은 손에 든 독수리를 내려다보았다. 전차 세 대."
 lr_story.801.a:0 "병사는 쇳덩이가 아니라 깃발을 위해 죽는다."
 LR_tt_st_lr_story_801_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +2%"
 lr_story.801.b:0 "독수리는 나무로 깎고 금은 공장으로 보내."
 LR_tt_st_lr_story_801_b:0 "§G경제 재건§! +2"
 lr_story.802.t:0 "황제의 응접실"
 lr_story.802.d:0 "튈르리 응접실. 시종 앙투안 르루는 문을 열고 손님 이름을 불렀다. 생제르맹의 후작 부인. 그다음 어제 공작이 된 포병 장군의 부인. 두 사람이 동시에 들어왔다.\n\n후작 부인은 공작 부인을 보지도 않고 지나쳤다. 공작 부인은 인사하려고 들었던 손을 천천히 내렸다. 응접실이 조용해졌다. 르루는 다음 손님 이름을 부르려다가 입을 다물었다.\n\n궁정 대신이 황제를 쳐다봤다. 다들 황제를 쳐다봤다. 공작 부인은 대장장이의 딸이었다. 르루는 그걸 알았다. 그녀의 남편은 알제리에서 황제의 목숨을 구했다. 그것도 알았다."
 lr_story.802.a:0 "옛 가문들을 부르지. 그들의 인사가 곧 유럽의 인정이다."
 LR_tt_st_lr_story_802_a:0 "§Y정부 정신§! 변화: 육군 사기 -1%, 안정도 +3%"
 lr_story.802.b:0 "내 공작들이 프랑스의 귀족이다. 후작 부인은 나가시오."
 LR_tt_st_lr_story_802_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.803.t:0 "황후 문제"
 lr_story.803.d:0 "외무부 서기관 니콜라 드 모르니는 빈에서 온 편지를 직접 황제에게 가져갔다. 봉인은 합스부르크 문장이었다. 대공녀와 혼인하지 않겠느냐는 제안이었다. 받아들이면 코르시카의 포병 장교가 유럽 왕실의 사위가 된다.\n\n원수들은 그 얘기를 듣고 이를 갈았다. 굴욕이라고 했다. 왕들을 끝내려고 따라왔는데 왕의 사위가 되느냐고.\n\n드 모르니는 그날 저녁 튈르리 복도에서 부인을 보았다. 알제 시절부터 황제 곁에 있던 사람이었다. 그녀는 창가에서 정원을 보고 있었다. 드 모르니가 지나가며 인사했다. 그녀도 고개를 숙였다. 그녀는 아무것도 묻지 않았다. 드 모르니는 그게 더 견디기 힘들었다."
 lr_story.803.a:0 "합스부르크의 사위가 된다."
 LR_tt_st_lr_story_803_a:0 "§Y정부 정신§! 변화: 정치력 +4%, 안정도 -1%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.803.b:0 "내 황후는 이미 여기 있다."
 LR_tt_st_lr_story_803_b:0 "§Y정부 정신§! 변화: 안정도 +3%, 전쟁 지지 +2%"
 lr_story.804.t:0 "마드리드의 빈자리"
 lr_story.804.d:0 "튈르리 궁 보초 질베르 아르노는 자정에 황제의 형이 계단을 올라가는 걸 보았다. 마드리드의 왕좌가 비었다는 소식이 오후에 들어왔다. 부르봉의 마지막 왕이 국경을 넘어 달아났다.\n\n서재 문이 덜 닫혀서 목소리가 새어 나왔다. \"동생아, 너는 황제가 됐어. 나도 왕 하나쯤은 해도 되지 않겠냐?\" 아작시오에서 한 침대를 쓰던 형이라고 했다. 황제가 뭐라고 대답했는지는 들리지 않았다.\n\n형이 나간 뒤 외무장관이 들어갔다. 메모 한 장을 들고. 아르노는 나중에 그 메모 내용을 시종에게서 들었다. 스페인은 들어가기는 쉬워도 나오기는 어렵다. 그리고 그 아래 한 줄. 게릴라라는 말은 스페인어다."
 lr_story.804.a:0 "형을 왕으로 앉혀. 피는 물보다 진하다."
 LR_tt_st_lr_story_804_a:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 -2%, 전쟁 지지 +3%"
 lr_story.804.b:0 "외무장관 말을 듣지. 이번만이다."
 LR_tt_st_lr_story_804_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.805.t:0 "유럽의 황제"
 lr_story.805.d:0 "제국 궁정 지도실. 참모 장교 오귀스탱 르노는 황제가 작은 군기를 하나씩 지도에 꽂는 걸 옆에서 거들었다. 핀이 모자라서 두 번 가지러 갔다.\n\n황제는 꽂으면서 말했다. \"빈이든 런던이든 페테르부르크든, 이 지도를 같이 그리고 싶으면 그리면 된다. 싫다는 놈은 이 지도에서 지워지고.\" 르노는 그게 농담인지 몰라서 웃지 않았다. 원수들도 웃지 않았다.\n\n황제는 이제 왕들에게 편지를 쓸 때 형제여, 하고 시작했다. 왕들은 이를 갈면서 답장을 썼다. 원수들은 황제 어깨 너머로 지도를 보다가 눈을 돌렸다. 르노는 마지막 핀을 건네며 생각했다. 이분은 아직 한 번도 멈춘 적이 없다."
 lr_story.805.d2:0 "새 황후의 프랑스어 선생 마들렌 그리모는 황후가 처음으로 혼자 쓴 편지를 고쳐 주었다. 빈의 어머니에게 보내는 편지였다. 틀린 데가 네 군데였다. 그리모는 세 군데만 고쳤다. 하나는 남겨 두는 게 더 진짜 같았다.\n\n그해 왕실 연감에 코르시카 사람의 이름이 처음 실렸다. 황제는 이제 유럽 왕들과 같은 식탁에 앉았다. 왕들은 이를 갈면서 그의 잔을 받았다.\n\n원수들 얼굴은 어두웠다. 왕을 끝내려고 따라왔는데 황제가 왕의 사위가 됐다. 그리모는 궁정 복도에서 원수 하나가 혼잣말하는 걸 들었다. 그래도 지도는 커지고 있다고."
 lr_story.805.a:0 "왕들의 사위로서 왕들을 다스린다."
 LR_tt_st_lr_story_805_a:0 "§Y정부 정신§! 변화: 정치력 +8%, 안정도 +3%"
 lr_story.805.b:0 "코르시카 포병 장교가 왕들의 유럽을 끝낸다."
 LR_tt_st_lr_story_805_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +8%"
 lr_story.806.t:0 "제1호 공보"
 lr_story.806.d:0 "르 피가로 교열 기자 쥘 마르탱은 대육군 제1호 공보를 1면에 앉혔다. 황제가 직접 받아쓰게 한 전황 보고였다. 적군은 도망치고 있고, 아군 손실은 미미하다. 교정할 게 하나도 없었다. 손대지 말라는 지시도 있었다.\n\n마르탱은 대전쟁 때도 이 일을 했다. 그때도 참모본부 공보는 늘 이랬다. 파리 사람들은 그때 말을 하나 만들었다. 공보처럼 거짓말한다.\n\n다음 날 마르탱은 단골 카페에서 사람들이 신문을 펼쳐 놓고 웃는 걸 보았다. 누가 공보를 소리 내어 읽고, 다른 사람이 대전쟁 때 공보를 외워서 읊었다. 거의 똑같았다. 카페 구석에 경찰 끄나풀로 소문난 남자가 앉아 있었다. 그도 웃고 있었다. 메모하면서."
 lr_story.806.a:0 "손실도 적어. 진실이 신뢰를 산다."
 LR_tt_st_lr_story_806_a:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.806.b:0 "공보를 비웃는 자는 잡아들여."
 LR_tt_st_lr_story_806_b:0 "§Y정부 정신§! 변화: 안정도 -1%, 전쟁 지지 +4%"
 lr_story.807.t:0 "베를린 칙령"
 lr_story.807.d:0 "베를린 왕궁, 프리드리히 대왕의 옛 서재. 서기 프랑수아 뒤마는 대륙봉쇄령 원본을 책상에 펼쳤다. 프로이센 왕들이 프랑스를 겨눈 동맹 조약에 서명하던 바로 그 책상이었다. 황제는 서명하기 전에 책상을 손으로 한 번 쓸었다.\n\n영국 상품은 대륙의 어느 항구에도 들어올 수 없다. 서명이 끝나자 뒤마는 사본 마흔 장에 도장을 찍었다. 함부르크와 암스테르담과 리스본으로 갈 사본이었다. 그 도시 상인들은 이 종이를 받으면 장부를 덮을 거다. 밀수꾼들은 새 지도를 그릴 거다.\n\n외무장관이 물었다. 이 칙령이 동맹국에도 적용되느냐고. 뒤마는 도장을 든 채 기다렸다. 대답에 따라 사본 열두 장을 다시 찍어야 했다."
 lr_story.807.a:0 "모든 나라다. 예외는 구멍이다."
 LR_tt_st_lr_story_807_a:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 전쟁 지지 +3%"
 lr_story.807.b:0 "동맹국은 빼. 친구를 굶길 순 없다."
 LR_tt_st_lr_story_807_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 +3%"
 lr_story.808.t:0 "130개의 데파르트망"
 lr_story.808.d:0 "튈르리 궁 지도실. 지도 제작자 로베르 쿠탕스는 새 제국 지도를 벽에 걸었다. 130개의 데파르트망. 암스테르담에서 로마까지, 브레멘에서 바르셀로나까지. 샤를마뉴의 제국보다 넓었다. 그 바깥으로 바르샤바 대공국, 나폴리 왕국, 라인 연방이 둘러쌌다.\n\n쿠탕스는 이 지도를 그리느라 석 달을 썼다. 데파르트망 이름을 새로 정할 때마다 고쳐야 했다. 마지막 판은 어젯밤에 끝냈다.\n\n황제가 지도 앞에 오래 서 있다가 물었다. \"여기까지 온 자들은 그다음에 뭘 했지?\" 원수 하나가 대답했다. \"스웨덴의 카를 12세는 러시아로 갔습니다, 폐하.\" 쿠탕스는 지도 오른쪽 끝을 보았다. 러시아는 지도에 다 들어가지 않았다. 종이가 모자랐다."
 lr_story.808.a:0 "여기서 멈춘다. 제국은 지켜서 위대해진다."
 LR_tt_st_lr_story_808_a:0 "§Y정부 정신§! 변화: 안정도 +6%"
 lr_story.808.b:0 "멈추지 않는다. 그는 겨울을 몰랐고, 나는 안다."
 LR_tt_st_lr_story_808_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 전쟁 지지 +5%"
 lr_story.901.t:0 "연미복의 장군"
 lr_story.901.d:0 "의사당 복도. 대통령 비서 클레르 몽탕은 대통령의 연미복 어깨를 두 번 펴 주었다. 군복을 벗은 지 이틀째였다. 연미복이 꽉 껴서 대통령은 팔을 잘 들지 못했다. 재단사를 부를 시간은 없었다.\n\n복도에 의원들이 늘어서 있었다. 다들 숨을 죽였다. 이 사람이 연단에서 헌법 얘기를 할지 군대 얘기를 할지에 따라 공화국의 다음 10년이 정해진다는 걸 다들 알았다.\n\n대통령의 안주머니에는 연설 초고가 두 장 있었다. 몽탕이 어젯밤 타자로 친 것과, 대통령이 알제리에서부터 가지고 다닌 낡은 것. 연단까지 마흔 걸음이었다. 몽탕은 그 걸음을 셌다. 서른 걸음째에 대통령이 안주머니에 손을 넣었다."
 lr_story.901.a:0 "헌법을 말한다. 공화국은 법 위에 선다."
 LR_tt_st_lr_story_901_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%\n§Y의석§! +18"
 lr_story.901.b:0 "군대를 말한다. 공화국은 무장해야 산다."
 LR_tt_st_lr_story_901_b:0 "§Y정부 정신§! 변화: 전쟁 지지 +2%"
 lr_story.902.t:0 "그가 왜 거절했는가"
 lr_story.902.d:0 "대통령 관저 수위 레옹 메르시에는 장군 여섯 명이 한꺼번에 들어오는 걸 막지 못했다. 알제부터 대통령과 같이 온 사람들이었다. 맨 앞의 장군은 군모도 벗지 않았다.\n\n\"우리가 왜 피를 흘렸습니까? 왕관을 버리시더니, 이젠 민간인 장관한테 경례를 하라고요?\" 집무실 문이 닫히기 전에 메르시에가 들은 건 거기까지였다.\n\n메르시에는 그 장군을 알았다. 대통령이 알제 골목에서 총에 맞을 뻔했을 때 대신 맞은 사람이었다. 왼쪽 어깨에 아직 총알 자국이 있다고 했다. 한 시간 뒤 문이 열렸다. 장군들은 아무 말 없이 나갔다. 메르시에는 대통령이 무슨 결정을 했는지 장군들 얼굴로는 알 수 없었다."
 lr_story.902.a:0 "옛 동료를 해임한다. 문민 통제는 나부터다."
 LR_tt_st_lr_story_902_a:0 "§Y정부 정신§! 변화: 육군 사기 -1%, 안정도 +4%"
 lr_story.902.b:0 "술 한잔하며 설득하지. 저들 없이는 군도 없다."
 LR_tt_st_lr_story_902_b:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.903.t:0 "400만 명의 서명"
 lr_story.903.d:0 "관저 정원사 질 바르보는 아침에 정원에 나갔다가 길을 막은 상자 더미를 보았다. 서명 상자였다. 산처럼 쌓여 있었다. 400만 명의 청원이라고 했다. 대통령을 종신으로 모시자는 것이었다.\n\n측근 하나가 대통령을 정원으로 모시고 나왔다. 웃는 얼굴이었다. \"이건 왕관이 아닙니다, 각하. 공화국 이름 그대로입니다.\" 바르보는 장미 덤불 뒤에서 그 말을 들었다.\n\n대통령은 상자 하나를 열고 서명을 넘겨 보았다. 한 장, 두 장. 한참 넘기다가 멈췄다. 바르보도 슬쩍 보았다. 같은 필체가 다섯 번 연달아 나왔다. 이름은 다 달랐다."
 lr_story.903.a:0 "불태워. 임기는 헌법에 적혀 있다."
 LR_tt_st_lr_story_903_a:0 "§Y정부 정신§! 변화: 의회정 지지 +3%, 안정도 +4%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.903.b:0 "대답하지 않는다. 언제 떠날지는 내가 정한다."
 LR_tt_st_lr_story_903_b:0 "§Y정부 정신§! 변화: 정치력 +5%"
 lr_story.904.t:0 "런던에서 온 편지"
 lr_story.904.d:0 "대통령 비서 클레르 몽탕은 런던에서 온 편지 두 통을 뜯었다. 망명한 부르봉 왕족과 오를레앙 왕족이었다. 왕관을 포기하고 시민으로 돌아오고 싶다고 했다.\n\n같은 날 코뮌파 의원들은 의사당에서 편지를 불태우라고 외쳤다. 왕당파 신문은 1면에 왕관 그림을 실었다. 노르망디의 늙은 농부들은 아직도 일요일마다 성당에서 왕을 위해 기도했다. 몽탕의 할머니도 그중 하나였다.\n\n대통령은 편지에 적힌 이름을 소리 내어 천천히 읽었다. 그중 하나는 열네 살 소년이었다. 몽탕은 그 소년 사진을 신문에서 본 적이 있었다. 안경을 쓴 마른 아이였다. 그 아이는 아직 아무것도 하지 않았다."
 lr_story.904.a:0 "시민으로 돌아오게 해."
 LR_tt_st_lr_story_904_a:0 "모든 지역 §Y반발도§! -15\n§Y의석§! +12"
 lr_story.904.b:0 "국경은 닫혀 있다. 공화국은 아직 어리다."
 LR_tt_st_lr_story_904_b:0 "§Y정부 정신§! 변화: 안정도 +1%, 전쟁 지지 +2%"
 lr_story.905.t:0 "대통령의 약속"
 lr_story.905.d:0 "앵발리드 앞 광장. 육군 하사 앙드레 콜랭은 연단 앞 첫 줄에 서 있었다. 그 옆에 의원들이 서 있었다. 병사와 의원이 같은 줄에 선 건 콜랭이 기억하는 한 처음이었다.\n\n대통령이 연설을 시작했다. 콜랭은 그 목소리를 알제리에서 처음 들었다. 그때보다 느렸다. 대통령은 관저를 떠나겠다는 말을 하지 않았다. 남겠다는 말도 하지 않았다.\n\n연설이 끝나고 옆의 의원이 콜랭에게 물었다. 공화국이 그를 필요로 하는 동안이라는 게 얼마나 긴 시간이냐고. 콜랭은 모른다고 했다. 의원도 모르는 얼굴이었다."
 lr_story.905.d2:0 "앵발리드 앞 광장. 육군 하사 앙드레 콜랭은 연단 앞 첫 줄에 서 있었다. 청원서를 태운 재는 사흘 전에 치워졌다. 다음 선거일은 달력에 적혀 있었다.\n\n장군 출신 대통령이 스스로 물러나겠다는 약속을 유럽의 왕들은 믿지 않았다. 원수들도 믿지 않았다. 콜랭의 중대장도 안 믿었다. 콜랭은 믿었다. 근거는 없었다.\n\n대통령이 코르시카 고향집 지붕을 고쳐 두라고 편지를 썼다는 소문이 돌았다. 진짜인지는 아무도 몰랐다. 연설이 끝나고 콜랭은 옆에 선 의원과 같이 박수를 쳤다. 의원 손이 콜랭 손보다 컸다."
 lr_story.905.a:0 "임기가 끝나면 나는 코르시카로 간다."
 LR_tt_st_lr_story_905_a:0 "§Y정부 정신§! 변화: 안정도 +8%\n§Y의석§! +30"
 lr_story.905.b:0 "공화국이 나를 필요로 하는 한 나는 여기 있다."
 LR_tt_st_lr_story_905_b:0 "§Y정부 정신§! 변화: 정치력 +8%, 전쟁 지지 +3%"
 lr_story.906.t:0 "대통령의 망설임"
 lr_story.906.d:0 "대통령 비서실장 폴 브리앙은 전시 대권법 법안을 대통령 책상에 올려놓았다. 지지 의원들이 발의한 것이었다. 전쟁 동안 대통령이 의회 없이 칙령으로 다스릴 수 있게 하는 법. 통과는 확실했다.\n\n문제는 대통령이었다. 브리앙은 왕관을 거절하던 날 노트르담 광장에 있었다. 그날 그 사람은 연미복이 안 맞아서 어깨가 들려 있었다. 이 법안은 왕관보다 작았다. 그런데 같은 쪽을 향하고 있었다.\n\n대통령은 법안을 끝까지 읽고 펜을 집어 들었다. 그리고 내려놓았다. 브리앙은 물었다. 서명하시겠습니까."
 lr_story.906.a:0 "거부한다. 전쟁도 의회와 함께 치른다."
 LR_tt_st_lr_story_906_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +4%\n§Y의석§! +18"
 lr_story.906.b:0 "서명하되 종전과 함께 끝나게 해."
 LR_tt_st_lr_story_906_b:0 "§Y정부 정신§! 변화: 정치력 +4%, 전쟁 지지 +3%"
 lr_story.907.t:0 "막사의 대통령"
 lr_story.907.d:0 "라인강 건너 전선 막사. 일병 마르셀 루소는 낡은 야전 외투를 입은 남자가 막사 사이를 걷는 걸 보고 누군지 몰랐다. 고참병들이 일어나서 경례할 때야 알았다. 대통령이었다.\n\n고참병 하나가 큰 소리로 외쳤다. \"황제 만세!\" 막사가 순간 조용해졌다. 몇몇이 따라 외쳤다. 몇몇은 고개를 돌렸다. 루소는 어느 쪽도 하지 않았다. 어떻게 해야 하는지 몰랐다.\n\n대통령이 그 고참병에게 걸어갔다. 고참병은 경례 자세로 굳어 있었다. 루소는 그 고참병 이름을 알았다. 알제리 원정 얘기를 매일 밤 하는 사람이었다."
 lr_story.907.a:0 "\"나는 황제가 아니다. 너희와 같은 시민이다.\""
 LR_tt_st_lr_story_907_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +4%"
 lr_story.907.b:0 "말없이 어깨를 두드려 준다."
 LR_tt_st_lr_story_907_b:0 "§Y정부 정신§! 변화: 육군 사기 +4%"
 lr_story.908.t:0 "열네 개의 원칙"
 lr_story.908.d:0 "베르사유 거울의 방. 통역관 클레망스 오리는 강화 회의 개막 연설을 영어와 독일어로 옮겼다. 1919년 이곳에서 프랑스를 무릎 꿇린 조약이 서명됐다. 오리의 아버지는 그날 프랑스 대표단의 타자수였다.\n\n대통령은 원칙을 말했다. 민족 자결, 비밀 외교 폐지, 군비 축소, 국가들의 연맹. 왕관을 거절했듯이 복수도 거절하겠다고 했다. 오리는 복수라는 단어를 옮길 때 영국 대표의 얼굴을 보았다. 영국 대표는 수첩만 보고 있었다.\n\n회의장 뒤편에서 장군들이 낮게 투덜거렸다. 1918년엔 아무도 우리한테 원칙 얘기를 안 해 줬다고. 오리는 그 말은 통역하지 않았다. 아무도 부탁하지 않았다."
 lr_story.908.a:0 "관대한 강화를 맺는다. 복수는 다음 전쟁을 낳는다."
 LR_tt_st_lr_story_908_a:0 "§Y정부 정신§! 변화: 의회정 지지 +3%, 안정도 +5%"
 lr_story.908.b:0 "원칙은 말하되 배상금은 받는다. 국민은 기억한다."
 LR_tt_st_lr_story_908_b:0 "§Y정부 정신§! 변화: 정치력 +4%, 전쟁 지지 +2%"
 lr_story.1401.t:0 "파르크 호텔 3층"
 lr_story.1401.d:0 "비시, 파르크 호텔. 호텔 지배인 앙리 쿠튀리에는 온천객이 묵던 객실에 타자기와 서류철이 들어오는 걸 보고 있었다. 욕실은 문서고가 됐다. 3층 복도 끝 방이 원수의 집무실이었다. 원래 스위트룸이었다. 쿠튀리에는 그 방 커튼을 어제 새로 달았다.\n\n각료들은 방이 좁다고 불평했다. 국방장관은 욕조 위에 판자를 깔고 책상으로 썼다. 원수는 여기가 마음에 든다고 했다. 파리의 소음과 거리의 군중에게서 멀어서.\n\n엘리베이터 안에서 쿠튀리에는 원수가 비서실장에게 하는 말을 들었다. \"파리는 늘 프랑스를 배신했소.\" 비서실장이 조심스럽게 물었다. 수도를 정말 여기 두시겠느냐고. 엘리베이터가 3층에 섰다. 쿠튀리에는 문을 열어 드렸다."
 lr_story.1401.a:0 "비시가 새 수도다. 파리는 혁명의 도시일 뿐이다."
 LR_tt_st_lr_story_1401_a:0 "§Y정부 정신§! 변화: 안정도 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1401.b:0 "임시일 뿐이다. 질서가 서면 파리로 돌아간다."
 LR_tt_st_lr_story_1401_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1402.t:0 "원수님, 우리가 여기 있습니다"
 lr_story.1402.d:0 "리모주의 어느 국민학교, 아침 여덟 시. 교사 마르그리트 페로는 칠판 위에 걸린 사진을 보며 노래를 시작했다. 흰 콧수염의 노인 사진이었다. 아이들이 따라 불렀다. 원수님, 우리가 여기 있습니다. 교육청에서 지난주에 내려온 노래였다.\n\n학교 앞 담배 가게에는 원수 얼굴이 찍힌 접시와 달력이 쌓였다. 우표에도 그 얼굴이 들어갔다. 페로의 어머니는 그 접시를 두 개 샀다. 하나는 언니 주려고.\n\n점심시간에 교장이 신문을 들고 왔다. 선전부가 원수 생일을 국경일로 정하자는 안을 냈다고 했다. 여든 살 노인이 생애 처음 사랑받는 것 같다고 측근에게 털어놨다는 기사도 있었다. 페로는 그 기사를 읽고 조금 마음이 짠했다. 그게 싫었다."
 lr_story.1402.a:0 "국경일로 정해. 나라엔 아버지가 필요하다."
 LR_tt_st_lr_story_1402_a:0 "§Y정부 정신§! 변화: 안정도 +4%, 전쟁 지지 +2%"
 lr_story.1402.b:0 "과하다. 나는 군인이지 성인이 아니다."
 LR_tt_st_lr_story_1402_b:0 "§Y정부 정신§! 변화: 육군 사기 +2%, 정치력 +3%"
 lr_story.1403.t:0 "흰 넥타이의 사나이"
 lr_story.1403.d:0 "원수 비서실 타자수 쥘리에트 마송은 매주 화요일 피에르 라발의 방문을 기록했다. 라발은 늘 흰 넥타이를 맸다. 의회 시절 총리를 두 번 지낸 사람이었다. 원수는 의회 시절의 모든 걸 경멸했다. 그래도 라발은 매주 왔다.\n\n그날 문이 반쯤 열려 있었다. 라발의 목소리가 들렸다. \"원수님은 군대를 아시고, 저는 사람을 압니다. 런던과 베를린 사람들 말입니다.\"\n\n라발이 나가자 베강 장군이 들어가 문을 닫았다. 닫히기 직전 마송은 장군의 말을 들었다. \"저자는 프랑스도 팔 겁니다.\" 그 뒤로 집무실은 오래 조용했다. 마송은 다음 주 화요일 칸을 비워 둬야 할지 몰랐다."
 lr_story.1403.a:0 "부총리로 앉혀. 더러운 일엔 더러운 손이 필요하다."
 LR_tt_st_lr_story_1403_a:0 "§Y정부 정신§! 변화: 정치력 +5%, 안정도 -2%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1403.b:0 "해임하고 가택 연금해."
 LR_tt_st_lr_story_1403_b:0 "§Y정부 정신§! 변화: 육군 사기 +2%, 안정도 +3%"
 lr_story.1404.t:0 "피고석의 공화국"
 lr_story.1404.d:0 "리옴 법원 대법정. 법원 기자 앙드레 뤼시는 방청석 맨 앞줄에 앉아 있었다. 피고석에 옛 총리와 장관과 장군들이 앉아 있었다. 혐의는 대전쟁 패배와 그 뒤 프랑스를 약하게 만든 죄였다.\n\n셋째 날 재판이 이상하게 흘렀다. 피고들이 검사를 몰아세웠다. 늙은 전직 장관이 일어나 물었다. 전쟁 전에 군사 예산을 깎은 위원회 위원장이 누구였느냐고. 방청석 기자들이 일제히 펜을 들었다. 뤼시도 들었다. 위원장은 원수 자신이었다.\n\n법무장관이 판사석으로 다가가 뭐라고 속삭였다. 판사가 휴정을 선언했다. 뤼시는 그날 기사를 썼다. 검열관이 절반을 지웠다. 남은 절반도 다음 날 신문에 실리지 않았다."
 lr_story.1404.a:0 "끝까지 간다. 진실이 나를 해치지는 않는다."
 LR_tt_st_lr_story_1404_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%, 안정도 +2%"
 lr_story.1404.b:0 "무기한 휴정해. 판결은 이미 내려져 있다."
 LR_tt_st_lr_story_1404_b:0 "§Y정부 정신§! 변화: 독재정 지지 +2%, 정치력 +4%"
 lr_story.1405.t:0 "원수의 유언장"
 lr_story.1405.d:0 "비시의 겨울. 원수의 주치의 베르나르 메네트렐은 아침마다 원수와 공원을 산책했다. 원수는 오후에 낮잠을 잤다. 요즘은 대화 중에 이름을 잊는 일이 잦았다. 메네트렐은 그걸 아무에게도 말하지 않았다. 측근들은 다 알았다.\n\n어느 오후 변호사가 봉인된 봉투를 들고 왔다. 헌법 법령 제4호. 원수가 쓰러지면 국가원수를 이을 사람의 이름이 들어갈 빈칸이었다. 메네트렐은 진찰 가방을 들고 나가려다 원수가 손짓해서 남았다.\n\n원수는 만년필을 들었다가 내려놓았다. 메네트렐을 쳐다봤다. \"의사 선생, 내가 얼마나 남았소?\" 메네트렐은 대답하지 않았다. 원수도 대답을 기다리지 않았다. 다시 만년필을 들었다."
 lr_story.1405.a:0 "라발의 이름을 쓰지. 그 사람은 살아남는 법을 안다."
 LR_tt_st_lr_story_1405_a:0 "§Y정부 정신§! 변화: 정치력 +8%"
 lr_story.1405.b:0 "군에 맡긴다. 프랑스를 구한 건 늘 군대였다."
 LR_tt_st_lr_story_1405_b:0 "§Y정부 정신§! 변화: 육군 조직력 +3%, 전쟁 지지 +5%"
 lr_story.1405.c:0 "빈칸으로 둬. 국민 혁명이 곧 후계자다."
 LR_tt_st_lr_story_1405_c:0 "§Y정부 정신§! 변화: 안정도 +6%"
 lr_story.1501.t:0 "비양쿠르의 첫 월요일"
 lr_story.1501.d:0 "르노 비양쿠르 공장, 월요일 아침. 엔진 라인 선반공 마르셀 앙리는 사장실 문이 활짝 열려 있는 걸 보았다. 안은 비어 있었다. 정문 위에 검은색과 붉은색으로 반씩 나뉜 깃발이 걸렸다. 노동자 총회가 밤새 생산 계획을 투표로 정했다.\n\n투표는 정했는데 합의는 안 됐다. 트럭 라인은 트랙터를 만들자 했고, 엔진 라인은 무기를 만들자 했다. 앙리는 엔진 라인이었다. 그래도 트랙터 쪽 말이 맞는 것 같았다. 누구도 명령할 권한이 없었다. 그게 이 혁명의 요점이었다.\n\n총회 의장이 연합 서기국에 전화를 걸었다. 앙리는 옆에서 들었다. 서기국은 결정할 권한이 없다고 했다. 의장은 수화기를 내려놓고 한참 웃었다. 그리고 다시 총회를 소집했다."
 lr_story.1501.a:0 "총회가 정한다. 오래 걸려도 그게 자유다."
 LR_tt_st_lr_story_1501_a:0 "§Y정부 정신§! 변화: 사회주의 지지 +2%, 안정도 +3%"
 lr_story.1501.b:0 "조합끼리 전국 생산 조정위원회를 꾸리자."
 LR_tt_st_lr_story_1501_b:0 "§Y정부 정신§! 변화: 공장 생산량 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1502.t:0 "엽총과 협동조합"
 lr_story.1502.d:0 "방데의 어느 마을 광장. 파리에서 온 청년 알랭 비뇽은 집산 농장 가입서를 탁자에 펼쳤다. 농민들은 팔짱을 끼고 서 있었다. 맨 앞의 남자가 말했다. \"우린 땅을 원했지, 당신네 공동 농장을 원한 게 아니오.\"\n\n비뇽의 동료가 바쿠닌을 인용했다. 뒤에서 엽총 장전하는 소리가 났다. 비뇽은 고개를 돌리지 않았다. 손바닥에 땀이 찼다.\n\n그때 늙은 대장장이가 앞으로 나왔다. 망치를 든 채였다. 억지로 가입시키는 집산은 지주가 바뀐 것뿐이라고 했다. 광장이 조용해졌다. 비뇽은 가입서를 반으로 접었다. 그날 저녁 서기국에 전보를 쳤다. 지시를 청한다고."
 lr_story.1502.a:0 "가입은 자유다. 원하는 사람만 집산한다."
 LR_tt_st_lr_story_1502_a:0 "§Y정부 정신§! 변화: 안정도 +4%\n모든 지역 §Y반발도§! -15"
 lr_story.1502.b:0 "혁명은 안 기다린다. 코뮌 총회로 밀어붙여."
 LR_tt_st_lr_story_1502_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 안정도 -2%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1503.t:0 "벨빌의 밤샘 토론"
 lr_story.1503.d:0 "벨빌 노동자 회관. 늙은 인쇄공 오귀스트 페랭은 밤새 의자에 앉아 토론을 들었다. 담배 연기 때문에 칠판 글씨가 안 보였다.\n\n강령파는 1871년 코뮌이 왜 72일 만에 무너졌는지 따졌다. 조직이 없어서였다고. 규율과 공동 전술과 하나의 강령이 필요하다고. 페랭은 1871년에 아버지 손을 잡고 바리케이드 근처에 갔었다. 여섯 살이었다. 조직이 있었는지는 기억나지 않았다.\n\n새벽 네 시에 종합파의 늙은 연설가가 일어났다. \"규율, 강령, 집행부. 동지들, 사람들은 그런 걸 당이라고 부르오. 우린 그걸 없애려고 혁명을 했소.\" 회관에 웃음이 터졌다. 페랭도 웃었다. 다섯 시에 의장이 표결을 부쳤다. 페랭은 손을 어디에 들지 아직 정하지 못했다."
 lr_story.1503.a:0 "강령파다. 살아남아야 자유도 있다."
 LR_tt_st_lr_story_1503_a:0 "§Y정부 정신§! 변화: 육군 조직력 +3%, 정치력 +3%"
 lr_story.1503.b:0 "종합파다. 수단이 목적을 삼키게 두지 않는다."
 LR_tt_st_lr_story_1503_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +2%, 안정도 +4%"
 lr_story.1504.t:0 "가죽 외투의 사내들"
 lr_story.1504.d:0 "파리 북역. 철도원 피에르 고뎅은 회색 가죽 외투를 입은 남자 셋이 기차에서 내리는 걸 보았다. 셋 다 짐이 작았다. 유럽 각지에서 망명한 중앙집권파 공산주의자 대표단이라고 했다.\n\n그들은 연합에 조건을 내밀었다. 무기와 돈을 주겠다. 대신 민병대에 정치위원을 두고 연합 대회에 당 대표단을 받아들여라. 고뎅은 그 얘기를 저녁에 회관에서 들었다.\n\n회관 구석에서 바르셀로나에서 온 동지가 낮게 말했다. \"저 사람들이 들어온 도시에서 우리 동지들이 하나둘 사라졌소.\" 고뎅은 북역에서 본 가죽 외투를 떠올렸다. 비가 오는데 셋 다 우산을 쓰지 않았다."
 lr_story.1504.a:0 "무기는 받고 위원은 거절해."
 LR_tt_st_lr_story_1504_a:0 "§Y정부 정신§! 변화: 육군 공격력 +2%, 정치력 -2%"
 lr_story.1504.b:0 "문을 닫아. 붉은 관료도 관료다."
 LR_tt_st_lr_story_1504_b:0 "§Y정부 정신§! 변화: 안정도 +3%, 전쟁 지지 +2%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1505.t:0 "국가 없는 첫 봄"
 lr_story.1505.d:0 "1년이 지났다. 파리 시청 관리인 베르탱은 아침에 시장실 문을 열고 창문을 환기시켰다. 1년째 시장이 없었다. 동네 경찰서는 도서관이 됐다. 빵은 여전히 모자랐지만 줄은 전보다 짧았다.\n\n외국 신문들은 1년 내내 프랑스가 곧 무너진다고 썼다. 무너지지 않았다. 이제 그들은 다른 걸 물었다. 국가 없이 전쟁을 치를 수 있느냐고. 왕들의 군대가 국경에 모이고 있었다.\n\n오후에 연합 대회가 시청 대회의실에서 열렸다. 마지막 의제는 혁명을 지키는 방법이었다. 베르탱은 의자를 놓다가 하나가 모자란 걸 알았다. 창고에서 시장 의자를 꺼내 왔다. 아무도 앉지 않으려 했다. 결국 베르탱이 앉았다."
 lr_story.1505.a:0 "모든 코뮌이 무장한다. 침략자는 마을마다 싸워야 할 거다."
 LR_tt_st_lr_story_1505_a:0 "§Y정부 정신§! 변화: 육군 방어력 +5%, 징집 인구 +3%"
 lr_story.1505.b:0 "국경 너머 노동자들에게 혁명을 가져간다."
 LR_tt_st_lr_story_1505_b:0 "§Y정부 정신§! 변화: 육군 공격력 +3%, 전쟁 지지 +5%"
 lr_story.1505.c:0 "조정위원회에 전시 권한을 줘. 이번 한 번만."
 LR_tt_st_lr_story_1505_c:0 "§Y정부 정신§! 변화: 공장 생산량 +3%, 정치력 +6%"
 lr_story.1601.t:0 "보케르의 저녁 식사"
 lr_story.1601.d:0 "튈르리 궁 서재. 통령 비서 앙드레 뒤부아는 누렇게 바랜 소책자를 건네받았다. 보케르의 저녁 식사. 1922년 여름, 아비뇽 포병 연대로 부임하던 스물한 살 소위가 보케르 여관에서 상인들과 논쟁한 뒤 쓴 글이었다. 대전쟁에서 진 나라의 젊은 장교가 쓴 혁명과 대포 얘기.\n\n뒤부아는 표지를 넘겼다. 첫 장 여백에 연필로 쓴 낙서가 있었다. 상인 하나의 얼굴을 그린 것 같았다. 코가 컸다.\n\n\"그때 나는 공화국이 이긴다고 썼지. 그리고 그 공화국을 지키는 건 결국 대포라고.\" 통령은 그 말을 하고 창밖을 보았다. 뒤부아가 물었다. 몇 부를 찍을까요."
 lr_story.1601.a:0 "100만 부. 모든 병영과 공장에 한 권씩."
 LR_tt_st_lr_story_1601_a:0 "§Y정부 정신§! 변화: 사회주의 지지 +3%, 전쟁 지지 +2%"
 lr_story.1601.b:0 "1,000부만. 원수들과 위원들이 읽으면 된다."
 LR_tt_st_lr_story_1601_b:0 "§Y정부 정신§! 변화: 정치력 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1602.t:0 "원수들의 저녁"
 lr_story.1602.d:0 "튈르리 궁 식당. 시종 앙투안 르루는 장군 넷의 잔에 포도주를 따랐다. 알제부터 통령과 같이 싸운 사람들이었다. 그들은 나폴레옹을 따랐다. 붉은 깃발을 따른 적은 없었다.\n\n가장 나이 많은 장군이 포크를 내려놓았다. \"각하, 저희가 왕을 쓰러뜨린 건 노동자 평의회에 경례하려고가 아니었습니다.\" 르루는 포도주병을 든 채 멈췄다. 나머지 셋은 접시만 보았다.\n\n통령은 포도주를 한 모금 마시고 장군들을 한 사람씩 쳐다보았다. 르루는 그 장군이 알제리 사막에서 통령에게 마지막 물통을 건넨 사람이라는 얘기를 들은 적이 있었다. 통령도 그걸 기억할 거다."
 lr_story.1602.a:0 "견장에 붉은 별을 달아 주지. 원수 지휘봉도 함께."
 LR_tt_st_lr_story_1602_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%, 정치력 +2%"
 lr_story.1602.b:0 "해임한다. 대육군의 원수는 혁명이 정한다."
 LR_tt_st_lr_story_1602_b:0 "§Y정부 정신§! 변화: 육군 조직력 -1%, 사회주의 지지 +3%"
 lr_story.1603.t:0 "정교 협약의 운명"
 lr_story.1603.d:0 "공안위원회 회의실. 회의 서기 샤를 바예는 위원 하나가 정교 협약 원본을 탁자에 내던지는 걸 받아 적었다. 통령이 교황과 맺은 협약이었다. 맨 아래 통령의 서명과 교황의 인장이 나란히 찍혀 있었다.\n\n2년 전 그 서명 덕분에 방데의 성당들이 다시 문을 열었다. 서부의 반란도 잦아들었다. 바예의 사촌은 방데에 살았다. 협약 다음 주에 사촌한테서 편지가 왔다. 마을 신부가 돌아왔다고, 할머니가 울었다고.\n\n위원이 말했다. \"혁명 정부가 주교 봉급을 대는 나라가 어디 있습니까?\" 통령은 협약문을 집어 들고 천천히 접었다. 그는 신을 믿지 않았다. 그래도 일요일에 성당 가는 농민이 몇 명인지는 알았다."
 lr_story.1603.a:0 "협약은 지킨다. 성당을 뺏으면 방데가 일어난다."
 LR_tt_st_lr_story_1603_a:0 "§Y정부 정신§! 변화: 안정도 +4%\n모든 지역 §Y반발도§! -15"
 lr_story.1603.b:0 "파기해. 교회 재산은 국유화한다."
 LR_tt_st_lr_story_1603_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 정치력 +4%, 안정도 -2%"
 lr_story.1604.t:0 "익명의 벽보"
 lr_story.1604.d:0 "생앙투안 거리. 순경 앙드레 르코크는 아침 순찰을 돌다가 벽마다 같은 벽보가 붙어 있는 걸 보았다. 붉은 통령의 초상 아래 두 줄. 브루투스는 어디 있는가. 테르미도르는 언제 오는가. 르코크는 하나를 떼어 접어서 주머니에 넣었다. 증거물이었다.\n\n오후에 경찰장관이 벽보 붙인 사람들 명단을 통령에게 가져갔다고 했다. 르코크는 그 명단 작성에 참여했다. 절반은 오래된 코뮌 활동가였다. 그중 하나는 르코크 아버지의 친구였다. 어릴 때 르코크에게 사탕을 주던 사람이었다.\n\n장관이 물었다고 했다. 이들을 어떻게 할까요. 르코크는 퇴근길에 주머니 속 벽보를 다시 꺼내 읽었다. 글씨가 반듯했다. 인쇄공 솜씨였다."
 lr_story.1604.a:0 "체포해. 혁명에는 혁명의 적이 있다."
 LR_tt_st_lr_story_1604_a:0 "§Y정부 정신§! 변화: 사회주의 지지 -1%, 정치력 +4%, 안정도 +2%"
 lr_story.1604.b:0 "그냥 둬. 비판이 두려운 혁명은 혁명이 아니다."
 LR_tt_st_lr_story_1604_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +3%, 안정도 -1%"
 lr_story.1605.t:0 "종신 통령"
 lr_story.1605.d:0 "노동자 평의회 전국 대회. 대의원 루시앵 마르는 기립 박수 속에서 결의문이 읽히는 걸 들었다. 인민의 통령 나폴레옹에게 종신의 권한을 바친다. 마르도 일어나서 박수를 쳤다. 옆 사람이 그러니까.\n\n통령이 연단에 올랐다. 그리고 한참 말없이 서 있었다. 회의장이 조용해졌다. 왕관을 거절하고 붉은 깃발을 든 사람에게, 대회는 왕관이나 다름없는 걸 내밀고 있었다. 마르는 그걸 그제야 깨달았다. 박수 친 손이 조금 부끄러웠다.\n\n앞줄의 늙은 코뮌 투사 알퐁스는 박수를 치지 않았다. 팔짱을 끼고 앉아 있었다. 마르는 그 노인이 통령의 대답을 기다리는 얼굴을 보았다. 화난 얼굴이 아니었다. 궁금한 얼굴이었다."
 lr_story.1605.a:0 "받아들인다. 혁명은 한 사람 손에서만 지켜진다."
 LR_tt_st_lr_story_1605_a:0 "§Y정부 정신§! 변화: 정치력 +8%, 전쟁 지지 +4%"
 lr_story.1605.b:0 "거절한다. 내 임기는 혁명이 끝나는 날까지다."
 LR_tt_st_lr_story_1605_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +3%, 안정도 +6%"
 lr_story.1605.c:0 "대답하지 않고 원수들을 부른다. 결정은 전장에서 한다."
 LR_tt_st_lr_story_1605_c:0 "§Y정부 정신§! 변화: 육군 사기 +4%, 전쟁 지지 +5%"
 lr_story.1701.t:0 "리츠 호텔의 만찬"
 lr_story.1701.d:0 "총리 비서실장 루이 바랭은 리츠 호텔 초대장을 두 손가락으로 집어 들었다. 점령군 사령관이 파리 명사 마흔 명을 만찬에 초대했다. 은행가, 극장 주인, 주교, 옛 정부의 장관 몇 명. 정부 앞으로도 한 장이 왔다.\n\n초대장에는 거절할 경우에 대한 말이 없었다. 바랭은 그게 무슨 뜻인지 알았다. 다들 알았다.\n\n바랭은 초대장을 총리 책상에 놓고 물었다. \"정부 대표로 누가 가야 할까요? 아니면 아무도 보내지 말까요?\" 총리는 초대장의 금박 테두리를 손가락으로 쓸었다. 메뉴판이 동봉돼 있었다. 바닷가재였다. 바랭은 석 달째 고기를 못 먹었다."
 lr_story.1701.a:0 "내가 직접 간다. 식탁에서 얻을 건 얻는다."
 LR_tt_st_lr_story_1701_a:0 "§Y정부 정신§! 변화: 정치력 +3%\n§Y이 선택은 이 루트의 결말을 바꿉니다.§!"
 lr_story.1701.b:0 "아무도 안 보낸다. 빈 의자가 대답이다."
 LR_tt_st_lr_story_1701_b:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%"
 lr_story.1702.t:0 "바르베스역의 총성"
 lr_story.1702.d:0 "바르베스 로슈슈아르 지하철역. 역무원 에티엔 모로는 총소리를 듣고 플랫폼으로 뛰어갔다. 점령군 해군 사관후보생 하나가 등에 총을 맞고 쓰러져 있었다. 스물도 안 돼 보였다. 범인은 군중 속으로 사라졌다. 모로는 아무것도 보지 못했다. 정말이었다.\n\n다음 날 아침 파리의 벽마다 점령군 포고문이 붙었다. 범인이 잡히지 않으면 인질 50명을 총살한다. 모로는 출근길에 그 포고문을 세 번 지나쳤다.\n\n점령군 사령관은 프랑스 정부에 명단을 요구했다. 누구를 내줄지 프랑스가 정하라는 것이었다. 모로는 그 얘기를 역무원 휴게실 라디오로 들었다. 동료 하나가 라디오를 껐다. 아무도 다시 켜지 않았다."
 lr_story.1702.a:0 "명단은 거부한다. 프랑스는 제 시민을 넘기지 않는다."
 LR_tt_st_lr_story_1702_a:0 "§Y정부 정신§! 변화: 안정도 -3%, 전쟁 지지 +4%"
 lr_story.1702.b:0 "감옥에 있는 공산주의자들 이름을 적어."
 LR_tt_st_lr_story_1702_b:0 "§Y정부 정신§! 변화: 사회주의 지지 -2%, 정치력 +3%, 안정도 +2%"
 lr_story.1703.t:0 "센강이 얼다"
 lr_story.1703.d:0 "1월, 센강이 얼었다. 빵집 주인 마리 고티에는 새벽 다섯 시에 가게 문을 열었다. 화덕에 넣을 석탄이 사흘 치밖에 없었다. 동네 아파트에도 석탄이 없었다. 아이들은 외투를 입은 채 잤다. 공원의 나무들이 하룻밤 사이에 사라졌다.\n\n빵을 기다리는 줄에서 사람들이 소곤거렸다. 숲에 들어간 젊은이가 늘었다고. 지방 철로가 또 끊겼다고. 고티에는 못 들은 척 빵을 쌌다. 줄 끝의 여자 하나가 고티에의 아들 이름을 작게 불렀다. 고티에는 고개를 들지 않았다. 아들은 지난달 숲으로 갔다.\n\n가게 라디오에서 정부 신년사가 나왔다. 듣는 사람은 없었다. 고티에는 라디오를 끄지 않았다. 소리라도 있어야 했다."
 lr_story.1703.a:0 "점령군에게 석탄을 더 달라고 해."
 LR_tt_st_lr_story_1703_a:0 "§Y정부 정신§! 변화: 안정도 +4%"
 lr_story.1703.b:0 "교회와 노조에 구호를 맡겨."
 LR_tt_st_lr_story_1703_b:0 "§Y정부 정신§! 변화: 안정도 +3%, 전쟁 지지 +1%"
 lr_story.1703.c:0 "숲의 젊은이들에게 몰래 보급을 보내."
 LR_tt_st_lr_story_1703_c:0 "§Y정부 정신§! 변화: 전쟁 지지 +5%"
 lr_story.1001.t:0 "런던의 회계사들"
 lr_story.1001.d:0 "재무부 지하 금고. 출납계 직원 루이즈 마르셰는 사흘째 영국인 회계사 옆에서 장부를 넘겨 주었다. 회계사는 점심도 거르고 돋보기로 숫자를 더했다. 가끔 여백에 연필로 작은 점을 찍었다. 마르셰는 그 점이 무슨 뜻인지 몰라서 밤마다 잠을 설쳤다.\n\n넷째 날 아침 회계사가 돋보기를 내려놓았다. \"이 일정이면 프랑스는 1980년까지 갚으셔야겠군요.\" 말투는 친절했다.\n\n마르셰는 재무장관 서랍에 장부가 두 권 있다는 걸 알았다. 한 권은 진짜였다. 다른 한 권은 그저께 밤 회계사 셋이 밤새 만든 거였다. 그중 한 명이 마르셰였다."
 lr_story.1001.a:0 "진짜 장부를 보여 줘. 동정이라도 사야지."
 lr_story.1001.b:0 "가짜를 내밀어. 모자라는 돈은 조선소로 간다."
 lr_story.1002.t:0 "로렌의 굴뚝"
 lr_story.1002.d:0 "낭시 제철소. 노조 위원장 레몽 바이에는 20년 만에 불이 들어온 용광로 앞에 서 있었다. 용광로는 돌았다. 쇳물 다룰 손이 없었다. 대전쟁에서 돌아온 숙련공이 너무 적었다.\n\n용광로 앞에는 여든 넘은 노인 둘이 있었다. 대전쟁 전에 여기서 일하던 사람들이었다. 손은 떨렸지만 쇳물 색깔만 보고 온도를 맞혔다. 바이에는 그 둘이 은퇴하면 그 눈도 같이 사라진다는 걸 알았다.\n\n사장이 말했다. \"토리노에서 이탈리아 사람들 데려오면 다음 주부터 돌립니다.\" 바이에가 받았다. \"프랑스 강철은 프랑스 손으로 만들어야지!\" 둘은 멱살을 잡기 직전이었다. 노인 하나가 그 사이로 걸어가 용광로 문을 열었다. 쇳물 색이 좋다고 했다."
 lr_story.1002.a:0 "이민자를 받아. 강철에 국적은 없다."
 lr_story.1002.b:0 "제대 군인을 다시 가르치지. 느려도."
 lr_story.1003.t:0 "젊은 대령의 메모"
 lr_story.1003.d:0 "참모본부 개편 위원회 서기 앙드레 바스티앙은 서른 쪽짜리 메모를 위원들에게 돌렸다. 보낸 사람은 드골이라는 대령이었다. 표지에 붉은 글씨로 기밀이라고 적혀 있었다. 바스티앙은 같은 내용을 서점에서 산 책으로 읽은 적이 있었다. 700부 팔린 책이었다. 한 부는 베를린 참모본부 도서관에 있다고 했다.\n\n요지는 한 줄이었다. 전차를 보병 사이에 흩지 말고 한 주먹으로 모아라.\n\n페탱 원수는 세 쪽까지 읽고 메모를 내려놓았다. \"베르됭을 지킨 건 전차가 아니라 참호였네.\" 위원들이 서로 눈치를 봤다. 바스티앙은 나머지 스물일곱 쪽을 다시 거둘지 말지 망설였다."
 lr_story.1003.a:0 "메모를 돌려 읽게 해."
 lr_story.1003.b:0 "원수의 경험을 따르지."
 lr_story.1004.t:0 "제독의 예산안"
 lr_story.1004.d:0 "브레스트 해군 사령부. 당번병 이브 르갈은 회의실에 커피를 놓으며 창밖을 봤다. 대전쟁에서 살아남은 낡은 전함 두 척이 정박해 있었다. 조약은 그 이상을 허락하지 않았다. 수병들은 그 배를 박물관이라고 불렀다.\n\n제독 둘이 예산안 한 장을 두고 마주 앉아 있었다. \"전함 없는 해군은 해군이 아니오. 깃발 보여 줄 배가 있어야지.\" \"다음 전쟁은 하늘을 쥔 쪽이 바다도 쥐오. 베아른호를 항공모함으로 고칩시다.\"\n\n조약은 둘 다 금지했다. 예산은 하나만 됐다. 르갈은 커피잔을 하나씩 내려놓고 나왔다. 둘 다 커피에 손을 대지 않았다."
 lr_story.1004.a:0 "전함이다. 나라의 얼굴이다."
 lr_story.1004.b:0 "베아른을 고쳐. 비행기가 답이다."
 lr_story.1005.t:0 "이스트르 비행장의 추락"
 lr_story.1005.d:0 "이스트르 비행장, 오전 10시 14분. 정비사 쥘 모로는 활주로 끝 밀밭에서 연기가 오르는 걸 보았다. 시험 비행 중이던 신형 전투기였다. 조종사 피에르 를롱은 스물여섯이었다. 모로가 그날 아침 연료를 넣어 주었다.\n\n장례식에 기자들이 몰려왔다. 신문은 조약 위반 얘기보다 약혼녀 사진을 더 크게 실었다. 모로는 그 사진을 보고 신문을 접었다. 약혼녀는 비행장 식당에서 일했다.\n\n장례식 다음 날 장관이 비행장에 왔다. 정비 격납고에서 기술 책임자에게 물었다. 비행을 계속하겠느냐고. 모로는 공구를 닦으며 그 대답을 기다렸다."
 lr_story.1005.a:0 "설계부터 다시. 조종사를 실험 재료로 쓸 순 없다."
 lr_story.1005.b:0 "계속 난다. 그 친구들도 알고 들어온 일이다."
 lr_story.1006.t:0 "금고에서 나온 계획"
 lr_story.1006.d:0 "참모본부 금고가 20년 만에 열렸다. 문서 담당 소령 루이 바랭은 먼지를 털어 낸 서류철을 탁자에 놓았다. 동원 계획 제17호. 1914년 계획을 고쳐 쓴 것이었다.\n\n서류철 안에 1914년 8월의 메모가 끼워져 있었다. 동원 엿새째, 벨기에 국경 예비 사단 미도착. 바랭은 그 사단이 끝내 도착하지 못했다는 걸 알았다. 그의 아버지가 그 사단에 있었다.\n\n바랭이 말했다. \"이 계획으로 우리는 지난번에 졌습니다.\" 늙은 장군이 철도 시간표를 손가락으로 두드렸다. \"열차는 그때보다 빨라졌네. 그거면 충분해.\" 바랭은 메모를 서류철에 다시 넣었다."
 lr_story.1006.a:0 "처음부터 다시 써. 지난 전쟁 계획으로는 못 이긴다."
 lr_story.1006.b:0 "철도표는 믿을 만해. 고쳐 쓰면 된다."
 lr_story.1007.t:0 "요람과 대포"
 lr_story.1007.d:0 "왕실 회의. 통계국 서기 장 피카르는 인구 통계표를 탁자에 펼쳤다. 그래프 한가운데 깊은 골이 파여 있었다. 1916년에서 1919년 사이에 태어났어야 할 아이들이었다. 피카르는 1917년생이었다. 그 골짜기 안에 있었다.\n\n내무장관이 말했다. \"폐하, 지금 요람에 돈을 대지 않으면 20년 뒤엔 대포 쏠 사람이 없습니다.\" 베강 장군이 탁자를 쳤다. \"지금 대포를 안 만들면 20년 뒤라는 게 아예 없소. 독일은 기다려 주지 않아.\"\n\n왕은 그래프를 오래 보았다. 피카르는 자기 손가락이 그래프의 1917년 칸을 가리키고 있다는 걸 알고 얼른 손을 뗐다."
 lr_story.1007.a:0 "요람이 먼저다. 프랑스엔 미래가 필요하다."
 LR_tt_st_lr_story_1007_a:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1007.b:0 "20년 뒤는 없다. 대포가 먼저다."
 LR_tt_st_lr_story_1007_b:0 "§Y정부 정신§! 변화: 안정도 -1%"
 lr_story.1008.t:0 "르 피가로의 사설"
 lr_story.1008.d:0 "아침 가판대. 신문 판매원 오스카 뒤부아는 르 피가로를 펼쳐 보다가 1면 한가운데 흰 칸을 발견했다. 사진 한 장 크기였다. 검열관이 지운 사설 자리를 신문사가 그냥 비워 두고 찍은 거였다.\n\n오전에는 르 피가로만 그랬다. 오후에 들어온 석간 세 개가 따라 했다. 저녁에는 파리 신문 일곱 개가 흰 칸을 실었다. 손님들은 흰 칸을 보며 수군거렸다. 한 노인은 흰 칸만 오려 달라고 했다.\n\n뒤부아는 그날 신문을 평소의 두 배 팔았다. 다음 날 경찰이 와서 편집장 집 주소를 물었다. 뒤부아는 모른다고 했다. 정말 몰랐다."
 lr_story.1008.a:0 "체포하고 신문사를 접수해."
 LR_tt_st_lr_story_1008_a:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 -1%"
 lr_story.1008.b:0 "점심에 초대해. 왕실 인터뷰도 하나 주고."
 LR_tt_st_lr_story_1008_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1009.t:0 "르노의 항의"
 lr_story.1009.d:0 "왕실 군수국 사무관 레옹 쇼베는 루이 르노의 편지를 뜯었다. 붉은 잉크 밑줄투성이였다. 편지와 함께 공장 장부 사본이 왔다. 마지막 줄 적자 숫자에 밑줄이 두 번 그어져 있었다.\n\n\"전차 납품가가 원가의 절반이오! 트럭 라인을 전차로 돌리라는 건 회사 망하라는 소리요!\" 비양쿠르 공장 노동자는 3만이었다. 쇼베의 처남도 거기 다녔다.\n\n쇼베는 편지를 장군들 회의에 올렸다. 장군들은 돌려 읽고 웃었다. 한 장군이 말했다. \"체포하면 공장은 더 싸게 돌겠군.\" 쇼베는 처남에게 전화해야 할지 생각했다."
 lr_story.1009.a:0 "값을 올려 줘. 공장은 사장이 돌린다."
 LR_tt_st_lr_story_1009_a:0 "§Y정부 정신§! 변화: 정치력 -1%"
 lr_story.1009.b:0 "공장은 왕의 것이다. 납품가는 그대로."
 LR_tt_st_lr_story_1009_b:0 "§Y정부 정신§! 변화: 안정도 -1%"
 lr_story.1010.t:0 "사촌의 편지"
 lr_story.1010.d:0 "베르사유 응접실. 시종 앙투안 르루는 오전에 마드리드 사촌의 친필 편지를 왕에게 가져갔다. 카를로스파가 북부에서 무기를 사 모으니 피레네 국경을 닫아 달라는 내용이었다.\n\n오후에 르루는 손님 하나를 응접실로 안내했다. 카를로스파의 대리인이었다. 남자는 무거운 가방을 들고 있었다. 르루가 받아 들려고 하자 남자가 웃으며 손을 저었다. 직접 들겠다고.\n\n왕이 들어오자 남자가 일어서서 인사했다. \"폐하, 왕의 친척은 언제나 둘 이상이지요.\" 르루는 문을 닫고 나왔다. 가방 안에 뭐가 들었는지는 끝내 몰랐다. 짐작은 갔다."
 lr_story.1010.a:0 "국경을 닫아. 왕은 왕을 돕는다."
 lr_story.1010.b:0 "양쪽 다 팔 물건이 있지."
 LR_tt_st_lr_story_1010_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1011.t:0 "로마에서 온 사절"
 lr_story.1011.d:0 "왕실 예배당. 성가대 지휘자 미셸 포르는 미사가 끝나고 단원들을 내보낸 뒤 악보를 정리하고 있었다. 교황 사절이 제의를 벗으며 왕에게 다가가는 게 보였다.\n\n\"성하께서는 프랑스 왕을 축복하실 준비가 되어 있습니다. 다만 주교 임명권을 로마에 돌려주신다면.\" 포르는 악보를 넘기는 척하며 귀를 기울였다. 그 축복이 있으면 시골 사제들이 다 왕 편에 선다. 포르의 고향 신부도 그럴 거다.\n\n늙은 궁정 대신이 왕의 귀에 속삭였다. 포르에게도 들렸다. \"루이 14세 폐하께서도 그것만은 내주지 않으셨습니다.\""
 lr_story.1011.a:0 "주교는 짐이 뽑는다. 루이 14세처럼."
 LR_tt_st_lr_story_1011_a:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1011.b:0 "로마와 화해하지. 시골 사제들이 필요하다."
 LR_tt_st_lr_story_1011_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.1012.t:0 "베르사유의 포병대"
 lr_story.1012.d:0 "베르사유 정원사 레옹 비알은 앞마당에 75밀리 야포 스무 문이 늘어선 걸 보고 화단을 걱정했다. 대포 바퀴가 잔디를 다 파 놓았다. 배상 위원회 장부에는 없는 대포였다. 왕이 일부러 거기 세워 두라고 했다.\n\n주말에 구경꾼이 몰렸다. 파리 시민들이 아이들을 포신 위에 올려 사진을 찍었다. 비알은 아이 하나가 떨어질 뻔한 걸 잡아 주었다.\n\n월요일 아침 영국 대사가 얼굴이 빨개진 채 왔다. 배상금이 석 달째 밀린 나라가 무슨 돈으로 대포를 샀느냐는 것이었다. 궁정 사람들은 샴페인으로 맞았다. 대사는 잔을 받지 않았다. 궁정 대신이 정중하게 물었다. \"폐하께 뭐라고 전해 드릴까요, 대사님? 정원이 마음에 드신다고 할까요?\" 비알은 그 정원 잔디를 다시 깔아야 했다."
 lr_story.1012.a:0 "짐의 정원에 짐의 대포가 있을 뿐이다."
 LR_tt_st_lr_story_1012_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%"
 lr_story.1012.b:0 "불꽃놀이 준비였다고 전하게."
 LR_tt_st_lr_story_1012_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1013.t:0 "방데의 농민들"
 lr_story.1013.d:0 "방데의 마을 광장. 코뮌 위원 앙리 바스티드는 토지 문서를 나눠 주었다. 농민들은 문서를 받았다. 그리고 그를 마을 밖으로 쫓아냈다. 때리지는 않았다. 등을 떠밀었을 뿐이었다.\n\n바스티드는 마을 어귀에서 짐을 내려놓고 한참 서 있었다. 성당 종탑에 총알 자국이 보였다. 백오십 년 전 혁명군이 쏜 거라고 했다. 마을 사람들은 그 자국을 아이들에게 보여 주며 키웠다.\n\n따라 나온 늙은 농부가 말했다. \"땅은 고맙소. 근데 성당 문엔 왜 못을 박았소?\" 바스티드는 대답하지 못했다. 그건 그가 한 일이 아니었다. 위원회가 한 일이었다."
 lr_story.1013.a:0 "성당 문을 열어. 땅이 먼저다."
 LR_tt_st_lr_story_1013_a:0 "§Y정부 정신§! 변화: 사회주의 지지 -1%, 안정도 +3%"
 lr_story.1013.b:0 "이번엔 방데도 혁명을 받아들여야 한다."
 LR_tt_st_lr_story_1013_b:0 "§Y정부 정신§! 변화: 안정도 -2%\n모든 지역 §Y반발도§! -15"
 lr_story.1014.t:0 "국경의 동지들"
 lr_story.1014.d:0 "코뮌 국제부 전신 기사 이렌 바르는 하루에 전보를 마흔 통씩 받았다. 베를린, 바르셀로나, 밀라노. 무기를 보내 달라고, 지금 일어서지 않으면 늦는다고.\n\n그중 하나는 베를린 지멘스 공장 노동자 평의회가 보냈다. 마지막 줄에 이렇게 적혀 있었다. 파리가 일어섰을 때 우리는 파업으로 연대했다. 이제 너희 차례다. 바르는 그 전보를 위원회 회의 서류 맨 위에 올렸다.\n\n회의실 밖까지 목소리가 들렸다. \"우리는 일국사회주의를 택했소. 코뮌이 무너지면 세계 혁명도 없어.\" \"그렇다고 형제들이 맨손으로 죽는 걸 보고만 있을 거요?\" 창고에는 남는 소총이 몇천 자루 있었다."
 lr_story.1014.a:0 "코뮌을 지키는 게 세계 혁명을 지키는 거다."
 LR_tt_st_lr_story_1014_a:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.1014.b:0 "남는 소총은 보내."
 LR_tt_st_lr_story_1014_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +2%"
 lr_story.1015.t:0 "파리의 망명자들"
 lr_story.1015.d:0 "파리 생라자르 역 앞 호텔 주인 페르낭 고뎅은 장부에 의자 값을 적었다. 지난주 이탈리아 동지와 헝가리 동지가 마르크스 문장 하나를 두고 주먹다짐을 하다 의자 셋을 부쉈다. 청구서는 코뮌 앞으로 보냈다.\n\n고뎅의 호텔에는 유럽 각지에서 쫓겨난 혁명가들이 가득했다. 절반은 서로를 배신자라고 불렀다. 매일 밤 로비에서 다른 언어로 싸웠다. 러시아 공화국 대사관 직원 둘이 그 로비를 자주 서성였다. 차를 시켜 놓고 오래 앉아 있었다.\n\n인터내셔널 집행부 의장 자리가 하나 비었다. 어젯밤 로비에서 누가 외쳤다. 의장은 혁명을 이룬 나라에서 나와야 한다고. 고뎅은 그 말을 하고 나서 그 남자가 의자를 발로 찬 것도 장부에 적었다."
 lr_story.1015.a:0 "프랑스 동지가 의장을 맡는다."
 LR_tt_st_lr_story_1015_a:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1015.b:0 "다들 자리를 하나씩 줘. 싸움은 신문 지면에서 해."
 LR_tt_st_lr_story_1015_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +3%"
 lr_story.1016.t:0 "공장의 새 시계"
 lr_story.1016.d:0 "생테티엔 군수 공장. 반장 앙드레 퀴로는 저녁 6시 종이 울리자 공구를 내려놓았다. 라인 전체가 같이 내려놓았다. 주 40시간 법이었다. 컨베이어가 멈췄고, 반쯤 조립된 소총들이 내일 아침까지 그대로 줄지어 섰다.\n\n이 공장은 코뮌 정부 소총의 절반을 만들었다. 퀴로는 그걸 알았다. 그래도 공구를 내려놓았다. 지난 20년 동안 하루 열두 시간씩 일했다.\n\n같은 시각 파리 총리 관저에 전쟁부 장관이 뛰어 들어갔다고 했다. \"총리님, 왕들의 공장은 40시간만 돌지 않습니다!\" 블룸은 창밖 퇴근 행렬을 내려다봤다고 했다. 그 행렬 속 사람들이 그를 총리로 만들었다. 퀴로도 그 행렬에 있었다. 다른 도시에서."
 lr_story.1016.a:0 "법은 법이다. 노동자와의 약속은 지킨다."
 LR_tt_st_lr_story_1016_a:0 "§Y정부 정신§! 변화: 안정도 +2%\n§Y의석§! +12"
 lr_story.1016.b:0 "군수 공장만 예외로 하지."
 LR_tt_st_lr_story_1016_b:0 "§Y의석§! -6"
 lr_story.1017.t:0 "공장 점거"
 lr_story.1017.d:0 "내무부 차관 피에르 랑글루아는 비양쿠르 공장 정문 건너편 카페에서 세 번째 커피를 시켰다. 철문 위에는 점거 중이라고 페인트로 쓴 침대 시트가 걸려 있었다. 안에 3만 명이 있다고 했다. 랑글루아는 그 숫자를 믿지 않았지만, 정문 앞을 오가는 사람들을 보고 있으니 아주 틀린 말 같지도 않았다.\n\n이상한 점거였다. 기계는 멀쩡했다. 노동자들은 아침마다 선반에 기름칠을 했고, 점심때가 되면 지붕 위에서 누가 아코디언을 켰다. 담장 너머로 아내들이 바게트와 포도주를 넘겨주었다. 경비원 두 명은 정문 옆에 의자를 내놓고 앉아 담배를 피우고 있었다. 회사가 고용한 경비원들이었다.\n\n랑글루아는 커피를 다 마시고 정문으로 걸어갔다. 철문 사이로 작업복 차림의 젊은 남자가 그를 내다보았다. \"정부에서 왔소?\" 랑글루아가 고개를 끄덕이자 남자가 물었다. \"경찰은 언제 오오?\"\n\n\"아무도 안 와요. 아직은.\"\n\n\"아직은, 이라.\"\n\n남자는 웃더니 철문 틈으로 쪽지 한 장을 내밀었다. 노조 위원회 도장이 찍혀 있었다. 공안위원회는 누구 편이오. 그 한 줄뿐이었다.\n\n카페로 돌아오니 주인이 전화가 왔었다고 했다. 사장단 대표였다. 오늘만 세 번째였다. 랑글루아는 쪽지를 접어 주머니에 넣고 커피값을 치렀다. 총리에게 뭐라고 보고할지는 아직 정하지 못했다."
 lr_story.1017.a:0 "그들도 시민이다. 경찰은 보내지 마."
 LR_tt_st_lr_story_1017_a:0 "§Y의석§! +18"
 lr_story.1017.b:0 "공장 문을 열게 해. 오늘 안으로."
 LR_tt_st_lr_story_1017_b:0 "§Y정부 정신§! 변화: 안정도 +2%\n§G경제 재건§! +1"
 lr_story.1018.t:0 "과반의 첫날"
 lr_story.1018.d:0 "팔레 부르봉 수위 마르셀 피노는 개표 결과를 복도 게시판에 붙였다. 산악파가 처음으로 혼자 과반을 넘었다. 광장에서는 노동자들이 밤새 라 마르세예즈를 불렀다.\n\n자정 무렵 복도에서 지롱드 의원 하나가 블룸의 소매를 붙잡았다. 피노는 게시판 옆에 서 있었다. 의원의 목소리는 떨리지 않았는데 손은 떨렸다. \"이제 우리를 어떻게 하실 겁니까?\"\n\n1793년에는 답이 간단했다. 산악파가 이겼고, 지롱드는 단두대로 갔다. 피노는 두 사람 다 그걸 알고 있다는 걸 얼굴로 알 수 있었다. 블룸은 안경을 벗어 천천히 닦았다. 피노는 게시판 압정을 하나 더 박았다. 할 일이 없었다."
 lr_story.1018.a:0 "상임위원장을 나누지. 이번엔 단두대 없이."
 LR_tt_st_lr_story_1018_a:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.1018.b:0 "이긴 쪽이 다 갖는다. 그게 선거다."
 LR_tt_st_lr_story_1018_b:0 "§Y정부 정신§! 변화: 정치력 +4%\n§Y의석§! +12"
 lr_story.1019.t:0 "규제 없는 빵값"
 lr_story.1019.d:0 "빵값 상한이 풀린 첫 주. 빵집 주인 마리 고티에는 바게트 값을 40% 올려 써 붙였다. 밀가루 도매상이 먼저 올렸다. 고티에도 어쩔 수 없었다. 가게 앞에 늘어선 여자들이 빈 바구니를 흔들었다.\n\n가게 라디오에서 총리 해명이 나왔다. 곧 내린다고, 경쟁이 붙으면 값은 내려가게 돼 있다고. 줄 서 있던 여자 하나가 크게 말했다. 1789년 10월에도 여자들이 빵 때문에 베르사유까지 걸어갔다고.\n\n고티에는 라디오를 껐다. 그 여자는 고티에의 단골이었다. 고티에는 그 여자에게 바게트 하나를 옛날 값에 주었다. 다른 여자들이 봤다. 그날 고티에는 손해를 봤다."
 lr_story.1019.a:0 "시장을 믿어. 한 달만 버티면 내린다."
 LR_tt_st_lr_story_1019_a:0 "§Y정부 정신§! 변화: 안정도 -2%\n§G경제 재건§! +2"
 lr_story.1019.b:0 "겨울 동안만 빵값을 다시 묶어."
 LR_tt_st_lr_story_1019_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1020.t:0 "83개 데파르트망의 예산"
 lr_story.1020.d:0 "지롱드와 랑드의 데파르트망 경계. 도로 공사 감독 에티엔 라누는 새로 깐 아스팔트가 끝나는 지점에 서 있었다. 그 너머는 흙길이었다. 랑드 데파르트망과 비용 분담 합의가 안 됐다. 두 데파르트망의 표지판이 서로 등을 지고 서 있었다.\n\n파리 신문 사진 기자가 왔다. 라누는 저 표지판은 찍지 말아 달라고 했다. 기자는 웃으며 찍었다. 다음 날 1면에 실렸다. 제목은 지방 분권의 끝.\n\n파리 사람들은 웃었다고 했다. 라누는 웃을 수 없었다. 그 사진이 다음 선거 포스터가 될 거라는 걸 지롱드 내각도 알았다. 라누는 그날 오후 랑드 데파르트망 감독에게 전화를 걸었다. 둘이 사비로 나머지 3킬로미터를 깔자고 했다. 농담이었다. 반쯤."
 lr_story.1020.a:0 "데파르트망끼리 조정 위원회를 만들게 해."
 LR_tt_st_lr_story_1020_a:0 "§Y의석§! +18"
 lr_story.1020.b:0 "간선 도로만은 중앙이 맡는다."
 LR_tt_st_lr_story_1020_b:0 "§G경제 재건§! +2\n§Y의석§! -6"
 lr_story.1021.t:0 "외국 자본"
 lr_story.1021.d:0 "증권거래소 객장. 중개인 보조 폴 지라르는 뉴욕과 암스테르담 억양에 둘러싸여 있었다. 외국 자본이 프랑스 철도 주식을 사들였다. 제일 많이 사는 건 북부 철도였다. 릴에서 벨기에 국경까지, 대전쟁 때 군용 열차가 달리던 노선이었다.\n\n네덜란드 은행 대리인이 지라르에게 담배를 권하며 말했다. \"돈은 돈이에요. 국적 따지는 건 18세기 사고방식이죠.\" 지라르는 담배를 받았다.\n\n그날 오후 참모본부에서 재무부로 한 줄짜리 질문이 왔다는 소문이 객장에 돌았다. 전쟁이 나면 군용 열차는 누구 허락을 받고 달립니까. 지라르는 그 소문을 듣고 담배를 비벼 껐다. 반도 안 피웠다."
 lr_story.1021.a:0 "돈에 국적은 묻지 않는다."
 LR_tt_st_lr_story_1021_a:0 "§Y정부 정신§! 변화: 정치력 +1%\n§G경제 재건§! +3"
 lr_story.1021.b:0 "군용 노선만은 프랑스 손에 남겨."
 LR_tt_st_lr_story_1021_b:0 "§Y정부 정신§! 변화: 안정도 +2%, 전쟁 지지 +1%"
 lr_story.1022.t:0 "헌법 제1조"
 lr_story.1022.d:0 "속기사 오데트 랑베르는 헌법 제1조 토론 나흘째 날 펜촉을 세 번 갈았다. 쟁점은 한 글자였다. 프랑스의 왕이라고 쓸 것인가, 프랑스인의 왕이라고 쓸 것인가.\n\n앞의 것은 땅이 왕의 것이라는 뜻이었고, 뒤의 것은 왕이 국민의 것이라는 뜻이었다. 랑베르는 나흘째에야 그 차이를 이해했다. 한 의원이 외쳤다. \"한 글자 차이라고요? 그 한 글자에 주권의 주인이 바뀝니다!\"\n\n1791년 의원들도 바로 이 문장으로 밤을 새웠다. 그리고 2년 뒤, 그들 대부분이 감옥에 있었다. 랑베르는 쉬는 시간에 그 얘기를 옆자리 속기사에게 했다. 옆자리 속기사는 우리는 감옥 안 간다고, 속기사니까 했다."
 lr_story.1022.a:0 "프랑스인의 왕. 주권은 국민에게 있다."
 LR_tt_st_lr_story_1022_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%\n§Y의석§! +18"
 lr_story.1022.b:0 "프랑스의 왕. 왕관은 땅에서 나온다."
 LR_tt_st_lr_story_1022_b:0 "§Y정부 정신§! 변화: 안정도 +3%"
 lr_story.1023.t:0 "흰 깃털과 붉은 깃발"
 lr_story.1023.d:0 "생드니 운하 다리. 국민방위대 지원병 앙투안 페리에는 흰 깃털 모자를 쓰고 다리 한쪽 끝에 서 있었다. 반대쪽 끝에 붉은 깃발 시위대가 있었다. 누가 먼저 돌을 던졌는지 페리에는 보지 못했다.\n\n대장이 총검을 앞세우라고 했다. 방위대가 다리를 건넜다. 시위대가 운하로 밀려났다. 부상자가 백 명을 넘었다. 그중에 열두 살 아이가 있었다. 페리에는 그 아이를 운하에서 건져 올렸다. 아이는 그를 보고 울었다. 흰 깃털 모자 때문이었다.\n\n다음 날 의회에서 푀양파는 질서를 외쳤고 산악파는 진상 조사를 외쳤다. 방위대 지휘관은 사표 대신 훈장을 기다렸다. 지난주에 총리와 저녁을 먹은 사람이었다. 페리에는 모자를 옷장에 넣었다."
 lr_story.1023.a:0 "방위대 편이다. 다리를 건넌 건 시위대다."
 LR_tt_st_lr_story_1023_a:0 "모든 지역 §Y반발도§! -15\n§Y의석§! -6"
 lr_story.1023.b:0 "지휘관을 해임하고 조사해."
 LR_tt_st_lr_story_1023_b:0 "§Y정부 정신§! 변화: 안정도 +1%\n§Y의석§! +18"
 lr_story.1024.t:0 "상원의 첫 부결"
 lr_story.1024.d:0 "뤽상부르 궁 계단. 상원 수위 질베르 라투르는 하원 의원들이 몰려오는 걸 보고 문을 닫아야 하나 망설였다. 상원이 첫 안건으로 하원의 소득세 법안을 부결시켰다. 찬성 41, 반대 112. 상원 의원 절반은 그 세금을 가장 많이 낼 사람들이었다.\n\n백발의 상원 의원 하나가 계단 위로 나왔다. 라투르는 그 사람을 말리려다 그만뒀다. 의원은 태연했다. \"젊은이들, 뜨거운 차는 받침 접시에 따라 식혀 마시는 법이오. 열을 식히는 게 상원이 하는 일이오.\"\n\n계단 아래에서 하원 의장이 대꾸했다. \"차가 다 식으면 아무도 안 마십니다.\" 라투르는 그 말에 웃음이 나올 뻔해서 고개를 숙였다."
 lr_story.1024.a:0 "상원 손을 들어 줘. 식히는 것도 정치다."
 LR_tt_st_lr_story_1024_a:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1024.b:0 "타협안을 만들어. 세율은 낮추고 법은 통과시키고."
 LR_tt_st_lr_story_1024_b:0 "§Y정부 정신§! 변화: 안정도 +2%\n§G경제 재건§! +1"
 lr_story.1025.t:0 "2,281개의 조문"
 lr_story.1025.d:0 "국무원 회의실, 새벽 두 시. 젊은 법률 서기 앙리 마르소는 법전 초안 2,281개 조문 가운데 상속 편을 들고 있었다. 회의는 열여섯 시간째였다. 늙은 법률가들은 꾸벅꾸벅 졸았다. 통령만 눈을 부릅뜨고 있었다.\n\n통령이 마르소를 가리켰다. \"상속 조항 다시 읽어 보게.\" 마르소가 읽었다. 통령이 손을 들어 멈췄다. \"장남이 다 가져가는 나라에서 누가 공을 세우겠나?\"\n\n마르소는 셋째 아들이었다. 그는 아무 말도 하지 않았다. 이 법은 언젠가 유럽 절반이 베끼게 될 거라고 회의 전에 선배가 말했다. 마르소는 그 말이 과장이라고 생각했다. 지금은 잘 모르겠다."
 lr_story.1025.a:0 "장남 상속은 없앤다. 자식은 다 평등하다."
 LR_tt_st_lr_story_1025_a:0 "§Y정부 정신§! 변화: 의회정 지지 +1%, 안정도 +2%"
 lr_story.1025.b:0 "가장의 권위는 지킨다. 가정은 작은 국가다."
 LR_tt_st_lr_story_1025_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1026.t:0 "불로뉴 숙영지"
 lr_story.1026.d:0 "불로뉴 숙영지. 일병 장 바티스트 루는 황제가 막사 사이를 걸어오는 걸 보고 벌떡 일어났다. 황제는 병사들 이름을 불렀다. 루의 이름도 불렀다. 그리고 귀를 잡아당겼다. 아팠다. 옆 막사 사람들이 웃었다. 누가 황제 만세를 외쳤다.\n\n맑은 날이면 바다 건너 도버의 흰 절벽이 보였다. 루는 매일 아침 그 절벽을 보며 훈련했다. 저기까지 수영해서 갈 수 있느냐고 동료들끼리 내기도 했다.\n\n황제가 해변 쪽으로 가자 원수 하나가 따라가며 보고했다. 루에게도 들렸다. \"폐하, 병사는 준비됐습니다. 해협 건널 배가 없을 뿐입니다. 영국 함대는 우리 해군의 세 배입니다.\""
 lr_story.1026.a:0 "훈련은 전쟁의 절반이다."
 LR_tt_st_lr_story_1026_a:0 "§Y정부 정신§! 변화: 육군 경험치 +3%"
 lr_story.1026.b:0 "배를 지어. 건널 날은 반드시 온다."
 lr_story.1027.t:0 "첫 보통선거"
 lr_story.1027.d:0 "개표소 경비병 마르셀 루소는 아침에 중대장에게 명령을 받았다. 대통령의 명령이라고 했다. 단 하나였다. 아무것도 하지 마라.\n\n루소는 그 명령을 이해하지 못했다. 알제리에서 받은 명령은 늘 무언가를 하라는 거였다. 개표소 문 앞에 서서 하루 종일 아무것도 하지 않았다. 생각보다 힘들었다.\n\n오후에 양복 입은 남자 둘이 개표소 뒤편에서 중대장과 얘기하는 걸 보았다. 대통령 측근이라고 했다. 투표함 몇 개만 늦게 도착하면 의회가 훨씬 편해질 거라는 말이 들렸다. 아무도 모를 거라고. 중대장은 담배만 피웠다."
 lr_story.1027.a:0 "결과를 그대로 받아들인다."
 LR_tt_st_lr_story_1027_a:0 "§Y정부 정신§! 변화: 의회정 지지 +2%\n§Y의석§! +24"
 lr_story.1027.b:0 "지지 후보들을 조용히 돕는다."
 LR_tt_st_lr_story_1027_b:0 "§Y정부 정신§! 변화: 안정도 -2%\n§Y의석§! +48"
 lr_story.1028.t:0 "조합의 첫 회의"
 lr_story.1028.d:0 "로렌 제철 조합 첫 회의. 서기 이자벨 루셀은 긴 탁자 끝에 앉아 회의록을 썼다. 한쪽에는 드방델 가문 이사들, 다른 쪽에는 해산된 노조 옛 간부들. 가운데 벽에 원수의 초상이 걸려 있었다.\n\n이사 쪽은 임금 동결을 말했다. 노동자 쪽은 빵값이 두 배가 됐다고 맞섰다. 파업은 이제 불법이었다. 노동자 대표가 원수의 초상을 가리키며 물었다. \"원수님은 계급 투쟁을 끝내자고 하셨소. 그럼 누가 양보할 차례요?\"\n\n회의실이 조용해졌다. 다들 루셀을 쳐다봤다. 루셀은 그 질문을 받아 적었다. 그리고 그 아래 빈 줄을 남겨 두었다. 대답이 들어갈 자리였다."
 lr_story.1028.a:0 "사장 편이다. 질서가 먼저다."
 LR_tt_st_lr_story_1028_a:0 "§Y정부 정신§! 변화: 공장 생산량 +2%, 안정도 -1%"
 lr_story.1028.b:0 "빵값만큼은 노동자에게 양보해."
 LR_tt_st_lr_story_1028_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1029.t:0 "베레모의 노병들"
 lr_story.1029.d:0 "오베르뉴의 어느 마을, 일요일 아침. 군청 서기 레몽 셰니에는 광장에서 베레모에 훈장을 단 노병들이 원수 초상을 앞세우고 행진하는 걸 보았다. 참전용사 군단 마을 지부 창설식이었다.\n\n월요일에 지부장의 편지가 군청에 왔다. 셰니에가 뜯었다. 마을 교사가 수업 시간에 원수를 비웃었다는 내용이었다. 그리고 우체국장이 런던 방송을 듣는다고. 셰니에는 그 교사를 알았다. 자기 딸의 선생님이었다.\n\n군수가 편지를 읽고 셰니에에게 물었다. 이걸 어떻게 처리하면 좋겠느냐고. 셰니에는 대답하지 않았다. 대답할 자리가 아니었다."
 lr_story.1029.a:0 "밀고를 맡겨. 군단은 원수의 눈이다."
 LR_tt_st_lr_story_1029_a:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1029.b:0 "구호와 행진만 맡겨. 밀고는 경찰 일이다."
 LR_tt_st_lr_story_1029_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1030.t:0 "흙은 거짓말을 하지 않는다"
 lr_story.1030.d:0 "리옹역. 실직한 선반공 앙드레 무통은 기차 세 량 가운데 둘째 칸에 탔다. 역 벽에 원수의 말이 붙어 있었다. 흙은 거짓말을 하지 않는다. 무통은 흙을 만져 본 적이 없었다.\n\n도착한 마을의 농민들은 파리에서 온 사람들을 보고 고개를 저었다. 쟁기 잡는 법부터 배워야 한다고 했다. 무통은 첫날 쟁기를 잡다가 소한테 끌려 넘어졌다. 동네 아이들이 웃었다.\n\n마을 이장이 군청에 편지를 썼다. 농기계를 보내 달라고, 아니면 이 사람들이 봄까지 못 버틴다고. 무통은 그 편지를 우체국까지 들고 갔다. 가는 길에 다리가 아팠다."
 lr_story.1030.a:0 "농기계를 나눠 줘. 정신만으로는 밭이 안 갈린다."
 LR_tt_st_lr_story_1030_a:0 "§G경제 재건§! +1"
 lr_story.1030.b:0 "맨손으로 시작하게 해. 그게 정신 교육이다."
 LR_tt_st_lr_story_1030_b:0 "§Y정부 정신§! 변화: 안정도 +1%"
 lr_story.1031.t:0 "경영자 없는 장부"
 lr_story.1031.d:0 "자주 관리 공장 첫 결산 총회. 회계를 맡은 젊은 여공 쥘리 바르는 칠판에 숫자를 썼다. 사장이 가져가던 이윤이 고스란히 남았다. 맨 아래 숫자를 쓰고 돌아서니 총회장이 조용했다.\n\n공장이 생긴 이래 처음으로, 그 숫자가 누구 것인지 노동자들이 정해야 했다. 한쪽은 굶는 이웃 공장과 나누자고 했다. 다른 쪽은 낡은 기계부터 바꾸자고 했다.\n\n뒤쪽에서 늙은 선반공이 일어났다. \"우리 공장만 부자가 되면, 우리가 새 사장이 되는 거요.\" 쥘리는 분필을 든 채 서 있었다. 칠판 숫자는 그대로였다. 누가 지우기 전까지는."
 lr_story.1031.a:0 "남는 돈은 다른 공장과 나눠."
 LR_tt_st_lr_story_1031_a:0 "§Y정부 정신§! 변화: 사회주의 지지 +1%, 안정도 +2%"
 lr_story.1031.b:0 "새 기계를 산다. 공장이 살아야 나눌 것도 생긴다."
 LR_tt_st_lr_story_1031_b:0 "§Y정부 정신§! 변화: 공장 생산량 +2%"
 lr_story.1032.t:0 "검은 종대"
 lr_story.1032.d:0 "리옹 페라슈역. 철도원 피에르 고뎅은 첫 민병대 종대가 열차에 오르는 걸 보았다. 계급장이 없었다. 소매에 검붉은 완장을 찼다. 플랫폼에서 어머니들이 손을 흔들었다. 고뎅의 아들도 그 열차에 있었다.\n\n종대에는 지휘관이 없었다. 열차 안에서 손을 들어 대표를 뽑기로 했다고 했다. 고뎅은 객차 창문 너머로 그 투표를 보았다. 아들이 손을 들고 있었다.\n\n플랫폼에 서 있던 옛 하사관 하나가 고개를 저었다. 대전쟁을 겪은 사람이었다. \"총알은 투표를 안 기다려 주오.\" 고뎅은 그 사람을 돌아보았다. 기적이 울렸다."
 lr_story.1032.a:0 "대장을 뽑게 둬. 그게 우리가 싸우는 이유다."
 LR_tt_st_lr_story_1032_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.1032.b:0 "옛 하사관을 고문으로 붙여."
 LR_tt_st_lr_story_1032_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%"
 lr_story.1033.t:0 "쿠폰과 신뢰"
 lr_story.1033.d:0 "돈을 불태운 마을의 첫 겨울. 대장장이 루이 페랭은 배급표를 받고 말굽을 갈아 주었다. 빵집도 배급표로 돌았다. 처음 몇 달은 잘 굴러갔다. 페랭은 이게 될 줄 몰랐다.\n\n12월에 밀이 떨어졌다. 옆 마을에서 사 와야 했다. 옆 마을은 아직 돈을 썼다. 배급표는 받지 않았다. 페랭은 서랍 깊숙이 남겨 둔 프랑 지폐 몇 장을 꺼내 보았다. 불태우지 않고 숨겨 둔 거였다. 다른 사람들도 그랬을 거다.\n\n총회 의장이 물었다. 이웃 코뮌에 밀을 꾸어 달라고 할지, 아니면 실험을 여기서 접을지. 페랭은 지폐를 다시 서랍에 넣었다."
 lr_story.1033.a:0 "이웃 코뮌에 밀을 꾸어 달라고 하자."
 LR_tt_st_lr_story_1033_a:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1033.b:0 "실험은 접는다. 배급표를 돈처럼 쓰지."
 LR_tt_st_lr_story_1033_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1034.t:0 "징발대"
 lr_story.1034.d:0 "징발대원 앙투안 베르트랑은 붉은 완장을 차고 보스의 곡창 지대로 갔다. 서른 명이었다. 노동자와 병사가 반반이었다. 1793년에도 이랬다고 대장이 말했다. 파리의 빵값은 상한이 정해졌지만, 빵집 선반은 비어 갔다.\n\n첫 마을에서 농민들은 곡식이 없다고 했다. 베르트랑은 헛간 바닥을 두드려 보았다. 소리가 비었다. 바닥을 들추자 밀자루가 나왔다. 농부의 아내가 그걸 보고 주저앉았다.\n\n대장이 파리에 전보를 쳤다. 돈을 줄까요, 영수증을 줄까요. 베르트랑은 답을 기다리는 동안 그 농부의 아이와 마당에서 공을 찼다. 아이는 그가 누군지 몰랐다."
 lr_story.1034.a:0 "시장 가격의 절반을 줘."
 LR_tt_st_lr_story_1034_a:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1034.b:0 "영수증만 줘. 혁명이 갚을 거다."
 LR_tt_st_lr_story_1034_b:0 "§Y정부 정신§! 변화: 정치력 +2%, 안정도 -1%"
 lr_story.1035.t:0 "두 개의 깃발"
 lr_story.1035.d:0 "샹드마르스 열병식 전날 밤. 근위 연대 상사 질 오주는 막사에서 고함을 지르고 있었다. 내일 어느 깃발을 맨 앞에 세우느냐였다. 오주는 알제리에서 피 묻은 삼색기를 들고 돌아왔다. 그 깃발이 앞이어야 했다.\n\n벨빌 선반공 출신 노동자 연대 병사들은 바리케이드 위에 올랐던 붉은 깃발이 아니면 행진하지 않겠다고 했다. 누가 총검을 뽑았다. 장교들이 겨우 떼어 놓았다. 오주의 손등에 긁힌 자국이 났다. 누구 총검이었는지는 몰랐다.\n\n자정에 연대장이 통령 집무실 문을 두드리러 갔다. 오주는 막사 밖에서 담배를 피우며 기다렸다. 노동자 연대 쪽에서도 누가 나와 담배를 피웠다. 둘은 서로 쳐다보지 않았다."
 lr_story.1035.a:0 "삼색기가 앞, 붉은 깃발이 그 뒤를 따른다."
 LR_tt_st_lr_story_1035_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.1035.b:0 "붉은 깃발 하나만. 바리케이드가 먼저였다."
 LR_tt_st_lr_story_1035_b:0 "§Y정부 정신§! 변화: 사회주의 지지 +2%, 전쟁 지지 +2%"
 lr_story.1036.t:0 "자매 코뮌의 편지"
 lr_story.1036.d:0 "튈르리 우편실. 우편 담당 하사 미셸 고뱅은 국경 너머에서 온 편지를 분류하느라 하루 종일 걸렸다. 밀라노의 학생, 바르샤바의 장교, 바르셀로나의 인쇄공. 다들 같은 걸 물었다. 언제 오느냐고.\n\n바르샤바 편지 하나에는 사진이 들어 있었다. 젊은 장교 다섯이 붉은 깃발을 들고 찍은 사진이었다. 뒷면에 서툰 프랑스어로 적혀 있었다. 우리는 기다린다. 고뱅은 그 사진을 편지 더미 맨 위에 올렸다.\n\n1796년 혁명군은 이탈리아 혁명가들에게 해방을 약속하고 알프스를 넘었다. 위원회는 지금 돈을 보낼지, 대육군이 갈 때까지 기다리라고 할지 정해야 했다. 고뱅은 그 사진 속 장교들이 얼마나 기다릴 수 있을지 생각했다."
 lr_story.1036.a:0 "돈과 소총을 보내. 혁명은 기다려 주지 않는다."
 LR_tt_st_lr_story_1036_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +2%"
 lr_story.1036.b:0 "대육군이 갈 때까지 기다리라고 해."
 LR_tt_st_lr_story_1036_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1037.t:0 "레알의 뒷골목"
 lr_story.1037.d:0 "레알 시장 뒷골목. 경시청 형사 에밀 보레는 사복 차림으로 골목을 걸었다. 배급표로는 일주일에 버터 50그램이 나왔다. 여기서는 돈만 있으면 버터도 커피도 고기도 샀다. 값은 배급 가격의 열 배였다.\n\n보레는 이 골목을 알았다. 경찰은 다 알았다. 장관 부인들이 여기서 장을 본다는 것도 알았다. 오늘도 보레는 한 사람을 알아보았다. 모자를 깊이 눌러쓰고 있었다. 보레는 못 본 척 지나갔다.\n\n경시청에 돌아가자 경시총감이 물었다. \"단속할까? 단속하면 저기 장사꾼들이 굶고, 안 하면 노동자들이 들고일어나.\" 보레는 오늘 본 모자 얘기는 하지 않았다."
 lr_story.1037.a:0 "단속해. 배급은 모두에게 같아야 한다."
 LR_tt_st_lr_story_1037_a:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1037.b:0 "눈감아. 암시장 없으면 파리는 굶는다."
 LR_tt_st_lr_story_1037_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1038.t:0 "숲의 청년들"
 lr_story.1038.d:0 "그르노블 시청 징용 사무소 서기 엘렌 바스티앙은 징용 명단을 붙인 다음 날 아침 출근해서 사무실이 텅 빈 걸 보았다. 명단에 오른 청년들이 오지 않았다. 리옹과 그르노블에서 수천 명이 사라졌다.\n\n그들은 알프스와 마시프상트랄의 숲으로 들어갔다고 했다. 농부들은 그들을 마키라고 불렀다. 덤불이라는 뜻이었다. 바스티앙의 남동생도 명단에 있었다. 어젯밤 집에 들어오지 않았다. 부엌 식탁에 빵 반 덩이가 없어져 있었다.\n\n그들에게는 총도 군화도 없었다. 그날 오후 누군가 시청 뒷문으로 와서 바스티앙에게 쪽지를 건넸다. 무엇을 먼저 보낼 수 있느냐는 질문이었다. 바스티앙은 쪽지를 태웠다. 그리고 답을 생각했다."
 lr_story.1038.a:0 "옛 장교를 보내 훈련시켜."
 LR_tt_st_lr_story_1038_a:0 "§Y정부 정신§! 변화: 육군 조직력 +2%"
 lr_story.1038.b:0 "총보다 빵을 먼저 보내."
 LR_tt_st_lr_story_1038_b:0 "§Y정부 정신§! 변화: 안정도 +2%"
 lr_story.1201.t:0 "지중해를 다시 건너다"
 lr_story.1201.d_king:0 "마르세유 부두의 하역 감독 로제 파브르는 수송선 열두 척에 백합기가 올라가는 걸 보고 있었다. 이번에는 군악대가 있었다. 지난번 철수 때는 없었다.\n\n왕이 직접 왔다. 부두 끝 계단에 서서 짧게 말했다. 그 땅을 잃은 게 아니라 잠시 맡겨 두었을 뿐이고, 오늘 찾으러 간다고. 확성기 상태가 나빠서 파브르는 절반쯤 알아들었다.\n\n부두에 나온 여자들은 손을 흔들지 않았다. 파브르 옆집 여자도 거기 있었다. 그 집 큰아들은 작년 겨울 수송선을 타고 갔다가 돌아오지 않았다. 둘째가 오늘 배에 탄다. 여자는 배가 떠날 때까지 한 번도 손을 들지 않았다.\n\n노병 하나가 모자를 벗었다. 그러자 옆 사람이, 그 옆 사람이 따라 벗었다. 파브르도 벗었다. 왜 벗는지는 정확히 몰랐다."
 lr_story.1201.d_commune:0 "시청 앞 벽에 밤사이 벽보가 붙었다. 혁명은 왕의 전쟁을 끝냈다. 그런데 왜 다시 시작하는가. 아침에 출근하던 위원회 서기 마들렌 쿠르는 그 앞에서 한참 서 있었다.\n\n정오에 위원회 대변인이 바로 그 벽 앞에 나왔다. 그는 벽보를 떼지 않았다. \"동무들, 이 질문은 옳습니다. 그러니까 대답하겠습니다. 우리는 땅을 뺏으러 가는 게 아닙니다. 알제의 하역 노동자와 마르세유의 하역 노동자 사이에 왕들이 그어 놓은 선을 지우러 갑니다.\"\n\n박수는 드문드문했다. 쿠르 옆의 남자가 중얼거렸다. \"선을 지우러 가는데 총은 왜 들고 가.\" 쿠르는 대답하지 않았다. 그녀의 오빠도 원정대 명단에 있었다.\n\n벽보는 그날 밤에도 떼어지지 않았다. 다음 날 아침 그 옆에 하나가 더 붙었다. 형제들에게 빵을, 총이 아니라. 그것도 아무도 떼지 않았다."
 lr_story.1201.d_republic:0 "의회 속기사 오데트 랑베르는 자정이 넘도록 펜을 쥐고 있었다. 알제리 파병안 표결이었다. 왕정을 무너뜨린 바로 그 전쟁이었다.\n\n산악파 의원 하나가 연단에서 공화국이 왕의 깃발을 다시 드는 거냐고 외쳤다. 랑베르는 그 문장을 받아 적으면서 손이 떨렸다. 총리가 천천히 연단에 올랐다. \"왕은 그 땅을 버렸습니다. 거기 남은 사람들까지 같이요. 공화국은 그러지 않습니다.\" 짧은 연설이었다.\n\n찬성 341, 반대 269. 결과가 발표되자 박수 대신 의자 끄는 소리가 났다. 찬성한 의원 몇몇은 기자를 피해 뒷문으로 나갔다. 랑베르는 속기록 마지막 줄에 회의 종료 시각을 적었다. 새벽 한 시 십이 분."
 lr_story.1201.d_petain:0 "라디오 기술자 에밀 고티에는 방송국 유리창 너머로 원수를 보았다. 탁자 위에는 물 한 잔과 종이 한 장. 여든 살 노인은 마이크 앞에 앉아서 한동안 아무 말도 하지 않았다. 고티에는 방송 사고가 나는 줄 알았다.\n\n원수가 입을 열었다. 목소리는 떨렸지만 단어는 또렷했다. \"나는 베르됭에서 프랑스에 내 몸을 바쳤소. 이제 알제리에 질서를 바치겠소. 나는 한 번도 프랑스를 속인 적이 없소.\" 그게 거의 전부였다. 사 분짜리 방송이었다.\n\n방송이 끝나자 원수는 물을 한 모금 마시고 고티에 쪽을 보며 고개를 까딱했다. 고티에는 엉겁결에 일어나서 차렷 자세를 했다. 그날 오후 툴롱에서 수송선이 떠났다. 병사들의 가슴에는 원수 얼굴이 찍힌 배지가 달려 있었다."
 lr_story.1201.a:0 "이번에는 끝을 본다. 반란군이 무기를 내려놓을 때까지."
 LR_tt_st_lr_story_1201_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%"
 lr_story.1201.b:0 "빠르게 끝내고 사면을 약속한다."
 LR_tt_st_lr_story_1201_b:0 "§Y정부 정신§! 변화: 안정도 +2%\n모든 지역 §Y반발도§! -15"
 lr_story.1202.t:0 "라인강으로"
 lr_story.1202.d_king:0 "앙리 르클레르 중위는 새벽 네 시부터 샹드마르스에 서 있었다. 말이 자꾸 고개를 흔들었고, 장갑 속 손가락은 이미 감각이 없었다. 연대장은 일곱 시라고 했지만 왕의 차는 여덟 시 반이 되어서야 사열대 뒤에 멈췄다.\n\n왕은 생각보다 작았다. 르클레르는 왕을 가까이서 본 적이 없었다. 신문 사진 속의 왕은 늘 말 위에 있었는데, 오늘 사열대에 올라선 노인은 계단을 오르다 한 번 멈춰서 숨을 골랐다. 시종이 종이 한 장을 건넸다. 확성기가 두 번 끽 소리를 냈다.\n\n\"...1918년 조약을 근거로 북독일 연방이 요구해 온 모든 것을, 짐은 오늘부로 거부한다. 그 조약에 서명한 자들의 군대가 우리의 거부를 받아들이지 않는다면, 짐의 군대가 그것을 받아들이게 할 것이다.\"\n\n그게 다였다. 옆에 선 기수 뒤부아가 작게 물었다. \"끝이야? 저게 선전포고야?\" 르클레르는 대답하지 않았다.\n\n그의 아버지는 1918년 아르덴에서 돌아오지 않았다. 어머니는 그해 받은 전사 통지서를 지금도 성경책 사이에 끼워 두고 있었다. 르클레르는 그 종이를 딱 한 번 몰래 꺼내 읽어 본 적이 있었다. 날짜와 이름, 그리고 \"조국을 위해\"라는 인쇄된 글자가 전부였다.\n\n대열 뒤쪽 어딘가에서 누가 먼저 국왕 만세를 외쳤다. 처음에는 몇 명이었고, 곧 연병장 전체가 따라 외쳤다. 르클레르도 외쳤다. 생각보다 목소리가 컸다. 뒤부아가 그를 쳐다보며 웃었다.\n\n정오에 연대는 동역으로 행군했다. 플랫폼에는 어머니들이 나와 있었다. 르클레르는 자기 어머니를 찾지 않았다. 오지 않을 거라는 걸 알고 있었다."
 lr_story.1202.d_commune:0 "기관사 레옹 바타유는 동역 3번 플랫폼에서 열차 출발 신호를 기다리고 있었다. 기관차 굴뚝에도 화물칸 문짝에도 붉은 깃발이 걸려 있었다. 누가 걸었는지는 몰랐다. 아침에 와 보니 걸려 있었다.\n\n위원 하나가 짐수레 위에 올라섰다. 목이 쉬어 있었다. \"동무들, 이건 프랑스와 독일의 전쟁이 아닙니다! 루르의 광부는 우리 적이 아닙니다. 베를린 왕궁에서 우리 아버지들을 굶긴 놈들이 적입니다!\" 화물칸 안에서 함성이 났다.\n\n바타유는 그 연설을 반쯤 듣다가 기관실로 돌아갔다. 압력계를 봐야 했다. 그의 동생은 루르 탄광에서 일하는 독일 여자와 결혼해서 에센에 산다. 편지는 반년째 오지 않았다.\n\n신호가 떨어졌다. 바타유는 기적을 울렸다. 화물칸 문틈으로 주먹들이 튀어나왔고 누가 인터내셔널을 시작했다. 열차가 동쪽으로 움직였다."
 lr_story.1202.d_republic:0 "의회 수위 마르셀 피노는 이십 년째 팔레 부르봉 회의장 문을 지켰다. 총리가 선전포고문을 다 읽고 종이를 내려놓았을 때도 문 옆에 서 있었다.\n\n회의장이 조용해졌다. 그때 맨 뒷줄에서 누가 일어났다. 피노는 그 얼굴을 알았다. 3년 동안 총리를 제일 심하게 욕하던 야당 대표였다. 그 사람이 낮은 목소리로 노래를 시작했다. 가자, 조국의 아들들이여.\n\n처음엔 혼자였다. 피노는 저러다 망신당하겠다고 생각했다. 그런데 앞줄에서 하나가 따라 일어났고, 왼쪽에서 다섯이, 그다음엔 회의장 전체가 일어났다. 산악파도 지롱드도 푀양파도. 피노는 문 옆에서 모자를 벗었다. 수위는 노래하면 안 되는 규정이 있었다. 그는 입만 벙긋거렸다.\n\n창밖에서 신병들이 행진하는 소리가 들렸다. 발소리가 노래 박자와 맞지 않았다. 아무도 신경 쓰지 않았다."
 lr_story.1202.d_emperor:0 "황제의 부관 샤를 라살은 지도실 문 옆에 서 있었다. 원수 일곱 명이 탁자를 둘러싸고 있었고, 황제는 촛불 아래에서 지도를 내려다보고 있었다. 아무도 말하지 않은 지 오 분쯤 됐다.\n\n황제가 펜을 들어 파리에서 베를린까지 선을 하나 그었다. 곧고 짧은 선이었다. 그리고 고개를 들었다. \"대육군, 행군.\" 그게 다였다.\n\n외무장관이 선전포고문을 꺼내서 읽으려고 했다. 그런데 원수들이 벌써 모자를 집어 들고 있었다. 외무장관은 종이를 다시 접었다. 라살은 그 얼굴을 보고 웃음을 참느라 힘들었다.\n\n그날 밤 라살은 원수들의 명령서를 들고 말을 타고 다녔다. 라인강으로 가는 길마다 이미 연대가 움직이고 있었다. 병사들이 걸으면서 황제의 이름을 불렀다. 행군가 대신이었다. 라살도 모르는 사이에 따라 부르고 있었다."
 lr_story.1202.d_guardian:0 "대통령 비서 클레르 몽탕은 그날 아침 대통령이 옷장 깊숙이 넣어 두었던 군복을 꺼내는 걸 보았다. 임기 중에는 입지 않겠다고 취임식 날 약속했던 옷이었다.\n\n대통령은 군복을 의자에 걸어 두고 의회 표결이 끝날 때까지 복도에서 기다렸다. 담배를 네 개비 피웠다. 결과가 나오자 몽탕이 쪽지를 건넸다. 찬성 412. 대통령은 고개를 끄덕이고 집무실로 들어가 문을 닫았다. 다시 나왔을 때는 군복 차림이었다.\n\n\"이 전쟁이 끝나는 날 이 옷을 벗을 거요. 날짜를 적어 둬요, 몽탕 양. 내가 잊어버리면 말해 줘요.\"\n\n몽탕은 수첩을 펼쳤지만 날짜 칸을 비워 두었다. 참모본부 문이 열리자 알제리를 같이 건넌 장군들이 일제히 일어나 경례했다. 대통령은 답례하고 지도 앞에 섰다. 알제리 이후 처음이었다."
 lr_story.1202.d_petain:0 "두오몽 납골당 관리인 알베르 수샤는 아침 일찍 원수가 온다는 연락을 받았다. 바닥을 두 번 닦았다.\n\n원수는 혼자 들어왔다. 수행원들은 입구에 남았다. 유리창 너머로 13만 명의 유골이 쌓여 있었다. 이름 없는 뼈들이었다. 원수는 지팡이를 벽에 기대 세우고 모자를 벗었다. 그리고 한참 서 있었다. 수샤는 기둥 뒤에서 숨을 죽였다.\n\n원수가 뭐라고 중얼거렸다. 수샤는 다 듣지 못했다. \"...너희는 지켰다. 그런데 우리는 졌어. 이번에는...\" 그 뒤는 들리지 않았다.\n\n원수는 모자를 다시 쓰고 지팡이를 집어 들었다. 나가면서 수샤에게 바닥이 깨끗하다고 말했다. 그날 오후 라인강으로 가는 기관차 앞머리마다 납골당 마당의 흙이 한 줌씩 실렸다. 그 흙을 퍼 담은 게 수샤였다."
 lr_story.1202.d_anarchist:0 "벨빌 민중 회관에서 표결이 끝났다. 찬성 412, 반대 97. 개표를 맡은 쥘리에트 바르는 결과를 칠판에 적고 분필을 내려놓았다.\n\n반대표를 던진 늙은 인쇄공 오귀스트 페랭이 가장 먼저 일어났다. 회관 사람들이 다 그를 봤다. 페랭은 무기고 쪽으로 걸어가면서 말했다. \"나는 반대했어. 지금도 반대고. 근데 너희가 다 가는데 나만 남아서 뭐 해.\" 누가 웃었다.\n\n바르는 무기고 앞에서 소총을 나눠 주는 일을 맡았다. 페랭은 소총을 받아 들고 한참 들여다보더니 물었다. \"이거 어떻게 장전하는 거냐.\" 바르가 보여 주었다. 페랭은 두 번 만에 따라 했다.\n\n저녁에 종대가 동쪽으로 떠났다. 깃발에는 나라 이름 대신 한 문장이 적혀 있었다. 국경은 왕들이 그은 선일 뿐이다. 그 글씨를 쓴 것도 페랭이었다."
 lr_story.1202.d_red:0 "피에르 뒤랑 상병은 알제리 원정 때부터 통령 밑에 있었다. 샹드마르스에서 붉은 대육군이 끝도 없이 늘어선 걸 보니 그때 생각이 났다. 그때는 2천 명이었다.\n\n통령이 말을 타고 대열 앞을 달렸다. 한가운데에서 멈추더니 고삐를 당겼다. \"병사들이여! 너희는 헐벗었고 굶주렸다. 공화국은 너희에게 줄 것이 없다. 그러나 라인강 너머에는 왕들이 쌓아 둔 곡식과 공장이 있다. 가서 빼앗아라. 그리고 그 땅의 인민에게 돌려주어라!\"\n\n뒤랑은 그 연설을 안다. 알제의 사막에서, 사흘째 물이 떨어졌을 때 통령이 똑같이 말했다. 그때 뒤랑 옆에 서 있던 마티외는 그 다음 주에 죽었다. 뒤랑은 대열 속에서 고개를 숙였다. 옆의 신병이 왜 우냐고 물었다. 뒤랑은 먼지가 들어갔다고 했다."
 lr_story.1202.a:0 "베를린에서 보자."
 LR_tt_st_lr_story_1202_a:0 "§Y정부 정신§! 변화: 육군 사기 +2%, 전쟁 지지 +4%"
 lr_story.1202.b:0 "알자스부터다. 서두를 것 없다."
 LR_tt_st_lr_story_1202_b:0 "§Y정부 정신§! 변화: 육군 조직력 +2%, 안정도 +3%"
 lr_story.1203.t:0 "빈으로"
 lr_story.1203.d_king:0 "왕의 서기 프랑수아 뒤마는 새벽 세 시까지 왕의 서재에 있었다. 왕이 선전포고문을 직접 쓰겠다고 했다. 서기에게 받아 적게 하지 않았다.\n\n왕은 세 번 고쳐 썼다. 뒤마는 구겨진 초안 두 장을 치우면서 몰래 읽었다. 첫 장에는 부르봉과 합스부르크의 4백 년이 적혀 있었고, 둘째 장에는 1918년이, 마지막 장에는 그 둘이 다 빠져 있었다. 짧고 건조한 문서였다.\n\n왕은 봉투를 봉하고 사절에게 건네며 한마디 덧붙였다. \"마리 앙투아네트의 친정에 안부를 전하게.\" 궁정 사람 몇이 웃었다. 사절은 웃지 않았다. 왕도 웃지 않았다.\n\n뒤마는 그날 밤 구겨진 초안을 버리지 않고 자기 서랍에 넣었다. 나중에 무슨 일이 생기면 이것도 역사일 거라고 생각했다."
 lr_story.1203.d_commune:0 "파리 라디오 아나운서 이렌 코바치는 헝가리 이민 2세였다. 위원회가 그녀를 부른 건 헝가리어를 할 줄 알아서였다.\n\n밤 열한 시, 그녀는 마이크 앞에서 원고를 읽었다. 같은 원고가 체코어로, 크로아티아어로, 폴란드어로 차례로 나갔다. 민족의 감옥에 혁명이 문을 낸다. 간수는 늙었고, 열쇠는 이미 여러분 손에 있다. 문을 열라. 우리가 문밖에 와 있다.\n\n방송이 끝나고 코바치는 한참 마이크 앞에 앉아 있었다. 부다페스트에는 아직 할머니가 산다. 할머니도 라디오를 들었을까. 이불을 뒤집어쓰고 다락방에서. 그녀가 어릴 때 할머니는 늘 그렇게 금지된 방송을 들었다고 했다.\n\n기술자가 다음 방송 준비해야 한다며 그녀의 어깨를 두드렸다. 같은 시각 빈에서는 늙은 황제에게 선전포고문이 전달되고 있었다."
 lr_story.1203.d_republic:0 "총리는 연단에 낡은 종이 한 장을 가지고 올라갔다. 의원들은 처음에 그게 뭔지 몰랐다.\n\n\"1848년 빈 대학생들이 바리케이드에서 뿌린 전단입니다. 우리 대사관 문서고에 있더군요.\" 총리는 그걸 읽었다. 짧은 독일어였다. 파리가 일어서면 우리도 산다. 통역이 문장을 옮기자 회의장이 조용해졌다.\n\n\"그때 파리는 가지 않았습니다. 그 학생들은 총살당했습니다. 이번에는 우리가 갑니다. 늦었지만요.\"\n\n의원 몇이 일어났다. 박수는 생각보다 오래가지 않았다. 다들 조금 쑥스러워하는 얼굴이었다. 이튿날 르 피가로 1면 제목은 백 년 늦은 약속이었다. 총리는 그 제목이 마음에 들지 않았다. 너무 멋있었다."
 lr_story.1203.d_emperor:0 "참모 장교 오귀스탱 르노는 도나우 유역 지도를 펼쳐 놓고 핀을 꽂고 있었다. 황제가 지도실에 들어와 한참 들여다보더니 손가락으로 마을 하나를 짚었다.\n\n\"여기서 끝낸다. 겨울 오기 전에.\"\n\n르노는 몸을 숙여 지명을 읽었다. 아우스터리츠. 처음 듣는 이름이었다. 모라비아의 작은 마을이고, 인구는 천 명이 안 됐다. 르노는 황제가 왜 하필 거기를 짚었는지 몰랐다. 지도에 표시된 등고선을 보니 언덕이 하나 있긴 했다.\n\n\"이 이름 외워 둬.\"\n\n황제는 그 말만 하고 나갔다. 르노는 그날 밤 막사에서 그 이름을 몇 번 소리 내어 읽어 보았다. 아우스터리츠. 옆 침대의 동료가 그게 뭐냐고 물었다. 르노는 마을 이름이라고 했다. 동료는 다시 돌아누웠다."
 lr_story.1203.d_guardian:0 "공군 중위 마르크 샤바는 그날 밤 빈 상공을 날았다. 폭탄 대신 종이 상자를 실었다. 상자 안에는 전단 수십만 장이 들어 있었다.\n\n출격 전에 대통령이 비행장에 와서 조종사들에게 전단을 한 장씩 나눠 주었다. 독일어로 쓰여 있었다. 샤바는 독일어를 조금 읽을 줄 알았다. 우리는 당신들의 황제에게 전쟁을 선포한다. 당신들에게가 아니다. 이 전쟁이 끝나면 당신들 말로 된 헌법을 당신들 손으로 써라.\n\n\"이거 읽고 믿는 사람이 있을까요?\" 샤바가 물었다. 대통령은 웃었다. \"한 명이면 됩니다. 그 사람이 옆 사람한테 말할 테니까.\"\n\n빈 상공에서 상자를 열었다. 전단이 바람을 타고 흩어졌다. 샤바는 귀환하면서 아래를 내려다보았다. 시내 곳곳에서 손전등 불빛이 깜빡였다. 경찰이 주우러 다니는 건지, 시민이 읽는 건지는 알 수 없었다."
 lr_story.1203.d_petain:0 "참모본부 철도과 루이 바랭 소령은 원수의 선전포고문을 타자로 쳤다. 한 장짜리였다. 혁명도 해방도 민족도 없었다. 국경, 질서, 그리고 1918년의 빚. 바랭은 이렇게 짧은 선전포고문은 처음 봤다.\n\n원수는 바랭을 따로 불렀다. 알프스를 넘는 열차 시간표를 보고 싶다고 했다. 바랭이 가져간 시간표를 원수는 한 시간 동안 들여다보았다. 연필로 세 군데를 고쳤다. 두 군데는 바랭이 봐도 맞았다.\n\n\"서두르지 마시오, 소령. 서두르다 베르됭에서 다 잃을 뻔했소.\"\n\n그날 밤 알프스로 가는 첫 열차가 떠났다. 시간표대로 정확히. 병사들은 객차 창문을 열고 밤새 노래를 불렀다. 그건 시간표에 없었다."
 lr_story.1203.d_anarchist:0 "연합의 선언문을 체코어로 옮긴 건 프라하 출신 제빵사 토마시 노바크였다. 그는 파리에서 15년을 살았다. 번역은 밤새 걸렸다. 간수라는 단어를 몇 번이나 고쳤다.\n\n선언문은 짧았다. 우리는 민족의 감옥을 부수러 간다. 간수만 바꾸러 가는 게 아니다. 우리가 지나간 자리에는 황제도, 새 왕도, 위원회도 남지 않는다. 노바크는 마지막 문장을 옮기다가 웃었다. 위원회도. 연합 대회가 그 문장을 넣을지 말지로 두 시간을 싸웠다.\n\n아침에 종대가 도나우로 떠났다. 깃발은 검은색과 붉은색이었다. 노바크도 거기 있었다. 빵 굽는 화덕 대신 소총을 메고. 그는 프라하에 가면 어머니에게 제일 먼저 빵을 구워 줄 생각이었다. 15년 동안 한 번도 못 구워 드렸다."
 lr_story.1203.d_red:0 "정치위원 앙드레 뒤부아는 격문 인쇄를 맡았다. 체코어와 헝가리어 판이 각각 5만 장이었다. 포탄 상자 옆에 같이 실려 나갈 예정이었다.\n\n통령이 인쇄소에 직접 들렀다. 갓 나온 체코어 판을 한 장 집어 들고 읽는 척했다. 통령은 체코어를 모른다. 뒤부아도 모른다. \"뭐라고 쓰여 있소?\" 뒤부아가 프랑스어 원문을 읊었다. 열한 개 민족을 가둔 감옥 전체를 무너뜨린다. 간수들의 열쇠를 녹여 쟁기를 만든다.\n\n\"쟁기는 좋군. 근데 체코 농민들이 쟁기가 모자란다는 건 확실하오?\" 뒤부아는 확실하지 않았다. 통령은 웃으며 격문을 내려놓았다.\n\n붉은 대육군이 도나우로 향했다. 행렬은 사흘 동안 끊이지 않았다. 격문 상자는 첫날 다 나갔다."
 lr_story.1203.a:0 "제국을 해체한다. 민족의 감옥에 열쇠는 필요 없다."
 LR_tt_st_lr_story_1203_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%"
 lr_story.1203.b:0 "체코와 헝가리에 사절을 보낸다."
 LR_tt_st_lr_story_1203_b:0 "§Y정부 정신§! 변화: 정치력 +3%"
 lr_story.1204.t:0 "해협 건너로"
 lr_story.1204.d_king:0 "칼레 해안 포대장 앙리 마티뇽 대위는 왕이 온다는 말을 듣고 포대를 사흘 동안 칠했다. 페인트가 덜 말랐다.\n\n왕은 포대 위에 올라섰다. 맑은 날이었다. 해협 건너 도버의 흰 절벽이 보였다. 왕은 망원경도 들지 않고 그쪽을 오래 보았다. 마티뇽은 무슨 말을 해야 할지 몰라서 그냥 서 있었다.\n\n\"1918년에 배상금 장부를 들고 온 게 저기서 온 회계사들이었지.\" 왕이 말했다. 마티뇽에게 하는 말인지 혼잣말인지 알 수 없었다. \"장부를 돌려받으러 간다.\"\n\n해군 장관이 뒤에서 함대가 아직 부족하다고 말을 꺼내려 했다. 왕은 돌아보지 않았다. 마티뇽은 왕의 소매에 페인트가 묻은 걸 보았다. 말하지 않았다."
 lr_story.1204.d_commune:0 "브레스트 군항 수병 이브 르갈은 기함 포탑 아래에서 정치위원의 연설을 들었다. 런던의 귀족 의회에 선전포고한다, 맨체스터의 방적공들이여 차티스트의 깃발을 다시 들어라. 르갈은 차티스트가 뭔지 몰랐다.\n\n옆의 수병에게 물어봤다. 그 수병도 몰랐다. 결국 연설이 끝난 뒤 위원에게 직접 물었다. 위원은 반가운 얼굴로 십 분 동안 설명했다. 백 년 전 영국 노동자들이 투표권을 달라고 했다가 짓밟힌 운동이라고 했다. 르갈은 고개를 끄덕였다.\n\n닻이 올라갔다. 르갈은 갑판에서 해협 쪽을 보았다. 영국에도 자기 같은 수병이 있겠지. 그 사람들도 차티스트가 뭔지 모를 거다. 그 생각을 하니 조금 웃겼다.\n\n해협 건너에서는 아직 아무 대답이 없었다."
 lr_story.1204.d_republic:0 "의회 담당 기자 쥘 마르탱은 런던 신문을 들고 출근했다. 1면 사설 제목이 공화국끼리 전쟁이라니, 프랑스가 드디어 미쳤다였다.\n\n총리도 그 신문을 봤다. 오후 연설 때 그걸 연단에서 흔들었다. \"저들은 자기들을 공화국이라고 부릅니다. 귀족 2백 가문이 다스리고, 노동자는 투표도 못 하는 공화국을요.\" 마르탱은 받아 적다가 펜을 멈췄다. 다음 문장이 뭘지 알 것 같았다.\n\n\"이름은 같습니다. 그게 다입니다.\"\n\n의원석에서 웃음이 터졌다. 마르탱은 기사 첫 문장을 그걸로 했다. 편집장은 너무 짧다며 앞에 두 문장을 덧붙였다. 마르탱은 그게 기사를 망쳤다고 생각했다."
 lr_story.1204.d_emperor:0 "불로뉴 숙영지 해안 감시병 질베르 아르노는 황제가 망원경을 들고 해변에 서 있는 걸 두 시간째 보고 있었다. 황제는 거의 움직이지 않았다.\n\n점심때쯤 원수 하나가 다가가서 뭐라고 보고했다. 아르노는 바람 때문에 다 듣지 못했다. 황제의 대답만 들렸다. \"맑은 날 사흘. 사흘만 저 바다를 주면 된다.\"\n\n원수는 아무 말도 하지 않았다. 아르노도 수평선을 보았다. 회색 점들이 떠 있었다. 영국 함대였다. 어제보다 하나 늘었다.\n\n황제는 다시 망원경을 들었다. 아르노는 황제의 입술이 움직이는 걸 보았다. 소리는 나지 않았다. 아르노가 보기에는 사흘, 사흘, 하고 세는 것 같았다."
 lr_story.1204.d_guardian:0 "의회 의사국 직원 엘렌 바스티앙은 표결 집계표를 세 번 세었다. 여섯 표 차이였다. 해협 원정안이 통과됐다.\n\n표결 전에 대통령이 연설했다. 차분한 목소리였는데, 바스티앙은 연단을 짚은 대통령의 손등에 핏줄이 선 걸 보았다. \"나는 정복을 원하지 않습니다. 우리 아이들이 다시는 이 연단에서 이런 연설을 듣지 않기를 원합니다.\" 그 말 때문에 마음을 바꾼 의원이 몇 명인지는 모른다. 바스티앙의 계산으로는 대략 여섯 명이었다.\n\n결과를 해군성에 전화로 알린 것도 바스티앙이었다. 해군성 당직 장교는 결과를 듣더니 이미 출항 명령이 내려갔다고 했다. 표결 결과를 듣기 전에. 바스티앙은 그 말을 보고서에 적지 않았다."
 lr_story.1204.d_petain:0 "원수의 부관 레몽 드 세르는 원수가 영국 얘기를 할 때마다 표정이 굳는 걸 알았다. 대전쟁 때 영국군이 먼저 해안으로 물러나려 했던 날 얘기였다. 원수는 그 얘기를 일 년에 두세 번 했다. 매번 같은 날짜, 같은 마을 이름.\n\n그날도 원수는 그 얘기로 시작했다. 그리고 명령서를 내밀었다. 브레스트와 셰르부르에 함대를 모으라는 내용이었다. 마지막 줄은 한 단어였다. 건너가라.\n\n\"각하, 해군 장관께 따로 하실 말씀은 없으십니까?\" 드 세르가 물었다.\n\n\"없소. 섬나라 놈들은 대륙의 피로 자기 전쟁을 치렀어. 1918년엔 우리 피로 이기고 우리 금으로 배를 불렸지. 이번엔 저들 섬에서 하게 될 거요.\" 원수는 그 말을 하고 차를 마셨다. 드 세르는 명령서를 봉투에 넣었다."
 lr_story.1204.d_anarchist:0 "연합 함대 기함의 갑판장 마티아스 르보는 선원 총회에서 투표로 뽑혔다. 함장도 그렇게 뽑혔다. 출항도 투표로 정했다. 찬성 211, 반대 34, 기권 6.\n\n반대한 선원 몇이 갑판 구석에서 담배를 피우며 투덜거렸다. 영국 노동자들한테 보내는 편지를 실었으니 해안포가 안 쏠 거라는 게 말이 되냐고. 르보는 그 말에 반쯤 동의했다. 그래도 표결은 표결이었다.\n\n편지는 상륙하면 뿌릴 예정이었다. 우리는 너희 섬을 정복하러 가지 않는다. 너희 주인들을 끝내러 간다. 너희가 맞아 준다면 형제로 상륙하겠다. 르보는 그 문장을 영어로 옮기는 걸 도왔다. 형제라는 단어를 brother로 할지 comrade로 할지 한 시간을 싸웠다.\n\n닻이 올라갔다. 반대한 선원들도 다 제자리에 있었다."
 lr_story.1204.d_red:0 "통신병 에티엔 모로는 불로뉴 해안 막사에서 출항 명령서 두 장을 받아 들었다. 한 장은 선원 평의회, 한 장은 해군 장교단이 서명한 것이었다. 둘이 같은 명령서에 서명한 건 처음이라고 했다. 내용은 똑같았다.\n\n통령은 해변에서 흰 절벽을 보며 짧게 말했다. \"런던 은행가들은 백오십 년 동안 대륙의 모든 왕한테 돈을 댔다. 그 은행 닫으러 간다.\" 모로는 그걸 무전으로 함대에 그대로 보냈다. 문장이 좋아서 토씨 하나 안 고쳤다.\n\n함대가 닻을 올리자 해안의 병사들이 모자를 흔들었다. 모로는 무전기 앞을 떠날 수 없어서 막사 창문으로만 봤다. 함성은 해협 한가운데까지 들렸을 거다. 모로는 그렇게 믿었다."
 lr_story.1204.a:0 "해군을 모두 건다. 해협은 함대로 연다."
 LR_tt_st_lr_story_1204_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +3%"
 lr_story.1204.b:0 "하늘부터 빼앗는다. 함대는 그다음이다."
 LR_tt_st_lr_story_1204_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1205.t:0 "동쪽의 적"
 lr_story.1205.d_king:0 "외무부 사절 니콜라 드 모르니는 페테르부르크행 가방을 싸고 있었다. 선전포고문, 신임장, 그리고 두꺼운 털모자. 털모자는 시종이 넣었다.\n\n출발 전에 왕을 알현했다. 왕은 러시아가 대전쟁 때 프랑스와 같이 싸우고 같이 무너졌다는 얘기를 한참 했다. 그리고 차르 얘기를 했다. 왕은 차르를 두 번 만난 적이 있었다. \"짐은 옛 친구를 치러 가는 게 아니다. 그 친구를 궁에서 쫓아낸 자들을 치러 가는 거다.\"\n\n드 모르니는 고개를 숙였다. 그는 케렌스키 정부가 이십 년 가까이 버티고 있다는 것과, 러시아 농민 대부분이 차르를 그리워하지 않는다는 보고서를 읽은 적이 있었다. 그 얘기는 하지 않았다.\n\n기차는 오후 네 시에 떠났다. 털모자는 가방 맨 위에 있었다."
 lr_story.1205.d_republic:0 "외무부 러시아과 서기관 소피 르루아는 페테르부르크 두마 연설 전문을 번역하고 있었다. 케렌스키의 연설이었다.\n\n프랑스는 혁명의 어머니였다. 그 어머니가 이제 자식을 죽이러 온다. 르루아는 그 문장을 옮기면서 잠깐 손을 멈췄다. 대전쟁 때 그녀의 아버지는 러시아 원정군 연락 장교였다. 아버지는 러시아 사람들 얘기를 할 때 늘 웃었다.\n\n번역본은 그날 저녁 총리 책상에 올라갔다. 총리는 다 읽고 한 줄을 적어 의회로 보냈다. 어머니는 자식이 독재자가 되는 걸 보고만 있지 않는다. 르루아는 그 답이 연설보다 못하다고 생각했다.\n\n참모본부의 결론은 그보다도 짧았다. 눈 오기 전에 끝낸다."
 lr_story.1205.d_emperor:0 "지도 담당 장교 로베르 쿠탕스는 러시아 지도를 붙이느라 탁자 두 개를 이어 붙였다. 그래도 지도 끝이 바닥에 끌렸다.\n\n황제가 들어와 지도를 한참 보았다. 손가락으로 니에멘강에서 모스크바까지 짚어 갔다. \"다섯 주.\"\n\n원수들이 고개를 끄덕였다. 아무도 겨울 얘기를 하지 않았다. 쿠탕스는 지도 귀퉁이에 적힌 작은 글씨를 보았다. 1708년 스웨덴 카를 12세 진군로. 지도 제작소에서 옛날 판을 그대로 쓴 모양이었다. 쿠탕스는 몸으로 그 귀퉁이를 가리고 섰다.\n\n일주일 뒤 대육군이 니에멘강을 건넜다. 다리 위로 병사들이 끝없이 지나갔다. 강 건너편 숲은 조용했다. 쿠탕스는 그 조용함이 마음에 들지 않았다."
 lr_story.1205.d_guardian:0 "대통령 연설문 담당 폴 브리앙은 그날 밤새 원고를 썼다. 대통령은 아침에 그 원고를 연단까지 들고 가서는 탁자 위에 내려놓았다. 그리고 원고 없이 말하기 시작했다. 브리앙은 방청석에서 한숨을 쉬었다.\n\n\"이 전쟁만큼은 하고 싶지 않았습니다. 러시아는 우리와 같이 피 흘린 나라입니다. 그런데 동쪽이 불타는 한 이 대륙 어디에도 공화국은 안전하지 않습니다.\"\n\n브리앙이 쓴 원고보다 짧았다. 그리고 더 나았다. 브리앙은 그걸 인정하기 싫었다.\n\n연설이 끝나고 장군들이 가장 먼저 한 일은 겨울 군복 50만 벌 주문이었다. 브리앙은 그 주문서 사본을 보고 그제야 조금 안심했다."
 lr_story.1205.d_petain:0 "보급과 앙드레 루셀 중령은 원수에게 처음 불려 갔을 때 무슨 잘못을 했나 싶었다. 원수가 물은 건 겨울 군복 재고였다.\n\n루셀은 숫자를 댔다. 원수는 그걸 듣고 세 배로 늘리라고 했다. 장갑과 양말은 다섯 배. \"러시아 겨울은 숫자로 안 되오. 나는 베르됭에서 겨울을 두 번 났소. 러시아는 그보다 길어.\" 원수는 그 말을 하고 다시 서류를 보았다.\n\n그날 오후 선전포고문이 발표됐다. 원수는 케렌스키든 누구든 혁명은 늘 같은 데서 끝난다고 썼다. 단두대 아니면 독재자. 루셀은 선전포고문을 읽지 않았다. 양말 공장 세 곳에 전화하느라 바빴다."
 lr_story.1205.d_red:0 "정치위원 장 클로드 바예는 니에멘강 다리 위에서 통과하는 연대를 세고 있었다. 겨울 군복을 실은 수레가 탄약 수레보다 먼저 지나갔다. 통령의 명령이었다.\n\n통령은 지난밤 막사에서 위원들에게 말했다. \"케렌스키는 혁명을 반만 하다 말았다. 차르는 쫓아냈는데 지주는 남겨 뒀지. 우리가 나머지를 하러 간다.\" 바예는 그 말을 받아 적었다. 그리고 그 아래에 통령이 덧붙인 말도 적었다. \"그리고 이번엔 겨울 군복부터 챙긴다. 역사책 읽은 사람 하나쯤은 있어야지.\"\n\n위원들이 웃었다. 바예도 웃었다. 지금 다리 위를 지나가는 수레를 세면서 그는 다시 그 말을 생각했다. 수레는 끝이 보이지 않았다."
 lr_story.1205.a:0 "겨울 전에 끝낸다. 속도가 곧 보급이다."
 LR_tt_st_lr_story_1205_a:0 "§Y정부 정신§! 변화: 육군 사기 +3%"
 lr_story.1205.b:0 "겨울 장비부터 챙긴다. 동쪽의 겨울은 누구도 봐주지 않는다."
 lr_story.1301.t:0 "슐리펜의 길을 거꾸로"
 lr_story.1301.d_king:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n왕은 지도 위 브뤼셀에 금빛 백합 핀을 꽂는다. \"루이 14세께서 끝내 갖지 못하신 도시다. 짐이 대신 가져다 드리겠다.\" 궁정 화가는 벌써 브뤼셀 입성도의 밑그림을 그리기 시작했다."
 lr_story.1301.d_commune:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n위원회는 벨기에 탄광 노조에 전보를 보낸다. 리에주와 샤를루아의 광부들이 먼저 일어서면 붉은 연대는 해방군으로, 일어서지 않으면 그냥 군대로 들어갈 것이다. 답장은 하루 만에 왔다. 광산의 승강기가 멈췄다."
 lr_story.1301.d_republic:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n의회에서 한 의원이 묻는다. 중립국을 치는 공화국이 왕들과 무엇이 다르냐고. 총리는 암스테르담 은행들이 지난 20년 동안 누구의 전쟁에 돈을 댔는지 적힌 서류를 연단에 내려놓는다. 표결은 그 서류 한 장으로 끝났다."
 lr_story.1301.d_emperor:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n황제는 벨기에를 왕국이 아니라 데파르트망으로 부를 것이라 말한다. 스헬데강 하구의 안트베르펜는 영국의 심장을 겨눈 권총이라고. \"그 권총을 이제 내가 쥔다.\" 원수들이 웃는다. 영국 대사는 웃지 않았다."
 lr_story.1301.d_guardian:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n대통령은 선전포고문에 조건을 붙였다. 벨기에와 네덜란드는 전쟁이 끝나면 스스로 헌법을 쓴다. 프랑스군은 그 헌법이 공포되는 날 떠난다. 참모들은 그 조항이 작전을 어렵게 만든다고 불평한다. 대통령은 그 조항을 지우지 않았다."
 lr_story.1301.d_petain:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n원수는 벨기에 국왕에게 친서를 보냈다. 늙은 군인이 젊은 왕에게 쓰는 편지처럼. 저항하지 않으면 왕관은 지켜 주겠다고. 답장은 오지 않았고, 원수는 지팡이를 짚고 일어나 지도 위 리에주 요새를 가리킨다."
 lr_story.1301.d_anarchist:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n연합 대회는 벨기에로 군대보다 먼저 인쇄기를 보내기로 한다. 겐트의 부두와 리에주의 제철소에 플랑드르어와 프랑스어 전단이 쏟아진다. 국경을 넘는 종대의 깃발에는 이렇게 적혀 있다. 왕도, 은행도 없는 저지대."
 lr_story.1301.d_red:0 "참모본부 지하 지도실. 벨기에는 언제나 복도였다. 1914년 8월, 프로이센의 군화가 그 복도를 지나 파리의 문턱까지 왔다.\n\n작전국장이 그 화살표를 손가락으로 거꾸로 짚어 간다. 파리에서 브뤼셀로, 브뤼셀에서 안트베르펜로.\n\n\"그들이 왔던 길입니다. 이번에는 우리가 갑니다.\"\n\n통령은 안트베르펜 항구를 손가락으로 짚는다. \"대영제국의 상선이 대륙에 닿는 가장 가까운 항구다. 이 항구를 닫으면 런던이 굶는다.\" 붉은 대육군의 선봉이 국경으로 이동한다. 그들의 노래는 인터내셔널이다."
 lr_story.1301.a:0 "복도를 연다. 브뤼셀까지 곧장 간다."
 LR_tt_st_lr_story_1301_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +2%"
 lr_story.1301.b:0 "안트베르펜 항구부터 친다."
 lr_story.1302.t:0 "슈바르츠발트 너머"
 lr_story.1302.d_king:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n왕은 뮌헨의 비텔스바흐 왕가에 마지막 친서를 보냈다. 같은 왕끼리 프로이센의 졸개로 죽지 말라고. 답장 대신 바이에른 기병대가 라인강 쪽으로 이동했다는 보고가 들어온다. 왕은 친서의 사본을 불에 넣었다."
 lr_story.1302.d_commune:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n뮌헨과 아우크스부르크의 맥주 공장 노동자들은 대전쟁 뒤 세 번 파업했고, 세 번 왕의 기병대에 짓밟혔다. 붉은 연대의 첫 전단에는 그 세 번의 날짜가 적혀 있다. 네 번째는 다를 것이라고."
 lr_story.1302.d_republic:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n의회의 지롱드 의원 하나가 일어나 제안한다. 남독일을 정복하지 말고 공화국으로 만들자고. 슈투트가르트와 카를스루에의 자유주의자들은 1848년부터 그것을 원했다고. 총리는 그 연설문을 그대로 선전포고문 뒤에 붙인다."
 lr_story.1302.d_emperor:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n황제는 라인 연방의 지도를 펼친다. 프로이센과 오스트리아 사이에 프랑스를 섬기는 독일 군주들의 띠. \"그들에게 왕관을 주고, 대신 군대를 받는다.\" 바이에른 왕의 사촌은 벌써 파리에 와서 그 왕관을 기다리고 있다."
 lr_story.1302.d_guardian:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n대통령은 남독일 국경의 마을 주민들에게 보내는 공개 서한을 쓴다. 프랑스군은 지나갈 뿐 머물지 않는다고. 징발은 영수증으로, 숙영은 학교가 아닌 막사에서. 그 서한은 프랑스군보다 사흘 먼저 슈바르츠발트를 넘었다."
 lr_story.1302.d_petain:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n원수는 스트라스부르 대성당 앞에서 병사들을 사열한다. 알자스는 대전쟁 뒤 다시 프랑스가 되었지만, 강 건너에는 아직 같은 사투리를 쓰는 마을들이 있다. \"저 마을들에 질서를 가져다주시오. 혁명이 아니라.\""
 lr_story.1302.d_anarchist:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n연합의 선언문은 바이에른 농민들에게 보내는 것이다. 지주의 장원과 왕의 사냥터를 경작하는 사람에게. 1525년 독일 농민 전쟁의 깃발, 분트슈를 그린 전단이 숲을 넘어 마을마다 뿌려진다."
 lr_story.1302.d_red:0 "스트라스부르 대성당의 첨탑에 오르면 맑은 날 강 건너 슈바르츠발트의 검은 숲이 보인다. 뮌헨의 왕들은 대전쟁에서 베를린과 함께 싸웠다.\n\n프랑스의 사절이 숲 너머로 마지막 질문을 보낸다. 베를린과 함께 무너지시겠습니까.\n\n답장은 오지 않았다. 그날 밤 대성당 아래 광장으로 포병대가 끝없이 지나갔다.\n\n통령이 남독일 지도 위에 붉은 선을 긋는다. 뮌헨, 뉘른베르크, 슈투트가르트. \"왕궁을 무너뜨린 자리에 평의회를 세운다. 그들이 원하든 원치 않든, 그 질문은 왕들이 사라진 다음에 하겠다.\""
 lr_story.1302.a:0 "라인강을 건너 뮌헨으로 곧장 진군한다."
 LR_tt_st_lr_story_1302_a:0 "§Y정부 정신§! 변화: 육군 사기 +2%"
 lr_story.1302.b:0 "남독일 군주들에게 라인 연방의 왕관을 약속한다."
 LR_tt_st_lr_story_1302_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1303.t:0 "피레네는 없다"
 lr_story.1303.d_king:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n왕은 스페인의 왕위 분쟁을 이용하기로 한다. 마드리드의 왕도, 카를로스파의 왕위 요구자도 모두 부르봉이다. \"누가 이기든 백합이 이긴다. 다만 짐이 고른 백합이어야 한다.\" 피레네의 고갯길에 왕의 포병이 올라선다."
 lr_story.1303.d_commune:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n바르셀로나의 아나키스트들과 마드리드의 사회주의자들이 서로 다른 전보를 보내왔다. 둘 다 프랑스 코뮌의 도움을 원하지만 서로를 원하지는 않는다. 위원회는 두 전보에 같은 답을 보낸다. 국경에서 만나자."
 lr_story.1303.d_republic:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n의회는 스페인 공화파 망명자들의 증언을 듣는다. 감옥, 처형, 불탄 마을. 표결 전에 한 늙은 망명자가 방청석에서 일어나 스페인어로 무언가를 외쳤고, 아무도 통역을 청하지 않았다. 찬성표가 쏟아졌다."
 lr_story.1303.d_emperor:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n황제의 형은 이미 마드리드의 왕궁에 걸 초상화를 주문해 두었다. 외무장관이 다시 한 번 경고한다. 스페인은 들어가기는 쉬워도 나오기는 어렵다고. 황제는 대답 대신 리스본과 지브롤터에 붉은 핀을 꽂는다."
 lr_story.1303.d_guardian:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n대통령은 국경을 넘기 전에 스페인의 모든 정파에 같은 제안을 보낸다. 전쟁이 끝나면 코르테스 선거를 치르고 프랑스군은 철수한다. 카탈루냐와 바스크에는 자치를. 마드리드는 거절했고, 바르셀로나는 수락했다."
 lr_story.1303.d_petain:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n원수는 스페인의 교회와 군부에 손을 내민다. 공화파와 아나키스트에게서 스페인을 구하자고. 살라망카의 주교들이 원수를 위해 미사를 올린다. 바르셀로나의 노동자들은 국경 너머에서 오는 것이 해방군이 아님을 안다."
 lr_story.1303.d_anarchist:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n바르셀로나의 CNT가 연합에 전보를 보냈다. 피레네를 넘어오되 군대로 오지 말고 동지로 오라고. 국경을 넘는 종대는 소총과 함께 트랙터와 인쇄기를 싣고 간다. 아라곤의 마을들이 벌써 집단 농장을 세우기 시작했다."
 lr_story.1303.d_red:0 "태양왕은 손자를 마드리드로 보내며 말했다. 이제 피레네는 없다. 두 세기 반이 지났지만 산맥은 여전히 하늘을 가르고 서 있다.\n\n참모총장이 지도 위에 붉은 선을 긋는다. 바욘에서 부르고스로, 부르고스에서 마드리드로, 그리고 바다까지.\n\n\"그 말을 사실로 만들 때가 왔습니다.\"\n\n통령은 지브롤터의 바위를 지도에서 오래 바라본다. \"영국이 지중해를 쥔 열쇠다. 이베리아를 해방하면 그 열쇠도 인민의 것이 된다.\" 붉은 대육군이 페르피냥에 집결한다. 국경 너머에서 누군가 붉은 깃발을 흔든다."
 lr_story.1303.a:0 "마드리드로 곧장 간다. 수도가 무너지면 나머지도 무너진다."
 LR_tt_st_lr_story_1303_a:0 "§Y정부 정신§! 변화: 전쟁 지지 +2%"
 lr_story.1303.b:0 "카탈루냐부터 달랜다. 바르셀로나를 친구로 만든다."
 LR_tt_st_lr_story_1303_b:0 "§Y정부 정신§! 변화: 안정도 +1%"
 lr_story.1304.t:0 "알프스를 넘어"
 lr_story.1304.d_king:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n왕은 교황에게 먼저 서한을 보냈다. 맏딸의 왕국 프랑스는 로마를 지키러 가는 것이지 치러 가는 것이 아니라고. 그리고 같은 날, 사르데냐 국경의 몽스니 고개로 포병대를 보냈다. 둘 다 진심이다."
 lr_story.1304.d_commune:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n토리노의 자동차 공장 노동자들은 사르데냐 왕의 군대가 파업을 짓밟은 날을 해마다 검은 리본으로 기억한다. 위원회는 바로 그날에 맞춰 알프스를 넘기로 한다. 국경 너머의 공장들에서 사이렌이 한꺼번에 울린다."
 lr_story.1304.d_republic:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n의회의 산악파가 마치니의 편지를 낭독한다. 이탈리아는 공화국으로 하나가 되어야 한다고 쓴 백 년 전의 편지다. 네 왕을 몰아내고 로마에 공화국을. 그 연설이 끝나자 의원석에서 이탈리아어로 된 노래가 나온다."
 lr_story.1304.d_emperor:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n황제는 이탈리아를 잘 안다. 그의 조상들은 제노바 공화국의 코르시카 사람이었다. \"이탈리아는 하나의 왕국이 된다. 그리고 그 왕관은 내가 쓴다.\" 몬차 대성당에 보관된 롬바르디아의 철관을 가져오라는 명령이 내려간다."
 lr_story.1304.d_guardian:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n대통령은 네 왕국의 국민에게 보내는 서한을 쓴다. 하나가 될지, 넷으로 남을지는 여러분이 정하라고. 프랑스는 왕들만 몰아낼 뿐이라고. 참모본부는 서한의 마지막 줄을 읽고 한숨을 쉰다. 넷으로 남겠다면 어쩔 것인가."
 lr_story.1304.d_petain:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n원수는 교황령만은 건드리지 말라고 엄명한다. 그는 신앙과 질서의 프랑스를 세우려는 사람이고, 로마는 그 신앙의 심장이다. 대신 토리노와 나폴리에는 가차 없이. 몽스니 고개의 눈 속으로 산악 사단이 들어간다."
 lr_story.1304.d_anarchist:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n카라라의 대리석 채석공들은 반세기 동안 이탈리아 아나키즘의 심장이었다. 연합의 첫 종대는 그들을 향해 간다. 알프스를 넘는 길에 그들은 국경 표지석을 하나씩 뽑아 계곡에 던졌다."
 lr_story.1304.d_red:0 "한니발이 코끼리를 끌고 넘은 산맥. 프랑수아 1세가 기사들을 이끌고 넘은 산맥. 프랑스는 언제나 알프스 너머를 꿈꾸었다.\n\n몽스니 고개에서 전령이 말을 몰아 내려온다. 그의 외침이 골짜기마다 메아리친다.\n\n\"눈이 녹았습니다! 고개가 열렸습니다!\"\n\n통령이 알프스의 고개들을 하나씩 짚는다. 한니발, 프랑수아 1세, 그리고 1796년 혁명군이 넘은 길. \"그들은 이탈리아를 약탈하러 갔다. 우리는 이탈리아의 공장을 이탈리아 노동자에게 돌려주러 간다.\""
 lr_story.1304.a:0 "고개를 넘어라. 눈이 다시 오기 전에."
 LR_tt_st_lr_story_1304_a:0 "§Y정부 정신§! 변화: 육군 사기 +2%"
 lr_story.1304.b:0 "교황께는 먼저 서한을 보낸다."
 LR_tt_st_lr_story_1304_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1305.t:0 "얼음 바다로"
 lr_story.1305.d_king:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n덴마크와 노르웨이와 스웨덴의 왕들은 모두 서로의 사촌이다. 왕은 그들 모두에게 같은 편지를 보냈다. 중립은 끝났으니 프랑스 왕의 친구가 되든지 적이 되든지 고르라고. 셋 다 적을 골랐다."
 lr_story.1305.d_commune:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n스톡홀름과 오슬로의 노동조합은 유럽에서 가장 강하다. 위원회는 그들에게 총파업을 호소한다. 왕들의 군대가 프랑스 함대를 맞으러 해안으로 갈 때, 철도가 멈추고 항구가 닫히도록. 키루나 철광의 광부들이 먼저 답했다."
 lr_story.1305.d_republic:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n의회는 북유럽의 철광을 두고 표결한다. 나르비크의 철광석이 없으면 북독일의 제철소가 멈춘다고. 이상이 아니라 계산으로 시작하는 전쟁이다. 총리는 연설을 짧게 끝냈다. 철이 곧 전쟁이다."
 lr_story.1305.d_emperor:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n황제는 덴마크 해협을 지도 위에서 엄지로 누른다. \"이 해협을 쥐면 발트해는 내 호수가 된다.\" 해군 장관이 영국 함대의 위치를 보고하자, 황제는 그것을 듣고도 엄지를 떼지 않았다."
 lr_story.1305.d_guardian:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n대통령은 스웨덴 의회에 비밀 전보를 보냈다. 중립을 지키겠다면 프랑스도 스웨덴을 치지 않겠다고. 대신 철광석은 베를린이 아니라 파리로. 덴마크와 노르웨이는 이미 북독일 편에 섰다."
 lr_story.1305.d_petain:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n원수는 북해의 겨울을 걱정한다. 그는 늘 그렇듯 서두르지 않는다. 코펜하겐부터, 그다음 오슬로, 그다음 스톡홀름. 한 걸음씩. 브레스트의 해군 사령부는 원수의 일정표를 받아 보고 겨울 군복을 주문한다."
 lr_story.1305.d_anarchist:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n노르웨이의 어부 조합과 스웨덴의 벌목공 조합이 연합에 연대의 편지를 보냈다. 연합 함대의 선원 총회는 북해 원정을 만장일치로 결정했다. 함장도 투표로 뽑힌 함대가 스카게라크로 간다."
 lr_story.1305.d_red:0 "프랑스 군함이 마지막으로 스카게라크 해협에 들어간 것이 언제였는지, 해군성의 누구도 기억하지 못한다.\n\n늙은 제독이 해도 위에 몸을 숙이고 네 곳을 짚는다. 코펜하겐의 해협, 나르비크의 철광, 스웨덴의 공장, 핀란드의 숲.\n\n\"아무도 우리를 기다리지 않을 겁니다. 그래서 우리가 갑니다.\"\n\n통령은 북극권의 철광을 지도에서 짚는다. \"키루나의 철이 크루프의 대포가 된다. 그 철을 끊으면 왕들의 대포가 멈춘다.\" 붉은 함대가 브레스트를 떠난다. 갑판 위에서 수병들이 붉은 깃발을 올린다."
 lr_story.1305.a:0 "코펜하겐부터. 해협을 쥐면 발트해가 닫힌다."
 lr_story.1305.b:0 "나르비크의 철광부터. 적의 대포를 굶긴다."
 LR_tt_st_lr_story_1305_b:0 "§Y정부 정신§! 변화: 공장 생산량 +1%"
 lr_story.1306.t:0 "비스와강의 삼색기"
 lr_story.1306.d_king:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n왕은 폴란드의 귀족들에게 친서를 보냈다. 루이 15세의 장인이 폴란드 왕 스타니스와프였음을 기억하라고. 바르샤바의 왕좌가 다시 프랑스의 친구에게 돌아갈 것이라고. 크라쿠프의 귀족들이 조용히 프랑스 사절을 맞이한다."
 lr_story.1306.d_commune:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n우크라이나와 벨라루스의 농민들에게 땅은 왕보다 중요하다. 위원회의 전단에는 단 한 문장이 적혀 있다. 땅은 경작하는 자의 것. 비스와강 너머의 마을마다 그 전단이 불씨처럼 퍼져 간다."
 lr_story.1306.d_republic:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n의회는 동유럽의 작은 왕국들을 해방할 것인지, 차지할 것인지를 두고 밤새 싸운다. 결론은 타협이다. 해방하되, 프랑스와의 조약에 서명하는 정부만 인정한다. 바르샤바의 공화파들은 그 조건을 듣고 쓴웃음을 지었다."
 lr_story.1306.d_emperor:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n황제는 바르샤바 대공국의 지도를 꺼낸다. 폴란드는 황제에게 충성하는 왕국이 되고, 그 군대는 대육군의 한 축이 된다. 폴란드 망명 장교들이 파리의 카페에서 축배를 든다. 그들은 백 년 동안 이날을 기다렸다."
 lr_story.1306.d_guardian:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n대통령은 동유럽의 모든 민족에게 같은 약속을 한다. 자기 나라의 헌법을 스스로 쓰라고. 리투아니아와 폴란드는 빌뉴스를 두고, 우크라이나와 폴란드는 르비우를 두고 벌써 다투기 시작했다. 약속은 지키기보다 하기가 쉽다."
 lr_story.1306.d_petain:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n원수는 동유럽을 볼셰비즘에 맞서는 방파제로 본다. 그 왕국들의 왕관과 교회는 지키되, 북독일과 오스트리아의 꼭두각시 자리에서는 끌어내린다. 비스와강까지 가는 길은 멀다. 원수는 철도 시간표부터 다시 짠다."
 lr_story.1306.d_anarchist:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n우크라이나의 농민들은 승전국들이 세운 왕보다, 그 왕이 데려온 지주들을 더 미워한다. 연합의 전단은 왕의 이름이 아니라 지주의 이름으로 시작한다. 드니프로강 들판에서 늙은 농부들이 낫을 갈기 시작한다."
 lr_story.1306.d_red:0 "폴란드, 우크라이나, 벨라루스, 발트, 캅카스. 대전쟁의 승자들이 우리의 동맹 러시아를 찢어 세운 나라들이다. 그 왕관들은 베를린과 빈에서 빌려 쓴 것이다.\n\n외무장관이 지도 위 비스와강을 짚는다.\n\n\"삼색기가 저 강에 닿는 날, 그들은 처음으로 스스로 주인을 고르게 될 것입니다.\"\n\n통령이 러시아에서 떼어 낸 왕국들의 지도 위에 손을 펼친다. \"승전국들이 이 땅을 조각냈다. 우리는 조각을 다시 붙이지 않는다. 각자 인민 공화국이 된다.\" 붉은 대육군의 종대가 동쪽으로 향한다."
 lr_story.1306.a:0 "폴란드를 해방한다. 바르샤바가 우리 편이 된다."
 LR_tt_st_lr_story_1306_a:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1306.b:0 "곡창 지대를 노린다. 군대는 빵으로 움직인다."
 lr_story.1307.t:0 "화약고로"
 lr_story.1307.d_king:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n왕은 발칸의 왕들을 경멸한다. 저마다 다른 강대국의 돈으로 왕관을 산 사람들이라고. \"이번에는 프랑스의 돈을 받게 될 것이다. 받지 않는다면 프랑스의 대포를.\" 지중해 함대가 툴롱을 떠난다."
 lr_story.1307.d_commune:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n세르비아와 불가리아의 농민 당은 프랑스 코뮌에 같은 질문을 보냈다. 땅을 나눠 줄 것인가. 위원회의 답은 예다. 살로니카에 상륙한 붉은 연대가 가장 먼저 한 일은 지주의 토지 대장을 광장에서 불태우는 것이었다."
 lr_story.1307.d_republic:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n의회의 외교위원회는 발칸 지도 앞에서 머리를 감싸 쥔다. 어느 나라 편을 들어도 다른 셋이 적이 된다. 결국 원칙 하나로 정한다. 민족마다 제 나라를. 그 원칙이 발칸에서 얼마나 피를 불러왔는지는 아무도 말하지 않았다."
 lr_story.1307.d_emperor:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n황제는 일리리아의 지도를 펼친다. 아드리아해의 동쪽 해안은 제국의 데파르트망이 된다. 류블랴나와 자그레브와 스플리트에 제국의 법전을. 그리고 그 너머의 왕들에게는 선택권을 주지 않는다."
 lr_story.1307.d_guardian:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n대통령은 발칸 국가들 사이의 분쟁을 중재하겠다고 나선다. 프랑스군은 국경선을 긋기 위해 가는 것이지 땅을 차지하러 가는 것이 아니라고. 소피아와 베오그라드는 그 말을 믿지 않는다. 발칸에서 그런 말을 지킨 강대국은 없었다."
 lr_story.1307.d_petain:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n원수는 그리스 정교회 대주교에게 친서를 보낸다. 기독교 유럽의 질서를 위해 함께하자고. 아테네는 프랑스 편에 섰다. 소피아와 베오그라드는 그 편지의 사본을 신문에 실었다. 원수의 십자군이라는 제목으로."
 lr_story.1307.d_anarchist:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n차르의 경찰에 쫓긴 불가리아의 아나키스트들은 오래전 로도피산맥으로 숨어들었다. 연합의 종대가 살로니카에 상륙하자 그들이 산에서 내려온다. 손에는 녹슨 소총과, 새로 찍은 검붉은 깃발이 들려 있다."
 lr_story.1307.d_red:0 "대전쟁 때 세르비아와 그리스와 루마니아는 프랑스와 함께 싸웠다. 그리고 함께 졌다. 그 뒤로 스무 해, 소피아와 빈의 손이 그들의 국경을 마음대로 고쳐 그렸다.\n\n지중해 함대의 기함이 툴롱을 떠나며 기적을 길게 울린다.\n\n\"옛 전우들에게 전하라. 프랑스가 돌아왔다고.\"\n\n통령은 화약고라 불리는 반도를 지도에서 짚는다. \"왕들은 이 반도에서 서로를 물어뜯게 했다. 그 왕들을 치우면 형제끼리 싸울 이유도 사라진다.\" 붉은 함대가 살로니카로 향한다."
 lr_story.1307.a:0 "살로니카에 상륙한다. 발칸의 문을 바다에서 연다."
 lr_story.1307.b:0 "약한 쪽에 소총을 보낸다."
 LR_tt_st_lr_story_1307_b:0 "§Y정부 정신§! 변화: 정치력 +2%"
 lr_story.1308.t:0 "제9차 십자군"
 lr_story.1308.d_king:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n왕은 생루이의 이름을 꺼낸다. 십자군을 이끌다 튀니스에서 죽은 프랑스 왕이다. 레바논의 마론파 주교가 왕에게 보낸 편지에는 이렇게 적혀 있다. 프랑스 왕의 보호를 7백 년 동안 기다렸다고."
 lr_story.1308.d_commune:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n위원회는 아나톨리아의 농민과 이스탄불의 부두 노동자들에게 호소한다. 술탄의 제국은 노동자의 감옥이라고. 그러나 아랍과 쿠르드와 아르메니아의 혁명가들은 저마다 다른 깃발을 원한다. 위원회는 그 문제를 상륙 뒤로 미룬다."
 lr_story.1308.d_republic:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n의회는 오스만 제국과의 전쟁을 두고 석유를 말하는 사람과 아르메니아를 말하는 사람으로 갈라졌다. 표결은 둘 다를 위해 통과되었다. 신문들은 아르메니아를 1면에, 석유를 경제면에 실었다."
 lr_story.1308.d_emperor:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n황제는 이집트와 시리아의 지도를 꺼낸다. 그의 꿈은 늘 동방에 있었다. \"유럽은 두더지 굴이다. 위대한 제국은 언제나 동방에서 나왔다.\" 원수들은 그 말을 듣고 서로 눈짓을 나눈다. 아직 유럽도 끝나지 않았다."
 lr_story.1308.d_guardian:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n대통령은 오스만의 민족들에게 서한을 보낸다. 아랍인과 아르메니아인과 쿠르드인에게, 전쟁이 끝나면 각자의 의회를. 런던의 신문들은 강대국의 약속은 전쟁이 끝나면 잊힌다고 비웃는다. 대통령은 그 기사를 오려 집무실 벽에 붙였다."
 lr_story.1308.d_petain:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n원수는 레반트의 기독교도를 보호한다는 명분을 앞세운다. 레바논의 마론파와 시리아의 정교회 신자들. 그리고 다르다넬스. 대전쟁에서 오스만이 끝내 지켜 낸 그 해협을 이번에는 프랑스가 뚫겠다고."
 lr_story.1308.d_anarchist:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n연합의 선원 총회는 다르다넬스 원정을 두고 사흘 동안 토론했다. 술탄을 몰아내러 가는 것인가, 아니면 영국 대신 해협을 쥐러 가는 것인가. 결론은 한 줄이다. 해협은 어느 나라의 것도 아니다. 함대가 출항한다."
 lr_story.1308.d_red:0 "생루이는 십자가를 짊어지고 튀니스의 모래 위에서 죽었다. 프랑스의 왕들은 일곱 번 넘게 동방으로 떠났다. 대전쟁 뒤 오스만의 초승달은 트리폴리에서 바스라까지 펄럭인다.\n\n레바논의 산골 성당에서 마론파 사제들이 오늘도 프랑스의 이름으로 기도한다.\n\n\"다르다넬스를 뚫으면 이스탄불입니다. 그 너머는 아시아입니다.\"\n\n통령은 이스탄불의 지도를 오래 바라본다. 보스포루스, 유럽과 아시아가 맞닿는 곳. \"술탄의 궁전을 무너뜨리면 혁명은 두 대륙에 걸친다.\" 붉은 함대가 다르다넬스로, 붉은 대육군이 레반트로 향한다."
 lr_story.1308.a:0 "다르다넬스로. 해협을 뚫으면 이스탄불이다."
 lr_story.1308.b:0 "레반트에 상륙한다. 시리아의 석유가 먼저다."
