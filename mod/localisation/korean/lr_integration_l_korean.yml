l_korean:
 lr_integration.101.a:0 "모두에게 시민권을 준다. 공화국은 하나다."
 lr_integration.101.b:0 "참전 군인과 교사부터 시작한다. 차근차근 넓혀."
 lr_integration.101.t:0 "모든 시민에게 같은 표를"
 lr_integration.101.d:0 "알제의 초등학교 교사 라흐다르 부지드는 방청석 맨 앞줄에 앉아 있었다. 알제리 3개 데파르트망 편입법이 부르봉 궁에서 표결에 부쳐지는 날이었다. 그는 이 표결을 보려고 사흘 동안 배와 기차를 탔다.\n\n옆자리의 노인은 가슴에 훈장을 달고 왔다. 1916년 베르됭에서 받은 것이었다. 노인은 프랑스를 위해 싸웠지만 프랑스의 투표권은 받지 못했다. 그는 연설이 이어지는 동안 훈장을 손가락으로 계속 만지작거렸다.\n\n쟁점은 하나였다. 알제리의 무슬림 주민 수백만 명에게 본토와 같은 시민권을 줄 것인가. 알제의 콜롱 대표가 연단에 올라 그렇게 되면 유럽계 주민이 소수가 된다고 했다. 산악파 의원 하나가 1794년 국민공회가 식민지 노예제를 폐지했던 날짜를 큰 소리로 외쳤다. 장내가 웃음과 야유로 뒤섞였다.\n\n마지막으로 총리가 연단에 올랐다. \"공화국에 이등 시민은 없습니다.\" 부지드 옆의 노인이 훈장에서 손을 뗐다. 부지드는 그 말을 공책에 받아 적었다. 학생들에게 보여 줄 생각이었다. 표결은 아직 남아 있었다."
 lr_integration.102.a:0 "알제를 자유항으로 연다. 장사하다 보면 화해도 한다."
 lr_integration.102.b:0 "토착 명사들에게도 데파르트망 의회 의석을 나눠."
 lr_integration.102.t:0 "알제 상공회의소"
 lr_integration.102.d:0 "보르도 선주 협회 서기 피에르 라퐁은 알제 상공회의소 회의실 창가 자리에 앉았다. 창밖으로 알제 항구가 내려다보였다. 보르도와 마르세유의 선주들이 처음으로 알제 상인들과 같은 탁자에 앉은 날이었다.\n\n탁자 위에는 오렌지와 대추야자와 포도주의 수출 장부가 펼쳐져 있었다. 라퐁은 숫자를 맞춰 보다가 놀랐다. 알제 항구는 마르세유 다음으로 붐비는 프랑스 항구가 될 수 있었다. 누구의 항구인지만 정해진다면.\n\n지롱드 내각의 방침은 간단했다. 파리가 일일이 다스리지 않는다. 데파르트망 의회가 예산을 정하고, 항구는 상인들이 꾸린다. 문제는 그 데파르트망 의회를 누구의 표로 뽑느냐였다. 콜롱 대표와 토착 명사 대표가 회의 내내 서로를 보지 않았다.\n\n점심때 토착 명사 쪽의 늙은 무역상이 라퐁에게 민트 차를 따라 주며 물었다. 보르도에서는 항구 일을 누가 정하느냐고. 라퐁은 돈 내는 사람이 정한다고 대답했다. 무역상은 웃으며 자기도 세금을 낸다고 했다. 도지사는 그날 밤 파리의 답을 기다리며 전보를 쳤다."
 lr_integration.103.a:0 "명부대로 간다. 재산이 곧 책임이다."
 lr_integration.103.b:0 "맨 뒷장의 이름들도 앞으로 올려."
 lr_integration.103.t:0 "납세자의 알제리"
 lr_integration.103.d:0 "총독 관저 의전관 쥘 마르샹은 무도회 초대 명단을 세 번 고쳐 썼다. 포도원 지주와 은행가, 그리고 몇 명의 토착 대가문 대표. 푀양파의 방식대로 세금을 많이 내는 사람이 데파르트망을 다스릴 것이었다. 명단의 순서가 곧 의석의 순서였다.\n\n무도회 중간에 마르샹은 구석에 선 노인 하나에게 샴페인을 권했다. 노인은 물을 청했다. 그의 집안은 오스만 시절부터 콩스탕틴을 다스렸다. 지금은 그 도시 세금의 3분의 1을 냈다. 그러나 마르샹의 명단에서 그의 이름은 맨 뒷장에 있었다. 그 명단을 쓴 사람이 마르샹이었다.\n\n명부대로 가면 결과는 뻔했다. 의석의 9할이 콜롱 지주들의 몫이었다. 노인은 물잔을 비우고 마르샹에게 고맙다고 한 뒤 일찍 돌아갔다. 문까지 그를 배웅한 사람은 마르샹 하나였다.\n\n자정이 넘어 총독이 마르샹을 서재로 불렀다. \"토착 대가문의 몫을 조금 늘려 줄까? 그들이 반란을 막아 줄 수도 있지.\" 마르샹은 맨 뒷장을 펼쳐 총독 앞에 놓았다."
 lr_integration.104.a:0 "결과대로 따른다. 공화국은 강요하지 않는다."
 lr_integration.104.b:0 "투표는 조금 미룬다. 학교와 병원부터 짓자."
 lr_integration.104.t:0 "대통령의 질문"
 lr_integration.104.d:0 "오랑 근교 마을의 투표소 관리인 하미드 세르다니는 새벽부터 투표함 옆에 서 있었다. 투표함은 콘크리트 블록 위에 놓였고, 옆에는 아랍어와 프랑스어로 된 안내문이 붙었다. 투표용지에는 질문이 하나뿐이었다. 프랑스 공화국의 시민이 되겠습니까.\n\n세르다니의 마을에서는 사람들이 해 뜨기 전부터 줄을 섰다. 오후에 군청에서 온 전화로는 옆 계곡 마을에 아무도 오지 않았다고 했다. 그 마을 이맘이 금요 예배에서 무슨 말을 했다는 소문이었다.\n\n대통령은 알제리에서 군 생활을 시작했고 그곳에서 이름을 얻었다. 그는 칙령 대신 투표를 택했다. 신문에는 장군들이 결과가 나쁘면 어떻게 하느냐고 물었다는 기사가 실렸다. 대통령의 대답도 실렸다. \"그렇다면 우리가 틀린 것이지.\"\n\n해 질 무렵 투표함을 봉인하던 세르다니에게 노인 하나가 뛰어왔다. 아들의 투표용지를 대신 넣으러 왔다고 했다. 아들은 마르세유의 공장에 있었다. 세르다니는 규칙상 안 된다고 했다. 노인은 그 자리에 서서 봉인이 끝날 때까지 투표함을 보았다."
 lr_integration.105.a:0 "코뮌의 일부로 편입한다. 노동자에게 국경은 없다."
 lr_integration.105.b:0 "알제가 스스로 정하게 해. 연방으로 묶는다."
 lr_integration.105.t:0 "카스바의 붉은 깃발"
 lr_integration.105.d:0 "알제 부두의 기관사 마르셀 오베르는 하역 창고에서 열린 노동자 평의회 첫 총회에 나갔다. 아랍인 하역 노동자와 프랑스인 기관사가 같은 총회에서 손을 드는 것은 처음이었다. 오베르는 자기 손이 옆의 하역부 손보다 늦게 올라가는 것을 느꼈다.\n\n총회장 벽에는 파리 코뮌 포스터 옆에 아랍어 구호가 나란히 붙었다. 땅은 경작하는 자에게. 어느 쪽이 먼저 붙었는지를 두고 첫날부터 말다툼이 났다. 오베르는 아랍어를 읽을 줄 몰랐다. 옆의 하역부 유세프가 뜻을 알려 주었다. 그건 나도 찬성이라고 오베르가 말하자 유세프가 웃었다.\n\n파리 위원회의 사절이 연단에 올라 두 가지 길을 내놓았다. 알제리를 코뮌의 일부로 편입하거나, 알제리 사회주의 공화국을 세워 코뮌과 연방을 맺거나.\n\n총회장 뒤편에서 유세프가 손을 들고 일어섰다. \"식민지를 해방하러 왔다면서, 또 파리가 정하는 거요?\" 장내가 조용해졌다. 사절은 수첩을 덮고 유세프를 보았다. 오베르는 자기도 모르게 유세프 옆으로 반걸음 다가섰다."
 lr_integration.106.a:0 "벨기에 전체를 하나의 코뮌으로 받는다."
 lr_integration.106.b:0 "플랑드르에는 자기 말로 다스리는 코뮌을 준다."
 lr_integration.106.t:0 "샤를루아의 광부들"
 lr_integration.106.d:0 "파리 위원회 사절 앙리 쿠르베는 샤를루아 탄광의 갱도 입구에 섰다. 광부 평의회가 코뮌 합류를 만장일치로 결의한 다음 날이었다. 갱도 입구마다 붉은 깃발이 꽂혀 있었다.\n\n늙은 광부 하나가 깃발 하나를 내려 무릎 위에 놓고 바느질을 하고 있었다. 쿠르베가 다가가 보니 붉은 천 한구석에 작은 노란 사자를 꿰매 넣고 있었다. 플랑드르의 사자였다. 노인은 고개를 들지 않고 말했다. 자기 어머니가 겐트 사람이었다고. 쿠르베는 아무 말도 하지 못했다.\n\n그날 오후 안트베르펜에서 소식이 왔다. 플랑드르 부두 노동자들이 망설인다는 것이었다. 그들은 혁명을 원했다. 그러나 파리의 프랑스어 위원회가 자기들을 다스리는 것은 원하지 않았다.\n\n쿠르베는 파리에 보고서를 썼다. 벨기에를 한 덩어리로 받을 것인가, 두 코뮌으로 받을 것인가. 그는 보고서 끝에 노란 사자 이야기를 덧붙였다가 지웠다. 그리고 다시 썼다."
 lr_integration.107.a:0 "시계 공장을 국가 계획에 넣는다. 정밀 기계는 혁명의 무기다."
 lr_integration.107.b:0 "조합은 그대로 둔다. 시계공은 스스로 시간을 맞춘다."
 lr_integration.107.t:0 "시계공들의 총회"
 lr_integration.107.d:0 "라쇼드퐁의 시계공 에밀 자케는 조합 총회장에 할아버지의 공구 상자를 들고 왔다. 60년 전 이곳 시계공들은 국제노동자협회에서 가장 급진적인 지부를 꾸렸다. 할아버지도 그중 하나였다. 오늘 그 손자들이 코뮌 합류를 투표했다.\n\n총회장 한쪽 벽에 수백 개의 시계가 걸려 있었다. 모두 마을 공방에서 만든 것이었고, 모두 정확히 같은 시각을 가리켰다. 자케는 매주 월요일 그 시계들을 맞추는 당번이었다. 시계공들은 그것이 자기들이 서로를 믿는 방식이라고 말했다.\n\n스위스 연방은 이미 괴뢰국이 되었고 쥐라는 프랑스의 일부가 되었다. 총회 막바지에 자케가 일어서서 파리에서 온 사절에게 물었다. \"우리 조합은 이제 계획위원회의 지시를 받게 됩니까?\"\n\n사절은 대답을 망설였다. 그 사이 벽의 시계들이 정각을 쳤다. 수백 개가 정확히 같은 순간에 울렸다. 사절은 그 소리가 끝날 때까지 입을 열지 못했다."
 lr_integration.108.a:0 "찬성한 코뮌만 받는다. 연합은 자발적이다."
 lr_integration.108.b:0 "반대한 코뮌과도 무역하고 서로 지켜 준다."
 lr_integration.108.t:0 "리에주의 가입 투표"
 lr_integration.108.d:0 "리에주 민중 회관의 서기 조르주 르메르는 사흘 밤낮 손을 셌다. 벨기에 각지의 코뮌 대표들이 프랑스 자유 코뮌 연합에 가입할지 투표하는 자리였다. 연합은 아무도 강제로 받아들이지 않았다. 원하는 코뮌만 들어왔다.\n\n투표는 손을 들어 했다. 회관은 사흘 내내 문을 열어 두었고, 투표하러 온 광부들은 회관 바닥에서 외투를 덮고 잤다. 르메르는 모든 손을 셌다. 한 번도 틀리지 않았다. 셋째 날 새벽에는 그의 손이 떨려 옆 사람이 연필을 깎아 주었다.\n\n왈롱의 광산 코뮌들은 거의 모두 찬성했다. 플랑드르의 농촌 코뮌들은 절반이 반대했다. 반대한 코뮌 대표 하나가 투표가 끝나고 르메르에게 다가와 악수를 청했다. 다음 해에 다시 투표하자고 했다.\n\n연합 서기국에는 결정할 권한이 없었다. 각 코뮌의 결정을 기록할 뿐이었다. 르메르는 마지막 장에 집계를 적고 펜을 놓았다. 그리고 반대한 코뮌들의 이름 옆에 작은 글씨로 내년이라고 적어 두었다."
 lr_integration.109.a:0 "연합의 고향이 돌아왔다. 환영한다."
 lr_integration.109.b:0 "시계공들에게 정밀 기계를 부탁해."
 lr_integration.109.t:0 "생티미에의 귀환"
 lr_integration.109.d:0 "생티미에의 시계공 루이 지라르는 여든한 살이었다. 1872년, 그가 젖먹이였을 때 이 작은 마을에서 반권위주의 인터내셔널이 세워졌다. 바쿠닌이 마지막 연설을 한 곳도 여기였다. 지라르의 할아버지는 그 연설장의 의자를 날랐다.\n\n60년이 지나 쥐라 연합의 마을들이 프랑스 자유 코뮌 연합 가입을 투표했다. 지라르는 지팡이를 짚고 총회장에 들어왔다. 겨드랑이에는 둘둘 만 검은 천이 끼워져 있었다. 할아버지가 쓰던 깃발이었다. 좀이 먹어 구멍이 세 개 나 있었다.\n\n투표는 한 시간 만에 끝났다. 반대는 둘이었다. 지라르는 깃발을 펼쳐 총회장 벽에 걸었다. 젊은 시계공들이 박수를 쳤다. 지라르는 박수가 그칠 때까지 깃발 앞에 서 있었다.\n\n\"우리 할아버지들이 시작한 걸, 이제야 끝내는구먼.\" 그는 그렇게 말하고 의자에 앉았다. 그날 밤 그는 공방에 나가 반쯤 만들다 둔 회중시계를 끝까지 조립했다."
 lr_integration.110.a:0 "외인부대를 산에 보낸다. 총과 쟁기를 같이 들려서."
 lr_integration.110.b:0 "반란 가담자를 사면하고 토착 부대를 만든다."
 lr_integration.110.t:0 "총독 관저의 장군"
 lr_integration.110.d:0 "총독 부관 레몽 바스티앙 대위는 장군의 취임 선서를 관저 연회장 뒤편에서 지켜보았다. 민간인 총독은 없었다. 반란을 겪은 땅은 군대가 다스린다는 것이 왕의 방침이었다.\n\n장군의 집무실 창밖으로 카스바의 하얀 골목이 보였다. 반란 때 그 골목에서 장군의 부하 서른 명이 죽었다. 바스티앙도 그때 거기 있었다. 장군은 그 골목을 집무실 지도에 붉은색으로 칠해 두었다. 바스티앙이 칠을 했다.\n\n첫 보고서는 바스티앙이 썼다. 카스바에는 아직 무기가 숨겨져 있고, 산악 지대에는 반란군 잔당이 있다. 장군은 보고서 끝에 자기 손으로 한 줄을 덧붙였다.\n\n\"폐하, 외인부대 정착촌을 산악 지대에 세우면 10년 안에 조용해질 겁니다.\" 바스티앙은 그 문장을 정서하면서, 십 년이면 자기 아들이 입대할 나이라는 것을 떠올렸다."
 lr_integration.111.a:0 "프랑스군에 받아들인다. 그들도 이제 왕의 병사다."
 lr_integration.111.b:0 "무장을 풀고 연금을 준다. 진 쪽에도 체면은 있다."
 lr_integration.111.t:0 "브뤼셀의 군정 장관"
 lr_integration.111.d:0 "군정 장관 비서 클로드 데샹은 브뤼셀 왕궁의 집무실에서 벨기에군 장교 명단을 정리했다. 벨기에 왕가는 런던으로 떠났고, 그 자리에 프랑스 군정 장관이 앉았다. 오를레앙의 왕은 벨기에를 1914년 독일군이 지나간 복도가 아니라 프랑스의 방패로 만들겠다고 선언했다.\n\n명단은 4천 명이었다. 절반은 왈롱 사람, 절반은 플랑드르 사람이었다. 그리고 그들 모두 프랑스군을 상대로 사흘 동안 리에주 요새를 지켰다. 데샹의 형은 그 사흘 동안 리에주 앞에서 다리에 총을 맞았다.\n\n왈롱 사람들은 대체로 새 질서를 받아들였다. 플랑드르 사람들은 거리에 프랑스어 표지판이 걸리는 것을 말없이 지켜보았다. 데샹이 묵는 하숙집 주인도 그랬다. 아침마다 커피를 내오면서 한마디도 하지 않았다.\n\n군정 장관이 명단을 받아 들고 물었다. 이 사람들을 어떻게 하면 좋겠느냐고. 데샹은 형의 다리를 떠올렸다. 그리고 리에주 요새를 사흘 지킨 사람들이라면 좋은 병사일 거라고 대답했다."
 lr_integration.112.a:0 "요새부터 짓는다. 이 산맥이 프랑스의 성벽이다."
 lr_integration.112.b:0 "시계 공방에 군수 주문을 준다."
 lr_integration.112.t:0 "산맥의 요새"
 lr_integration.112.d:0 "공병 중사 앙투안 마티유는 쥐라산맥 고갯마루에서 포대 기초를 팠다. 스위스 국경이었던 능선이었다. 이제 이 산맥은 국경이 아니라 프랑스의 안쪽이었다.\n\n고갯마루의 옛 국경 초소에는 스위스 십자기가 그려진 표지판이 아직 서 있었다. 소대장은 뽑으라고 했다. 마티유는 뽑는 대신 그 위에 백합을 덧칠했다. 페인트가 모자라서였다. 그런데 비가 오자 십자가가 다시 비쳐 보였다. 마을 아이들이 그것을 보러 고개까지 올라왔다.\n\n산 아래 시계 마을 사람들은 포대 공사보다 시계 주문이 끊길까 더 걱정했다. 스위스 은행들이 거래를 끊었기 때문이다. 마티유가 묵는 집 주인은 공방 선반에 다 만든 시계를 쌓아 놓고 있었다. 팔 데가 없었다.\n\n공병 사령관이 순시를 와서 마티유에게 물었다. 요새를 먼저 짓는 게 맞겠느냐, 마을부터 달래는 게 맞겠느냐. 마티유는 백합 아래로 비쳐 보이는 십자가를 가리켰다."
 lr_integration.113.a:0 "산악병으로 받아들인다. 알프스는 그들이 제일 잘 안다."
 lr_integration.113.b:0 "근위대는 해산하고, 귀족들에겐 연금을 준다."
 lr_integration.113.t:0 "토리노의 왕궁"
 lr_integration.113.d:0 "군정 장관 부관 마르크 뒤부아 중위는 토리노 왕궁 계단에서 그 일을 직접 보았다. 사르데냐 왕가의 문장이 내려지고 백합기와 삼색기가 함께 걸린 날이었다. 사부아는 백사십 년 만에 다시 프랑스 땅이 되었고, 알프스 너머 피에몬테까지 왕의 땅이 되었다.\n\n계단 중간에서 사르데냐의 늙은 근위병 하나가 뒤부아에게 경례를 거부했다. 헌병이 그를 끌고 갔다. 근위병은 끌려가면서 피에몬테 사투리로 무언가를 외쳤다. 구경하던 시민들이 박수를 쳤다. 뒤부아는 그 말을 알아듣지 못했다. 나중에 통역에게 물으니 왕의 이름이라고 했다.\n\n토리노의 귀족들은 프랑스어를 할 줄 알면서도 이탈리아어로만 대답했다. 뒤부아는 사흘 동안 통역 없이는 저녁 식사 자리에서 한마디도 할 수 없었다.\n\n넷째 날 군정 장관이 물었다. 사르데냐 왕가의 근위대를 어떻게 할까. 뒤부아는 그 늙은 근위병이 지금 헌병대 영창에 있다고 보고했다. 그리고 그가 대전쟁 때 알프스 산악 부대에 있었다는 기록도 함께 올렸다."
 lr_integration.114.a:0 "강을 따라 요새선을 쌓는다. 라인강은 다시 건너지 못한다."
 lr_integration.114.b:0 "독일인 시장들은 그대로 둔다. 충성 서약만 받아."
 lr_integration.114.t:0 "라인강이 국경이다"
 lr_integration.114.d:0 "공병 대령 알베르 지로는 코블렌츠 요새 다리 위에서 왕의 뒤에 섰다. 강 건너편에는 라인 연방의 깃발이 걸려 있었다. 리슐리외 이래 프랑스 장군들은 라인강을 자연 국경이라 불렀다. 오를레앙의 왕은 그 말을 사실로 만들었다.\n\n다리 아래로 석탄 바지선이 지나갔다. 루르의 석탄이 로렌의 제철소로 가는 배였다. 지로는 설계도 여백에 연필로 적었다. 요새는 강을 지키고, 강은 석탄을 지킨다. 적고 나니 좀 거창한 것 같아서 지우개를 찾았는데 없었다.\n\n왕은 다리 난간에 손을 얹고 오래 강을 보았다. 바지선 선원 하나가 왕을 알아보고 모자를 흔들었다. 독일인이었다. 왕은 손을 들어 답했다.\n\n\"이 강을 다시는 적군이 건너지 못하게 하라.\" 왕이 돌아서며 말했다. 지로는 그날 밤 요새 설계도를 다시 펼쳤다. 여백의 그 문장은 그대로 두었다."
 lr_integration.115.a:0 "선교회와 학교를 같이 보낸다."
 lr_integration.115.b:0 "모스크와 이슬람 법정은 왕의 이름으로 지켜 준다."
 lr_integration.115.t:0 "왕령 알제리"
 lr_integration.115.d:0 "알제 대성당 성구 관리인 프랑수아 비달은 미사 전날 밤새 은촛대를 닦았다. 대주교가 알제리를 왕의 직할령으로 선포하는 미사였다. 1830년 샤를 10세가 처음 이 땅을 정복했을 때처럼, 왕의 이름과 십자가가 함께 들어오는 날이었다.\n\n미사가 끝나자 대성당 앞 광장에서 대주교가 알제의 무프티와 짧게 악수했다. 비달은 문간에서 그것을 보았다. 사진 기자들이 셔터를 눌렀다. 두 사람 다 카메라를 보지 않았다. 악수는 정확히 세 번 흔들고 끝났다.\n\n그날 저녁 왕실 고해 신부가 비달에게 제의실 열쇠를 받으러 왔다. 신부는 걱정스러운 얼굴이었다. 파리에서 무슬림 주민들에게 선교회를 보내자는 이야기가 나온다고 했다. 그러면 반란이 다시 날 수도 있다고.\n\n비달은 이 성당에서 서른 해를 일했다. 그동안 광장 건너편 모스크의 무에진과 아침마다 인사를 나누었다. 그는 신부에게 그 이야기를 할까 하다가, 열쇠만 건넸다. 결정은 왕이 할 일이었다."
 lr_integration.116.a:0 "벨기에 귀족에게 프랑스 작위를 준다. 귀족은 귀족을 안다."
 lr_integration.116.b:0 "왈롱 탄광에 왕실 구호 기금을 보낸다. 빵이 먼저다."
 lr_integration.116.t:0 "부르고뉴의 꿈"
 lr_integration.116.d:0 "궁정 서기관 에두아르 드라크루아는 브뤼셀 대광장에서 왕의 칙령을 낭독했다. 15세기 부르고뉴 공작들의 길드 회관 앞이었다. 부르봉 왕가는 이 땅이 옛 부르고뉴의 유산이라고 주장했다. 칙령 문구를 다듬은 사람이 드라크루아였다.\n\n길드 회관 지붕의 황금 장식이 햇빛에 반짝였다. 15세기에 이 광장은 유럽에서 가장 부유한 곳이었다. 왕은 그 시절을 되살리겠다고 약속했다. 낭독이 끝나자 박수가 나왔다. 앞줄은 크게, 뒷줄은 드문드문 쳤다.\n\n그 주에 드라크루아는 벨기에 각지를 돌았다. 플랑드르의 사제들은 같은 가톨릭 왕을 반겼다. 어느 시골 신부는 그에게 직접 담근 맥주를 대접했다. 왈롱의 탄광촌에서는 노동자들이 왕보다 빵을 물었다. 드라크루아는 거기서는 맥주를 얻어 마시지 못했다.\n\n브뤼셀로 돌아오자 궁정 대신이 물었다. 벨기에 귀족들에게 프랑스 작위를 주는 게 어떻겠느냐고. 드라크루아는 탄광촌에서 받아 적은 빵값을 대신 앞에 내밀었다."
 lr_integration.117.a:0 "신앙의 자유를 보장한다. 낭트 칙령을 다시 쓴다."
 lr_integration.117.b:0 "가톨릭 학교를 세운다. 아이들은 프랑스어로 기도할 것이다."
 lr_integration.117.t:0 "산맥의 주"
 lr_integration.117.d:0 "브장송 대성당의 주교 비서 장 마리 콩테는 미사 내내 성당 뒤쪽을 신경 썼다. 프랑슈콩테의 귀족들과 새로 편입된 쥐라 마을 대표들이 함께 드리는 미사였다. 루이 14세가 프랑슈콩테를 얻은 지 260년, 이제 산맥 반대편도 같은 왕의 땅이었다.\n\n쥐라 대표들은 성당 맨 뒤에 앉았다. 성호를 긋지 않았다. 대부분 개신교도였다. 미사가 끝나자 그들은 성당 밖으로 나가 자기들끼리 시편을 불렀다. 칼뱅의 시편이었다. 콩테는 주교가 성당 계단에서 그 노래가 끝날 때까지 기다리는 것을 보았다. 주교는 노래의 마지막 절에서 입술을 조금 움직였다.\n\n그날 오후 쥐라 대표 하나가 콩테를 찾아왔다. 왕이 그들에게 성당을 강요할 것인지 물었다. 콩테는 대답할 수 없었다. 대표는 1685년 낭트 칙령이 폐지되던 해에 자기 조상이 제네바로 달아났다고 했다.\n\n저녁에 주교가 콩테를 불렀다. \"개신교 교회를 어떻게 하면 좋겠나.\" 콩테는 낮에 들은 1685년 이야기를 했다."
 lr_integration.118.a:0 "혼인을 성사시킨다. 칼보다 반지가 오래간다."
 lr_integration.118.b:0 "사부아 가문은 망명시킨다. 한 땅에 두 주인은 없다."
 lr_integration.118.t:0 "사촌들의 혼인"
 lr_integration.118.d:0 "사부아 가문 공주의 시녀 루치아 페레로는 그날 오후 토리노 왕궁 정원에서 공주를 멀찍이 따라 걸었다. 공주는 열아홉 살이었다. 그녀는 자기 혼담 이야기를 아침 신문에서 처음 읽었다.\n\n사르데냐 왕국은 무너졌지만 사부아 가문은 부르봉 왕가와 수백 년 동안 혼인으로 얽혀 있었다. 왕의 제안은 그것을 이용하는 것이었다. 사부아 공주를 부르봉 왕자와 혼인시키고, 그 자녀에게 피에몬테 공작 칭호를 준다. 땅은 프랑스의 것이지만 이름은 남겨 둔다.\n\n공주는 분수 앞에서 한참 서 있었다. 페레로가 다가가자 공주가 물었다. 그 왕자를 본 적이 있느냐고. 페레로는 사진으로만 보았다고 했다. 키가 크다고 했다. 공주는 그거면 됐다며 웃었다. 페레로는 그 웃음이 울음 직전의 것이라는 걸 알았다.\n\n그날 밤 토리노의 귀족들이 처음으로 프랑스 군정 장관의 만찬에 참석했다. 그들은 처음으로 프랑스어로 대답했다. 페레로는 공주의 방에서 그 웃음소리를 들었다."
 lr_integration.119.a:0 "교황청과 상의해 독일인 대주교를 세운다."
 lr_integration.119.b:0 "프랑스인 대주교를 보낸다. 라인강 서안은 프랑스다."
 lr_integration.119.t:0 "선제후들의 성당"
 lr_integration.119.d:0 "쾰른 대성당 종지기 하인리히 포겔은 그날 아침 첨탑 아래에서 프로이센 독수리가 내려지는 것을 보았다. 쌍둥이 첨탑은 6백 년 동안 지어졌다. 그것을 완공시킨 것은 프로이센이었다. 그 뒤로 독수리가 첨탑 아래 걸려 있었다.\n\n신성로마제국이 무너진 뒤 쇠락했던 옛 대주교 선제후의 땅이 프랑스 왕의 보호 아래 들어왔다. 부르봉 왕은 이 땅의 가톨릭 주민들에게 프로이센의 개신교 관리들이 아니라 가톨릭 왕이 왔다고 말했다. 포겔의 본당 신부는 그 말을 듣고 오랜만에 웃었다.\n\n포겔은 독수리가 내려진 자리에서 녹슨 볼트 네 개를 뽑아냈다. 그것을 주머니에 넣었다. 아버지가 그 볼트를 박는 것을 도왔다고 했기 때문이다.\n\n오후에 프랑스 궁정 대신이 대성당을 찾아와 대주교 공관을 둘러보았다. 대주교 자리는 비어 있었다. 대신은 수행원에게 물었다. 쾰른 대주교를 누구로 앉히는 게 좋겠느냐고. 포겔은 종탑 계단에서 그 말을 들었다."
 lr_integration.120.a:0 "참전 노병들에게 시민권과 땅을 준다."
 lr_integration.120.b:0 "농민 조합을 세우고 콜롱 지주들에게 맡긴다."
 lr_integration.120.t:0 "원수의 알제리"
 lr_integration.120.d:0 "참전용사 군단 알제리 지부의 서기 사이드 메지안은 시청 광장 연단 아래서 명단을 들고 서 있었다. 원수의 초상이 걸린 연단 앞에서 알제리 지부가 창설되는 날이었다. 대전쟁에서 프랑스를 위해 싸운 알제리 출신 노병들이 맨 앞줄에 섰다.\n\n앞줄의 노병 하나는 한쪽 다리가 없었다. 베르됭에서 잃었다. 그는 목발을 짚고 서서 원수의 초상에 경례했다. 메지안은 명단에서 그의 이름을 찾아 표시했다. 시민권란은 비어 있었다. 그는 아직 프랑스 시민이 아니었다.\n\n총독이 연설했다. 원수는 알제리를 국민 혁명의 모범으로 만들겠다고 했다고. 노동, 가족, 조국. 노병들은 박수를 쳤다. 목발 짚은 노병은 박수를 칠 수 없어서 목발로 땅을 두 번 쳤다.\n\n행사가 끝나고 총독이 메지안의 명단을 넘겨보았다. 시민권란이 빈 이름이 대부분이었다. 총독이 물었다. 원수께서 이 사람들을 각별히 아끼시는데, 시민권을 주자고 하면 파리가 받아들이겠느냐고. 메지안은 목발 짚은 노병의 이름을 손가락으로 짚었다."
 lr_integration.121.a:0 "가톨릭 정당에 지방 행정을 맡긴다."
 lr_integration.121.b:0 "헌병대로 지하 조직을 쓸어낸다."
 lr_integration.121.t:0 "브뤼셀의 헌병대"
 lr_integration.121.d:0 "헌병대 대위 로베르 쇼뱅은 브뤼셀 중앙역을 접수하는 데 열두 분이 걸렸다. 시청은 그보다 빨랐고, 신문사는 조금 더 걸렸다. 원수의 명령은 한 단어였다. 질서.\n\n벨기에의 가톨릭 정당은 원수의 국민 혁명에 호의적이었다. 그 주 일요일 쇼뱅은 브뤼셀 성당 미사에 갔다. 신부가 질서와 가족과 신앙을 설교했다. 신자들이 고개를 끄덕였다. 사회주의자들과 노조 간부들은 하룻밤 사이에 지하로 사라졌다. 쇼뱅의 체포 명단에서 잡힌 사람은 열에 하나였다.\n\n헌병대장이 지도를 펼쳤다. 리에주의 탄광촌, 겐트의 부두, 샤를루아의 제철소. 붉은 점들이 찍혀 있었다. 쇼뱅은 그 점들이 매주 조금씩 자리를 옮긴다는 것을 알았다.\n\n\"원수 각하, 지하로 들어간 자들을 쫓을까요?\" 헌병대장의 전보를 쇼뱅이 정서했다. 그는 정서를 마치고, 체포 명단 맨 위의 이름이 자기 처남이라는 걸 다시 한 번 확인했다."
 lr_integration.122.a:0 "요새와 감시 초소를 촘촘히 세운다."
 lr_integration.122.b:0 "밀수꾼을 눈감아 주고 정보원으로 쓴다."
 lr_integration.122.t:0 "산맥의 수비대"
 lr_integration.122.d:0 "쥐라 국경 초소 수비대장 폴 베르니에 대위는 무릎까지 쌓인 눈을 헤치고 초소 지붕에 올랐다. 원수는 이 산맥을 베르됭처럼 지킬 수 있는 땅이라고 했다. 베르니에는 베르됭에 있었다. 거기는 이렇게 춥지 않았다.\n\n산골 마을은 조용했다. 시계 공방은 다시 돌았고 치즈 협동조합은 세금을 냈다. 그러나 스위스 쪽으로 넘어가는 밀수꾼 길이 수십 개였다. 담배, 시계, 그리고 사람. 베르니에의 부하가 지난주 잡은 밀수꾼은 마을 우체국장의 아들이었다.\n\n우체국장은 다음 날 초소로 찾아와 베르니에에게 치즈 한 덩이를 놓고 갔다. 아들 이야기는 하지 않았다. 베르니에도 묻지 않았다. 그 아들은 길을 누구보다 잘 알았다.\n\n베르니에는 첫 보고서를 비시에 보냈다. 원수가 보고서 여백에 한 줄을 적어 돌려보냈다. 산은 막을 수 있다. 사람은 어떤가. 베르니에는 치즈를 반으로 잘라 부하들과 나눠 먹으며 그 문장을 오래 보았다."
 lr_integration.123.a:0 "옛 장교들을 산악 부대에 받아들인다."
 lr_integration.123.b:0 "교회와 지방 귀족에게 행정을 맡긴다."
 lr_integration.123.t:0 "토리노의 원수"
 lr_integration.123.d:0 "사르데냐군 퇴역 대령 조반니 로시는 토리노 왕궁 연병장에 열두 명의 옛 장교들과 함께 섰다. 원수가 직접 그들을 사열하러 온다고 했다. 그들은 대전쟁 때 알프스의 눈 속에서 프랑스군과 싸웠다. 로시는 몽스니 고개에서 포대를 지휘했다.\n\n장교들은 이를 악물고 서 있었다. 모욕을 각오한 얼굴들이었다. 로시는 옆의 소령이 떨고 있는 것을 보았다. 추워서가 아니었다.\n\n원수는 천천히 걸어와 로시 앞에서 멈췄다. 키가 생각보다 작았다. 원수는 로시의 훈장을 한참 보았다. 그리고 말했다. \"귀관들은 용감하게 싸웠소. 나는 그 산에서 귀관들의 포격을 기억하오. 이제 같은 깃발 아래 싸웁시다.\"\n\n로시는 대답하지 못했다. 원수는 그다음 장교에게로 갔다. 사열이 끝나고 소령이 로시에게 물었다. 저 사람이 정말 그 포격을 기억할까요. 로시는 기억할 거라고 했다. 몽스니에서 그 포격을 맞은 프랑스 연대가 원수의 연대였기 때문이다."
 lr_integration.124.a:0 "청년 작업장의 아이들을 보낸다. 삽을 드는 것도 조국을 위한 일이다."
 lr_integration.124.b:0 "현지 독일인 노동자를 쓴다. 임금이 충성을 산다."
 lr_integration.124.t:0 "베르됭의 교훈"
 lr_integration.124.d:0 "원수 전속 부관 앙드레 마르티노 소령은 라인강 서안의 언덕에서 원수에게 망원경을 건넸다. 원수는 강 건너를 오래 보았다. 베르됭에서 그는 버티는 법을 가르쳤다. 이제 그는 다시는 버틸 필요가 없게 만들려 했다.\n\n언덕 아래로 대전쟁의 참호 자국이 남아 있었다. 풀이 자랐지만 비가 오면 지그재그 선이 드러났다. 그날도 아침에 비가 왔다. 원수는 망원경을 강에서 그 선으로 옮겨 오래 보다가 내렸다. 마르티노는 원수의 손이 조금 떨리는 것을 보았다. 나이 탓이라고 생각하기로 했다.\n\n공병대가 마지노선 연장 계획을 펼쳤다. 라인강을 따라 콘크리트 요새가 이어질 것이었다. 공병 대령은 필요한 인력이 3만 명이라고 했다.\n\n원수가 물었다. 그 3만 명을 어디서 구할 것인가. 공병 대령은 마르티노를 보았다. 마르티노는 수첩에 이미 두 가지 안을 적어 두었다."
 lr_integration.125.a:0 "제국의 데파르트망으로 나눈다. 알제리는 프랑스다."
 lr_integration.125.b:0 "아랍 왕국으로 삼는다. 동맹은 신민보다 오래간다."
 lr_integration.125.t:0 "황제의 알제리"
 lr_integration.125.d:0 "알제리 소총병 연대 출신 하사 압델카데르 브라히미는 총독 관저 앞 광장에서 옛 전우들과 함께 섰다. 황제가 관저 발코니에 나온다고 했다. 반란 때 브라히미의 연대를 지휘한 사람이 바로 그였다.\n\n발코니에 그가 나타나자 광장의 노병들이 소리쳤다. 장군! 장군! 아무도 황제라고 부르지 않았다. 브라히미 옆의 늙은 상사가 웃으며 말했다. 저 사람은 우리한테 영원히 장군이라고.\n\n황제는 손을 들어 답하고 한참 광장을 내려다보았다. 그의 칙령은 두 갈래라는 소문이었다. 알제리를 제국의 데파르트망으로 나누는 것, 아니면 아랍 왕국으로 삼아 토착 대가문에게 자치를 주는 것. 광장의 노병들 사이에서도 의견이 갈렸다.\n\n그날 저녁 황제의 부관이 소총병 대표 몇 명을 관저로 불렀다. 브라히미도 그중 하나였다. 황제는 그들 앞에서 말했다. \"나는 이 사람들과 함께 싸웠다. 그들을 신민으로 만들 수도, 동맹으로 만들 수도 있다.\" 그리고 브라히미에게 물었다. 자네는 어느 쪽이 좋겠나."
 lr_integration.126.a:0 "안트베르펜에 함대 기지를 짓는다. 권총에 총알을 넣는다."
 lr_integration.126.b:0 "왈롱 탄광과 공장에 돈을 넣는다. 제국은 석탄으로 움직인다."
 lr_integration.126.t:0 "스헬더 하구 데파르트망"
 lr_integration.126.d:0 "안트베르펜 항만청 직원 얀 페르묄런은 매일 아침 같은 질문을 받았다. 부두에 묶인 영국 상선 세 척의 선장들이었다. 대륙봉쇄령이 내려지기 전에 들어온 배들이었다. 그들은 출항 허가를 물었고, 페르묄런은 매일 같은 대답을 했다. 내일.\n\n그 주 수요일, 황제가 부두에 왔다. 그는 북해를 오래 바라보았다. 그리고 수행원들에게 이 항구를 영국의 심장을 겨눈 권총이라고 불렀다. 페르묄런은 항만청 창문으로 그것을 보았다. 영국 선장 하나도 갑판에서 그것을 보았다.\n\n벨기에는 이제 스헬더 하구, 다일, 주르마프 같은 제국의 데파르트망으로 나뉘었다. 1795년 혁명 프랑스가 처음 그었던 경계선이었다. 페르묄런의 할아버지 묘비에는 주르마프 데파르트망이라는 지명이 새겨져 있었다. 그는 그 지명이 다시 쓰일 줄은 몰랐다.\n\n오후에 해군 장관이 항만청을 찾아와 부두 도면을 펼쳤다. 이 항구를 군항으로 만들 수 있겠느냐고 물었다. 페르묄런은 영국 선장들이 오늘도 출항 허가를 물었다고 보고했다."
 lr_integration.127.a:0 "금고는 손대지 않는다. 은행가는 친구로 둔다."
 lr_integration.127.b:0 "심플롱 도로부터 닦는다. 대포가 알프스를 넘는다."
 lr_integration.127.t:0 "알프스의 길"
 lr_integration.127.d:0 "제네바의 은행원 자크 르페브르는 그날도 아침 일곱 시에 호숫가 산책로를 걸었다. 칼뱅의 도시가 레만 데파르트망의 청사가 되는 날이었다. 발레의 산골 마을에는 심플롱 데파르트망이라는 이름이 붙었다.\n\n산책로에는 평소처럼 은행가들이 있었다. 그들은 대포 소리가 들리던 날에도 산책을 거르지 않았다. 르페브르의 상사는 그에게 말한 적이 있었다. 제네바의 금고는 지난 세기 동안 다섯 개의 정권을 보았다고. 여섯 번째라고 다를 것은 없다고.\n\n그런데 그날 아침 신문에는 다른 소식도 있었다. 황제가 심플롱 고개에 이탈리아로 가는 군용 도로를 놓으라고 명령했다는 것이다. 대포가 지나갈 수 있는 길이어야 한다고. 르페브르는 그 도로 공사비가 어디서 나올지 계산해 보았다.\n\n오후에 은행가 대표단이 도지사를 찾아갔다. 르페브르는 서류 가방을 들고 따라갔다. 대표단장이 정중하게 물었다. 우리의 금고는 누구의 것이 됩니까. 도지사는 대답 대신 심플롱 도로 설계도를 펼쳤다."
 lr_integration.128.a:0 "사르데냐섬은 왕가에 남기고 본토만 갖는다."
 lr_integration.128.b:0 "왕가를 폐위하고 모든 땅을 제국에 넣는다."
 lr_integration.128.t:0 "토리노의 도지사"
 lr_integration.128.d:0 "피에몬테 도지사 비서 에티엔 뒤랑은 토리노 왕궁 지하 서고에서 사흘을 보냈다. 사르데냐 왕가의 문서 수천 상자가 나왔다. 피에몬테는 이제 포, 세지아, 마렝고 같은 제국의 데파르트망으로 나뉘었다.\n\n셋째 날 뒤랑은 한 상자에서 대전쟁 때 작성된 프랑스 침공 계획서를 찾았다. 리옹까지 열이틀이라는 계획이었다. 여백에 누군가 연필로 낙관적이라고 적어 두었다. 도지사는 그 상자를 파리로 보냈다.\n\n그 주에 황제가 새 데파르트망 이름 목록을 받아 보고 하나를 짚었다고 했다. 마렝고. 황제는 그 이름이 마음에 든다고 했다. 언젠가 그곳에서 큰 승리를 거둘 것 같은 이름이라고. 뒤랑은 그 말을 전해 듣고 지도에서 마렝고를 찾아보았다. 작은 마을이었다.\n\n도지사가 뒤랑에게 물었다. 사르데냐 왕가를 어떻게 해야 하겠나. 뒤랑은 지하 서고에서 찾은 다른 상자 이야기를 했다. 사르데냐섬 영지의 장부였다. 왕가는 그 섬을 백 년 동안 한 번도 찾아가지 않았다."
 lr_integration.129.a:0 "나폴레옹 법전을 바로 시행한다. 봉건의 잔재는 오늘 끝난다."
 lr_integration.129.b:0 "징병부터 한다. 라인의 아들들은 좋은 병사다."
 lr_integration.129.t:0 "라인의 데파르트망"
 lr_integration.129.d:0 "마인츠 대성당 종지기 페터 슐라이허는 그날 정오에 종을 쳤다. 라인강 서안이 몽토네르, 루르, 자르, 라인모젤의 네 데파르트망으로 나뉘는 날이었다. 1797년 혁명 프랑스가 처음 그었던 경계선이었다.\n\n슐라이허는 프로이센 시절에도 같은 종을 쳤다. 그의 아버지는 그 전의 대주교 시절에도 쳤다. 광장에 모인 프랑스 관리 하나가 종탑 아래서 그에게 물었다. 주인이 바뀌어서 기분이 어떠냐고. 슐라이허는 누가 다스리든 종은 같은 소리를 낸다고 대답했다. 관리는 그 말을 수첩에 적었다.\n\n강 건너편의 라인 연방 군주들은 황제의 보호국이었다. 강은 이제 국경이 아니라 제국의 한가운데를 흘렀다. 슐라이허는 종탑에서 강을 내려다보았다. 강에는 국경 초소가 하나도 없었다. 처음 보는 풍경이었다.\n\n오후에 새 도지사가 대성당을 찾았다. 그는 수행원에게 법전을 바로 시행할지, 징병부터 할지 물었다. 슐라이허에게는 열아홉 살 아들이 있었다."
 lr_integration.130.a:0 "항구는 열어 둔다. 상인이 웃어야 세금도 웃는다."
 lr_integration.130.b:0 "이 항구에도 대륙봉쇄를 건다."
 lr_integration.130.t:0 "암스테르담의 독수리"
 lr_integration.130.d:0 "암스테르담 상인 길드의 서기 헨드릭 데브리스는 왕궁 앞 광장에서 칙령 낭독을 들었다. 1795년 혁명 프랑스는 이곳에 바타비아 공화국을 세웠고, 2차 대불전쟁의 패배와 함께 잃었다. 이번에 황제는 자매 공화국을 세우지 않았다. 네덜란드는 자위더르해, 스헬더 하구, 마스 하구의 데파르트망이 되었다.\n\n운하를 따라 늘어선 상인들의 저택은 모두 창문이 컸다. 네덜란드에서는 창문 크기로 세금을 매겼고, 상인들은 자랑삼아 더 크게 냈다. 오늘 그 창문들의 커튼이 모두 닫혀 있었다. 데브리스가 사는 집도 그랬다. 그가 아침에 직접 닫았다.\n\n상인들은 말없이 칙령을 들었다. 그들의 공화국은 왕들의 유럽에서 몇 안 되는 의회의 나라였다. 데브리스 옆의 늙은 선주는 칙령이 끝나자 시계를 꺼내 보았다. 증권거래소가 열릴 시간이었다.\n\n오후에 새 도지사가 길드 회관을 찾아왔다. 그는 데브리스에게 물었다. \"세관과 항구는 어떻게 할까요?\" 데브리스는 길드 장부를 펼쳤다. 지난해 영국과의 거래가 전체의 절반이었다."
 lr_integration.131.a:0 "교황은 바티칸에 둔다. 순교자는 필요 없다."
 lr_integration.131.b:0 "교황청을 파리로 모신다."
 lr_integration.131.t:0 "캄피돌리오의 칙령"
 lr_integration.131.d:0 "황제의 시종 루이 콩스탕은 캄피돌리오 언덕 계단에서 황제의 외투를 들고 서 있었다. 황제의 칙령이 로마를 제국의 두 번째 도시로 선포한 날이었다. 피렌체에는 아르노 데파르트망의 깃발이 걸렸다.\n\n계단 아래로 포로 로마노의 폐허가 펼쳐졌다. 황제는 그것을 오래 내려다보았다. 수행원 하나가 카이사르도 여기 섰을 것이라고 말했다. 황제는 카이사르의 시신이 저 아래 광장에서 불태워졌다고 대답했다. 수행원은 그 뒤로 입을 다물었다. 콩스탕은 웃음을 참느라 외투를 고쳐 들었다.\n\n바티칸의 창문은 굳게 닫혀 있었다. 교황이 파문 칙서를 쓸지 고민하고 있다는 소문이 돌았다. 황제는 대관식 때 교황의 손에서 왕관을 받지 않았다. 로마 시민들은 그 이야기를 아직도 했다.\n\n그날 저녁 외무장관이 황제에게 물었다. \"폐하, 교황을 어떻게 하시겠습니까?\" 콩스탕은 황제가 대답하기 전에 창밖의 성 베드로 대성당 돔을 한 번 보는 것을 보았다."
 lr_integration.132.a:0 "카탈루냐어를 허락한다. 마드리드보다는 나은 주인이 되자."
 lr_integration.132.b:0 "프랑스어만 쓴다. 데파르트망은 데파르트망일 뿐이다."
 lr_integration.132.t:0 "몬세라트와 테르"
 lr_integration.132.d:0 "람블라스 거리의 신문팔이 조르디 푸졸은 황제의 포고문이 붙은 벽 앞에서 사람들이 모이는 것을 보았다. 카탈루냐는 몬세라트, 테르, 세그레, 에브르 하구의 네 데파르트망으로 나뉜다는 포고였다.\n\n카탈루냐 사람들은 마드리드도 파리도 좋아하지 않았다. 포고문 앞의 사람들은 아무 말 없이 읽고 흩어졌다. 그날 밤 포고문 절반이 찢겼다. 푸졸은 누가 찢었는지 알았다. 자기 사촌이었다.\n\n다음 날 새 도지사가 부임했다. 그는 부임 첫날 카탈루냐어 신문을 금지하지 않겠다고 약속했다. 마드리드는 백 년 동안 그것을 금지했다. 푸졸은 그날 오후 카탈루냐어 신문을 평소의 세 배 팔았다. 손님 하나는 신문을 받아 들고 울었다.\n\n그 주 금요일 도지사에게 파리의 전보가 왔다고 했다. 그 약속을 지킬 것인가. 푸졸은 도청 앞에서 신문을 팔며 그 소문을 들었다. 그는 카탈루냐어 신문을 프랑스어 신문 밑에 깔았다."
 lr_integration.133.a:0 "슬로베니아어 학교를 연다. 빈이 하지 않은 일을 파리가 한다."
 lr_integration.133.b:0 "트리에스테와 자다르를 군항으로 만든다. 아드리아해를 쥔다."
 lr_integration.133.t:0 "류블랴나의 원수"
 lr_integration.133.d:0 "류블랴나 시청 서기 안톤 코바치치는 성 아래 광장에서 청원서 다발을 품에 안고 서 있었다. 합스부르크의 아드리아해 해안이 제국의 일리리아 속주가 되는 날이었다. 고대 로마 속주의 이름이었다. 황제의 원수 하나가 첫 총독으로 부임했다.\n\n청원서는 슬로베니아어로 쓰여 있었다. 학교와 관청에서 자기 말을 쓰게 해 달라는 내용이었다. 빈은 50년 동안 그 청원서를 받지 않았다. 코바치치의 아버지도 서명자 명단에 있었다. 아버지는 그 청원서가 받아들여지는 걸 보지 못하고 죽었다.\n\n총독이 광장에 나타나자 코바치치는 앞으로 나섰다. 헌병이 막았다. 총독이 헌병을 물리고 청원서를 직접 받았다. 그는 슬로베니아어를 읽지 못했다. 통역이 첫 줄을 프랑스어로 옮겼다. 총독은 고개를 끄덕였다.\n\n그날 밤 총독은 첫 칙령을 쓰기 위해 책상 앞에 앉았다. 청원서는 책상 오른쪽에, 트리에스테와 자다르 군항 도면은 왼쪽에 놓여 있었다. 코바치치는 그 사실을 총독 관저의 청소부에게서 들었다."
 lr_integration.134.a:0 "항구를 열어 둔다. 상인들이 제국을 위해 벌게 하라."
 lr_integration.134.b:0 "밀수꾼을 잡고 영국 배를 막는다."
 lr_integration.134.t:0 "브레멘의 도지사"
 lr_integration.134.d:0 "브레멘 시청 라츠켈러의 지배인 프리드리히 하르트만은 7백 년 된 와인 통의 마개를 열었다. 한자 상인들이 모여 브레멘이 자유도시로 마시는 마지막 와인이라고 했다. 황제는 영국 상품의 밀수를 막으려고 북해 해안을 통째로 합병했다. 베저 하구와 엠스 상류의 데파르트망이 생겼다.\n\n한자 동맹의 상인들은 700년 동안 왕도 황제도 모시지 않았다. 와인 잔을 든 늙은 선주 하나가 건배사를 했다. 브레멘을 위하여. 다른 말은 덧붙이지 않았다. 하르트만은 새 도지사에게도 한 잔을 따랐다. 도지사는 잔을 받아 들고 말없이 마셨다.\n\n상인들은 대륙봉쇄가 이 항구까지 온다는 소문에 장부를 덮었다. 하르트만의 손님 절반은 영국 무역으로 먹고사는 사람들이었다. 그는 내일부터 와인 주문이 줄 것을 알았다.\n\n와인 통이 비자 도지사가 하르트만에게 물었다. 이 도시 사람들이라면 항구를 어떻게 하길 바라겠느냐고. 하르트만은 빈 통을 두드려 보였다. 속이 빈 소리가 났다."
 lr_integration.135.a:0 "알제리 노동자를 붉은 대육군에 받아들인다."
 lr_integration.135.b:0 "땅을 농민에게 나누고, 자치 평의회를 세운다."
 lr_integration.135.t:0 "카스바의 통령"
 lr_integration.135.d:0 "알제 부두의 하역부 카림 하다드는 하역장 아래서 통령을 기다렸다. 그는 이 땅의 반란을 진압하며 이름을 얻었다. 그리고 이제 같은 땅에 붉은 깃발을 들고 돌아왔다.\n\n하다드는 반란 때 그의 부대와 싸웠다. 왼쪽 어깨에 그때 입은 총상 자국이 있었다. 통령이 도착하자 하다드는 셔츠를 걷어 그 자국을 보여 주었다. 주변 노동자들이 숨을 죽였다. 통령은 그 자국에서 눈을 돌리지 않았다. 오래 보았다.\n\n부두 노동자들은 그를 반신반의했다. 진압군 장교가 해방자가 될 수 있느냐고. 하다드 옆의 늙은 하역부는 통령이 오기 전부터 침을 뱉고 있었다.\n\n통령이 하역장 위에 올라섰다. \"나는 그때 왕의 명령을 따랐다. 이제 인민의 명령을 따른다.\" 늙은 하역부가 다시 침을 뱉었다. 하다드는 셔츠를 내리지 않고 그대로 서 있었다. 통령은 연설이 끝날 때까지 하다드의 어깨를 몇 번이고 다시 보았다."
 lr_integration.136.a:0 "약속이 먼저다. 탄광은 광부의 것이다."
 lr_integration.136.b:0 "전쟁이 먼저다. 혁명이 살아야 약속도 지킨다."
 lr_integration.136.t:0 "샤를루아의 붉은 별"
 lr_integration.136.d:0 "샤를루아 광부 평의회 대표 레옹 드쿠르는 갱도에서 나와 붉은 대육군을 맞았다. 통령은 탄광을 광부 평의회에 넘기겠다고 약속했다. 광부들은 병사들에게 커피와 빵을 나눠 주었다.\n\n병사들 가운데 다수가 프랑스 북부 탄광 출신이었다. 드쿠르가 커피를 따라 준 병사는 랑스 출신이었다. 국경 너머에 사촌이 있다고 했다. 그 사촌의 이름을 대자 드쿠르는 웃었다. 같은 갱에서 일하는 사람이었다.\n\n그런데 이틀 뒤 붉은 대육군의 병참 장교가 평의회 사무실에 왔다. 석탄이 먼저 전선으로 가야 한다고 했다. 생산량의 7할. 드쿠르는 그 숫자를 듣고 광부들에게 뭐라고 해야 할지 몰랐다. 남은 3할로는 마을의 겨울을 날 수 없었다.\n\n그날 저녁 드쿠르는 통령의 숙소를 찾아갔다. \"약속이 먼저입니까, 전쟁이 먼저입니까?\" 통령은 대답하기 전에 드쿠르의 손을 보았다. 석탄 가루가 손톱 밑까지 배어 있었다."
 lr_integration.137.a:0 "몰수한다. 왕들의 금은 인민의 것이다."
 lr_integration.137.b:0 "봉인해 둔다. 협상 테이블에서 꺼내 쓴다."
 lr_integration.137.t:0 "제네바의 은행"
 lr_integration.137.d:0 "혁명 위원회 회계 담당 쥘리앵 마르소는 제네바 은행가들의 금고 앞에 섰다. 붉은 대육군이 들어온 지 사흘째였다. 칼뱅의 도시는 이제 인민 공화국의 레만 코뮌이었다.\n\n은행가들은 달아나지 않았다. 그들은 정장을 입고 은행 문 앞에 서서 혁명 위원들을 맞았다. 은행 총재는 마르소에게 금고 열쇠를 직접 건넸다. 그리고 장부도. 장부는 깔끔했다. 마르소가 지금까지 본 어떤 장부보다도.\n\n지하 금고에는 유럽 왕실들의 금이 잠들어 있었다. 호엔촐레른, 합스부르크, 그리고 윈저. 금괴마다 문장이 찍혀 있었다. 마르소는 윈저 금괴 하나를 들어 보았다. 생각보다 무거웠다.\n\n그날 밤 위원회가 둘로 갈렸다. 혁명 위원들은 그 금을 혁명의 군자금으로 쓰자고 했다. 외무위원은 그 금이 왕들과 협상할 때 무엇보다 강한 카드라고 했다. 마르소는 장부를 통령에게 가져갔다. 통령은 장부의 마지막 쪽, 금괴 총합만 보았다."
 lr_integration.138.a:0 "이탈리아 혁명의 거점으로 둔다. 자치를 준다."
 lr_integration.138.b:0 "프랑스 인민 공화국의 코뮌으로 묶는다."
 lr_integration.138.t:0 "토리노의 노동자들"
 lr_integration.138.d:0 "피아트 공장 선반공 루이자 칸텔리는 공장 지붕 위에서 깃발 두 개를 지켰다. 붉은 대육군이 들어오기 전에 노동자들이 먼저 공장을 점거했다. 토리노는 이탈리아에서 가장 붉은 도시였다.\n\n지붕에는 붉은 깃발과 이탈리아 삼색기가 나란히 걸렸다. 노동자들은 둘 다 내리지 않겠다고 했다. 붉은 대육군의 정치위원이 공장 마당에서 그 깃발 두 개를 올려다보며 한참 서 있었다. 칸텔리는 지붕 위에서 그를 내려다보았다. 위원은 결국 아무 말 없이 돌아갔다.\n\n통령은 토리노를 이탈리아 혁명의 거점으로 삼고 싶어 한다는 소문이었다. 그러나 이 땅은 이제 프랑스 인민 공화국의 코뮌이었다. 칸텔리의 남편은 프랑스 말을 한마디도 몰랐다.\n\n그 주 토리노 평의회가 통령에게 대표를 보냈다. 칸텔리도 그중 하나였다. 그녀는 통령 앞에서 물었다. \"우리는 프랑스인이 되는 겁니까, 이탈리아 혁명가로 남는 겁니까?\" 통령은 그녀의 선반 기름이 묻은 작업복을 보고 웃지 않았다."
 lr_integration.139.a:0 "독일어를 공용어로 같이 쓴다."
 lr_integration.139.b:0 "징병부터 한다. 라인의 노동자들은 좋은 병사다."
 lr_integration.139.t:0 "쾰른의 평의회"
 lr_integration.139.d:0 "쾰른 노동자 평의회의 통역 카를 슈나이더는 대성당 앞 광장 연단에서 통령 옆에 섰다. 라인강 서안의 평의회들이 프랑스 인민 공화국 편입을 결의한 다음 날이었다. 프로이센 관리들은 강 건너로 달아났다.\n\n광장은 사람들로 가득 찼다. 통령은 프랑스어로 연설했고 슈나이더가 한 문장씩 독일어로 옮겼다. 통역이 끝날 때마다 박수가 반 박자 늦게 나왔다. 통령은 이 땅의 노동자들은 독일인이기 전에 노동자라고 했다. 슈나이더는 그 문장을 옮기며 목소리를 조금 낮췄다. 박수는 그때 가장 작았다.\n\n연설이 끝나고 평의회 대표들이 통령을 둘러쌌다. 늙은 금속 노조 위원장이 정중하게 요청했다. 다음 연설은 독일어로 해 달라고. 통령은 독일어를 할 줄 몰랐다.\n\n그날 밤 통령이 슈나이더를 불렀다. 독일어를 배우려면 얼마나 걸리느냐고 물었다. 슈나이더는 일 년이라고 했다. 통령은 그동안 징병이 먼저일지, 말이 먼저일지를 물었다."
 lr_integration.140.a:0 "무역 회사를 국유화한다. 바다의 이윤은 인민의 것이다."
 lr_integration.140.b:0 "상인들에게 혁명 채권을 사게 한다."
 lr_integration.140.t:0 "암스테르담 부두"
 lr_integration.140.d:0 "혁명 위원회의 젊은 위원 피트 반데르베르프는 암스테르담 동인도 회사 옛 창고에서 장부를 넘겼다. 붉은 대육군이 상인 공화국의 수도에 들어온 지 일주일이었다. 부두 노동자들은 환호했고, 운하 저택의 상인들은 창문을 닫았다.\n\n몰수된 장부는 3백 년 치였다. 향신료와 비단과 노예의 기록이 같은 잉크로 적혀 있었다. 반데르베르프는 1680년대 장부의 한 쪽에서 손을 멈췄다. 사람의 이름은 없고 숫자와 나이만 적힌 쪽이었다. 그는 그 쪽을 오래 읽었다.\n\n통령은 그 장부들을 몰수하라고 명령했다. 혁명이 처음 손에 넣은 해외 무역망의 지도이기도 했다. 반데르베르프의 할아버지는 그 회사의 서기였다.\n\n그날 오후 상인 대표단이 위원회를 찾아왔다. 그들은 협조하겠다고 했다. 반데르베르프는 1680년대 장부를 펼쳐 놓은 채 그들을 맞았다. 상인들 가운데 하나가 그 쪽을 보고 눈을 피했다. 위원장이 반데르베르프에게 물었다. 이 사람들을 어떻게 하면 좋겠나."
 lr_integration.141.a:0 "교회 재산은 국유화한다. 교황은 건드리지 않는다."
 lr_integration.141.b:0 "바티칸을 봉쇄한다. 혁명에 두 주인은 없다."
 lr_integration.141.t:0 "교황과 통령"
 lr_integration.141.d:0 "로마 인민 위원회의 서기 마리오 베네티는 캄피돌리오 광장 한복판에 서 있었다. 1798년 혁명 프랑스가 세웠던 로마 공화국의 이름이 140년 만에 다시 불렸다. 이번에는 인민 공화국이었다.\n\n광장 한쪽에서는 혁명 위원들이 붉은 깃발을 올렸다. 다른 쪽에서는 늙은 여인들이 묵주를 돌렸다. 두 무리 사이의 거리는 스무 걸음이었다. 아무도 그 스무 걸음을 건너지 않았다. 베네티의 어머니는 묵주 쪽에 있었다. 그는 깃발 쪽에 있었다.\n\n바티칸의 창문은 굳게 닫혀 있었다. 혁명 위원들은 교회 재산을 국유화하자고 했다. 통령은 대관식 대신 붉은 깃발을 택한 사람이었지만, 이탈리아 농민들이 일요일마다 성당에 간다는 것도 알았다.\n\n그날 밤 위원장이 통령에게 물었다. \"교황을 어떻게 하시겠습니까?\" 베네티는 회의록을 받아 적으며 낮에 본 스무 걸음을 생각했다. 어머니는 그가 건너오기를 기다리는 눈치였다."
 lr_integration.142.a:0 "조합의 자치를 인정한다. 바르셀로나는 바르셀로나가 다스린다."
 lr_integration.142.b:0 "정치위원을 보내 조합을 묶는다. 혁명에는 하나의 지휘가 필요하다."
 lr_integration.142.t:0 "바르셀로나의 조합들"
 lr_integration.142.d:0 "람블라스 거리 꽃가게 주인 몬세라트 비달은 붉은 대육군이 들어온 날 아침에도 가게 문을 열었다. 그들을 맞은 것은 검붉은 깃발의 조합원들이었다. 이 도시의 노동자들은 공산주의자보다 아나키스트가 많았다.\n\n조합원들은 비달의 가게에서 카네이션을 사서 병사들에게 건넸다. 병사들은 웃으며 받았다. 그런데 행렬 뒤의 정치위원들에게는 아무도 꽃을 건네지 않았다. 비달은 그 차이를 보았다. 거리의 모두가 보았다. 정치위원들도 보았다.\n\n그날 오후 조합 대표가 통령을 만났다. 비달의 조카가 그 자리에 있었다. 대표는 정중했고 분명했다. 우리는 마드리드의 왕을 몰아내는 데 기꺼이 함께했다. 그러나 파리의 위원을 모시려고 싸운 것은 아니라고.\n\n저녁에 조카가 가게에 들러 그 이야기를 전했다. 비달은 남은 카네이션을 세었다. 열두 송이였다. 내일 아침에 누구에게 팔게 될지는 통령의 대답에 달려 있었다."
 lr_integration.143.a:0 "세 언어를 모두 쓴다. 노동자는 모두 같다."
 lr_integration.143.b:0 "조선소는 붉은 함대를 짓는다. 말다툼은 그다음에."
 lr_integration.143.t:0 "트리에스테의 조선공들"
 lr_integration.143.d:0 "트리에스테 조선소의 용접공 마르코 페트로비치는 평의회 첫 회의에 나갔다. 합스부르크의 항구가 인민 공화국의 일리리아 코뮌이 되었다. 이탈리아인과 슬로베니아인과 크로아티아인 조선공들이 처음으로 같은 평의회에 앉았다.\n\n그리고 첫날부터 싸웠다. 회의록을 어느 말로 쓸 것인가. 이탈리아인 대표는 이 도시가 원래 자기들 것이라 했다. 슬로베니아인 대표는 조선소를 실제로 돌리는 건 자기들이라 했다. 페트로비치는 크로아티아인이었다. 그는 두 사람 다 맞는 말을 한다고 생각했다. 그래서 가만히 있었다.\n\n회의는 세 시간 동안 의제 하나도 다루지 못했다. 그 사이 조선대 위의 반쯤 지은 화물선에서는 아무도 일하지 않았다. 페트로비치는 창밖으로 그 배를 보았다. 지난주까지 그가 용접하던 배였다.\n\n회의실 뒤에서 통령이 보낸 위원이 모든 것을 지켜보았다. 위원은 결국 밖으로 나가 파리에 전보를 쳤다. 어느 말로 회의를 할까요. 페트로비치는 그 전보 내용을 듣고 웃었다. 전보도 프랑스어로 쳤을 테니까."
 lr_integration.144.a:0 "연대의 배를 띄운다. 리버풀의 형제들에게."
 lr_integration.144.b:0 "항구를 봉쇄한다. 섬나라를 굶긴다."
 lr_integration.144.t:0 "브레멘 부두의 평의회"
 lr_integration.144.d:0 "브레멘 부두 노동자 조합의 회계 오토 크뤼거는 창고 장부에 마지막 숫자를 적었다. 밀가루 3백 포대, 통조림 2천 상자. 조합원들이 한 달 치 임금을 모아 산 것이었다. 상자마다 영어로 같은 글귀가 적혀 있었다. 브레멘에서 형제들에게.\n\n독일에서 가장 붉은 항구의 부두 노동자들이 붉은 대육군을 맞이했다. 한자 상인들의 시청에 붉은 깃발이 올라갔다. 크뤼거는 그날 시청 앞에서 노래를 불렀다. 목이 쉬었다.\n\n그런데 사흘 뒤 통령의 명령이 왔다. 영국 배를 막으라는 것이었다. 섬나라를 굶기라고. 크뤼거는 창고에 쌓인 상자들을 보았다. 그 상자들은 리버풀 부두의 차티스트 조합에 보낼 것이었다. 리버풀 조합은 대전쟁 직후 브레멘에 우유를 보내 준 적이 있었다.\n\n위원이 창고에 와서 상자를 세었다. 그리고 크뤼거에게 물었다. 영국 배를 막을까, 영국 노동자에게 보낼 배를 띄울까. 크뤼거는 대답 대신 상자 하나의 글귀를 손가락으로 짚었다."
 lr_election.1.t:0 "총선"
 lr_election.1.d:0 "선거 운동 본부의 통계원 폴 르브룅은 사흘째 잠을 못 잤다. 파리의 벽마다 포스터가 세 겹으로 붙었고, 시골 장터에서는 후보들이 수레 위에 올라가 목이 쉬도록 연설했다. 르브룅의 책상에는 각 지방에서 올라온 전화 보고가 쌓였다.\n\n개표가 끝나 간다. 지역별 여당 득표: 파리 [?LR_vote_paris|0]% · 북부 [?LR_vote_nord|0]% · 방데 [?LR_vote_vendee|0]% · 남부 [?LR_vote_midi|0]% · 론 [?LR_vote_rhone|0]% · 로렌 [?LR_vote_lorraine|0]% · 북아프리카 [?LR_vote_africa|0]%. 예상 여당 의석은 §Y[?LR_election_forecast|0]§!석, 지난 의회보다 §Y[?LR_election_swing|+0]§!석이다. 본부가 공들인 지역이 결과를 갈랐다.\n\n선거 운동 마지막 날 밤, 선거대책위원장이 르브룅의 책상 앞에 섰다. 내일 아침 신문에 실릴 마지막 메시지를 골라야 했다. 지난 임기를 내세울 것인가, 조국과 군대를 앞세울 것인가, 아니면 서랍 속에 넣어 둔 야당 의원의 추문을 꺼낼 것인가.\n\n르브룅은 숫자만 볼 줄 알았다. 위원장은 그에게 숫자 말고 감을 물었다. 그는 연필을 귀에 꽂으며 말했다. 마지막 날 터뜨린 추문은 표를 가져오지만, 다음 날부터 그 의원과 같은 엘리베이터를 타야 한다고."
 lr_election.1.a:0 "우리가 한 일을 말한다. 그거면 충분하다."
 lr_election.1.b:0 "조국과 군대를 앞에 세워. 의석 +6"
 lr_election.1.c:0 "서랍을 열어. 의석 +12, 안정도 -3%"
 lr_election.2.t:0 "불신임안"
 lr_election.2.d:0 "여당 원내대표 실의 비서 앙드레 쿠르탱은 의사당 방청석 맨 끝에서 표를 셌다. 야당 대표가 연단에 올라 불신임안을 읽어 내려갔다. 내각이 과반을 잃은 지 여섯 달, 의원 117명이 서명했다.\n\n방청석은 기자들로 꽉 찼다. 의사당 매점에서는 벌써 표결 결과를 두고 내기가 돌았다. 배당률은 내각 쪽이 세 배였다. 쿠르탱은 그 배당률을 매점 주인에게 직접 물어 확인했다. 매점 주인은 이 건물에서 서른 해를 일한 사람이었고, 내기에서 진 적이 거의 없었다.\n\n\"이 내각은 프랑스를 다스리는 것이 아니라 버티고 있을 뿐입니다!\" 야당 대표의 목소리가 천장에 부딪혀 돌아왔다. 야당 의석에서 책상을 두드리는 소리가 났다.\n\n원내대표가 쿠르탱을 불러 쪽지 하나를 총리에게 전하라고 했다. 쿠르탱은 의석 사이를 허리를 숙이고 지나가며 쪽지를 슬쩍 보았다. 연정을 꾸리려면 장관 자리 셋. 아니면 해산. 총리는 쪽지를 받고도 연단 쪽에서 눈을 떼지 않았다."
 lr_election.2.a:0 "장관 자리 셋을 내준다. 의석 +45"
 lr_election.2.b:0 "의회를 해산해. 국민에게 직접 묻는다."
 lr_election.2.c:0 "버틴다. 이 정부는 물러나지 않는다."
