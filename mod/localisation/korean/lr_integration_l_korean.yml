l_korean:
 lr_integration.101.a:0 "모두에게 시민권을 준다. 공화국은 하나다."
 lr_integration.101.b:0 "단계적으로 넓힌다. 먼저 참전 군인과 교사부터."
 lr_integration.101.t:0 "모든 시민에게 같은 표를"
 lr_integration.101.d:0 "부르봉 궁. 알제리 3개 도 편입법이 표결에 부쳐졌다. 산악파는 1794년 국민공회가 식민지 노예제를 폐지했던 일을 떠올린다.\n\n방청석에는 알제에서 배를 타고 온 교사와 상인들이 앉아 있다. 그중 한 노인은 대전쟁 때 베르됭에서 받은 훈장을 달고 왔다. 프랑스를 위해 싸웠지만 프랑스의 투표권은 받지 못한 사람이다.\n\n쟁점은 하나다. 알제리의 무슬림 주민 수백만 명에게 본토와 같은 시민권을 줄 것인가. 알제의 콜롱 대표들은 그렇게 되면 자기들이 소수가 된다며 반대한다.\n\n\"공화국에 이등 시민은 없습니다.\" 총리가 연단에서 말한다."
 lr_integration.102.a:0 "알제를 자유항으로 연다. 장사가 화해를 만든다."
 lr_integration.102.b:0 "토착 명사에게도 도 의회 의석을 나눈다."
 lr_integration.102.t:0 "알제 상공회의소"
 lr_integration.102.d:0 "알제 항구가 내려다보이는 상공회의소 건물. 보르도와 마르세유의 선주들이 알제의 상인들과 같은 탁자에 앉았다.\n\n탁자 위에는 오렌지와 대추야자와 포도주의 수출 장부가 펼쳐져 있다. 알제 항구는 마르세유 다음으로 붐비는 프랑스의 항구가 될 수 있다. 단, 누구의 항구인지 정해진다면.\n\n지롱드 내각의 방침은 간단하다. 파리가 일일이 다스리지 않는다. 도 의회가 예산을 정하고, 항구는 상인들이 꾸린다.\n\n그런데 도 의회 선거를 누구의 표로 치를지를 두고 콜롱과 토착 명사들이 맞선다. 도지사가 파리의 답을 기다린다."
 lr_integration.103.a:0 "명부대로 간다. 재산이 곧 책임이다."
 lr_integration.103.b:0 "토착 대가문에도 의석을 나눠 준다."
 lr_integration.103.t:0 "납세자의 알제리"
 lr_integration.103.d:0 "알제 총독 관저의 무도회장. 포도원 지주와 은행가, 그리고 몇 명의 토착 대가문 대표가 초대받았다. 푀양파의 방식대로, 세금을 많이 내는 사람이 도를 다스린다.\n\n무도회장 구석에서 토착 대가문의 노인 하나가 샴페인 대신 물을 청한다. 그의 집안은 오스만 시절부터 콩스탕틴을 다스렸고, 지금은 그 도시 세금의 3분의 1을 낸다. 그러나 명부에서 그의 이름은 맨 뒷장에 있다.\n\n명부를 보면 결과는 뻔한다. 의석의 9할은 콜롱 지주들의 몫이다.\n\n총독이 묻는다. \"토착 대가문의 몫을 조금 늘려 줄까요? 그들이 반란을 막아 줄 수도 있습니다.\""
 lr_integration.104.a:0 "결과를 그대로 따른다. 공화국은 강요하지 않는다."
 lr_integration.104.b:0 "투표 전에 학교와 병원을 먼저 짓는다."
 lr_integration.104.t:0 "대통령의 질문"
 lr_integration.104.d:0 "알제의 광장마다 투표함이 놓였다. 투표용지에는 질문이 하나뿐이다. 프랑스 공화국의 시민이 되겠습니까?\n\n투표함은 콘크리트 블록 위에 놓였고, 그 옆에는 아랍어와 프랑스어로 된 안내문이 붙었다. 오랑의 한 마을에서는 투표하러 온 사람들이 새벽부터 줄을 섰고, 다른 마을에서는 아무도 오지 않았다.\n\n대통령은 알제리에서 군 생활을 시작했고, 그곳에서 이름을 얻었다. 그는 칙령 대신 투표를 택했다. 장군들은 결과가 나쁘면 어떻게 할 것이냐고 묻는다.\n\n\"그렇다면 우리가 틀린 것이지.\" 대통령이 대답한다."
 lr_integration.105.a:0 "코뮌의 일부로 편입한다. 노동자에게 국경은 없다."
 lr_integration.105.b:0 "자치 평의회를 세우고 연방을 맺는다."
 lr_integration.105.t:0 "카스바의 붉은 깃발"
 lr_integration.105.d:0 "알제 부두. 노동자 평의회가 처음으로 열렸다. 아랍인 하역 노동자와 프랑스인 기관사가 같은 총회에서 손을 든다.\n\n총회장 벽에는 파리 코뮌의 포스터 옆에 아랍어로 쓴 구호가 나란히 붙었다. 땅은 경작하는 자에게. 어느 쪽이 먼저 붙었는지를 두고 첫날부터 말다툼이 있었다.\n\n파리 위원회의 사절이 두 가지 길을 내놓는다. 알제리를 코뮌의 일부로 편입하거나, 알제리 사회주의 공화국을 세워 코뮌과 연방을 맺거나.\n\n\"식민지를 해방하러 왔다면서, 또 파리가 정하는 거요?\" 총회 뒤편에서 누군가 외친다."
 lr_integration.106.a:0 "벨기에 전체를 코뮌으로 편입한다."
 lr_integration.106.b:0 "플랑드르에는 자기 말로 다스리는 자치 코뮌을 준다."
 lr_integration.106.t:0 "샤를루아의 광부들"
 lr_integration.106.d:0 "샤를루아 탄광 지대. 광부 평의회가 코뮌 합류를 만장일치로 결의했다. 갱도 입구마다 붉은 깃발이 꽂혔다.\n\n갱도 입구에서 늙은 광부 하나가 붉은 깃발에 작은 노란 사자를 꿰매 넣었다. 플랑드르의 사자다. 위원회 사절은 그것을 보고 아무 말도 하지 못했다.\n\n그런데 안트베르펜의 플랑드르 노동자들은 망설이다. 그들은 혁명을 원하지만, 파리의 프랑스어 위원회가 자기들을 다스리는 것은 원하지 않는다.\n\n위원회가 묻는다. 벨기에를 한 덩어리로 받을 것인가, 두 코뮌으로 받을 것인가."
 lr_integration.107.a:0 "시계 공장을 국가 계획에 넣는다. 정밀 기계는 혁명의 무기다."
 lr_integration.107.b:0 "조합의 자치를 그대로 둔다. 시계공들은 스스로 시간을 맞춘다."
 lr_integration.107.t:0 "시계공들의 총회"
 lr_integration.107.d:0 "쥐라산맥의 시계 마을. 60년 전 이곳의 시계공들은 국제노동자협회에서 가장 급진적인 지부를 꾸렸다. 그들의 손자들이 오늘 코뮌 합류를 투표한다.\n\n총회장 한쪽 벽에는 수백 개의 시계가 걸려 있다. 모두 마을 공방에서 만든 것이고, 모두 정확히 같은 시각을 가리킨다. 시계공들은 그것이 자기들이 서로를 믿는 방식이라고 말한다.\n\n스위스 연방은 이미 괴뢰국이 되었고, 쥐라는 프랑스의 일부가 되었다. 시계공들은 묻는다. 우리 조합은 계획위원회의 지시를 받게 됩니까?\n\n위원회 사절은 대답을 망설이다."
 lr_integration.108.a:0 "찬성한 코뮌만 받는다. 연합은 자발적이다."
 lr_integration.108.b:0 "반대한 코뮌과도 무역과 상호 방위 조약을 맺는다."
 lr_integration.108.t:0 "리에주의 가입 투표"
 lr_integration.108.d:0 "리에주의 민중 회관. 벨기에 각지의 코뮌 대표들이 모여 프랑스 자유 코뮌 연합에 가입할지 투표한다. 연합은 아무도 강제로 받아들이지 않는다. 원하는 코뮌만 들어온다.\n\n투표는 손을 들어 한다. 리에주의 민중 회관은 사흘 밤낮 문을 열어 두었고, 투표하러 온 광부들이 회관 바닥에서 잠을 잤다. 서기는 모든 손을 셌다. 한 번도 틀리지 않았다.\n\n왈롱의 광산 코뮌들은 거의 모두 찬성한다. 플랑드르의 농촌 코뮌들은 절반이 반대한다.\n\n연합 서기국은 결정할 권한이 없다. 대신 각 코뮌의 결정을 기록할 뿐이다."
 lr_integration.109.a:0 "가입을 환영한다. 연합의 고향이 돌아왔다."
 lr_integration.109.b:0 "시계공 조합에 정밀 기계 생산을 부탁한다."
 lr_integration.109.t:0 "생티미에의 귀환"
 lr_integration.109.d:0 "쥐라산맥의 생티미에. 1872년 이 작은 시계 마을에서 반권위주의 인터내셔널이 세워졌다. 바쿠닌이 마지막 연설을 했던 곳이다.\n\n60년이 지나 쥐라 연합의 마을들이 프랑스 자유 코뮌 연합 가입을 투표한다. 노인 시계공 하나가 총회장에 할아버지가 쓰던 검은 깃발을 들고 나왔다.\n\n\"우리 할아버지들이 시작한 걸, 이제야 끝내는구먼.\""
 lr_integration.110.a:0 "외인부대 정착촌을 세운다. 산악 지대에 총과 쟁기를 함께 보낸다."
 lr_integration.110.b:0 "반란 가담자를 사면하고 토착 부대를 만든다."
 lr_integration.110.t:0 "총독 관저의 장군"
 lr_integration.110.d:0 "알제 총독 관저. 왕이 보낸 장군이 군복 차림으로 취임 선서를 한다. 민간인 총독은 없다. 반란을 겪은 땅은 군대가 다스린다는 것이 왕의 방침이다.\n\n장군의 집무실 창밖으로 카스바의 하얀 골목이 보인다. 반란 때 그 골목에서 그의 부하 서른 명이 죽었다. 장군은 그 골목을 지도에서 붉은색으로 칠해 두었다.\n\n장군의 첫 보고서가 파리에 도착한다. 카스바에는 아직 무기가 숨겨져 있고, 산악 지대에는 반란군 잔당이 있다.\n\n\"폐하, 외인부대 정착촌을 산악 지대에 세우면 10년 안에 조용해질 겁니다.\""
 lr_integration.111.a:0 "프랑스군에 편입한다. 그들도 이제 왕의 병사다."
 lr_integration.111.b:0 "무장을 해제하고 연금을 준다. 패자에게도 체면은 있다."
 lr_integration.111.t:0 "브뤼셀의 군정 장관"
 lr_integration.111.d:0 "브뤼셀 왕궁. 벨기에 왕가는 런던으로 떠났고, 그 자리에 프랑스 군정 장관이 앉았다. 오를레앙의 왕은 벨기에를 1914년 독일군이 지나간 복도가 아니라 프랑스의 방패로 만들겠다고 선언했다.\n\n군정 장관의 책상에는 벨기에군 장교 명단이 놓여 있다. 4천 명. 그중 절반은 왈롱 사람이고, 절반은 플랑드르 사람이다. 그리고 그들 모두 프랑스군을 상대로 사흘 동안 리에주 요새를 지켰다.\n\n왈롱 사람들은 대체로 받아들인다. 플랑드르 사람들은 프랑스어 표지판이 걸리는 것을 말없이 지켜본다.\n\n군정 장관이 묻는다. 벨기에군 장교들을 어떻게 할까요?"
 lr_integration.112.a:0 "요새부터 짓는다. 산맥은 프랑스의 성벽이 된다."
 lr_integration.112.b:0 "시계 공장에 군수 주문을 준다."
 lr_integration.112.t:0 "산맥의 요새"
 lr_integration.112.d:0 "쥐라산맥의 고갯길. 왕의 공병대가 스위스 국경이었던 능선 위에 포대를 올린다. 이제 이 산맥은 국경이 아니라 프랑스의 안쪽이다.\n\n고갯마루의 옛 국경 초소에는 아직 스위스 십자기가 그려진 표지판이 서 있다. 공병들은 그것을 뽑아내는 대신 그 위에 백합을 덧칠했다. 비가 오면 십자가가 다시 비쳐 보인다.\n\n시계 마을 사람들은 포대 공사보다 시계 공장 주문이 끊길까 더 걱정한다. 스위스 은행들이 거래를 끊었기 때문이다.\n\n공병 사령관이 묻는다. 요새를 먼저 지을까요, 마을부터 달랠까요?"
 lr_integration.113.a:0 "프랑스 산악병으로 편입한다. 알프스는 그들이 가장 잘 안다."
 lr_integration.113.b:0 "근위대를 해산하고 귀족들에게 연금을 준다."
 lr_integration.113.t:0 "토리노의 왕궁"
 lr_integration.113.d:0 "토리노 왕궁. 사르데냐 왕가의 문장이 내려지고 백합기와 삼색기가 함께 걸린다. 사부아는 한 세대 만에 프랑스로 돌아왔고, 알프스 너머 피에몬테까지 왕의 땅이 되었다.\n\n왕궁 계단에서 사르데냐의 늙은 근위병 하나가 프랑스 장교에게 경례를 거부했다. 그는 끌려가면서도 피에몬테 사투리로 무언가를 외쳤고, 구경하던 시민들이 박수를 쳤다.\n\n토리노의 귀족들은 프랑스어를 할 줄 알면서도 이탈리아어로만 대답한다.\n\n군정 장관이 묻는다. 사르데냐 왕가의 근위대를 어떻게 할까요?"
 lr_integration.114.a:0 "강을 따라 요새선을 쌓는다. 라인강은 다시 건너지 못한다."
 lr_integration.114.b:0 "독일어를 쓰는 시장들을 그대로 두고 충성 서약만 받는다."
 lr_integration.114.t:0 "라인강이 국경이다"
 lr_integration.114.d:0 "코블렌츠 요새. 왕이 라인강 다리 위에 섰다. 강 건너편에는 라인 연방의 깃발이 걸려 있다.\n\n다리 아래로 석탄 바지선이 지나간다. 루르의 석탄이 프랑스의 제철소로 가는 배다. 공병 대령은 설계도 여백에 이렇게 적었다. 요새는 강을 지키고, 강은 석탄을 지킨다.\n\n리슐리외 이래 프랑스의 장군들은 라인강을 자연 국경이라 불렀다. 오를레앙의 왕은 그 말을 사실로 만들었다.\n\n\"이 강을 다시는 적군이 건너지 못하게 하라.\" 왕의 명령에 공병대가 요새 설계도를 펼친다."
 lr_integration.115.a:0 "선교회와 학교를 함께 보낸다."
 lr_integration.115.b:0 "모스크와 이슬람 법정을 왕의 이름으로 보호한다."
 lr_integration.115.t:0 "왕령 알제리"
 lr_integration.115.d:0 "알제 대성당. 대주교가 알제리를 왕의 직할령으로 선포하는 미사를 집전한다. 1830년 샤를 10세가 처음 이 땅을 정복했을 때처럼, 왕의 이름과 십자가가 함께 들어온다.\n\n미사가 끝나자 대성당 앞 광장에서 대주교가 알제의 무프티와 짧게 악수했다. 사진 기자들이 셔터를 눌렀지만, 둘 다 카메라를 보지 않았다.\n\n그런데 왕실 고해 신부는 걱정한다. 무슬림 주민들에게 선교회를 보내면 반란이 다시 일어날 수 있다고.\n\n왕이 결정해야 한다."
 lr_integration.116.a:0 "벨기에 귀족에게 프랑스 작위를 준다. 귀족은 귀족을 안다."
 lr_integration.116.b:0 "왈롱 탄광에 왕실 구호 기금을 보낸다. 빵이 먼저다."
 lr_integration.116.t:0 "부르고뉴의 꿈"
 lr_integration.116.d:0 "브뤼셀 대광장. 15세기 부르고뉴 공작들의 길드 회관 앞에서 왕의 칙령이 낭독된다. 부르봉 왕가는 이 땅이 옛 부르고뉴의 유산이라고 주장한다.\n\n대광장의 길드 회관 지붕에는 아직 황금 장식이 반짝인다. 15세기에 이 광장은 유럽에서 가장 부유한 곳이었다. 왕은 그 시절을 되살리겠다고 약속했고, 브뤼셀 사람들은 그 약속을 반신반의한다.\n\n플랑드르의 사제들은 같은 가톨릭 왕을 반긴다. 왈롱의 노동자들은 왕보다 빵을 묻는다.\n\n궁정 대신이 묻는다. 벨기에 귀족들에게 프랑스 작위를 줄까요?"
 lr_integration.117.a:0 "낭트 칙령처럼 신앙의 자유를 보장한다."
 lr_integration.117.b:0 "가톨릭 학교를 세운다. 아이들은 프랑스어로 기도할 것이다."
 lr_integration.117.t:0 "산맥의 주"
 lr_integration.117.d:0 "브장송 대성당. 프랑슈콩테 주의 귀족들과 새로 편입된 쥐라 마을의 대표들이 함께 미사를 드린다. 루이 14세가 프랑슈콩테를 얻은 지 260년, 이제 산맥의 반대편도 같은 왕의 땅이다.\n\n미사가 끝나고, 쥐라 마을 대표들이 성당 밖으로 나와 자기들끼리 시편을 노래한다. 칼뱅의 시편이다. 성당 계단에 선 주교는 그 노래가 끝날 때까지 기다렸다.\n\n쥐라 마을 사람들은 대부분 개신교도다. 그들은 왕이 성당을 강요할까 걱정한다.\n\n주교가 묻는다. 개신교 교회를 어떻게 할까요?"
 lr_integration.118.a:0 "혼인을 성사시킨다. 칼보다 반지가 오래간다."
 lr_integration.118.b:0 "사부아 가문을 망명시킨다. 땅에 두 주인은 없다."
 lr_integration.118.t:0 "사촌들의 혼인"
 lr_integration.118.d:0 "토리노 왕궁. 사르데냐 왕국은 무너졌지만, 사부아 가문은 부르봉 왕가와 수백 년 동안 혼인으로 얽혀 있었다.\n\n사부아 가문의 공주는 열아홉 살이다. 그녀는 혼담 이야기를 신문에서 처음 읽었다. 그날 오후 그녀는 토리노 왕궁 정원을 혼자 오래 걸었고, 시녀들은 멀찍이서 따라다녔다.\n\n왕이 제안한다. 사부아 가문의 공주를 부르봉의 왕자와 혼인시키고, 그 자녀에게 피에몬테 공작 칭호를 주자고. 땅은 프랑스의 것이지만 이름은 남겨 두자고.\n\n토리노의 귀족들이 처음으로 고개를 끄덕인다."
 lr_integration.119.a:0 "교황청과 협의해 독일인 대주교를 세운다."
 lr_integration.119.b:0 "프랑스인 대주교를 보낸다. 라인강 서안은 프랑스다."
 lr_integration.119.t:0 "선제후들의 성당"
 lr_integration.119.d:0 "쾰른 대성당. 신성로마제국이 무너진 뒤 쇠락했던 옛 대주교 선제후의 땅이 프랑스 왕의 보호 아래 들어온다.\n\n대성당의 쌍둥이 첨탑은 6백 년 동안 지어졌다. 프로이센이 완공시켰고, 프로이센의 독수리가 그 첨탑 아래 걸려 있었다. 오늘 아침 그 독수리가 내려졌다.\n\n부르봉 왕은 이 땅의 가톨릭 주민들에게 프로이센의 개신교 관리들이 아니라 가톨릭 왕이 왔다고 말한다. 라인강 서안의 사제들은 오랜만에 미소를 짓는다.\n\n궁정 대신이 묻는다. 쾰른 대주교를 누구로 할까요?"
 lr_integration.120.a:0 "알제리 참전 노병에게 시민권과 땅을 준다."
 lr_integration.120.b:0 "농민 조합을 세우고 콜롱 지주들에게 맡긴다."
 lr_integration.120.t:0 "원수의 알제리"
 lr_integration.120.d:0 "알제 시청 광장. 원수의 초상이 걸린 연단 앞에서 참전용사 군단의 알제리 지부가 창설된다. 대전쟁에서 프랑스를 위해 싸운 알제리 출신 노병들이 맨 앞줄에 섰다.\n\n맨 앞줄의 노병 하나는 한쪽 다리가 없다. 베르됭에서 잃었다. 그는 목발을 짚고 서서 원수의 초상에 경례한다. 그는 아직 프랑스 시민이 아니다.\n\n원수는 알제리를 국민 혁명의 모범으로 만들겠다고 말했다. 노동, 가족, 조국.\n\n총독이 묻는다. 알제리 노병들에게 시민권을 줄까요? 원수는 그들을 각별히 아낀다."
 lr_integration.121.a:0 "가톨릭 정당에 지방 행정을 맡긴다."
 lr_integration.121.b:0 "헌병대로 지하 조직을 쓸어낸다."
 lr_integration.121.t:0 "브뤼셀의 헌병대"
 lr_integration.121.d:0 "브뤼셀. 프랑스 헌병대가 시청과 중앙역과 신문사를 차례로 접수한다. 원수의 명령은 한 단어다. 질서.\n\n벨기에의 가톨릭 정당은 원수의 국민 혁명에 호의적이다. 성당마다 신부들이 질서와 가족과 신앙을 설교한다. 사회주의자들과 노조 간부들은 하룻밤 사이에 지하로 사라졌다.\n\n헌병대장이 지도를 펼친다. 리에주의 탄광촌, 겐트의 부두, 샤를루아의 제철소. 붉은 점들이 찍혀 있다.\n\n\"원수 각하, 지하로 들어간 자들을 쫓을까요?\""
 lr_integration.122.a:0 "요새와 감시 초소를 촘촘히 세운다."
 lr_integration.122.b:0 "밀수꾼을 눈감아 주고 정보원으로 쓴다."
 lr_integration.122.t:0 "산맥의 수비대"
 lr_integration.122.d:0 "쥐라산맥의 국경 초소. 눈이 무릎까지 쌓였다. 원수는 이 산맥을 베르됭처럼 지킬 수 있는 땅이라고 평했다.\n\n수비대장이 첫 보고를 보내 온다. 산골 마을 사람들은 조용하다. 시계 공방은 다시 돌기 시작했고, 치즈 협동조합은 세금을 냈다. 그러나 스위스 쪽으로 넘어가는 밀수꾼 길이 수십 개다. 담배, 시계, 그리고 사람.\n\n원수가 보고서 여백에 한 줄을 적다. 산은 막을 수 있다. 사람은 어떤가."
 lr_integration.123.a:0 "옛 장교들을 산악 부대에 받아들인다."
 lr_integration.123.b:0 "교회와 지방 귀족에게 행정을 맡긴다."
 lr_integration.123.t:0 "토리노의 원수"
 lr_integration.123.d:0 "토리노 왕궁의 연병장. 원수가 직접 찾아와 사르데냐 왕국의 옛 장교들을 사열한다. 그들은 대전쟁에서 알프스의 눈 속에서 프랑스와 싸웠던 사람들이다.\n\n장교들은 이를 악물고 서 있다. 모욕을 각오한 얼굴들이다. 그러나 원수는 패자를 모욕하지 않는다. 그는 평생 군인을 군인으로 대했다. 그는 맨 앞의 늙은 대령 앞에 멈춰 선다.\n\n\"귀관들은 용감하게 싸웠소. 나는 그 산에서 귀관들의 포격을 기억하오. 이제 같은 깃발 아래 싸웁시다.\""
 lr_integration.124.a:0 "청년 작업장의 청년들을 보낸다. 삽을 드는 것도 조국을 위한 일이다."
 lr_integration.124.b:0 "현지 독일인 노동자를 고용한다. 임금이 충성을 산다."
 lr_integration.124.t:0 "베르됭의 교훈"
 lr_integration.124.d:0 "라인강 서안의 언덕. 원수가 망원경으로 강 건너를 바라본다. 베르됭에서 그는 버티는 법을 가르쳤다. 이제 그는 다시는 버틸 필요가 없게 만들려 한다.\n\n언덕 아래로 대전쟁의 참호 자국이 아직 남아 있다. 풀이 자랐지만 비가 오면 지그재그 선이 드러난다. 원수는 그 선을 오래 바라보다가 망원경을 내렸다.\n\n공병대가 마지노선의 연장 계획을 펼친다. 라인강을 따라 콘크리트 요새가 이어질 것이다.\n\n원수가 묻는다. 공사 인력을 어디서 구할 것인가."
 lr_integration.125.a:0 "제국의 도로 나눈다. 알제리는 프랑스다."
 lr_integration.125.b:0 "아랍 왕국으로 삼아 자치를 준다."
 lr_integration.125.t:0 "황제의 알제리"
 lr_integration.125.d:0 "알제 총독 관저. 황제는 이 땅을 잘 안다. 그는 알제리 반란 진압으로 이름을 얻었다.\n\n황제가 관저 발코니에 선다. 반란 때 그가 지휘했던 알제리 소총병 연대의 생존자들이 광장에 모였다. 그들은 그를 장군이라고 부른다. 아직 아무도 그를 황제라고 부르지 않는다.\n\n황제의 칙령은 두 갈래다. 하나는 알제리를 제국의 도로 나누는 것, 다른 하나는 아랍 왕국으로 삼아 토착 대가문에게 자치를 주는 것.\n\n\"나는 이 사람들과 함께 싸웠다. 그들을 신민으로 만들 수도, 동맹으로 만들 수도 있다.\""
 lr_integration.126.a:0 "안트베르펜에 대함대 기지를 짓는다. 권총에 총알을 넣는다."
 lr_integration.126.b:0 "왈롱 탄광과 공장에 투자한다. 제국은 석탄으로 움직인다."
 lr_integration.126.t:0 "스헬더 하구 도"
 lr_integration.126.d:0 "안트베르펜 항구. 황제가 부두에 서서 북해를 바라본다. 그는 이 항구를 영국의 심장을 겨눈 권총이라 불렀다.\n\n부두에는 영국 상선 세 척이 묶여 있다. 대륙봉쇄령이 내려지기 전에 들어온 배들이다. 선장들은 매일 아침 항만청에 출항 허가를 묻고, 매일 같은 대답을 듣는다. 내일.\n\n벨기에는 이제 스헬더 하구, 다일, 주르마프 같은 제국의 도로 나뉜다. 1795년 혁명 프랑스가 처음 그었던 도의 경계선이 다시 쓰인다.\n\n해군 장관이 묻는다. 안트베르펜을 군항으로 만들까요?"
 lr_integration.127.a:0 "금고는 손대지 않는다. 은행가는 친구로 둔다."
 lr_integration.127.b:0 "심플롱 군용 도로를 닦는다. 대포가 알프스를 넘는다."
 lr_integration.127.t:0 "알프스의 길"
 lr_integration.127.d:0 "제네바 호숫가. 칼뱅의 도시가 레만 도의 청사가 된다. 발레의 산골 마을에는 심플롱 도라는 이름이 붙는다.\n\n호숫가 산책로에서는 은행가들이 평소처럼 아침 산책을 한다. 그들은 대포 소리가 들릴 때도 산책을 거르지 않았다. 제네바의 금고는 지난 세기 동안 다섯 개의 정권을 보았다.\n\n황제는 심플롱 고개에 이탈리아로 가는 군용 도로를 놓으라고 명령했다. 대포가 지나갈 수 있는 길이어야 한다고.\n\n제네바의 은행가들이 도지사를 찾아왔다. 그들의 금고는 누구의 것이 됩니까?"
 lr_integration.128.a:0 "사르데냐섬을 왕가에게 남기고 본토만 갖는다."
 lr_integration.128.b:0 "왕가를 폐위하고 모든 땅을 제국에 넣는다."
 lr_integration.128.t:0 "토리노의 도지사"
 lr_integration.128.d:0 "토리노 왕궁. 사르데냐 왕가의 문장 대신 황제의 독수리가 걸린다. 피에몬테는 포, 세지아, 마렝고 같은 제국의 도로 나뉜다.\n\n왕궁 지하 서고에서 사르데냐 왕가의 문서 수천 상자가 나왔다. 그중 한 상자에는 대전쟁 때 프랑스 침공 계획서가 들어 있었다. 도지사는 그 상자를 파리로 보냈다.\n\n마렝고. 황제는 그 이름이 마음에 든다고 했다. 언젠가 그곳에서 큰 승리를 거둘 것 같은 이름이라고.\n\n도지사가 묻는다. 사르데냐 왕가를 어떻게 할까요?"
 lr_integration.129.a:0 "나폴레옹 법전을 바로 시행한다. 봉건의 잔재를 오늘 끝낸다."
 lr_integration.129.b:0 "징병부터 한다. 라인의 아들들은 좋은 병사다."
 lr_integration.129.t:0 "라인의 도"
 lr_integration.129.d:0 "마인츠 대성당 광장. 라인강 서안이 몽토네르, 루르, 자르, 라인모젤의 네 도로 나뉜다. 1797년 혁명 프랑스가 처음 그었던 경계선이다.\n\n마인츠 대성당의 종이 울린다. 종지기는 프로이센 시절에도, 그 전의 대주교 시절에도 같은 종을 쳤다. 그는 누가 다스리든 종은 같은 소리를 낸다고 말한다.\n\n강 건너편의 라인 연방 군주들은 황제의 보호국이다. 강은 이제 국경이 아니라 제국의 한가운데를 흐른다.\n\n도지사가 묻는다. 법전을 바로 시행할까요?"
 lr_integration.130.a:0 "항구는 열어 둔다. 상인이 웃어야 세금도 웃는다."
 lr_integration.130.b:0 "대륙봉쇄를 이 항구에도 적용한다."
 lr_integration.130.t:0 "암스테르담의 독수리"
 lr_integration.130.d:0 "암스테르담 왕궁. 1795년 혁명 프랑스가 세웠던 바타비아 공화국은 2차 대불전쟁 때 무너졌다. 황제는 이번에는 자매 공화국을 세우지 않는다. 네덜란드는 자위더르해, 스헬더 하구, 마스 하구의 도가 된다.\n\n운하를 따라 늘어선 상인들의 저택은 모두 창문이 크다. 네덜란드에서는 창문 크기로 세금을 매겼고, 상인들은 자랑삼아 더 크게 냈다. 오늘 그 창문들의 커튼이 모두 닫혀 있다.\n\n상인들은 말없이 칙령을 듣는다. 그들의 공화국은 왕들의 유럽에서 몇 안 되는 의회의 나라였다.\n\n\"세관과 항구는 어떻게 할까요?\""
 lr_integration.131.a:0 "교황을 바티칸에 남겨 둔다. 순교자는 필요 없다."
 lr_integration.131.b:0 "교황청을 파리로 옮긴다."
 lr_integration.131.t:0 "캄피돌리오의 칙령"
 lr_integration.131.d:0 "로마 캄피돌리오 언덕. 황제의 칙령이 로마를 제국의 두 번째 도시로 선포한다. 피렌체에는 아르노 도의 깃발이 걸린다.\n\n캄피돌리오의 계단 아래로 포로 로마노의 폐허가 펼쳐진다. 황제는 그 폐허를 오래 내려다보았다. 수행원 하나가 시저도 여기 섰을 것이라고 말하자, 황제는 시저의 시신이 저 아래 광장에서 불태워졌다고 대답했다.\n\n바티칸의 창문은 굳게 닫혀 있다. 교황은 황제에게 파문 칙서를 쓸지 고민하고 있다. 황제는 대관식 때 교황의 손에서 왕관을 받지 않았다.\n\n\"폐하, 교황을 어떻게 하시겠습니까?\""
 lr_integration.132.a:0 "카탈루냐어를 허락한다. 마드리드보다 나은 주인이 되자."
 lr_integration.132.b:0 "프랑스어만 쓴다. 도는 도일 뿐이다."
 lr_integration.132.t:0 "몬세라트와 테르"
 lr_integration.132.d:0 "바르셀로나, 람블라스 거리. 황제의 포고문이 붙었다. 카탈루냐는 몬세라트, 테르, 세그레, 에브르 하구의 네 도로 나뉜다.\n\n카탈루냐 사람들은 마드리드도 파리도 좋아하지 않는다. 포고문 앞에 모인 사람들은 아무 말 없이 읽고 흩어진다. 그날 밤 포고문 절반이 찢겼다.\n\n황제가 보낸 도지사는 부임 첫날, 카탈루냐어 신문을 금지하지 않겠다고 약속했다. 마드리드는 백 년 동안 그것을 금지했다. 이제 파리에서 전보가 온다. 그 약속을 지킬 것인가."
 lr_integration.133.a:0 "슬로베니아어 학교를 연다. 빈이 하지 않은 일을 파리가 한다."
 lr_integration.133.b:0 "트리에스테와 자다르를 군항으로 만든다. 아드리아해를 쥔다."
 lr_integration.133.t:0 "류블랴나의 원수"
 lr_integration.133.d:0 "류블랴나 성 아래 광장. 합스부르크의 아드리아해 해안이 제국의 일리리아 주가 된다. 고대 로마의 속주 이름이다. 황제의 원수 하나가 첫 총독으로 부임한다.\n\n광장에 모인 사람들 가운데 몇몇은 손에 슬로베니아어로 쓴 청원서를 들고 있다. 학교와 관청에서 자기 말을 쓰게 해 달라는 내용이다. 빈은 50년 동안 그 청원서를 받지 않았다.\n\n슬로베니아 사람들은 빈의 독일어 관리들보다 파리의 관리들이 자기 말을 더 존중해 주기를 기대한다.\n\n총독이 첫 칙령의 내용을 고른다."
 lr_integration.134.a:0 "항구를 열어 둔다. 상인들이 제국을 위해 돈을 벌게 하라."
 lr_integration.134.b:0 "밀수꾼을 잡고 영국 배를 막는다."
 lr_integration.134.t:0 "함부르크의 도지사"
 lr_integration.134.d:0 "함부르크 시청. 황제는 영국 상품의 밀수를 막으려고 북해 해안을 통째로 합병한다. 엘베 하구, 베저 하구, 엠스 상류의 도가 생긴다.\n\n시청 지하의 라츠켈러에서는 한자 상인들이 7백 년 된 와인 통을 열었다. 함부르크가 자유도시로 마시는 마지막 와인이라고. 도지사도 한 잔 받았다.\n\n한자 동맹의 상인들은 700년 동안 왕도 황제도 모시지 않았다. 그들은 대륙봉쇄가 이 항구까지 온다는 소문에 장부를 덮는다.\n\n도지사가 묻는다. 함부르크의 항구를 어떻게 할까요?"
 lr_integration.135.a:0 "알제리 노동자를 붉은 대육군에 받아들인다."
 lr_integration.135.b:0 "토지를 농민에게 나누고 자치 평의회를 세운다."
 lr_integration.135.t:0 "카스바의 통령"
 lr_integration.135.d:0 "알제 부두. 통령이 직접 찾아왔다. 그는 이 땅의 반란을 진압하며 이름을 얻었고, 이제 같은 땅에 붉은 깃발을 들고 돌아왔다.\n\n하역장 아래 모인 부두 노동자들 가운데 몇몇은 반란 때 그의 부대와 싸웠던 사람들이다. 하나는 그때 입은 총상 자국을 셔츠를 걷어 보여 준다. 통령은 그 자국에서 눈을 돌리지 않았다.\n\n부두 노동자들은 그를 반신반의한다. 진압군 장교가 해방자가 될 수 있느냐고.\n\n통령이 하역장 위에 올라선다. \"나는 그때 왕의 명령을 따랐다. 이제 인민의 명령을 따른다.\""
 lr_integration.136.a:0 "약속이 먼저다. 탄광은 광부의 것이다."
 lr_integration.136.b:0 "전쟁이 먼저다. 혁명을 지켜야 약속도 지킨다."
 lr_integration.136.t:0 "샤를루아의 붉은 별"
 lr_integration.136.d:0 "샤를루아 탄광. 붉은 대육군이 들어오자 광부들이 갱도에서 나와 환호했다. 통령은 탄광을 광부 평의회에 넘기겠다고 약속했다.\n\n광부들은 갱도에서 나오자마자 붉은 대육군 병사들에게 커피와 빵을 나눠 주었다. 병사들 가운데 다수가 프랑스 북부 탄광 출신이다. 몇몇은 국경 너머에 사촌이 있다.\n\n그런데 붉은 대육군의 병참 장교는 석탄이 먼저 전선으로 가야 한다고 말한다.\n\n광부 평의회 대표가 통령에게 묻는다. 약속이 먼저입니까, 전쟁이 먼저입니까?"
 lr_integration.137.a:0 "금고를 몰수한다. 왕들의 금은 인민의 것이다."
 lr_integration.137.b:0 "금고를 봉인해 두고 협상 카드로 쓴다."
 lr_integration.137.t:0 "제네바의 은행"
 lr_integration.137.d:0 "제네바 호숫가. 붉은 대육군이 은행가들의 도시에 들어왔다. 칼뱅의 도시는 이제 인민 공화국의 레만 도다.\n\n은행가들은 달아나지 않았다. 그들은 정장을 입고 은행 문 앞에 서서 혁명 위원들을 맞았다. 그들 뒤의 지하 금고에는 유럽 왕실들의 금이 잠들어 있다. 호엔촐레른, 합스부르크, 그리고 윈저.\n\n혁명 위원들은 그 금을 혁명의 군자금으로 쓰자고 한다. 외무위원은 그 금이 왕들과의 협상에서 무엇보다 강한 카드라고 말한다. 통령이 결정해야 한다."
 lr_integration.138.a:0 "이탈리아 혁명의 거점으로 자치를 준다."
 lr_integration.138.b:0 "프랑스 인민 공화국의 도로 묶는다."
 lr_integration.138.t:0 "토리노의 노동자들"
 lr_integration.138.d:0 "토리노 피아트 공장. 붉은 대육군이 들어오기 전에 노동자들이 먼저 공장을 점거했다. 이탈리아에서 가장 붉은 도시다.\n\n공장 지붕 위에는 붉은 깃발과 함께 이탈리아 삼색기가 걸려 있다. 노동자들은 둘 다 내리지 않겠다고 한다. 붉은 대육군의 위원은 그 깃발 두 개를 올려다보며 한참 서 있었다.\n\n통령은 토리노를 이탈리아 혁명의 거점으로 삼고 싶어 한다. 그러나 이 땅은 이제 프랑스의 도다.\n\n토리노 평의회 대표가 묻는다. 우리는 프랑스인이 되는 겁니까, 이탈리아 혁명가로 남는 겁니까?"
 lr_integration.139.a:0 "독일어를 공용어로 함께 쓴다."
 lr_integration.139.b:0 "징병부터 한다. 라인의 노동자들은 좋은 병사다."
 lr_integration.139.t:0 "쾰른의 평의회"
 lr_integration.139.d:0 "쾰른 시청. 라인강 서안의 노동자 평의회들이 프랑스 인민 공화국 편입을 결의했다. 프로이센의 관리들은 강 건너로 달아났다.\n\n쾰른 대성당 앞 광장은 사람들로 가득 찼다. 통령은 프랑스어로 연설했고, 통역이 한 문장씩 독일어로 옮겼다. 통역이 끝날 때마다 박수가 반 박자 늦게 나왔다.\n\n통령이 쾰른 대성당 앞에서 연설한다. 이 땅의 노동자들은 독일인이기 전에 노동자라고.\n\n그러나 평의회의 독일인 대표들은 독일어로 연설해 달라고 요청한다."
 lr_integration.140.a:0 "무역 회사를 국유화한다. 바다의 이윤은 인민의 것이다."
 lr_integration.140.b:0 "상인들에게 혁명 채권을 사게 한다."
 lr_integration.140.t:0 "암스테르담 부두"
 lr_integration.140.d:0 "암스테르담 부두. 붉은 대육군이 상인 공화국의 수도에 들어왔다. 부두 노동자들은 환호하고, 운하 저택의 상인들은 창문을 닫았다.\n\n몰수된 장부는 3백 년 치다. 향신료와 비단과 노예의 기록이 같은 잉크로 적혀 있다. 장부를 넘기던 젊은 위원이 어느 페이지에서 손을 멈추고 오래 읽었다.\n\n통령은 네덜란드 동인도 회사의 옛 장부를 몰수하라고 명령했다. 혁명이 처음 손에 넣은 해외 무역망이다.\n\n위원이 묻는다. 상인들을 어떻게 할까요?"
 lr_integration.141.a:0 "교회 재산을 국유화하되 교황은 건드리지 않는다."
 lr_integration.141.b:0 "바티칸을 봉쇄한다. 혁명에 두 주인은 없다."
 lr_integration.141.t:0 "교황과 통령"
 lr_integration.141.d:0 "로마 캄피돌리오 언덕. 1798년 혁명 프랑스가 세웠던 로마 공화국의 이름이 140년 만에 다시 불린다. 이번에는 인민 공화국이다.\n\n광장 한쪽에서는 혁명 위원들이 붉은 깃발을 올리고, 다른 쪽에서는 늙은 여인들이 묵주를 돌린다. 두 무리 사이의 거리는 스무 걸음이다. 아무도 그 스무 걸음을 건너지 않는다.\n\n바티칸의 창문은 굳게 닫혀 있다. 혁명 위원들은 교회 재산을 국유화하자고 한다. 통령은 대관식 대신 붉은 깃발을 택했지만, 이탈리아 농민들이 성당에 다닌다는 것도 안다.\n\n\"교황을 어떻게 하시겠습니까?\""
 lr_integration.142.a:0 "조합의 자치를 인정한다. 바르셀로나는 바르셀로나가 다스린다."
 lr_integration.142.b:0 "정치위원을 보내 조합을 통제한다. 혁명에는 하나의 지휘가 필요하다."
 lr_integration.142.t:0 "바르셀로나의 조합들"
 lr_integration.142.d:0 "바르셀로나 람블라스 거리. 붉은 대육군을 맞이한 것은 검붉은 깃발의 조합원들이었다. 이 도시의 노동자들은 공산주의자보다 아나키스트가 많다.\n\n람블라스 거리의 꽃가게들은 문을 닫지 않았다. 조합원들은 붉은 대육군 병사들에게 카네이션을 건넸지만, 위원들에게는 건네지 않았다. 그 차이를 모두가 보았다.\n\n조합 대표가 통령에게 말한다. 우리는 마드리드의 왕을 몰아내는 데 기꺼이 함께했다. 그러나 파리의 위원을 모시려고 싸운 것은 아니라고.\n\n통령이 결정해야 한다."
 lr_integration.143.a:0 "세 언어를 모두 쓴다. 노동자는 모두 같다."
 lr_integration.143.b:0 "조선소를 붉은 함대 건조에 돌린다."
 lr_integration.143.t:0 "트리에스테의 조선공들"
 lr_integration.143.d:0 "트리에스테 조선소. 합스부르크의 항구가 인민 공화국의 일리리아 주가 되었다. 이탈리아인과 슬로베니아인과 크로아티아인 조선공들이 처음으로 같은 평의회에 앉았다.\n\n그리고 첫날부터 싸운다. 회의록을 어느 말로 쓸 것인가. 이탈리아인들은 이 도시가 원래 자기들 것이라 하고, 슬라브인들은 조선소를 실제로 돌리는 건 자기들이라 한다.\n\n통령이 보낸 위원이 회의실 뒤에서 그 모습을 지켜보다가, 결국 파리에 전보를 친다. 어느 말로 회의를 할까요."
 lr_integration.144.a:0 "영국 노동자에게 연대의 배를 띄운다."
 lr_integration.144.b:0 "항구를 봉쇄한다. 섬나라를 굶긴다."
 lr_integration.144.t:0 "함부르크 부두의 평의회"
 lr_integration.144.d:0 "함부르크 부두. 독일에서 가장 붉은 항구의 부두 노동자들이 붉은 대육군을 맞이했다. 한자 상인들의 시청에 붉은 깃발이 올라간다.\n\n부두 창고에는 영국 노동자들에게 보낼 밀가루와 통조림이 벌써 쌓여 있다. 부두 노동자 조합이 한 달치 임금을 모아 산 것이다. 상자마다 영어로 같은 글귀가 적혀 있다. 함부르크에서 형제들에게.\n\n통령은 영국 배를 막으라고 명령했다. 그러나 부두 노동자들은 영국의 차티스트들에게 보낼 화물을 싣고 싶어 한다.\n\n위원이 묻는다. 영국 배를 막을까요, 영국 노동자에게 보낼 배를 띄울까요?"
 lr_election.1.t:0 "총선"
 lr_election.1.d:0 "선거 운동 마지막 주. 파리의 벽마다 포스터가 세 겹으로 붙었다. 카페에서는 신문을 펼친 사람들이 목소리를 높이고, 시골 장터에서는 후보들이 수레 위에 올라가 연설한다.\n\n개표가 끝나 간다. 지역별 여당 득표: 파리 [?LR_vote_paris|0]% · 북부 [?LR_vote_nord|0]% · 방데 [?LR_vote_vendee|0]% · 남부 [?LR_vote_midi|0]% · 론 [?LR_vote_rhone|0]% · 로렌 [?LR_vote_lorraine|0]% · 북아프리카 [?LR_vote_africa|0]%. 여당 의석은 §Y[?LR_election_forecast|0]§!석, 지난 의회보다 §Y[?LR_election_swing|+0]§!석이다. 선거 운동 본부가 공들인 지역이 결과를 갈랐다.\n\n선거 운동의 마지막 메시지를 고른다."
 lr_election.1.a:0 "지난 임기의 업적을 내세운다."
 lr_election.1.b:0 "조국과 군대를 앞세운다. 의석 +6"
 lr_election.1.c:0 "야당의 추문을 터뜨린다. 의석 +12, 안정도 -3%"
 lr_election.2.t:0 "불신임안"
 lr_election.2.d:0 "부르봉 궁 회의장. 야당 대표가 연단에 올라 불신임안을 읽어 내려간다. 내각이 과반을 잃은 지 여섯 달, 의원 117명이 서명했다.\n\n방청석은 기자들로 꽉 찼다. 표결 결과를 맞히는 내기가 벌써 의사당 매점에서 돌고 있다. 배당률은 내각 쪽이 세 배다.\n\n\"이 내각은 프랑스를 다스리는 것이 아니라 버티고 있을 뿐입니다!\"\n\n여당 원내대표가 총리에게 쪽지를 건넨다. 연정을 꾸리려면 장관 자리 셋이 필요하고, 그게 싫다면 국민에게 직접 묻는 수밖에 없다."
 lr_election.2.a:0 "연정을 꾸린다. 장관 자리 셋을 내준다. 의석 +45"
 lr_election.2.b:0 "의회를 해산하고 조기 총선을 치른다."
 lr_election.2.c:0 "표결을 버틴다. 정부는 물러나지 않는다."
