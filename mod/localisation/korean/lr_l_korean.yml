 LR_tt_bourbon:0 "§G부르봉 루트§! 진입: 이 루트의 중점이 열립니다."
 LR_tt_revolution_coming:0 "10일 뒤 §R혁명§!이 일어납니다."
 LR_tt_election:0 "§Y선거전 중점§!이 열립니다. 중점에서 뜨는 이벤트의 선택에 따라 사회주의 또는 의회파가 승리합니다."
 LR_tt_vote_left:0 "§R사회주의§! 표가 늘어납니다. 두 번 모두 고르면 사회주의가 승리합니다."
 LR_tt_vote_parliament:0 "§B의회파§! 표가 늘어납니다."
 LR_tt_communist:0 "§G사회주의 루트§! 진입: 이 루트의 중점이 열립니다."
 LR_tt_cabinet:0 "§Y내각 구성 중점§!이 열립니다. 그 이벤트에서 내각을 이끌 정파를 고릅니다."
 LR_tt_jacobin:0 "§G산악파 루트§! 진입: 이 루트의 중점이 열립니다."
 LR_tt_girondin:0 "§G지롱드 루트§! 진입: 이 루트의 중점이 열립니다."
 LR_tt_marais:0 "§G푀양파 루트§! 진입: 이 루트의 중점이 열립니다."
 LR_tt_napoleon:0 "§G숨은 루트 나폴레옹§! 진입: 산악파 중점 대신 새 줄기가 열립니다."

 lr_france.3.t:0 "알제리의 수렁"
 lr_france.3.d:0 "전쟁부 타자수 쉬잔 가르니에는 같은 마을 이름을 세 번째 쳤다. 아틀라스 산맥의 이름 모를 계곡이었다. 석 달이면 끝난다던 원정은 여섯 달째였다. 들어간 대대는 지도에 없는 길에서 사라졌고, 사령부는 전사자 명단을 매주 고쳐 보냈다.\n\n명단은 파리로 왔다. 가르니에가 사는 벨빌에서는 어머니들이 우체부를 보면 문을 닫았다. 아래층 빵집 주인 아들의 이름은 지난주 명단에 있었다. 빵값은 전비 때문에 몇 주 만에 또 올랐다. 르노 공장의 파업은 생드니로, 다시 릴로 번졌다. 경찰이 지운 벽보는 다음 날 아침 더 크게 붙었다.\n\n가장 나쁜 소식은 병영에서 왔다. 마르세유로 가던 신병 열차에서 금지된 전단이 나왔다. 한 줄이었다. 왜 왕을 위해 죽는가.\n\n그 전단이 튈르리 궁으로 올라간 날, 가르니에는 전쟁부 장관의 받아쓰기를 맡았다. 장관은 궁에서 돌아와 아무것도 부르지 않고 한참 앉아 있다가 말했다. 늙은 왕이 안경을 벗고 얼마나 더 버틸 수 있겠느냐고 묻더라고. 아무도 대답하지 못했다고. 그리고 가르니에에게 오늘은 그만 들어가라고 했다."
 lr_france.3.a:0 "조금만 더 버티면 된다."

 LR_FRA_resistance_high:0 "격화된 저항"
 LR_FRA_resistance_high_desc:0 "저항 세력이 나라 곳곳에서 정부를 흔들고 있습니다. 지방 정세 패널에서 진압하거나 회유하세요."




 lr_france.40.t:0 "봉기"
 lr_france.40.d:0 "내무부 상황실 당직 서기관 루이즈 페로는 새벽 세 시에 전화 다섯 대가 한꺼번에 울리는 소리를 처음 들었다.\n\n도청이 불탔다는 보고와 헌병대 막사가 포위됐다는 보고, 철도가 끊겼다는 보고가 잇따랐다. 페로는 수화기를 어깨에 끼운 채 받아 적으며 벽에 걸린 지도에 붉은 핀을 꽂아 나갔는데, 한 시간 만에 핀이 열한 개나 늘어났다. 반발을 달래지 못한 지방들이 마침내 무기를 든 것이었다.\n\n다섯 시에 내무장관이 잠옷 위에 외투만 걸친 채 들어왔다. 지도를 한참 노려보던 장관이 참모본부 연락장교를 부르자, 연락장교는 차렷 자세로 봉기가 세 번 일어나거나 반발이 80을 넘는 지방이 세 곳이 되면 군이 직접 나서야 한다는 게 참모본부의 의견이라고 보고했다.\n\n장관은 입술만 깨물고 서 있었다. 페로는 그 침묵이 무엇을 뜻하는지 알고 있었다. 군이 직접 나선다는 건 진압만을 뜻하는 말이 아니었다. 그녀가 붉은 핀 상자를 내려다보니, 핀은 아직도 수북이 남아 있었다."
 lr_france.40.a:0 "군을 보내. 그리고 그쪽 요구도 받아 적어 와."

 LR_FRA_gov_guardian:0 "공화국의 수호자"
 LR_FRA_gov_guardian_desc:0 "숨은 루트: 공화국의 수호자. 나폴레옹은 황제가 아니라 대통령으로 공화국을 지킵니다."
 LR_tt_guardian:0 "§G공화국의 수호자 루트§! 진입: 황제의 길이 닫히고 대통령의 줄기가 열립니다. 국민의회가 되돌아옵니다."
 lr_france.33.t:0 "왕관을 거절하다"
 lr_france.33.d:0 "그날 오후 그는 의회를 다시 소집하겠다고 발표했다. 석 달 뒤 대통령 선거에 자신도 후보로 나서겠다고 했다.\n\n원수들은 공작 작위 대신 선거 운동 본부를 받았다. 뮈라는 저녁 아홉 시 혼자 술을 마셨다. 몇몇 원수는 짐을 쌌고, 몇몇은 다음 날 아침 선거 사무실에 나타났다. 뮈라는 사흘 뒤에 나타났다.\n\n빈과 런던의 대사관에서는 자정이 넘도록 전보가 오갔다. 황제라면 어떻게 다룰지 알았다. 왕관을 거절하는 군인에 대해서는 본국에 보낼 훈령의 첫 줄도 쓰지 못했다. 빈 대사관의 서기관은 새벽 세 시에 펜을 내려놓았다."
 lr_france.33.a:0 "대통령 만세! 공화국 만세!"
 lr_news.3.t:0 "왕관을 거부한 장군"
 lr_news.3.d:0 "프랑스의 나폴레옹 보나파르트가 대관식 당일 제위를 거절하고 연미복 차림으로 대통령 선거에 나섰습니다. 연병장에 모인 병사들이 환호했는지 울었는지는 알 수 없었다고 파리 특파원들은 전합니다.\n\n왕과 귀족이 다스리는 유럽의 궁정들은 이 소식에 황제가 나타났을 때보다 더 불안해합니다. 황제는 언젠가 사위로 삼을 수 있습니다. 왕관을 스스로 거절한 군인과는 무슨 이야기를 해야 합니까?"
 lr_news.3.a:0 "차라리 황제였다면."

 lr_france.1.t:0 "알제리 반란"
 lr_france.1.d:0 "새벽 두 시, 왕은 혼자 남았다. 시종이 난로에 장작을 넣고 나간 뒤로 방에는 지도와 왕뿐이었다.\n\n대전쟁으로 인도차이나와 적도 아프리카를 내주었다. 지금 프랑스가 아직 제국이라고 말할 수 있는 근거는 지중해 건너 알제리 하나뿐이다. 이것마저 잃으면 루이 20세는 가장 많은 땅을 잃은 프랑스 왕으로 남는다. 왕은 그걸 알았다.\n\n싸우면 돈이 든다. 돈이 없으면 세금을 올려야 하고, 세금을 올리면 생드니의 그 담벼락에 글귀가 하나 더 붙을 것이다. 싸우지 않으면 장군들이 남는다. 오늘 밤 베강의 얼굴, 그리고 말없이 나간 오를레앙 공의 뒷모습.\n\n왕은 펜을 들었다가 내려놓았다. 어느 쪽에 서명하든 아침이면 누군가는 그를 용서하지 않을 것이다."
 lr_france.1.a:0 "더는 피를 흘릴 수 없다. 군대를 철수하라."
 lr_france.1.b:0 "알제리는 프랑스다. 진압하라!"

 lr_france.2.t:0 "튈르리의 결판"
 lr_france.2.d:0 "오후 네 시, 궁전 지붕의 깃발이 내려갔다. 봉스는 철문 옆 화단에 앉아 그걸 보고 있었다. 왼쪽 소매가 찢어져 있었는데 언제 그랬는지 기억나지 않았다.\n\n파리 사람들은 창문을 닫고 커튼 틈으로 지붕을 보았다. 어느 왕의 깃발이 올라가는지. 사망자는 열넷이었다. 그중 둘은 근위대, 다섯은 샬롱 연대, 나머지는 구경하러 나왔던 시민이었다. 봉스와 담배를 나눠 피운 중사는 무사했다. 봉스는 그게 다행이라고 생각했고, 그렇게 생각하는 자신이 조금 이상했다.\n\n깃발이 다시 올라가기 시작했다."
 lr_france.2.a:0 "오를레앙 만세! 복수의 왕이 왔다."
 lr_france.2.b:0 "반역자들을 진압하라. 왕좌는 흔들리지 않는다."

 lr_france.10.t:0 "혁명"
 lr_france.10.d:0 "다음 날 아침, 시청 발코니에 처음 보는 사람들이 섰다. 노조 간부, 국민학교 교사, 다리를 저는 퇴역 대위, 그리고 어제까지 공장에 있던 사람들. 그 사이에 자크 모렐도 있었다. 왜 거기 서 있는지 본인도 잘 몰랐다.\n\n그들은 스스로를 민중의 임시 정부라고 불렀다. 첫 포고문은 두 줄이었다. 알제리에서 군대를 철수한다. 남자든 여자든, 부자든 가난하든, 모든 프랑스 시민이 투표하는 총선을 치른다.\n\n포고문을 읽는 건 교사가 맡았다. 모렐은 그 옆에서 광장을 내려다봤다. 폴 지로와 그 어머니가 군중 속 어딘가에 있었을 텐데 찾을 수는 없었다. 교사가 둘째 줄을 다 읽자 광장이 한꺼번에 소리를 질렀다."
 lr_france.10.a:0 "공화국 만세!"

 lr_france.11.t:0 "선거전: 토지와 공장"
 lr_france.11.d:0 "소르본 법대생 앙투안 르루는 생미셸 대로의 벽보 앞에서 한 시간째 서 있었다. 왕이 달아난 뒤 파리는 벽보의 도시였다. 임시 정부 포고문 위에 노동총동맹 격문이, 그 위에 공화주의자 클럽 호소문이 붙었다. 다음 날 아침이면 또 새 종이가 덧발렸다. 프랑스 역사상 처음으로 모든 시민이 표를 던지는 선거였다.\n\n첫 번째 쟁점은 공장이었다. 혁명 첫날 사장들이 달아난 공장에서 노동자들은 평의회를 꾸려 스스로 기계를 돌렸다. 앙투안은 어제 르노 공장 평의회의 집회에 가 보았다. 연단의 선반공이 물었다. 왕을 몰아낸 것이 우리인데 왜 사장이 돌아와야 하느냐고. 박수가 오 분 동안 이어졌다.\n\n오늘 아침에는 법대 교수의 강의를 들었다. 교수는 재산을 지켜 주지 않으면 은행이 문을 닫고, 빵값이 다시 뛰고, 혁명은 일 년 안에 굶어 죽는다고 했다. 그 말에도 고개를 끄덕이는 학생이 많았다.\n\n점심때 학생 식당에서는 1793년 역사책을 끼고 다니는 친구들이 서로를 지롱드와 산악파로 부르며 멱살을 잡았다. 앙투안은 둘을 떼어 놓다가 안경이 부러졌다. 그는 아직 누구를 찍을지 정하지 못했다."
 lr_france.11.a:0 "공장은 일하는 자의 것이다."
 lr_france.11.b:0 "혁명도 법 안에서 해야 한다."
 lr_france.12.t:0 "선거전: 군대"
 lr_france.12.d:0 "뱅센 병영의 상병 르네 뒤크로는 담배를 피우며 정문 앞 탁자 위로 연설가들이 번갈아 올라서는 걸 구경했다. 한 시간 간격으로 오전에는 노동자 평의회 쪽이, 오후에는 의회파 쪽이 올라왔는데, 두 번째로 불붙은 쟁점은 군대의 총이었다.\n\n혁명 첫날 군대가 발포를 거부했기에 지금의 프랑스가 있을 수 있었다. 그날 튈르리 앞에서 발포 명령을 거부한 사람이 바로 뒤크로와 그의 동기들이었는데, 장교들은 대부분 아직도 왕이 내린 임관장을 서랍에 고이 간직하고 있었고 그의 중대장도 예외는 아니었다.\n\n평의회 쪽 연설가가 연대마다 병사 위원회를 두고 장교도 투표로 뽑자고, 왕당파 장군은 모조리 해임하자고 외치자 병사들은 휘파람을 불었다. 그러자 의회파 연설가가 북독일은 언제든 라인강을 건널 수 있다면서, 투표로 뽑은 취사병 출신 연대장이 전차를 막아 낼 수 있겠느냐고 되물었는데, 병사들은 이번에도 휘파람을 불었다.\n\n양쪽 이야기를 다 들은 뒤크로는 담배를 비벼 끄고 병영 안으로 들어갔다. 그의 어깨에는 여전히 소총이 걸려 있었고, 연설가들도 장교들도 그 총이 누구의 손에 들려 있는지를 한시도 잊지 않고 있었다."
 lr_france.12.a:0 "군대는 평의회의 명령을 받는다."
 lr_france.12.b:0 "장교단이 공화국에 충성하면 그걸로 됐다."
 lr_france.13.t:0 "총선 결과"
 lr_france.13.d:0 "파리 11구 투표소 관리인 마틸드 브리앙이 새벽 다섯 시에 문을 열었을 때 줄은 이미 길모퉁이를 돌아 저만치 이어져 있었다. 평생 처음 투표용지를 손에 쥐어 본 노인들이 어디에 표시하면 되느냐고 묻자, 그녀는 칸만 손가락으로 짚어 줄 뿐 누구 이름을 고르라는 말은 꾹 참았다. 그게 규칙이었다.\n\n오후가 되자 시골 소식이 하나둘 들어왔다. 어느 마을에서는 사제가 설교단에서 누구를 찍으라고 말했다가 신자들에게 쫓겨났다고 했는데, 그 정도 소동을 빼면 큰 충돌 없이 하루가 지나가자 신문들은 그것만으로도 기적이라고 써 댔다.\n\n개표는 밤새 이어졌다. 칠판에 숫자가 적힐 때마다 시청 앞 광장의 군중은 환호하거나 욕설을 퍼부었는데, 브리앙은 자기 투표소의 투표함을 직접 끌어안고 시청까지 걸어갔다. 함은 생각했던 것보다 훨씬 무거웠다.\n\n새벽 네 시, 임시 정부 수반이 창가에 서서 마지막 집계를 넘겨받는 모습을 브리앙은 광장에서 올려다보았다. 수반은 그 종이를 한참 동안 들여다보고 있었는데, 거기에는 프랑스가 스스로 고른 첫 번째 대답이 적혀 있을 터였다."
 lr_france.13.a:0 "사회주의 세력이 승리했다."
 lr_france.13.b:0 "의회파가 승리했다."
 lr_france.14.t:0 "내각 구성"
 lr_france.14.d:0 "오후 세 시에 신임 투표가 잡혔다. 세르방은 그 전에 한 쪽을 골라 총리 후보로 의회에 올려야 했다.\n\n산악파는 국가가 시민을 돌봐야 한다고 했다. 지롱드는 시장이 프랑스를 일으킨다고 했다. 푀양파는 왕관 아래의 질서만이 피를 멈춘다고 했다. 셋 다 틀린 말은 아니었다. 그리고 어느 쪽을 고르든 나머지 둘은 첫날부터 야당이 된다.\n\n세르방은 커피잔을 내려놓고 비서를 불렀다."
 lr_france.14.a:0 "산악파: 국가가 시민을 돌봐야 한다."
 lr_france.14.b:0 "지롱드: 시장이 프랑스를 일으킨다."
 lr_france.14.c:0 "푀양파: 왕관 아래 질서를."

 lr_france.30.t:0 "원정군 사령관"
 lr_france.30.d:0 "비서가 새 커피를 내려놓으며 물었다. \"총리님, 어느 분으로 하시겠습니까? 의회 서기가 일곱 시에 온답니다.\"\n\n총리는 깊은 한숨을 내쉬었다. 충성과 명성과 재능을 모두 갖춘 사람은 명단 어디에도 보이지 않았고, 그중 둘이라도 갖춘 사람조차 찾기 어려웠다. 그는 서류철을 다시 열었다가 이내 덮어 버렸다.\n\n그때만 해도 그는 자기가 무엇을 고르고 있는지 미처 알지 못했다. 훗날 쓴 회고록에서도 그는 이 밤에 대해서는 두 줄만 적고 서둘러 다음 장으로 넘어갔다."
 lr_france.30.a:0 "공화국에 충성하는 가믈랭을 보낸다."
 lr_france.30.b:0 "연륜 있는 페탱을 보낸다."
 lr_france.30.c:0 "떠오르는 신예 드골을 보낸다."
 lr_france.30.anyone:0 "에라, 아무나 보내!"
 lr_france.31.t:0 "알제리 수복"
 lr_france.31.d:0 "마르세유 항만청 무전병 장 바티스트 로시가 알제에서 온 전보를 받아 적은 건 오후 늦게였다. 삼색기가 총독 관저에 다시 올랐고 반란군 사령부가 항복했다는 두 줄짜리 전보였는데, 다 받아 적고 나서 연필을 내려놓은 로시는 아무도 없는 전신실에서 혼자 박수를 쳤다.\n\n이튿날 파리의 신문들은 그 두 줄을 1면 전체에 큼지막하게 찍어 냈다. 왕을 무너뜨린 그 땅을 공화국이 되찾았다는 것이었고, 총리가 의회에서 왕이 해내지 못한 일을 시민의 군대가 해냈다고 말하자 의원들은 일제히 일어나 손뼉을 쳤다.\n\n그 주에 돌아온 첫 수송선이 마르세유에 닿았을 때 로시는 부두에 나가 내리는 병사들을 지켜보았다. 웃는 얼굴이 꽤 많았지만, 맨 마지막에 내린 병사들의 눈빛만은 왕의 군대로 갔다가 돌아왔던 병사들의 눈빛과 크게 다르지 않았다. 카스바의 골목이 조용해졌다고는 해도 그 조용함을 곧이곧대로 믿는 장교는 부두 어디에서도 찾아보기 어려웠다.\n\n그날 항구의 사이렌은 하루 종일 울려 댔다. 저녁에 로시가 마지막으로 받은 전보는 참모본부에서 온 것이었는데, 귀환 부대는 북부 철도로 이동하라는 명령이었고 그 행선지는 라인강 쪽이었다."
 lr_france.31.a:0 "이제 라인강과 해협을 본다."
 lr_france.32.t:0 "아무나의 귀환"
 lr_france.32.d:0 "참모부 인사과의 오귀스트 뒤발 소령은 아무나 보내라는 명령서를 받아 들고 명단을 거꾸로 훑어 올라갔다. 맨 아래에 적힌 이름 하나가 눈에 들어왔는데, 코르시카 출신의 서른다섯 살 포병 대위 나폴레옹 보나파르트였다. 몇 해 전 아무도 읽지 않는 논문을 낸 사람이라 이 사람이라면 거절할 리 없겠다 싶어, 뒤발은 그 이름에 동그라미를 쳤다.\n\n몇 주 뒤 알제리에서 전보가 날아들기 시작했다. 반란군 사령부를 포위했다는 전보가 오더니 카스바가 함락되었다는 전보가, 이어서 아틀라스의 봉화가 꺼졌다는 전보가 들어왔는데, 하나같이 같은 이름으로 서명되어 있었다. 뒤발은 전보를 받을 때마다 서랍 속 명단을 꺼내 그 동그라미를 다시 들여다보았다.\n\n그사이 파리는 지쳐 가고 있었다. 공안위원회의 체포 명단은 매주 길어졌고 콩코르드 광장의 처형대는 몇 달째 그 자리를 지키고 서 있었다. 전쟁을 끝내겠다던 혁명이 아들들을 다시 알제리로 보내자 벨빌의 어머니들은 시청 벽에 붙은 첫 포고문 위에 검은 천을 내걸었고, 뒤발의 하숙집 여주인은 신문을 펼 때마다 왕을 쫓아낸 게 고작 이러려고였느냐며 혀를 찼다.\n\n대위가 승리한 군대를 이끌고 마르세유에 상륙하자 위원회는 군대를 해산하고 혼자 파리로 출두하라는 전보를 보냈다. 그는 전보를 읽고는 그대로 부관에게 돌려주었다. 리옹을 지날 때는 시민들이 길가로 나와 병사들에게 빵을 건넸고 파리로 오는 길목의 수비대는 총구를 하늘로 돌렸으며, 파리 시민들은 위원회를 지키러 나서는 대신 창가에 서서 다가오는 군대를 구경했다.\n\n튈르리 궁에 새 주인이 든 날, 인사과 책상을 정리하던 뒤발은 그 명단을 찾아냈다. 동그라미는 그때 그대로였다. 그는 그 종이를 곱게 접어 지갑에 넣었는데, 언젠가 손자에게 꼭 보여 주고 싶었기 때문이다."
 lr_france.32.a:0 "제1통령 만세!"

 lr_news.1.t:0 "알제리, 프랑스에 반기를 들다"
 lr_news.1.d:0 "알제에서 일어난 반란이 며칠 만에 오랑과 콩스탕틴까지 번졌습니다. 프랑스 총독부는 도시 대부분을 잃은 것으로 보이며, 반란군 지도부는 이미 독립을 선포했습니다.\n\n런던과 베를린, 빈의 신문들은 대전쟁의 패전국이 마지막 식민지마저 잃을 것인지 앞다투어 묻습니다. 어느 영국 귀족은 클럽에서 이렇게 말했다고 합니다. 프랑스는 언제나 불타고 나서야 움직이지만, 이번에는 탈 것이 얼마 남지 않았다고."
 lr_news.1.a:0 "프랑스의 시대는 끝났는가."
 lr_news.2.t:0 "파리의 쿠데타"
 lr_news.2.d:0 "유럽 모든 수도의 외무부가 오늘 아침 같은 질문을 했습니다. 도대체 이자는 누구인가? 코르시카 출신 포병 장교 나폴레옹 보나파르트는 몇 달 전만 해도 프랑스 육군 명부의 맨 아래에 있던 이름입니다.\n\n그는 알제리를 몇 주 만에 평정했고, 그 군대를 그대로 이끌고 마르세유에 상륙해 파리로 올라왔습니다. 그를 막으러 간 연대마다 그의 뒤를 따랐고, 공안위원회의 공포 정치와 다시 시작된 알제리 전쟁에 지친 파리 시민들은 그를 막지 않았습니다. 의회는 해산되었고, 의원들은 창문으로 달아났다고 합니다. 파리 주재 대사들은 황급히 그의 경력을 조사했지만, 보낼 만한 내용은 거의 찾지 못했습니다."
 lr_news.2.a:0 "도대체 이자는 누구인가?"




 LR_tt_crisis_opens:0 "§Y알제리 위기 중점§!이 열립니다. 진압할지 포기할지 중점으로 정합니다."
