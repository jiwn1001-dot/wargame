 LR_FRA_defeat:0 "대전쟁의 굴욕"
 LR_FRA_defeat_desc:0 "프랑스는 전쟁에 졌고, 북아프리카를 뺀 모든 식민지를 내주었습니다. 왕의 권위는 흔들리고 군인들은 복수를 말합니다."
 LR_JAP_han_autonomy:0 "번의 자치"
 LR_JAP_han_autonomy_desc:0 "막부는 나라를 열고 근대화했지만 중앙집권은 이루지 못했습니다. 유력한 번들은 함대와 공장을 따로 쥐고 있습니다."

 LR_FRA_orleans:0 "장 드 오를레앙"

 LR_FRA_algerian_crisis:0 "알제리 위기"
 LR_FRA_algerian_crisis_desc:0 "알제리 사태의 결말이 프랑스의 앞날을 정합니다."
 LR_FRA_gov_provisional:0 "임시 정부"
 LR_FRA_gov_provisional_desc:0 "혁명으로 들어선 임시 정부가 총선을 준비합니다."
 LR_FRA_gov_orleans:0 "오를레앙 왕정"
 LR_FRA_gov_orleans_desc:0 "루트: 오를레앙. 군부가 세운 왕이 복수를 외칩니다."
 LR_FRA_gov_bourbon:0 "부르봉 왕정"
 LR_FRA_gov_bourbon_desc:0 "루트: 부르봉. 쿠데타를 꺾은 왕가가 동맹과 외교로 힘을 기릅니다."
 LR_FRA_gov_communist:0 "프랑스 코뮌"
 LR_FRA_gov_communist_desc:0 "루트: 사회주의. 일국사회주의와 세계 혁명 사이에서 길을 정합니다."
 LR_FRA_gov_jacobin:0 "산악파 정부"
 LR_FRA_gov_jacobin_desc:0 "루트: 산악파. 국가가 시민을 돌보는 개입주의 공화국입니다."
 LR_FRA_gov_girondin:0 "지롱드 정부"
 LR_FRA_gov_girondin_desc:0 "루트: 지롱드. 자유방임과 탈규제로 성장을 노립니다."
 LR_FRA_gov_marais:0 "푀양파 정부"
 LR_FRA_gov_marais_desc:0 "루트: 푀양파. 입헌군주정과 질서를 내세웁니다."
 LR_FRA_gov_napoleon:0 "통령 정부"
 LR_FRA_gov_napoleon_desc:0 "숨은 루트: 나폴레옹. 공화국의 이름 아래 한 사람이 권력을 쥐었습니다."

 LR_tt_give_up:0 "§Y진압 포기 경로§!: 7일 뒤 군부가 쿠데타를 일으킵니다. 그 결과 §Y오를레앙§! 또는 §Y부르봉§! 루트로 갈립니다."
 LR_tt_crush:0 "§Y진압 경로§!: 원정이 수렁에 빠져 약 20일 뒤 §R혁명§!이 일어나고, 총선으로 정부가 정해집니다."
