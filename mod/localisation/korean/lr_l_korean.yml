 LR_tt_vote_bourbon:0 "§B부르봉 왕가§!의 세력이 지켜집니다."
 lr_france.20.t:0 "장군들의 분노"
 lr_france.20.d:0 "자정 무렵 연대장 다섯 명이 장교 식당에 모였다. 마르샹은 문 옆에 서서 술을 따랐다. 탁자 위에는 왕의 철수 명령서와 오를레앙 공의 초대장이 나란히 놓여 있었다.\n\n다들 왕의 임관장을 받은 사람들이었다. 동시에 알제리에 부하를 묻고 온 사람들이었다. 한 대령이 물었다. \"우리가 어디로 행군하는 거요?\" 다른 대령이 잔을 내려놓았다. \"그걸 정하려고 지금 여기 있는 거 아니오.\" 그 뒤로 한참 아무도 말하지 않았다.\n\n파리까지는 이틀 거리였다. 샬롱의 연대가 어느 깃발을 따라갈지가 오늘 밤 정해진다."
 lr_france.20.a:0 "복수를 약속한 왕을 따른다."
 lr_france.20.b:0 "맹세는 맹세다. 왕명을 기다린다."
 lr_france.21.t:0 "파리 수비대"
 lr_france.21.d:0 "밤 열한 시, 튈르리에서 전령이 왕의 친필 편지를 들고 왔다. 다리만 지켜 내면 아침까지 버틸 수 있고, 아침이면 남부의 연대들이 올라올 거라는 내용이었는데, 마지막 줄에는 그대를 믿소, 루이라고 적혀 있었다.\n\n드 페랭 장군은 편지를 두 번 읽고 가슴 주머니에 넣은 뒤 자정에 부관들을 불러 모았다. 그 자리에 함께 있던 비네는 안주머니에 든 봉투 세 개가 유난히 묵직하게 느껴졌다.\n\n장군은 왕이 하사한 은제 담뱃갑을 만지작거리며 부관들을 한 사람씩 쳐다보았다. 몇몇은 눈을 피했고 몇몇은 똑바로 마주 보았다. 창밖으로 센강의 다리들이 보였는데, 다리마다 가스등 하나와 그 아래 차단봉 하나가 놓여 있었다. 오를레앙의 선봉은 동트기 전에 그 차단봉 앞에 설 테지만, 남부의 연대에서는 아직 전보 한 통 들어오지 않고 있었다."
 lr_france.21.a:0 "차단봉을 올려라. 새 왕이 입성한다."
 lr_france.21.b:0 "다리를 지켜라. 왕은 튈르리에 있다."
 lr_france.41.t:0 "지중해 건너의 세 데파르트망"
 lr_france.41.d:0 "알제 시청 서기 무스타파 벤아이사는 광장 연단 뒤에서 칙령 원본을 들고 서 있었다. 총독부 관리가 칙령을 읽었다. 오늘부터 알제, 오랑, 콩스탕틴은 식민지가 아니라 프랑스 본토의 데파르트망이다. 박수는 주로 앞줄의 콜롱들에게서 나왔다.\n\n광장 가장자리에서 늙은 향신료 상인이 옆 사람에게 묻는 소리가 들렸다. \"그럼 우리도 이제 파리 사람과 같은 표를 갖는 거요?\" 벤아이사는 그 상인을 알았다. 시청 앞에서 서른 해 동안 장사를 한 사람이었다.\n\n관리는 그 질문을 듣지 못한 척했다. 벤아이사는 원본을 쥔 손에 힘이 들어갔다. 그는 그 칙령을 정서한 사람이었다. 세 번이나 읽었다. 파리에서 온 훈령에는 그 답이 적혀 있지 않았다.\n\n행사가 끝나고 관리가 원본을 돌려받으며 그에게 수고했다고 했다. 벤아이사는 그 질문을 대신 해 볼까 하다가, 그 관리도 답을 모른다는 것을 알고 그만두었다. 답은 파리의 책상 위에 있었다."
 lr_france.41.a:0 "알제리는 프랑스다. 그것으로 충분하다."
 lr_france.41.b:0 "같은 데파르트망이면 같은 표다. 그렇게 약속해."
 lr_france.42.t:0 "브뤼셀의 삼색기"
 lr_france.42.d:0 "브뤼셀 시청 종지기 피에르 반담은 첨탑에서 삼색기가 올라가는 줄을 직접 당겼다. 1795년 혁명 프랑스가 처음 이 땅을 합병했을 때와 같은 깃발이었다. 그의 증조할아버지도 그때 이 종을 쳤다고 했다. 그 뒤로 깃발이 몇 번 바뀌었는지는 집안에서도 정확히 몰랐다.\n\n왈롱의 광산 마을에서는 사람들이 거리로 나와 라 마르세예즈를 불렀다고 했다. 반담이 사는 동네는 플랑드르 쪽이었다. 그날 저녁 동네 술집은 조용했다. 안트베르펜에서 온 부두 노동자들이 말없이 맥주를 마셨다. 누군가 라디오를 켜자 다른 누군가가 껐다.\n\n다음 날 새 도지사가 시청에 부임했다. 반담은 종탑 계단에서 도지사와 마주쳤다. 도지사는 프랑스어로 인사했고, 반담은 플랑드르어로 대답했다. 도지사는 잠깐 멈칫하더니 웃었다.\n\n그날 오후 도지사는 파리에 전보를 쳤다. \"플랑드르어 학교는 어떻게 할까요?\" 반담의 손자는 다음 달부터 학교에 갈 나이였다."
 lr_france.42.a:0 "프랑스의 데파르트망에서는 프랑스어를 쓴다."
 lr_france.42.b:0 "플랑드르 아이들은 플랑드르 말로 배우게 해."
 LR_tt_congress:0 "사회주의자들의 §Y코뮌 대회§!가 열립니다. 중앙위원회와 자유 코뮌 연합 가운데 하나를 고릅니다."
 LR_tt_anarchist:0 "§G자유 코뮌 연합 루트§! 진입: 위원회도 당도 없는 혁명의 중점이 열립니다."
 LR_tt_petain:0 "§R페탱 루트§! 진입: 지금까지의 루트가 닫히고 원수의 프랑스국 중점이 열립니다. 모든 지역 반발도가 40으로 내려갑니다."
 lr_france.50.t:0 "코뮌 대회"
 lr_france.50.d:0 "표결이 끝났다. 루이 마르샹과 다른 인쇄공 하나가 표를 두 번 셌다. 두 번 다 같은 숫자가 나왔다. 마르샹은 결과를 쪽지에 적어 의장에게 건넸다.\n\n회의실 양쪽이 숨을 죽였다. 한쪽이 이기면 프랑스는 위원회와 계획과 규율의 나라가 된다. 다른 쪽이 이기면 코뮌과 조합이 아래에서부터 나라를 다시 묶는다. 복도에서 담배를 나눠 피운 두 사람이 서로 다른 쪽 줄 끝에 앉아 있었다.\n\n의장이 쪽지를 펼쳤다. 안경을 고쳐 쓰고 한 번 헛기침을 했다. \"동지들, 대회의 결정은...\""
 lr_france.50.a:0 "중앙위원회: 혁명을 지키려면 규율이 필요하다."
 lr_france.50.b:0 "자유 코뮌 연합: 우리는 국가를 끝내러 왔다."
 lr_france.51.t:0 "원수의 아침"
 lr_france.51.d:0 "정오, 파리의 모든 카페 라디오에서 떨리는 늙은 목소리가 나왔다.\n\n\"프랑스인 여러분. 나는 오늘 프랑스를 다스리는 일을 맡았습니다. 나는 여러분에게 내 몸을 바칩니다. 방데와 리옹과 북부가 불타는 동안 파리의 정부는 회의만 했습니다. 지방에 보낸 것은 군대가 아니라 공문이었습니다. 정당과 파벌이 서로를 탓하는 사이 프랑스가 무너지고 있었습니다. 이제 그것을 끝내겠습니다.\"\n\n조르주 플뢰리는 앵발리드 당번병 대기실에서 그 방송을 들었다. 방송이 끝나자 대기실 고참이 라디오를 끄고 말했다. \"이제 커피 나를 일은 줄겠군.\" 아무도 웃지 않았다.\n\n의사당에는 아직 의원 몇이 남아 있었다. 원수의 대령들은 그들에게 마지막 표결을 하게 할지, 그냥 문을 닫을지를 두고 아침 내내 싸웠다."
 lr_france.51.a:0 "원수에게 전권을. 질서가 돌아올 때까지만."
 lr_france.51.b:0 "남은 의원들이 마지막 표결로 원수에게 전권을 넘긴다."
 LR_FRA_petain:0 "필리프 페탱"
 LR_FRA_besnard:0 "피에르 베스나르"
 LR_tt_red:0 "§R붉은 나폴레옹 루트§! 진입: 황제와 대통령의 길이 닫히고 인민의 통령 줄기가 열립니다."
 lr_france.52.t:0 "붉은 통령"
 lr_france.52.d:0 "해가 진 뒤 원로원 의원 열한 명이 스위스행 기차표를 샀다. 앙리 뷔송이 역에서 본 백작은 그중 하나였다.\n\n튈르리 궁에는 삼색기와 붉은 깃발이 나란히 걸렸다. 다음 날 아침 신문 1면에는 붉은 통령이라는 제목이 실렸다. 노동자 평의회는 통령에게 감사 결의문을 보냈고, 참모본부 원수들 가운데 둘은 사표를 썼다가 찢었다.\n\n뷔송은 그날 정원 경비를 서면서 렌치를 든 남자를 다시 보았다. 남자는 손을 흔들었다. 뷔송도 흔들었다. 경비병이 그러면 안 되는 거였다."
 lr_france.52.a:0 "인민의 이름으로."
 LR_FRA_minority:0 "소수 내각"
 LR_FRA_minority_desc:0 "내각이 의회 과반을 잃었습니다. 법안마다 야당과 흥정해야 하고, 예산은 몇 주씩 표류합니다. 이 상태로 여섯 달이 지나면 의회가 불신임안을 올립니다."
 LR_tt_resist_60:0 "저항 세력이 §Y60§! 이상이어야 합니다. 지금 [?LR_resist|0]입니다."
 LR_tt_resist_low:0 "저항 세력이 §Y30§! 미만이어야 합니다. 지금 [?LR_resist|0]입니다."
 LR_tt_vanquished:0 "§R패전§!: 모든 루트가 닫히고 점령기 중점이 열립니다."
 lr_france.53.t:0 "모범적인 동반자"
 lr_france.53.d:0 "몇 주 뒤, 마지막 감독관이 리옹역에서 기차에 올랐다. 플랫폼에는 프랑스 장관 둘과 군악대가 나와 있었다. 군악대는 승전국 국가를 연주했다. 마리안 뒤프레는 통역관 자격으로 그 자리에 있었다. 감독관은 기차에 오르기 전에 그녀에게 프랑스어가 훌륭하다고 칭찬했다.\n\n프랑스는 다시 스스로 다스린다. 국경과 군대와 외교에는 여전히 승전국의 눈이 붙어 있다. 총리는 그것으로 프랑스를 구했다고 믿었다.\n\n뒤프레는 그날 집에 가서 2년 동안 번역한 명단의 사본을 서랍에서 꺼냈다. 태우려고 했다. 결국 태우지 않았다."
 lr_france.53.a:0 "살아남은 것이 이긴 것이다."
 lr_france.54.t:0 "해방된 파리"
 lr_france.54.d:0 "시청 광장의 군중이 라 마르세예즈를 불렀다. 1792년 의용병들이 처음으로 부르며 파리로 걸어 들어왔던 바로 그 노래였다.\n\n승전국들은 점령군을 철수시키고 프랑스의 독립을 인정했다. 제네바에서 돌아온 망명 위원회의 의장이 시청 발코니에 서서 연설을 시작했는데, 연설이 워낙 길었던 데다 광장 뒤쪽까지는 소리가 잘 닿지 않았다. 앙드레 르코크는 바로 그 광장 뒤쪽에 서 있었다.\n\n그의 손에는 아직도 그 꽃이 들려 있었는데, 어느새 시들기 시작한 참이었다. 연설이 끝나 갈 무렵 르코크는 그 꽃을 생미셸 다리로 가져가 난간에 살며시 내려놓았다. 넷째 날 아침 동료가 쓰러졌던 자리였다. 그러고는 경시청으로 돌아갔는데, 내일부터는 다시 출근해야 했다."
 lr_france.54.a:0 "프랑스는 다시 자유다."
 LR_tt_part2_war:0 "대전쟁이 시작되었거나 프로이센을 이미 꺾었어야 합니다."
 LR_tt_part2_prussia:0 "§Y프로이센§!을 꺾었어야 합니다."
 LR_tt_part2_europe:0 "§Y프로이센§!과 함께 §Y합스부르크§!나 §Y영국§! 가운데 하나를 꺾었어야 합니다."
 LR_tt_ending:0 "§Y프로이센§!, §Y합스부르크§!, §Y영국§!을 모두 꺾었어야 합니다."
