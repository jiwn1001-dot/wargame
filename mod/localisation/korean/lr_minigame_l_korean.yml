l_korean:
 LR_FRA_streets_category:0 "혁명의 거리"
 LR_FRA_streets_category_desc:0 "알제리 전쟁이 파리를 끓게 합니다. 거리의 노동자와 의사당의 공화파 가운데 누가 혁명을 손에 쥘지가 여기서 갈립니다.\n\n§Y혁명의 저울§!: [?FRA.LR_election_left|0]. 총선 때 2 이상이면 사회주의 세력이, 그보다 낮으면 의회파가 이깁니다."
 LR_dec_strike_blind:0 "파업을 눈감다"
 LR_dec_strike_blind_desc:0 "생드니의 군수 공장 파업에 경찰을 보내지 않습니다. 노동자들이 처음으로 정부가 겁먹었다고 느낍니다.\n\n혁명의 저울 §R+1§!, 안정도 §R-3%§!"
 LR_dec_deputies:0 "공화파 의원들과의 밀담"
 LR_dec_deputies_desc:0 "의사당 뒤편 카페에서 공화파 의원들을 만납니다. 왕이 무너지면 그 자리를 거리가 아니라 의회가 채워야 한다는 데 뜻을 모읍니다.\n\n혁명의 저울 §G-1§!, 정치력 §R-10§!"
 LR_dec_councils:0 "노동자 평의회 지원"
 LR_dec_councils_desc:0 "혁명 뒤 공장마다 생긴 평의회에 식량과 인쇄기를 보냅니다.\n\n혁명의 저울 §R+1§!"
 LR_dec_press:0 "공화파 신문 지원"
 LR_dec_press_desc:0 "혁명 뒤 공화파 신문에 종이와 광고를 몰아줍니다. 르탕과 르피가로가 질서 있는 공화국을 외칩니다.\n\n혁명의 저울 §G-1§!"
 LR_dec_red_guards:0 "적위대 무장"
 LR_dec_red_guards_desc:0 "병영에서 나온 소총을 공장 민병대에 나눠 줍니다.\n\n혁명의 저울 §R+2§!, 안정도 §R-5%§!"
 LR_dec_countryside:0 "농촌 순회"
 LR_dec_countryside_desc:0 "혁명 정부의 장관들이 기차를 타고 농촌을 돕니다. 농민들은 파리의 붉은 깃발보다 땅문서를 원합니다.\n\n혁명의 저울 §G-2§!, 안정도 §G+3%§!"
 LR_FRA_plot_category:0 "장교들의 음모"
 LR_FRA_plot_category_desc:0 "왕이 알제리를 버리자 장교단이 들끓습니다. 오를레앙 공의 연대와 왕실 근위대 가운데 누가 파리를 쥘지가 여기서 갈립니다.\n\n§Y쿠데타의 저울§!: [?FRA.LR_coup_orleans|0]. 튈르리의 결판 때 2 이상이면 오를레앙이, 그보다 낮으면 부르봉이 이깁니다."
 LR_dec_officers_mess:0 "장교 식당의 건배"
 LR_dec_officers_mess_desc:0 "참모본부 식당에서 오를레앙 공의 이름으로 건배가 오갑니다. 아무도 막지 않습니다.\n\n쿠데타의 저울 §Y+1§!"
 LR_dec_royal_guard:0 "근위대 증강"
 LR_dec_royal_guard_desc:0 "왕실 근위대에 새 소총과 봉급을 줍니다. 근위병들은 아직 왕의 편입니다.\n\n쿠데타의 저울 §Y-1§!, 정치력 §R-10§!"
 LR_dec_garrison_bribe:0 "수비대 사령관 매수"
 LR_dec_garrison_bribe_desc:0 "파리 수비대 사령관의 빚을 누군가 대신 갚아 주었습니다.\n\n쿠데타의 저울 §Y+1§!"
 LR_dec_kings_radio:0 "왕의 라디오 연설"
 LR_dec_kings_radio_desc:0 "왕이 처음으로 라디오 앞에 앉아 국민에게 직접 말합니다. 늙은 목소리가 의외로 사람들의 마음을 움직입니다.\n\n쿠데타의 저울 §Y-1§!, 안정도 §G+2%§!"
 LR_dec_veterans_march:0 "재향군인 행진"
 LR_dec_veterans_march_desc:0 "대전쟁 노병들이 샹젤리제를 행진하며 복수의 왕을 외칩니다.\n\n쿠데타의 저울 §Y+2§!, 안정도 §R-3%§!"
 LR_dec_church_bells:0 "성당의 종"
 LR_dec_church_bells_desc:0 "파리 대주교가 정통 왕을 위해 기도하라고 모든 성당에 서한을 보냅니다.\n\n쿠데타의 저울 §Y-2§!"
 LR_FRA_reform_council_category:0 "군사 개혁 위원회"
 LR_FRA_reform_council_category_desc:0 "패전국의 군대를 다시 세우는 일은 서류가 아니라 연병장에서 이루어집니다. 군사 중점을 하나 끝낼 때마다 §Y개혁 동력§!이 1 쌓이고, 위원회는 그것을 써서 훈련과 시험을 엽니다. 결과는 그날의 운과 준비에 달렸습니다.\n\n§Y개혁 동력§!: [?FRA.LR_reform_drive|0]\n기술혁신 §Y[?FRA.LR_tech_index|0]§! / 지휘체계 §Y[?FRA.LR_cmd_index|0]§! / 장교단 §Y[?FRA.LR_off_index|0]§!\n\n§G대성공§! 해당 개혁 +8, §Y성공§! +5, §R실패§! +2. 연결된 중점을 끝냈다면 대성공 확률이 오릅니다."
 LR_dec_manoeuvres:0 "샹파뉴 대기동 훈련"
 LR_dec_manoeuvres_desc:0 "두 개 군단이 샹파뉴 평원에서 맞붙습니다. 참관인으로 온 외국 무관들이 수첩을 꺼냅니다.\n\n§Y개혁 동력§! 1 소모. §Y지휘체계§! +2/+5/+8, 육군 경험치 +15."
 LR_dec_artillery_trial:0 "부르주 포병 시험장"
 LR_dec_artillery_trial_desc:0 "부르주의 시험장에서 75mm의 후계자가 될 새 야포를 시험 사격합니다.\n\n§Y개혁 동력§! 1 소모. §Y기술혁신§! +2/+5/+8, 포병 연구 보너스 50%."
 LR_dec_officer_exam:0 "장교 선발 시험"
 LR_dec_officer_exam_desc:0 "생시르의 문을 넓힌 첫 해, 출신을 묻지 않는 선발 시험에 수천 명이 몰립니다.\n\n§Y개혁 동력§! 1 소모. §Y장교단§! +2/+5/+8, 지휘력 +10."
 LR_dec_tank_trial:0 "사토리 전차 시험"
 LR_dec_tank_trial_desc:0 "사토리 고원에서 새 전차가 진흙탕과 철조망을 건넙니다.\n\n§Y개혁 동력§! 1 소모. §Y기술혁신§! +2/+5/+8, 기갑 연구 보너스 50%."
 LR_dec_war_game:0 "참모 전쟁 게임"
 LR_dec_war_game_desc:0 "고등 전쟁 대학의 지도실에서 대령들이 라인강 전역을 탁상 위에서 치릅니다.\n\n§Y개혁 동력§! 1 소모. §Y지휘체계§! +2/+5/+8, 지휘력 +20."
 LR_dec_reserve_drill:0 "예비군 소집 연습"
 LR_dec_reserve_drill_desc:0 "예비군 30만 명을 사흘 동안 소집해 봅니다. 기차는 늦었고 군복은 모자랐습니다. 그래서 연습입니다.\n\n§Y개혁 동력§! 1 소모. §Y장교단§! +2/+5/+8, 인력 +15000."
 LR_tt_reform_drive:0 "§Y개혁 동력§!이 1 이상 있어야 합니다. 군사 중점을 끝낼 때마다 쌓입니다."
 lr_reform.1.t:0 "군사 개혁 위원회: 대성공"
 lr_reform.1.d1:0 "시험장의 표적이 한 발 한 발 쓰러집니다. 기술 장교들이 서로 얼싸안고, 공장장은 그 자리에서 양산 계획서를 꺼냅니다. 전쟁부 장관은 보고서를 받자마자 의회로 달려갑니다."
 lr_reform.1.d2:0 "청군 사령부가 홍군의 측면을 완벽하게 찔렀습니다. 명령은 무전으로 십 분 만에 전 사단에 닿았습니다. 외국 무관 하나가 수첩에 짧게 적습니다. 프랑스 육군이 돌아왔다."
 lr_reform.1.d3:0 "젊은 장교들이 늙은 대령들을 놀라게 했습니다. 지도를 읽고, 스스로 판단하고, 부하를 앞에서 이끕니다. 심사관은 채점표에 처음으로 만점을 적었습니다."
 lr_reform.1.a:0 "프랑스 육군이 돌아온다!"
 lr_reform.1.tt:0 "해당 개혁 지수 §Y+8§!. 비무장화된 군대의 페널티가 그만큼 줄어듭니다."
 lr_reform.2.t:0 "군사 개혁 위원회: 성공"
 lr_reform.2.d1:0 "시험은 대체로 순조로웠습니다. 몇 번의 고장과 몇 번의 불발, 그리고 그것을 고칠 방법을 적은 두툼한 보고서. 기술 장교들은 다음 시험을 벌써 준비합니다."
 lr_reform.2.d2:0 "훈련은 계획대로 끝났습니다. 몇몇 연대는 길을 잃었고 무전은 가끔 끊겼지만, 참모들은 무엇을 고쳐야 하는지 정확히 알게 되었습니다."
 lr_reform.2.d3:0 "시험은 무난했습니다. 뛰어난 몇 명이 눈에 띄었고, 나머지는 성실했습니다. 장교단은 천천히, 그러나 확실히 두꺼워집니다."
 lr_reform.2.a:0 "다음 훈련을 준비하라."
 lr_reform.2.tt:0 "해당 개혁 지수 §Y+5§!. 비무장화된 군대의 페널티가 그만큼 줄어듭니다."
 lr_reform.3.t:0 "군사 개혁 위원회: 실패"
 lr_reform.3.d1:0 "첫 발에 포신이 터졌습니다. 다행히 다친 사람은 없었지만, 다음 날 신문 1면은 그 사진이었습니다. 기술 장교들은 잔해를 모아 실험실로 돌아갑니다. 실패에서도 배울 것은 있습니다."
 lr_reform.3.d2:0 "훈련은 혼란 그 자체였습니다. 두 사단이 같은 다리를 두고 다퉜고, 사령부는 반나절 동안 자기 부대가 어디 있는지 몰랐습니다. 그래도 전쟁이 아니라 훈련이었다는 것이 위안입니다."
 lr_reform.3.d3:0 "합격자 명단은 귀족 성씨로 가득합니다. 시험관들이 옛 습관을 버리지 못했습니다. 개혁파 장교들이 항의 서한을 돌리고, 위원회는 다음 시험의 감독관을 바꾸기로 합니다."
 lr_reform.3.a:0 "다시 한다. 더 잘."
 lr_reform.3.tt:0 "해당 개혁 지수 §Y+2§!. 비무장화된 군대의 페널티가 그만큼 줄어듭니다."
