l_korean:
 lr_peace.1.t:0 "베를린 입성"
 lr_peace.1.d:0 "군악대 북 치는 병사 라울 페르난은 브란덴부르크 문 아래를 지나며 박자를 놓칠 뻔했다. 문 위의 사두마차 조각상이 생각보다 컸다.\n\n운터덴린덴 거리 양쪽 창문은 다 닫혀 있었다. 커튼 틈으로 얼굴이 몇 보였다. 페르난은 할머니에게서 1918년 얘기를 들은 적이 있었다. 승전국 군대가 샹젤리제를 행진하던 날, 파리 사람들도 창문을 닫았다고 했다.\n\n대열 앞쪽에서 소란이 일었다. 늙은 하사관 하나가 대열을 벗어나 문 아래에 무릎을 꿇었다. 하사관은 바닥에 입을 맞추고 일어나서 다시 대열로 돌아갔다. 1918년 항복하던 날 아르덴에 있었던 사람이라고, 나중에 누가 알려 주었다.\n\n아무도 그를 꾸짖지 않았다. 페르난은 북을 계속 쳤다. 박자는 다시 맞았다."
 lr_peace.1.a:0 "1918년의 빚을 갚았다."
 lr_peace.2.t:0 "빈의 항복"
 lr_peace.2.d:0 "프랑스 대표단 통역 에밀 베르나르는 쇤브룬 궁 회의실에서 강화 조약 조항을 한 줄씩 독일어로 읽었다. 갈리치아는 폴란드로, 남은 제국은 프랑스 보호국으로.\n\n합스부르크 대신들은 끝까지 들었다. 한 사람은 펜을 든 손이 떨려서 서명을 두 번 했다. 다른 한 사람은 서명하고 나서 베르나르에게 조용히 물었다. 프랑스어 원문과 독일어 번역에 차이가 없느냐고. 베르나르는 없다고 했다. 정말 없었다.\n\n서명이 끝나자 성 슈테판 성당 종이 울렸다. 베르나르는 그게 장례식 종인지 미사 종인지 몰랐다. 대신들도 모르는 얼굴이었다.\n\n같은 시각 프라하와 부다페스트와 자그레브의 광장에 사람들이 쏟아져 나왔다는 전보는 저녁에 들어왔다. 베르나르는 그 전보도 번역했다."
 lr_peace.2.a:0 "민족의 감옥이 열렸다."
 lr_peace.3.t:0 "왕 없는 브리튼"
 lr_peace.3.d:0 "이등병 루이 고뱅은 화이트홀 근위병 초소 앞에서 보초를 섰다. 원래 영국 근위병이 서던 자리였다. 근위병 교대식은 사흘 전에 멈췄다.\n\n웨스트민스터 시계탑은 여전히 정시마다 울렸다. 그 아래 의사당은 비어 있었다. 왕실은 함대를 이끌고 오타와로 갔다고 했다. 고뱅은 그 얘기를 듣고 오타와가 어디 있는지 몰라서 상병에게 물었다. 캐나다라고 했다.\n\n교대 시간이 끝나고 고뱅은 템스강 다리로 걸어갔다. 수첩을 꺼내 할아버지 이름을 적었다. 대전쟁 때 영국군 포로가 되어 돌아오지 못한 사람이었다. 고뱅은 그 페이지를 찢어서 강에 던졌다. 종이는 금방 가라앉았다. 고뱅은 조금 더 서 있다가 막사로 돌아갔다."
 lr_peace.3.a:0 "해협을 건넜다."
 lr_peace.4.t:0 "왕실, 다시 바다로"
 lr_peace.4.d:0 "오타와의 의사당 위로 프랑스 정찰기가 처음 날아간 다음 날, 왕실 열차가 밴쿠버로 떠났다.\n\n그리고 밴쿠버에서 배가 떠났다. 목적지는 태평양 건너 캔버라다. 제국의 남은 영토와 함대가 오스트레일리아로 모이고, 왕은 런던에서 1만 7천 킬로미터 떨어진 곳에서 다시 왕좌를 편다.\n\n참모들은 추격 계획서를 내민다. 태평양 횡단 작전. 해군 장관은 그 계획서를 보자마자 안경을 벗었다."
 lr_peace.4.a:0 "지구 반대편까지 쫓아갈 필요는 없다. 강화하라."
 lr_peace.5.t:0 "두 번째 패전"
 lr_peace.5.d:0 "또 졌다. 콩피에뉴 숲의 열차 객차에서 프랑스 대표가 다시 항복 문서에 서명한다. 1918년에 그랬던 바로 그 자리다.\n\n이번 조약은 1918년보다 가혹한다. 전쟁으로 얻은 땅은 모두 원래 주인에게 돌아가고, 식민지는 승전국이 나눠 가진다. 파리에는 승전국의 뜻에 따라 새 정부가 들어선다.\n\n샹젤리제의 카페에서 어느 노병이 신문을 접으며 중얼거린다. \"이 나라에 대체 무엇이 남았나.\""
 lr_peace.5.a:0 "모든 것이 끝났다."
 lr_news.10.t:0 "라인 연방 수립"
 lr_news.10.d:0 "프로이센이 무너졌습니다. 라인강과 남독일의 제후국들이 프랑스의 보호 아래 라인 연방으로 묶였습니다.\n\n대전쟁 때 프랑스군이 세웠다가 패전과 함께 잃었던 이름입니다. 그 이름이 스무 해 만에 지도 위에 다시 쓰였습니다. 프랑크푸르트의 옛 제국 의사당에 라인 연방의 깃발이 오르고, 그 옆에 삼색기가 나란히 걸렸습니다.\n\n베를린의 신문은 이날 1면을 검은 테두리로 둘렀습니다. 파리의 신문은 1면 전체를 지도 한 장으로 채웠습니다. 그 지도에서 라인강은 더 이상 국경이 아니었습니다."
 lr_news.10.a:0 "유럽의 지도가 또 바뀌었다."
 lr_news.11.t:0 "도나우 연방 수립"
 lr_news.11.d:0 "합스부르크 제국이 무너졌습니다. 갈리치아는 폴란드로 넘어갔고, 남은 제국은 프랑스의 보호국이 되었습니다.\n\n쇤브룬 궁전의 정원에서는 늙은 정원사들이 여느 해처럼 장미를 손질합니다. 궁전의 주인이 바뀌어도 장미는 피어야 한다고 그들은 말합니다. 궁전 안에서는 프랑스 총독의 짐이 풀리고 있습니다.\n\n프라하와 부다페스트, 자그레브의 광장에는 민족의 깃발이 걸렸습니다. 빈의 커피하우스에서는 늙은 신사들이 신문을 펼친 채 말을 잃었습니다. 600년 동안 중부 유럽을 다스린 왕가가 이제 파리의 뜻을 살펴야 하는 처지입니다."
 lr_news.11.a:0 "도나우의 시대가 저문다."
 lr_news.12.t:0 "왕실, 캐나다로 망명"
 lr_news.12.d:0 "런던이 함락되었습니다. 영국 본토에는 공화국이 들어섰고, 왕실은 함대와 함께 오타와로 망명했습니다.\n\n본토를 잃은 왕실은 프랑스와 강화를 맺었습니다. 캐나다와 오스트레일리아, 인도는 망명 왕실 아래 남았습니다. 세계에서 가장 큰 제국은 이제 런던이 아니라 오타와에서 다스려집니다. 해협 양쪽의 신문들은 같은 제목을 뽑았습니다. 해가 지지 않는 제국의 해가 졌는가."
 lr_news.12.a:0 "믿을 수 없다."
 lr_news.13.t:0 "왕실, 오스트레일리아로"
 lr_news.13.d:0 "캐나다가 무너졌습니다. 영국 왕실이 이번에는 오스트레일리아로 옮겨 갔습니다.\n\n한때 해가 지지 않는다던 제국의 왕이 이제는 유럽의 소식을 하루 늦게 받아 봅니다. 시드니 항구에는 런던에서 온 마지막 함대가 닻을 내렸고, 캔버라의 작은 의사당은 하룻밤 사이에 제국의 수도가 되었습니다.\n\n런던의 거리에서는 누군가 이렇게 말했다고 합니다. 왕은 결국 지구를 한 바퀴 돌아 식민지로 갔다고."
 lr_news.13.a:0 "왕관이 지구를 돌고 있다."
 LR_latin_league:0 "라틴 왕가 동맹"
 LR_revanche_pact:0 "복수의 맹약"
 LR_red_pact:0 "공화국 조약"
 LR_tt_rhine_held:0 "프로이센을 이겼거나 라인강 지역을 점령해야 합니다."
 LR_FRA_gov_napoleon_empire:0 "프랑스 제국"
 lr_news.14.t:0 "두 연방의 끝"
 lr_news.14.d:0 "북독일 연방과 남독일 연방이 모두 무너졌습니다. 프랑스가 차지하지 않은 독일 땅은 이제 하나의 라인 연방입니다.\n\n대전쟁 뒤 승전국들은 독일을 둘로 갈라 서로를 견제하게 했습니다. 베를린과 뮌헨은 스무 해 동안 서로를 노려보았습니다. 이제 그 둘 위에 파리가 있습니다.\n\n라인에서 엘베까지, 마을마다 같은 포고문이 붙었습니다. 법 앞의 평등, 봉건 지대의 폐지, 그리고 프랑스와의 영원한 동맹. 포고문 앞에 선 농부들은 첫 줄과 둘째 줄을 오래 읽었습니다. 셋째 줄은 빨리 넘겼습니다."
 lr_news.14.a:0 "라인에서 엘베까지."
