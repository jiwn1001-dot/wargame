 lr_power.3.t:0 "코뮌 안의 코뮌"
 lr_power.3.d_a:0 "중앙위원회 서기 마르셀 페랭은 11구 평의회가 보낸 결의문을 위원회 탁자 위에 올려놓았다. 계획위원회의 생산 목표를 따르지 않겠다는 결의였다. 다른 구역 열한 곳이 같은 결의를 했다.\n\n위원들은 결의문을 돌려 읽었다. 누군가 1871년에도 코뮌은 구역끼리 싸우다 무너졌다고 말했다. 다른 누군가는 위원회가 왕보다 더 많은 명령을 내린다고 말했다. 페랭은 둘 다 받아 적었다."
 lr_power.3.d_b:0 "벨빌 평의회 의장 쥘리 마르탱은 위원회가 보낸 새 구역 위원을 회관 입구에서 맞았다. 평의회가 뽑은 위원이 아니었다. 그는 위원회의 지시서를 들고 왔고, 지시서에는 평의회 회의를 한 달에 한 번으로 줄이라고 적혀 있었다.\n\n자정을 조금 넘겨 회관에 노동자 오백 명이 모였다. 그들은 지시서를 소리 내어 읽고 웃었다. 그리고 다음 날 아침 공장 세 곳이 일을 멈췄다."
 lr_power.3.a:0 "결의를 받아들인다."
 lr_power.3.b:0 "위원회의 권위를 세운다."
