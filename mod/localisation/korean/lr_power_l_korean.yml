 LR_FRA_power_bourbon_category_desc:0 "귀족과 교회와 개혁 관료가 나라의 주도권을 두고 다툽니다. 지금 균형: §Y[?FRA.LR_pw|0]§! (0이면 귀족과 교회가, 100이면 개혁 관료가 쥡니다). 앞서는 쪽의 힘과 약점이 국민정신에 나타나고, 균형을 지키면 안정도가 오릅니다. 한쪽 끝에 석 달 머물면 위기가 옵니다."
