 lr_power.8.t:0 "원수들과 법률가들"
 lr_power.8.d_a:0 "국무원 서기 장 포르탈리스는 원수들이 보낸 서한을 통령의 책상 맨 위에 놓았다. 국무원의 예산 심사를 군에는 적용하지 말라는 요구였다. 서명은 다섯 개였다. 모두 알제리부터 통령을 따라온 사람들이었다.\n\n통령은 서한을 읽고 펜 끝으로 책상을 두드렸다. 법전을 쓴 법률가들은 원수들이 법 위에 서려 한다고 했다. 원수들은 법률가들이 전쟁을 모른다고 했다. 둘 다 통령의 사람들이었다."
 lr_power.8.d_b:0 "원수 하나가 국무원 회의실 문을 발로 차고 들어왔다. 국무원이 새 군단 편성 예산을 또 깎았다는 것이다. 법률가들은 자리에서 일어나지 않았다. 의장이 조용히 법조문을 읽었다.\n\n그날 저녁 원수들은 근위대 장교 식당에서 모였다. 그들은 통령이 요즘 법률가들 말만 듣는다고 투덜댔다. 술잔이 몇 번 돌자 누군가 브뤼메르를 입에 올렸다."
 lr_power.8.a:0 "그들의 요구를 들어준다."
 lr_power.8.b:0 "누가 주인인지 보여 준다."
