 lr_power.6.t:0 "붉은 견장의 다툼"
 lr_power.6.d_a:0 "인민 위원 클로드 바예는 원수 셋의 해임 건의서를 통령에게 올렸다. 혁명에 충성하지 않는다는 이유였다. 증거로는 원수들이 정치위원 없이 작전 회의를 열었다는 보고서가 붙어 있었다.\n\n통령은 건의서를 읽고 오래 말이 없었다. 해임될 원수 가운데 하나는 알제리에서 그의 목숨을 구한 사람이었다. 바예는 통령이 펜을 들기를 기다렸다. 펜은 움직이지 않았다."
 lr_power.6.d_b:0 "원수 하나가 정치위원의 서명이 없는 작전 명령서를 전선에 보냈다. 위원회가 그 명령을 취소하자, 원수는 사단을 이끌고 명령대로 움직였다. 작전은 성공했다.\n\n승전보가 파리에 닿자 장교들은 위원회 없이도 이길 수 있다고 말하기 시작했다. 위원들은 그 말이 1799년 브뤼메르 18일의 냄새가 난다고 수군거렸다."
 lr_power.6.a:0 "그들의 손을 들어준다."
 lr_power.6.b:0 "견장을 떼어 낸다."
 LR_dyn_power_petain:0 "권력 균형: 군부와 라발파 정치가"
 LR_FRA_power_petain_category:0 "권력 줄다리기"
 LR_FRA_power_petain_category_desc:0 "군부와 라발파 정치가가 나라의 주도권을 두고 다툽니다. 지금 균형: §Y[?FRA.LR_pw|0]§! (0이면 군부가, 100이면 라발파 정치가가 쥡니다). 앞서는 쪽의 힘과 약점이 국민정신에 나타나고, 균형을 지키면 안정도가 오릅니다. 한쪽 끝에 석 달 머물면 위기가 옵니다."
