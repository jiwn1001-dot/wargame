 lr_power.7.t:0 "비시의 두 날개"
 lr_power.7.d_a:0 "원수의 부관 레몽 드 세르는 베강 장군이 보낸 메모를 원수의 아침 서류 맨 위에 놓았다. 라발과 그 측근들을 내각에서 내보내라는 요구였다. 메모 끝에는 군은 원수께 충성하지 정치인에게 충성하지 않는다고 적혀 있었다.\n\n원수는 메모를 두 번 읽었다. 그리고 부관에게 라발을 오후에 부르라고 했다. 부관은 그것이 라발을 내보내려는 것인지 달래려는 것인지 알 수 없었다."
 lr_power.7.d_b:0 "피에르 라발이 파르크 호텔 2층의 장관실을 하나씩 차지해 갔다. 그는 원수의 서명이 필요한 문서를 원수가 피곤한 저녁에만 올렸다. 군 출신 각료들은 회의에서 점점 말이 줄었다.\n\n베강 장군은 비시를 떠나 알제로 가겠다고 했다. 그가 떠나기 전날 밤, 장교 몇이 호텔 로비에서 라발의 비서와 큰 소리로 다퉜다."
 lr_power.7.a:0 "그들의 뜻을 받아들인다."
 lr_power.7.b:0 "원수의 이름으로 정리한다."
 LR_dyn_power_empire:0 "권력 균형: 원수들과 국무원"
