 lr_power.1.t:0 "대령들과 시종들"
 lr_power.1.d_a:0 "왕실 보안국장 알베르 뒤푸르는 장교 클럽에서 돌아온 정보원의 보고서를 왕의 책상에 올려놓았다. 대령 열두 명이 서명한 청원서였다. 내각을 해산하고 참모총장에게 전권을 달라는 내용이었다.\n\n왕은 청원서를 끝까지 읽었다. 서명자 가운데 셋은 쿠데타 날 튈르리 궁 앞에서 그를 왕좌에 앉힌 사람들이었다. 뒤푸르가 물었다. 체포 영장을 준비할까요. 왕은 대답 대신 창밖의 근위병을 보았다."
 lr_power.1.d_b:0 "참모본부 작전과장 레몽 르클레르 대령은 회의실 문 앞에서 시종에게 막혔다. 왕이 오늘은 군인들을 만나지 않는다고 했다. 사흘째였다.\n\n궁정의 시종장과 재무 관료들이 예산을 쥐었다. 새 전차 주문서는 결재함에서 한 달째 잠자고 있었다. 장교 클럽에서는 왕이 군대 덕분에 왕이 되었다는 사실을 잊었다는 말이 공공연히 돌았다."
 lr_power.1.a:0 "그들의 요구를 들어준다."
 lr_power.1.b:0 "주동자를 체포해."
 LR_dyn_power_bourbon:0 "권력 균형: 귀족과 교회와 개혁 관료"
