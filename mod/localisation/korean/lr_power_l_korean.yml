 lr_power.4.t:0 "연합의 갈림길"
 lr_power.4.d_a:0 "연합 서기 앙드레 보네는 강령파가 낸 동의안을 대회 의제에 올렸다. 모든 종대에 단일 지휘부를 두고, 대회 결정에 따르지 않는 코뮌은 연합에서 내보내자는 내용이었다.\n\n회관이 술렁였다. 종합파 대표 하나가 일어서서 그건 국가를 다시 세우자는 말이라고 외쳤다. 강령파 대표는 국가가 아니라 군대를 세우자는 말이라고 받았다. 보네는 의사봉을 쥐고 한참 기다렸다."
 lr_power.4.d_b:0 "강령파 대표 피에르 뒤랑은 대회에서 세 번째로 동의안을 거부당했다. 종합파는 모든 경향의 자유를 지키자고 했다. 그 사이 국경에서는 종대 두 개가 서로 다른 명령을 받고 엇갈려 움직였다.\n\n대회가 끝나고 뒤랑은 동료들과 회관 뒷방에 모였다. 그들은 대회 밖에서 따로 지휘부를 꾸리자고 했다. 누군가 그건 분열이라고 했다. 뒤랑은 그건 생존이라고 했다."
 lr_power.4.a:0 "그들의 노선을 따른다."
 lr_power.4.b:0 "대회의 결정을 지킨다."
