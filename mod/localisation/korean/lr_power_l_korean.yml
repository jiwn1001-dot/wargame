 LR_dec_pw_bourbon_balance_tt:0 "균형이 가운데로 15 돌아옵니다."
 lr_power.2.t:0 "왕좌 곁의 다툼"
 lr_power.2.d_a:0 "궁정 서기관 앙리 드 몽모랑시는 귀족원 의장이 보낸 서한을 왕에게 읽어 드렸다. 대주교와 공작 스무 명이 연명한 서한이었다. 재무부의 개혁 관료들을 해임하고 옛 특권을 돌려달라는 내용이었다.\n\n왕은 서한을 덮고 오래 생각에 잠겼다. 재무장관은 이미 사직서를 써 두었다는 소문이었다. 서기관은 왕이 펜을 드는 것을 기다렸다."
 lr_power.2.d_b:0 "귀족원 의장 라로슈푸코 공작은 왕실 회의에서 자기 자리가 뒷줄로 밀린 것을 알았다. 앞줄에는 이름 없는 재무 관료들이 앉아 있었다. 그들이 지방 삼부회의 특권을 하나씩 없애는 법안을 들고 왔다.\n\n회의가 끝나자 공작은 대주교와 함께 궁을 나섰다. 둘은 마차 안에서 오래 이야기했다. 다음 날 아침 시골 성당 세 곳에서 개혁을 비난하는 강론이 나왔다."
 lr_power.2.a:0 "그들의 뜻대로 하게 둔다."
 lr_power.2.b:0 "왕은 누구의 편도 아니다. 물러나게 해."
 LR_dyn_power_communist:0 "권력 균형: 구역 평의회와 중앙위원회"
