 LR_super_monarchy_reaction:0 "신이여, 왕을 지키소서."
 LR_super_bonaparte_title:0 "보나파르트의 비상"
 LR_super_bonaparte_quote:0 "불가능이라는 말은 프랑스어가 아니다."
