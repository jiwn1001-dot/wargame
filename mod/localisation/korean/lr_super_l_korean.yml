 LR_super_liberty_author:0 "-빅토르 위고"
 LR_super_liberty_song:0 "카르마뇰"
 LR_super_liberty_reaction:0 "공화국 만세!"
 LR_super_commune_title:0 "파리 코뮌의 귀환"
