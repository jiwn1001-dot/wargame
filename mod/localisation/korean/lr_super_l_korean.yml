 LR_super_orleans_author:0 "-레옹 강베타, 1871년"
 LR_super_orleans_song:0 "베르됭! 너희는 못 지나간다"
 LR_super_orleans_reaction:0 "국왕 만세!"
 LR_super_petain_title:0 "페탱 쿠데타"
 LR_super_petain_quote:0 "용기를 내라! 우리는 그들을 잡을 것이다!"
 LR_super_petain_author:0 "-필리프 페탱, 1916년 베르됭"
 LR_super_petain_song:0 "원수여, 우리가 여기 있습니다"
 LR_super_petain_reaction:0 "원수 만세!"
 LR_super_monarchy_title:0 "왕정의 수호"
