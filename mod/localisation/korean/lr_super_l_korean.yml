 LR_super_bonaparte_reaction:0 "보나파르트 만세!"
 LR_super_world_war_title:0 "제2차 세계 대전"
 LR_super_world_war_quote:0 "이것은 평화가 아니다. 스무 해 동안의 휴전일 뿐이다."
