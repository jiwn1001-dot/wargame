l_korean:
 LR_super_revolution_title:0 "프랑스 혁명"
 LR_super_revolution_quote:0 "대담하게, 또 대담하게, 언제나 대담하게! 그러면 프랑스는 구원받으리라."
 LR_super_revolution_author:0 "-조르주 당통, 1792년 파리"
