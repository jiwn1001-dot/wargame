l_korean:
 LR_trait_lily_guardian:0 "백합의 수호자"
 LR_trait_lily_guardian_desc:0 "루이 20세는 패전의 왕으로 기억될까 두려워합니다. 그래서 그는 무엇보다 왕좌가 흔들리지 않는 것을 보여 주려 합니다."
 LR_trait_king_of_revenge:0 "복수의 왕"
 LR_trait_king_of_revenge_desc:0 "오를레앙 공은 1918년에 잘려 나간 지도를 들고 왕좌에 올랐습니다. 그를 따르는 군중은 복수를 원하고, 그는 그 열기를 식힐 생각이 없습니다."
 LR_trait_crown_refused:0 "왕관을 거절한 자"
 LR_trait_crown_refused_desc:0 "그는 대관식 날 제위를 거절하고 연미복을 입었습니다. 병사들은 그를 장군으로, 시민들은 그를 대통령으로 따릅니다."
 LR_trait_emperor:0 "황제"
 LR_trait_emperor_desc:0 "코르시카의 포병 대위가 프랑스인의 황제가 되었습니다. 그의 말은 곧 법이고, 그의 원수들은 그가 가리키는 곳으로 군대를 몰고 갑니다."
 LR_trait_red_consul:0 "붉은 통령"
 LR_trait_red_consul_desc:0 "그는 원로원이 권한 왕관도, 의회가 권한 연미복도 거절했습니다. 대신 대포를 인민에게 돌려주겠다고 했고, 인민은 그 대포를 따라 국경을 넘습니다."
 LR_trait_verdun_marshal:0 "베르됭의 원수"
 LR_trait_verdun_marshal_desc:0 "1916년 그는 무너지던 전선을 붙들었습니다. 여든의 원수는 지금도 화력이 죽이고 요새가 지킨다고 믿습니다."
 LR_trait_mountain_tribune:0 "산악파의 기수"
 LR_trait_mountain_tribune_desc:0 "블룸은 국가가 시민을 돌봐야 한다고 믿습니다. 그 믿음 뒤에는 공안위원회가 있고, 위원회는 반대파의 이름을 매주 새로 적습니다."
 LR_trait_free_trader:0 "자유 무역의 옹호자"
 LR_trait_free_trader_desc:0 "레노는 관세와 허가증을 걷어 내면 프랑스가 스스로 일어선다고 믿습니다. 보르도와 리옹의 상인들이 그의 가장 든든한 후원자입니다."
 LR_trait_notable_of_1791:0 "1791년의 명사"
 LR_trait_notable_of_1791_desc:0 "플랑댕은 혁명과 반동 사이의 좁은 길을 고집합니다. 그는 아무도 완전히 만족시키지 못하지만, 아무도 그를 쓰러뜨리려 하지는 않습니다."
 LR_trait_commune_secretary:0 "코뮌의 서기장"
 LR_trait_commune_secretary_desc:0 "토레즈는 광부의 아들입니다. 그는 규율 없는 혁명은 석 달도 버티지 못한다고 믿고, 중앙위원회의 계획표를 손에서 놓지 않습니다."
 LR_trait_federation_speaker:0 "자유 연합의 대변인"
 LR_trait_federation_speaker_desc:0 "베스나르는 명령하지 않습니다. 그는 총회의 결정을 전할 뿐입니다. 결정은 느리지만, 한번 정해지면 모두가 자기 일처럼 따릅니다."
 LR_trait_admiral_of_the_fleet:0 "함대의 제독"
 LR_trait_admiral_of_the_fleet_desc:0 "다를랑은 수병의 아들로 태어나 패전으로 흩어진 함대를 다시 세웠습니다. 그는 바다를 알고, 비시 장관들의 약점도 압니다."
 LR_trait_marshals_pupil:0 "원수의 제자"
 LR_trait_marshals_pupil_desc:0 "드골은 젊은 시절 원수의 참모로 원수의 이름이 붙은 책을 썼습니다. 그러나 그는 요새가 아니라 전차를 믿습니다."
 LR_trait_continental_commander:0 "대륙군 총사령관"
 LR_trait_continental_commander_desc:0 "워싱턴은 영국군 장교로 대전쟁에 나갔다가 식민지인이라는 이유로 진급에서 밀려났습니다. 이제 그는 영국의 군대가 아니라 대륙의 군대를 이끕니다."
 LR_FRA_reynaud:0 "폴 레노"
 LR_FRA_flandin:0 "피에르에티엔 플랑댕"
 LR_FRA_thorez:0 "모리스 토레즈"
 LR_FRA_darlan:0 "프랑수아 다를랑"
 LR_FRA_degaulle:0 "샤를 드골"
