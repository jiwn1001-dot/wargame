 LR_tt_usa_mg_planters_6:0 "농장주의 지지 §G+6§!"
 LR_tt_usa_mg_planters_4:0 "농장주의 지지 §G+4§!"
 LR_tt_usa_mg_planters_3:0 "농장주의 지지 §G+3§!"
 LR_usa_reg_new_england_town_meetings:0 "뉴잉글랜드: 타운 미팅 순회"
 LR_usa_reg_new_england_town_meetings_desc:0 "보스턴의 상인 가문과 회중교회의 마을들은 백 년이 넘도록 타운 미팅에서 스스로 일을 정해 왔습니다. 이곳 사람들은 의회와 법을 존중하고, 위에서 내려오는 명령은 그만큼 의심합니다.\n\n정부 각료들이 뉴잉글랜드의 작은 마을을 돌며 타운 미팅에 참석합니다. 질문은 날카롭지만, 질문을 받아 주었다는 것만으로도 마을 사람들은 고개를 끄덕입니다."
 LR_usa_reg_new_england_mills:0 "뉴잉글랜드: 방직 공장 현대화"
 LR_usa_reg_new_england_mills_desc:0 "보스턴의 상인 가문과 회중교회의 마을들은 백 년이 넘도록 타운 미팅에서 스스로 일을 정해 왔습니다. 이곳 사람들은 의회와 법을 존중하고, 위에서 내려오는 명령은 그만큼 의심합니다.\n\n로웰과 맨체스터의 오래된 방직 공장에 새 기계를 들입니다. 백 년 된 벽돌 건물 안에서 처음으로 전동 직기가 돌아갑니다."
 LR_usa_reg_new_england_harvard:0 "뉴잉글랜드: 대학과 손잡기"
 LR_usa_reg_new_england_harvard_desc:0 "보스턴의 상인 가문과 회중교회의 마을들은 백 년이 넘도록 타운 미팅에서 스스로 일을 정해 왔습니다. 이곳 사람들은 의회와 법을 존중하고, 위에서 내려오는 명령은 그만큼 의심합니다.\n\n하버드와 MIT의 교수들을 정부 위원회에 앉힙니다. 학자들이 정부 편에 서자 보스턴의 신문 논조가 눈에 띄게 부드러워집니다."
 LR_usa_reg_mid_atlantic_machine:0 "중부 대서양: 정치 조직과의 거래"
 LR_usa_reg_mid_atlantic_machine_desc:0 "뉴욕의 은행과 필라델피아의 공장, 그리고 그 사이를 메운 이민자 동네가 이 나라의 돈과 사람을 쥐고 있습니다. 표는 구역마다 정치 조직이 모으고, 그 조직은 대가 없이 움직이지 않습니다.\n\n뉴욕과 필라델피아의 구역 보스들에게 일자리와 계약을 약속합니다. 그들이 움직이면 다음 선거 날 투표소 앞에 줄이 생깁니다."
 LR_usa_reg_mid_atlantic_wall_street:0 "중부 대서양: 월가의 공채 인수"
 LR_usa_reg_mid_atlantic_wall_street_desc:0 "뉴욕의 은행과 필라델피아의 공장, 그리고 그 사이를 메운 이민자 동네가 이 나라의 돈과 사람을 쥐고 있습니다. 표는 구역마다 정치 조직이 모으고, 그 조직은 대가 없이 움직이지 않습니다.\n\n월가의 은행들이 정부 공채를 인수하는 대신 항만과 철도 사업의 지분을 받습니다. 허드슨강 하구에 새 부두가 들어섭니다."
 LR_usa_reg_mid_atlantic_immigrants:0 "중부 대서양: 이민자 구제 사업"
 LR_usa_reg_mid_atlantic_immigrants_desc:0 "뉴욕의 은행과 필라델피아의 공장, 그리고 그 사이를 메운 이민자 동네가 이 나라의 돈과 사람을 쥐고 있습니다. 표는 구역마다 정치 조직이 모으고, 그 조직은 대가 없이 움직이지 않습니다.\n\n로어이스트사이드와 사우스필라델피아의 공동주택에 무료 진료소와 야간 학교를 엽니다. 이탈리아어와 이디시어로 된 감사 편지가 시청에 쌓입니다."
 LR_usa_reg_chesapeake_tidewater:0 "체서피크: 타이드워터 가문의 만찬"
 LR_usa_reg_chesapeake_tidewater_desc:0 "버지니아와 메릴랜드의 오래된 지주 가문들은 독립 전쟁 이전부터 이 땅을 다스려 왔습니다. 웨스트버지니아의 탄광촌은 그 가문들과 사이가 나쁘지만, 함께 체서피크만의 항구로 석탄을 내보냅니다.\n\n제임스강 변의 오래된 저택에서 지주 가문의 가장들과 만찬을 엽니다. 은 식기 사이로 오간 약속은 다음 주 주 의회에서 표가 됩니다."
 LR_usa_reg_chesapeake_norfolk:0 "체서피크: 노퍽 조선소 확장"
 LR_usa_reg_chesapeake_norfolk_desc:0 "버지니아와 메릴랜드의 오래된 지주 가문들은 독립 전쟁 이전부터 이 땅을 다스려 왔습니다. 웨스트버지니아의 탄광촌은 그 가문들과 사이가 나쁘지만, 함께 체서피크만의 항구로 석탄을 내보냅니다.\n\n노퍽과 볼티모어의 조선소에 새 선대를 놓습니다. 탄광촌의 젊은이들이 조선소로 내려와 용접공이 됩니다."
 LR_usa_reg_chesapeake_coal_strike:0 "체서피크: 탄광 분쟁 조정"
 LR_usa_reg_chesapeake_coal_strike_desc:0 "버지니아와 메릴랜드의 오래된 지주 가문들은 독립 전쟁 이전부터 이 땅을 다스려 왔습니다. 웨스트버지니아의 탄광촌은 그 가문들과 사이가 나쁘지만, 함께 체서피크만의 항구로 석탄을 내보냅니다.\n\n웨스트버지니아 탄광의 노사 대표를 한자리에 앉히고 정부가 중재안을 내놓습니다. 총을 든 경비대가 탄광 입구에서 물러납니다."
 LR_usa_reg_great_lakes_unions:0 "오대호 공업지대: 노조 지도부 회동"
 LR_usa_reg_great_lakes_unions_desc:0 "디트로이트의 자동차, 피츠버그와 클리블랜드의 철강, 시카고의 도살장과 철도가 모인 곳입니다. 공장 노동자들은 노동조합으로 뭉쳐 있고, 그들의 파업 한 번이면 나라 전체의 생산이 멈춥니다.\n\n자동차 노조와 철강 노조의 지도부를 정부 청사로 부릅니다. 임금 인상 약속 한 줄이 파업 결의문 열 장을 거두어들입니다."
 LR_usa_reg_great_lakes_assembly_lines:0 "오대호 공업지대: 조립 라인 증설"
 LR_usa_reg_great_lakes_assembly_lines_desc:0 "디트로이트의 자동차, 피츠버그와 클리블랜드의 철강, 시카고의 도살장과 철도가 모인 곳입니다. 공장 노동자들은 노동조합으로 뭉쳐 있고, 그들의 파업 한 번이면 나라 전체의 생산이 멈춥니다.\n\n디트로이트의 자동차 공장 옆에 군수품 조립 라인을 새로 깝니다. 트럭을 만들던 손이 이제 포탄을 만듭니다."
 LR_usa_reg_great_lakes_company_towns:0 "오대호 공업지대: 회사 마을 개혁"
 LR_usa_reg_great_lakes_company_towns_desc:0 "디트로이트의 자동차, 피츠버그와 클리블랜드의 철강, 시카고의 도살장과 철도가 모인 곳입니다. 공장 노동자들은 노동조합으로 뭉쳐 있고, 그들의 파업 한 번이면 나라 전체의 생산이 멈춥니다.\n\n공장 주변의 회사 마을에서 회사 상점과 회사 경찰을 없앱니다. 노동자들은 처음으로 월급을 자기가 고른 가게에서 씁니다."
 LR_usa_reg_upper_south_revival:0 "내륙 남부: 천막 부흥회 지원"
 LR_usa_reg_upper_south_revival_desc:0 "애팔래치아 산맥의 골짜기마다 오래된 가문과 오래된 원한이 있습니다. 담배밭과 탄광, 위스키 증류소가 생계를 떠받치고, 사람들은 정부보다 이웃과 교회를 먼저 믿습니다.\n\n여름마다 골짜기를 도는 천막 부흥회에 정부가 천막과 발전기를 대 줍니다. 설교자들이 기도 끝에 정부를 위한 축복을 한 줄 덧붙입니다."
 LR_usa_reg_upper_south_dams:0 "내륙 남부: 테네시강 댐 사업"
 LR_usa_reg_upper_south_dams_desc:0 "애팔래치아 산맥의 골짜기마다 오래된 가문과 오래된 원한이 있습니다. 담배밭과 탄광, 위스키 증류소가 생계를 떠받치고, 사람들은 정부보다 이웃과 교회를 먼저 믿습니다.\n\n테네시강과 컴벌랜드강에 댐을 쌓고 발전소를 세웁니다. 등잔불을 켜던 골짜기에 처음으로 전깃불이 들어옵니다."
 LR_usa_reg_upper_south_moonshine:0 "내륙 남부: 밀주 단속 완화"
 LR_usa_reg_upper_south_moonshine_desc:0 "애팔래치아 산맥의 골짜기마다 오래된 가문과 오래된 원한이 있습니다. 담배밭과 탄광, 위스키 증류소가 생계를 떠받치고, 사람들은 정부보다 이웃과 교회를 먼저 믿습니다.\n\n골짜기 증류소에 대한 단속을 늦추고 대신 세금을 조금 받습니다. 연방 단속관과 산골 사람들 사이의 총격이 눈에 띄게 줄어듭니다."
 LR_usa_reg_deep_south_planters:0 "딥사우스: 농장주 의회와의 타협"
 LR_usa_reg_deep_south_planters_desc:0 "목화밭과 사탕수수밭, 농장주의 저택과 소작인의 오두막이 이어지는 땅입니다. 농장주 가문들이 주 의회를 쥐고 있고, 흑인 소작인들은 투표소에 가는 길부터 막혀 있습니다.\n\n농장주 가문의 대표들에게 목화 가격 지지를 약속합니다. 그들은 대가로 주 의회의 표를 내놓지만, 소작인들의 사정은 조금도 달라지지 않습니다."
 LR_usa_reg_deep_south_gulf_ports:0 "딥사우스: 멕시코만 항구 정비"
 LR_usa_reg_deep_south_gulf_ports_desc:0 "목화밭과 사탕수수밭, 농장주의 저택과 소작인의 오두막이 이어지는 땅입니다. 농장주 가문들이 주 의회를 쥐고 있고, 흑인 소작인들은 투표소에 가는 길부터 막혀 있습니다.\n\n뉴올리언스와 모빌의 부두를 넓히고 새 기중기를 들입니다. 목화를 싣던 부두에서 이제 군수품도 실려 나갑니다."
 LR_usa_reg_deep_south_sharecroppers:0 "딥사우스: 소작인 구제"
 LR_usa_reg_deep_south_sharecroppers_desc:0 "목화밭과 사탕수수밭, 농장주의 저택과 소작인의 오두막이 이어지는 땅입니다. 농장주 가문들이 주 의회를 쥐고 있고, 흑인 소작인들은 투표소에 가는 길부터 막혀 있습니다.\n\n소작인 가족들에게 종자와 농기구를 빌려주는 정부 기금을 만듭니다. 농장주들은 반발하지만, 들판의 소요는 잦아듭니다."
 LR_usa_reg_plains_grain_price:0 "대평원: 곡물 가격 지지"
 LR_usa_reg_plains_grain_price_desc:0 "밀과 옥수수가 지평선까지 이어지는 땅입니다. 모래 폭풍과 곡물 가격 폭락이 몇 해째 농민들을 괴롭혔고, 농민들은 협동조합으로 뭉쳐 동부의 은행과 철도 회사를 원망합니다.\n\n정부가 밀과 옥수수를 정해진 값에 사들이겠다고 발표합니다. 경매에 넘어갈 뻔한 농장들이 한 해를 더 버팁니다."
 LR_usa_reg_plains_rural_roads:0 "대평원: 농촌 도로망"
 LR_usa_reg_plains_rural_roads_desc:0 "밀과 옥수수가 지평선까지 이어지는 땅입니다. 모래 폭풍과 곡물 가격 폭락이 몇 해째 농민들을 괴롭혔고, 농민들은 협동조합으로 뭉쳐 동부의 은행과 철도 회사를 원망합니다.\n\n농장과 곡물 창고, 철도역을 잇는 자갈길을 놓습니다. 곡물을 싣고 진흙탕에서 빠져나오지 못하던 트럭들이 이제 하루에 두 번 오갑니다."
 LR_usa_reg_plains_shelterbelt:0 "대평원: 방풍림 조성"
 LR_usa_reg_plains_shelterbelt_desc:0 "밀과 옥수수가 지평선까지 이어지는 땅입니다. 모래 폭풍과 곡물 가격 폭락이 몇 해째 농민들을 괴롭혔고, 농민들은 협동조합으로 뭉쳐 동부의 은행과 철도 회사를 원망합니다.\n\n평원 한가운데 수백 마일에 걸쳐 나무를 심어 모래 폭풍을 막습니다. 나무 심는 일자리를 얻은 농민의 아들들이 정부를 다시 봅니다."
 LR_usa_reg_mountain_west_ranchers:0 "산악 서부: 목장주 협회 회동"
 LR_usa_reg_mountain_west_ranchers_desc:0 "로키산맥의 광산촌과 목장이 띄엄띄엄 흩어진 땅입니다. 구리와 은을 캐는 광부들과 소를 치는 목장주들은 서로를 좋아하지 않지만, 동부에서 온 관리를 싫어한다는 점에서는 한마음입니다.\n\n덴버의 목장주 협회 연례 회의에 정부 각료가 참석해 방목지 사용료를 깎아 주겠다고 약속합니다. 카우보이모자들이 일제히 박수를 칩니다."
 LR_usa_reg_mountain_west_mines:0 "산악 서부: 광산 철도 부설"
 LR_usa_reg_mountain_west_mines_desc:0 "로키산맥의 광산촌과 목장이 띄엄띄엄 흩어진 땅입니다. 구리와 은을 캐는 광부들과 소를 치는 목장주들은 서로를 좋아하지 않지만, 동부에서 온 관리를 싫어한다는 점에서는 한마음입니다.\n\n뷰트와 리드빌의 광산에서 본선 철도까지 지선을 놓습니다. 노새가 끌던 광석 수레 대신 화물 열차가 산을 내려갑니다."
 LR_usa_reg_mountain_west_miners:0 "산악 서부: 광부 안전법"
 LR_usa_reg_mountain_west_miners_desc:0 "로키산맥의 광산촌과 목장이 띄엄띄엄 흩어진 땅입니다. 구리와 은을 캐는 광부들과 소를 치는 목장주들은 서로를 좋아하지 않지만, 동부에서 온 관리를 싫어한다는 점에서는 한마음입니다.\n\n갱도 붕괴와 가스 폭발을 막는 안전 규정을 법으로 만듭니다. 광부 노조가 처음으로 정부 발표를 환영하는 성명을 냅니다."
 LR_usa_reg_pacific_longshoremen:0 "태평양 연안: 부두 노동자 협약"
 LR_usa_reg_pacific_longshoremen_desc:0 "시애틀과 포틀랜드의 항구, 컬럼비아강의 목재소와 연어 통조림 공장이 모인 곳입니다. 대륙 반대편의 수도는 멀고, 이곳 사람들은 태평양 건너의 무역에 더 관심이 많습니다.\n\n시애틀과 포틀랜드의 부두 노동자 노조와 고용 협약을 맺습니다. 부두마다 멈춰 있던 기중기가 다시 움직입니다."
 LR_usa_reg_pacific_puget_sound:0 "태평양 연안: 퓨젓사운드 조선소"
 LR_usa_reg_pacific_puget_sound_desc:0 "시애틀과 포틀랜드의 항구, 컬럼비아강의 목재소와 연어 통조림 공장이 모인 곳입니다. 대륙 반대편의 수도는 멀고, 이곳 사람들은 태평양 건너의 무역에 더 관심이 많습니다.\n\n퓨젓사운드의 해군 조선소를 넓히고 새 건선거를 팝니다. 목재소에서 일하던 사람들이 조선소로 옮겨 갑니다."
 LR_usa_reg_pacific_columbia:0 "태평양 연안: 컬럼비아강 개발"
 LR_usa_reg_pacific_columbia_desc:0 "시애틀과 포틀랜드의 항구, 컬럼비아강의 목재소와 연어 통조림 공장이 모인 곳입니다. 대륙 반대편의 수도는 멀고, 이곳 사람들은 태평양 건너의 무역에 더 관심이 많습니다.\n\n컬럼비아강에 댐을 쌓아 전기와 물을 끌어옵니다. 메마른 동부 워싱턴의 땅에 처음으로 수로가 놓입니다."
 LR_usa_cat_regions:0 "지역 민심"
 LR_usa_cat_regions_desc:0 "이 대륙은 한 나라라 부르기에는 너무 넓고, 지역마다 바라는 정부가 다릅니다. 지역의 민심은 0에서 100 사이에서 움직이며, 정부의 성향에 따라 오르거나 내리고 시간이 지나면 50으로 돌아갑니다. 65를 넘는 지역의 주는 건설과 자원이 늘고, 35 아래로 떨어진 지역의 주는 줄어듭니다. 가진 지역의 평균이 나라의 안정도와 정치력을 정하고, 평균이 60을 넘으면 집권당의 지지율이 오릅니다.\n\n§Y뉴잉글랜드§!: [?ROOT.LR_usa_reg_new_england|0] §Y중부 대서양§!: [?ROOT.LR_usa_reg_mid_atlantic|0] §Y체서피크§!: [?ROOT.LR_usa_reg_chesapeake|0] §Y오대호 공업지대§!: [?ROOT.LR_usa_reg_great_lakes|0] §Y내륙 남부§!: [?ROOT.LR_usa_reg_upper_south|0] §Y딥사우스§!: [?ROOT.LR_usa_reg_deep_south|0] §Y대평원§!: [?ROOT.LR_usa_reg_plains|0] §Y산악 서부§!: [?ROOT.LR_usa_reg_mountain_west|0] §Y태평양 연안§!: [?ROOT.LR_usa_reg_pacific|0]\n\n평균: [?ROOT.LR_usa_reg_avg|0]"
 LR_usa_regions:0 "지역 민심"
 LR_usa_reg_loyal:0 "정부를 지지하는 지역"
 LR_usa_reg_unrest:0 "정부에 등 돌린 지역"
 LR_usa_cat_congress:0 "연방 의회"
 LR_usa_cat_congress_desc:0 "민주 정부는 의회의 다수 없이 법을 만들 수 없습니다. 하원 435석 가운데 218석을 넘기면 정부가 힘을 얻고, 그 아래로 떨어지면 법안이 막히고 정치력이 줄어듭니다. 상원의 의석은 나라의 안정도를 움직입니다. 법안 중점을 통과시킬 때마다 하원의 표가 조금씩 빠져나가고, 2년마다 치르는 중간선거는 집권당의 지지율과 지역 민심으로 의석을 다시 나눕니다.\n\n§Y하원§!: [?ROOT.LR_usa_house|0] / 435 (과반 218) §Y상원§!: [?ROOT.LR_usa_senate|0] / 96 (과반 49) 다음 선거까지: [?ROOT.LR_usa_cg_months|0] / 24개월"
 LR_usa_congress:0 "연방 의회"
 LR_usa_cg_whip:0 "원내 표 단속"
 LR_usa_cg_whip_desc:0 "원내 총무가 의원 사무실을 하나씩 돌며 다음 표결의 표를 셉니다. 망설이던 의원 몇은 지역구 우체국장 자리 하나에 마음을 정합니다."
 LR_usa_cg_pork:0 "지역구 예산 끼워 넣기"
 LR_usa_cg_pork_desc:0 "법안 끝에 의원들의 지역구 다리와 우체국 예산을 붙입니다. 신문은 돼지 여물통이라 비웃지만, 법안은 통과됩니다."
 LR_usa_cg_senate_deal:0 "상원 원로와의 거래"
 LR_usa_cg_senate_deal_desc:0 "상원 외교위원장을 백악관 저녁 식사에 초대합니다. 그는 디저트가 나오기 전에 자기 주의 군사 기지 이야기를 꺼냅니다."
 LR_usa_cg_fireside:0 "노변담화"
 LR_usa_cg_fireside_desc:0 "대통령이 라디오 앞에 앉아 국민에게 직접 법안을 설명합니다. 다음 날 의원 사무실마다 법안을 통과시키라는 편지가 쏟아집니다."
 LR_tt_usa_congress_majority:0 "민주 정부라면 하원 과반(218석)이 필요하다"
 LR_tt_usa_bill_10:0 "법안 통과에 하원 표 §R10§!석을 쓴다"
 LR_tt_usa_bill_15:0 "법안 통과에 하원 표 §R15§!석을 쓴다"
 LR_tt_usa_bill_20:0 "법안 통과에 하원 표 §R20§!석을 쓴다"
 LR_tt_usa_bill_25:0 "법안 통과에 하원 표 §R25§!석을 쓴다"
 lr_usacg.1.t:0 "중간선거 결과 발표"
 lr_usacg.1.d:0 "2년 만의 중간선거가 끝났습니다. 개표는 밤새 이어졌고, 각 지역의 결과가 전신으로 수도에 모였습니다. 새 의회에서 정부를 지지하는 의원은 하원 [?ROOT.LR_usa_house|0]석, 상원 [?ROOT.LR_usa_senate|0]석입니다. 정치 평론가들은 지역마다 갈린 표심을 두고 정부가 어느 지역의 마음을 얻었고 어느 지역을 잃었는지 따지는 기사를 쏟아내고 있습니다."
 lr_usacg.1.a:0 "새 의회와 일할 준비를 합니다."
 lr_usa.1.t:0 "총독 관저의 겨울"
 lr_usa.1.d:0 "1936년 1월 2일, 뉴욕 총독 관저 2층 집무실은 난방이 반쯤 고장 난 탓에 입김이 하얗게 보일 만큼 추웠고, 서기관 에드워드 헤일은 외투 깃을 세운 채 그날 올라온 보고서를 한 장씩 넘기고 있었다. 맨 위에 놓인 것은 버지니아 마운트버넌 농장 주인에 관한 석 장짜리 문서였는데, 헤일은 그것을 총독 책상에 올려놓으면서 괜히 헛기침을 한 번 했다.\n\n\"조지 워싱턴, 마흔둘, 퇴역 소령이라.\" 그렌빌 총독은 이름을 소리 내어 읽더니 안경을 벗어 손수건으로 닦았다. \"어디서 들어 본 이름인데.\"\n\n\"플랑드르에서 훈장을 받은 사람입니다, 각하. 식민지 출신이라 대령 진급 심사에서 두 번 떨어졌고요.\" 그중 한 번은 당시 전쟁성 차관이던 각하께서 직접 서류에 줄을 그으셨다는 말까지 꺼냈다가는 좋을 일이 없을 것 같아, 헤일은 거기서 말을 멈췄다.\n\n보고서에 따르면 워싱턴은 지난 석 달 사이 필라델피아를 일곱 번이나 오갔고, 매번 같은 여관에 묵으면서 매번 다른 사람들을 만났다고 했다. 펜실베이니아 철강 노조 위원장을 만난 날도 있었고, 보스턴에서 신문사를 하는 남자나 캐롤라이나에서 올라온 퇴역 대위 세 사람과 저녁을 먹은 날도 있었다.\n\n\"식민지 사람들이야 원래 모이길 좋아하지.\" 총독은 보고서를 덮고 창밖의 회색 하늘로 눈을 돌렸다. \"모여서 술 마시고 런던 욕이나 좀 하다가 다들 집에 가는 거야. 내가 여기 온 뒤로 이십 년째 그래 왔다고.\"\n\n헤일은 \"예, 각하\" 하고 고개를 숙인 뒤 자기 자리로 돌아왔는데, 서랍을 열어 보고서 사본을 한 부 더 만들어 따로 철해 두는 그의 손은 어쩐지 평소보다 조심스러웠다."
 lr_usa.1.a:0 "식민지의 겨울은 길지."
 lr_usa.10.t:0 "필라델피아의 7월"
 lr_usa.10.d:0 "7월 4일 오후 두 시 십 분, 뉴욕 총독 관저 지하 전신실의 마거릿 콜린스는 필라델피아에서 들어온 전문의 첫 줄을 받아 적다가 그만 연필을 떨어뜨렸다. 독립기념관에 대표 쉰여섯 명이 모여 독립 선언문에 서명했고, 조지 워싱턴이라는 사람이 대륙군 총사령관으로 지명되었다는 내용이었다.\n\n그녀가 허리를 굽혀 연필을 줍는 사이에도 수신기는 쉬지 않고 딸깍거렸다. 피츠버그 수비대가 무장 해제를 당했다는 소식이 들어오더니, 이어서 볼티모어 항구에 민병대가 들어왔다는 전보와 보스턴의 총독부 세관이 불타고 있다는 전보가 연달아 들어왔다. 다섯 시쯤 되자 버지니아와 캐롤라이나, 매사추세츠는 물론이고 오하이오와 미시간에서까지 비슷한 내용이 쏟아졌고, 여섯 시가 막 지났을 무렵 필라델피아 회선이 뚝 끊겼다.\n\n위층에서는 총독이 런던과 통화하는 소리가 계단을 타고 내려왔다. 증원군은 아무리 서둘러도 석 달은 걸릴 테니 그때까지는 총독부 군대가 알아서 버티라는 대답을 들은 모양인지, 고함 소리가 한참이나 이어지다가 수화기를 내던지는 소리와 함께 그쳤다.\n\n밤 아홉 시가 넘어 서기관 헤일이 전신실로 내려왔다. 그는 마지막으로 들어온 워싱턴의 선언문 전문을 직접 받아 들고 끝까지 읽더니, 다 읽은 뒤에도 종이를 손에 쥔 채 한동안 그 자리에 서 있었다.\n\n\"작년 1월에 분명히 보고를 올렸는데 말이야.\" 헤일이 혼잣말처럼 중얼거렸다.\n\n마거릿은 뭐라고 대꾸해야 할지 몰라 수신기 쪽으로 몸을 돌렸다. 피츠버그 제철소에서 일하는 오빠가 오늘 오후 수비대를 무장 해제한 노동자들 틈에 끼어 있었을지도 모른다는 생각이 자꾸 고개를 들었지만, 그녀는 그 생각을 애써 밀어내고 다음 전보가 들어오기를 기다렸다."
 lr_usa.10.a:0 "총독부는 무너지지 않는다."
 lr_usa.10.b:0 "필라델피아로 가겠다. 대륙 회의의 편에 선다."
 lr_usa.11.t:0 "열세 식민지, 다시 독립을 선언하다"
 lr_usa.11.d:0 "7월 4일 필라델피아에서 북아메리카 식민지 대표 쉰여섯 명이 영국으로부터의 독립을 선언했습니다. 대륙 회의는 퇴역 소령 조지 워싱턴을 대륙군 총사령관으로 지명했습니다.\n\n런던 「타임스」는 이번 봉기를 \"식민지의 열병\"이라고 불렀습니다. 전쟁성은 \"소수 선동가의 난동\"이라며 북아메리카 총독부가 곧 질서를 되찾을 것이라고 밝혔습니다. 그러나 펜실베이니아와 버지니아, 매사추세츠의 수비대가 이미 무장 해제되었다는 보도가 잇따르고 있습니다. 파리의 외교가에서는 1778년 이야기가 다시 오르내린다고 합니다."
 lr_usa.11.a:0 "160년 만이군."
 lr_usa.20.t:0 "총독 관저의 깃발"
 lr_usa.20.d:0 "뉴욕 총독 관저의 정문은 뜻밖에도 잠겨 있지 않았다. 대륙군 제3연대의 존 매클레인 대위는 부하 여섯 명을 데리고 계단을 오르면서 혹시 어디선가 총알이 날아올까 싶어 권총을 뽑아 든 채 모퉁이마다 몸을 숙였는데, 끝내 총소리 한 번 듣지 못하고 2층 집무실 문 앞에 닿았다.\n\n집무실에는 총독과 서기관 한 사람만 남아 있었다. 총독은 정장을 갖춰 입고 꼿꼿이 앉아 있었고, 책상 위에는 이미 항복 문서 두 부와 만년필이 가지런히 놓여 있었다.\n\n\"워싱턴 장군은 어디 계시오?\" 총독이 물었다.\n\n\"브루클린에 계십니다. 내일 이리 오실 겁니다.\" 대답을 하고 나서야 매클레인은 자기가 저도 모르게 존댓말을 쓰고 있다는 걸 깨달았는데, 열한 달 전까지만 해도 이 사람이 그의 총독이었으니 그럴 만도 했다.\n\n총독과 서기관이 차례로 서명을 마치자 매클레인은 문서를 받아 든 채 자기는 어디에 무엇을 써야 하는지 몰라 잠시 머뭇거리다가, 결국 맨 아래에 대위라는 계급과 이름을 적어 넣었다. 훗날 역사책에 실린 항복 문서에 웬 대위의 서명이 들어가 있는 건 바로 그날의 그 머뭇거림 때문이었다.\n\n지붕 위 깃대에서 유니언잭을 내린 병사 셋은 깃발을 어떻게 접어야 하는지 몰라서 둘둘 말아 겨드랑이에 끼고 내려왔는데, 관저 앞에 모여 있던 사람들은 그 어설픈 모습을 보고도 박수를 치며 환호성을 질렀다.\n\n저녁 무렵 필라델피아의 대륙 회의에 런던의 전보가 도착했다. 영국 귀족 의회는 전쟁이 아직 끝나지 않았다고 못 박았고, 북쪽 국경 너머 캐나다에는 여전히 영국군 두 개 사단이 버티고 있었다."
 lr_usa.20.a:0 "독립이면 충분하다. 런던과 강화한다."
 lr_usa.20.b:0 "캐나다까지 간다."
 lr_usa.21.t:0 "미합중국 수립"
 lr_usa.21.d:0 "북아메리카 총독부가 항복했습니다. 대륙 회의는 열세 식민지와 서부 영토를 아우르는 미합중국의 수립을 선포했습니다. 뉴욕 총독 관저의 항복 문서에는 대륙군 대위 한 명의 서명이 들어갔다고 합니다.\n\n파리의 「르탕」은 이를 \"1783년에 왔어야 할 소식\"이라고 썼습니다. 워싱턴 총사령관은 \"이 공화국은 어느 왕도, 어느 귀족도 섬기지 않는다\"고 말했습니다. 런던의 귀족 의회는 아직 공식 반응을 내놓지 않았습니다. 유럽 각국의 궁정은 이 소식을 불편한 침묵으로 받아들이고 있는 것으로 보입니다."
 lr_usa.21.a:0 "왕 없는 나라라니."
 lr_usa.22.t:0 "멈춘 시계"
 lr_usa.22.d:0 "대륙군 제1군단 통신병 해럴드 브릭스는 오타와 의사당 계단에 무전기를 내려놓다가, 평화의 탑 꼭대기에 걸린 시계가 오후 세 시 십오 분에 멈춰 있는 것을 보았다. 날아든 포탄 파편에 시곗바늘이 부러진 모양이었다.\n\n캐나다 정부는 이틀 전에 퀘벡으로 빠져나갔고, 텅 빈 의사당을 지키던 건 서기 몇 사람과 늙은 경비원 하나뿐이었다. 경비원은 총을 바닥에 내려놓고 대륙군 장교에게 열쇠 꾸러미를 건네주었는데, 열여섯 개나 되는 열쇠 가운데 어느 것이 어느 문에 맞는지는 그 자신도 잘 모르는 눈치였다.\n\n브릭스가 필라델피아로 보낸 전문은 오타와 점령, 저항 없음, 시계 고장이라는 세 마디였다. 마지막 마디는 별 뜻 없이 덧붙인 것이었는데, 다음 날 필라델피아 신문들이 그 전문을 그대로 실으면서 사람들은 그 말을 영국의 시간이 멈췄다는 뜻으로 받아들였다.\n\n런던의 귀족 의회가 강화를 제안해 온 건 그 주가 다 가기 전이었다. 대서양 건너에서 지켜야 할 것이 워낙 많다 보니, 이미 손에서 빠져나간 땅에 매달려 있을 여유가 그들에게는 남아 있지 않았던 것이다."
 lr_usa.22.a:0 "북쪽 국경은 이제 북극해다."
 lr_usa.23.t:0 "의자 하나"
 lr_usa.23.d:0 "속기사 루스 에이브럼스가 넉 달 동안 써 없앤 연필은 이백 자루가 넘었다. 필라델피아 독립기념관 동쪽 방에서 대표 쉰다섯 명이 하루 아홉 시간씩 쉬지 않고 떠들어 대는 걸 받아 적으려면 그 정도는 있어야 했다.\n\n가장 오래 끈 논쟁은 대통령 임기를 몇 년으로 하느냐였다. 버지니아 대표가 종신으로 하자고 우기자 매사추세츠 대표가 그럴 바엔 차라리 스페인에서 왕을 하나 빌려 오는 게 낫겠다고 비꼬았고, 회의장이 웃음과 고함으로 뒤집히는 동안 루스는 두 사람의 말을 한 글자도 빼놓지 않고 받아 적었다. 임기가 사 년으로 정해진 건 그다음 주의 일이었다.\n\n그다음으로 시끄러웠던 건 서부 문제였다. 미시시피 서쪽 땅을 여러 주로 쪼갤지 연방이 직접 다스릴지를 두고 언성이 높아지던 중에 오하이오 대표 하나가 의자를 집어 던졌는데, 다행히 의자는 사람 대신 창문을 깨고 바깥 마당으로 떨어졌고, 그 창문은 헌법에 서명하는 날까지 판자로 막아 둔 채였다.\n\n넉 달 내내 의장석을 지킨 워싱턴은 좀처럼 입을 열지 않았다. 루스의 속기록에 남은 그의 발언은 모두 합쳐 열한 줄이었는데, 그중 아홉 줄이 \"다음 발언자\"였다.\n\n서명식이 끝나고 대표들이 다 빠져나간 뒤, 워싱턴이 속기사 자리로 걸어와 빠짐없이 다 적었느냐고 물었다. 루스가 의자 던진 일까지 적어 두었다고 대답하자, 그는 잠시 생각에 잠기는가 싶더니 그건 지우지 말고 그대로 두라며 빙그레 웃었다."
 lr_usa.23.a:0 "의자 하나쯤은 괜찮지."
 lr_usa.26.t:0 "피의 독립기념일"
 lr_usa.26.d:0 "사진기자 프랭크 오도널이 「필라델피아 인콰이어러」에서 받은 자리는 연단 왼쪽 세 번째 줄이었다. 대통령의 옆얼굴을 찍기에 거기만 한 자리가 없다고 생각한 그는 아침 일곱 시부터 나와서 그 자리를 지키고 있었다.\n\n오전 열한 시 사 분에 워싱턴이 연단에 올랐다. 경찰 추산으로 육만 명이 광장을 메우고 있었는데, 바람에 반쯤 날아간 첫 문장에 이어 두 번째 문장이 나오자 군중 사이에서 웃음이 터졌다. 공화국은 어느 귀족에게도 생일 축하 전보를 보낼 필요가 없다는 농담이었다.\n\n오도널이 세 번째 사진을 찍으려고 필름을 감는데 어디선가 탕 하는 소리가 났다. 그는 누가 폭죽을 터뜨렸나 보다 하고 고개를 들었다가, 두 번째 소리와 함께 연단 위의 대통령이 오른쪽으로 천천히 기울어지는 것을 보았다. 세 번째 총성은 들었는지조차 기억나지 않았는데, 그 무렵에는 이미 비명을 지르며 달아나는 사람들에게 떠밀려 바닥을 나뒹굴고 있었기 때문이다.\n\n넘어지면서도 끝까지 붙들고 있던 사진기를 그날 저녁 암실에서 현상해 보니, 그 순간에 찍힌 사진은 모두 석 장이었다. 첫 장에는 연설하는 워싱턴이, 둘째 장에는 기울어진 하늘이, 그리고 셋째 장에는 독립기념관 2층 창문과 그 안에서 무언가를 들고 서 있는 흐릿한 사람의 윤곽이 찍혀 있었다.\n\n대통령은 펜실베이니아 병원으로 달려가던 구급차 안에서 숨을 거두었다. 범인은 현장에서 경찰의 총에 맞아 죽었고 그 이름은 사흘이 지나서야 신문에 실렸지만, 그때쯤 거리에서는 영국 첩자의 짓이라는 사람과 빨갱이들의 짓이라는 사람, 군대가 꾸민 일이라는 사람들이 뒤엉켜 서로 멱살을 잡고 있었다."
 lr_usa.26.a:0 "공화국은 이 사람 없이 살아남아야 한다."
 lr_usa.27.t:0 "거리의 분노"
 lr_usa.27.d:0 "시카고 경찰 제7관구의 토머스 키어넌 경사는 장례식 다음 날부터 집에 들어가지 못하고 있었다. 사우스사이드에서는 제철소 노동자들이 공장 문을 걸어 잠그고 거리로 몰려나왔고 웨스트사이드에서는 퇴역 군인회가 영국 영사관을 향해 행진을 벌였는데, 두 무리가 외치는 구호는 전혀 달라도 경찰을 향해 날아오는 벽돌만큼은 똑같았다.\n\n사흘째 되던 날 영사관 유리창이 남김없이 깨졌고, 나흘째에는 누군가 노동회관에 불을 질렀다. 노동자들이 퇴역 군인회의 소행이라고 손가락질하자 퇴역 군인회는 노동자들이 꾸민 자작극이라고 맞받았고, 불탄 건물 앞에서 양쪽을 떼어 놓던 키어넌은 어디선가 날아온 돌에 왼쪽 귀를 맞아 한참 동안 피를 흘렸다.\n\n필라델피아에서 내려온 지시는 질서는 유지하되 발포는 하지 말라는 것이었는데, 키어넌은 그 지시문을 읽다가 그만 웃음을 터뜨리고 말았다. 그의 관구에 남은 순경은 고작 마흔 명이었고, 거리에 쏟아져 나온 사람은 이만 명이 넘었으니 말이다.\n\n시위대는 밤이면 흩어졌다가 아침이 되면 어김없이 다시 모여들었는데, 날이 갈수록 사람들 입에서는 누가 대통령을 죽였느냐는 말보다 다음 달 집세를 어떻게 내느냐는 말이 더 자주 흘러나왔다. 시카고 공장의 절반이 이미 문을 닫은 뒤였다."
 lr_usa.27.a:0 "이건 시작일 뿐이야."
 lr_usa.28.t:0 "런던의 보복"
 lr_usa.28.d:0 "재무부 국제결제과의 프랜시스 웰던은 런던에서 날아온 통고문을 세 번이나 다시 읽었다. 영국 귀족 의회는 미합중국과의 파운드화 결제를 전면 중단하고, 영국 항구에 들어오는 미국 선박에는 화물 가치의 사 할을 관세로 물리겠다고 통보해 왔다. 대통령이 암살된 뒤의 혼란이 영국 투자자들의 재산을 위협하고 있다는 게 그 이유였다.\n\n웰던은 연필을 들고 숫자를 따져 보았다. 미국에서 나는 면화의 육 할과 밀의 사 할이 리버풀로 팔려 나가고 있었고, 피츠버그 철강 회사들이 진 빚은 거의 다 런던 은행에 묶여 있었으니, 결제가 막히면 그 빚은 당장 다음 주부터 연체로 넘어갈 판이었다.\n\n보고서를 쓰다 말고 창밖을 내다보니 재무부 건물 앞에서도 시위가 한창이었다. 영국을 몰아내자고 적힌 팻말을 보고 웰던은 쓴웃음을 지었는데, 저 사람들은 이미 영국을 몰아냈는데도 영국의 돈만은 고스란히 남아 이 나라의 목줄을 쥐고 있다는 사실이 새삼 기가 막혔기 때문이다.\n\n석 달 안에 공장의 삼분의 일이 멈출 것이라는 한 줄로 결론을 맺은 보고서가 대통령 집무실에 올라갔고, 헐 대통령은 그 줄에 연필로 밑줄을 그은 뒤 한참을 들여다보다가 보고서를 책상 서랍에 넣었다."
 lr_usa.28.a:0 "런던은 이걸 기다렸던 거야."
 lr_usa.29.t:0 "붉은 깃발"
 lr_usa.29.d:0 "디트로이트 캐딜락 광장에 모인 사람의 수는 신문마다 제각각이었다. 「디트로이트 프리 프레스」는 삼만이라고 했고 노동 신문 「데일리 워커」는 십오만이라고 썼는데, 그 자리에 서 있던 포드 공장 조립공 스탠리 코발스키의 눈에 들어오는 건 앞사람의 땀에 젖은 등과 그 너머로 펄럭이는 붉은 깃발뿐이었다.\n\n연단에 오른 캔자스 출신의 얼 브라우더는 워싱턴을 죽인 자가 누구든 그 죽음으로 이득을 보는 건 런던의 은행가들과 필라델피아의 장군들이라며 목소리를 높였다. 공장 문을 닫은 건 노동자가 아니라 사장들이고 그 사장들의 빚은 모두 영국에 있지 않느냐고 묻더니, 공산주의는 모스크바에서 건너온 사상이 아니라 1776년에 시작해 놓고 끝내지 못한 일을 마저 끝내는 것이며 이 세기의 아메리카니즘이라고 외쳤다.\n\n지난주에 다니던 공장이 문을 닫은 코발스키는 일당 육 달러를 받던 사람이었고, 집에는 셋째를 가진 아내가 기다리고 있었다. 브라우더가 공장은 일하는 사람의 것이라고 외치는 순간 그도 목이 터져라 소리를 질렀는데, 나중에 아무리 떠올려 봐도 그때 뭐라고 외쳤는지는 기억해 낼 수가 없었다.\n\n새벽 두 시, 디트로이트의 공장 열두 곳이 노동자 위원회의 손에 넘어갔다. 경찰이 끝내 출동하지 않은 건 경찰관들 상당수가 낮에 그 광장에 함께 서 있었기 때문이라고, 이튿날 「데일리 워커」는 자랑스럽게 썼다."
 lr_usa.29.a:0 "빨갱이들이 거리로 나왔군."
 lr_usa.30.t:0 "반란의 끝"
 lr_usa.30.d:0 "대륙군의 항복 문서는 필라델피아 독립기념관에서 서명되었다. 총독을 따라 그 건물에 들어서던 서기관 에드워드 헤일은 일 년 전 지하 전신실에서 읽었던 선언문을 떠올렸는데, 거기 서명했던 쉰여섯 명 가운데 서른한 명이 지금 바로 발밑의 지하실에 갇혀 있다고 생각하니 기분이 묘했다.\n\n워싱턴은 맨 마지막에 들어왔다. 군복은 말끔하게 다려져 있었지만 어깨의 계급장은 떼어져 있었고, 그는 총독 앞에서 허리를 숙이는 대신 가볍게 목례만 한 뒤 탁자 맞은편 의자에 앉았다. 총독도 그 정도면 됐다는 듯 고개만 까딱했다. 두 사람은 번갈아 가며 문서에 서명했고, 헤일은 워싱턴의 서명이 생각보다 반듯하고 작다는 것을 눈여겨보았다.\n\n서명이 끝나자 총독이 무언가 말을 꺼내려는 기색을 보였는데, 워싱턴이 한발 먼저 자리에서 일어났다.\n\n\"총독 각하, 저는 처음 장교가 되던 날 런던에 충성을 맹세했습니다. 그 맹세를 먼저 저버린 쪽이 누구였는지는 각하께서도 잘 아실 겁니다.\"\n\n그는 그렇게 말하고는 문가에 서 있던 헌병들 쪽으로 걸어갔다. 헤일은 받아 적던 펜을 멈추고 그 말을 기록에서 뺐는데, 공식 문서에 남겨 봐야 누구에게도 득 될 게 없는 말이라고 판단했기 때문이다.\n\n자정이 가까워서야 숙소로 돌아온 헤일은 1936년 1월에 따로 철해 두었던 보고서를 꺼내 겉장에 오늘 날짜를 적어 넣은 다음, 서류함 맨 아래 칸 깊숙이 밀어 넣었다. 워싱턴을 런던으로 실어 갈 배는 사흘 뒤에 떠날 예정이었다."
 lr_usa.30.a:0 "제국은 이겼다. 이번에도."
 lr_usa.31.t:0 "맥아더의 아침"
 lr_usa.31.d:0 "오전 여섯 시, 필라델피아 대통령 관저 앞에 장갑차 네 대가 멈춰 섰다. 관저 경비대장 윌리엄 프레스턴 대위는 정문 앞에서 해치가 열리는 걸 지켜보며 권총을 뽑아야 할지 경례를 붙여야 할지 몰라 쩔쩔맸는데, 해치 밖으로 몸을 내민 사람이 다름 아닌 대륙군 사령관 더글러스 맥아더 장군이었기 때문이다. 프레스턴은 1932년 여름을 똑똑히 기억하고 있었다. 대전쟁 보상금을 달라며 스쿨킬 강변에 천막을 치고 버티던 퇴역 군인 이만 명을 기병대와 최루가스로 쓸어 낸 장본인이 바로 이 장군이었고, 그때 맥아더는 총독부 군복을 입고 있었다.\n\n맥아더는 먼저 프레스턴에게 깍듯이 경례를 하더니 대통령을 깨울 필요는 없으니 기다리겠다고 했다. 그는 현관 옆 대기실에 앉아 옥수숫대 파이프를 사십 분 동안 느긋하게 피웠고, 그사이 관저를 에워싼 병사는 이백 명으로 불어나 있었다.\n\n잠옷 위에 외투를 걸치고 내려온 헐 대통령과 맥아더가 대기실에서 나눈 대화는 십오 분 남짓이었다. 문이 닫혀 있어 프레스턴은 무슨 말이 오가는지 들을 수 없었지만, 헐의 목소리가 한 번 높아졌다가 다시 잦아드는 것만은 문틈으로 어렴풋이 느낄 수 있었다.\n\n이윽고 문이 열렸을 때 헐의 손에는 이미 서명까지 마친 사직서가 들려 있었고, 맥아더는 그것을 받아 반으로 접더니 가슴 주머니에 찔러 넣었다.\n\n여덟 시가 되자 라디오에서 맥아더의 목소리가 흘러나왔다. 앞으로는 국가 재건 위원회가 공화국을 책임질 것이며, 헌법은 정지되지 않았고 혼란이 가라앉는 대로 선거를 치르겠다는 내용이었다. 같은 시각 시카고와 캔자스시티, 애틀랜타의 방송국에서는 전혀 다른 목소리들이 전혀 다른 이야기를 쏟아 내고 있었다."
 lr_usa.31.a:0 "질서다. 우선은."
 lr_usa.32.t:0 "갈라진 나라"
 lr_usa.32.d:0 "맥아더의 방송이 나가고 이틀이 지나자 미국의 지도는 완전히 새로 그려졌다.\n\n시카고 노동회관에 모인 북부 여덟 개 주의 노동자 평의회는 맥아더를 반역자로 규정하는 결의를 통과시켰고, 디트로이트와 클리블랜드, 뉴욕의 공장들이 그 뒤에 섰다. 캔자스시티에서는 휴이 롱이 라디오에 나와 장군도 빨갱이도 아닌 보통 사람들의 미국을 세우겠다고 외쳤는데, 그날 저녁에만 평원과 서부의 주지사 열네 명이 그를 지지하고 나섰다. 애틀랜타에서는 시어도어 빌보가 남부 여섯 개 주의 연방 탈퇴를 선언했으니, 결국 필라델피아 손에 남은 건 펜실베이니아와 메릴랜드, 버지니아, 그리고 캐롤라이나 북부와 테네시, 켄터키 정도였다.\n\n국가 재건 위원회 작전과장 조지프 스틸웰 대령은 밤늦게 작전실 벽에 커다란 지도를 붙이고 색연필 네 자루로 땅을 칠해 나갔다. 위원회는 파랑, 평의회는 빨강, 롱은 초록, 남부는 회색으로 칠하고 한 발짝 물러서서 바라보니 파란색이 가장 작았다.\n\n\"장군께 보고를 올릴까요?\" 옆에서 지켜보던 부관이 조심스럽게 물었다.\n\n스틸웰은 색연필을 탁자에 내려놓으며 고개를 저었다. \"장군께서는 이미 다 알고 계셔. 그러니까 그렇게 서두르셨던 거고.\"\n\n그로부터 일주일이 지나기도 전에, 몇 해 전 독립을 위해 어깨를 나란히 하고 싸웠던 대륙군 장교들이 오하이오 강과 애팔래치아 산자락을 사이에 두고 서로에게 총구를 겨누기 시작했다."
 lr_usa.32.a:0 "필라델피아를 지킨다. 맥아더와 함께."
 lr_usa.32.b:0 "시카고의 평의회에 합류한다."
 lr_usa.32.c:0 "캔자스시티의 롱에게 간다."
 lr_usa.32.d:0 "애틀랜타의 남부 연합에 선다."
 lr_usa.34.t:0 "워싱턴 대통령 피살"
 lr_usa.34.d:0 "미합중국의 조지 워싱턴 대통령이 독립기념일 연설 도중 필라델피아에서 총에 맞아 숨졌습니다. 범인은 현장에서 사살되었으며, 정부는 아직 범인의 신원과 배후를 밝히지 않았습니다.\n\n부통령 코델 헐이 대통령직을 승계했습니다. 필라델피아와 뉴욕, 시카고에서는 영국 영사관과 노동회관을 겨냥한 소요가 잇따르고 있다고 합니다. 런던의 귀족 의회는 조의를 표하면서도, 대서양 너머의 혼란이 영국인의 재산을 위협한다는 우려를 함께 밝혔습니다."
 lr_usa.34.a:0 "총알 하나에 공화국이 흔들리는군."
 lr_usa.35.t:0 "미합중국, 내전에 빠지다"
 lr_usa.35.d:0 "맥아더 장군의 국가 재건 위원회가 필라델피아에서 권력을 잡자 미합중국이 넷으로 갈라졌습니다. 시카고의 노동자 평의회, 캔자스시티의 휴이 롱, 애틀랜타의 남부 연합이 각각 위원회를 인정하지 않는다고 선언했습니다.\n\n대륙군은 출신 주에 따라 갈라졌고, 네 진영이 서로에게 선전포고한 것으로 알려졌습니다. 런던 「타임스」는 이를 \"아메리카의 30년 전쟁\"이라고 불렀습니다. 유럽의 외교가에서는 독립한 지 몇 해 되지 않은 공화국이 스스로 무너지고 있다는 평이 나옵니다. 런던이 이 기회를 어떻게 쓸지에 관심이 쏠립니다."
 lr_usa.35.a:0 "공화국이란 게 이렇지."
 lr_usa.36.t:0 "대서양 건너의 내전"
 lr_usa.36.d:0 "웨스트민스터 귀족 의회 외교위원회 회의실 벽에는 북아메리카 지도 두 장이 나란히 걸려 있었다. 하나는 1937년 반란이 일어나기 전의 지도였고 다른 하나는 어제 필라델피아 영사관에서 급히 보내온 것이었는데, 두 번째 지도는 네 가지 색으로 어지럽게 칠해져 있었다.\n\n먼저 입을 연 것은 해군 제1위원 체트우드 경이었다. 대서양 함대라면 육 주 안에 노바스코샤에 육군 다섯 개 사단을 상륙시킬 수 있고, 네 진영 가운데 해군다운 해군을 가진 곳이 하나도 없으니 해안은 사실상 활짝 열려 있다는 것이었다.\n\n재무위원 맨스필드 백작은 숫자로 거들었다. 미국에 묶여 있는 영국 자본이 십사억 파운드에 이르는데, 내전이 길어지면 그중 절반은 영영 돌려받지 못할 거라고 그는 안경 너머로 위원들을 둘러보며 말했다.\n\n반대 의견을 낸 건 외교위원장이었다. 유럽에서 제국연맹이 감당해야 할 일만 해도 산더미 같은데 대서양 건너에서 또 전쟁을 벌였다가는 프랑스가 그 틈을 놓칠 리 없다는 것이었다. 그는 지도 위의 사라토가와 필라델피아를 손가락으로 차례로 짚으면서, 영국이 북아메리카에서 이긴 적은 다들 생각하는 것보다 훨씬 드물었다고 덧붙였다.\n\n표결 결과가 정확히 반으로 갈리자 위원들의 시선이 한꺼번에 의장석으로 쏠렸다."
 lr_usa.36.a:0 "식민지를 되찾는다. 함대를 보내라."
 lr_usa.36.b:0 "그들끼리 싸우게 두지."
 lr_usa.37.t:0 "영국, 북아메리카에 돌아오다"
 lr_usa.37.d:0 "영국 귀족 공화국이 내전 중인 북아메리카의 네 진영에 선전포고했습니다. 대서양 함대가 노바스코샤와 뉴펀들랜드에서 출항했으며, 육군 다섯 개 사단이 함께 움직이는 것으로 알려졌습니다.\n\n귀족 의회는 \"북아메리카의 질서와 영국인의 재산을 지키기 위한 조치\"라고 밝혔습니다. 네 진영은 모두 영국의 개입을 비난했지만, 서로에게 겨눈 총구를 거두지는 않았습니다."
 lr_usa.37.a:0 "또 영국인가."
 lr_usa.38.t:0 "대륙 회의 무너지다"
 lr_usa.38.d:0 "북아메리카 총독부가 대륙 회의의 반란을 진압했습니다. 대륙군은 항복했고, 반란을 이끈 조지 워싱턴은 체포되어 런던으로 이송될 예정입니다.\n\n총독부는 대륙 회의 의원들을 반역죄로 재판에 넘기겠다고 밝혔습니다. 런던의 귀족 의회는 총독부의 충성에 감사를 표했습니다. 필라델피아 독립기념관의 종은 다시 떼어 내져 뉴욕 총독 관저로 옮겨졌다고 합니다."
 lr_usa.38.a:0 "두 번째도 실패했군."
 lr_usa.39.t:0 "워싱턴 대통령, 저격에서 살아남다"
 lr_usa.39.d:0 "독립기념일 연설 도중 총격을 받은 조지 워싱턴 대통령이 가벼운 부상만 입고 목숨을 건졌습니다. 대통령은 피 묻은 셔츠 차림으로 연설을 끝까지 마쳤습니다.\n\n범인은 현장에서 체포되었습니다. 「필라델피아 인콰이어러」의 사진기자가 찍은 사진을 비롯해, 필라델피아의 신문들은 피 묻은 셔츠를 입고 원고를 읽는 대통령의 사진을 일제히 일면에 실었습니다. 정부는 범인의 배후를 조사하고 있다고 밝혔습니다."
 lr_usa.39.a:0 "질긴 사람이군."
 lr_usa.40.t:0 "빗나간 총알"
 lr_usa.40.d:0 "오전 열한 시 사 분, 워싱턴이 독립기념관 앞 연단에 올라섰을 때 광장에는 육만 명이 넘는 사람들이 모여 있었다. 「필라델피아 인콰이어러」의 사진기자 프랭크 오도널은 연단 왼쪽 세 번째 줄에서 사진기를 들고 있었는데, 바람이 거센 탓에 대통령의 첫 문장은 절반쯤 날아가 버렸다.\n\n세 번째 사진을 찍으려고 오도널이 필름을 감던 순간 총성이 울렸다. 대통령이 왼쪽으로 비틀거리자 연단 옆에 서 있던 경호원 하나가 몸을 날려 그를 덮쳤고, 곧이어 날아온 두 번째 총알은 연단의 나무판에 박혔다. 그 무렵 독립기념관 2층 창문에서는 이미 경찰관 두 사람이 범인과 뒤엉켜 씨름을 벌이고 있었다.\n\n오 분쯤 지나 광장의 소란이 조금 가라앉자 워싱턴이 다시 연단에 모습을 드러냈다. 왼쪽 어깨 쪽 셔츠가 피로 흥건했지만 그는 팔을 붙잡는 경호원의 손을 조용히 떼어 내고 원고를 다시 펼치더니, 총성이 울리기 직전에 읽던 바로 그 문장부터 이어서 읽어 나갔다.\n\n오도널은 그 장면을 놓치지 않았다. 피 묻은 셔츠 차림으로 원고를 읽는 대통령의 사진은 다음 날 미국 거의 모든 신문의 일면을 장식했고, 그는 그 사진 덕분에 그해의 보도 사진상까지 받았다. 하지만 오도널이 평생 두고두고 떠올린 건 그 사진보다도 육만 명이 한꺼번에 숨을 죽이던 그날 광장의 고요였다고, 그는 나중에 손주들에게 이야기하곤 했다."
 lr_usa.40.a:0 "공화국은 살아남았다."
 lr_usa.42.t:0 "안경"
 lr_usa.42.d:0 "뉴욕 뉴버그의 대륙군 숙영지에 누가 썼는지 모를 편지가 돌기 시작한 건 3월 초였다. 장교들은 열네 달째 급료를 한 푼도 받지 못하고 있었고 대륙 회의는 돈이 없다는 말만 되풀이하고 있었는데, 편지는 그런 장교들에게 필라델피아로 행진하자고, 회의가 밀린 급료를 다 치를 때까지 무기를 내려놓지 말자고 부추겼다.\n\n존 매클레인 대위도 그 편지를 읽었다. 뉴욕 총독 관저에서 대위 계급으로 항복 문서에 서명했던 바로 그 사람이었는데, 그날 이후로 그는 한 번도 진급하지 못했고 고향의 어머니는 생활비를 마련하느라 살던 집까지 팔아야 했다.\n\n회합은 숙영지 식당에서 열렸다. 장교 이백여 명이 모여 웅성거리고 있을 때 워싱턴이 아무 예고도 없이 문을 열고 들어오더니, 곧장 연단으로 올라가 준비해 온 글을 읽어 나갔다. 식당 안의 공기는 싸늘하게 식어 있었고, 매클레인은 옆자리의 소령이 보란 듯이 팔짱을 끼는 것을 곁눈질로 보았다.\n\n글을 다 읽은 워싱턴은 의회 의원 한 사람이 보내온 편지를 꺼내 들었는데, 글씨가 작았는지 몇 줄 읽지 못하고 멈칫하더니 주머니를 뒤져 안경을 꺼냈다. 그가 안경 쓴 모습을 본 적이 있는 장교는 그 자리에 거의 없었다.\n\n\"여러분, 양해해 주시오. 나는 여러분을 섬기다 머리가 셌고, 이제는 눈까지 멀어 가는 모양이오.\"\n\n식당 안이 갑자기 조용해지더니, 팔짱을 끼고 있던 소령이 손등으로 슬그머니 눈가를 훔쳤다. 워싱턴이 나간 뒤 장교들은 필라델피아로 행진하는 대신 의회에 보낼 청원서를 쓰기로 만장일치로 결의했고, 매클레인은 그 청원서에 이름을 적으면서 이번에도 대위라는 계급을 함께 써 넣었다."
 lr_usa.42.a:0 "급료는 반드시 치른다. 내 이름을 걸고."
 lr_usa.51.t:0 "창문"
 lr_usa.51.d:0 "마지막 항복 문서가 도착한 날, 맥아더는 필라델피아 독립기념관 2층의 창가에 서 있었다. 워싱턴을 쏜 총알이 날아온 바로 그 창문이었는데, 그는 측근들에게 일부러 이 방을 집무실로 골랐다고 말한 적이 있었다. 그 창문에서 무엇이 보였는지를 자기 눈으로 알아야 한다는 이유였다.\n\n부관 코트니 휘트니 소령이 마지막 남은 진영의 군대가 무기를 내려놓았다는 전문을 소리 내어 읽는 동안, 맥아더는 묵묵히 끝까지 듣고 나서 파이프에 불을 붙였다. 그가 던진 질문은 포로가 몇 명이냐는 것 하나였고, 이십삼만 명이라는 대답을 듣자 고개를 끄덕이며 마침 도로를 놓을 일손이 필요하던 참이었다고 말했다.\n\n창밖 광장에서는 일주일 뒤에 있을 승전 행진을 앞두고 군악대가 행진곡을 연습하느라 한창이었다. 그 소리를 들으며 휘트니는 공화국의 헌법이 여전히 장군의 서랍 속에 잠들어 있다는 사실을 떠올렸는데, 그 서랍이 언제 열리느냐고 감히 묻는 사람은 이제 필라델피아 어디에서도 찾아볼 수 없었다.\n\n해가 진 뒤 위원회는 맥아더에게 새로운 칭호를 바치는 결의안 초안을 준비했고, 그 초안을 쓴 사람이 바로 휘트니였다. 맥아더는 초안을 천천히 읽어 내려가다가 펜을 들어 단어 하나에 줄을 긋고 그 위에 다른 단어를 적어 넣었는데, 지워진 단어는 공화국이었다."
 lr_usa.51.a:0 "이제 질서를 세울 시간이다."
 lr_usa.52.t:0 "평의회 트럭"
 lr_usa.52.d:0 "필라델피아에 가장 먼저 들어온 미주 적군 선두 부대는 디트로이트 공장에서 만든 트럭을 타고 있었다. 트럭 옆면에는 회사 이름 대신 평의회라는 글자가 페인트로 큼직하게 쓰여 있었고, 운전대를 잡은 스탠리 코발스키는 독립기념관 앞에서 시동을 끄며 이 년 전 캐딜락 광장에서 붉은 깃발을 올려다보던 날을 떠올렸다.\n\n얼 브라우더는 독립기념관 동쪽 방, 그러니까 예전에 헌법 제정 회의가 열렸던 바로 그 방에서 대표자 대회를 소집했다. 대표들은 각 주를 사회주의 공화국으로 다시 세우고 이들을 하나의 연방으로 묶는다는 결의안을 표결에 부쳤는데, 반대한 세 표는 모두 버지니아 대표들의 것이었고 그들은 이튿날 아침 회의장에 모습을 보이지 않았다.\n\n새 나라의 이름은 미주 사회주의 공화국 연방으로 정해졌다. 미주라는 말은 브라우더가 직접 고른 것으로, 언젠가는 캐나다와 멕시코와 쿠바도 이 연방에 들어올 테니 나라 이름에 굳이 국경을 박아 넣을 필요가 없다는 게 그의 설명이었다.\n\n그날 저녁 코발스키는 트럭 짐칸에 걸터앉아 집에 편지를 썼다. 공장이 다시 돌아가면 일당이 얼마나 될지는 아직 아무도 모르지만 이번만큼은 공장이 우리 것이라고 적어 내려가다가, 셋째가 태어난 지 벌써 석 달이 지났는데 아직 그 아이 얼굴도 보지 못했다는 생각에 그는 한참 동안 펜을 멈추고 있었다."
 lr_usa.52.a:0 "혁명은 대서양을 건넜다."
 lr_usa.53.t:0 "원고 없는 방송"
 lr_usa.53.d:0 "휴이 롱이 승전 연설을 한 곳은 필라델피아가 아니라 캔자스시티의 작은 방송국이었다. 측근들은 고개를 갸웃했지만 롱의 대답은 간단했는데, 필라델피아는 장군과 은행가들의 도시이고 캔자스시티는 맨 처음 자기를 믿어 준 사람들의 도시라는 것이었다.\n\n방송국 기술자 얼 매코이는 유리창 너머로 마이크 앞에 앉은 롱을 지켜보고 있었다. 롱은 두툼한 원고를 들고 들어와서는 첫 문장만 읽더니 원고를 뒤집어 놓고 그대로 사십 분을 떠들었다. 맥아더를 훈장 단 허수아비라고 부르고 빨갱이들을 모스크바 흉내쟁이라고 놀려 대다가, 마지막에는 모든 미국 가정에 오천 달러씩을 나눠 주겠다고 약속했다.\n\n매코이가 그 약속을 듣는 건 이번이 세 번째였다. 처음은 내전이 터지던 날이었고 두 번째는 미시시피 강을 건너던 날이었는데, 들을 때마다 액수가 조금씩 불어나 있었다.\n\n방송이 끝나자 롱은 유리창을 똑똑 두드려 매코이를 부르더니 기술자 월급이 얼마나 되느냐고 물었다. 매코이가 대답하자마자 롱은 그 자리에서 두 배로 올려 주겠다고 했고, 넉 달 뒤 매코이는 정말로 두 배가 된 월급 봉투를 받았다. 다만 그다음 달부터 월급의 일 할씩은 꼬박꼬박 롱의 공제 상자로 들어갔는데, 열쇠는 롱 한 사람만 가지고 있다는 초록색 칠을 한 철제 상자였다."
 lr_usa.53.a:0 "모든 사람이 왕이다!"
 lr_usa.54.t:0 "빠진 문장"
 lr_usa.54.d:0 "애틀랜타 조지아 주 의사당의 금빛 돔 아래에서 빌보가 남부 연합의 승리를 선언하던 날, 의사당 계단에는 회색 군복 차림의 장교들이 줄지어 서 있었고 그 아래 광장은 흰 정장과 모자를 갖춰 쓴 시민들로 빈틈없이 메워져 있었다. 광장 가장자리에 따로 모여 서 있는 흑인 노동자들은 행사가 끝난 뒤 뒷정리를 하라고 불려 나온 사람들이었다.\n\n연합국 정부의 의전을 맡은 찰스 펜들턴은 의사당 안에서 새 국기를 펼쳐 보고 있었다. 붉은 바탕에 파란 대각선이 지나가고 그 위에 흰 별 열세 개가 박힌 깃발로, 별은 남부 여섯 개 주와 내전에서 점령한 주들을 하나씩 뜻했다. 북부의 주들까지 별로 그려 넣자는 안은 의회에서 한참 격론을 벌인 끝에 통과되었지만, 정작 그 주에 사는 사람들이 이 깃발을 어떻게 생각하는지 물어보자는 말을 꺼낸 의원은 하나도 없었다.\n\n빌보의 연설은 짧았다. 남부는 북부의 공장도 서부의 평원도 탐낸 적이 없지만 지켜야 할 것을 지키려다 보니 어쩔 수 없이 손에 넣게 되었다는 내용이었고, 광장에서는 우레 같은 박수가 터져 나왔다.\n\n그 연설문을 직접 다듬은 펜들턴은 빌보가 원고에서 한 문장을 슬쩍 빼놓고 읽었다는 걸 알아챘다. 1833년에 폐지된 노예제를 되살리는 일은 결코 없을 것이라는 문장이었다."
 lr_usa.54.a:0 "남부는 다시 일어선다."
 lr_usa.55.t:0 "아메리카 내전, 맥아더의 승리로 끝나다"
 lr_usa.55.d:0 "국가 재건 위원회가 미국 내전에서 승리했습니다. 맥아더 장군의 군대가 마지막 남은 반대 세력의 항복을 받아 냈습니다.\n\n위원회는 헌법을 언제 되살릴지 밝히지 않았습니다. 필라델피아에서는 맥아더에게 새 칭호를 바치는 결의안이 준비되고 있다는 소문이 돌고 있습니다."
 lr_usa.55.a:0 "장군의 나라로군."
 lr_usa.56.t:0 "미주 사회주의 공화국 연방 수립"
 lr_usa.56.d:0 "미국 내전이 노동자 평의회의 승리로 끝났습니다. 필라델피아에서 열린 대표자 대회는 미주 사회주의 공화국 연방의 수립을 선포했습니다.\n\n러시아 공화국 이후 두 번째로 혁명 정부가 살아남은 것입니다. 유럽 각국의 궁정은 경계를 늦추지 않고 있으며, 런던 증권거래소에서는 미국 관련 채권 값이 하루 만에 사 할 넘게 떨어졌습니다."
 lr_usa.56.a:0 "두 번째 혁명이라니."
 lr_usa.57.t:0 "휴이 롱, 미국 내전 승리"
 lr_usa.57.d:0 "휴이 롱의 군대가 미국 내전에서 승리했습니다. 롱은 캔자스시티에서 방송 연설을 통해 미합중국의 재건을 선포하고, 모든 가정에 오천 달러를 주겠다고 약속했습니다.\n\n「캔자스시티 스타」는 이를 \"킹피시의 해일\"이라고 불렀습니다. 경제학자들은 이 약속이 실현될 수 없다고 지적합니다. 그러나 롱의 연설을 들은 미국인 가운데 상당수는 경제학자의 말을 듣지 않는 것으로 보입니다."
 lr_usa.57.a:0 "킹피시가 이겼군."
 lr_usa.58.t:0 "아메리고 연합국 수립"
 lr_usa.58.d:0 "남부 연합이 미국 내전에서 승리했습니다. 애틀랜타의 의회는 새 국호를 아메리고 연합국으로 정하고, 북부의 주들을 점령지로 편입했습니다.\n\n연합국은 영국과 가까운 관계를 맺을 것으로 보입니다. 리버풀과 맨체스터의 면화 상인들은 이 소식을 반겼다고 합니다."
 lr_usa.58.a:0 "남부가 북부를 삼켰다고?"
 lr_usa.62.t:0 "북아메리카 통합 법안"
 lr_usa.62.d:0 "웨스트민스터 귀족 의회 식민위원회 탁자 위에 북아메리카 통합 법안이 올라왔다. 위원 일곱 명 앞에는 서류 두 묶음이 놓여 있었는데, 하나는 뉴욕 총독부가 보낸 법안 원문이었고 다른 하나는 오타와의 캐나다 정부가 보내온 동의서였다.\n\n식민위원장 크랜번 자작이 먼저 펼쳐 든 것은 동의서였다. 캐나다 총리 매켄지 킹의 서명이 선명했고 퀘벡 주의 프랑스어 사용권을 보장한다는 조항까지 꼼꼼히 붙어 있어서, 반대할 구실을 찾기가 여간 어려운 문서가 아니었다.\n\n그런데도 반대는 위원회 안에서 터져 나왔다. 북아메리카 총독부는 이미 본국보다 더 많은 강철을 만들어 내고 있는데, 캐나다까지 합치면 본국보다 땅이 예순 배나 넓은 자치령이 생긴다는 것이었다. 한 위원이 그런 자치령이 언제까지 런던의 말을 고분고분 들을 것 같으냐고 묻자, 회의실 안에는 한동안 누군가의 펜이 탁자 위를 굴러가는 소리만 들렸다.\n\n크랜번 자작은 펜을 들었다 내려놓기를 몇 번이나 되풀이했다. 반란을 진압해 준 총독부에 상을 내리지 않으면 다른 식민지들이 그 꼴을 똑똑히 지켜볼 것이고, 그렇다고 상을 내리자니 그 상이 언젠가 런던을 겨누는 칼이 될지도 모를 노릇이었다."
 lr_usa.62.a:0 "승인한다. 충성에는 보답해야 한다."
 lr_usa.62.b:0 "거부한다. 자치령은 하나로 충분하다."
 lr_usa.64.t:0 "캐나다, 북아메리카 총독부와 통합"
 lr_usa.64.d:0 "런던의 귀족 의회가 북아메리카 통합 법안을 승인했습니다. 캐나다 자치령과 북아메리카 총독부는 하나의 자치령으로 합쳐지며, 정부는 뉴욕에 둡니다.\n\n퀘벡 주에는 프랑스어 사용권이 보장되었습니다. 새 자치령은 땅 넓이로 영국 본토의 예순 배가 넘습니다. 런던의 일부 신문은 이것이 제국의 무게중심을 대서양 너머로 옮기는 일이라며 우려를 나타냈습니다."
 lr_usa.64.a:0 "대서양 건너의 거인이로군."
 lr_usa.65.t:0 "신대륙의 제국"
 lr_usa.65.d:0 "북아메리카 총독부가 스페인령 아메리카 정복을 마쳤습니다. 알래스카에서 파타고니아까지 신대륙의 대부분이 영국 제국의 깃발 아래 들어왔습니다.\n\n런던의 귀족 의회는 북아메리카 총독부를 아메리카 대총독령으로 격상했습니다. 뉴욕의 대총독은 이제 런던 다음가는 제국의 권력자로 꼽힙니다. 마드리드는 이 소식에 아무 논평도 내지 않았습니다."
 lr_usa.65.a:0 "해가 지지 않는다."
 lr_usa.71.t:0 "어깨는 괜찮으신지"
 lr_usa.71.d:0 "선거관리위원 마사 하인즈는 펜실베이니아 랭커스터 카운티 개표소에서 투표함 마흔두 개를 차례로 열어 나갔다. 투표용지에는 대통령 후보가 단 한 명뿐이어서, 유권자는 찬성과 반대 두 칸 가운데 하나에 표시만 하면 되었다.\n\n찬성, 찬성, 또 찬성. 개표는 금세 지루해졌는데, 그래도 가끔 반대표가 섞여 나왔고 칸 옆 여백에 뭔가를 적어 넣은 용지도 드문드문 있었다. \"왕보다는 낫다\"라고 쓴 사람도 있었고 \"세금이나 좀 내려라\"라고 쓴 사람도 있었는데, 그중 한 장에는 또박또박한 글씨로 \"어깨는 괜찮으신지요\"라고 적혀 있었다. 마사는 규정대로라면 낙서가 있는 용지는 무효로 처리해야 한다는 걸 알면서도 위원장에게 한 번 물어본 뒤 유효표로 쳐 주기로 했는데, 표시만큼은 칸 안에 제대로 되어 있었기 때문이다.\n\n집계는 자정을 넘겨서야 끝났다. 랭커스터 카운티의 찬성률은 팔십구 퍼센트였고, 사흘 뒤 발표된 전국 결과는 팔십일 퍼센트였다. 반대표가 가장 많이 나온 곳은 총독부 시절의 관리와 상인들이 모여 사는 뉴욕이었다.\n\n워싱턴은 취임 연설에서 그 숫자를 직접 입에 올렸다. 국민의 열아홉 퍼센트가 자신을 원하지 않았지만 그들 역시 이 공화국의 국민이라고 말하는 목소리가 라디오에서 흘러나오는 동안, 마사는 랭커스터에서 유효표로 쳐 주었던 그 한 장의 용지를 다시 떠올리고 있었다."
 lr_usa.71.a:0 "공화국은 반대표도 센다."
 lr_usa.72.t:0 "북아메리카, 하나의 헌법 아래"
 lr_usa.72.d:0 "미합중국 의회가 새로 편입된 북부와 서부 영토에 연방 헌법을 적용하는 법안을 통과시켰습니다. 북극해에서 리오그란데까지 대륙의 대부분이 한 공화국의 헌법 아래 놓였습니다.\n\n워싱턴 대통령은 두 번째 임기를 마지막으로 물러나겠다는 뜻을 다시 밝혔습니다. 유럽의 왕정 국가들은 대서양 건너의 거대한 공화국을 불안한 눈으로 지켜보고 있습니다."
 lr_usa.72.a:0 "왕 없는 대륙이다."
 lr_usa.81.t:0 "금 단추 사천 개"
 lr_usa.81.d:0 "대관식 날 아침 필라델피아에는 비가 내렸다. 의전관 로버트 아이컬버거 장군은 독립기념관 앞 광장에 깔아 둔 붉은 융단이 빗물에 젖어 가는 걸 바라보며 오늘 행사를 또 미뤄야 하나 속으로 계산하고 있었다. 대관식은 이미 두 번이나 미뤄진 터였는데, 처음에는 왕관이 제때 완성되지 않아서였고 두 번째는 황제의 칭호를 무엇으로 할지 귀족원이 좀처럼 결론을 내지 못해서였다.\n\n우여곡절 끝에 정해진 칭호는 아메리고의 황제이자 신대륙의 수호자였다. 왕관은 웨스트포인트 생도들의 제복에서 떼어 낸 금 단추 사천 개를 녹여 만들었고, 생도들은 그 대신 은 단추를 받았다.\n\n열한 시가 되자 거짓말처럼 비가 그쳤다. 맥아더는 대원수 군복 위에 흰 망토를 걸치고, 워싱턴이 마지막 연설을 했던 바로 그 자리에 새로 지은 연단에 올랐다. 왕관을 씌워 준 사람은 대주교가 아니라 맥아더 자신이었는데, 그는 두 손으로 왕관을 높이 들어 올린 채 광장을 가득 메운 군중을 천천히 한 바퀴 둘러보고 나서야 그것을 머리에 썼다.\n\n연단 아래에서 그 모습을 지켜본 아이컬버거는 훗날 회고록에 그날의 일을 이렇게 적었다. 황제가 왕관을 들어 올리자 군중은 일제히 박수를 쳤지만 독립기념관 2층의 창문들은 모두 닫혀 있었는데, 그 창문들을 닫으라고 명령한 사람이 바로 자기 자신이었다고."
 lr_usa.81.a:0 "황제 폐하 만세."
 lr_usa.82.t:0 "아메리고 제국, 신대륙을 석권하다"
 lr_usa.82.d:0 "아메리고 제국이 북아메리카와 태평양에서 잇따라 승리하며 신대륙의 패권을 쥐었습니다.\n\n맥아더 황제는 아직 후계자를 정하지 않았으며, 제국 궁정의 원수들 사이에 긴장이 높아지고 있다는 관측이 나옵니다. 런던과 마드리드는 대서양 건너에 나타난 새 제국을 경계하고 있습니다."
 lr_usa.82.a:0 "제국의 시대로군."
 lr_usa.83.t:0 "아메리고 제국 선포"
 lr_usa.83.d:0 "맥아더 장군이 필라델피아에서 스스로 왕관을 쓰고 아메리고 제국의 황제로 즉위했습니다. 독립한 지 몇 해 되지 않은 미국 공화국은 이로써 막을 내렸습니다.\n\n새 국호는 신대륙에 이름을 준 아메리고 베스푸치에서 따왔습니다. 유럽의 왕실들은 새 황제에게 축전을 보낼지를 두고 고민하는 것으로 알려졌습니다. 그들 가운데 상당수는 군인이 스스로 왕관을 쓴 전례를 반기지 않습니다."
 lr_usa.83.a:0 "공화국은 끝났다."
 lr_usa.84.t:0 "캐나다, 아메리고 제국에 병합되다"
 lr_usa.84.d:0 "캐나다 자치령이 아메리고 제국에 항복했습니다. 맥아더 황제는 캐나다 전역을 제국의 북방 왕령으로 병합한다고 선포했습니다.\n\n캐나다 정부의 일부 각료는 영국으로 망명한 것으로 알려졌습니다. 영국 귀족 의회는 병합을 인정하지 않는다고 밝혔지만, 대서양 함대를 움직이지는 않았습니다. 퀘벡에서는 프랑스어 학교를 그대로 두겠다는 황제의 약속이 지켜질지를 두고 의견이 갈립니다."
 lr_usa.84.a:0 "북쪽은 이제 제국의 것이다."
 lr_usa.85.t:0 "노병"
 lr_usa.85.d:0 "웨스트포인트 사관학교 연병장에 생도 이천사백 명이 정렬해 있었다. 그해 졸업식 연설은 황제가 직접 하기로 되어 있었고, 시종무관 로버트 아이컬버거 원수는 연단 뒤에서 원고를 든 채 대기하고 있었다. 대관식 날 의전을 맡았던 바로 그 사람으로, 그사이 머리가 하얗게 세어 있었다.\n\n황제는 아이컬버거가 내미는 원고를 받지 않았다. 일흔을 훌쩍 넘긴 노인은 지팡이도 짚지 않고 연단에 올라 옥수숫대 파이프를 연단 위에 가만히 내려놓더니, 필리핀의 정글과 플랑드르의 진흙, 필라델피아의 겨울을 차례로 이야기하기 시작했다. 그가 지휘했던 부대의 번호를 하나하나 부를 때마다, 그 번호를 교과서에서나 보았던 생도들은 숨을 죽이고 귀를 기울였다.\n\n연설이 끝나 갈 무렵 황제는 자기가 생도였던 시절 숙영지에서 즐겨 부르던 노래 이야기를 꺼냈다. 노병은 죽지 않는다, 다만 사라질 뿐이라는 노랫말을 그는 두 번 되풀이했는데, 두 번째에는 목소리가 갈라져 끝까지 잇지 못하고 잠시 연단을 붙잡고 서 있었다.\n\n아이컬버거는 생도들의 얼굴을 살폈다. 맨 앞줄의 한 생도는 차렷 자세로 선 채 눈물을 흘리고 있었고, 그 옆의 생도는 황제가 아니라 연병장 끝에 나란히 선 세 원수의 수행원들을 흘끔흘끔 곁눈질하고 있었다.\n\n황제가 연단을 내려간 뒤 아이컬버거는 연단 위에 남아 있는 파이프를 발견하고 조심스럽게 집어 주머니에 넣었다. 다음에 뵙거든 돌려 드리겠다고 생각했지만, 그 파이프는 결국 그의 서재 책상 위에서 여생을 함께 보내게 되었다."
 lr_usa.85.a:0 "노병은 사라질 뿐이다."
 lr_usa.86.t:0 "[From.GetName] 항복"
 lr_usa.86.d:0 "[From.GetName] 정부의 마지막 각료들이 항복 문서에 서명을 마친 것은 오후 늦게였다. 수도에는 이미 우리 군대가 들어가 있었고, 남은 각료들은 대통령궁 응접실에 모여 앉아 자기들의 처분이 어떻게 정해질지 초조하게 기다리고 있었다.\n\n참모 회의의 의견은 둘로 갈렸다. 한쪽에서는 그 땅을 통째로 우리 영토로 삼아 철도와 광산과 항구를 직접 다스리면 더는 누구 눈치도 볼 필요가 없다고 주장했고, 다른 쪽에서는 말 잘 듣는 정부를 하나 세워 놓고 손을 떼는 편이 낫다고 맞섰다. 낯선 땅을 직접 다스리겠다면 그 땅에서 일어날 반란까지 고스란히 떠안아야 한다는 이유였다.\n\n회의록을 정리하던 서기는 마지막 줄에 최종 결정은 정부 수반께서 내리신다고 적어 넣었고, 그사이 응접실의 각료들은 커피를 두 잔씩 더 청해 마셨다."
 lr_usa.86.a:0 "통째로 삼킨다."
 lr_usa.86.b:0 "말 잘 듣는 정부를 세운다."
 lr_usa.92.t:0 "미주 혁명, 국경을 넘다"
 lr_usa.92.d:0 "미주 사회주의 공화국 연방의 혁명이 이웃 나라로 번지고 있습니다. 미주 적군은 캐나다와 누에바 에스파냐에서 잇따라 승리했으며, 점령지마다 노동자 평의회가 세워지고 있습니다.\n\n필라델피아와 러시아 공화국의 지도자들은 공동 성명을 내고 세계 노동자의 연대를 선언했습니다. 유럽의 왕정 국가들은 혁명이 두 대륙에 뿌리를 내렸다는 사실에 크게 긴장하고 있습니다."
 lr_usa.92.a:0 "혁명은 수출된다."
 lr_usa.93.t:0 "롱의 미국, 아메리카를 쥐다"
 lr_usa.93.d:0 "휴이 롱 대통령의 미합중국이 경제와 군사 양면에서 아메리카 대륙을 장악했습니다. 롱은 일요일 방송에서 모든 미국인이 왕처럼 살게 되었다고 선언했습니다.\n\n그러나 의회는 지난 두 해 동안 대통령의 법안을 단 한 번도 부결하지 않았고, 비판적인 신문 세 곳이 문을 닫았습니다. 외국의 관찰자들은 롱의 미국을 민주주의라고 불러야 할지를 두고 의견이 갈립니다."
 lr_usa.93.a:0 "왕은 하나뿐이야."
 lr_usa.94.t:0 "카리브 제국의 탄생"
 lr_usa.94.d:0 "아메리고 연합국이 쿠바와 누에바 에스파냐를 정복하며 멕시코만 전체를 손에 넣었습니다. 빌보 대통령은 이를 황금의 원의 완성이라고 불렀습니다.\n\n연합국은 영국과의 동맹을 바탕으로 남미 진출을 준비하는 것으로 보입니다. 정복지에서도 재산과 문해력 시험에 따른 투표권 제한이 그대로 적용되고 있습니다."
 lr_usa.94.a:0 "황금의 원이라."
