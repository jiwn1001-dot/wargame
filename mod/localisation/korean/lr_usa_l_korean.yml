l_korean:
 LR_USA_colony_1936:0 "총독부의 1936년"
 LR_USA_colony_1936_desc:0 "뉴욕 총독 관저 정문에는 1776년 반란군이 남긴 탄흔이 아직 남아 있습니다. 백육십 년 동안 런던은 열세 식민지를 지켰고, 식민지는 런던을 먹여 살렸습니다. 그러나 대전쟁에서 돌아온 식민지 장교들은 더 이상 그 셈법을 믿지 않습니다."
 LR_USA_atlantic_trade:0 "대서양 무역 협정"
 LR_USA_atlantic_trade_desc:0 "식민지의 밀과 면화는 리버풀을 거쳐야만 세상으로 나갈 수 있습니다. 총독부는 런던에 관세를 조금만 낮춰 달라고 청원합니다. 뉴욕 상공회의소가 총독부의 청원서에 함께 서명한 것은 1770년 이후 처음입니다."
 LR_USA_colonial_industry:0 "식민지 공업 진흥"
 LR_USA_colonial_industry_desc:0 "공장 굴뚝이 늘면 반역도 함께 는다는 것이 런던의 오랜 믿음이었습니다. 총독부는 그 믿음을 거스르기로 했습니다. 피츠버그와 클리블랜드에 세울 공장 허가서 스물두 장이 이번 주 우편선으로 런던에 갑니다."
 LR_USA_arms_subcontract:0 "병기 하청"
 LR_USA_arms_subcontract_desc:0 "영국 병기창은 본토의 주문만으로도 벅찹니다. 남는 주문을 식민지 공장에 넘기면 런던은 돈을 아끼고 총독부는 일자리를 얻습니다. 다만 그렇게 만든 소총이 결국 누구의 손에 들어갈지는 아무도 장담하지 못합니다."
 LR_USA_great_lakes_steel:0 "오대호 제철"
 LR_USA_great_lakes_steel_desc:0 "미네소타의 철광석이 오대호를 건너 게리와 디트로이트의 용광로로 들어갑니다. 그 용광로의 절반은 아직 영국 자본가의 것입니다. 총독부는 전시에 대비해 이 용광로들을 직접 관리하는 법안을 식민지 의회에 냅니다."
 LR_USA_rail_crown:0 "총독부 철도청"
 LR_USA_rail_crown_desc:0 "애팔래치아를 넘는 철도는 열한 개 회사가 제각각 운영합니다. 궤간도 운임도 다릅니다. 총독부는 이들을 총독부 철도청 아래 묶어, 병력과 석탄이 한 시간이라도 빨리 움직이게 하려 합니다."
 LR_USA_kings_college:0 "킹스 칼리지 연구소"
 LR_USA_kings_college_desc:0 "뉴욕의 킹스 칼리지는 영국 귀족 의회가 세운 식민지 최고의 학교입니다. 총독부는 이곳에 전기와 화학 연구소를 붙이려 합니다. 본국에 기대지 않고도 쓸 만한 기술을 얻으려면, 런던보다 먼저 식민지 젊은이들을 붙잡아야 합니다."
 LR_USA_royal_garrison:0 "제국 수비대 증강"
 LR_USA_royal_garrison_desc:0 "보스턴과 필라델피아의 술집에서 워싱턴이라는 이름이 다시 오르내립니다. 버지니아의 퇴역 소령이 무슨 일을 꾸미는지 총독부는 아직 모릅니다. 우선 제국 수비대를 두 개 대대 늘려 주요 도시에 배치합니다."
 LR_USA_coercive_acts:0 "강압법"
 LR_USA_coercive_acts_desc:0 "집회를 금하고, 신문을 검열하고, 혐의자는 영장 없이 가둡니다. 1774년에 같은 이름의 법이 무엇을 낳았는지 기억하는 관리도 있습니다. 그러나 총독은 그때보다 더 철저하게 하면 된다고 믿습니다."
 LR_USA_conciliation:0 "유화 칙령"
 LR_USA_conciliation_desc:0 "식민지 의회에 예산 심의권을 돌려주고, 식민지 출신 장교의 진급 상한을 없앱니다. 런던의 귀족들은 질색할 것입니다. 그러나 반란의 불씨는 분노보다 무시에서 자라고, 총독부는 그 불씨에 먼저 물을 붓기로 했습니다."
 LR_USA_loyalist_militia:0 "충성파 민병대"
 LR_USA_loyalist_militia_desc:0 "뉴욕과 캐롤라이나에는 아직도 런던을 조국으로 여기는 집이 많습니다. 그 집 아들들을 모아 충성파 민병대를 꾸립니다. 정규군만은 못해도, 이웃의 얼굴을 아는 병사는 쓸모가 있습니다."
 LR_USA_colonial_intelligence:0 "총독부 정보국"
 LR_USA_colonial_intelligence_desc:0 "필라델피아의 비밀 회합, 버지니아의 무기 거래, 보스턴의 지하 인쇄소. 흩어진 소문을 하나로 꿰어 줄 기관이 필요합니다. 총독부 정보국은 런던 경찰청에서 수사관 열두 명을 데려와 출범합니다."
 LR_USA_colonial_defence:0 "식민지 방위군"
 LR_USA_colonial_defence_desc:0 "식민지 방위군은 영국군의 하급 조직입니다. 장교의 삼분의 일이 식민지 출신이지만 대령 이상은 한 명도 없습니다. 총독부는 방위군을 다시 편성해, 전쟁이 나면 본국의 증원 없이도 석 달은 버티게 하려 합니다."
 LR_USA_springfield:0 "스프링필드 소총"
 LR_USA_springfield_desc:0 "매사추세츠의 스프링필드 병기창은 식민지에서 가장 오래된 총기 공장입니다. 이곳의 소총은 영국군 제식 소총보다 가볍고 정확합니다. 총독부는 이 소총을 방위군의 표준 장비로 정하고 주문량을 두 배로 늘립니다."
 LR_USA_coastal_guns:0 "해안 포대"
 LR_USA_coastal_guns_desc:0 "체서피크 만과 뉴욕 항구의 포대는 1812년 이후 거의 손대지 않았습니다. 대서양 너머의 적보다 항구 안의 적을 겨눌 일이 더 많을지도 모릅니다. 그래도 대포는 어느 쪽으로든 돌릴 수 있습니다."
 LR_USA_air_command:0 "영국 공군 북미 사령부"
 LR_USA_air_command_desc:0 "영국 공군은 북아메리카에 비행장 일곱 곳과 낡은 복엽기 몇십 대만 두었습니다. 총독부는 식민지 예산으로 비행장을 늘리고 조종사를 기르겠다고 제안했습니다. 런던은 예산 이야기만 귀담아들었습니다."
 LR_USA_detroit_trucks:0 "디트로이트의 트럭"
 LR_USA_detroit_trucks_desc:0 "디트로이트의 자동차 공장은 하루에 트럭 수천 대를 찍어 냅니다. 이 트럭에 보병을 태우면 식민지의 넓은 땅도 좁아집니다. 방위군은 디트로이트에서 첫 차량화 대대를 꾸립니다."
 LR_USA_staff_college:0 "킹스턴 참모대학"
 LR_USA_staff_college_desc:0 "식민지 장교가 참모 교육을 받으려면 지금까지는 영국 캠벌리까지 가야 했습니다. 그 여비를 감당한 장교는 한 해에 넷뿐이었습니다. 총독부는 온타리오와 맞닿은 킹스턴에 참모대학을 세워 이 길을 넓힙니다."
 LR_USA_crush_rising:0 "반란 진압 작전"
 LR_USA_crush_rising_desc:0 "7월 4일, 워싱턴이 필라델피아에서 독립을 선언했고 열세 식민지의 절반이 그의 깃발을 따랐습니다. 총독부는 본국의 증원을 기다리지 않고, 반란군의 심장인 펜실베이니아를 먼저 치기로 했습니다."
 LR_USA_hudson_line:0 "허드슨 강 방어선"
 LR_USA_hudson_line_desc:0 "1777년 영국군은 허드슨 강을 따라 식민지를 둘로 자르려다 사라토가에서 무너졌습니다. 이번에는 강을 지키는 쪽이 총독부입니다. 뉴잉글랜드의 반란군이 남쪽과 손잡지 못하도록 강변에 진지를 쌓습니다."
 LR_USA_blockade:0 "해상 봉쇄"
 LR_USA_blockade_desc:0 "반란군에게는 해군이 없습니다. 영국 대서양 함대가 보스턴과 볼티모어 앞바다를 막으면 프랑스제 소총도 스페인 은화도 들어오지 못합니다. 총독부는 해군성에 봉쇄를 정식으로 요청합니다."
 LR_USA_bounty:0 "반란 수괴 현상금"
 LR_USA_bounty_desc:0 "조지 워싱턴의 목에 현상금 1만 파운드가 걸렸습니다. 대륙 회의의 의원과 장군들에게도 각각 값이 매겨졌습니다. 총독부는 반란군 병사들이 그 돈의 무게를 느끼고, 지휘관 가운데 누군가는 계산을 시작하길 바랍니다."
 LR_USA_crown_peace:0 "제국 아래의 평화"
 LR_USA_crown_peace_desc:0 "반란은 끝났습니다. 필라델피아 독립기념관의 종은 다시 떼어 냈고, 대륙 회의 의원들은 재판을 기다립니다. 총독부는 이 승리를 어디에 쓸지 정해야 합니다. 본국을 도울 수도, 남쪽을 칠 수도, 북쪽과 손잡을 수도 있습니다."
 LR_USA_oath:0 "충성의 맹세"
 LR_USA_oath_desc:0 "총독은 식민지 의회 의원 전원에게 런던의 귀족 의회에 다시 충성을 맹세하게 했습니다. 맹세를 거부한 열한 명은 의석을 잃었습니다. 런던의 신문들은 맹세하는 의원들의 사진을 일주일 내내 일면에 실었습니다."
 LR_USA_join_league:0 "제국연맹 가입"
 LR_USA_join_league_desc:0 "식민지는 지금까지 본국의 전쟁에 세금으로만 참여했습니다. 이제 북아메리카는 제국연맹의 정식 회원으로, 자기 군대를 걸고 회의 탁자에 앉으려 합니다. 오타와와 캔버라는 아직 그런 대우를 받지 못했습니다."
 LR_USA_convoys:0 "대서양 수송단"
 LR_USA_convoys_desc:0 "식민지의 공장은 본국보다 두 배 많은 강철을 만듭니다. 그 강철이 대서양을 건너야 제국이 싸울 수 있습니다. 뉴욕과 핼리팩스에서 출발하는 수송단을 지킬 구축함 전대를 꾸립니다."
 LR_USA_expedition:0 "북미 원정군"
 LR_USA_expedition_desc:0 "1916년, 식민지 병사 이십만 명이 플랑드르의 진흙에 묻혔습니다. 워싱턴도 그 진흙 속에 있었습니다. 이번에는 식민지 장교가 식민지 병사를 이끌고 유럽에 갑니다. 총독부는 제국이 그 대가를 기억해 주길 바랍니다."
 LR_USA_imperial_arsenal:0 "제국 병기창"
 LR_USA_imperial_arsenal_desc:0 "총독부는 식민지 병기창 생산량의 삼분의 일을 본국에 보내기로 했습니다. 의회에서는 반대 목소리도 나왔습니다. 그러나 반란이 진압된 지 얼마 되지 않은 지금, 충성은 말보다 물건으로 증명해야 합니다."
 LR_USA_empire_partner:0 "제국의 동반자"
 LR_USA_empire_partner_desc:0 "제국연맹 이사회가 북아메리카에 상임 의석을 주기로 했습니다. 식민지 출신 장군이 제국 참모본부에 들어간 것도 처음입니다. 이제 뉴욕의 목소리는 런던에서도 무게를 가집니다. 그 무게가 언제까지 충성으로만 쓰일지는 두고 볼 일입니다."
 LR_USA_southern_threat:0 "남쪽 국경의 위협"
 LR_USA_southern_threat_desc:0 "누에바 에스파냐 왕국은 텍사스에서 캘리포니아까지 북아메리카의 삼분의 일을 쥐고 있습니다. 반란 중에 멕시코시티가 대륙 회의에 은화를 보낸 증거가 나왔습니다. 총독부는 그 증거를 런던에 보내고, 대답을 기다리지 않습니다."
 LR_USA_new_spain_campaign:0 "누에바 에스파냐 원정"
 LR_USA_new_spain_campaign_desc:0 "총독부의 군대가 미시시피를 건너 텍사스로, 다시 캘리포니아로 나아갑니다. 스페인 본국은 아직 내전에서 빠져나오지 못했습니다. 멕시코시티의 부왕은 혼자 싸워야 합니다."
 LR_USA_mexican_viceroyalty:0 "멕시코 총독령"
 LR_USA_mexican_viceroyalty_desc:0 "부왕궁에 유니언잭이 올랐습니다. 멕시코는 독립국도 스페인령도 아닌, 북아메리카 총독부가 다스리는 총독령이 됩니다. 크리올로 귀족들은 작위를 지키는 대가로 새 주인에게 충성을 맹세합니다. 맹세하지 않은 가문의 땅은 경매에 붙여졌습니다."
 LR_USA_caribbean:0 "카리브와 중미"
 LR_USA_caribbean_desc:0 "쿠바와 과테말라는 누에바 에스파냐의 그늘에 기대 온 공국들입니다. 부왕이 무너진 지금 그들은 기댈 곳이 없습니다. 총독부의 함대가 아바나 앞바다에 닻을 내립니다."
 LR_USA_andes:0 "안데스 원정"
 LR_USA_andes_desc:0 "누에바 그라나다와 베네수엘라, 페루의 왕국들은 내전으로 지쳐 있습니다. 총독부는 파나마를 거쳐 남쪽으로 내려가는 원정을 준비합니다. 런던은 은과 구리, 석유 이야기를 듣고 나서 반대를 거둬들였습니다."
 LR_USA_southern_cone:0 "남방 원정"
 LR_USA_southern_cone_desc:0 "리오데라플라타와 칠레는 신대륙의 남쪽 끝에서 아직 스페인 왕의 이름으로 다스려집니다. 그들이 무너지면 신대륙의 스페인 깃발은 모두 내려갑니다. 브라질은 포르투갈의 일이니 건드리지 않습니다."
 LR_USA_new_world_crown:0 "신대륙의 제국"
 LR_USA_new_world_crown_desc:0 "알래스카에서 파타고니아까지, 신대륙 대부분이 같은 제국의 깃발 아래 들어왔습니다. 그 제국의 대리인은 런던이 아니라 뉴욕에 앉아 있습니다. 총독부는 이 새 질서에 걸맞은 이름을 런던에 청합니다."
 LR_USA_open_border:0 "국경 없는 자치령"
 LR_USA_open_border_desc:0 "온타리오와 뉴욕 사이의 세관은 1783년 이후 한 번도 닫힌 적이 없습니다. 두 식민지는 같은 의회의 법을 따르고 같은 말을 씁니다. 총독부는 오타와에 관세 동맹을 제안합니다."
 LR_USA_ottawa_talks:0 "오타와 회담"
 LR_USA_ottawa_talks_desc:0 "캐나다 총리 매켄지 킹은 반란 진압을 지켜보며 다음은 퀘벡일지 모른다는 두려움을 느꼈습니다. 총독부는 두 자치령을 하나로 묶어야만 그런 일이 다시 없을 것이라고 설득합니다. 회담은 열이틀 동안 이어졌습니다."
 LR_USA_union_bill:0 "북아메리카 통합"
 LR_USA_union_bill_desc:0 "캐나다와 북아메리카 총독부를 하나의 자치령으로 합치는 법안이 웨스트민스터 의회에 올라갔습니다. 최종 결정은 런던의 귀족 의회가 내립니다. 총독부는 런던의 대답을 기다립니다."
 LR_USA_union_parliament:0 "통합 자치령 의회"
 LR_USA_union_parliament_desc:0 "오타와와 뉴욕에서 뽑힌 의원들이 처음으로 한 의사당에 앉았습니다. 퀘벡 의원들은 프랑스어 통역을 요구했고, 총독부는 들어주었습니다. 북아메리카는 이제 하나의 정부로 움직입니다."
 LR_USA_sun_never_sets:0 "해가 지지 않는 대륙"
 LR_USA_sun_never_sets_desc:0 "북아메리카는 본국보다 크고, 본국보다 부유하며, 본국보다 많은 병사를 냅니다. 언젠가 제국의 중심이 대서양을 건너올 것이라고 말하는 이들이 런던에도 생겼습니다. 총독부는 그 말을 굳이 부정하지 않습니다."
 LR_USA_dev_economy:0 "식민지 전시 경제"
 LR_USA_dev_economy_desc:0 "런던은 식민지 공장이 늘어나는 것을 늘 꺼려 왔지만, 다음 전쟁에서 본토 공장만으로 버틸 수 없다는 계산이 마침내 그 두려움을 눌렀습니다. 총독부 안에 전시 산업국이 생기고, 국장 자리에는 디트로이트의 자동차 회사 사장이 앉습니다."
 LR_USA_dev_machine_tools:0 "공작기계 표준화"
 LR_USA_dev_machine_tools_desc:0 "공장마다 다른 규격의 나사와 볼트를 쓰는 바람에, 한 공장에서 만든 부품이 다른 공장의 기계에 맞지 않는 일이 흔합니다. 규격을 하나로 맞추는 데는 여섯 달이 걸리지만, 그 뒤로는 어느 공장에서 만든 부품이든 전선의 어느 기계에나 들어갑니다."
 LR_USA_dev_power_grid:0 "전국 송전망"
 LR_USA_dev_power_grid_desc:0 "강가의 수력 발전소에서 만든 전기가 도시 하나를 넘어가지 못하고 버려지고 있습니다. 송전탑을 이어 발전소와 공업 지대를 하나의 망으로 묶으면, 밤에도 불을 끄지 않는 공장을 세울 수 있습니다."
 LR_USA_dev_synthetic_fuel:0 "합성 연료 공장"
 LR_USA_dev_synthetic_fuel_desc:0 "석유는 남쪽 유전에서 나오고, 그 유전으로 가는 철도는 전쟁이 나면 가장 먼저 끊깁니다. 화학자들은 석탄에서 휘발유를 뽑아내는 공정을 보여 주며, 값은 비싸도 적이 끊을 수 없는 연료라는 점을 강조합니다."
 LR_USA_dev_war_production:0 "민수에서 군수로"
 LR_USA_dev_war_production_desc:0 "자동차 공장의 조립 라인은 하루면 트럭 공장이 되고, 한 달이면 전차 공장이 됩니다. 정부는 공장주들에게 전쟁이 끝나면 라인을 돌려주겠다고 약속하고, 그 약속을 문서로 남겨 달라는 요구에 순순히 서명합니다."
 LR_USA_dev_army:0 "왕립 식민지군"
 LR_USA_dev_army_desc:0 "대전쟁에서 돌아온 식민지 연대들은 영국군 장교 밑에서 싸웠고, 그 장교들 밑에서 승진이 막혔습니다. 총독부는 처음으로 식민지 출신에게 대령 계급장을 달아 주고, 그들의 연대를 따로 묶어 왕립 식민지군이라 부르기로 합니다."
 LR_USA_dev_rifles:0 "보병 화기 개량"
 LR_USA_dev_rifles_desc:0 "병사들이 들고 있는 소총은 대전쟁 때 만든 것이고, 그 가운데 상당수는 그때 쓰던 것을 그대로 물려받은 것입니다. 병기국은 반자동 소총과 경기관총의 시험 사격을 끝내고 생산 계약을 맺습니다."
 LR_USA_dev_artillery:0 "야포 표준화"
 LR_USA_dev_artillery_desc:0 "포병대가 쓰는 대포의 구경만 일곱 가지라 탄약 보급이 늘 엉킵니다. 참모부는 구경을 세 가지로 줄이고, 그 세 가지를 트럭으로 끌 수 있는 포가로 바꾸기로 합니다."
 LR_USA_dev_tanks:0 "기갑 부대"
 LR_USA_dev_tanks_desc:0 "대전쟁의 전차는 참호를 넘는 기계였지만, 지금 유럽에서 만드는 전차는 참호 뒤까지 달려가는 기계입니다. 기병 장교 몇이 말을 내리고 시험용 전차 중대를 맡겠다고 자원합니다."
 LR_USA_dev_mobile_doctrine:0 "기동전 교리"
 LR_USA_dev_mobile_doctrine_desc:0 "이 대륙은 유럽보다 훨씬 넓고, 넓은 땅에서는 먼저 도착하는 쪽이 이깁니다. 참모 대학의 교관들은 보병을 트럭에 태우고 전차와 함께 움직이는 훈련을 교과 과정에 넣습니다."
 LR_USA_dev_navy:0 "북대서양 분함대"
 LR_USA_dev_navy_desc:0 "본국 함대가 대서양을 건너오는 데는 열흘이 걸립니다. 해군성은 그 열흘을 메울 함대를 식민지 항구에 두기로 했고, 노퍽과 보스턴의 선거에 해군성 감독관들이 짐을 풉니다."
 LR_USA_dev_destroyers:0 "구축함 계획"
 LR_USA_dev_destroyers_desc:0 "상선을 지키는 데는 전함보다 구축함이 쓸모 있습니다. 해군은 같은 설계로 구축함을 여러 척 한꺼번에 찍어 내는 계획을 세우고, 조선소마다 같은 도면을 보냅니다."
 LR_USA_dev_submarines:0 "잠수함대"
 LR_USA_dev_submarines_desc:0 "적의 함대가 더 크다면 그 함대가 지키는 상선을 노리면 됩니다. 잠수함 승조원 학교가 문을 열고, 첫 기수의 절반은 상선 선원 출신으로 채워집니다."
 LR_USA_dev_capital_ships:0 "주력함 건조"
 LR_USA_dev_capital_ships_desc:0 "바다를 지배하는 것은 여전히 큰 함포를 단 배라고 제독들은 믿습니다. 의회는 오랜 논쟁 끝에 주력함 건조 예산을 통과시키고, 가장 큰 선거에서 용골을 놓는 기공식이 열립니다."
 LR_USA_dev_fleet_doctrine:0 "해군 교리"
 LR_USA_dev_fleet_doctrine_desc:0 "배를 만드는 것보다 그 배들을 함께 움직이는 법을 익히는 데 더 오래 걸립니다. 해군 대학은 해마다 대규모 기동 연습을 열고, 그 결과를 바탕으로 함대 교범을 새로 씁니다."
 LR_USA_dev_air:0 "식민지 항공대"
 LR_USA_dev_air_desc:0 "영국 공군은 식민지에 비행장을 내주면서도 조종사는 본토에서 데려왔습니다. 오하이오의 비행 학교를 졸업한 청년들이 정비병으로만 일한다는 불만이 신문에 실린 뒤에야 총독부는 식민지 항공대 창설안을 런던에 올립니다."
 LR_USA_dev_fighters:0 "전투기 개발"
 LR_USA_dev_fighters_desc:0 "복엽기의 시대는 끝났습니다. 설계국은 금속 동체에 접이식 바퀴를 단 단엽 전투기의 시제기를 내놓고, 시험 비행에서 시속 사백 킬로미터를 넘깁니다."
 LR_USA_dev_bombers:0 "폭격기 개발"
 LR_USA_dev_bombers_desc:0 "전선 너머의 철도와 다리를 부술 수 있다면 적의 군대는 굶습니다. 항공대는 쌍발 폭격기의 설계 공모를 열고, 세 회사가 시제기를 내놓습니다."
 LR_USA_dev_aircraft_plants:0 "항공기 공장"
 LR_USA_dev_aircraft_plants_desc:0 "비행기 한 대를 만드는 데 걸리는 시간을 줄이려면 자동차처럼 조립 라인에서 만들어야 합니다. 정부는 자동차 회사들에 항공기 생산을 맡기고, 공장 옆에 비행장을 붙여 짓게 합니다."
 LR_USA_dev_air_doctrine:0 "공군 교리"
 LR_USA_dev_air_doctrine_desc:0 "비행기를 육군과 해군의 보조로 둘 것인지, 따로 싸우는 군대로 만들 것인지를 두고 오랜 논쟁이 이어졌습니다. 항공대 장교들은 마침내 자기들만의 교범을 손에 넣고, 그 교범의 첫 장은 제공권을 다룹니다."
 LR_CNA_second_congress:0 "제2차 대륙회의"
 LR_CNA_second_congress_desc:0 "1937년 7월 4일, 필라델피아 독립기념관에 쉰여섯 명의 대표가 모였습니다. 160년 전 선조들이 실패한 바로 그 자리입니다. 조지 워싱턴이 대륙군 총사령관으로 지명되었고, 이제 남은 일은 이기는 것뿐입니다."
 LR_CNA_reorganise_army:0 "대륙군 재편"
 LR_CNA_reorganise_army_desc:0 "대륙군은 퇴역 장교와 농부, 공장 노동자가 뒤섞인 군대입니다. 워싱턴은 플랑드르에서 배운 대로 이들을 연대와 사단으로 묶습니다. 교범은 영국군의 것을 번역해 씁니다. 장교들도 이 점이 조금 우습다는 것을 압니다."
 LR_CNA_supply_lines:0 "보급선 확보"
 LR_CNA_supply_lines_desc:0 "대륙군의 탄약은 사흘 치뿐입니다. 피츠버그와 볼티모어의 공장을 전시 생산으로 돌리고, 펜실베이니아 철도를 군이 접수합니다. 철도원 노조는 임금을 두 배로 달라고 했고, 대륙 회의는 들어주었습니다."
 LR_CNA_minutemen:0 "민병대 동원"
 LR_CNA_minutemen_desc:0 "버지니아와 매사추세츠의 마을마다 민병대가 다시 꾸려집니다. 1775년 렉싱턴의 민병대처럼 일 분이면 싸울 준비가 된다고들 자랑합니다. 신발이 모자라 실제로는 십 분쯤 걸립니다."
 LR_CNA_hold_philadelphia:0 "필라델피아 사수"
 LR_CNA_hold_philadelphia_desc:0 "총독부군이 델라웨어 강을 건너 필라델피아로 다가옵니다. 대륙 회의를 볼티모어로 옮기자는 의원도 있었지만 워싱턴은 거절했습니다. 수도가 떠나면 혁명도 떠난다는 것이 그의 대답이었습니다."
 LR_CNA_letter_to_paris:0 "파리에 보내는 서한"
 LR_CNA_letter_to_paris_desc:0 "벤저민 프랭클린이 1778년 파리에서 해낸 일을 누군가 다시 해야 합니다. 대륙 회의는 프랑스에 무기와 차관을 청하는 서한을 보냅니다. 파리가 지금 누구의 손에 있든, 영국의 적은 대륙 회의의 친구입니다."
 LR_CNA_march_north:0 "북부 진격"
 LR_CNA_march_north_desc:0 "뉴욕은 총독부의 머리입니다. 허드슨 강 계곡을 따라 올라가 총독 관저를 쳐야 전쟁이 끝납니다. 워싱턴은 1776년 롱아일랜드에서 선조들이 당한 패배를 지도 위에 붉은 연필로 직접 표시해 두었습니다."
 LR_CNA_overthrow:0 "총독부 타도"
 LR_CNA_overthrow_desc:0 "총독부는 무너지고 있습니다. 남은 것은 뉴욕 항구에 웅크린 수비대와 바다 건너의 본국뿐입니다. 대륙군은 마지막 공세를 준비합니다. 이 싸움에서 이기면, 그다음 상대는 영국 그 자체입니다."
 LR_CNA_morning:0 "독립의 아침"
 LR_CNA_morning_desc:0 "총독 관저의 깃대에서 유니언잭이 내려왔습니다. 대륙 회의는 열세 식민지와 서부 영토를 아우르는 미합중국의 수립을 선포했습니다. 이제 공화국은 총이 아니라 법으로 스스로를 지켜야 합니다."
 LR_CNA_convention:0 "헌법 제정 회의"
 LR_CNA_convention_desc:0 "각 주의 대표 쉰다섯 명이 필라델피아에 모였습니다. 대통령에게 얼마만큼의 권한을 줄지, 주와 연방이 무엇을 나눠 가질지를 두고 넉 달을 싸웠습니다. 워싱턴은 의장석에서 거의 말하지 않았습니다."
 LR_CNA_bill_of_rights:0 "권리장전"
 LR_CNA_bill_of_rights_desc:0 "언론과 집회와 종교의 자유, 영장 없는 수색의 금지. 총독부 시절 사라졌던 권리들이 헌법 맨 뒤에 열 개의 조항으로 붙었습니다. 일부 의원은 이것이 무정부주의자들에게 문을 열어 준다며 끝까지 반대했습니다."
 LR_CNA_federal_treasury:0 "연방 재무부"
 LR_CNA_federal_treasury_desc:0 "전쟁 공채가 대륙 회의 예산의 네 배입니다. 재무장관은 연방은행을 세우고 관세로 빚을 갚자고 제안했습니다. 영국 자본이 빠져나간 자리를 누가 채울지가 남은 문제입니다."
 LR_CNA_secret_service:0 "비밀경호국"
 LR_CNA_secret_service_desc:0 "총독부 정보국의 요원 일부가 아직 필라델피아 거리를 돌아다닙니다. 대통령을 노리는 이는 그들만이 아닙니다. 재무부 아래 대통령 경호를 맡을 작은 기관을 둡니다. 처음 배치된 요원은 스물네 명입니다."
 LR_CNA_july_fourth:0 "첫 번째 독립기념일"
 LR_CNA_july_fourth_desc:0 "공화국의 첫 독립기념일입니다. 워싱턴은 독립기념관 앞 광장에서 연설합니다. 육만 명이 모일 것으로 보이고, 경찰은 그 절반도 통제할 수 없다고 보고했습니다. 대통령은 연설을 취소하지 않았습니다."
 LR_CNA_after_shots:0 "총성 이후"
 LR_CNA_after_shots_desc:0 "총알은 대통령의 왼쪽 어깨를 스쳤습니다. 워싱턴은 붕대를 감은 채 연설을 끝까지 마쳤고, 그날 광장에 있던 사람들은 그 장면을 평생 이야기할 것입니다. 공화국은 첫 시험을 넘겼습니다."
 LR_CNA_election:0 "첫 번째 대통령 선거"
 LR_CNA_election_desc:0 "헌법에 따라 첫 대통령 선거가 치러집니다. 워싱턴은 출마하지 않겠다고 했다가 의원 이백 명의 연서를 받고 마음을 바꿨습니다. 상대 후보는 없습니다. 투표용지에는 찬성과 반대 두 칸만 인쇄되었습니다."
 LR_CNA_western_rail:0 "대륙 횡단 철도"
 LR_CNA_western_rail_desc:0 "미시시피 서쪽에는 아직 철도가 드뭅니다. 시카고에서 오리건까지 이어질 새 철도는 서부 개척민의 꿈이자 병참 장교의 꿈입니다. 연방 정부가 직접 첫 삽을 뜹니다."
 LR_CNA_continental_navy:0 "대륙 해군"
 LR_CNA_continental_navy_desc:0 "독립 전쟁 동안 대륙 회의는 군함 한 척 없이 싸웠고, 영국 함대가 해안을 막는 동안 할 수 있는 일이 없었습니다. 노퍽과 필라델피아 조선소에서 공화국의 첫 순양함들이 진수됩니다."
 LR_CNA_monroe:0 "먼로 선언"
 LR_CNA_monroe_desc:0 "유럽의 왕들은 더 이상 아메리카 대륙에 새 식민지를 만들 수 없습니다. 이미 있는 식민지에 대해서도 공화국은 침묵하지 않을 것입니다. 마드리드와 런던은 이 선언을 무시했고, 남미의 혁명가들은 이 선언을 외웠습니다."
 LR_CNA_manifest_destiny:0 "명백한 운명"
 LR_CNA_manifest_destiny_desc:0 "텍사스와 뉴멕시코, 캘리포니아. 공화국의 서쪽 땅은 여전히 스페인 부왕의 것입니다. 신문들은 대륙을 바다에서 바다까지 채우는 것이 미국인의 운명이라고 씁니다. 의회는 그 기사들을 결의안으로 바꿨습니다."
 LR_CNA_rio_grande:0 "리오그란데 전쟁"
 LR_CNA_rio_grande_desc:0 "부왕군이 리오그란데 북쪽에 요새를 쌓는다는 보고가 들어왔습니다. 의회는 선전포고를 두고 사흘 동안 토론했고, 스물두 표 차이로 통과시켰습니다. 대륙군 출신 장교들은 이번에는 공격하는 쪽이라는 것이 낯섭니다."
 LR_CNA_promise_1778:0 "1778년의 약속"
 LR_CNA_promise_1778_desc:0 "1778년 프랑스 왕은 반란을 일으킨 식민지와 동맹을 맺었습니다. 그 조약은 혁명이 실패하면서 휴지가 되었습니다. 160년 뒤, 공화국은 그 조약문을 다시 꺼내 자유를 지키려는 나라들과 새 동맹을 맺습니다."
 LR_CNA_arsenal:0 "민주주의의 무기고"
 LR_CNA_arsenal_desc:0 "공화국의 공장들은 유럽의 어느 나라보다 많은 강철을 만듭니다. 대통령은 이 강철을 왕들의 전쟁이 아니라 자유를 위한 전쟁에 쓰겠다고 말했습니다. 디트로이트의 조립 라인에서 전차가 나오기 시작합니다."
 LR_CNA_northern_brothers:0 "북쪽의 형제들"
 LR_CNA_northern_brothers_desc:0 "캐나다는 아직 영국 귀족 공화국의 자치령입니다. 몬트리올과 토론토에는 공화국을 동경하는 젊은이가 많습니다. 공화국은 그들의 해방을 내걸고 국경을 넘습니다. 이번에는 1812년처럼 끝나지 않을 것입니다."
 LR_CNA_continent_of_liberty:0 "자유의 대륙"
 LR_CNA_continent_of_liberty_desc:0 "북극해에서 리오그란데까지, 대륙의 대부분이 한 공화국의 헌법 아래 있습니다. 워싱턴은 두 번째 임기를 마치면 버지니아로 돌아가겠다고 말합니다. 공화국이 한 사람에게 기대지 않아도 되는 날이 오기를, 그는 누구보다 바랍니다."
 LR_CNA_acting_president:0 "임시 대통령 헐"
 LR_CNA_acting_president_desc:0 "부통령 코델 헐이 병원 복도에서 취임 선서를 했습니다. 테네시의 변호사 출신인 그는 관세와 조약에는 밝지만 성난 군중을 다뤄 본 적은 없습니다. 거리에서는 누가 대통령을 죽였는지를 두고 벌써 세 가지 소문이 돕니다."
 LR_CNA_martial_law:0 "계엄령"
 LR_CNA_martial_law_desc:0 "필라델피아와 뉴욕, 시카고에 계엄령을 선포합니다. 집회는 금지되고 야간 통행에는 군의 허가가 필요합니다. 헐은 서명하기 전에 한참 손을 떨었습니다. 집행은 대륙군 사령관 맥아더 장군이 맡습니다."
 LR_CNA_dialogue:0 "시위대와의 대화"
 LR_CNA_dialogue_desc:0 "헐은 파업 지도부와 퇴역 군인 대표를 독립기념관으로 불렀습니다. 그들의 요구는 열네 가지였고, 그중 아홉 가지는 들어줄 수 있는 것이었습니다. 군은 이 회담을 굴복이라고 부릅니다."
 LR_CNA_emergency_currency:0 "긴급 통화 조치"
 LR_CNA_emergency_currency_desc:0 "영국의 금수 조치로 파운드 결제가 막혔습니다. 재무부는 금 태환을 중단하고 새 지폐를 찍습니다. 공장 노동자의 주급은 두 주 만에 반값이 되었습니다. 헐은 석 달만 버티면 된다고 말합니다."
 LR_CNA_lean_on_army:0 "군에 기대다"
 LR_CNA_lean_on_army_desc:0 "질서를 되찾을 수 있는 조직은 군뿐이라는 보고서가 헐의 책상에 올라왔습니다. 작성자는 맥아더 장군입니다. 헐은 보고서를 읽고, 다시 읽고, 서랍에 넣었습니다. 사흘 뒤 그는 서랍을 다시 열었습니다."
 LR_CNA_junta:0 "국가 재건 위원회"
 LR_CNA_junta_desc:0 "맥아더 장군은 대통령 직무 대행이 아니라 국가 재건 위원회 의장이라는 직함을 택했습니다. 헌법은 정지되지 않았다고 그는 말합니다. 잠시 서랍 속에 들어갔을 뿐이라고."
 LR_CNA_west_point:0 "웨스트포인트의 장교들"
 LR_CNA_west_point_desc:0 "대륙군 장교의 절반이 맥아더를 따랐고, 나머지 절반은 고향 주의 깃발을 택했습니다. 남은 장교들을 다시 하나로 묶으려면 진급과 훈장, 그리고 무엇보다 승리가 필요합니다."
 LR_CNA_appalachian_front:0 "애팔래치아 전선"
 LR_CNA_appalachian_front_desc:0 "펜실베이니아와 버지니아에는 공화국의 공업과 정통성이 몰려 있습니다. 북쪽의 평의회군, 서쪽의 롱, 남쪽의 남부 연합이 모두 이곳을 노립니다. 애팔래치아 산맥이 첫 방벽입니다."
 LR_CNA_final_offensive:0 "최후의 공세"
 LR_CNA_final_offensive_desc:0 "탄약은 석 달 치, 병력은 여섯 달 치가 남았습니다. 맥아더는 기다리면 진다고 판단했습니다. 모든 전선에서 동시에 공세를 시작합니다. 성공하면 내전이 끝나고, 실패하면 맥아더가 끝납니다."
 LR_CNA_generalissimo:0 "대원수"
 LR_CNA_generalissimo_desc:0 "내전은 끝났습니다. 의회는 맥아더에게 공화국 대원수라는 칭호를 바쳤습니다. 그는 칭호를 받고, 다음 날 의회를 해산했습니다. 필라델피아의 신문들은 이 소식을 3면에 실었습니다."
 LR_CNA_crowned_general:0 "왕관을 쓴 장군"
 LR_CNA_crowned_general_desc:0 "신대륙에 처음 이름을 준 사람, 아메리고 베스푸치의 이름을 딴 새 나라가 선포됩니다. 대관식은 필라델피아 독립기념관에서 열립니다. 워싱턴이 마지막 연설을 했던 바로 그 광장입니다."
 LR_CNA_peerage:0 "제국 귀족원"
 LR_CNA_peerage_desc:0 "황제는 내전에서 공을 세운 장군 마흔 명과 그들을 도운 실업가 스무 명에게 작위를 내렸습니다. 귀족원은 황제의 법안을 한 번도 거부하지 않았고, 앞으로도 그럴 생각이 없습니다."
 LR_CNA_imperial_army:0 "제국 육군"
 LR_CNA_imperial_army_desc:0 "대륙군이라는 이름은 사라지고 아메리고 제국 육군이 남았습니다. 황제는 필리핀에서 배운 기동전과 플랑드르에서 배운 포병전을 섞은 새 교범을 직접 썼습니다. 장교들은 그 교범을 외워야 진급합니다."
 LR_CNA_imperial_roads:0 "황제의 도로"
 LR_CNA_imperial_roads_desc:0 "내전으로 끊긴 철도와 다리를 다시 놓습니다. 새 도로는 모두 필라델피아에서 시작해 황제의 이름을 달고 뻗어 나갑니다. 공사장에는 내전 포로 이십만 명이 투입되었습니다."
 LR_CNA_northern_campaign:0 "북방 원정"
 LR_CNA_northern_campaign_desc:0 "캐나다는 내전 동안 국경 너머로 영국군을 들여왔습니다. 황제는 이를 잊지 않았습니다. 제국 육군이 세인트로렌스 강을 건넙니다. 황제는 오타와에서 겨울을 나겠다고 말했습니다."
 LR_CNA_canada_crown:0 "북방 왕령"
 LR_CNA_canada_crown_desc:0 "오타와 의사당에 제국의 깃발이 올랐습니다. 캐나다는 더 이상 영국의 자치령이 아니라 아메리고 제국의 북방 왕령입니다. 황제는 퀘벡의 프랑스어 학교를 그대로 두겠다고 약속했고, 토론토의 은행가들에게는 제국 귀족원의 의석을 내밀었습니다."
 LR_CNA_pacific_emperor:0 "태평양의 황제"
 LR_CNA_pacific_emperor_desc:0 "황제는 젊은 시절 필리핀에서 근무하며 태평양을 보았습니다. 하와이 왕국과 스페인령 필리핀은 그 바다의 디딤돌입니다. 제국 해군의 새 전함들이 샌프란시스코 대신 시애틀에서 서쪽으로 출항합니다."
 LR_CNA_old_grudge:0 "묵은 원한"
 LR_CNA_old_grudge_desc:0 "160년 전 영국은 식민지를 짓밟았고, 몇 해 전에는 내전에 끼어들 궁리를 했습니다. 황제는 대서양 건너의 귀족 의회와 자신의 왕관 가운데 하나만 남아야 한다고 믿습니다. 장군들은 반대하지 않았습니다."
 LR_CNA_amerigo_millennium:0 "아메리고 천년"
 LR_CNA_amerigo_millennium_desc:0 "제국은 신대륙의 주인이 되었습니다. 황제는 일흔을 바라보고 있고, 후계자는 아직 정하지 않았습니다. 궁정에서는 벌써 원수 세 명이 서로를 견제하고 있습니다."
 LR_CNA_dev_economy:0 "연방 전시 경제"
 LR_CNA_dev_economy_desc:0 "독립은 선언으로 끝나지 않았습니다. 영국의 금수 조치가 대서양 항로를 막자 공화국은 지금껏 리버풀에서 사 오던 물건을 스스로 만들어야 했고, 재무부는 공장주들을 필라델피아로 불러 전시 생산 계약서를 내밉니다."
 LR_CNA_dev_machine_tools:0 "공작기계 표준화"
 LR_CNA_dev_machine_tools_desc:0 "공장마다 다른 규격의 나사와 볼트를 쓰는 바람에, 한 공장에서 만든 부품이 다른 공장의 기계에 맞지 않는 일이 흔합니다. 규격을 하나로 맞추는 데는 여섯 달이 걸리지만, 그 뒤로는 어느 공장에서 만든 부품이든 전선의 어느 기계에나 들어갑니다."
 LR_CNA_dev_power_grid:0 "전국 송전망"
 LR_CNA_dev_power_grid_desc:0 "강가의 수력 발전소에서 만든 전기가 도시 하나를 넘어가지 못하고 버려지고 있습니다. 송전탑을 이어 발전소와 공업 지대를 하나의 망으로 묶으면, 밤에도 불을 끄지 않는 공장을 세울 수 있습니다."
 LR_CNA_dev_synthetic_fuel:0 "합성 연료 공장"
 LR_CNA_dev_synthetic_fuel_desc:0 "석유는 남쪽 유전에서 나오고, 그 유전으로 가는 철도는 전쟁이 나면 가장 먼저 끊깁니다. 화학자들은 석탄에서 휘발유를 뽑아내는 공정을 보여 주며, 값은 비싸도 적이 끊을 수 없는 연료라는 점을 강조합니다."
 LR_CNA_dev_war_production:0 "민수에서 군수로"
 LR_CNA_dev_war_production_desc:0 "자동차 공장의 조립 라인은 하루면 트럭 공장이 되고, 한 달이면 전차 공장이 됩니다. 정부는 공장주들에게 전쟁이 끝나면 라인을 돌려주겠다고 약속하고, 그 약속을 문서로 남겨 달라는 요구에 순순히 서명합니다."
 LR_CNA_dev_army:0 "대륙군 재건"
 LR_CNA_dev_army_desc:0 "1776년의 대륙군은 농부와 사냥꾼으로 영국 정규군을 이겼다고 교과서는 가르칩니다. 지금의 참모들은 그 교과서를 덮어 두고, 철도와 무전기로 움직이는 군대의 편제표를 새로 그립니다."
 LR_CNA_dev_rifles:0 "보병 화기 개량"
 LR_CNA_dev_rifles_desc:0 "병사들이 들고 있는 소총은 대전쟁 때 만든 것이고, 그 가운데 상당수는 그때 쓰던 것을 그대로 물려받은 것입니다. 병기국은 반자동 소총과 경기관총의 시험 사격을 끝내고 생산 계약을 맺습니다."
 LR_CNA_dev_artillery:0 "야포 표준화"
 LR_CNA_dev_artillery_desc:0 "포병대가 쓰는 대포의 구경만 일곱 가지라 탄약 보급이 늘 엉킵니다. 참모부는 구경을 세 가지로 줄이고, 그 세 가지를 트럭으로 끌 수 있는 포가로 바꾸기로 합니다."
 LR_CNA_dev_tanks:0 "기갑 부대"
 LR_CNA_dev_tanks_desc:0 "대전쟁의 전차는 참호를 넘는 기계였지만, 지금 유럽에서 만드는 전차는 참호 뒤까지 달려가는 기계입니다. 기병 장교 몇이 말을 내리고 시험용 전차 중대를 맡겠다고 자원합니다."
 LR_CNA_dev_mobile_doctrine:0 "기동전 교리"
 LR_CNA_dev_mobile_doctrine_desc:0 "이 대륙은 유럽보다 훨씬 넓고, 넓은 땅에서는 먼저 도착하는 쪽이 이깁니다. 참모 대학의 교관들은 보병을 트럭에 태우고 전차와 함께 움직이는 훈련을 교과 과정에 넣습니다."
 LR_CNA_dev_navy:0 "연방 해군 위원회"
 LR_CNA_dev_navy_desc:0 "영국 해군이 마음만 먹으면 공화국의 항구는 한 주 안에 모두 막힙니다. 의회는 그 사실을 알고도 오랫동안 해군 예산을 깎았지만, 금수 조치가 시작된 뒤로는 해군 위원회 청문회가 가장 붐비는 자리가 되었습니다."
 LR_CNA_dev_destroyers:0 "구축함 계획"
 LR_CNA_dev_destroyers_desc:0 "상선을 지키는 데는 전함보다 구축함이 쓸모 있습니다. 해군은 같은 설계로 구축함을 여러 척 한꺼번에 찍어 내는 계획을 세우고, 조선소마다 같은 도면을 보냅니다."
 LR_CNA_dev_submarines:0 "잠수함대"
 LR_CNA_dev_submarines_desc:0 "적의 함대가 더 크다면 그 함대가 지키는 상선을 노리면 됩니다. 잠수함 승조원 학교가 문을 열고, 첫 기수의 절반은 상선 선원 출신으로 채워집니다."
 LR_CNA_dev_capital_ships:0 "주력함 건조"
 LR_CNA_dev_capital_ships_desc:0 "바다를 지배하는 것은 여전히 큰 함포를 단 배라고 제독들은 믿습니다. 의회는 오랜 논쟁 끝에 주력함 건조 예산을 통과시키고, 가장 큰 선거에서 용골을 놓는 기공식이 열립니다."
 LR_CNA_dev_fleet_doctrine:0 "해군 교리"
 LR_CNA_dev_fleet_doctrine_desc:0 "배를 만드는 것보다 그 배들을 함께 움직이는 법을 익히는 데 더 오래 걸립니다. 해군 대학은 해마다 대규모 기동 연습을 열고, 그 결과를 바탕으로 함대 교범을 새로 씁니다."
 LR_CNA_dev_air:0 "대륙 항공대"
 LR_CNA_dev_air_desc:0 "데이턴의 자전거 가게에서 비행기가 처음 떴다는 것은 이 나라 사람들이 자랑으로 여기는 일입니다. 그러나 그 비행기를 군대로 만드는 일에는 아직 아무도 손을 대지 않았고, 육군 항공과의 젊은 장교들이 의회 복도에서 의원들을 붙잡습니다."
 LR_CNA_dev_fighters:0 "전투기 개발"
 LR_CNA_dev_fighters_desc:0 "복엽기의 시대는 끝났습니다. 설계국은 금속 동체에 접이식 바퀴를 단 단엽 전투기의 시제기를 내놓고, 시험 비행에서 시속 사백 킬로미터를 넘깁니다."
 LR_CNA_dev_bombers:0 "폭격기 개발"
 LR_CNA_dev_bombers_desc:0 "전선 너머의 철도와 다리를 부술 수 있다면 적의 군대는 굶습니다. 항공대는 쌍발 폭격기의 설계 공모를 열고, 세 회사가 시제기를 내놓습니다."
 LR_CNA_dev_aircraft_plants:0 "항공기 공장"
 LR_CNA_dev_aircraft_plants_desc:0 "비행기 한 대를 만드는 데 걸리는 시간을 줄이려면 자동차처럼 조립 라인에서 만들어야 합니다. 정부는 자동차 회사들에 항공기 생산을 맡기고, 공장 옆에 비행장을 붙여 짓게 합니다."
 LR_CNA_dev_air_doctrine:0 "공군 교리"
 LR_CNA_dev_air_doctrine_desc:0 "비행기를 육군과 해군의 보조로 둘 것인지, 따로 싸우는 군대로 만들 것인지를 두고 오랜 논쟁이 이어졌습니다. 항공대 장교들은 마침내 자기들만의 교범을 손에 넣고, 그 교범의 첫 장은 제공권을 다룹니다."
 LR_AMC_council:0 "미주 노동자 평의회"
 LR_AMC_council_desc:0 "시카고 노동회관에 북부 여덟 개 주의 평의회 대표 사백 명이 모였습니다. 그들은 대륙 회의도, 맥아더의 군정도 인정하지 않는다고 선언했습니다. 의장은 캔자스 출신의 얼 브라우더입니다."
 LR_AMC_red_guards:0 "붉은 근위대"
 LR_AMC_red_guards_desc:0 "디트로이트 자동차 공장의 노동자 삼만 명이 공장 경비대를 근위대로 바꿨습니다. 그들의 무기는 총독부 시절 숨겨 둔 스프링필드 소총과 공장에서 갓 나온 트럭입니다."
 LR_AMC_detroit_arsenal:0 "디트로이트 병기창"
 LR_AMC_detroit_arsenal_desc:0 "포드와 제너럴 모터스의 조립 라인이 노동자 위원회의 손에 넘어갔습니다. 공장장들은 쫓겨나지 않고 기술 고문이 되었습니다. 그들 가운데 몇은 이쪽이 회사보다 낫다고 몰래 말합니다."
 LR_AMC_general_strike:0 "총파업 호소"
 LR_AMC_general_strike_desc:0 "평의회는 남부와 서부의 노동자들에게 총파업을 호소합니다. 롱의 지지자 가운데 상당수가 철도원과 광부입니다. 그들이 기차를 멈추면 롱의 군대도 멈춥니다."
 LR_AMC_march_south:0 "남쪽으로"
 LR_AMC_march_south_desc:0 "평의회군이 오하이오 강을 건넙니다. 첫 목표는 피츠버그의 제철소, 그다음은 필라델피아입니다. 1937년에 독립을 선언한 그 도시에서, 이번에는 혁명을 선언할 것입니다."
 LR_AMC_union:0 "연방 선포"
 LR_AMC_union_desc:0 "필라델피아 독립기념관에 붉은 깃발이 올랐습니다. 대표자 대회는 각 주를 사회주의 공화국으로 다시 세우고 이들을 하나의 연방으로 묶기로 했습니다. 러시아 공화국 이후 두 번째로 살아남은 혁명입니다."
 LR_AMC_federal_treaty:0 "연방 조약"
 LR_AMC_federal_treaty_desc:0 "뉴욕, 일리노이, 버지니아. 조약은 각 사회주의 공화국이 탈퇴할 권리를 가진다고 씁니다. 중앙위원회는 그 권리를 쓰려는 공화국은 없을 것이라고 확신합니다."
 LR_AMC_five_year_plan:0 "제1차 5개년 계획"
 LR_AMC_five_year_plan_desc:0 "내전으로 무너진 공업을 다시 세웁니다. 계획 위원회는 강철 생산을 다섯 해 안에 세 배로 늘리겠다고 약속했습니다. 숫자는 대담하고, 계획 위원들은 요즘 잠을 자지 않습니다."
 LR_AMC_red_army:0 "미주 적군"
 LR_AMC_red_army_desc:0 "평의회군과 붉은 근위대를 하나의 정규군으로 묶습니다. 장교는 노동자 출신이어야 한다는 원칙과, 장교는 싸울 줄 알아야 한다는 원칙이 부딪쳤습니다. 결국 정치위원이 둘을 이어 붙였습니다."
 LR_AMC_electrification:0 "전국 전력화"
 LR_AMC_electrification_desc:0 "테네시 강에 댐 열두 개를 짓습니다. 남부의 농가에 처음으로 전등이 켜집니다. 남부 연합을 지지하던 농민들도 전등 아래에서는 조금 덜 투덜댑니다."
 LR_AMC_russian_brothers:0 "러시아의 형제들"
 LR_AMC_russian_brothers_desc:0 "러시아 공화국은 세계에서 유일하게 혁명을 지켜 낸 나라였습니다. 이제 그 나라는 외롭지 않습니다. 대서양과 태평양을 사이에 둔 두 혁명이 손을 잡습니다."
 LR_AMC_liberation:0 "미주 해방 선언"
 LR_AMC_liberation_desc:0 "중앙위원회는 북극해에서 티에라델푸에고까지, 아메리카 대륙의 모든 노동자를 해방하겠다고 선언했습니다. 왕과 부왕과 총독이 다스리는 땅은 모두 연방의 일원이 될 것입니다. 선언문은 영어와 스페인어, 포르투갈어, 프랑스어로 동시에 인쇄되었습니다."
 LR_AMC_northern_revolution:0 "북방 혁명"
 LR_AMC_northern_revolution_desc:0 "퀘벡과 온타리오의 노동자들이 국경 너머를 바라보고 있습니다. 평의회는 그들에게 해방을 약속합니다. 영국 귀족 공화국의 자치령은 미주 혁명의 첫 수출품을 받게 될 것입니다."
 LR_AMC_southern_revolution:0 "남방 혁명"
 LR_AMC_southern_revolution_desc:0 "누에바 에스파냐의 광부와 농민은 크리올로 귀족의 땅에서 일합니다. 그들에게 필요한 것은 총과 깃발입니다. 미주 적군이 리오그란데를 건넙니다."
 LR_AMC_caribbean_revolution:0 "카리브의 붉은 바다"
 LR_AMC_caribbean_revolution_desc:0 "아바나와 과테말라시티의 사탕수수 농장에서는 아직 스페인 귀족이 채찍을 듭니다. 미주 적군의 상륙함대가 노퍽에서 출항합니다. 쿠바의 담배 노동자 조합은 이미 무기를 숨겨 두었습니다."
 LR_AMC_andes_revolution:0 "안데스의 광부들"
 LR_AMC_andes_revolution_desc:0 "볼리비아의 주석 광산과 페루의 은 광산, 베네수엘라의 유전에서 일하는 사람들은 하루 열네 시간을 일하고 빚만 늘어갑니다. 미주 적군이 파나마 지협을 넘어 남쪽으로 내려갑니다."
 LR_AMC_southern_star:0 "남십자성 아래의 혁명"
 LR_AMC_southern_star_desc:0 "리오데라플라타의 팜파스와 칠레의 구리 광산, 브라질의 커피 농장. 신대륙 남쪽의 왕국과 부왕령이 마지막 목표입니다. 부에노스아이레스의 부두 노동자들은 북쪽에서 오는 배를 기다리고 있습니다."
 LR_AMC_union_of_americas:0 "아메리카 연방 편입"
 LR_AMC_union_of_americas_desc:0 "해방된 땅마다 노동자 평의회가 세워졌습니다. 대표자 대회는 그 평의회들을 연방의 사회주의 공화국으로 받아들이기로 했습니다. 멕시코시티와 아바나, 리마의 대표들이 필라델피아에 도착합니다."
 LR_AMC_second_capital:0 "혁명의 두 번째 수도"
 LR_AMC_second_capital_desc:0 "필라델피아에서 페트로그라드까지, 혁명은 이제 두 대륙의 일입니다. 런던과 파리의 왕들은 밤마다 같은 악몽을 꿉니다. 중앙위원회는 다음 대회를 아바나에서 열자는 안건을 검토하고 있습니다."
 LR_AMC_dev_economy:0 "인민 경제 위원회"
 LR_AMC_dev_economy_desc:0 "공장을 노동자의 손에 넘기는 일은 혁명의 첫날에 끝났지만, 그 공장을 다시 돌리는 일은 그렇게 빨리 끝나지 않습니다. 평의회는 공장 위원회 대표들을 디트로이트에 모아 전쟁에 필요한 물자의 목록과 계획을 함께 짭니다."
 LR_AMC_dev_machine_tools:0 "공작기계 표준화"
 LR_AMC_dev_machine_tools_desc:0 "공장마다 다른 규격의 나사와 볼트를 쓰는 바람에, 한 공장에서 만든 부품이 다른 공장의 기계에 맞지 않는 일이 흔합니다. 규격을 하나로 맞추는 데는 여섯 달이 걸리지만, 그 뒤로는 어느 공장에서 만든 부품이든 전선의 어느 기계에나 들어갑니다."
 LR_AMC_dev_power_grid:0 "전국 송전망"
 LR_AMC_dev_power_grid_desc:0 "강가의 수력 발전소에서 만든 전기가 도시 하나를 넘어가지 못하고 버려지고 있습니다. 송전탑을 이어 발전소와 공업 지대를 하나의 망으로 묶으면, 밤에도 불을 끄지 않는 공장을 세울 수 있습니다."
 LR_AMC_dev_synthetic_fuel:0 "합성 연료 공장"
 LR_AMC_dev_synthetic_fuel_desc:0 "석유는 남쪽 유전에서 나오고, 그 유전으로 가는 철도는 전쟁이 나면 가장 먼저 끊깁니다. 화학자들은 석탄에서 휘발유를 뽑아내는 공정을 보여 주며, 값은 비싸도 적이 끊을 수 없는 연료라는 점을 강조합니다."
 LR_AMC_dev_war_production:0 "민수에서 군수로"
 LR_AMC_dev_war_production_desc:0 "자동차 공장의 조립 라인은 하루면 트럭 공장이 되고, 한 달이면 전차 공장이 됩니다. 정부는 공장주들에게 전쟁이 끝나면 라인을 돌려주겠다고 약속하고, 그 약속을 문서로 남겨 달라는 요구에 순순히 서명합니다."
 LR_AMC_dev_army:0 "적군 참모부"
 LR_AMC_dev_army_desc:0 "적위대는 파업 현장에서는 강했지만 들판에서 정규군을 만나면 흩어졌습니다. 평의회는 옛 군대의 장교들 가운데 혁명 편에 선 사람들을 불러 모으고, 그들 곁에 정치 위원을 하나씩 붙여 참모부를 세웁니다."
 LR_AMC_dev_rifles:0 "보병 화기 개량"
 LR_AMC_dev_rifles_desc:0 "병사들이 들고 있는 소총은 대전쟁 때 만든 것이고, 그 가운데 상당수는 그때 쓰던 것을 그대로 물려받은 것입니다. 병기국은 반자동 소총과 경기관총의 시험 사격을 끝내고 생산 계약을 맺습니다."
 LR_AMC_dev_artillery:0 "야포 표준화"
 LR_AMC_dev_artillery_desc:0 "포병대가 쓰는 대포의 구경만 일곱 가지라 탄약 보급이 늘 엉킵니다. 참모부는 구경을 세 가지로 줄이고, 그 세 가지를 트럭으로 끌 수 있는 포가로 바꾸기로 합니다."
 LR_AMC_dev_tanks:0 "기갑 부대"
 LR_AMC_dev_tanks_desc:0 "대전쟁의 전차는 참호를 넘는 기계였지만, 지금 유럽에서 만드는 전차는 참호 뒤까지 달려가는 기계입니다. 기병 장교 몇이 말을 내리고 시험용 전차 중대를 맡겠다고 자원합니다."
 LR_AMC_dev_mobile_doctrine:0 "기동전 교리"
 LR_AMC_dev_mobile_doctrine_desc:0 "이 대륙은 유럽보다 훨씬 넓고, 넓은 땅에서는 먼저 도착하는 쪽이 이깁니다. 참모 대학의 교관들은 보병을 트럭에 태우고 전차와 함께 움직이는 훈련을 교과 과정에 넣습니다."
 LR_AMC_dev_navy:0 "적색 함대"
 LR_AMC_dev_navy_desc:0 "오대호의 화물선 선원들과 대서양 항구의 부두 노동자들은 혁명에 가장 먼저 가담한 사람들이었습니다. 평의회는 그들이 지킨 배들을 모아 함대라 부르기로 했지만, 그 배들 가운데 포를 단 것은 아직 몇 척 되지 않습니다."
 LR_AMC_dev_destroyers:0 "구축함 계획"
 LR_AMC_dev_destroyers_desc:0 "상선을 지키는 데는 전함보다 구축함이 쓸모 있습니다. 해군은 같은 설계로 구축함을 여러 척 한꺼번에 찍어 내는 계획을 세우고, 조선소마다 같은 도면을 보냅니다."
 LR_AMC_dev_submarines:0 "잠수함대"
 LR_AMC_dev_submarines_desc:0 "적의 함대가 더 크다면 그 함대가 지키는 상선을 노리면 됩니다. 잠수함 승조원 학교가 문을 열고, 첫 기수의 절반은 상선 선원 출신으로 채워집니다."
 LR_AMC_dev_capital_ships:0 "주력함 건조"
 LR_AMC_dev_capital_ships_desc:0 "바다를 지배하는 것은 여전히 큰 함포를 단 배라고 제독들은 믿습니다. 의회는 오랜 논쟁 끝에 주력함 건조 예산을 통과시키고, 가장 큰 선거에서 용골을 놓는 기공식이 열립니다."
 LR_AMC_dev_fleet_doctrine:0 "해군 교리"
 LR_AMC_dev_fleet_doctrine_desc:0 "배를 만드는 것보다 그 배들을 함께 움직이는 법을 익히는 데 더 오래 걸립니다. 해군 대학은 해마다 대규모 기동 연습을 열고, 그 결과를 바탕으로 함대 교범을 새로 씁니다."
 LR_AMC_dev_air:0 "인민 항공대"
 LR_AMC_dev_air_desc:0 "비행기 공장의 노동자들은 자기들이 만든 비행기를 몰고 싶어 했고, 평의회는 그 바람을 막을 이유를 찾지 못했습니다. 공장마다 비행 동호회가 생기고, 그 동호회가 인민 항공대의 첫 비행 대대가 됩니다."
 LR_AMC_dev_fighters:0 "전투기 개발"
 LR_AMC_dev_fighters_desc:0 "복엽기의 시대는 끝났습니다. 설계국은 금속 동체에 접이식 바퀴를 단 단엽 전투기의 시제기를 내놓고, 시험 비행에서 시속 사백 킬로미터를 넘깁니다."
 LR_AMC_dev_bombers:0 "폭격기 개발"
 LR_AMC_dev_bombers_desc:0 "전선 너머의 철도와 다리를 부술 수 있다면 적의 군대는 굶습니다. 항공대는 쌍발 폭격기의 설계 공모를 열고, 세 회사가 시제기를 내놓습니다."
 LR_AMC_dev_aircraft_plants:0 "항공기 공장"
 LR_AMC_dev_aircraft_plants_desc:0 "비행기 한 대를 만드는 데 걸리는 시간을 줄이려면 자동차처럼 조립 라인에서 만들어야 합니다. 정부는 자동차 회사들에 항공기 생산을 맡기고, 공장 옆에 비행장을 붙여 짓게 합니다."
 LR_AMC_dev_air_doctrine:0 "공군 교리"
 LR_AMC_dev_air_doctrine_desc:0 "비행기를 육군과 해군의 보조로 둘 것인지, 따로 싸우는 군대로 만들 것인지를 두고 오랜 논쟁이 이어졌습니다. 항공대 장교들은 마침내 자기들만의 교범을 손에 넣고, 그 교범의 첫 장은 제공권을 다룹니다."
 LR_LNG_every_man:0 "모든 사람이 왕이다"
 LR_LNG_every_man_desc:0 "캔자스시티의 방송국에서 휴이 롱이 연설합니다. 은행가와 장군과 빨갱이를 모두 쓸어버리고, 모든 미국인에게 집 한 채와 자동차 한 대를 주겠다고. 평원의 농민 수백만 명이 라디오 앞에서 고개를 끄덕였습니다."
 LR_LNG_share_clubs:0 "부의 공유 클럽"
 LR_LNG_share_clubs_desc:0 "롱의 지지자 모임인 부의 공유 클럽은 회원이 칠백만 명이라고 주장합니다. 클럽마다 무기고가 하나씩 딸려 있다는 사실은 덜 알려져 있습니다."
 LR_LNG_prairie_army:0 "평원의 군대"
 LR_LNG_prairie_army_desc:0 "평원의 농부들은 트랙터를 몰 줄 압니다. 트랙터를 모는 사람은 트럭도, 전차도 몰 수 있다고 롱은 말합니다. 오클라호마의 정유소가 이 군대에 기름을 댑니다."
 LR_LNG_radio_war:0 "라디오 전쟁"
 LR_LNG_radio_war_desc:0 "롱의 목소리는 전선보다 먼저 도착합니다. 매일 밤 아홉 시, 적 진영의 병사들도 그의 방송을 몰래 듣습니다. 다음 날 아침이면 탈영병이 늘어나 있습니다."
 LR_LNG_mississippi:0 "미시시피 장악"
 LR_LNG_mississippi_desc:0 "미시시피 강을 쥐는 쪽이 대륙의 심장을 쥡니다. 롱의 군대가 세인트루이스에서 뉴올리언스까지 강을 따라 내려갑니다. 롱은 루이지애나의 고향 집에 돌아가겠다고 약속했습니다."
 LR_LNG_restored_usa:0 "미합중국 재건"
 LR_LNG_restored_usa_desc:0 "내전에서 이긴 휴이 롱은 공화국의 옛 이름을 되살렸습니다. 미합중국. 그는 이 이름이 워싱턴의 것이 아니라 평범한 미국인 모두의 것이라고 말합니다. 헌법은 아직 손대지 않았습니다."
 LR_LNG_share_our_wealth:0 "부의 공유법"
 LR_LNG_share_our_wealth_desc:0 "연 소득 백만 달러를 넘는 부분은 모두 세금으로 걷고, 모든 가구에 오천 달러의 정착금을 줍니다. 경제학자들은 계산이 맞지 않는다고 하고, 롱은 경제학자들도 정착금을 받을 수 있다고 대답합니다."
 LR_LNG_highways:0 "국민 고속도로"
 LR_LNG_highways_desc:0 "모든 미국인에게 자동차를 주겠다는 약속에는 도로가 필요합니다. 연방 고속도로청은 대륙을 가로세로로 잇는 사만 마일의 도로 계획을 발표했습니다. 실업자 이백만 명이 삽을 들었습니다."
 LR_LNG_national_radio:0 "전국 방송망"
 LR_LNG_national_radio_desc:0 "모든 마을 회관에 라디오 한 대씩을 보냅니다. 대통령의 연설은 매주 일요일 저녁에 나가고, 다른 방송국은 그 시간에 음악만 틀어야 합니다. 가장 인기 있는 곡은 롱이 직접 작사한 노래입니다."
 LR_LNG_presidential_congress:0 "대통령의 의회"
 LR_LNG_presidential_congress_desc:0 "의회는 비상시 법률을 제정할 권한을 대통령에게 넘기는 법안을 통과시켰습니다. 반대한 의원 열여섯 명 가운데 열 명은 다음 선거에서 떨어졌습니다. 나머지 여섯 명은 출마하지 않았습니다."
 LR_LNG_kingfish_police:0 "킹피시의 경찰"
 LR_LNG_kingfish_police_desc:0 "루이지애나 주 경찰을 본뜬 연방 치안국이 생겼습니다. 그들의 관심사는 은행가들의 장부와 신문사의 편집회의입니다. 롱은 이들이 부자들만 감시한다고 말합니다."
 LR_LNG_american_market:0 "아메리카 경제권"
 LR_LNG_american_market_desc:0 "누에바 에스파냐와 카리브의 공국들은 미국 상품 없이는 버티지 못합니다. 롱은 그들에게 무역 협정과 차관을 내밀었습니다. 조건은 하나, 미국의 친구가 되는 것입니다."
 LR_LNG_highway_south:0 "남쪽으로 뻗는 고속도로"
 LR_LNG_highway_south_desc:0 "멕시코시티의 부왕은 롱의 협정을 거절했습니다. 고속도로 공병대보다 군대가 먼저 리오그란데를 건넙니다. 롱은 이 전쟁이 부왕과 크리올로 귀족만을 겨냥한다고 방송합니다."
 LR_LNG_caribbean_highway:0 "카리브 고속도로"
 LR_LNG_caribbean_highway_desc:0 "쿠바와 과테말라의 공국들은 롱의 무역 협정을 받아들였다가, 부왕이 무너지자 곧바로 영국 상선을 다시 불러들였습니다. 롱은 플로리다 키웨스트에서 아바나까지 다리를 놓겠다고 방송했습니다. 다리보다 상륙함이 먼저 갑니다."
 LR_LNG_kings_nation:0 "모든 사람이 왕인 나라"
 LR_LNG_kings_nation_desc:0 "가난한 집 아들이 대통령이 된 나라, 모든 가정에 자동차가 있는 나라. 롱은 약속을 지켰다고 말합니다. 반대한 사람들이 그 약속의 값을 어떻게 치렀는지는 일요일 방송에 나오지 않습니다."
 LR_LNG_dev_economy:0 "부의 공유 경제"
 LR_LNG_dev_economy_desc:0 "롱은 연설할 때마다 모든 사람이 왕이 될 수 있다고 외쳤고, 사람들은 그 말을 믿고 그를 따랐습니다. 이제 그 약속을 지킬 차례가 왔는데, 나누어 줄 부를 만들려면 먼저 공장이 돌아가야 합니다."
 LR_LNG_dev_machine_tools:0 "공작기계 표준화"
 LR_LNG_dev_machine_tools_desc:0 "공장마다 다른 규격의 나사와 볼트를 쓰는 바람에, 한 공장에서 만든 부품이 다른 공장의 기계에 맞지 않는 일이 흔합니다. 규격을 하나로 맞추는 데는 여섯 달이 걸리지만, 그 뒤로는 어느 공장에서 만든 부품이든 전선의 어느 기계에나 들어갑니다."
 LR_LNG_dev_power_grid:0 "전국 송전망"
 LR_LNG_dev_power_grid_desc:0 "강가의 수력 발전소에서 만든 전기가 도시 하나를 넘어가지 못하고 버려지고 있습니다. 송전탑을 이어 발전소와 공업 지대를 하나의 망으로 묶으면, 밤에도 불을 끄지 않는 공장을 세울 수 있습니다."
 LR_LNG_dev_synthetic_fuel:0 "합성 연료 공장"
 LR_LNG_dev_synthetic_fuel_desc:0 "석유는 남쪽 유전에서 나오고, 그 유전으로 가는 철도는 전쟁이 나면 가장 먼저 끊깁니다. 화학자들은 석탄에서 휘발유를 뽑아내는 공정을 보여 주며, 값은 비싸도 적이 끊을 수 없는 연료라는 점을 강조합니다."
 LR_LNG_dev_war_production:0 "민수에서 군수로"
 LR_LNG_dev_war_production_desc:0 "자동차 공장의 조립 라인은 하루면 트럭 공장이 되고, 한 달이면 전차 공장이 됩니다. 정부는 공장주들에게 전쟁이 끝나면 라인을 돌려주겠다고 약속하고, 그 약속을 문서로 남겨 달라는 요구에 순순히 서명합니다."
 LR_LNG_dev_army:0 "프레리 방위군"
 LR_LNG_dev_army_desc:0 "중서부의 주 방위군은 롱이 주지사들과 손잡던 날부터 그의 군대가 되었습니다. 트럭에 기관총을 얹고 평원을 달리던 그 부대들에 제대로 된 편제와 계급을 주는 일이 남아 있습니다."
 LR_LNG_dev_rifles:0 "보병 화기 개량"
 LR_LNG_dev_rifles_desc:0 "병사들이 들고 있는 소총은 대전쟁 때 만든 것이고, 그 가운데 상당수는 그때 쓰던 것을 그대로 물려받은 것입니다. 병기국은 반자동 소총과 경기관총의 시험 사격을 끝내고 생산 계약을 맺습니다."
 LR_LNG_dev_artillery:0 "야포 표준화"
 LR_LNG_dev_artillery_desc:0 "포병대가 쓰는 대포의 구경만 일곱 가지라 탄약 보급이 늘 엉킵니다. 참모부는 구경을 세 가지로 줄이고, 그 세 가지를 트럭으로 끌 수 있는 포가로 바꾸기로 합니다."
 LR_LNG_dev_tanks:0 "기갑 부대"
 LR_LNG_dev_tanks_desc:0 "대전쟁의 전차는 참호를 넘는 기계였지만, 지금 유럽에서 만드는 전차는 참호 뒤까지 달려가는 기계입니다. 기병 장교 몇이 말을 내리고 시험용 전차 중대를 맡겠다고 자원합니다."
 LR_LNG_dev_mobile_doctrine:0 "기동전 교리"
 LR_LNG_dev_mobile_doctrine_desc:0 "이 대륙은 유럽보다 훨씬 넓고, 넓은 땅에서는 먼저 도착하는 쪽이 이깁니다. 참모 대학의 교관들은 보병을 트럭에 태우고 전차와 함께 움직이는 훈련을 교과 과정에 넣습니다."
 LR_LNG_dev_navy:0 "미시시피 함대"
 LR_LNG_dev_navy_desc:0 "중서부에는 바다가 없지만 강은 있습니다. 미시시피와 오하이오를 오르내리는 바지선과 증기선에 포를 달면 강 연안의 도시들을 지킬 수 있고, 멕시코만으로 나가는 길도 열 수 있습니다."
 LR_LNG_dev_destroyers:0 "구축함 계획"
 LR_LNG_dev_destroyers_desc:0 "상선을 지키는 데는 전함보다 구축함이 쓸모 있습니다. 해군은 같은 설계로 구축함을 여러 척 한꺼번에 찍어 내는 계획을 세우고, 조선소마다 같은 도면을 보냅니다."
 LR_LNG_dev_submarines:0 "잠수함대"
 LR_LNG_dev_submarines_desc:0 "적의 함대가 더 크다면 그 함대가 지키는 상선을 노리면 됩니다. 잠수함 승조원 학교가 문을 열고, 첫 기수의 절반은 상선 선원 출신으로 채워집니다."
 LR_LNG_dev_capital_ships:0 "주력함 건조"
 LR_LNG_dev_capital_ships_desc:0 "바다를 지배하는 것은 여전히 큰 함포를 단 배라고 제독들은 믿습니다. 의회는 오랜 논쟁 끝에 주력함 건조 예산을 통과시키고, 가장 큰 선거에서 용골을 놓는 기공식이 열립니다."
 LR_LNG_dev_fleet_doctrine:0 "해군 교리"
 LR_LNG_dev_fleet_doctrine_desc:0 "배를 만드는 것보다 그 배들을 함께 움직이는 법을 익히는 데 더 오래 걸립니다. 해군 대학은 해마다 대규모 기동 연습을 열고, 그 결과를 바탕으로 함대 교범을 새로 씁니다."
 LR_LNG_dev_air:0 "킹피시 항공대"
 LR_LNG_dev_air_desc:0 "롱은 비행기를 타고 유세를 다니길 즐겼습니다. 유세용 비행기를 몰던 조종사들이 이제 군복을 입고, 롱의 별명을 딴 항공대가 캔자스의 밀밭 한가운데에 비행장을 닦습니다."
 LR_LNG_dev_fighters:0 "전투기 개발"
 LR_LNG_dev_fighters_desc:0 "복엽기의 시대는 끝났습니다. 설계국은 금속 동체에 접이식 바퀴를 단 단엽 전투기의 시제기를 내놓고, 시험 비행에서 시속 사백 킬로미터를 넘깁니다."
 LR_LNG_dev_bombers:0 "폭격기 개발"
 LR_LNG_dev_bombers_desc:0 "전선 너머의 철도와 다리를 부술 수 있다면 적의 군대는 굶습니다. 항공대는 쌍발 폭격기의 설계 공모를 열고, 세 회사가 시제기를 내놓습니다."
 LR_LNG_dev_aircraft_plants:0 "항공기 공장"
 LR_LNG_dev_aircraft_plants_desc:0 "비행기 한 대를 만드는 데 걸리는 시간을 줄이려면 자동차처럼 조립 라인에서 만들어야 합니다. 정부는 자동차 회사들에 항공기 생산을 맡기고, 공장 옆에 비행장을 붙여 짓게 합니다."
 LR_LNG_dev_air_doctrine:0 "공군 교리"
 LR_LNG_dev_air_doctrine_desc:0 "비행기를 육군과 해군의 보조로 둘 것인지, 따로 싸우는 군대로 만들 것인지를 두고 오랜 논쟁이 이어졌습니다. 항공대 장교들은 마침내 자기들만의 교범을 손에 넣고, 그 교범의 첫 장은 제공권을 다룹니다."
 LR_DXE_confederacy:0 "남부 연합 선언"
 LR_DXE_confederacy_desc:0 "애틀랜타의 조지아 주 의사당에서 남부 여섯 개 주의 대표가 연방 탈퇴를 선언했습니다. 의장은 미시시피의 시어도어 빌보입니다. 그들은 각 주의 권리가 필라델피아의 어떤 군인보다도 앞선다고 선언했습니다."
 LR_DXE_grey_army:0 "회색 군대"
 LR_DXE_grey_army_desc:0 "남부의 주 방위군이 회색 군복을 입었습니다. 장교는 대부분 농장주 가문의 아들이고, 병사는 대부분 소작농입니다. 둘은 북부 사람을 싫어한다는 점에서만 같습니다."
 LR_DXE_cotton_bonds:0 "면화 담보 공채"
 LR_DXE_cotton_bonds_desc:0 "남부 연합에게는 공장보다 면화가 많습니다. 리버풀과 맨체스터의 상인들은 면화를 담보로 돈을 빌려줄 준비가 되어 있습니다. 런던은 이 거래를 막지 않았습니다."
 LR_DXE_defend_atlanta:0 "애틀랜타 방어"
 LR_DXE_defend_atlanta_desc:0 "애틀랜타는 남부 철도의 교차점입니다. 이곳을 잃으면 남부 연합은 둘로 갈라집니다. 빌보는 도시 둘레에 참호를 파라고 명령했고, 흑인 노동자 만 이천 명이 강제로 동원되었습니다."
 LR_DXE_march_north:0 "북진"
 LR_DXE_march_north_desc:0 "리치먼드는 남부의 오래된 도시이고, 지금은 맥아더의 땅입니다. 남부 연합군은 버지니아를 되찾아 남부의 모든 주를 하나로 묶으려 합니다. 그다음은 메릴랜드, 그다음은 필라델피아입니다."
 LR_DXE_csa:0 "아메리고 연합국"
 LR_DXE_csa_desc:0 "내전에서 살아남은 남부의 대표들이 새 나라의 이름을 정했습니다. 아메리고 연합국. 수도는 애틀랜타이고, 국기에는 별 열세 개가 대각선으로 놓였습니다. 북부의 공장 도시들은 이제 남부의 점령지입니다."
 LR_DXE_constitution:0 "연합 헌법"
 LR_DXE_constitution_desc:0 "연합 헌법은 각 주의 권리를 연방보다 앞에 둡니다. 투표권은 재산과 문해력 시험을 통과한 사람에게만 주어집니다. 농장주들은 이 헌법이 질서를 지킨다고 말하고, 시험관은 모두 농장주가 임명합니다."
 LR_DXE_king_cotton:0 "면화 왕"
 LR_DXE_king_cotton_desc:0 "남부의 부는 면화에서 나옵니다. 연합국 정부는 면화 수출을 국가가 관리해 가격을 끌어올립니다. 맨체스터의 방적 공장들은 불평하면서도 값을 치릅니다."
 LR_DXE_planter_senate:0 "농장주 원로원"
 LR_DXE_planter_senate_desc:0 "원로원 의원은 각 주 의회가 뽑고, 각 주 의회는 땅을 가진 사람들이 뽑습니다. 그러니 원로원은 땅의 목소리라고 빌보는 말합니다. 땅이 없는 사람들의 목소리에 대해서는 말하지 않았습니다."
 LR_DXE_northern_factories:0 "북부 공장 접수"
 LR_DXE_northern_factories_desc:0 "피츠버그와 디트로이트의 공장들이 연합국의 전리품이 되었습니다. 북부 노동자들은 남부 출신 감독관 아래에서 일합니다. 파업은 반역으로 다뤄집니다."
 LR_DXE_golden_circle:0 "황금의 원"
 LR_DXE_golden_circle_desc:0 "아바나를 중심으로 원을 그리면 쿠바와 멕시코, 중미, 카리브가 그 안에 들어옵니다. 1850년대 남부 농장주들이 꾸던 오래된 꿈입니다. 연합국은 그 원 안의 모든 땅을 요구합니다."
 LR_DXE_havana:0 "아바나 원정"
 LR_DXE_havana_desc:0 "쿠바 공국은 스페인 왕실의 마지막 카리브 보석입니다. 연합국 해군이 플로리다 키웨스트에서 출항합니다. 아바나의 사탕수수 농장주들은 이미 연합국과 거래를 시작했습니다."
 LR_DXE_mexico:0 "멕시코 원정"
 LR_DXE_mexico_desc:0 "누에바 에스파냐의 북부는 텍사스부터 캘리포니아까지 이어집니다. 농장주들은 그 땅에 면화를 심을 수 있다고 계산했습니다. 회색 군대가 서쪽으로 진군합니다."
 LR_DXE_british_compact:0 "영국과의 협약"
 LR_DXE_british_compact_desc:0 "연합국을 가장 먼저 승인한 나라는 영국이었습니다. 연합국에는 면화가, 영국에는 해군이 있습니다. 빌보는 런던과 상호방위조약을 맺습니다. 160년 전의 적이 지금의 친구가 되었습니다."
 LR_DXE_caribbean_empire:0 "카리브 제국"
 LR_DXE_caribbean_empire_desc:0 "멕시코만은 이제 연합국의 호수입니다. 아바나와 베라크루스, 뉴올리언스의 항구가 같은 깃발 아래 있습니다. 빌보는 다음 목표로 남미를 지목했습니다. 장군들은 아직 지도를 펴지 않았습니다."
 LR_DXE_south_america:0 "남미 원정"
 LR_DXE_south_america_desc:0 "빌보는 멕시코만 너머 누에바 그라나다와 베네수엘라의 땅을 지목했습니다. 커피와 석유, 그리고 값싼 일손이 있는 땅입니다. 연합국 해군이 카리브해를 건너 카르타헤나 앞바다에 닻을 내립니다."
 LR_DXE_dev_economy:0 "목화 전시 경제"
 LR_DXE_dev_economy_desc:0 "남부의 부는 늘 목화에서 나왔고, 목화는 늘 바다 건너로 팔려 나갔습니다. 전쟁으로 그 길이 막히자 농장주 의회는 처음으로 목화밭 옆에 공장을 세우는 법안을 통과시킵니다."
 LR_DXE_dev_machine_tools:0 "공작기계 표준화"
 LR_DXE_dev_machine_tools_desc:0 "공장마다 다른 규격의 나사와 볼트를 쓰는 바람에, 한 공장에서 만든 부품이 다른 공장의 기계에 맞지 않는 일이 흔합니다. 규격을 하나로 맞추는 데는 여섯 달이 걸리지만, 그 뒤로는 어느 공장에서 만든 부품이든 전선의 어느 기계에나 들어갑니다."
 LR_DXE_dev_power_grid:0 "전국 송전망"
 LR_DXE_dev_power_grid_desc:0 "강가의 수력 발전소에서 만든 전기가 도시 하나를 넘어가지 못하고 버려지고 있습니다. 송전탑을 이어 발전소와 공업 지대를 하나의 망으로 묶으면, 밤에도 불을 끄지 않는 공장을 세울 수 있습니다."
 LR_DXE_dev_synthetic_fuel:0 "합성 연료 공장"
 LR_DXE_dev_synthetic_fuel_desc:0 "석유는 남쪽 유전에서 나오고, 그 유전으로 가는 철도는 전쟁이 나면 가장 먼저 끊깁니다. 화학자들은 석탄에서 휘발유를 뽑아내는 공정을 보여 주며, 값은 비싸도 적이 끊을 수 없는 연료라는 점을 강조합니다."
 LR_DXE_dev_war_production:0 "민수에서 군수로"
 LR_DXE_dev_war_production_desc:0 "자동차 공장의 조립 라인은 하루면 트럭 공장이 되고, 한 달이면 전차 공장이 됩니다. 정부는 공장주들에게 전쟁이 끝나면 라인을 돌려주겠다고 약속하고, 그 약속을 문서로 남겨 달라는 요구에 순순히 서명합니다."
 LR_DXE_dev_army:0 "남부 회색군"
 LR_DXE_dev_army_desc:0 "남부의 청년들은 할아버지들이 입었던 회색 군복을 다시 꺼내 입었습니다. 그러나 할아버지들의 전쟁은 머스킷 총으로 치렀고, 이번 전쟁에서 이기려면 그 군복 아래의 모든 것을 바꿔야 합니다."
 LR_DXE_dev_rifles:0 "보병 화기 개량"
 LR_DXE_dev_rifles_desc:0 "병사들이 들고 있는 소총은 대전쟁 때 만든 것이고, 그 가운데 상당수는 그때 쓰던 것을 그대로 물려받은 것입니다. 병기국은 반자동 소총과 경기관총의 시험 사격을 끝내고 생산 계약을 맺습니다."
 LR_DXE_dev_artillery:0 "야포 표준화"
 LR_DXE_dev_artillery_desc:0 "포병대가 쓰는 대포의 구경만 일곱 가지라 탄약 보급이 늘 엉킵니다. 참모부는 구경을 세 가지로 줄이고, 그 세 가지를 트럭으로 끌 수 있는 포가로 바꾸기로 합니다."
 LR_DXE_dev_tanks:0 "기갑 부대"
 LR_DXE_dev_tanks_desc:0 "대전쟁의 전차는 참호를 넘는 기계였지만, 지금 유럽에서 만드는 전차는 참호 뒤까지 달려가는 기계입니다. 기병 장교 몇이 말을 내리고 시험용 전차 중대를 맡겠다고 자원합니다."
 LR_DXE_dev_mobile_doctrine:0 "기동전 교리"
 LR_DXE_dev_mobile_doctrine_desc:0 "이 대륙은 유럽보다 훨씬 넓고, 넓은 땅에서는 먼저 도착하는 쪽이 이깁니다. 참모 대학의 교관들은 보병을 트럭에 태우고 전차와 함께 움직이는 훈련을 교과 과정에 넣습니다."
 LR_DXE_dev_navy:0 "만 연안 함대"
 LR_DXE_dev_navy_desc:0 "모빌과 뉴올리언스, 갤버스턴의 항구는 남부가 바다로 나가는 문입니다. 의회는 그 문을 지킬 함대를 꾸리기로 하고, 멕시코만의 어선과 화물선을 징발해 첫 전대를 만듭니다."
 LR_DXE_dev_destroyers:0 "구축함 계획"
 LR_DXE_dev_destroyers_desc:0 "상선을 지키는 데는 전함보다 구축함이 쓸모 있습니다. 해군은 같은 설계로 구축함을 여러 척 한꺼번에 찍어 내는 계획을 세우고, 조선소마다 같은 도면을 보냅니다."
 LR_DXE_dev_submarines:0 "잠수함대"
 LR_DXE_dev_submarines_desc:0 "적의 함대가 더 크다면 그 함대가 지키는 상선을 노리면 됩니다. 잠수함 승조원 학교가 문을 열고, 첫 기수의 절반은 상선 선원 출신으로 채워집니다."
 LR_DXE_dev_capital_ships:0 "주력함 건조"
 LR_DXE_dev_capital_ships_desc:0 "바다를 지배하는 것은 여전히 큰 함포를 단 배라고 제독들은 믿습니다. 의회는 오랜 논쟁 끝에 주력함 건조 예산을 통과시키고, 가장 큰 선거에서 용골을 놓는 기공식이 열립니다."
 LR_DXE_dev_fleet_doctrine:0 "해군 교리"
 LR_DXE_dev_fleet_doctrine_desc:0 "배를 만드는 것보다 그 배들을 함께 움직이는 법을 익히는 데 더 오래 걸립니다. 해군 대학은 해마다 대규모 기동 연습을 열고, 그 결과를 바탕으로 함대 교범을 새로 씁니다."
 LR_DXE_dev_air:0 "남부 항공대"
 LR_DXE_dev_air_desc:0 "앨라배마와 조지아의 넓은 들판은 비행장을 닦기에 좋은 땅입니다. 대전쟁에서 프랑스 하늘을 날았던 남부 출신 조종사들이 고향으로 돌아와 후배들을 가르치기 시작합니다."
 LR_DXE_dev_fighters:0 "전투기 개발"
 LR_DXE_dev_fighters_desc:0 "복엽기의 시대는 끝났습니다. 설계국은 금속 동체에 접이식 바퀴를 단 단엽 전투기의 시제기를 내놓고, 시험 비행에서 시속 사백 킬로미터를 넘깁니다."
 LR_DXE_dev_bombers:0 "폭격기 개발"
 LR_DXE_dev_bombers_desc:0 "전선 너머의 철도와 다리를 부술 수 있다면 적의 군대는 굶습니다. 항공대는 쌍발 폭격기의 설계 공모를 열고, 세 회사가 시제기를 내놓습니다."
 LR_DXE_dev_aircraft_plants:0 "항공기 공장"
 LR_DXE_dev_aircraft_plants_desc:0 "비행기 한 대를 만드는 데 걸리는 시간을 줄이려면 자동차처럼 조립 라인에서 만들어야 합니다. 정부는 자동차 회사들에 항공기 생산을 맡기고, 공장 옆에 비행장을 붙여 짓게 합니다."
 LR_DXE_dev_air_doctrine:0 "공군 교리"
 LR_DXE_dev_air_doctrine_desc:0 "비행기를 육군과 해군의 보조로 둘 것인지, 따로 싸우는 군대로 만들 것인지를 두고 오랜 논쟁이 이어졌습니다. 항공대 장교들은 마침내 자기들만의 교범을 손에 넣고, 그 교범의 첫 장은 제공권을 다룹니다."
 LR_usa_coercive:0 "강압법"
 LR_usa_coercive_desc:0 "집회와 신문을 묶어 두었습니다. 거리는 조용해졌지만, 조용한 거리가 안전한 거리라고 믿는 관리는 많지 않습니다."
 LR_usa_conciliation:0 "유화 칙령"
 LR_usa_conciliation_desc:0 "식민지 의회가 예산을 다시 심의하고, 식민지 출신 장교도 대령이 될 수 있습니다. 런던의 귀족 몇은 이것을 굴복이라고 부릅니다."
 LR_usa_loyalist_militia:0 "충성파 민병대"
 LR_usa_loyalist_militia_desc:0 "런던을 조국으로 여기는 가문의 아들들이 총을 들었습니다. 그들은 이웃의 얼굴을 알고, 이웃도 그들의 얼굴을 압니다."
 LR_usa_crown_offensive:0 "총독부의 공세"
 LR_usa_crown_offensive_desc:0 "총독부군이 본국의 증원을 기다리지 않고 먼저 움직입니다."
 LR_usa_hudson_line:0 "허드슨 강 방어선"
 LR_usa_hudson_line_desc:0 "허드슨 강변의 진지가 뉴잉글랜드와 남부의 반란군을 갈라놓습니다."
 LR_usa_blockaded:0 "해상 봉쇄"
 LR_usa_blockaded_desc:0 "영국 대서양 함대가 항구를 막았습니다. 바다 건너에서 오는 것은 아무것도 없습니다."
 LR_usa_crown_loyalty:0 "제국에 대한 충성"
 LR_usa_crown_loyalty_desc:0 "반란을 진압한 총독부는 제국의 가장 충실한 자치령임을 증명했습니다."
 LR_usa_empire_partner:0 "제국의 동반자"
 LR_usa_empire_partner_desc:0 "북아메리카는 제국연맹 이사회에 상임 의석을 가졌습니다. 뉴욕의 목소리가 런던에서도 들립니다."
 LR_usa_viceroyalty:0 "멕시코 총독령"
 LR_usa_viceroyalty_desc:0 "멕시코시티의 부왕궁에 유니언잭이 올랐습니다. 크리올로 귀족들은 새 주인에게 충성을 맹세했습니다."
 LR_usa_heart_of_empire:0 "제국의 심장"
 LR_usa_heart_of_empire_desc:0 "북아메리카는 본국보다 크고, 본국보다 부유하며, 본국보다 많은 병사를 냅니다."
 LR_usa_angry_colonies:0 "분노한 식민지"
 LR_usa_angry_colonies_desc:0 "강압법은 1774년처럼 반란의 불을 더 크게 키웠습니다."
 LR_usa_hesitant_colonies:0 "망설이는 식민지"
 LR_usa_hesitant_colonies_desc:0 "총독부의 유화 칙령 이후, 많은 식민지인이 아직 총을 들 때가 아니라고 생각합니다."
 LR_usa_exposed_cells:0 "드러난 조직"
 LR_usa_exposed_cells_desc:0 "총독부 정보국이 대륙 회의의 비밀 조직 여럿을 봉기 전에 찾아냈습니다."
 LR_usa_hold_philadelphia:0 "필라델피아 사수"
 LR_usa_hold_philadelphia_desc:0 "수도가 떠나면 혁명도 떠납니다. 대륙군은 필라델피아에서 물러서지 않습니다."
 LR_usa_march_north:0 "북부 진격"
 LR_usa_march_north_desc:0 "대륙군이 허드슨 강 계곡을 따라 뉴욕으로 올라갑니다."
 LR_usa_young_republic:0 "젊은 공화국"
 LR_usa_young_republic_desc:0 "공화국은 이제 막 걸음마를 뗐습니다. 모든 것이 처음이고, 모든 사람이 무언가를 기대합니다."
 LR_usa_bill_of_rights:0 "권리장전"
 LR_usa_bill_of_rights_desc:0 "언론과 집회와 종교의 자유가 헌법에 적혔습니다."
 LR_usa_monroe:0 "먼로 선언"
 LR_usa_monroe_desc:0 "아메리카 대륙은 더 이상 유럽 왕들의 사냥터가 아닙니다."
 LR_usa_liberty_continent:0 "자유의 대륙"
 LR_usa_liberty_continent_desc:0 "북극해에서 리오그란데까지, 대륙의 대부분이 한 공화국의 헌법 아래 있습니다."
 LR_usa_burning_streets:0 "불타는 거리"
 LR_usa_burning_streets_desc:0 "대통령이 죽은 뒤, 도시마다 시위와 폭동이 끊이지 않습니다. 사람들은 누가 대통령을 죽였는지를 두고 서로 멱살을 잡습니다."
 LR_usa_british_embargo:0 "영국의 금수"
 LR_usa_british_embargo_desc:0 "영국 귀족 의회가 파운드 결제를 막고 미국 상품에 4할의 관세를 매겼습니다. 공장의 삼분의 일이 멈출 판입니다."
 LR_usa_embargo_eased:0 "금수의 그늘"
 LR_usa_embargo_eased_desc:0 "새 지폐로 급한 불은 껐지만, 영국과의 교역은 아직 막혀 있습니다."
 LR_usa_red_agitation:0 "붉은 선동"
 LR_usa_red_agitation_desc:0 "문 닫은 공장 앞에서 붉은 깃발이 오릅니다. 노동자들은 공장이 일하는 사람의 것이라고 외칩니다."
 LR_usa_martial_law:0 "계엄령"
 LR_usa_martial_law_desc:0 "군이 도시를 순찰합니다. 거리는 조용해졌고, 군의 목소리는 커졌습니다."
 LR_usa_brothers_war:0 "형제의 전쟁"
 LR_usa_brothers_war_desc:0 "대륙군의 장교들이 출신 주에 따라 갈라져 서로에게 총을 겨눕니다."
 LR_usa_order_remnant:0 "남은 질서"
 LR_usa_order_remnant_desc:0 "공화국이 무너지기 전까지 질서를 지킨 덕에 필라델피아의 군대는 흩어지지 않고 내전을 맞았습니다."
 LR_usa_appalachian_front:0 "애팔래치아 전선"
 LR_usa_appalachian_front_desc:0 "애팔래치아 산맥이 필라델피아의 첫 방벽입니다."
 LR_usa_final_offensive:0 "최후의 공세"
 LR_usa_final_offensive_desc:0 "모든 전선에서 동시에 공세가 시작되었습니다."
 LR_usa_red_offensive:0 "평의회군의 남진"
 LR_usa_red_offensive_desc:0 "평의회군이 오하이오 강을 건너 남쪽으로 내려갑니다."
 LR_usa_prairie_offensive:0 "미시시피 공세"
 LR_usa_prairie_offensive_desc:0 "롱의 군대가 미시시피 강을 따라 내려갑니다."
 LR_usa_atlanta_line:0 "애틀랜타 참호선"
 LR_usa_atlanta_line_desc:0 "남부 철도의 교차점을 지키는 참호가 도시를 둘러쌌습니다."
 LR_usa_grey_offensive:0 "회색 군대의 북진"
 LR_usa_grey_offensive_desc:0 "남부 연합군이 버지니아를 향해 북진합니다."
 LR_usa_peerage:0 "제국 귀족원"
 LR_usa_peerage_desc:0 "내전의 공신들이 작위를 받았습니다. 귀족원은 황제의 법안을 거부하지 않습니다."
 LR_usa_imperial_army:0 "제국 육군"
 LR_usa_imperial_army_desc:0 "황제가 직접 쓴 교범을 외운 장교들이 제국 육군을 이끕니다."
 LR_usa_amerigo_millennium:0 "아메리고 천년"
 LR_usa_amerigo_millennium_desc:0 "신대륙의 주인이 된 제국은 천 년을 이어 가겠다고 선언했습니다."
 LR_usa_soviet_power:0 "평의회 권력"
 LR_usa_soviet_power_desc:0 "공장과 마을의 평의회가 연방을 떠받칩니다."
 LR_usa_five_year_plan:0 "제1차 5개년 계획"
 LR_usa_five_year_plan_desc:0 "계획 위원회는 다섯 해 안에 강철 생산을 세 배로 늘리겠다고 약속했습니다."
 LR_usa_world_revolution:0 "세계 혁명"
 LR_usa_world_revolution_desc:0 "혁명은 이제 두 대륙의 일입니다."
 LR_usa_share_our_wealth:0 "부의 공유"
 LR_usa_share_our_wealth_desc:0 "백만 달러를 넘는 소득은 세금으로 걷히고, 모든 가구가 정착금을 받습니다."
 LR_usa_highways:0 "국민 고속도로"
 LR_usa_highways_desc:0 "실업자 이백만 명이 대륙을 잇는 도로를 닦습니다."
 LR_usa_kings_nation:0 "모든 사람이 왕인 나라"
 LR_usa_kings_nation_desc:0 "가난한 집 아들이 대통령이 되었고, 모든 가정에 자동차가 있습니다. 반대하는 목소리는 일요일 방송에 나오지 않습니다."
 LR_usa_king_cotton:0 "면화 왕"
 LR_usa_king_cotton_desc:0 "연합국 정부가 면화 수출을 관리해 가격을 끌어올립니다."
 LR_usa_golden_circle:0 "황금의 원"
 LR_usa_golden_circle_desc:0 "아바나를 중심으로 한 원 안의 모든 땅이 연합국의 것이어야 합니다."
 LR_usa_caribbean_empire:0 "카리브 제국"
 LR_usa_caribbean_empire_desc:0 "멕시코만은 연합국의 호수가 되었습니다."
 LR_USA_hoover:0 "허버트 후버"
 LR_CNA_hull:0 "코델 헐"
 LR_CNA_macarthur:0 "더글러스 맥아더"
 LR_tt_usa_coercive:0 "대륙군이 봉기하면 대륙 회의가 1년 동안 §R분노한 식민지§!를 얻습니다."
 LR_tt_usa_conciliation:0 "대륙군이 봉기하면 대륙 회의가 1년 동안 §G망설이는 식민지§!를 얻습니다."
 LR_tt_usa_intel:0 "대륙군이 봉기하면 대륙 회의가 180일 동안 §G드러난 조직§!을 얻습니다."
 LR_tt_usa_join_league:0 "영국이 진영을 이끌고 있으면 그 진영에 들어갑니다."
 LR_tt_usa_expedition:0 "영국과 전쟁 중인 모든 나라에 선전포고합니다."
 LR_tt_usa_mexico_gone:0 "누에바 에스파냐 왕국이 사라졌다"
 LR_tt_usa_union_bill:0 "영국 귀족 의회가 북아메리카 통합 법안을 심의합니다. 승인되면 §Y캐나다§!를 합병합니다."
 LR_tt_usa_canada_joined:0 "캐나다와 통합했다"
 LR_tt_usa_secret_service:0 "독립기념일 암살 시도가 성공할 확률이 §G절반§!으로 줄어듭니다."
 LR_tt_usa_july_fourth:0 "워싱턴이 독립기념일 연설을 합니다. §R그날 무슨 일이 일어날지는 아무도 모릅니다.§!"
 LR_tt_usa_promise_1778:0 "진영을 만듭니다. 프랑스가 의회정이나 프롤레타리아 독재정이고 진영이 없으면 진영에 들어옵니다."
 LR_tt_usa_emergency_currency:0 "§R영국의 금수§!가 §Y금수의 그늘§!로 약해집니다."
 LR_tt_usa_lean_on_army:0 "§R맥아더 장군이 권력을 잡습니다.§!"
 LR_tt_usa_russian_brothers:0 "진영을 만들고, 진영이 없는 러시아 공화국을 들입니다."
 LR_tt_usa_british_compact:0 "영국이 이끄는 진영에 들어갑니다."
 LR_tt_usa_play_cna:0 "§Y대륙 회의§!로 플레이합니다."
 LR_tt_usa_play_amc:0 "§Y미주 노동자 평의회§!로 플레이합니다."
 LR_tt_usa_play_lng:0 "§Y아메리카 국민 연합§!으로 플레이합니다."
 LR_tt_usa_play_dxe:0 "§Y남부 연합§!으로 플레이합니다."
 LR_tt_usa_peace:0 "영국과 백색 평화를 맺습니다."
 LR_tt_usa_canada_march:0 "전쟁을 계속합니다. §Y캐나다§!가 항복하면 합병하고 영국과 강화합니다."
 LR_tt_usa_civil_war:0 "§R미국이 넷으로 갈라집니다.§! 필라델피아의 위원회, 시카고의 평의회, 캔자스시티의 롱, 애틀랜타의 남부 연합이 서로 전쟁을 벌입니다."
 LR_tt_usa_british_return:0 "북아메리카 내전의 네 진영 모두에 선전포고합니다."
 LR_tt_usa_canada_gone:0 "캐나다 자치령이 사라졌다"
 LR_tt_usa_cores_north:0 "북아메리카에서 가진 모든 주를 중심지로 삼습니다."
 LR_tt_usa_annex_americas:0 "이제부터 아메리카 대륙의 나라가 우리나 우리 동맹에게 항복하면 강화 회의 없이 §Y합병§!합니다."
 LR_tt_usa_cores_americas:0 "아메리카 대륙에서 가진 모든 주를 중심지로 삼습니다."
 LR_fac_usa_liberty:0 "자유 동맹"
 LR_fac_usa_revolution:0 "혁명 연대"
 LR_usa_cat_loyalty:0 "총독부 통치"
 LR_usa_cat_loyalty_desc:0 "뉴욕 총독부는 식민지인의 마음을 붙잡아야 합니다. 충성도가 높으면 나라가 안정되고, 낮으면 반란의 불씨가 커집니다. 대륙군이 봉기할 때 충성도가 65 이상이면 봉기에 가담하는 사람이 줄어듭니다.\n\n§Y식민지 충성도§!: [?ROOT.LR_usa_loyalty|0] / 100 (매달 1씩 떨어집니다)"
 LR_usa_mg_loyalty:0 "식민지 충성도"
 LR_usa_dec_loyalty_banquet:0 "충성파 연회"
 LR_usa_dec_loyalty_banquet_desc:0 "뉴욕과 찰스턴의 충성파 가문을 총독 관저 만찬에 초대합니다. 그들의 아들들이 다음 주 민병대에 자원합니다."
 LR_usa_dec_loyalty_arrests:0 "용의자 검거"
 LR_usa_dec_loyalty_arrests_desc:0 "필라델피아와 보스턴의 비밀 회합 장소를 급습합니다. 잡혀 오는 사람보다 숨어드는 사람이 많다는 보고도 있습니다."
 LR_usa_dec_loyalty_assembly:0 "식민지 의회와의 타협"
 LR_usa_dec_loyalty_assembly_desc:0 "식민지 의회 예산안의 몇 줄을 받아들입니다. 런던은 불평하겠지만, 의원들은 오랜만에 총독에게 박수를 쳤습니다."
 LR_usa_dec_loyalty_charter:0 "공장 허가 발급"
 LR_usa_dec_loyalty_charter_desc:0 "런던의 허가를 기다리던 공장 계획 하나를 총독 권한으로 승인합니다. 공장주들이 총독부를 다시 보기 시작합니다."
 LR_usa_cat_union:0 "연방 정부"
 LR_usa_cat_union_desc:0 "열세 주와 서부 영토는 아직 하나의 나라라기보다 느슨한 동맹에 가깝습니다. 결속이 높으면 연방 정부가 힘을 얻고, 낮으면 주들이 제각각 움직입니다.\n\n§Y연방의 결속§!: [?ROOT.LR_usa_union|0] / 100 (매달 1씩 떨어집니다)"
 LR_usa_mg_union:0 "연방의 결속"
 LR_usa_dec_union_governors:0 "주지사 회의"
 LR_usa_dec_union_governors_desc:0 "열세 주의 주지사를 필라델피아로 불러 연방 예산을 나눕니다. 회의는 사흘이 걸렸고, 모두가 조금씩 불만이었습니다."
 LR_usa_dec_union_public_works:0 "연방 공공사업"
 LR_usa_dec_union_public_works_desc:0 "강과 항구와 도로에 연방 예산을 붓습니다. 일자리를 얻은 사람들은 주가 아니라 연방에 고마워합니다."
 LR_usa_dec_union_homestead:0 "서부 자영농법"
 LR_usa_dec_union_homestead_desc:0 "미시시피 서쪽의 땅을 160에이커씩 나눠 줍니다. 동부의 젊은이들이 마차와 기차를 타고 서쪽으로 갑니다."
 LR_usa_dec_union_pensions:0 "대륙군 퇴역 연금"
 LR_usa_dec_union_pensions_desc:0 "독립 전쟁에서 싸운 병사들에게 연금을 줍니다. 그들은 연방의 가장 충실한 지지자가 됩니다."
 LR_usa_cat_order:0 "흔들리는 공화국"
 LR_usa_cat_order_desc:0 "대통령이 죽은 뒤 공화국은 무너지고 있습니다. 질서를 얼마나 지키느냐에 따라 다가올 내전에서 필라델피아가 쥘 힘이 달라집니다. 내전이 터질 때 질서가 50 이상이면 필라델피아의 군대가 단단하게 싸움을 시작합니다.\n\n§Y공화국의 질서§!: [?ROOT.LR_usa_order|0] / 100 (매달 2씩 떨어집니다)"
 LR_usa_mg_order:0 "공화국의 질서"
 LR_usa_dec_order_police:0 "경찰 증원"
 LR_usa_dec_order_police_desc:0 "주 방위군에서 경찰로 사람을 옮깁니다. 거리에 제복이 늘어나면 날아오는 벽돌이 조금 줄어듭니다."
 LR_usa_dec_order_relief:0 "실업 구호"
 LR_usa_dec_order_relief_desc:0 "문 닫은 공장 앞에 무료 급식소를 엽니다. 줄은 길지만, 줄을 선 사람은 돌을 던지지 않습니다."
 LR_usa_dec_order_london:0 "런던과의 협상"
 LR_usa_dec_order_london_desc:0 "재무장관이 런던에 가서 금수를 풀어 달라고 청합니다. 귀족 의회는 정중하게 들었고, 아무것도 약속하지 않았습니다."
 LR_usa_dec_order_veterans:0 "퇴역 군인 위로"
 LR_usa_dec_order_veterans_desc:0 "대륙군 퇴역 군인회 지도부를 만나 연금을 약속합니다. 그들이 노동자들과 거리에서 싸우는 일은 줄어들 것입니다."
 LR_usa_cat_army:0 "국가 재건 위원회"
 LR_usa_cat_army_desc:0 "맥아더의 권력은 군에서 나옵니다. 장교들이 그를 따르는 한 위원회는 무너지지 않습니다. 군의 충성이 높을수록 군대는 단단해지고 나라는 조용해집니다.\n\n§Y군의 충성§!: [?ROOT.LR_usa_army|0] / 100 (매달 1씩 떨어집니다)"
 LR_usa_mg_army:0 "군의 충성"
 LR_usa_dec_army_medals:0 "훈장 수여식"
 LR_usa_dec_army_medals_desc:0 "필라델피아 광장에서 내전 공훈자 이백 명에게 훈장을 겁니다. 맥아더가 직접 한 사람씩 가슴에 달아 줍니다."
 LR_usa_dec_army_purge:0 "장성 정리"
 LR_usa_dec_army_purge_desc:0 "충성이 의심스러운 장군 열한 명을 예편시킵니다. 그 자리에는 맥아더가 필리핀에서 데리고 있던 대령들이 앉습니다."
 LR_usa_dec_army_war_bonds:0 "전쟁 공채"
 LR_usa_dec_army_war_bonds_desc:0 "전쟁 공채를 찍어 병기 공장 하나를 세웁니다. 공채의 절반은 장교들이 의무적으로 샀습니다."
 LR_usa_dec_army_engineers:0 "공병단 재건 사업"
 LR_usa_dec_army_engineers_desc:0 "내전으로 끊긴 다리와 철도를 군 공병단이 다시 놓습니다. 공사장에서는 포로들이 일합니다."
 LR_usa_cat_plan:0 "계획 위원회"
 LR_usa_cat_plan_desc:0 "평의회는 공장을 손에 넣었지만, 공장을 돌리는 일은 또 다른 문제입니다. 계획 달성률이 높으면 공업이 살아나고, 낮으면 공장이 멈춥니다.\n\n§Y계획 달성률§!: [?ROOT.LR_usa_plan|0] / 100 (매달 1씩 떨어집니다)"
 LR_usa_mg_plan:0 "계획 달성률"
 LR_usa_dec_plan_shock_work:0 "돌격 노동 운동"
 LR_usa_dec_plan_shock_work_desc:0 "디트로이트 조립공 스탠리 코발스키의 작업반이 하루 할당량의 세 배를 채웠습니다. 그의 사진이 전국의 공장에 붙습니다."
 LR_usa_dec_plan_council_elections:0 "공장 평의회 선거"
 LR_usa_dec_plan_council_elections_desc:0 "공장마다 평의회 대표를 다시 뽑습니다. 투표함 옆에는 정치위원이 서 있습니다."
 LR_usa_dec_plan_heavy_industry:0 "중공업 투자"
 LR_usa_dec_plan_heavy_industry_desc:0 "계획 위원회가 새 제철소와 병기 공장에 예산을 몰아줍니다. 소비재 공장은 한 해 더 기다려야 합니다."
 LR_usa_dec_plan_integrate:0 "해방구 통합"
 LR_usa_dec_plan_integrate_desc:0 "해방된 땅에 노동자 평의회를 세우고 연방의 정식 일원으로 받아들입니다."
 LR_usa_cat_popularity:0 "킹피시의 방송"
 LR_usa_cat_popularity_desc:0 "휴이 롱의 힘은 라디오와 군중에서 나옵니다. 인기가 떨어지면 부의 공유 클럽이 흩어지고, 인기가 오르면 평원이 하나로 움직입니다.\n\n§Y킹피시의 인기§!: [?ROOT.LR_usa_popularity|0] / 100 (매달 2씩 떨어집니다)"
 LR_usa_mg_popularity:0 "킹피시의 인기"
 LR_usa_dec_popularity_sunday:0 "일요일 방송"
 LR_usa_dec_popularity_sunday_desc:0 "이번 주 일요일 저녁에도 롱이 마이크 앞에 앉습니다. 은행가와 장군과 빨갱이가 차례로 얻어맞습니다."
 LR_usa_dec_popularity_cheques:0 "정착금 지급"
 LR_usa_dec_popularity_cheques_desc:0 "이번 달 정착금 수표가 평원의 농가 삼십만 곳에 배달됩니다. 액수는 약속보다 적지만, 수표는 진짜입니다."
 LR_usa_dec_popularity_roads:0 "고속도로 착공"
 LR_usa_dec_popularity_roads_desc:0 "새 고속도로 구간의 착공식에 롱이 직접 삽을 들고 나타납니다. 공사장마다 실업자들이 줄을 섭니다."
 LR_usa_dec_popularity_crackdown:0 "반대파 단속"
 LR_usa_dec_popularity_crackdown_desc:0 "롱을 비판하던 신문사 두 곳이 세무 조사를 받습니다. 편집장들은 긴 휴가를 떠났습니다."
 LR_usa_cat_planters:0 "농장주 회의"
 LR_usa_cat_planters_desc:0 "남부 연합을 움직이는 것은 땅을 가진 가문들입니다. 그들의 지지가 높으면 정부가 힘을 얻고, 낮으면 원로원이 등을 돌립니다.\n\n§Y농장주의 지지§!: [?ROOT.LR_usa_planters|0] / 100 (매달 1씩 떨어집니다)"
 LR_usa_mg_planters:0 "농장주의 지지"
 LR_usa_dec_planters_cotton:0 "면화 수매"
 LR_usa_dec_planters_cotton_desc:0 "정부가 올해 면화를 시세보다 비싸게 사들입니다. 농장주들의 저택에서 축배가 오갑니다."
 LR_usa_dec_planters_review:0 "주 방위군 사열"
 LR_usa_dec_planters_review_desc:0 "회색 군복의 주 방위군이 애틀랜타 거리를 행진합니다. 농장주 가문의 아들들이 말을 타고 선두에 섭니다."
 LR_usa_dec_planters_railways:0 "남부 철도 부설"
 LR_usa_dec_planters_railways_desc:0 "목화밭과 항구를 잇는 철도를 새로 놓습니다. 철도 회사의 주주 명단은 원로원 의원 명단과 거의 같습니다."
 LR_usa_dec_planters_labour:0 "북부 노동자 통제"
 LR_usa_dec_planters_labour_desc:0 "점령한 북부 공장에 남부 출신 감독관을 보내 파업을 막습니다. 생산량은 그대로이고 불만은 늘었습니다."
