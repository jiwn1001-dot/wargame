l_korean:
 LR_war_support_category:0 "전시 여론 관리"
 LR_war_support_category_desc:0 "폭격과 사상자, 수송선 손실로 전쟁 지지도가 깎이는 것을 늦춥니다. 전쟁 지지도를 직접 올리지는 않습니다."
 LR_dec_ws_civil_defence:0 "민방위 동원"
 LR_dec_ws_civil_defence_desc:0 "방공호를 파고 소방대를 꾸리고, 폭격 맞은 거리를 시민이 직접 치웁니다. 180일 동안 폭격으로 깎이는 전쟁 지지도가 줄어듭니다."
 LR_dec_ws_memorial:0 "전몰자 추모식"
 LR_dec_ws_memorial_desc:0 "전사자의 이름을 하나하나 부르는 추모식을 엽니다. 슬픔이 분노가 되고, 분노가 각오가 됩니다. 180일 동안 사상자로 깎이는 전쟁 지지도가 줄어듭니다."
 LR_dec_ws_convoys:0 "선단 피해 보도 통제"
 LR_dec_ws_convoys_desc:0 "침몰한 수송선의 이름은 신문에 실리지 않습니다. 대신 무사히 도착한 선단의 사진이 1면에 실립니다. 180일 동안 수송선 손실로 깎이는 전쟁 지지도가 줄어듭니다."
