l_korean:
 LR_war_support_category:0 "전쟁 지지 회복"
 LR_war_support_category_desc:0 "폭격과 사상자로 깎인 전쟁 지지도를 되살립니다. 같은 결단은 일정 기간이 지나야 다시 쓸 수 있습니다."
 LR_dec_ws_rally:0 "애국 집회"
 LR_dec_ws_rally_desc:0 "광장에 군악대와 연사를 세웁니다. 폭격과 전사자 명단에 지친 사람들에게 이 전쟁의 이유를 다시 말합니다. 전쟁 지지도 +5%."
 LR_dec_ws_memorial:0 "전몰자 추모식"
 LR_dec_ws_memorial_desc:0 "전사자의 이름을 하나하나 부르는 추모식을 엽니다. 슬픔은 분노가 되고, 분노는 각오가 됩니다. 전쟁 지지도 +3%, 안정도 +1%."
 LR_dec_ws_civil_defence:0 "민방위 동원"
 LR_dec_ws_civil_defence_desc:0 "방공호를 파고 소방대를 꾸리고, 폭격 맞은 거리를 시민이 직접 치웁니다. 함께 버티는 사람은 쉽게 꺾이지 않습니다. 전쟁 지지도 +8%, 안정도 -2%, 인력 -5천."
 LR_dec_ws_parade:0 "군사 퍼레이드"
 LR_dec_ws_parade_desc:0 "평시의 수도에서 군대가 행진합니다. 다음 전쟁을 준비하는 나라라는 것을 국민에게 보여 줍니다. 전쟁 지지도 +4%."
