l_korean:
 lr_world.101.t:0 "스페인 내전"
 lr_world.101.d:0 "마드리드의 왕궁 앞 광장에 조기가 걸렸습니다. 후사 없이 세상을 떠난 왕의 유언은 왕가의 먼 조카를 지목했지만, 그 유언장을 믿는 사람은 스페인에 별로 없습니다.\n\n먼저 일어선 것은 북부였습니다. 한 세기 넘게 빼앗긴 왕관을 기억해 온 나바라의 산악 마을에서 붉은 베레모들이 쏟아져 내려옵니다. 신과 조국과 왕을 외치는 이들은 팜플로나를 시작으로 바스크와 아스투리아스, 갈리시아를 차례로 장악했습니다. 사흘 뒤 바르셀로나가 움직였습니다. 공장 노동자들과 시의회가 왕정 자체를 폐지한다고 선언했고, 공화파의 깃발이 아라곤과 동부 해안 전역에 걸렸습니다.\n\n마드리드의 왕당파는 수도와 남부의 대농장, 안달루시아의 연대들을 쥐고 있습니다. 부왕들에게 충성을 요구하는 전보가 대서양 너머로 날아갔지만 답장은 없습니다. 멕시코시티와 리마, 부에노스아이레스의 총독들은 전보를 읽고 서랍에 넣었습니다. 스페인 제국은 오늘 처음으로 자기 신하들의 이름을 부를 수 없게 되었습니다."
 lr_world.101.a:0 "스페인이 셋으로 쪼개졌다."
 lr_world.102.t:0 "계림 궐기: 중국 혁명"
 lr_world.102.d:0 "10월 10일 새벽, 광서 계림의 청군 탄약고가 폭발했습니다. 몇 시간 뒤 국민당의 청천백일기가 순무 아문에 걸렸고, 장제스는 황제 없는 중국을 선언했습니다. 수십 년 동안 실패만 거듭했던 혁명이었습니다. 이번에도 며칠이면 진압될 것이라고 북경의 대신들은 말했습니다.\n\n그러나 진압군은 출발하지 않았습니다. 황제의 이름으로 군대를 쥔 북양의 장군들은 전보를 받고 오래 생각한 끝에, 황제가 아니라 자기 군대를 택했습니다. 직예의 우페이푸가 가장 먼저 독립을 통보했고, 봉천의 장쉐량, 산둥의 장쭝창, 남경의 쑨촨팡, 안휘의 돤치루이가 잇달아 전보를 보냈습니다. 산서와 광서, 운남, 귀주, 사천의 군벌들은 답장조차 하지 않았습니다. 서북의 마씨 세 집안은 영하와 감숙, 청해로 갈라섰고, 내몽골의 왕공들은 말을 타고 떠났으며, 신장과 티베트와 몽골은 조용히 문을 닫았습니다.\n\n하룻밤 사이에 300년 왕조의 권위는 자금성 담장 안으로 줄어들었습니다. 어린 황제는 오늘도 대신들의 절을 받습니다. 궁 밖의 사람들은 이제 누구의 세금을 내고, 누구의 군대를 피해야 하는지를 묻습니다. 군벌천하가 열렸습니다."
 lr_world.102.a:0 "하늘 아래 황제는 없다."
 lr_world.103.t:0 "남미 대반란"
 lr_world.103.d:0 "본국에서 왕이 셋이 되자, 스페인령 아메리카의 크리오요들이 3세기 동안 기다린 순간이 왔습니다. 그들은 스페인인처럼 말하고 스페인인처럼 기도하지만, 높은 자리는 언제나 대서양을 건너온 사람들의 몫이었습니다. 볼리바르도 산마르틴도 태어나지 않은 이 세계에서, 그들은 처음으로 총을 들 이유와 기회를 함께 얻었습니다.\n\n10월 23일, 과달라하라의 시의회가 부왕의 이름을 공문서에서 지운 것이 신호였습니다. 며칠 사이 키토와 투쿠만, 아레키파, 산호세, 카라카스 교외, 아타카마의 광산촌에서 같은 일이 벌어졌습니다. 공화파는 대륙을 관통하는 전보선으로 소식을 나누지만, 서로 힘을 합칠 생각은 아직 없습니다. 멕시코의 혁명가는 리마의 혁명가를 만나 본 적도 없습니다.\n\n부왕들은 마드리드에 구원을 요청했습니다. 마드리드에서는 왕당파 전화 교환수가 전화를 받았고, 곧 포격 소리에 끊겼습니다. 이제 아메리카의 운명은 각자의 땅에서 각자의 총으로 결판납니다."
 lr_world.103.a:0 "볼리바르는 없지만, 시대가 왔다."
 lr_world.104.t:0 "제2차 대륙군"
 lr_world.104.d:0 "1776년 7월 4일, 필라델피아에 모인 식민지 대표들은 독립을 선언했습니다. 그리고 패배했습니다. 대륙군을 하나로 묶을 사람이 없었기 때문입니다. 서명자들은 교수대에 올랐고, 영국 귀족들은 그 뒤 한 세기 반 동안 이 땅을 총독부로 다스렸습니다. 교과서는 그 날을 필라델피아 소요 사건이라고 부릅니다.\n\n161년이 지난 오늘, 같은 건물에 다시 대표들이 모였습니다. 그들이 앞세운 사람은 버지니아의 지주 조지 워싱턴입니다. 영국군 식민지 장교로 대전쟁의 참호를 지켰고, 전공에도 불구하고 런던 귀족의 아들들에게 번번이 진급을 빼앗긴 사람입니다. 그가 말에 올라 대륙군 총사령관직을 받아들이자 인디펜던스 홀의 종이 다시 울렸습니다. 금이 간 그 종입니다.\n\n뉴욕의 부두에서, 피츠버그의 제철소에서, 디트로이트의 공장에서, 일리노이의 농장에서 사람들이 총을 들고 나옵니다. 총독부 군대의 절반이 그날 밤 탈영했습니다. 런던의 귀족 의회는 이 소식을 한 번은 이겼던 전쟁으로 여기지만, 그때 상대에게는 워싱턴이 없었습니다."
 lr_world.104.a:0 "두 번째 혁명이다."
 lr_world.105.t:0 "일본 유신"
 lr_world.105.d:0 "페리의 흑선이 우라가에 나타난 지 여든세 해가 지났습니다. 에도의 막부는 그때 개항했고, 번들에게 자리를 나눠 주며 지금까지 버텼습니다. 쇼군은 근대식 군함과 철도를 가졌지만 동시에 300개 가까운 번의 눈치를 봐야 합니다. 그 사이 교토의 천황은 한 번도 궁 밖에 나가 본 적이 없습니다.\n\n1월 3일, 교토 어소에서 칙서 한 장이 나왔습니다. 정권을 천황에게 돌려줄 것. 조슈와 사쓰마, 도사의 번사들은 이 종이를 기다리고 있었습니다. 간사이와 산요, 규슈, 시코쿠의 성에서 금기를 단 군대가 쏟아져 나옵니다. 그들은 일본 제국을 선포하고 도바와 후시미 쪽으로 진군을 시작했습니다.\n\n에도 성에서 쇼군은 칙서를 읽고 찢지 않았습니다. 그는 칙서를 정성껏 접어 넣고, 해군 함대를 오사카만으로 보냈습니다. 일본인이 일본인을 향해 근대식 포를 쏘는 것은 이번이 처음입니다. 조선과 청의 대사들은 조용히 본국에 전보를 칩니다. 바다 건너의 저 섬이 이제 어떤 나라가 될지는 아무도 모릅니다."
 lr_world.105.a:0 "존왕양이!"
 lr_world.106.t:0 "이탈리아 통일전쟁"
 lr_world.106.d:0 "빈 회의가 이탈리아를 지리적 표현이라고 부른 지 120년이 넘었습니다. 토리노의 사르데냐 왕, 로마의 교황, 피렌체의 대공, 나폴리의 부르봉 왕은 그동안 서로에게 지극히 예의 발랐습니다. 그리고 모두가 자기 이름으로 이탈리아를 통일하는 꿈을 꾸었습니다.\n\n7월 7일, 토스카나 국경의 세관 분쟁에서 총성이 울렸습니다. 사소한 일이었습니다. 그런데 네 나라의 군대는 놀라울 만큼 잘 준비되어 있었습니다. 저녁이 되기 전 네 수도에서 선전포고문이 동시에 나왔습니다. 교황은 파문장을 쓰고, 사르데냐는 대포를 끌어 오며, 나폴리는 파리의 사촌에게 편지를 보냅니다.\n\n밀라노 성벽 위의 오스트리아 장교들은 쌍안경을 내리고 웃었습니다. 그들은 이 싸움에 끼어들 생각이 없습니다. 끝나면 지친 승자 하나만 상대하면 되니까요. 알프스 아래의 왕은 곧 한 명만 남을 것입니다."
 lr_world.106.a:0 "이탈리아는 누구의 것인가."
 lr_world.108.t:0 "제국연맹"
 lr_world.108.d:0 "1937년 새해 첫날, 런던 화이트홀의 연회장에 대전쟁의 승전국 대표들이 모였습니다. 영국 귀족 공화국의 의장, 빈의 황제가 보낸 대공, 북독일 연방의 재상, 뮌헨의 왕이 보낸 외무대신, 그리고 러시아에서 떨어져 나온 키예프와 민스크, 발트와 캅카스의 왕국들의 사절입니다. 스무 해 전 베르사유에서 프랑스와 러시아를 무릎 꿇린 사람들의 아들들입니다.\n\n그들은 오래 이야기하지 않았습니다. 파리의 동원 계획과 페테르부르크의 철도 공사에 관한 보고서는 모두가 이미 읽었습니다. 조약문은 한 장이고, 한 나라가 공격받으면 모두가 공격받은 것으로 본다는 내용입니다. 신문들은 그날 밤 이 동맹에 이름을 붙였습니다. 제국연맹.\n\n파리에서는 아무도 놀라지 않았습니다. 다만 참모본부의 지도 위에 핀이 몇 개 더 꽂혔을 뿐입니다. 그리고 그날 오후, 러시아 대사관의 불이 밤늦게까지 꺼지지 않았습니다."
 lr_world.108.a:0 "왕관들의 동맹이 다시 모였다."
 lr_world.109.t:0 "겨울 전쟁"
 lr_world.109.d:0 "11월 30일 새벽, 러시아 공화국 포병이 카렐리야 지협에 불을 뿜었습니다. 케렌스키는 의회에서 이 전쟁을 해방이라고 불렀습니다. 대전쟁 뒤 독립한 핀란드 왕국은 차르의 대공국이었던 시절로 돌아가야 한다고 그는 말했습니다.\n\n헬싱키의 왕은 답장 대신 동원령을 내렸습니다. 숲과 호수의 나라는 스키를 탄 병사들로 가득합니다. 페테르부르크의 장군들은 크리스마스 전에 끝난다고 장담합니다. 핀란드의 겨울은 아직 시작되지도 않았습니다."
 lr_world.109.a:0 "핀란드는 다시 러시아의 것이 되어야 한다."
 lr_world.115.t:0 "발칸의 승리"
 lr_world.115.d:0 "빈이 무너졌습니다. 베오그라드에서 온 왕은 자그레브와 류블랴나, 사라예보를 지나며 환호를 받았고, 남슬라브의 나라 유고슬라비아를 선포했습니다. 부쿠레슈티에서는 트란실바니아와 부코비나가 돌아온 대루마니아의 깃발이 올랐습니다.\n\n아테네에는 패전국들의 배상금이 쏟아져 들어옵니다. 소피아는 페테르부르크의 손에 넘어갔습니다. 발칸 조약은 할 일을 다 했습니다. 세 왕은 조약문을 불태우며 건배했습니다. 서로의 새 국경선을 의심하는 일은 내일로 미뤘습니다."
 lr_world.115.a:0 "남슬라브와 루마니아의 꿈이 이루어졌다."
 lr_world.110.t:0 "이탈리아의 통일"
 lr_world.110.d:0 "마지막 경쟁자의 군대가 항복했습니다. 서로마 제국이 무너진 뒤로 처음으로, 알프스 아래 대부분의 땅이 한 왕의 깃발 아래 들어왔습니다. 로마에서 울리는 종소리는 멀리 시칠리아까지 이어졌습니다.\n\n새 왕은 대성당의 발코니에 서서 이탈리아의 이름을 불렀습니다. 그러나 군중이 환호를 멈추자 왕의 시선은 북쪽으로 향했습니다. 롬바르디아와 베네토, 밀라노의 대성당과 베네치아의 운하는 아직 오스트리아 황제의 땅입니다. 전쟁을 구경하던 빈의 장교들은 이제 쌍안경을 내려놓고 지도를 펼칩니다."
 lr_world.110.a:0 "다음은 밀라노다."
 lr_world.107.t:0 "발칸 조약"
 lr_world.107.d:0 "대전쟁의 승리는 불가리아에 너무 많은 것을 주었습니다. 소피아의 차르는 세르비아 남부와 마케도니아, 트라키아, 도브루자까지 차지하고 대불가리아를 선포했습니다. 그 뒤 스무 해 동안 베오그라드와 아테네와 부쿠레슈티의 학교에서는 아이들에게 같은 지도를 그리게 했습니다. 빼앗긴 땅이 빨갛게 칠해진 지도입니다.\n\n6월 23일, 코르푸 항에 정박한 그리스 왕실 요트에서 세 나라 대표가 조약에 서명했습니다. 발칸 조약입니다. 서로 믿지도 않고 좋아하지도 않는 세 왕이 처음으로 같은 문서에 이름을 적었습니다. 조약에는 공격 대상이 단 한 나라만 적혀 있습니다. 다음 날 아침 세 나라의 군대가 동시에 국경을 넘었습니다.\n\n소피아는 놀라지 않았습니다. 불가리아 참모본부에는 오래전부터 이 전쟁을 위한 계획이 있었고, 불가리아 군대는 대전쟁에서 이긴 군대입니다. 차르는 발코니에 나와 짧게 말했습니다. 한 번 빼앗은 땅은 두 번 돌려주지 않는다. 그리고 빈과 이스탄불은 어느 쪽 편도 들지 않고 전쟁이 어디까지 번지는지 지켜봅니다."
 lr_world.107.a:0 "대불가리아에 맞선 세 왕."
 lr_world.111.t:0 "코르푸 강화"
 lr_world.111.d:0 "소피아에 세르비아와 그리스, 루마니아의 깃발이 함께 올랐습니다. 차르는 왕궁 뒷문으로 빠져나갔고, 대불가리아는 스무 해 만에 끝났습니다. 대표들은 코르푸로 돌아와 강화 조약을 적었습니다. 빼앗겼던 땅이 빨갛게 칠해진 그 지도를 펼쳐 놓고서 말입니다.\n\n도브루자 전역은 루마니아로, 세르비아 남부와 마케도니아, 데바르는 세르비아로, 트라키아와 중앙 마케도니아는 그리스로 돌아갑니다. 불가리아에는 소피아와 발칸 산맥이 남았습니다. 조약에 서명한 세 왕은 건배를 나눕니다. 그리고 서로의 새 국경선을 벌써 의심스럽게 살핍니다."
 lr_world.111.a:0 "대불가리아는 끝났다."
 lr_world.112.t:0 "세르비아의 항복"
 lr_world.112.d:0 "베오그라드 궁전에 불가리아 군기가 걸렸습니다. 세르비아 왕은 소피아로 불려 가 무릎 꿇은 채 조약에 서명했습니다. 세르비아는 이제 차르의 허락 없이 외교관 한 명도 보낼 수 없습니다.\n\n몬테네그로의 산악민들은 이 소식을 듣고 체티녜 언덕에 모여 독립을 선언했습니다. 세르비아에는 그들을 막을 힘이 없었습니다. 코소보 벌판의 옛 무덤들 위로 불가리아 순찰대가 지나갑니다. 500년 전의 패배를 노래하던 사람들에게는 새 노래가 필요해졌습니다."
 lr_world.112.a:0 "발칸은 소피아의 것이다."
 lr_world.113.t:0 "루마니아의 분할"
 lr_world.113.d:0 "부쿠레슈티가 함락되자 루마니아 왕국은 스스로의 이음새를 따라 갈라졌습니다. 60여 년 전 하나로 합쳐졌던 두 공국이 불가리아 군대의 손에서 다시 둘이 되었습니다. 카르파티아 동쪽의 몰다비아는 이아시에서 새 정부를 세웠고, 왈라키아는 부쿠레슈티에 남았습니다.\n\n도나우강의 곡물은 여전히 흑해로 흘러가지만, 세관원의 제복은 달라졌습니다. 왕은 망명을 택했고, 차르는 두 공국의 대공을 직접 골랐습니다. 세계에서 가장 어린 왕국 하나가 이렇게 지도에서 사라졌습니다."
 lr_world.113.a:0 "두 공국으로 돌아갔다."
 lr_world.114.t:0 "그리스의 섬들"
 lr_world.114.d:0 "아테네가 강화를 청하자, 소피아보다 먼저 이스탄불에서 사절이 왔습니다. 오스만 제국은 이 전쟁에서 총 한 발 쏘지 않았습니다. 그러나 함대는 이미 에게해에 나와 있었고, 불가리아 차르는 오랜 동맹에게 내줄 수 있는 땅이 어디인지 잘 알고 있었습니다.\n\n크레타와 에게해의 섬들이 다시 오스만의 땅이 되었습니다. 사모스의 어부들은 익숙한 깃발을 보고 욕을 삼킵니다. 아테네의 아크로폴리스에서는 왕의 그리스 대사가 영국 공사에게 작은 목소리로 묻습니다. 런던은 정말 아무것도 하지 않을 생각입니까."
 lr_world.114.a:0 "에게해는 다시 오스만의 바다다."
 lr_world.92.t:0 "프랑스의 땅이 되다"
 lr_world.92.d:0 "[FROM.GetName]이(가) 항복했다.\n\n프랑스 군대가 수도의 관공서마다 삼색기를 내걸었고, 강화 조약은 단 한 장이다. 이 땅은 이제 프랑스의 도가 된다. 도지사가 파리에서 기차를 타고 오고, 법전과 학교와 징병 명부가 그 뒤를 따를 것이다.\n\n저항을 준비하던 사람들은 짐을 싸서 산으로 간다. 상인들은 벌써 프랑의 환율을 묻는다. 그리고 대부분의 사람들은, 늘 그랬듯, 내일 아침에도 일하러 간다."
 lr_world.92.a:0 "이 땅을 프랑스의 도로 편입한다."
 lr_world.93.t:0 "프랑스의 평화"
 lr_world.93.d:0 "[FROM.GetName]이(가) 항복했다.\n\n사절단이 모자를 벗고 조약문을 받아 든다. 국기도 남고 왕도 남는다. 의회도, 화폐도, 우표도 그대로다. 다만 외교와 군대는 앞으로 파리의 뜻을 따라야 하고, 수도에는 프랑스 대사가 아니라 프랑스 총독이 상주한다.\n\n사절단장은 서명을 마치고 펜을 내려놓으며 중얼거린다. 프랑스의 평화란 이런 것이군."
 lr_world.93.a:0 "보호 조약에 서명하게 한다."
 lr_world.94.t:0 "페테르부르크 조약"
 lr_world.94.d:0 "러시아 공화국이 항복했다.\n\n케렌스키의 사절단은 조약문을 처음부터 끝까지 두 번 읽고 나서야 펜을 들었다. 러시아는 1936년의 국경으로 돌아간다. 그 뒤로 얻은 땅은 모두 원래 주인에게 돌아가고, 군대는 감축되며, 프랑스 감독관이 페테르부르크에 상주한다.\n\n공화국은 살아남는다. 그러나 더는 자라지 못할 것이다."
 lr_world.94.a:0 "러시아의 국경은 여기까지다."
 lr_america.2.t:0 "총독부의 몰락"
 lr_america.2.d:0 "총독이 항복 문서에 서명한 곳은 그의 집무실이 아니라 어느 농가의 부엌이었다. 워싱턴 장군은 그에게 칼을 돌려주었고, 식탁에 놓인 커피는 식어 갔다. 그렇게 영국령 북아메리카는 끝났다. 대서양 연안에서 태평양까지, 대륙 회의의 깃발이 걸린 시청에 이제 사람들이 몰려든다. 미합중국의 이름이 처음으로 관보에 찍혔다.\n\n그러나 전쟁은 끝나지 않았다. 영국 함대는 여전히 항구 앞에 있고, 국경 너머 캐나다에는 왕당파 망명자들이 줄지어 넘어가고 있다. 참모들은 북쪽 지도를 펼친다. 지금이라면 몬트리올까지 진격할 수 있다. 재무장관은 다른 지도를 내민다. 전쟁 공채가 이미 바닥났다.\n\n런던에서 비밀 전문이 도착했다. 강화할 뜻이 있다는 내용이다. 워싱턴은 전문을 접어 주머니에 넣고 오랫동안 창밖의 농장을 바라본다. 그의 군대는 지쳤고, 또 그를 믿고 있다."
 lr_america.3.t:0 "대륙의 주인"
 lr_america.3.d:0 "오타와 의사당에 성조기가 올랐다. 퀘벡의 프랑스어 신문들은 영국 국기가 내려가는 것을 전혀 슬퍼하지 않았고, 토론토의 왕당파들은 조용히 짐을 싸다. 세인트존스의 영국 수비대도 뉴펀들랜드에서 철수하겠다고 통보해 왔다.\n\n런던은 마침내 협상 대표를 보내왔다. 그는 나이 많은 귀족으로, 젊은 시절 미합중국이라는 이름이 농담이던 시절을 기억한다. 대표단은 필라델피아의 같은 방에 앉았다. 북아메리카에는 이제 영국 깃발이 없다. 미국 대표는 지도를 펼치고, 한 줄도 양보하지 않겠다고 말한다."
 lr_america.3.a:0 "전쟁을 끝낸다."
 lr_america.100.t:0 "파리 조약 재협상"
 lr_america.100.d:0 "두 번째 파리 조약이 아니라 첫 번째 필라델피아 조약이다. 영국 대표단은 그 이름에 항의했지만 받아들여지지 않았다. 런던은 13개 식민지와 옛 총독부 영토 전역을 포기했고, 대륙군은 캐나다 국경에서 총을 내렸다.\n\n조지 워싱턴은 군중 앞에서 칼을 풀었다. 그가 이 나라의 첫 번째 지도자가 될 것을 의심하는 사람은 없다. 유럽의 왕들은 이 공화국이 어떤 전염병이 될지 걱정하고, 그들의 신민들은 대서양 건너의 이 소식을 벌써 술집에서 이야기한다."
 lr_america.100.a:0 "새로운 나라가 태어났다."
 lr_america.101.t:0 "북아메리카 강화"
 lr_america.101.d:0 "캐나다와 뉴펀들랜드까지 미합중국에 넘어간 채 영국과의 전쟁이 끝났다. 영국 귀족 공화국은 200년 동안 쌓은 북아메리카의 모든 땅을 잃었다. 조약에 서명한 영국 대표는 필라델피아에서 돌아오는 배 안에서 사직서를 썼다.\n\n알래스카에서 플로리다까지, 북아메리카는 이제 한 깃발 아래 있다. 왕들의 유럽은 처음으로 대서양 저쪽을 두려워한다. 워싱턴은 군대를 해산하겠다고 공언했다. 왕과 황제들 가운데 그 말을 믿는 사람은 아무도 없다."
 lr_america.101.a:0 "북아메리카는 하나다."
 lr_america.2.a:0 "캐나다 국경에서 멈추고 강화한다."
 lr_america.2.b:0 "캐나다까지 해방한다. 대륙에 왕의 깃발은 남기지 않는다."
 LR_tt_cna_peace:0 "옛 총독부의 영토를 모두 갖고 영국과 §Y백색 평화§!를 맺습니다."
 LR_tt_cna_canada:0 "전쟁을 계속합니다. §Y캐나다§!가 항복하면 캐나다와 뉴펀들랜드를 차지하고 강제로 평화를 맺습니다."
 LR_GRE_reparations:0 "막대한 배상금"
 LR_GRE_reparations_desc:0 "패전국들이 아테네로 금을 실어 보냅니다. 그리스는 백 년 만에 처음으로 빚 없이 미래를 계획합니다."
 LR_CNA_continental_army:0 "제2차 대륙군"
 LR_CNA_continental_army_desc:0 "두 번째 독립 전쟁입니다. 농부와 공장 노동자가 같은 깃발 아래 모였고, 워싱턴은 이들을 하나의 군대로 묶었습니다. 이 군대는 숫자 이상의 힘으로 싸웁니다."
 LR_FRA_volunteers_category:0 "내전 의용병"
 LR_FRA_volunteers_category_desc:0 "다른 나라의 내전에 프랑스 의용 사단을 보냅니다. 사단 하나에 인력 8000과 소총 1000정이 들고, 한 나라에 최대 6개 사단까지 보낼 수 있습니다. 그 나라와 프랑스가 서로 싸우고 있으면 보낼 수 없습니다."
