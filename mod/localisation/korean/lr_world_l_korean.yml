 lr_gnews.1.t:0 "프랑스 혁명"
 lr_gnews.1.d:0 "파리에서 왕정이 무너졌습니다. 알제리 원정의 전비와 전사자 명단에 지친 시민들이 거리로 쏟아졌고, 군대는 발포를 거부했습니다. 루이 20세는 수도를 빠져나갔습니다.\n\n런던의 신문들은 1면에 바리케이드 사진을 실었습니다. 생탕투안 거리의 바리케이드 위에서 병사 하나가 소총을 거꾸로 들고 서 있는 사진입니다. 그 사진은 일주일 만에 유럽의 모든 공장 담벼락에 붙었습니다.\n\n150년 전 실패한 혁명이 돌아왔다는 소식에 유럽의 궁정들이 긴급 회의를 소집했습니다. 빈의 황제는 국경 경비를 두 배로 늘리라고 명령했습니다."
 lr_gnews.1.a:0 "왕들의 유럽이 흔들린다."
 lr_gnews.2.t:0 "복수의 왕"
 lr_gnews.2.d:0 "파리에서 쿠데타가 일어났습니다. 프랑스 군부가 알제리를 포기한 루이 20세를 몰아내고 오를레앙 공 장을 새 왕으로 세웠습니다.\n\n새 왕은 즉위 첫날 군 앞에서 맹세했습니다. 대전쟁에서 빼앗긴 모든 것을 되찾겠다고. 샹젤리제의 군중은 복수의 왕이라 외쳤습니다.\n\n런던과 베를린의 외교관들은 그날 밤 강화 조약의 군비 제한 조항을 다시 꺼내 읽었습니다. 빈의 신문은 짧게 썼습니다. 프랑스가 다시 칼을 쥐었다."
 lr_gnews.2.a:0 "프랑스가 칼을 간다."
 lr_gnews.3.t:0 "부르봉 왕가, 왕좌를 지키다"
 lr_gnews.3.d:0 "튈르리 궁 앞의 대치가 왕의 승리로 끝났습니다. 반란 장교들은 체포되었고, 오를레앙 공은 국경을 넘어 달아났습니다.\n\n튈르리 궁 앞 광장의 핏자국은 하루 만에 지워졌습니다. 그러나 철문에 박힌 총알 자국은 그대로 남았습니다. 왕은 그것을 메우지 말라고 명령했습니다. 반역의 대가를 모두가 보도록.\n\n늙은 루이 20세는 대관식을 다시 치르겠다고 발표했습니다. 유럽의 왕실들은 안도의 한숨을 쉬면서도, 프랑스 군대가 왕을 한 번 버렸다는 사실을 잊지 않습니다."
 lr_gnews.3.a:0 "왕관은 무사했다."
 lr_gnews.4.t:0 "파리 코뮌 선포"
 lr_gnews.4.d:0 "프랑스 총선에서 사회주의 세력이 승리했습니다. 파리 시청에 붉은 깃발이 올랐고, 새 정부는 스스로를 코뮌이라 부릅니다. 1871년 72일 만에 짓밟혔던 그 이름입니다.\n\n공장은 노동자 평의회에, 은행은 국가에 넘어갔습니다. 러시아 공화국의 신문들은 환영 사설을 실었습니다.\n\n유럽 각국의 경찰은 그날부터 자국 노동조합의 전보를 검열하기 시작했습니다. 베를린의 한 장관은 이렇게 말했다고 합니다. 이번에는 72일로 끝나지 않을 것이다."
 lr_gnews.4.a:0 "붉은 깃발이 파리에 올랐다."
 lr_gnews.5.t:0 "프랑스 공화국 출범"
 lr_gnews.5.d:0 "프랑스 역사상 처음으로 보통선거로 뽑힌 의회가 내각을 구성했습니다. 왕도 황제도 없는 프랑스가 유럽 한가운데 들어섰습니다. 1792년에 선포되었다가 10년도 못 가 무너진 공화국이 백사십 년 만에 돌아왔습니다.\n\n영국은 정중한 축전을 보냈고, 대륙의 군주들은 침묵했습니다.\n\n그 침묵이 무엇을 뜻하는지 모르는 사람은 없습니다. 빈과 베를린의 왕궁에서는 그날 밤 늦게까지 불이 꺼지지 않았습니다."
 lr_gnews.5.a:0 "공화국 만세!"
 lr_gnews.6.t:0 "황제 나폴레옹"
 lr_gnews.6.d:0 "노트르담 대성당에서 나폴레옹 보나파르트가 스스로 황제의 관을 썼습니다. 교황 사절이 지켜보는 가운데, 그는 관을 사제에게서 받지 않고 자기 손으로 들어 올렸습니다.\n\n대관식 날 파리의 모든 성당이 종을 울렸습니다. 대성당 밖 광장에는 알제리에서 함께 돌아온 고참병들이 맨 앞줄에 섰습니다. 그들은 황제가 지나갈 때 모자를 벗지 않고 흔들었습니다.\n\n몇 달 전만 해도 아무도 몰랐던 코르시카의 포병 장교가 이제 프랑스 제국의 황제입니다. 유럽의 왕들은 같은 질문을 합니다. 그는 어디서 멈출 것인가."
 lr_gnews.6.a:0 "제국이 돌아왔다."
 lr_gnews.7.t:0 "프랑스, 북독일에 선전포고"
 lr_gnews.7.d:0 "프랑스가 북독일 연방에 선전포고했습니다. 파리 주재 북독일 대사는 오늘 오전 외무부에서 선전포고문을 전달받은 뒤 곧바로 동역으로 향한 것으로 알려졌습니다.\n\n프랑스 정부는 1918년 강화 조약의 군비 제한 조항을 더는 인정하지 않는다고 밝혔습니다. 알자스 국경 지대에서는 프랑스군의 대규모 이동이 목격되고 있으며, 스트라스부르 시청은 민간인 대피 계획을 발표했습니다. 라인강 다리 세 곳은 이미 통행이 막혔습니다.\n\n베를린은 제국연맹 회원국들에 조약 이행을 요구했습니다. 빈은 긴급 각료 회의를 소집했고, 런던은 아직 공식 입장을 내놓지 않았습니다."
 lr_gnews.7.a:0 "또 라인강인가."
 lr_gnews.8.t:0 "프랑스, 오스트리아에 선전포고"
 lr_gnews.8.d:0 "프랑스가 합스부르크 제국에 선전포고했습니다. 프랑스와 합스부르크, 그리고 혁명과 제국의 오래된 싸움이 다시 시작되었습니다.\n\n빈은 즉각 총동원령을 내렸습니다. 제국의 열한 개 민족이 같은 소집 영장을 받았습니다. 그러나 프라하와 자그레브와 렘베르크의 민족 지도자들은 영장 대신 신문을 펼쳐 들고 이 전쟁의 결과를 숨죽여 지켜봅니다.\n\n제국이 진다면, 그들에게는 처음으로 기회가 올 것입니다."
 lr_gnews.8.a:0 "도나우에 전운이 돈다."
 lr_gnews.9.t:0 "프랑스, 영국에 선전포고"
 lr_gnews.9.d:0 "프랑스가 해협 건너 영국에 선전포고했습니다. 백년전쟁 이래 한 번도 제대로 끝난 적 없는 싸움입니다.\n\n런던 증권거래소는 개장과 동시에 거래를 멈췄고, 영연방 각지에 동원 전보가 날아갔습니다. 본국 함대가 해협에 집결하고, 도버의 해안포가 덮개를 벗었습니다.\n\n런던 시민들은 지하철역에 담요를 깔기 시작했습니다. 칼레의 어부들은 맑은 밤이면 해협 건너편에서 탐조등 불빛이 춤추는 것을 봅니다."
 lr_gnews.9.a:0 "해협이 불탄다."
 lr_gnews.10.t:0 "프랑스, 러시아에 선전포고"
 lr_gnews.10.d:0 "프랑스가 러시아 공화국에 선전포고했습니다. 대전쟁에서 함께 싸우고 함께 졌던 옛 동맹국끼리의 전쟁입니다.\n\n케렌스키는 두마의 연단에서 프랑스의 배신을 규탄했습니다. 러시아의 국민이 프랑스를 위해 피를 흘린 것을 잊었느냐고. 그 연설은 사십 분 동안 이어졌습니다.\n\n신문들은 동쪽의 겨울이 이 전쟁의 운명을 정할 것이라고 씁니다. 그 겨울은 지금까지 단 한 번도 침략자의 편을 든 적이 없습니다."
 lr_gnews.10.a:0 "옛 동맹이 적이 되었다."
 lr_gnews.11.t:0 "프랑스의 항복"
 lr_gnews.11.d:0 "프랑스가 다시 항복했습니다. 파리의 관공서에는 승전국의 깃발이 걸렸고, 프랑스의 새 정부는 승전국의 뜻에 따라 구성됩니다.\n\n파리 개선문 아래로 승전국의 군대가 행진했습니다. 샹젤리제의 상점들은 셔터를 내렸고, 거리에는 구경꾼이 거의 없었습니다. 행진은 예정보다 20분 일찍 끝났습니다.\n\n전쟁으로 얻은 땅은 모두 원래 주인에게 돌아가고, 식민지는 프랑스의 손을 떠났습니다. 두 번의 패배를 겪은 나라가 다시 일어설 수 있을지 묻는 사람이 많습니다."
 lr_gnews.11.a:0 "프랑스의 시대는 끝났는가."
 lr_gnews.12.t:0 "러시아의 항복"
 lr_gnews.12.d:0 "러시아 공화국이 프랑스에 항복했습니다. 페테르부르크 조약에 따라 러시아는 1936년의 국경으로 돌아갑니다.\n\n케렌스키 정부는 살아남았습니다. 공화국도 살아남았습니다. 다만 그 뒤에 얻은 땅은 모두 원래 주인에게 돌아갔고, 러시아군은 앞으로 프랑스 감독관의 눈 아래에서만 움직일 수 있습니다.\n\n동쪽의 거인은 살아남았지만 다시는 서쪽으로 자라지 못할 것입니다. 국경 너머의 작은 나라들은 오랜만에 깊이 잠들 수 있게 되었습니다."
 lr_gnews.12.a:0 "러시아의 국경은 거기까지다."
 lr_gnews.13.t:0 "프랑스의 새 정복지"
 lr_gnews.13.d:0 "[FROM.GetName]이(가) 프랑스에 항복했습니다.\n\n수도의 관공서마다 삼색기가 내걸렸고, 프랑스 헌병대가 중앙역과 방송국을 접수했습니다. 의회는 해산되었고, 이 나라의 운명은 이제 파리의 외무부 회의실에서 정해집니다.\n\n유럽의 지도가 또 한 번 바뀌었습니다. 각국 외무부에서는 지도를 다시 펼치고 같은 질문을 던집니다. 다음 차례는 어디인가."
 lr_gnews.13.a:0 "프랑스의 깃발이 또 한 수도에."
 lr_gnews.14.t:0 "러시아의 귀환"
 lr_gnews.14.d:0 "[FROM.GetName]이(가) 러시아 공화국에 항복했습니다. 대전쟁 뒤 러시아에서 떨어져 나왔던 이 나라는 다시 러시아의 일부가 되었습니다.\n\n러시아군이 국경을 넘던 날, 그 나라의 수도에서는 두 개의 집회가 동시에 열렸습니다. 하나는 러시아 국기를, 하나는 검은 상장을 들었습니다. 두 집회 사이에는 기병대가 서 있었습니다.\n\n페테르부르크는 이것을 해방이라 부르고, 망명객들은 점령이라 부릅니다. 어느 쪽이든 러시아의 국경은 다시 서쪽으로 움직이고 있습니다."
 lr_gnews.14.a:0 "러시아가 잃은 땅을 되찾는다."
 lr_gnews.15.t:0 "스페인 내전 종결"
 lr_gnews.15.d:0 "스페인 내전이 끝났습니다. 마지막 경쟁자가 무너지면서 [FROM.GetName]이(가) 이베리아 반도의 유일한 주인이 되었습니다.\n\n마드리드의 왕궁 앞 광장에서 승자의 군대가 열병식을 합니다. 그 광장의 절반은 아직 포격으로 무너진 채입니다. 시민들은 폐허 사이에 서서 행진을 지켜봅니다.\n\n마드리드의 거리는 폐허지만, 대서양 너머 옛 부왕령들은 이미 스페인의 손을 떠났습니다. 승자는 무너진 제국의 잔해 위에서 새 나라를 세워야 합니다."
 lr_gnews.15.a:0 "피레네 너머에 평화가 왔다."
 lr_gnews.16.t:0 "일본 유신의 결말"
 lr_gnews.16.d:0 "일본의 내전이 끝났습니다. [FROM.GetName]이(가) 마지막 저항을 꺾고 일본 열도를 하나로 묶었습니다.\n\n에도의 쇼군과 교토의 천황, 누가 일본의 주인인가. 수백 년 동안 이어진 그 질문에 마침내 대포가 답했습니다. 오사카 성 위에 새 깃발이 올랐고, 패자들의 칼은 바다에 버려졌습니다.\n\n조선과 청나라는 바다 건너의 이웃이 이제 어떤 나라가 될지 지켜봅니다. 하나가 된 일본은 늘 바다 밖을 바라보았습니다."
 lr_gnews.16.a:0 "열도에 한 사람의 주인이 섰다."
 lr_gnews.17.t:0 "대불가리아, 발칸의 패자"
 lr_gnews.17.d:0 "불가리아가 발칸 조약의 세 나라를 모두 꺾었습니다. 세르비아는 괴뢰국이 되었고, 루마니아는 둘로 갈라졌으며, 그리스는 에게해의 섬들을 잃었습니다.\n\n소피아에서는 사흘 동안 축포가 울렸습니다. 산스테파노 조약에서 약속받았다가 빼앗긴 대불가리아가 반세기 만에 지도 위에 그려졌습니다.\n\n소피아의 차르는 이제 도전받지 않는 발칸의 주인입니다. 그는 강대국들의 다음 전쟁에서 어느 편도 들지 않겠다고 선언했습니다. 아무도 그 말을 믿지 않습니다."
 lr_gnews.17.a:0 "발칸은 소피아의 것이다."
 lr_gnews.20.t:0 "붉은 나폴레옹"
 lr_gnews.20.d:0 "프랑스의 제1통령 나폴레옹 보나파르트가 원로원이 바친 왕관을 거절하고 노동자 평의회의 손을 잡았습니다. 튈르리 궁에는 삼색기와 붉은 깃발이 나란히 걸렸고, 통령은 스스로를 인민의 통령이라 부릅니다.\n\n튈르리 궁 정원의 노동자들은 통령이 연설을 마치자 작업모를 하늘로 던졌습니다. 그 사진이 베를린과 빈의 신문에 실렸을 때, 사진 설명에는 단 한 단어가 붙었습니다. 위험.\n\n유럽의 왕실은 공포에 빠졌습니다. 혁명이 포병 장교를 얻었다는 것, 그것이 그들이 150년 동안 가장 두려워한 일이었습니다."
 lr_gnews.20.a:0 "대포를 든 혁명이다."
 lr_gnews.21.t:0 "파리 해방"
 lr_gnews.21.d:0 "점령 2년 만에 파리가 일어섰습니다. 엿새 동안의 시가전 끝에 점령군 사령관이 항복했고, 승전국은 프랑스의 독립을 인정했습니다.\n\n해방 다음 날 아침, 파리의 빵집들이 2년 만에 처음으로 하얀 빵을 구웠습니다. 빵집 앞의 줄은 블록 끝까지 이어졌지만, 아무도 불평하지 않았습니다.\n\n두 번의 패전을 겪은 나라가 스스로의 힘으로 다시 일어섰다는 소식에, 유럽 각지의 점령지와 괴뢰국에서 같은 꿈을 꾸는 사람들이 늘고 있습니다."
 lr_gnews.21.a:0 "파리는 스스로 해방되었다."
 lr_gnews.18.t:0 "원수의 쿠데타"
 lr_gnews.18.d:0 "프랑스 정부가 무너졌습니다. 전국의 반발을 다스리지 못한 내각을 대신해 여든 살의 필리프 페탱 원수가 전권을 쥐었습니다. 의회는 무기한 휴회했고, 새 국가의 이름은 프랑스국입니다.\n\n원수가 처음으로 라디오 연설을 한 날, 파리의 카페마다 라디오 앞에 사람들이 모였습니다. 늙은 목소리는 떨렸지만 단어 하나하나가 또렷했습니다. 연설이 끝나자 카페 주인 몇몇은 라디오를 껐고, 몇몇은 박수를 쳤습니다.\n\n유럽의 궁정들은 안도와 경계를 함께 느낍니다. 혁명보다는 낫다는 사람도 있고, 늙은 원수가 오래가지 못할 것이라는 사람도 있습니다."
 lr_gnews.18.a:0 "질서가 돌아왔다."
 lr_gnews.19.t:0 "국가 없는 프랑스"
 lr_gnews.19.d:0 "프랑스 사회주의자들의 대회가 중앙위원회 대신 코뮌과 조합의 자유 연합을 택했습니다. 파리 시청에는 검은색과 붉은색으로 나뉜 깃발이 올랐고, 도지사들은 집으로 돌아갔습니다.\n\n파리 시청 앞 광장에서 도지사의 관인이 녹여져 메달이 되었습니다. 메달에는 단 한 단어가 새겨졌습니다. 연합. 그날 광장에 온 사람들은 모두 하나씩 받아 갔습니다.\n\n유럽의 신문들은 석 달 안에 무너질 것이라고 씁니다. 바르셀로나와 카라라의 노동자들은 다른 생각을 하고 있습니다."
 lr_gnews.19.a:0 "왕도 신도 주인도 없다."
