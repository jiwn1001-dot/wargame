l_korean:
 GATHERING_STORM_NAME:0 "늦게 온 혁명"
 GATHERING_STORM_DESC:0 "1918년, 프랑스와 러시아는 대전쟁에서 졌습니다. 영국과 오스트리아와 오스만이 유럽의 질서를 정했고, 러시아는 혁명으로 공화국이 되었습니다. 스무 해가 지난 지금, 패전국 프랑스에서 늙은 왕의 권위가 흔들리고 있습니다."
 FRA_GATHERING_STORM_DESC:0 "1918년, 프랑스는 콩피에뉴 숲에서 항복했습니다. 식민지를 잃었고, 장군들을 두려워한 왕실은 군대를 굶겼습니다.\n\n1936년, 늙은 루이 20세가 알제리 반란을 진압하려 다시 군대를 보냅니다. 원정이 실패하면 왕좌도 흔들립니다. 장교단, 파리의 노동자들, 그리고 이름 없는 코르시카의 포병 대위가 그날을 기다립니다."
