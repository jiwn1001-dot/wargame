l_korean:
 LR_FRA_parliament_category:0 "국민의회"
 LR_FRA_parliament_category_desc:0 "제3공화국 시절처럼 정권의 운명은 의석 수에 달려 있습니다. 야당은 매달 세력을 넓힙니다. 여당 의석이 많을수록, 안정도가 50% 아래일수록 더 빠르게 잃습니다. 정치력을 들여 유세와 연립으로 의석을 계속 다시 확보해야 입법 중점을 진행할 수 있습니다."
 LR_FRA_development_category:0 "경제 재건"
 LR_FRA_development_category_desc:0 "패전국을 다시 일으키는 모든 공사가 여기 있습니다. §Y공업 지구§!와 §Y철도§!, §Y도로§!는 자금을 들여 짓고, §Y임무§!는 조건을 채우면 공짜로 완공됩니다. 완공될 때마다 경제 재건 지수가 오릅니다.\n\n자금은 경제·내정 중점과 파리 클럽의 카드 테이블에서 얻습니다. 급할 때는 전쟁 채권과 외국 차관으로 정치력을 끌어올 수 있습니다."
 LR_FRA_resistance_category:0 "지방 정세"
 LR_FRA_resistance_category_desc:0 "지역별 반발도입니다. 매달 오르며 해당 지역 주의 공장, 자원, 인력을 깎습니다. 100이 되면 봉기가 일어납니다. 진압과 회유는 그 지역 주의 페널티도 바로 줄입니다."
 LR_dec_campaign:0 "지방 순회 유세"
 LR_dec_campaign_desc:0 "의원들을 고향 선거구로 내려보냅니다. 의석 +30."
 LR_dec_coalition:0 "급진공화파와 연립"
 LR_dec_coalition_desc:0 "제3공화국의 오랜 방식대로 자리를 나눠 연립을 꾸립니다. 의석 +60, 안정도 소폭 하락."
 LR_dec_unions:0 "노동총동맹 동원"
 LR_dec_unions_desc:0 "노동총동맹(CGT)의 조직표를 산악파로 모읍니다. 의석 +48."
 LR_dec_bankers:0 "리옹 상공회의소 후원"
 LR_dec_bankers_desc:0 "리옹과 보르도의 상공인들이 지롱드에 선거 자금을 댑니다. 의석 +48."
 LR_dec_notables:0 "지방 명사 포섭"
 LR_dec_notables_desc:0 "옛 귀족과 지방 명사들을 푀양파 명부에 올립니다. 의석 +48."
 LR_dec_republican_union:0 "공화국 연합 결성"
 LR_dec_republican_union_desc:0 "대통령 지지 세력을 하나로 묶습니다. 의석 +48."
